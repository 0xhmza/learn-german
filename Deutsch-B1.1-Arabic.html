`Ruf vorher an, andernfalls ist niemand da`؟","إذا لم تتصل مسبقًا، فلن يكون هناك أحد بحسب التحذير."],"de":{"title":"sonst / andernfalls","lead":"Willst du vor einer Folge warnen, die eintritt, wenn etwas nicht getan wird, benutze `sonst` oder `andernfalls`. Die Bedeutung ist „wenn nicht“ bzw. „im anderen Fall“.","steps":[{"text":"Finde die versteckte Bedingung","why":"Aus der Warnung verstehst du: Den Bus verpasst man, wenn man sich nicht beeilt. Das Wort ersetzt die verneinte Bedingung. Der erste Satz kann auch eine Bedingung für den Erfolg nennen: `Du musst dich anmelden`."},{"text":"Beginne den zweiten Hauptsatz mit dem Adverb, dann das Verb","why":"`sonst` steht auf Position 1, `verpasst` auf Position 2. Diese Reihenfolge ist wichtig, wenn du einen Bedingungssatz in ein verbindendes Adverb umformst."},{"text":"Benutze andernfalls mit derselben Funktion","why":"`andernfalls` ist in formeller Sprache häufig. Es kann nach einem Punkt einen neuen Satz beginnen oder – im passenden Beispiel – die Sätze mit Komma verbinden."},{"text":"Lerne die Position des Adverbs im Satz kennen","why":"Das Adverb kann auch im Mittelfeld nach dem konjugierten Verb stehen. Achte auf die Bedeutung von `sonst` in `Was machst du sonst?`: Hier heißt es je nach Kontext „außerdem“ oder „normalerweise“."}],"explain":["Vergleiche `Nimm den Schirm, sonst wirst du nass` und `Es regnet, deshalb nehme ich den Schirm`. Der erste Satz warnt vor der Folge, wenn man den Schirm nicht nimmt. Der zweite zieht eine Folgerung aus einer bestehenden Situation, dem Regen. Benutze `sonst`, wenn du die versteckte Bedingung mit `wenn nicht` formulieren kannst."],"pitfall":"Beginnt der zweite Satz mit `sonst`, steht das konjugierte Verb `kann` direkt danach.","recall":["Welche Bedingung steckt in `Ruf vorher an, andernfalls ist niemand da`?","Wenn du nicht vorher anrufst, ist laut der Warnung niemand da."],"links":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Bedeutung von sonst · grammis"]},"pattern":["Aufforderung / Aussage",",","sonst + Verb + Subjekt …"],"frames":[{"k":"main","parts":[["v","Beeil"],["mf","dich"]]},{"k":"main","parts":[["vf","sonst"],["v","verpasst"],["mf","du den Bus"]]}]},{"id":"subjektlos","chapter":6,"title":"المبني للمجهول بلا فاعل نحوي","german":"Subjektloses Passiv","emoji":"🎶","links":[["فهرس قواعد الوحدة 6 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أفعال المجهول · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/929"],["المجهول دون فاعل نحوي · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/1068"]],"steps":[{"text":"افحص الجملة الأصلية","example":"Man tanzt hier.","why":"يوجد فاعل عام هو `man` وظرف مكان هو `hier`. لا يوجد مفعول مباشر يصبح فاعلًا نحويًا. هذا النوع ممكن مع أنشطة مثل `tanzen` و`arbeiten`."},{"text":"احذف الفاعل العام واستعمل المفرد","example":"Hier wird getanzt.","why":"عند عدم وجود مسند إليه صرّف `werden` بصيغة الغائب المفرد. وأبقِ الظرف ثم ضع اسم المفعول في النهاية."},{"text":"املأ الموقع الأول بـ es إذا لم تقدّم شيئًا آخر","example":"Es wird hier getanzt. · Heute wird hier getanzt.","why":"تملأ `es` صدر الرئيسية. تختفي عندما يتصدر `heute` أو `hier`. وفي `…, weil hier getanzt wird` لا تحتاج إليها أيضًا."},{"text":"أبقِ مفعول الداتيف إن وجد","example":"Man hilft den Gästen. → Den Gästen wird geholfen.","why":"الضيوف في الداتيف لأن `helfen` يطلبه. حتى مع جمع `den Gästen` يبقى الفعل `wird` مفردًا. قارن `Die Gäste werden begrüßt` حيث صار المفعول المباشر فاعلًا نحويًا."}],"explain":["ليست كل الأفعال بلا مفعول مباشر صالحة لهذا التحويل. تدرب أولًا على الأفعال التي تصف نشاطًا يؤديه أحد مثل `arbeiten` و`lachen`، ومع أفعال مثل `helfen`. ويمكن وصف نشاط مكتمل بـ `Gestern ist hier getanzt worden`، أو ضرورة بـ `Hier muss gearbeitet werden`. تبقى صيغة الغائب المفرد في الحالتين."],"questions":[{"id":"subjektlos-1","type":"cloze","topic":"subjektlos","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"صرّف werden للمجهول بلا فاعل.","grounded":false,"text":"Heute {{1}} hier gearbeitet.","blanks":[["wird"]],"explain":"لا يوجد فاعل نحوي في الجملة، فتبقى الصيغة مفرد الغائب wird.","hints":["هل يوجد مسند إليه يتحكم في العدد؟"],"de":{"prompt":"Konjugiere `werden` für das subjektlose Passiv.","explain":"Im Satz gibt es kein Subjekt, deshalb bleibt die 3. Person Singular `wird`.","hints":["Gibt es ein Subjekt, das den Numerus bestimmt?"]}},{"id":"subjektlos-2","type":"cloze","topic":"subjektlos","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل العبارة المبدوءة من دون ظرف أول.","grounded":false,"text":"{{1}} wird im Saal getanzt.","blanks":[["Es"]],"explain":"Es هنا تملأ الموضع الأول. ويمكن تقديم im Saal وحذفها.","hints":["املأ موقع الصدارة في الرئيسية."],"de":{"prompt":"Ergänze den Satz, der ohne Adverb am Anfang beginnt.","explain":"`Es` füllt hier Position 1. Stellst du `im Saal` nach vorn, fällt es weg.","hints":["Füll die erste Position im Hauptsatz."]}},{"id":"subjektlos-3","type":"mcq","topic":"subjektlos","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي جملة مجهول بلا فاعل نحوي؟","grounded":false,"options":["Hier wird getanzt.","Die Gäste werden begrüßt.","Der Saal wird geöffnet."],"answer":0,"explain":"مع getanzt لا توجد مجموعة رفع. Gäste وSaal مسندان إليهما في الجملتين الأخريين.","hints":["هل توجد مجموعة في الرفع تتوافق مع werden؟"],"de":{"prompt":"Welcher Satz ist ein Passiv ohne Subjekt?","explain":"Bei `getanzt` gibt es keine Gruppe im Nominativ. In den anderen beiden Sätzen sind `Gäste` und `Saal` Subjekte.","hints":["Gibt es eine Nominativgruppe, zu der `werden` passt?"]}},{"id":"subjektlos-4","type":"cloze","topic":"subjektlos","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Man hilft den Kindern إلى مجهول يبدأ بالداتيف.","grounded":false,"text":"Den Kindern {{1}} {{2}}.","blanks":[["wird"],["geholfen"]],"explain":"Den Kindern لا تصبح فاعلًا، لذلك يبقى wird مفردًا ثم geholfen.","hints":["helfen يطلب الداتيف حتى بعد التحويل."],"de":{"prompt":"Forme `Man hilft den Kindern` in ein Passiv um, das mit dem Dativ beginnt.","explain":"`Den Kindern` wird nicht zum Subjekt, deshalb bleibt `wird` im Singular, dann `geholfen`.","hints":["`helfen` verlangt auch nach der Umformung den Dativ."]}},{"id":"subjektlos-5","type":"order","topic":"subjektlos","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب التابعة بلا فاعل. ضع hier قبل leise.","grounded":false,"items":["weil","hier","leise","gearbeitet","wird"],"explain":"الترتيب هو Partizip II ثم wird في التابعة. لا تحتاج إلى es.","hints":["الفعل المصرف في الآخر. الصدارة مشغولة بـ weil."],"de":{"prompt":"Ordne den Nebensatz ohne Subjekt. Setz `hier` vor `leise`.","explain":"Im Nebensatz steht zuerst das Partizip II, dann `wird`. Du brauchst kein `es`.","hints":["Das konjugierte Verb steht am Ende. Position 1 ist durch `weil` besetzt."]}},{"id":"subjektlos-6","type":"mcq","topic":"subjektlos","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"لماذا لا نكتب werden في Den Gästen wird geholfen؟","grounded":false,"options":["لأن الضيوف في الداتيف وليسوا مسندًا إليه في الرفع.","لأن كلمة Gästen في المفرد.","لأن helfen يُصرّف دائمًا في المفرد مهما كان الفاعل."],"answer":0,"explain":"Den Gästen جمع في الداتيف، لكنه لا يتحكم في التصريف. غياب المسند إليه يقتضي wird.","hints":["انظر إلى حالة الضيوف."],"de":{"prompt":"Warum schreiben wir in `Den Gästen wird geholfen` nicht `werden`?","explain":"`Den Gästen` ist Plural im Dativ, bestimmt aber nicht die Konjugation. Ohne Subjekt steht `wird`.","hints":["Schau auf den Kasus der Gäste."],"options":["Weil die Gäste im Dativ stehen und nicht Subjekt im Nominativ sind.","Weil `Gästen` Singular ist.","Weil `helfen` immer im Singular konjugiert wird, egal welches Subjekt."]}},{"id":"subjektlos-7","type":"text","topic":"subjektlos","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Man muss hier leise sprechen إلى مجهول بلا فاعل يبدأ بـ Hier.","grounded":false,"answer":"Hier muss leise gesprochen werden.","explain":"muss في الموقع الثاني. في النهاية gesprochen werden. لا تحتاج إلى es مع Hier.","hints":["احتفظ بمعنى الوجوب وصرّف الفعل الناقص بالمفرد."],"de":{"prompt":"Forme `Man muss hier leise sprechen` in ein subjektloses Passiv um, das mit `Hier` beginnt.","explain":"`muss` steht auf Position 2, am Ende `gesprochen werden`. Mit `Hier` vorne brauchst du kein `es`.","hints":["Behalte die Bedeutung der Pflicht und konjugiere das Modalverb im Singular."]}},{"id":"subjektlos-8","type":"text","topic":"subjektlos","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Den Kindern werden geholfen.","answer":"Den Kindern wird geholfen.","explain":"تبقى `den Kindern` في الداتيف، فلا تُصرّف الفعل معها كجمع.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`den Kindern` bleibt im Dativ – konjugiere das Verb deshalb nicht im Plural.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"subjektlos-9","type":"text","topic":"subjektlos","difficulty":2,"prompt":"هل تبقى `es` في `Heute wird gearbeitet`؟","answer":"لا حاجة إليها. يشغل `Heute` الموقع الأول في الرئيسية بالفعل.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Bleibt `es` in `Heute wird gearbeitet`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Nein. `Heute` besetzt schon Position 1 im Hauptsatz."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"أحيانًا نريد وصف نشاط عام مثل العمل أو الرقص من دون ذكر من يقوم به. عندما لا يوجد مفعول مباشر قابل للتحويل، قد نحصل على مجهول من دون مسند إليه.","example":"Hier tanzt man. → Hier wird getanzt.","translation":"يرقص الناس هنا ← يجري الرقص هنا.","pitfall":["Den Kindern werden geholfen. → Den Kindern wird geholfen.","تبقى `den Kindern` في الداتيف، فلا تُصرّف الفعل معها كجمع."],"recall":["هل تبقى `es` في `Heute wird gearbeitet`؟","لا حاجة إليها. يشغل `Heute` الموقع الأول في الرئيسية بالفعل."],"de":{"title":"Subjektloses Passiv","lead":"Manchmal wollen wir eine allgemeine Tätigkeit wie Arbeiten oder Tanzen beschreiben, ohne zu sagen, wer sie macht. Gibt es kein Akkusativobjekt, das man umformen kann, entsteht ein Passiv ohne Subjekt.","steps":[{"text":"Prüfe den Ausgangssatz","why":"Es gibt ein allgemeines Subjekt `man` und eine Ortsangabe `hier`. Es gibt kein Akkusativobjekt, das Subjekt werden könnte. Das geht mit Tätigkeiten wie `tanzen` und `arbeiten`."},{"text":"Lass das allgemeine Subjekt weg und benutze den Singular","why":"Gibt es kein Subjekt, konjugierst du `werden` in der 3. Person Singular. Behalte das Adverb und setz das Partizip II ans Ende."},{"text":"Füll Position 1 mit es, wenn sonst nichts vorne steht","why":"`es` füllt die erste Position im Hauptsatz. Es verschwindet, wenn `heute` oder `hier` vorne steht. Auch in `…, weil hier getanzt wird` brauchst du es nicht."},{"text":"Behalte ein Dativobjekt, wenn es eines gibt","why":"Die Gäste stehen im Dativ, weil `helfen` den Dativ verlangt. Auch mit dem Plural `den Gästen` bleibt `wird` im Singular. Vergleiche `Die Gäste werden begrüßt`: Hier ist das Akkusativobjekt zum Subjekt geworden."}],"explain":["Nicht jedes Verb ohne Akkusativobjekt eignet sich für diese Umformung. Üb zuerst mit Verben, die eine Tätigkeit von Menschen beschreiben, wie `arbeiten` und `lachen`, und mit Verben wie `helfen`. Eine abgeschlossene Tätigkeit beschreibst du mit `Gestern ist hier getanzt worden`, eine Notwendigkeit mit `Hier muss gearbeitet werden`. In beiden Fällen bleibt die 3. Person Singular."],"pitfall":"`den Kindern` bleibt im Dativ – konjugiere das Verb deshalb nicht im Plural.","recall":["Bleibt `es` in `Heute wird gearbeitet`?","Nein. `Heute` besetzt schon Position 1 im Hauptsatz."],"links":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Passiv-Hilfsverben · grammis","Subjektloses Passiv · grammis"]},"pattern":["(Es / Adverb)","+","wird","…","Partizip II"],"frames":[{"k":"main","parts":[["vf","Hier"],["v","wird"],["ve","getanzt"]]},{"k":"main","parts":[["vf","Den Gästen"],["v","wird"],["ve","geholfen"]]}]}],"sample":"https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf","solutions":"https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"}</script>

const t = key => UI[lang][key];

function readStorage() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    return { completed: saved.completed || {}, results: saved.results || {}, runs: saved.runs || {}, lastRun: saved.lastRun, lastLesson: saved.lastLesson };
  } catch {
    storageAvailable = false;
    return { completed: {}, results: {}, runs: {} };
  }
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    storageAvailable = false;
  }
}

function remember(key, value) {
  try { localStorage.setItem(key, value); } catch { /* preference stays for this visit only */ }
}

const esc = value => String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
const de = value => `<bdi lang="de" dir="ltr">${esc(value)}</bdi>`;
const germanLine = value => `<div class="de" lang="de" dir="ltr">${esc(value)}</div>`;
const num = value => numbers.format(value);
const percent = (part, all) => all ? Math.round(100 * part / all) : 0;
const localeSearch = value => value.normalize("NFD").replace(/\p{M}/gu, "").replace(/[أإآٱ]/g, "ا").replace(/ـ/g, "").toLowerCase();
const inUnit = chapter => course.topics.filter(topic => topic.chapter === chapter);
const chapterName = i => lang === "de" ? course.chapters[i][0] : course.chapters[i][1];

function tx(topic) {
  if (lang !== "de") return {
    title: topic.title, lead: topic.lead, explain: topic.explain, recall: topic.recall, table: topic.table,
    pitfall: topic.pitfall[1], steps: topic.steps, links: topic.links.map(([title, url]) => [title, url]),
  };
  const d = topic.de;
  return {
    title: d.title, lead: d.lead, explain: d.explain, recall: d.recall, table: d.table || topic.table, pitfall: d.pitfall,
    steps: topic.steps.map((step, i) => ({ ...step, ...d.steps[i] })),
    links: topic.links.map(([, url], i) => [d.links[i], url]),
  };
}

function qx(q) {
  if (lang !== "de" || !q.de) return q;
  return { ...q, prompt: q.de.prompt, explain: q.de.explain, hints: q.de.hints, options: q.de.options || q.options, answer: q.de.answer ?? q.answer, text: q.de.text ?? q.text };
}

const titleOf = topic => lang === "de" ? topic.de.title : topic.title;

function prose(value) {
  return String(value).split("\x60").map((part, i) => {
    if (i % 2) return `<bdi class="term" lang="de" dir="ltr">${esc(part)}</bdi>`;
    if (lang === "de") return esc(part);
    if (/[A-Za-z]/.test(part) && !/\p{Script=Arabic}/u.test(part)) return de(part);
    return part.split(/([A-Za-zÄÖÜäöüẞß][A-Za-zÄÖÜäöüẞß0-9 .,:;!?…/„“’'()–—-]*[A-Za-zÄÖÜäöüẞß0-9]|[A-Za-zÄÖÜäöüẞß])/g)
      .map((piece, j) => j % 2 ? de(piece) : esc(piece)).join("");
  }).join("");
}

function link(href, label, style = "secondary") {
  return `<a class="btn ${style}" href="#${href}">${label}</a>`;
}

function button(action, label, style = "secondary", attributes = "") {
  return `<button type="button" class="btn ${style}" data-action="${action}" ${attributes}>${label}</button>`;
}

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function currentTheme() {
  return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function applyTheme() {
  const dark = currentTheme() === "dark";
  themeButton.setAttribute("aria-label", dark ? t("toLight") : t("toDark"));
  themeButton.title = themeButton.getAttribute("aria-label");
  document.querySelector('meta[name="theme-color"]').content = dark ? "#111019" : "#f6f5fa";
}

function applyChrome() {
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";
  numbers = new Intl.NumberFormat(lang);
  document.title = t("docTitle");
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-t-aria]")) el.setAttribute("aria-label", t(el.dataset.tAria));
  for (const el of document.querySelectorAll("[data-t-ph]")) el.placeholder = t(el.dataset.tPh);
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", String(el.dataset.lang === lang));
  menu.setAttribute("aria-label", sidebar.classList.contains("open") ? t("menuClose") : t("menuOpen"));

}

function drawIndex() {
  const previousScroll = index.scrollTop;
  const query = localeSearch(search.value.trim());
  const selected = topics.get(route.split("/")[1]);
  let count = 0;
  index.innerHTML = course.chapters.map(([german, arabic, emoji, palette], i) => {
    const chapter = i + 1;
    const matches = inUnit(chapter).filter(topic => localeSearch([topic.title, topic.german, topic.de.title, german, arabic].join(" ")).includes(query));
    if (!matches.length) return "";
    count += matches.length;
    return `<details data-chapter="${chapter}" ${query || openChapters.has(chapter) || selected?.chapter === chapter ? "open" : ""}>
      <summary title="${esc(lang === "de" ? arabic : german)}"><span class="sum-emoji ${palette}" aria-hidden="true">${emoji}</span><span>${num(chapter)}. ${esc(chapterName(i))}</span><span class="chevron" aria-hidden="true">⌄</span></summary>
      <div class="index-links">${matches.map(topic => `<a href="#lesson/${topic.id}" ${route === "lesson/" + topic.id ? 'aria-current="page"' : ""}>
        <span class="dot" aria-hidden="true">${state.completed[topic.id] ? "✓" : "·"}</span><span>${prose(titleOf(topic))}</span></a>`).join("")}</div>
    </details>`;
  }).join("");
  if (!count) index.innerHTML = `<p class="notice">${t("noMatch")}</p>`;
  index.scrollTop = previousScroll;

}

  const frames = topic.frames ? `<div><span class="label">${t("structure")}</span><div class="frames">${topic.frames.map(frame => `

function wrongRight(pair) {

    <div class="yes"><span class="mark" aria-hidden="true">✓</span><span class="sr-only">${t("right")}:</span><span>${esc(right)}</span></div></div>`;
}

function mixedQuestions(testMode) {
  return shuffle(course.chapters.flatMap((_, i) => {
    const unit = shuffle(inUnit(i + 1));
    return Array.from({ length: 4 }, (_, j) => {
      const topic = unit[j % unit.length];
      const difficulty = [1, 2, testMode ? 2 : 3, 2][j];
      return shuffle(topic.questions.filter(q => q.difficulty === difficulty && (!testMode || q.type !== "text")))[0];
    });
  }));
}

function newRun(key) {
  const isTest = key === "test";
  let list = topics.get(key)?.questions;
  if (/^unit-[1-6]$/.test(key)) list = shuffle(inUnit(Number(key.slice(-1))).flatMap(topic => topic.questions));
  if (key === "mistakes") list = pendingErrors();
  if (key === "mixed" || isTest) list = mixedQuestions(isTest);
  if (!list?.length) return null;
  return {
    key, mode: isTest ? "test" : "practice", deadline: isTest ? Date.now() + 20 * 60 * 1000 : null,
    ids: list.map(q => q.id), answers: {}, grades: {}, order: {}, position: 0, finished: false
  };
}

function prepareRun(key, reset = false) {
  if (reset || !state.runs[key]) state.runs[key] = newRun(key);
  run = state.runs[key];
  if (run) state.lastRun = key;
  save();
}

function currentQuestion() {
  return questions.get(run?.ids[run.position]);
}

function permutation(q, length) {
  if (!run.order[q.id]) {
    const identity = Array.from({ length }, (_, i) => i);
    let result = shuffle(identity);
    if (q.type === "order" && result.every((n, i) => n === i)) result = result.slice(1).concat(result[0]);
    run.order[q.id] = result;
    save();
  }
  return run.order[q.id];
}

function quizTitle() {
  if (run.key === "test") return t("testName");
  if (run.key === "mixed") return t("mixedName");
  if (run.key === "mistakes") return t("mistakesName");
  if (run.key.startsWith("unit-")) return esc(chapterName(Number(run.key.slice(-1)) - 1));
  return prose(titleOf(topics.get(run.key)));
}

function normalize(value) {
  return String(value ?? "").normalize("NFC").trim().toLocaleLowerCase("de").replace(/\s+/g, " ").replace(/[.!?]+$/, "");
}

function isCorrect(q, input) {
  if (q.type === "mcq") return input === q.answer;
  if (q.type === "cloze") return q.blanks.every((variants, i) => variants.some(answer => normalize(answer) === normalize(input?.[i])));
  if (q.type === "order") return input?.length === q.items.length && input.every((piece, i) => piece === i);
  return false;
}

function answered(q, input) {
  if (q.type === "mcq") return Number.isInteger(input);
  if (q.type === "order") return input?.length === q.items.length;
  if (q.type === "cloze") return q.blanks.every((_, i) => String(input?.[i] || "").trim());
  return !!String(input || "").trim();
}

function record(q, correct) {
  const old = state.results[q.id] || {};
  const streak = correct ? (old.streak || 0) + 1 : 0;
  state.results[q.id] = {
    correct, streak, topic: q.topic, tries: (old.tries || 0) + 1,
    needsReview: !correct || Boolean(old.needsReview && streak < 2),
  };
}

function renderQuiz() {
  if (!run) {
    content.innerHTML = `<div class="panel"><h1>${t("noQuestions")}</h1><p>${t("noQuestionsText")}</p><div class="actions" style="margin-top:12px">${link("practice", t("allPractice"))}</div></div>`;
    return;
  }
  if (run.finished) return renderResults();
  if (run.mode === "test" && Date.now() >= run.deadline) return finishTest();
  const raw = currentQuestion();
  const q = qx(raw);
  const grade = run.grades[q.id];
  const checked = typeof grade === "boolean";
  const isTest = run.mode === "test";
  const hintText = q.hints[hintCount - 1];
  const lesson = topics.get(q.topic);
  const previous = run.position > 0;
  const last = run.position === run.ids.length - 1;
  content.innerHTML = `
    <nav class="crumb" aria-label="${t("crumbLabel")}"><a href="#practice">${t("practice")}</a><span aria-hidden="true">${t("sep")}</span><span>${quizTitle()}</span></nav>
    <section class="quiz-box" aria-labelledby="quiz-heading">
      <div class="quiz-meta"><strong id="quiz-heading">${quizTitle()}</strong>
        <span>${t("questionOf")(num(run.position + 1), num(run.ids.length))}</span>
        ${isTest ? `<span id="timer" class="timer" role="timer" dir="ltr" aria-label="${t("timeLeft")}"></span>` : ""}</div>
      <progress value="${run.position + 1}" max="${run.ids.length}" aria-label="${t("position")}"></progress>
      <div class="quiz-meta"><span class="quiz-type">${t("kindLabels")[q.type]} · ${t("difficulty")[q.difficulty]}</span>
      ${!isTest ? `<a href="#lesson/${lesson.id}">${prose(titleOf(lesson))} ↗</a>` : ""}</div>
      <h1 class="quiz-prompt" id="quiz-prompt" tabindex="-1">${prose(q.prompt)}</h1>
      ${q.context ? `<div class="example">${germanLine(q.context)}</div>` : ""}
      ${renderInput(q, run.answers[q.id], checked || grade === "shown", checked)}
      <div id="quiz-status" class="sr-only" aria-live="polite"></div>
      ${hintText && !isTest ? `<div class="quiz-help" tabindex="-1"><strong>💡 ${t("hint")(num(hintCount))}</strong> · ${prose(hintText)}</div>` : ""}
      ${checked || grade === "shown" ? renderFeedback(q, grade) : ""}
      <div class="quiz-controls">
        ${isTest ? [
          previous ? button("q-prev", t("back")) : "",
          !last ? button("q-next", t("forward"), "primary") : "",
          button("finish-test", t("submitTest"), last ? "primary" : "quiet")
        ].join("") : [
          !checked && grade !== "shown" ? button("check", q.type === "text" ? t("showModel") : t("check"), "primary") : "",
          !checked && grade !== "shown" && hintCount < q.hints.length ? button("hint", t("showHint"), "quiet") : "",
          previous ? button("q-prev", t("back")) : "",
          grade !== "shown" ? button("q-next", last ? t("showResult") : checked ? t("forward") : t("skipQ"), checked ? "primary" : "secondary") : ""
        ].join("")}
      </div>
      ${isTest ? `<div id="test-confirm" class="notice" hidden><p id="test-summary"></p><div class="actions" style="margin-top:8px">${button("confirm-test", t("submitNow"), "primary")}${button("cancel-finish", t("keepSolving"))}</div></div>` : ""}
    </section>`;
  startClock();
}

function renderInput(q, value, locked, showGrade) {
  const disabled = locked ? "disabled" : "";
  if (q.type === "mcq") {
    return `<fieldset class="choices"><legend class="sr-only">${t("chooseOne")}</legend>
      ${permutation(q, q.options.length).map(i => {
        const gradeClass = showGrade && i === q.answer ? "good" : showGrade && i === value ? "bad" : "";
        return `<label class="option ${gradeClass}"><input type="radio" name="choice" value="${i}" ${value === i ? "checked" : ""} ${disabled}><span>${prose(q.options[i])}</span></label>`;
      }).join("")}</fieldset>`;
  }
  if (q.type === "cloze") {
    return `<div class="cloze de" dir="ltr" lang="de" aria-describedby="quiz-prompt">${q.text.split(/(\{\{\d+\}\})/g).map(part => {
      const match = part.match(/^\{\{(\d+)\}\}$/);
      if (!match) return esc(part);
      const i = Number(match[1]) - 1;
      const correct = q.blanks[i].some(answer => normalize(answer) === normalize(value?.[i]));
      return `<input class="blank ${showGrade ? (correct ? "good" : "bad") : ""}" data-blank="${i}" aria-label="${t("blank")(num(i + 1))}" value="${esc(value?.[i] ?? "")}" lang="de" autocapitalize="off" autocomplete="off" spellcheck="false" ${disabled}>`;
    }).join("")}</div>`;
  }
  if (q.type === "order") return `<div id="ordering">${orderMarkup(q, value || [], locked)}</div>`;
  return `<label class="answer-label" for="written">${t("writeLabel")}</label>
    <textarea id="written" dir="auto" lang="de" spellcheck="false" ${disabled}>${esc(value ?? "")}</textarea>`;
}

function orderMarkup(q, value, locked) {
  const token = (i, action) => `<button type="button" class="order-token" data-action="${action}" data-piece="${i}" lang="de" dir="ltr" ${locked ? "disabled" : ""}>${esc(q.items[i])}</button>`;
  return `<span class="answer-label">${t("orderYours")}</span>
    <div class="order-line answer-order" dir="ltr" aria-label="${t("orderAria")}">${value.map(i => token(i, "remove-piece")).join("")}</div>
    <span class="answer-label">${t("orderPick")}</span>
    <div class="order-line" dir="ltr" aria-label="${t("piecesAria")}">${permutation(q, q.items.length).filter(i => !value.includes(i)).map(i => token(i, "add-piece")).join("")}</div>`;
}

function model(q) {
  if (q.type === "mcq") return q.options[q.answer];
  if (q.type === "cloze") return q.text.replace(/\{\{(\d+)\}\}/g, (_, i) => q.blanks[Number(i) - 1][0]);
  if (q.type === "order") return q.items.join(" ");
  return q.answer;
}

function renderFeedback(q, grade) {
  const alternates = q.blanks?.flatMap((variants, i) => variants.length > 1 ? [`${num(i + 1)} · ${variants.map(de).join(" / ")}`] : []);
  return `<div class="feedback ${grade === true ? "correct" : grade === false ? "incorrect" : ""}" id="feedback" tabindex="-1">
    <strong>${grade === true ? t("correct") : grade === false ? t("incorrect") : t("compare")}</strong>
    <p>${prose(model(q))}</p>${alternates?.length ? `<p>${t("alternates")} ${alternates.join(" · ")}</p>` : ""}<p>${prose(q.explain)}</p>
    ${grade === "shown" ? `<div class="actions" style="margin-top:8px">${button("self-yes", t("selfYes"), "primary")}${button("self-no", t("selfNo"))}</div>` : ""}
    </div>`;
}

function moveQuestion(delta) {
  const newPosition = run.position + delta;
  if (newPosition < 0) return;
  if (newPosition >= run.ids.length) {
    if (run.mode === "practice") {
      run.finished = true;
      save();
      renderResults();
      focusContent();
    }
    return;
  }
  run.position = newPosition;
  hintCount = 0;
  save();
  renderQuiz();
  document.querySelector("#quiz-prompt")?.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function changeAnswer(q, value) {
  if (run.grades[q.id] !== undefined) return;
  run.answers[q.id] = value;
  save();
}

function finishTest() {
  if (!run || run.finished) return;
  run.timedOut = Date.now() >= run.deadline;
  for (const id of run.ids) {
    const q = questions.get(id);
    if (!answered(q, run.answers[id])) continue;
    const grade = isCorrect(q, run.answers[id]);
    run.grades[id] = grade;
    record(q, grade);
  }
  run.finished = true;
  save();
  clearInterval(timer);
  if (route === "practice/test") {
    renderResults();
    focusContent();
  }
}

function startClock() {
  clearInterval(timer);
  const display = document.querySelector("#timer");
  if (!display) return;
  const tick = () => {
    const seconds = Math.max(0, Math.ceil((run.deadline - Date.now()) / 1000));
    display.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    display.classList.toggle("soon", seconds < 60);
    if (!seconds) finishTest();
  };
  timer = setInterval(tick, 500);
  tick();
}

function resultStatus(grade) {
  if (grade === true) return t("statusRight");
  if (grade === false) return t("statusReview");
  return t("statusNone");
}

function renderResults() {
  const correct = run.ids.filter(id => run.grades[id] === true).length;
  const total = run.ids.length;
  const counted = run.ids.filter(id => typeof run.grades[id] === "boolean").length;
  const html = run.ids.map(id => {
    const q = qx(questions.get(id));
    const value = run.answers[id];
    const yourAnswer = q.type === "mcq" ? q.options[value] : q.type === "order" ? value?.map(i => q.items[i]).join(" ") : q.type === "cloze" ? value?.filter(Boolean).join(" · ") : value;
    return `<details class="result-row"><summary>${resultStatus(run.grades[id])} · ${prose(q.prompt)}</summary>
      ${q.context ? germanLine(q.context) : ""}${q.text ? `<div class="review-model" lang="de" dir="ltr">${esc(q.text.replace(/\{\{\d+\}\}/g, "___"))}</div>` : ""}
      ${yourAnswer ? `<p><strong>${t("yourAnswer")}</strong> · ${prose(yourAnswer)}</p>` : ""}
      <p><strong>${t("solution")}</strong> · ${prose(model(q))}</p><p>${prose(q.explain)}</p><a href="#lesson/${q.topic}">${t("openRule")}</a></details>`;
  }).join("");
  content.innerHTML = `
    <nav class="crumb" aria-label="${t("crumbLabel")}"><a href="#practice">${t("practice")}</a><span aria-hidden="true">${t("sep")}</span><span>${quizTitle()}</span></nav>
    <section class="quiz-box"><h1 class="quiz-prompt">${t("resultOf")(quizTitle())}</h1>
      ${run.timedOut ? `<p class="notice">${t("timeUp")}</p>` : ""}
      <div class="stats"><div class="stat"><strong>${num(correct)}</strong>${t("statRight")}</div>
      <div class="stat"><strong>${num(counted - correct)}</strong>${t("statNeeds")}</div>
      <div class="stat"><strong>${num(total - counted)}</strong>${t("statNone")}</div></div>
      <div class="actions">${button("restart", t("newRun"), "primary")}${link("progress", t("progressLog"))}${link("practice", t("otherPractice"))}</div>
      <div class="section-heading"><h2>${t("answersTitle")}</h2></div>${html}
    </section>`;
}

function renderProgress() {
  const reviewed = course.topics.filter(topic => state.completed[topic.id]).length;
  const values = [...questions.keys()].map(id => state.results[id]).filter(Boolean);
  const correct = values.filter(entry => entry.correct).length;
  const mistakes = pendingErrors().length;
  content.innerHTML = `
    <section class="simple-banner practice-head"><h1>${t("progressTitle")}</h1>
      <p>${storageAvailable ? t("progressSaved") : t("progressNoStore")}</p>
      <div class="stats"><div class="stat"><strong>${t("of")(num(reviewed), num(course.topics.length))}</strong>${t("lessonsDone")}</div>
      <div class="stat"><strong>${t("of")(num(correct), num(values.length))}</strong>${t("rightAnswers")}</div>
      <div class="stat"><strong>${num(mistakes)}</strong>${t("toReview")}</div></div>
      <div class="actions">${mistakes ? button("mistakes", t("reviewMistakes"), "primary") : ""}${button("export", t("exportJson"))}</div>
    </section>
    <section class="panel"><h2>${t("byLesson")}</h2>
      <ul class="stat-list">${course.topics.map(topic => {
        const known = topic.questions.filter(q => state.results[q.id]?.correct).length;
        return `<li class="row-between"><a href="#lesson/${topic.id}">${state.completed[topic.id] ? "✓ " : ""}${prose(titleOf(topic))}</a>
          <span>${t("of")(num(known), num(topic.questions.length))}</span>
          <progress value="${known}" max="${topic.questions.length}" aria-label="${esc(t("rightIn")(titleOf(topic)))}"></progress></li>`;
      }).join("")}</ul></section>`;
}

function exportResults() {
  const now = new Date();
  const dateParts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Berlin", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(now).map(part => [part.type, part.value]));
  const date = `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
  const data = { als: "1", kind: "results", source: "quiz", title: "Deutsch B1.1 · تمارين القواعد",
    module: "b11", date, exported: now.toISOString(),
    items: [...questions.keys()].filter(id => state.results[id]).map(id => ({ id, ...state.results[id] })) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = `Deutsch-B1.1-results-${date}.json`;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function focusContent() {
  main.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function refreshRoute(initial = false) {
  const next = location.hash.slice(1) || "home";
  const [group, key, extra] = next.split("/");
  const knownRun = topics.has(key) || ["mixed", "test", "mistakes"].includes(key) || /^unit-[1-6]$/.test(key);
  route = extra === undefined && ((group === "lesson" && topics.has(key)) ||
    (group === "practice" && (!key || knownRun)) || next === "progress") ? next : "home";
  clearInterval(timer);
  setDrawer(false);
  const currentTab = route.startsWith("practice") ? "practice" : route === "progress" ? "progress" : "home";
  for (const anchor of document.querySelectorAll("[data-tab]")) {
    if (anchor.dataset.tab === currentTab) anchor.setAttribute("aria-current", "page");
    else anchor.removeAttribute("aria-current");
  }
  if (route.startsWith("lesson/")) renderLesson(topics.get(key));
  else if (route.startsWith("practice/") && key) {
    prepareRun(key);
    renderQuiz();
  } else if (route === "practice") renderLauncher();
  else if (route === "progress") renderProgress();
  else renderHome();
  drawIndex();
  if (!initial) focusContent();
}

function revealSteps(all, source) {
  const steps = [...document.querySelectorAll(".step")];
  const old = stepCount;
  stepCount = Math.min(steps.length, all ? steps.length : stepCount + 1);
  steps.slice(old, stepCount).forEach(element => {
    element.hidden = false;
    element.classList.add("enter");
  });
  const controls = document.querySelector("#step-controls");
  controls.hidden = stepCount >= steps.length;
  document.querySelector("#step-count").textContent = t("stepOf")(num(stepCount), num(steps.length));
  document.querySelector("#step-status").textContent = t("stepsShown")(num(stepCount), num(steps.length));
  if (!all) steps[stepCount - 1]?.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (controls.hidden && source) {
    steps[old]?.setAttribute("tabindex", "-1");
    steps[old]?.focus({ preventScroll: true });
  }
}

function goToRun(key, reset) {
  if (reset) {
    prepareRun(key, true);
    hintCount = 0;
  }
  if (location.hash === "#practice/" + key) refreshRoute();
  else location.hash = "practice/" + key;
}

function setLanguage(next) {
  if (next === lang) return;
  lang = next;
  remember(langKey, lang);
  applyChrome();
  const y = window.scrollY;
  refreshRoute(true);
  window.scrollTo({ top: y });
}

document.querySelector("#source-link").href = course.sample + "#page=2";
search.addEventListener("input", drawIndex);
index.addEventListener("click", event => {
  const detail = event.target.closest("summary")?.parentElement;
  if (detail && !search.value) {
    const chapter = Number(detail.dataset.chapter);
    if (detail.open) openChapters.delete(chapter);
    else openChapters.add(chapter);
  }
  if (event.target.closest("a") && sidebar.classList.contains("open")) setDrawer(false);
});
menu.addEventListener("click", () => {
  const open = !sidebar.classList.contains("open");
  setDrawer(open);
  if (open) search.focus();
});
shade.addEventListener("click", () => {
  setDrawer(false);
  menu.focus();
});
for (const el of document.querySelectorAll("[data-lang]")) el.addEventListener("click", () => setLanguage(el.dataset.lang));
themeButton.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  remember(themeKey, next);
  applyTheme();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
document.querySelector(".skip").addEventListener("click", event => {
  event.preventDefault();
  focusContent();
});
window.addEventListener("hashchange", () => {
  hintCount = 0;
  refreshRoute();
});
window.addEventListener("keydown", event => {
  if (event.key === "Escape" && sidebar.classList.contains("open")) {
    setDrawer(false);
    menu.focus();
  }
  const forwardKey = lang === "ar" ? "ArrowLeft" : "ArrowRight";
  if (!route.startsWith("lesson/") || ![forwardKey, " "].includes(event.key) ||
      event.target.closest("a,button,input,textarea,select,summary,[tabindex='0']") || event.altKey || event.ctrlKey || event.metaKey) return;
  if (stepCount < document.querySelectorAll(".step").length) {
    event.preventDefault();
    revealSteps(false);
  }
});

content.addEventListener("input", event => {
  if (!route.startsWith("practice/") || !run || run.finished) return;
  const q = currentQuestion();
  const target = event.target;
  if (target.name === "choice") changeAnswer(q, Number(target.value));
  else if (target.id === "written") changeAnswer(q, target.value);
  else if ("blank" in target.dataset) {
    const values = [...(run.answers[q.id] || [])];
    values[Number(target.dataset.blank)] = target.value;
    changeAnswer(q, values);
  }
  const status = document.querySelector("#quiz-status");
  status.className = "sr-only";
  status.textContent = "";
});

content.addEventListener("click", event => {
  const actionButton = event.target.closest("button[data-action]");
  if (!actionButton) return;
  const action = actionButton.dataset.action;
  if (action === "step" || action === "all-steps") return revealSteps(action === "all-steps", actionButton);
  if (action === "complete") {
    const id = route.split("/")[1];
    state.completed[id] = !state.completed[id];
    actionButton.setAttribute("aria-pressed", String(state.completed[id]));
    actionButton.textContent = state.completed[id] ? t("isDone") : t("markDone");
    save();
    drawIndex();
    return;
  }
  if (action === "launch") {
    const key = document.querySelector("#scope").value;
    return goToRun(key, state.runs[key]?.finished);
  }
  if (action === "start-test") return goToRun("test", state.runs.test?.finished);
  if (action === "mistakes") return goToRun("mistakes", state.runs.mistakes?.finished);
  if (action === "export") return exportResults();
  if (!run) return;
  if (action === "restart") return goToRun(run.key, true);
  if (run.finished) return;
  const q = currentQuestion();
  if (action === "q-prev" || action === "q-next") return moveQuestion(action === "q-prev" ? -1 : 1);
  if (action === "hint") {
    hintCount++;
    renderQuiz();
    document.querySelector(".quiz-help")?.focus({ preventScroll: true });
    return;
  }
  if (action === "add-piece" || action === "remove-piece") {
    const piece = Number(actionButton.dataset.piece);
    const old = run.answers[q.id] || [];
    const value = action === "add-piece" ? [...old, piece] : old.filter(i => i !== piece);
    changeAnswer(q, value);
    const ordering = document.querySelector("#ordering");
    ordering.innerHTML = orderMarkup(q, value, false);
    ordering.querySelector(`button[data-piece="${piece}"]`)?.focus({ preventScroll: true });
    return;
  }
  if (action === "finish-test") {
    const remaining = run.ids.filter(id => !answered(questions.get(id), run.answers[id])).length;
    document.querySelector("#test-summary").textContent = remaining ? t("unanswered")(num(remaining)) : t("allAnswered");
    const confirmation = document.querySelector("#test-confirm");
    confirmation.hidden = false;
    confirmation.querySelector("button").focus();
    return;
  }
  if (action === "cancel-finish") {
    document.querySelector("#test-confirm").hidden = true;
    document.querySelector('[data-action="finish-test"]').focus();
    return;
  }
  if (action === "confirm-test") return finishTest();
  if (action === "check") {
    const answer = run.answers[q.id];
    if (!answered(q, answer)) {
      const status = document.querySelector("#quiz-status");
      status.className = "notice";
      status.textContent = t("finishFirst");
      return;
    }
    if (q.type === "text") run.grades[q.id] = "shown";
    else {
      const correct = isCorrect(q, answer);
      run.grades[q.id] = correct;
      record(q, correct);
    }
  } else if (action === "self-yes" || action === "self-no") {
    const correct = action === "self-yes";
    run.grades[q.id] = correct;
    record(q, correct);
  } else return;
  save();
  renderQuiz();
  document.querySelector("#feedback")?.focus();
});

applyChrome();
refreshRoute(true);
</script>
</body>
</html>
