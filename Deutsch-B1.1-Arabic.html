, also `irgendeinen Stuhl`. Mit `mit` sagst du `mit irgendeinem Stuhl`."},{"text":"Bilde den Plural mit irgendwelch-","why":"Im Plural brauchst du den Stamm `irgendwelch-`. Nomen im Dativ Plural bekommen meist ein `-n`, wenn sie nicht schon auf `-n` oder `-s` enden: `mit irgendwelchen Stühlen`."},{"text":"Lies die Position der Verneinung","why":"Der Satz kann bedeuten, dass gerade dieser Tisch etwas Besonderes ist. `Das ist kein Tisch` dagegen sagt, dass es überhaupt kein Tisch ist."}],"explain":["Wenn du schreibst, bestimme zuerst, ob das Nomen Singular oder Plural ist. Dann bestimmst du das Genus (im Singular) und den Kasus. Vergleiche: `irgendein Laden öffnet`, `ich suche irgendeinen Laden`, `ich kaufe in irgendeinem Laden ein`. Das Nomen bleibt maskulin, nur seine Funktion im Satz ändert sich."],"pitfall":"`mit` verlangt den Dativ, und die Pluralform im Dativ ist `irgendwelchen`.","recall":["Warum unterscheidet sich das Wort in `irgendein Bild` und `irgendwelche Bilder`?","Das erste ist Singular neutral. Das zweite ist Plural und benutzt den Stamm `irgendwelch-`."],"links":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc"],"table":[["Kasus","Maskulin","Feminin","Neutrum","Plural"],["Nominativ","irgendein","irgendeine","irgendein","irgendwelche"],["Akkusativ","irgendeinen","irgendeine","irgendein","irgendwelche"],["Dativ","irgendeinem","irgendeiner","irgendeinem","irgendwelchen"]]},"pattern":["irgend-","+","ein- (Singular)","·","welch- (Plural)","+ Endung wie ein"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","suche"],["hl","irgendeinen"],["mf","Stuhl"]]},{"k":"main","parts":[["vf","Ich"],["v","suche"],["hl","irgendwelche"],["mf","Stühle"]]}]},{"id":"falls","chapter":3,"title":"الشرط المحتمل مع falls","german":"Konditionale Nebensätze mit falls","emoji":"☔","links":[["فهرس قواعد الوحدة 3 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["شرح القواعد، ص 35 من الكتاب · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"],["الشرط · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/997"]],"steps":[{"text":"حدّد الحدث غير المحسوم","example":"es regnet morgen","why":"الشرط هو هطول المطر. قد يحصل وقد لا يحصل. استعمال `falls` يقدّمه بوصفه حالة محتملة، وكثيرًا ما تكون غير مرجحة في السياق."},{"text":"اكتب الشرط كجملة تابعة","example":"Falls es morgen regnet, …","why":"ضع `falls` أولًا وانقل الفعل المصرف `regnet` إلى نهاية الجملة التابعة. مع فعل قابل للفصل تقول `falls sie morgen anruft` ببادئته المتصلة في النهاية."},{"text":"ابدأ النتيجة بالفعل إذا قدمت الشرط","example":"Falls es morgen regnet, bleiben wir zu Hause.","why":"يشغل الشرط كله الموقع الأول في الجملة الكلية، فيأتي `bleiben` بعد الفاصلة. ويمكن إبراز النتيجة بـ `dann`: `…, dann bleiben wir zu Hause`."},{"text":"قدّم النتيجة عند الحاجة","example":"Wir bleiben zu Hause, falls es morgen regnet.","why":"تبقى الجملة الرئيسية بترتيبها المعتاد. وتبقى الجملة التابعة منتهية بالفعل. إذا جاء الفعل مع مصدر فستجد المصرف آخرًا، مثل `falls du kommen kannst`."}],"explain":["تستطيع استعمال `wenn` أيضًا لشرط مفتوح، وهي أوسع استعمالًا وتشمل بعض العلاقات الزمنية. تميل `falls` إلى معنى الاحتياط وتأتي مع `doch` عندما تخالف الاحتمال المتوقع، مثل `Falls es doch regnet, nehmen wir Schirme mit`. راجع درس الشرط غير الواقعي إذا كان الشرط مناقضًا للواقع الحالي بدل أن يكون احتمالًا مفتوحًا."],"questions":[{"id":"falls-1","type":"cloze","topic":"falls","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"ضع الفعل anrufen في الفراغ.","grounded":false,"text":"Falls sie morgen {{1}}, sag mir Bescheid.","blanks":[["anruft"]],"explain":"ينتهي الشرط بالفعل المصرف المتصل anruft.","hints":["هل الفعل قابل للفصل في التابعة؟"],"de":{"prompt":"Setz das Verb `anrufen` in die Lücke.","explain":"Die Bedingung endet mit dem konjugierten, zusammengeschriebenen Verb `anruft`.","hints":["Ist das Verb im Nebensatz getrennt?"]}},{"id":"falls-2","type":"mcq","topic":"falls","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أي رابط يعبّر عن «في حال»؟","grounded":false,"options":["falls","weil","obwohl"],"answer":0,"explain":"falls للشرط، وweil للسبب، وobwohl للتنازل.","hints":["ابحث عن شرط ممكن."],"de":{"prompt":"Welche Konjunktion bedeutet „für den Fall, dass“?","explain":"`falls` für eine Bedingung, `weil` für einen Grund, `obwohl` für einen Gegensatz.","hints":["Such eine mögliche Bedingung."]}},{"id":"falls-3","type":"cloze","topic":"falls","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل بالفعل المصرف bleiben.","grounded":false,"text":"Falls es schneit, {{1}} wir zu Hause.","blanks":[["bleiben"]],"explain":"يأتي الفعل المصرف مباشرة بعد الفاصلة ما لم تستعمل dann.","hints":["الجملة التابعة الأولى تشغل موقعًا واحدًا."],"de":{"prompt":"Ergänze die konjugierte Form von `bleiben`.","explain":"Das konjugierte Verb steht direkt nach dem Komma, außer du benutzt `dann`.","hints":["Der Nebensatz vorne besetzt genau eine Position."]}},{"id":"falls-4","type":"order","topic":"falls","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"رتّب الشرط قبل النتيجة. اجعل du قبل heute.","grounded":false,"items":["Falls","du","heute","Zeit hast,","besuchen","wir dich."],"explain":"hast يغلق التابعة. besuchen يفتتح النتيجة بعد الفاصلة.","hints":["ضع الفعل المصرف لكل جزء في موقعه."],"de":{"prompt":"Ordne: Bedingung vor der Folge. Setz `du` vor `heute`.","explain":"`hast` schließt den Nebensatz. `besuchen` eröffnet die Folge nach dem Komma.","hints":["Setz das konjugierte Verb jedes Teils an seine Position."]}},{"id":"falls-5","type":"cloze","topic":"falls","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل الشرط بالمصدر ثم الفعل الناقص المصرف.","grounded":false,"text":"Ruf an, falls du nicht {{1}} {{2}}. (kommen / können)","blanks":[["kommen"],["kannst"]],"explain":"المصدر kommen ثم kannst مع du.","hints":["يأتي المصرف أخيرًا في التابعة هنا."],"de":{"prompt":"Ergänze die Bedingung mit dem Infinitiv und dann dem konjugierten Modalverb.","explain":"Erst der Infinitiv `kommen`, dann `kannst` mit `du`.","hints":["Das konjugierte Verb steht hier im Nebensatz zuletzt."]}},{"id":"falls-6","type":"mcq","topic":"falls","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"اختر الجملة التي تعرض احتمالًا مفتوحًا بشأن الغد.","grounded":false,"options":["Falls ich morgen Zeit habe, komme ich.","Wenn ich Zeit hätte, würde ich kommen.","Da ich morgen Zeit habe, komme ich."],"answer":0,"explain":"falls يعرض احتمالًا. hätte وwürde هنا يقدمان افتراضًا غير واقعي، وda يذكر سببًا.","hints":["هل الوقت احتمال، أو واقع مفترض، أو سبب معلوم؟"],"de":{"prompt":"Wähle den Satz, der eine offene Möglichkeit für morgen ausdrückt.","explain":"`falls` zeigt eine Möglichkeit. `hätte` und `würde` stellen hier eine irreale Annahme dar, `da` nennt einen Grund.","hints":["Ist die Zeit eine Möglichkeit, eine angenommene Wirklichkeit oder ein bekannter Grund?"]}},{"id":"falls-7","type":"text","topic":"falls","difficulty":3,"src":"TELC ص 28–35 (العينة)","prompt":"أعد ترتيب Ich rufe dich an, falls ich Hilfe brauche بحيث تبدأ بـ Falls وتحتفظ بالمعنى.","grounded":false,"answer":"Falls ich Hilfe brauche, rufe ich dich an.","explain":"ينتهي التابع بـ brauche. يبدأ الجزء الرئيسي بـ rufe، وتبقى an في نهايته.","hints":["ضع الشرط في الموضع الأول واستعد تركيب anrufen."],"de":{"prompt":"Stell `Ich rufe dich an, falls ich Hilfe brauche` so um, dass der Satz mit `Falls` beginnt und die Bedeutung bleibt.","explain":"Der Nebensatz endet mit `brauche`. Der Hauptsatz beginnt mit `rufe`, und `an` bleibt an seinem Ende.","hints":["Setz die Bedingung auf Position 1 und bau `anrufen` wieder zusammen."]}},{"id":"falls-8","type":"text","topic":"falls","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Falls du brauchst Hilfe, ruf mich an.","answer":"Falls du Hilfe brauchst, ruf mich an.","explain":"ضع `brauchst` آخر الشرط. تبقى نتيجة الأمر `ruf mich an` في ترتيبها.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Setz `brauchst` ans Ende der Bedingung. Die Folge im Imperativ `ruf mich an` behält ihre Wortstellung.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"falls-9","type":"text","topic":"falls","difficulty":2,"prompt":"هل تقع `kannst` قبل `kommen` في `falls du morgen kommen kannst`؟","answer":"تأتي `kannst` أخيرًا لأنها الفعل المصرف في الجملة التابعة.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Steht `kannst` in `falls du morgen kommen kannst` vor `kommen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Nein, `kannst` steht zuletzt, weil es das konjugierte Verb im Nebensatz ist."}}],"src":"TELC ص 28–35 (العينة)","grounded":false,"lead":"حين تضع خطة لما قد يحدث، تساعدك `falls` على التعبير عن معنى «في حال». تعلّم كيف تقسم الجملة إلى شرط ونتيجة وتضع كل فعل في موضعه.","example":"Falls es morgen regnet, bleiben wir zu Hause.","translation":"في حال هطل المطر غدًا، سنبقى في المنزل.","pitfall":["Falls du brauchst Hilfe, ruf mich an. → Falls du Hilfe brauchst, ruf mich an.","ضع `brauchst` آخر الشرط. تبقى نتيجة الأمر `ruf mich an` في ترتيبها."],"recall":["هل تقع `kannst` قبل `kommen` في `falls du morgen kommen kannst`؟","تأتي `kannst` أخيرًا لأنها الفعل المصرف في الجملة التابعة."],"de":{"title":"Konditionalsätze mit falls","lead":"Wenn du planst, was passieren könnte, hilft dir `falls` mit der Bedeutung „für den Fall, dass“. Lern, den Satz in Bedingung und Folge zu teilen und jedes Verb an seine Position zu setzen.","steps":[{"text":"Bestimme das unsichere Ereignis","why":"Die Bedingung ist der Regen. Er kann kommen oder nicht. Mit `falls` stellst du ihn als mögliche – oft eher unwahrscheinliche – Situation dar."},{"text":"Schreib die Bedingung als Nebensatz","why":"Setz `falls` an den Anfang und das konjugierte Verb `regnet` ans Ende. Bei trennbaren Verben sagst du `falls sie morgen anruft` – zusammengeschrieben am Ende."},{"text":"Beginne die Folge mit dem Verb, wenn die Bedingung vorne steht","why":"Die ganze Bedingung besetzt Position 1 des Gesamtsatzes, deshalb kommt `bleiben` direkt nach dem Komma. Mit `dann` kannst du die Folge betonen: `…, dann bleiben wir zu Hause`."},{"text":"Stell die Folge bei Bedarf nach vorn","why":"Der Hauptsatz behält seine normale Wortstellung, der Nebensatz endet weiter mit dem Verb. Mit einem Infinitiv steht das konjugierte Verb ganz am Ende: `falls du kommen kannst`."}],"explain":["Für eine offene Bedingung kannst du auch `wenn` benutzen; es ist allgemeiner und deckt auch zeitliche Beziehungen ab. `falls` betont eher die Vorsorge und steht mit `doch`, wenn etwas gegen die Erwartung eintritt: `Falls es doch regnet, nehmen wir Schirme mit`. Schau dir die Lektion zu irrealen Bedingungen an, wenn die Bedingung der Wirklichkeit widerspricht, statt offen zu sein."],"pitfall":"Setz `brauchst` ans Ende der Bedingung. Die Folge im Imperativ `ruf mich an` behält ihre Wortstellung.","recall":["Steht `kannst` in `falls du morgen kommen kannst` vor `kommen`?","Nein, `kannst` steht zuletzt, weil es das konjugierte Verb im Nebensatz ist."],"links":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc","Konditionalsätze · grammis"]},"pattern":["Falls … Verb",",","Verb + Subjekt …"],"frames":[{"k":"sub","parts":[["c","Falls"],["mf","es morgen"],["ve","regnet"]]},{"k":"main","parts":[["vf","(Falls-Satz)"],["v","bleiben"],["mf","wir zu Hause"]]}]},{"id":"irreale-bedingung","chapter":3,"title":"الشرط غير الواقعي","german":"Irreale Bedingungssätze","emoji":"💭","links":[["فهرس قواعد الوحدة 3 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["شرح القواعد، ص 35 من الكتاب · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"],["الشرط · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/997"]],"steps":[{"text":"حدّد الواقع قبل صياغة عكسه","example":"Ich habe wenig Zeit. Ich koche selten.","why":"ضع أمامك الشرط والنتيجة المتخيلين. هنا يمتلك المتكلم قليلًا من الوقت ويتخيل حالة يكون فيها الوقت أكثر."},{"text":"اصنع الشرط بـ Konjunktiv II","example":"Wenn ich mehr Zeit hätte, …","why":"من `haben` تأتي `hätte`، ومن `sein` تأتي `wäre`. استخدمهما مباشرة. ويأتي الفعل المصرف في آخر الجزء الذي يبدأ بـ `wenn`."},{"text":"اصنع النتيجة الافتراضية","example":"…, würde ich öfter kochen.","why":"مع أفعال كثيرة تستعمل `würde` المصرف ثم مصدر الفعل في النهاية. وإذا كانت النتيجة قدرةً فقل `könnte ich öfter kochen`. الفعل المصرف يأتي بعد الفاصلة إذا تقدم الشرط."},{"text":"راجع تصريف كل جزء عند تبديل ترتيبه","example":"Ich könnte hier arbeiten, wenn das Zimmer größer wäre.","why":"يمكن تقديم النتيجة. حافظ على `könnte` في الموقع الثاني من الجملة الرئيسية و`wäre` في نهاية التابعة. وفي `wenn er hier arbeiten würde` تأتي `würde` بعد المصدر في هذا النمط."}],"explain":["احفظ الصيغ الشائعة بحسب الشخص: `ich hätte / du hättest / wir hätten`، `ich wäre / du wärst / wir wären`، `ich würde / du würdest / wir würden`، `ich könnte / du könntest / wir könnten`. وقارن `Falls ich morgen Zeit habe, komme ich` (احتمال مفتوح) مع `Wenn ich Zeit hätte, würde ich kommen` (يُفهم من السياق أن وقتي غير متاح)."],"questions":[{"id":"irreale-bedingung-1","type":"cloze","topic":"irreale-bedingung","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"ضع haben في صيغة الافتراض.","grounded":false,"text":"Wenn ich genug Geld {{1}}, würde ich reisen.","blanks":[["hätte"]],"explain":"hätte هي Konjunktiv II للمفرد الأول من haben.","hints":["استعمل الصيغة القصيرة الشائعة من haben."],"de":{"prompt":"Setz `haben` in die irreale Form.","explain":"`hätte` ist der Konjunktiv II von `haben` in der 1. Person Singular.","hints":["Benutze die kurze, häufige Form von `haben`."]}},{"id":"irreale-bedingung-2","type":"cloze","topic":"irreale-bedingung","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"ضع sein في صيغة الافتراض.","grounded":false,"text":"Wenn das Büro näher {{1}}, würde ich laufen.","blanks":[["wäre"]],"explain":"wäre هي الصيغة مع das Büro المفرد.","hints":["استعمل الصيغة الشائعة من sein."],"de":{"prompt":"Setz `sein` in die irreale Form.","explain":"`wäre` ist die Form mit dem Singular `das Büro`.","hints":["Benutze die häufige Form von `sein`."]}},{"id":"irreale-bedingung-3","type":"mcq","topic":"irreale-bedingung","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أي جملة تعني أن الحي غير هادئ في الواقع؟","grounded":false,"options":["Wenn der Stadtteil ruhiger wäre, würde ich dort wohnen.","Falls der Stadtteil ruhig ist, ziehe ich dorthin.","Weil der Stadtteil ruhig ist, wohne ich dort."],"answer":0,"explain":"wäre وwürde يعرضان وضعًا متخيلًا. falls يترك الاحتمال مفتوحًا، وweil يقرّر سببًا.","hints":["ابحث عن الافتراض المضاد للواقع."],"de":{"prompt":"Welcher Satz bedeutet, dass das Viertel in Wirklichkeit nicht ruhig ist?","explain":"`wäre` und `würde` stellen eine vorgestellte Situation dar. `falls` lässt die Möglichkeit offen, `weil` nennt einen Grund.","hints":["Such die Annahme gegen die Wirklichkeit."]}},{"id":"irreale-bedingung-4","type":"cloze","topic":"irreale-bedingung","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"اكتب الصيغة من sein ثم können.","grounded":false,"text":"Wenn die Räume größer {{1}}, {{2}} wir dort üben.","blanks":[["wären"],["könnten"]],"explain":"wären توافق die Räume، وkönnten توافق wir. يأتي könnte بصيغة الجمع بعد الفاصلة.","hints":["تحقق من الجمع في الجملتين."],"de":{"prompt":"Schreib die Form von `sein` und dann von `können`.","explain":"`wären` passt zu `die Räume`, `könnten` zu `wir`. Nach dem Komma steht die Pluralform.","hints":["Prüf den Plural in beiden Sätzen."]}},{"id":"irreale-bedingung-5","type":"order","topic":"irreale-bedingung","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"رتّب الشرط قبل النتيجة.","grounded":false,"items":["Wenn ich","mehr Zeit","hätte,","würde ich","jeden Tag","kochen."],"explain":"hätte قبل الفاصلة، وبعدها würde ثم الفاعل، وينتهي الجزء بـ kochen.","hints":["حدّد أين ينتهي الشرط وأين يأتي المصدر."],"de":{"prompt":"Ordne: Bedingung vor der Folge.","explain":"`hätte` steht vor dem Komma, danach `würde`, dann das Subjekt, und der Teil endet mit `kochen`.","hints":["Bestimme, wo die Bedingung endet und wo der Infinitiv steht."]}},{"id":"irreale-bedingung-6","type":"mcq","topic":"irreale-bedingung","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"أين الخطأ في Wenn sie länger hier bleiben würde, lernt sie mehr، إذا أردت افتراضًا في الجانبين؟","grounded":false,"options":["حوّل lernt إلى würde … lernen.","حوّل würde إلى wird مع إبقاء lernt.","ضع bleiben قبل sie مباشرةً."],"answer":0,"explain":"في الافتراض المتسق نقول …, würde sie mehr lernen. الجزء الأول فيه Konjunktiv II بالفعل.","hints":["أي فعل بقي في صيغة الواقع؟"],"de":{"prompt":"Wo ist der Fehler in `Wenn sie länger hier bleiben würde, lernt sie mehr`, wenn beide Teile irreal sein sollen?","explain":"Konsequent irreal heißt es: `…, würde sie mehr lernen`. Der erste Teil hat schon Konjunktiv II.","hints":["Welches Verb steht noch im Indikativ?"],"options":["`lernt` muss zu `würde … lernen` werden.","`würde` muss zu `wird` werden, `lernt` bleibt.","`bleiben` muss direkt vor `sie` stehen."]}},{"id":"irreale-bedingung-7","type":"text","topic":"irreale-bedingung","difficulty":3,"src":"TELC ص 28–35 (العينة)","prompt":"عبّر عن العكس الافتراضي. Du bist nicht hier. Wir können nicht zusammen lernen. ابدأ بـ Wenn du.","grounded":false,"answer":"Wenn du hier wärst, könnten wir zusammen lernen.","explain":"wärst تتبع du وتنهي الشرط. könnten تتبع wir وتأتي مباشرة بعد الفاصلة.","hints":["استعمل Konjunktiv II لكل من sein وkönnen."],"de":{"prompt":"Drück das irreale Gegenteil aus: `Du bist nicht hier. Wir können nicht zusammen lernen.` Beginne mit `Wenn du`.","explain":"`wärst` passt zu `du` und beendet die Bedingung. `könnten` passt zu `wir` und steht direkt nach dem Komma.","hints":["Benutze den Konjunktiv II von `sein` und `können`."]}},{"id":"irreale-bedingung-8","type":"text","topic":"irreale-bedingung","difficulty":3,"prompt":"اجعل الشرط والنتيجة غير واقعيين. صحّح الجملة واشرح سبب التعديل.","context":"Wenn ich mehr Zeit hätte, koche ich öfter.","answer":"Wenn ich mehr Zeit hätte, würde ich öfter kochen.","explain":"الشرط مبني على افتراض يخالف الواقع الحالي. يحمل `hätte` هذا المعنى في الشرط، ويحتاج فعل النتيجة أيضًا إلى `würde … kochen` في هذا النمط.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Mach Bedingung und Folge irreal. Korrigiere den Satz und erkläre die Änderung.","explain":"Die Bedingung beruht auf einer Annahme gegen die Wirklichkeit. `hätte` trägt diese Bedeutung in der Bedingung – auch die Folge braucht in diesem Muster `würde … kochen`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"irreale-bedingung-9","type":"text","topic":"irreale-bedingung","difficulty":2,"prompt":"ماذا تفهم من `Wenn der Weg kürzer wäre, könnten wir laufen`؟","answer":"المسار طويل في الواقع بحسب المتكلم. إمكان المشي نتيجة افتراضية.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Was verstehst du aus `Wenn der Weg kürzer wäre, könnten wir laufen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"In Wirklichkeit ist der Weg lang (laut Sprecher). Dass man laufen könnte, ist nur eine vorgestellte Folge."}}],"src":"TELC ص 28–35 (العينة)","grounded":false,"table":[["الضمير","sein","haben","können","würde + Infinitiv"],["ich","wäre","hätte","könnte","würde"],["du","wärst / wärest","hättest","könntest","würdest"],["er / sie / es","wäre","hätte","könnte","würde"],["wir / sie / Sie","wären","hätten","könnten","würden"],["ihr","wärt / wäret","hättet","könntet","würdet"]],"lead":"تبدأ من وضع تعرف أنه غير متحقق الآن، مثل عدم امتلاك وقت، ثم تتخيّل نتيجته لو تغيّر. يظهر هذا البعد الافتراضي في صيغتي الشرط والنتيجة.","example":"Wenn ich mehr Zeit hätte, würde ich öfter kochen.","translation":"لو كان عندي وقت أكثر، لطبخت أكثر.","pitfall":["Wenn ich mehr Zeit hätte, koche ich öfter. → Wenn ich mehr Zeit hätte, würde ich öfter kochen.","الشرط مبني على افتراض يخالف الواقع الحالي. يحمل `hätte` هذا المعنى في الشرط، ويحتاج فعل النتيجة أيضًا إلى `würde … kochen` في هذا النمط."],"recall":["ماذا تفهم من `Wenn der Weg kürzer wäre, könnten wir laufen`؟","المسار طويل في الواقع بحسب المتكلم. إمكان المشي نتيجة افتراضية."],"de":{"title":"Irreale Bedingungssätze","lead":"Du gehst von einer Situation aus, die jetzt nicht wahr ist – zum Beispiel, dass du keine Zeit hast – und stellst dir die Folge vor, wenn sie sich ändern würde. Dieses „Als-ob“ zeigt sich in Bedingung und Folge.","steps":[{"text":"Bestimme die Wirklichkeit, bevor du sie umdrehst","why":"Leg dir Bedingung und vorgestellte Folge zurecht. Hier hat die Person wenig Zeit und stellt sich vor, sie hätte mehr."},{"text":"Bilde die Bedingung im Konjunktiv II","why":"Aus `haben` wird `hätte`, aus `sein` wird `wäre` – benutze sie direkt. Das konjugierte Verb steht am Ende des `wenn`-Teils."},{"text":"Bilde die vorgestellte Folge","why":"Bei vielen Verben benutzt du konjugiertes `würde` und den Infinitiv am Ende. Geht es um eine Möglichkeit, sag `könnte ich öfter kochen`. Steht die Bedingung vorne, kommt das konjugierte Verb direkt nach dem Komma."},{"text":"Prüfe die Formen, wenn du die Reihenfolge tauschst","why":"Die Folge kann auch vorne stehen. `könnte` bleibt auf Position 2 im Hauptsatz, `wäre` am Ende des Nebensatzes. In `wenn er hier arbeiten würde` steht `würde` nach dem Infinitiv."}],"explain":["Lern die häufigen Formen nach Person: `ich hätte / du hättest / wir hätten`, `ich wäre / du wärst / wir wären`, `ich würde / du würdest / wir würden`, `ich könnte / du könntest / wir könnten`. Vergleiche `Falls ich morgen Zeit habe, komme ich` (offene Möglichkeit) mit `Wenn ich Zeit hätte, würde ich kommen` (aus dem Kontext: Ich habe keine Zeit)."],"pitfall":"Die Bedingung beruht auf einer Annahme gegen die Wirklichkeit. `hätte` trägt diese Bedeutung in der Bedingung – auch die Folge braucht in diesem Muster `würde … kochen`.","recall":["Was verstehst du aus `Wenn der Weg kürzer wäre, könnten wir laufen`?","In Wirklichkeit ist der Weg lang (laut Sprecher). Dass man laufen könnte, ist nur eine vorgestellte Folge."],"links":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc","Konditionalsätze · grammis"],"table":[["Pronomen","sein","haben","können","würde + Infinitiv"],["ich","wäre","hätte","könnte","würde"],["du","wärst / wärest","hättest","könntest","würdest"],["er / sie / es","wäre","hätte","könnte","würde"],["wir / sie / Sie","wären","hätten","könnten","würden"],["ihr","wärt / wäret","hättet","könntet","würdet"]]},"pattern":["Wenn … hätte / wäre",",","würde … + Infinitiv"],"frames":[{"k":"sub","parts":[["c","Wenn"],["mf","ich mehr Zeit"],["ve","hätte"]]},{"k":"main","parts":[["vf","(Wenn-Satz)"],["v","würde"],["mf","ich öfter"],["ve","kochen"]]}]},{"id":"genitiv","chapter":4,"title":"الإضافة وحالة Genitiv","german":"Der Genitiv","emoji":"🏷️","links":[["فهرس قواعد الوحدة 4 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["علامات الجينيتيف · grammis","https://grammis.ids-mannheim.de/korpusgrammatik/6941"]],"steps":[{"text":"حدّد الاسم الموصوف وصاحب الإضافة","example":"der Eingang + das Gebäude","why":"الاسم الرئيسي هو `Eingang`. تحدد وظيفته في الجملة أداته الخاصة. أما `Gebäude` فيحدّد إلى ماذا ينتمي المدخل."},{"text":"صرّف أداة صاحب الإضافة","example":"des Mannes · der Frau · des Kindes · der Kinder","why":"تأتي `des` مع المذكر والمحايد المفرد، و`der` مع المؤنث المفرد والجمع. مع الأداة النكرة تقول `eines Mannes` و`einer Frau` و`eines Kindes`."},{"text":"افحص نهاية الاسم","example":"des Tages · des Hauses · des Computers","why":"يأخذ كثير من الأسماء المذكرة والمحايدة المفردة `-s` أو `-es`. في كلمات مثل `Haus` تظهر `-es`. يُحفظ الشكل مع الاسم عندما يختلف الاستعمال. لا تضف هذه النهاية إلى المؤنث أو الجمع."},{"text":"راجع الاستثناء الشائع والأسماء العلم","example":"des Studenten · Annas Schlüssel","why":"المذكر الضعيف مثل `Student` يأخذ `-en` في الجينيتيف. ومع اسم العلم يمكنك وضع المالك قبل الشيء وإضافة `-s` مثل `Annas`. وتظهر فاصلة عليا مع اسم ينتهي بصوت صفيري مثل `Max’ Schlüssel`."}],"explain":["في `Ich sehe den Eingang des Gebäudes` تغيّر `Eingang` إلى الأكوزاتيف لأنه مفعول `sehe`، وبقي `des Gebäudes` جينيتيف لأنه يصف المدخل. وفي المحادثة تسمع كثيرًا `der Eingang von dem Gebäude` أو `vom Gebäude`. استعمل الجينيتيف في التمرين حين يُطلب منك، وتدرّب على تمييزه في النصوص الرسمية."],"questions":[{"id":"genitiv-1","type":"cloze","topic":"genitiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الإضافة من der Lehrer.","grounded":false,"text":"der Schlüssel {{1}} {{2}}","blanks":[["des"],["Lehrers"]],"explain":"der Lehrer يصبح des Lehrers.","hints":["أداة المذكر ونهاية الاسم كلاهما مهم."],"de":{"prompt":"Ergänze den Genitiv von `der Lehrer`.","explain":"`der Lehrer` wird zu `des Lehrers`.","hints":["Artikel und Nomen-Endung sind beide wichtig."]}},{"id":"genitiv-2","type":"cloze","topic":"genitiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الأداة لاسم مؤنث.","grounded":false,"text":"die Adresse {{1}} Schule","blanks":[["der"]],"explain":"أداة المؤنث في الجينيتيف der.","hints":["حدّد حالة مالك العنوان."],"de":{"prompt":"Ergänze den Artikel für ein feminines Nomen.","explain":"Der feminine Artikel im Genitiv ist `der`.","hints":["Bestimme den Kasus des „Besitzers“ der Adresse."]}},{"id":"genitiv-3","type":"mcq","topic":"genitiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي مجموعة تترجم «ألعاب الأطفال»؟","grounded":false,"options":["die Spielsachen der Kinder","die Spielsachen den Kindern","die Spielsachen des Kinder"],"answer":0,"explain":"der Kinder جمع جينيتيف. den Kindern داتيف، وdes تخص المذكر أو المحايد المفرد.","hints":["أداة الجينيتيف للجمع كأداة المؤنث."],"de":{"prompt":"Welche Gruppe heißt „das Spielzeug der Kinder“?","explain":"`der Kinder` ist Genitiv Plural. `den Kindern` ist Dativ, `des` gilt für Maskulinum oder Neutrum Singular.","hints":["Der Genitivartikel im Plural ist wie der feminine."]}},{"id":"genitiv-4","type":"cloze","topic":"genitiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بإضافة الاسم المحايد والمذكر الضعيف.","grounded":false,"text":"das Dach {{1}} (das Haus) · die Tasche {{2}} (der Student)","blanks":[["des Hauses"],["des Studenten"]],"explain":"Haus يأخذ -es. Student اسم مذكر ضعيف يأخذ -en.","hints":["أضف النهاية المناسبة لكل اسم بعد des."],"de":{"prompt":"Ergänze den Genitiv beim neutralen Nomen und beim schwachen Maskulinum.","explain":"`Haus` bekommt `-es`. `Student` ist ein schwaches Maskulinum und bekommt `-en`.","hints":["Häng nach `des` an jedes Nomen die passende Endung."]}},{"id":"genitiv-5","type":"mcq","topic":"genitiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي تحليل صحيح لـ Ich sehe den Garten des Nachbarn؟","grounded":false,"options":["den Garten أكوزاتيف، وdes Nachbarn جينيتيف.","den Garten جينيتيف، وdes Nachbarn أكوزاتيف.","المجموعتان في الأكوزاتيف."],"answer":0,"explain":"الفعل يحدد حالة Garten. علاقة الإضافة تحدد حالة Nachbar.","hints":["اسأل ماذا أرى ثم لمن الحديقة."],"de":{"prompt":"Welche Analyse von `Ich sehe den Garten des Nachbarn` ist richtig?","explain":"Das Verb bestimmt den Kasus von `Garten`. Die Genitivbeziehung bestimmt den Kasus von `Nachbar`.","hints":["Frag: Was sehe ich? Und: Wessen Garten?"],"options":["`den Garten` ist Akkusativ, `des Nachbarn` ist Genitiv.","`den Garten` ist Genitiv, `des Nachbarn` ist Akkusativ.","Beide Gruppen stehen im Akkusativ."]}},{"id":"genitiv-6","type":"cloze","topic":"genitiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"اكتب الإضافة مع اسم العلم أولًا.","grounded":false,"text":"{{1}} Tasche (Anna) · {{2}} Schlüssel (Max)","blanks":[["Annas"],["Max’","Max'"]],"explain":"تلحق s باسم Anna. مع Max تبيّن الفاصلة العليا الملكية بدل إضافة s جديدة.","hints":["انتبه إلى آخر صوت في Max."],"de":{"prompt":"Schreib den Genitiv mit dem Namen vorne.","explain":"An `Anna` wird `s` angehängt. Bei `Max` zeigt der Apostroph den Besitz, statt eines weiteren `s`.","hints":["Achte auf den letzten Laut von `Max`."]}},{"id":"genitiv-7","type":"text","topic":"genitiv","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Das ist der Eingang von einem Gebäude إلى جينيتيف نكرة.","grounded":false,"answer":"Das ist der Eingang eines Gebäudes.","explain":"يصبح einem هنا eines لأن الحالة تغيّرت. والاسم Gebäude يأخذ -s.","hints":["حوّل أداة النكرة المحايدة وأضف نهاية الاسم."],"de":{"prompt":"Forme `Das ist der Eingang von einem Gebäude` in einen unbestimmten Genitiv um.","explain":"`einem` wird hier zu `eines`, weil sich der Kasus ändert, und `Gebäude` bekommt `-s`.","hints":["Ändere den neutralen unbestimmten Artikel und häng die Endung ans Nomen."]}},{"id":"genitiv-8","type":"text","topic":"genitiv","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"die Tür des Haus","answer":"die Tür des Hauses","explain":"أداة المالك المحايد `des` صحيحة. يحتاج اسم `Haus` أيضًا إلى `-es`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Artikel `des` für den neutralen Besitzer ist richtig. Das Nomen `Haus` braucht aber zusätzlich `-es`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"genitiv-9","type":"text","topic":"genitiv","difficulty":2,"prompt":"في `die Fahrräder der Kinder` هل `Kinder` مفرد مؤنث؟","answer":"هو جمع. أداة الجينيتيف `der` مشتركة بين المؤنث المفرد والجمع.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Ist `Kinder` in `die Fahrräder der Kinder` ein femininer Singular?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Nein, es ist Plural. Der Genitivartikel `der` ist bei Femininum Singular und Plural gleich."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"table":[["الأداة","مذكر","مؤنث","محايد","جمع"],["معرّفة","des Mannes","der Frau","des Kindes","der Kinder"],["نكرة / ملكية","eines Mannes","einer Frau","eines Kindes","meiner Kinder"]],"lead":"تربط حالة الجينيتيف اسمًا باسم آخر لتبين صاحب الشيء أو ما ينتمي إليه. يمكنك تصورها على هيئة سؤال `Wessen?`، أي «لمن؟» أو «الخاص بمَن أو بماذا؟».","example":"der Eingang des Gebäudes","translation":"مدخل المبنى.","pitfall":["die Tür des Haus → die Tür des Hauses","أداة المالك المحايد `des` صحيحة. يحتاج اسم `Haus` أيضًا إلى `-es`."],"recall":["في `die Fahrräder der Kinder` هل `Kinder` مفرد مؤنث؟","هو جمع. أداة الجينيتيف `der` مشتركة بين المؤنث المفرد والجمع."],"de":{"title":"Der Genitiv","lead":"Der Genitiv verbindet ein Nomen mit einem anderen und zeigt, wem etwas gehört oder wozu es gehört. Denk an die Frage `Wessen?`.","steps":[{"text":"Bestimme das Hauptnomen und den „Besitzer“","why":"Das Hauptnomen ist `Eingang`; seine Funktion im Satz bestimmt seinen Artikel. `Gebäude` zeigt, wozu der Eingang gehört."},{"text":"Dekliniere den Artikel des Besitzers","why":"`des` steht bei Maskulinum und Neutrum im Singular, `der` bei Femininum und Plural. Mit unbestimmtem Artikel: `eines Mannes`, `einer Frau`, `eines Kindes`."},{"text":"Prüfe die Endung des Nomens","why":"Viele maskuline und neutrale Nomen bekommen im Singular `-s` oder `-es`. Bei Wörtern wie `Haus` steht `-es`. Lern die Form mit dem Nomen, wenn es Varianten gibt. Feminine Nomen und Plural bekommen diese Endung nicht."},{"text":"Merk dir die häufige Ausnahme und Eigennamen","why":"Schwache Maskulina wie `Student` bekommen im Genitiv `-en`. Bei Namen kannst du den Besitzer vorne nennen und `-s` anhängen: `Annas`. Endet der Name auf einen s-Laut, steht ein Apostroph: `Max’ Schlüssel`."}],"explain":["In `Ich sehe den Eingang des Gebäudes` steht `Eingang` im Akkusativ, weil es Objekt von `sehe` ist; `des Gebäudes` bleibt Genitiv, weil es den Eingang beschreibt. Im Gespräch hörst du oft `der Eingang von dem Gebäude` oder `vom Gebäude`. Benutze den Genitiv in der Übung, wenn er verlangt wird, und üb, ihn in formellen Texten zu erkennen."],"pitfall":"Der Artikel `des` für den neutralen Besitzer ist richtig. Das Nomen `Haus` braucht aber zusätzlich `-es`.","recall":["Ist `Kinder` in `die Fahrräder der Kinder` ein femininer Singular?","Nein, es ist Plural. Der Genitivartikel `der` ist bei Femininum Singular und Plural gleich."],"links":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Genitivmarkierung · grammis"],"table":[["Artikel","Maskulin","Feminin","Neutrum","Plural"],["bestimmt","des Mannes","der Frau","des Kindes","der Kinder"],["unbestimmt / Possessiv","eines Mannes","einer Frau","eines Kindes","meiner Kinder"]]},"pattern":["Nomen","+","des …(e)s / der …"],"frames":[{"k":"np","parts":[["n","der Eingang"],["hl","des Gebäudes"]]},{"k":"main","parts":[["vf","Ich"],["v","sehe"],["mf","den Eingang"],["hl","des Gebäudes"]]}]},{"id":"genitiv-praep","chapter":4,"title":"حروف الجر التي تطلب Genitiv","german":"Präpositionen mit Genitiv","emoji":"🧭","links":[["فهرس قواعد الوحدة 4 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["علامات الجينيتيف · grammis","https://grammis.ids-mannheim.de/korpusgrammatik/6941"]],"steps":[{"text":"اختر حرف الجر من المعنى","example":"wegen · trotz · während","why":"تعني `wegen` «بسبب»، و`trotz` «رغم»، و`während` «أثناء» حين تسبق اسمًا. يُدرَّب هنا على الصيغة المعيارية بالجينيتيف."},{"text":"ميّز المكان والوقت والاستبدال","example":"innerhalb einer Woche · außerhalb der Stadt · statt eines Briefes","why":"تدل `innerhalb` على ما يقع داخل نطاق، و`außerhalb` خارجه، و`statt/anstatt` على بديل. وانظر إلى الأداة والاسم بعد الحرف معًا."},{"text":"ابنِ المجموعة حسب الجنس","example":"wegen des Regens · trotz der Kälte","why":"في المذكر يتغير شكل الأداة ويأخذ الاسم نهايته هنا. في المؤنث تظهر الحالة على الأداة `der` ويبقى الاسم `Kälte` كما هو."},{"text":"حدّد هل بعد الحرف اسم أم جملة","example":"während des Kurses · während der Kurs läuft","why":"في الأولى `während` حرف جر مع مجموعة اسمية. في الثانية رابط لجملة تابعة، و`der Kurs` فاعل في الرفع، والفعل `läuft` في آخرها."}],"explain":["قد تسمع الداتيف مع بعض هذه الحروف، وخصوصًا `wegen` في المحادثة. في هذه التمارين تدرب على الجينيتيف بعد الحروف المذكورة. إذا قدمت المجموعة في الرئيسية فستشغل موضعًا واحدًا، مثل `Trotz des Regens gehen wir hinaus`، لذلك يأتي الفعل المصرف بعدها مباشرة."],"questions":[{"id":"genitiv-praep-1","type":"cloze","topic":"genitiv-praep","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بسبب الانتقال، مع der Umzug.","grounded":false,"text":"Wegen {{1}} bleibt der Laden zu.","blanks":[["des Umzugs"]],"explain":"الأداة des ويأخذ Umzug النهاية -s.","hints":["استعمل جينيتيف المذكر."],"de":{"prompt":"Ergänze „wegen des Umzugs“ mit `der Umzug`.","explain":"Der Artikel ist `des`, und `Umzug` bekommt die Endung `-s`.","hints":["Benutze den Genitiv maskulin."]}},{"id":"genitiv-praep-2","type":"cloze","topic":"genitiv-praep","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل برغم البرد، مع die Kälte.","grounded":false,"text":"Trotz {{1}} gehen wir spazieren.","blanks":[["der Kälte"]],"explain":"تتحول die إلى der في الجينيتيف.","hints":["الاسم مؤنث."],"de":{"prompt":"Ergänze „trotz der Kälte“ mit `die Kälte`.","explain":"`die` wird im Genitiv zu `der`.","hints":["Das Nomen ist feminin."]}},{"id":"genitiv-praep-3","type":"mcq","topic":"genitiv-praep","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي حرف يناسب «خلال مدة أسبوع واحد»؟","grounded":false,"options":["innerhalb einer Woche","außerhalb einer Woche","trotz einer Woche"],"answer":0,"explain":"innerhalb تدل على داخل النطاق. außerhalb خارجه، وtrotz تعطي معنى التنازل.","hints":["المطلوب مدة يقع الحدث داخلها."],"de":{"prompt":"Welche Präposition passt zu „im Zeitraum einer Woche“?","explain":"`innerhalb` bedeutet „im Rahmen von“, `außerhalb` „außerhalb davon“, `trotz` drückt einen Gegensatz aus.","hints":["Gesucht ist ein Zeitraum, in dem etwas passiert."]}},{"id":"genitiv-praep-4","type":"cloze","topic":"genitiv-praep","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل جينيتيف الزمن والمكان.","grounded":false,"text":"während {{1}} (der Kurs) · außerhalb {{2}} (die Stadt)","blanks":[["des Kurses"],["der Stadt"]],"explain":"نكتب des Kurses بالمذكر وder Stadt بالمؤنث.","hints":["راجع العلامة على الاسم المذكر وحده."],"de":{"prompt":"Ergänze den Genitiv für Zeit und Ort.","explain":"Wir schreiben `des Kurses` (maskulin) und `der Stadt` (feminin).","hints":["Nur das maskuline Nomen bekommt eine Endung."]}},{"id":"genitiv-praep-5","type":"mcq","topic":"genitiv-praep","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"ما نوع während في während der Kurs läuft؟","grounded":false,"options":["رابط يبدأ جملة تابعة.","حرف جر يطلب جينيتيف المذكر.","ظرف يشغل الموقع الثاني."],"answer":0,"explain":"بعد während هنا جملة بفاعل der Kurs وفعل läuft. مع الاسم وحده تقول während des Kurses.","hints":["انظر إلى الفعل المصرف آخر التركيب."],"de":{"prompt":"Was für ein Wort ist `während` in `während der Kurs läuft`?","explain":"Nach `während` folgt hier ein Satz mit dem Subjekt `der Kurs` und dem Verb `läuft`. Nur mit Nomen sagst du `während des Kurses`.","hints":["Schau auf das konjugierte Verb am Ende."],"options":["Eine Konjunktion, die einen Nebensatz einleitet.","Eine Präposition mit Genitiv maskulin.","Ein Adverb auf Position 2."]}},{"id":"genitiv-praep-6","type":"order","topic":"genitiv-praep","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب الجملة واجعل المجموعة المبدوءة بـ Trotz أولًا.","grounded":false,"items":["Trotz","des Regens","spielen","wir","draußen."],"explain":"بعد Trotz des Regens يأتي الفعل spielen ثم الفاعل wir.","hints":["تحتل مجموعة الجر الأولى موقعًا واحدًا."],"de":{"prompt":"Ordne den Satz und stell die Gruppe mit `Trotz` an den Anfang.","explain":"Nach `Trotz des Regens` kommt das Verb `spielen`, dann das Subjekt `wir`.","hints":["Die Präpositionalgruppe vorne besetzt eine Position."]}},{"id":"genitiv-praep-7","type":"text","topic":"genitiv-praep","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"اكتب «بدلًا من رسالة، أرسل بريدًا إلكترونيًا» وابدأ بـ Statt. استعمل der Brief.","grounded":false,"answer":"Statt eines Briefes schicke ich eine E-Mail.","explain":"eines Briefes مجموعة جينيتيف للمذكر. يأتي schicke بعد المجموعة مباشرة.","hints":["استعمل جينيتيف النكرة بعد Statt."],"de":{"prompt":"Schreib „Statt eines Briefes schicke ich eine E-Mail“ – beginne mit `Statt` und benutze `der Brief`.","explain":"`eines Briefes` ist eine Genitivgruppe maskulin. `schicke` folgt direkt nach der Gruppe.","hints":["Benutze nach `Statt` den unbestimmten Genitiv."]}},{"id":"genitiv-praep-8","type":"text","topic":"genitiv-praep","difficulty":3,"prompt":"أعد الكتابة بالجينيتيف وبيّن كيف تغيّرت الأداة والاسم.","context":"wegen dem Umzug","answer":"wegen des Umzugs","explain":"في الصيغة المعيارية المستهدفة، اختر `des` وأضف `-s` إلى `Umzug`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Schreib den Ausdruck im Genitiv und zeig, wie sich Artikel und Nomen ändern.","explain":"In der Standardform, die wir hier üben, wählst du `des` und hängst `-s` an `Umzug` an.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"genitiv-praep-9","type":"text","topic":"genitiv-praep","difficulty":2,"prompt":"أي تركيب يدل على الزمن داخل مدة شهر؟","answer":"`innerhalb eines Monats`. الحرف يطلب الجينيتيف، و`Monat` مذكر.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Welche Struktur bedeutet „im Zeitraum eines Monats“?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`innerhalb eines Monats`. Die Präposition verlangt den Genitiv, und `Monat` ist maskulin."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"قد يحدد حرف الجر حالة الاسم حتى عندما لا توجد علاقة ملكية. تعلّم المعنى مع الحالة لتختار الحرف المناسب وتبني المجموعة التي تأتي بعده.","example":"Wegen des Umzugs bleibt das Büro geschlossen.","translation":"بسبب الانتقال يبقى المكتب مغلقًا.","pitfall":["wegen dem Umzug → wegen des Umzugs","في الصيغة المعيارية المستهدفة، اختر `des` وأضف `-s` إلى `Umzug`."],"recall":["أي تركيب يدل على الزمن داخل مدة شهر؟","`innerhalb eines Monats`. الحرف يطلب الجينيتيف، و`Monat` مذكر."],"de":{"title":"Präpositionen mit Genitiv","lead":"Eine Präposition kann den Kasus eines Nomens bestimmen, auch wenn es um keinen Besitz geht. Lern die Bedeutung zusammen mit dem Kasus, damit du die richtige Präposition wählst und die Gruppe danach richtig baust.","steps":[{"text":"Wähle die Präposition nach der Bedeutung","why":"`wegen` nennt einen Grund, `trotz` einen Gegensatz, `während` eine Zeitspanne, wenn ein Nomen folgt. Geübt wird hier die Standardform mit Genitiv."},{"text":"Unterscheide Ort, Zeit und Ersatz","why":"`innerhalb` heißt „im Rahmen von“, `außerhalb` „nicht im Rahmen von“, `statt/anstatt` nennt eine Alternative. Schau dir Artikel und Nomen nach der Präposition zusammen an."},{"text":"Bau die Gruppe nach dem Genus","why":"Beim Maskulinum ändert sich der Artikel, und das Nomen bekommt hier eine Endung. Beim Femininum zeigt nur der Artikel `der` den Kasus; `Kälte` bleibt gleich."},{"text":"Prüfe, ob danach ein Nomen oder ein Satz kommt","why":"Im ersten Beispiel ist `während` eine Präposition mit Nominalgruppe. Im zweiten leitet es einen Nebensatz ein: `der Kurs` ist Subjekt im Nominativ, und `läuft` steht am Ende."}],"explain":["Bei manchen dieser Präpositionen hörst du auch den Dativ, besonders bei `wegen` in der gesprochenen Sprache. In diesen Übungen trainierst du den Genitiv. Steht die Gruppe vorne im Hauptsatz, besetzt sie eine Position: `Trotz des Regens gehen wir hinaus` – deshalb folgt das konjugierte Verb direkt danach."],"pitfall":"In der Standardform, die wir hier üben, wählst du `des` und hängst `-s` an `Umzug` an.","recall":["Welche Struktur bedeutet „im Zeitraum eines Monats“?","`innerhalb eines Monats`. Die Präposition verlangt den Genitiv, und `Monat` ist maskulin."],"links":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Genitivmarkierung · grammis"]},"pattern":["wegen · trotz · während · innerhalb · statt","+","Genitiv"],"frames":[{"k":"main","parts":[["vf","Wegen des Umzugs"],["v","bleibt"],["mf","das Büro"],["ve","geschlossen"]]}]},{"id":"genitiv-adjektiv","chapter":4,"title":"نهايات الصفة في Genitiv","german":"Adjektivdeklination im Genitiv","emoji":"🧶","links":[["فهرس قواعد الوحدة 4 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["علامات الجينيتيف · grammis","https://grammis.ids-mannheim.de/korpusgrammatik/6941"]],"steps":[{"text":"تعرّف إلى المجموعة كلها","example":"trotz des kalten Windes","why":"أولًا يحدد `trotz` الجينيتيف. الاسم `Wind` مذكر وتظهر الحالة في `des` و`Windes`. تأخذ الصفة `-en`."},{"text":"اكتب -en بعد الأداة المحددة أو ما يشبه ein","example":"eines guten Freundes · der netten Nachbarin · meiner neuen Kollegen","why":"تأخذ الصفة `-en` في كل الأجناس وفي الجمع هنا. تعمل أدوات الملكية مثل `meiner` بالطريقة نفسها في الجينيتيف."},{"text":"استعمل -er بلا أداة للمؤنث والجمع","example":"wegen starker Kälte · wegen starker Regenfälle","why":"تحمل الصفة علامة الحالة عندما تغيب الأداة في هذين الصنفين. أسماء المؤنث والجمع نفسها لا تضيف `-s` خاصة بالجينيتيف."},{"text":"استعمل -en بلا أداة للمذكر والمحايد","example":"trotz starken Windes · der Geschmack frischen Brotes","why":"في هذين المثالين يحمل الاسم نهاية الجينيتيف `-es`. تأتي الصفة بـ `-en` حتى من دون أداة. افحص شكل الاسم إلى جانب الصفة."}],"explain":["إذا اجتمعت صفتان لهما وظيفة متوازية اتبعتا نمط التصريف نفسه في أمثلة مثل `wegen des starken, kalten Windes` و`wegen starker, anhaltender Regenfälle`. قارن أيضًا `wegen der kalten Luft` و`wegen kalter Luft`. الاسم مؤنث في الاثنين، ووجود الأداة هو الذي يغيّر النهاية."],"questions":[{"id":"genitiv-adjektiv-1","type":"cloze","topic":"genitiv-adjektiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل نهاية الصفة.","grounded":false,"text":"wegen des stark{{1}} Regens","blanks":[["-en","en"]],"explain":"بعد des تأخذ الصفة في الجينيتيف -en.","hints":["هل الأداة موجودة؟"],"de":{"prompt":"Ergänze die Adjektivendung.","explain":"Nach `des` bekommt das Adjektiv im Genitiv `-en`.","hints":["Gibt es einen Artikel?"]}},{"id":"genitiv-adjektiv-2","type":"cloze","topic":"genitiv-adjektiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الصفة بعد einer. استعمل nett.","grounded":false,"text":"die Idee einer {{1}} Kollegin","blanks":[["netten"]],"explain":"بعد einer تأخذ الصفة -en في الجينيتيف.","hints":["الأداة هنا تحمل علامة الجينيتيف."],"de":{"prompt":"Ergänze das Adjektiv nach `einer`. Benutze `nett`.","explain":"Nach `einer` bekommt das Adjektiv im Genitiv `-en`.","hints":["Der Artikel trägt hier das Genitivsignal."]}},{"id":"genitiv-adjektiv-3","type":"mcq","topic":"genitiv-adjektiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"اختر جينيتيف الجمع بلا أداة.","grounded":false,"options":["wegen starker Regenfälle","wegen starken Regenfälle","wegen starke Regenfälle"],"answer":0,"explain":"-er علامة الصفة للجمع بلا أداة. -en يلائم وجود أداة في هذا المثال.","hints":["في الجمع بلا أداة احمل العلامة على الصفة."],"de":{"prompt":"Wähle den Genitiv Plural ohne Artikel.","explain":"`-er` ist das Signal des Adjektivs im Plural ohne Artikel. `-en` passt, wenn es in diesem Beispiel einen Artikel gibt.","hints":["Im Plural ohne Artikel trägt das Adjektiv das Signal."]}},{"id":"genitiv-adjektiv-4","type":"cloze","topic":"genitiv-adjektiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الصفة بلا أداة. استعمل frisch في الموضعين.","grounded":false,"text":"der Duft {{1}} Luft · der Duft {{2}} Brotes","blanks":[["frischer"],["frischen"]],"explain":"Luft مؤنث بلا أداة فتأخذ الصفة -er. Brot محايد والجينيتيف ظاهر في Brotes، فتأخذ الصفة -en.","hints":["ميّز المؤنث عن المحايد."],"de":{"prompt":"Ergänze das Adjektiv ohne Artikel. Benutze zweimal `frisch`.","explain":"`Luft` ist feminin ohne Artikel, also `-er`. `Brot` ist neutral, der Genitiv ist in `Brotes` sichtbar, also `-en`.","hints":["Unterscheide Femininum und Neutrum."]}},{"id":"genitiv-adjektiv-5","type":"cloze","topic":"genitiv-adjektiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الصفتين بلا أداة من kalt وstark.","grounded":false,"text":"trotz {{1}}, {{2}} Winde","blanks":[["kalter"],["starker"]],"explain":"في جينيتيف الجمع بلا أداة تأخذ الصفتان -er.","hints":["الصفتان تصفان الجمع نفسه."],"de":{"prompt":"Ergänze beide Adjektive ohne Artikel mit `kalt` und `stark`.","explain":"Im Genitiv Plural ohne Artikel bekommen beide Adjektive `-er`.","hints":["Beide Adjektive beschreiben denselben Plural."]}},{"id":"genitiv-adjektiv-6","type":"mcq","topic":"genitiv-adjektiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي صيغة صحيحة مع كلمة الملكية meiner؟","grounded":false,"options":["die Fragen meiner neuen Nachbarn","die Fragen meiner neuer Nachbarn","die Fragen meiner neue Nachbarn"],"answer":0,"explain":"بعد meiner تأخذ الصفة -en في الجينيتيف مهما كان الجنس أو العدد.","hints":["تعامل مع meiner كما تتعامل مع أداة مصرّفة."],"de":{"prompt":"Welche Form ist mit dem Possessivartikel `meiner` richtig?","explain":"Nach `meiner` bekommt das Adjektiv im Genitiv immer `-en`, egal welches Genus oder welcher Numerus.","hints":["Behandle `meiner` wie einen deklinierten Artikel."]}},{"id":"genitiv-adjektiv-7","type":"text","topic":"genitiv-adjektiv","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"أعد كتابة wegen der starken Kälte بلا أداة مع تصريف الصفة.","grounded":false,"answer":"wegen starker Kälte","explain":"الاسم مؤنث، لذلك نكتب starker بلا أداة في الجينيتيف.","hints":["بعد حذف der تنتقل العلامة إلى الصفة."],"de":{"prompt":"Schreib `wegen der starken Kälte` ohne Artikel und dekliniere das Adjektiv.","explain":"Das Nomen ist feminin, deshalb schreiben wir ohne Artikel im Genitiv `starker`.","hints":["Ohne `der` wandert das Signal zum Adjektiv."]}},{"id":"genitiv-adjektiv-8","type":"text","topic":"genitiv-adjektiv","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"wegen starken Kälte","answer":"wegen starker Kälte","explain":"الاسم مؤنث والجينيتيف هنا بلا أداة، فتأخذ الصفة `-er`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Das Nomen ist feminin und der Genitiv steht hier ohne Artikel, deshalb bekommt das Adjektiv `-er`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"genitiv-adjektiv-9","type":"text","topic":"genitiv-adjektiv","difficulty":2,"prompt":"أين علامات الجينيتيف في `des alten Computers`؟","answer":"تظهر `des` للأداة و`-s` في الاسم. الصفة `alt` تأخذ `-en` بعد الأداة.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Wo sind die Genitivsignale in `des alten Computers`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`des` am Artikel und `-s` am Nomen. Das Adjektiv `alt` bekommt nach dem Artikel `-en`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"table":[["أداة","مذكر","مؤنث","محايد","جمع"],["محدّدة","des kalten Windes","der kalten Luft","des kalten Wassers","der kalten Tage"],["بلا أداة","kalten Windes","kalter Luft","kalten Wassers","kalter Tage"]],"lead":"عندما تضيف صفة إلى اسم في الجينيتيف، تتوزع علامات الحالة بين الأداة والصفة والاسم. لاحظ ما يظهر بالفعل قبل أن تختار نهاية الصفة.","example":"wegen des starken Regens · wegen starker Regenfälle","translation":"بسبب المطر الغزير · بسبب أمطار غزيرة.","pitfall":["wegen starken Kälte → wegen starker Kälte","الاسم مؤنث والجينيتيف هنا بلا أداة، فتأخذ الصفة `-er`."],"recall":["أين علامات الجينيتيف في `des alten Computers`؟","تظهر `des` للأداة و`-s` في الاسم. الصفة `alt` تأخذ `-en` بعد الأداة."],"de":{"title":"Adjektivdeklination im Genitiv","lead":"Kommt ein Adjektiv zu einem Nomen im Genitiv, verteilen sich die Kasussignale auf Artikel, Adjektiv und Nomen. Schau, was schon sichtbar ist, bevor du die Adjektivendung wählst.","steps":[{"text":"Erkenne die ganze Gruppe","why":"Zuerst bestimmt `trotz` den Genitiv. `Wind` ist maskulin; den Kasus zeigen `des` und `Windes`. Das Adjektiv bekommt `-en`."},{"text":"Schreib -en nach bestimmtem Artikel oder ein-Wort","why":"Das Adjektiv bekommt hier bei allen Genera und im Plural `-en`. Possessivartikel wie `meiner` funktionieren im Genitiv genauso."},{"text":"Benutze -er ohne Artikel bei Femininum und Plural","why":"Fehlt der Artikel, trägt das Adjektiv das Kasussignal. Feminine Nomen und Pluralnomen bekommen selbst kein Genitiv-`s`."},{"text":"Benutze -en ohne Artikel bei Maskulinum und Neutrum","why":"In diesen Beispielen trägt das Nomen die Genitivendung `-es`. Das Adjektiv bekommt `-en`, auch ohne Artikel. Prüf die Form des Nomens zusammen mit dem Adjektiv."}],"explain":["Stehen zwei gleichrangige Adjektive zusammen, folgen sie demselben Muster: `wegen des starken, kalten Windes` und `wegen starker, anhaltender Regenfälle`. Vergleiche auch `wegen der kalten Luft` und `wegen kalter Luft`: In beiden ist das Nomen feminin – nur der Artikel ändert die Endung."],"pitfall":"Das Nomen ist feminin und der Genitiv steht hier ohne Artikel, deshalb bekommt das Adjektiv `-er`.","recall":["Wo sind die Genitivsignale in `des alten Computers`?","`des` am Artikel und `-s` am Nomen. Das Adjektiv `alt` bekommt nach dem Artikel `-en`."],"links":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Genitivmarkierung · grammis"],"table":[["Artikel","Maskulin","Feminin","Neutrum","Plural"],["bestimmt","des kalten Windes","der kalten Luft","des kalten Wassers","der kalten Tage"],["ohne Artikel","kalten Windes","kalter Luft","kalten Wassers","kalter Tage"]]},"pattern":["mit Artikel → -en","·","ohne Artikel: f / Pl → -er","·","m / n → -en"],"frames":[{"k":"np","parts":[["c","wegen"],["n","des"],["hl","starken"],["n","Regens"]]},{"k":"np","parts":[["c","wegen"],["hl","starker"],["n","Regenfälle"]]}]},{"id":"relativ-genitiv","chapter":4,"title":"الملكية داخل جملة الوصل","german":"Relativpronomen und Relativsätze im Genitiv","emoji":"🔑","links":[["فهرس قواعد الوحدة 4 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات جمل الوصل · grammis","https://grammis.ids-mannheim.de/progr%40mm/5272"]],"steps":[{"text":"حدّد الاسم المرجعي","example":"die Frau","why":"صاحب العلاقة في المثال هو المرأة. اسأل لمن ينتمي الابن أو بمن يرتبط. الاسم الذي يجيب عن ذلك هو ما يحدد شكل ضمير الوصل."},{"text":"اختر الضمير بحسب المالك","example":"dessen: der Mann / das Kind · deren: die Frau / die Eltern","why":"المذكر والمحايد يأخذان `dessen`. المؤنث والجمع يأخذان `deren`. فكر في الاسم السابق حتى إذا كان الشيء الذي يملكه من جنس آخر."},{"text":"ضمّ الاسم المملوك إلى الضمير","example":"…, deren Sohn hier arbeitet.","why":"تأتي المجموعة في أول الوصل. لا تضع أداة أخرى أمام `Sohn`. وهو فاعل `arbeitet` هنا، ويمكن أن يصبح مفعولًا في `deren Sohn ich kenne`. يظل `deren` ثابتًا."},{"text":"قدّم حرف الجر مع المجموعة إذا احتجت إليه","example":"das Kind, mit dessen Mutter ich gesprochen habe","why":"يتعلق `mit` بـ `Mutter` في جملة الوصل. `dessen` يعود إلى `Kind` المحايد، ويبقى كما هو مع أن `mit` يطلب الداتيف للمجموعة الاسمية."}],"explain":["قارِن `die Frau, der ich helfe` و`die Frau, deren Bruder ich helfe`. في الأولى أتحدث عن مساعدة المرأة نفسها. في الثانية أساعد أخاها. إذا أضفت صفة بعد `dessen` أو `deren` فتعامل معها كصفة بلا أداة تصرّفها، مثل `deren ältester Sohn hier arbeitet` و`mit dessen älterem Bruder`."],"questions":[{"id":"relativ-genitiv-1","type":"cloze","topic":"relativ-genitiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الضمير للمالك المذكر.","grounded":false,"text":"Der Mann, {{1}} Tochter hier arbeitet, wohnt nebenan.","blanks":[["dessen"]],"explain":"Mann مذكر وهو المرجع، لذا dessen.","hints":["حدّد جنس المالك، لا اسم الابنة."],"de":{"prompt":"Ergänze das Pronomen für einen maskulinen Besitzer.","explain":"`Mann` ist maskulin und das Bezugswort, also `dessen`.","hints":["Bestimme das Genus des Besitzers, nicht das der Tochter."]}},{"id":"relativ-genitiv-2","type":"cloze","topic":"relativ-genitiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الضمير للمالك المؤنث.","grounded":false,"text":"Die Frau, {{1}} Sohn hier arbeitet, wohnt nebenan.","blanks":[["deren"]],"explain":"Frau هي المرجع المؤنث. Sohn لا يحدد شكل الضمير.","hints":["أي شخص يربطه الوصل بالابن؟"],"de":{"prompt":"Ergänze das Pronomen für eine feminine Besitzerin.","explain":"`Frau` ist das feminine Bezugswort. `Sohn` bestimmt die Form nicht.","hints":["Mit welcher Person verbindet der Relativsatz den Sohn?"]}},{"id":"relativ-genitiv-3","type":"mcq","topic":"relativ-genitiv","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"ما الضمير المناسب لـ die Eltern في die Eltern, … Kind hier lernt؟","grounded":false,"options":["deren","dessen","denen"],"answer":0,"explain":"deren ضمير ملكية وصلي للجمع. dessen للمذكر أو المحايد، وdenen للداتيف.","hints":["علاقة الوصل ملكية والمرجع جمع."],"de":{"prompt":"Welches Pronomen passt zu `die Eltern` in `die Eltern, … Kind hier lernt`?","explain":"`deren` ist das Relativpronomen für Besitz im Plural. `dessen` gilt für Maskulinum oder Neutrum, `denen` für den Dativ.","hints":["Es geht um Besitz, und das Bezugswort ist Plural."]}},{"id":"relativ-genitiv-4","type":"cloze","topic":"relativ-genitiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الوصل بعد mit.","grounded":false,"text":"Das ist das Kind, mit {{1}} Mutter ich gesprochen habe.","blanks":[["dessen"]],"explain":"المرجع Kind محايد. يأتي mit أمام المجموعة dessen Mutter، ويبقى dessen ثابتًا.","hints":["فرّق بين جنس المالك والحالة التي يفرضها mit على Mutter."],"de":{"prompt":"Ergänze den Relativsatz nach `mit`.","explain":"Das Bezugswort `Kind` ist neutral. `mit` steht vor der Gruppe `dessen Mutter`, und `dessen` bleibt gleich.","hints":["Unterscheide das Genus des Besitzers vom Kasus, den `mit` für `Mutter` verlangt."]}},{"id":"relativ-genitiv-5","type":"order","topic":"relativ-genitiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب الوصل بعد die Frau. اجعل ich قبل gestern.","grounded":false,"items":["deren Sohn","ich","gestern","besucht","habe"],"explain":"deren Sohn مفعول داخل الوصل. ينتهي الوصل بالمساعد habe.","hints":["ابدأ بمجموعة الملكية كاملة."],"de":{"prompt":"Ordne den Relativsatz nach `die Frau`. Setz `ich` vor `gestern`.","explain":"`deren Sohn` ist Objekt im Relativsatz. Der Relativsatz endet mit dem Hilfsverb `habe`.","hints":["Beginne mit der ganzen Besitzgruppe."]}},{"id":"relativ-genitiv-6","type":"mcq","topic":"relativ-genitiv","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"اختر وصف المرأة التي تساعد أخاها أنت.","grounded":false,"options":["die Frau, deren Bruder ich helfe","die Frau, der ich helfe","die Frau, deren Bruder mir hilft"],"answer":0,"explain":"deren Bruder هو من أساعده في الأولى. الثانية تتعلق بالمرأة نفسها، والثالثة تجعل الأخ يساعدني.","hints":["حدّد المساعد والمستفيد في كل صيغة."],"de":{"prompt":"Wähle die Beschreibung der Frau, deren Bruder du hilfst.","explain":"Im ersten Satz helfe ich `deren Bruder`. Der zweite handelt von der Frau selbst, im dritten hilft der Bruder mir.","hints":["Bestimme in jeder Variante, wer hilft und wem geholfen wird."]}},{"id":"relativ-genitiv-7","type":"text","topic":"relativ-genitiv","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"اربط Das ist das Haus وSein Dach ist neu بجملة وصل ملكية.","grounded":false,"answer":"Das ist das Haus, dessen Dach neu ist.","explain":"dessen يعود إلى Haus. Dach فاعل جملة الوصل، ويأتي ist في آخرها.","hints":["Haus محايد. انقل فعل الوصل إلى النهاية."],"de":{"prompt":"Verbinde `Das ist das Haus` und `Sein Dach ist neu` mit einem Relativsatz im Genitiv.","explain":"`dessen` verweist auf `Haus`. `Dach` ist Subjekt des Relativsatzes, `ist` steht am Ende.","hints":["`Haus` ist neutral. Setz das Verb des Relativsatzes ans Ende."]}},{"id":"relativ-genitiv-8","type":"text","topic":"relativ-genitiv","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Das ist das Kind, deren Mutter hier arbeitet.","answer":"Das ist das Kind, dessen Mutter hier arbeitet.","explain":"اختر `dessen` لأن المالك هو `das Kind`. جنس `Mutter` لا يحدد شكل الضمير.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Wähle `dessen`, weil der Besitzer `das Kind` ist. Das Genus von `Mutter` bestimmt die Form des Pronomens nicht.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"relativ-genitiv-9","type":"text","topic":"relativ-genitiv","difficulty":2,"prompt":"ما الضمير في `die Leute, … Haus verkauft wurde`؟","answer":"`deren` لأن الاسم المرجعي `die Leute` جمع، حتى مع `Haus` المحايد.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Welches Pronomen passt in `die Leute, … Haus verkauft wurde`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`deren`, weil das Bezugswort `die Leute` Plural ist – auch mit dem neutralen `Haus`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"قد تصف شخصًا أو مكانًا بشيء يرتبط به، مثل امرأة يعمل ابنها معنا. تستعمل `dessen` و`deren` كي تربط الشيء أو الشخص التابع بالاسم المرجعي.","example":"Das ist die Frau, deren Sohn hier arbeitet.","translation":"هذه هي المرأة التي يعمل ابنها هنا.","pitfall":["Das ist das Kind, deren Mutter hier arbeitet. → Das ist das Kind, dessen Mutter hier arbeitet.","اختر `dessen` لأن المالك هو `das Kind`. جنس `Mutter` لا يحدد شكل الضمير."],"recall":["ما الضمير في `die Leute, … Haus verkauft wurde`؟","`deren` لأن الاسم المرجعي `die Leute` جمع، حتى مع `Haus` المحايد."],"de":{"title":"Relativpronomen im Genitiv","lead":"Du beschreibst eine Person oder einen Ort durch etwas, das dazugehört – z. B. eine Frau, deren Sohn bei uns arbeitet. Mit `dessen` und `deren` verbindest du das Zugehörige mit dem Bezugswort.","steps":[{"text":"Bestimme das Bezugswort","why":"Die „Besitzerin“ im Beispiel ist die Frau. Frag: Zu wem gehört der Sohn? Das Nomen, das die Antwort gibt, bestimmt die Form des Relativpronomens."},{"text":"Wähle das Pronomen nach dem Besitzer","why":"Maskulinum und Neutrum bekommen `dessen`, Femininum und Plural `deren`. Denk an das vorherige Nomen – auch wenn das Zugehörige ein anderes Genus hat."},{"text":"Verbinde das Zugehörige mit dem Pronomen","why":"Die Gruppe steht am Anfang des Relativsatzes. Vor `Sohn` steht kein weiterer Artikel. Hier ist es Subjekt von `arbeitet`; in `deren Sohn ich kenne` wäre es Objekt. `deren` bleibt gleich."},{"text":"Stell bei Bedarf die Präposition vor die Gruppe","why":"`mit` gehört zu `Mutter` im Relativsatz. `dessen` verweist auf das neutrale `Kind` und bleibt gleich, obwohl `mit` den Dativ für die Nominalgruppe verlangt."}],"explain":["Vergleiche `die Frau, der ich helfe` und `die Frau, deren Bruder ich helfe`. Im ersten Satz helfe ich der Frau selbst, im zweiten ihrem Bruder. Kommt nach `dessen` oder `deren` ein Adjektiv, behandle es wie ein Adjektiv ohne Artikel: `deren ältester Sohn hier arbeitet`, `mit dessen älterem Bruder`."],"pitfall":"Wähle `dessen`, weil der Besitzer `das Kind` ist. Das Genus von `Mutter` bestimmt die Form des Pronomens nicht.","recall":["Welches Pronomen passt in `die Leute, … Haus verkauft wurde`?","`deren`, weil das Bezugswort `die Leute` Plural ist – auch mit dem neutralen `Haus`."],"links":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"]},"pattern":["m / n → dessen","·","f / Pl → deren","+ Nomen ohne Artikel"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","die Frau, deren Sohn hier arbeitet"]]},{"k":"rel","parts":[["c","deren Sohn"],["mf","hier"],["ve","arbeitet"]]}]},{"id":"relativ-ort","chapter":4,"title":"الوصل المكاني: أين، إلى أين، من أين","german":"Relativsätze mit wo, wohin und woher","emoji":"📍","links":[["فهرس قواعد الوحدة 4 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات جمل الوصل · grammis","https://grammis.ids-mannheim.de/progr%40mm/5272"],["أدوات المكان · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/2093"]],"steps":[{"text":"استعمل wo لموقع الحدث","example":"Dort, wo ich wohne, gibt es einen Park.","why":"تسأل `Wo wohne ich?` أي أين أقيم. الفعل `wohnen` يصف الإقامة في المكان. يمكن في أمثلة كثيرة مع اسم مكان استعمال حرف وضمير، مثل `der Ort, an dem ich wohne`."},{"text":"استعمل wohin للوجهة","example":"Das ist der Ort, wohin sie fährt.","why":"السؤال `Wohin fährt sie?` يعني إلى أين. الحركة نحو الوجهة هي المقصودة. ويمكن صياغة وجهة إلى بلد مثل `das Land, in das sie zieht`."},{"text":"استعمل woher للمصدر","example":"Das ist die Stadt, woher er kommt.","why":"اسأل `Woher kommt er?`. التركيز على نقطة المنشأ، مثل `die Stadt, aus der er kommt`."},{"text":"احصر هذا الاستعمال في المعنى المكاني","example":"der Park, wo wir laufen · die Person, die wir sehen","why":"يمكن أن توجد حركة مع `wo` حين نصف مكانها، مثل الجري داخل الحديقة. لو وصفت شخصًا رأيناه تستعمل ضمير وصل يبيّن دوره، فتقول `die` في المثال."}],"explain":["يفيدك التمييز بين الحركة في نطاق والحركة إلى نطاق. `der Park, wo wir laufen` يفيد مكان الجري. `der Park, wohin wir laufen` يفيد وجهته. وإذا كانت جملة الوصل في الوسط فاستأنف الرئيسية بعد الفاصلة الثانية، مثل `Dort, wo wir wohnen, ist es ruhig`."],"questions":[{"id":"relativ-ort-1","type":"cloze","topic":"relativ-ort","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بأداة الموقع الثابت.","grounded":false,"text":"Das ist der Ort, {{1}} wir arbeiten.","blanks":[["wo"]],"explain":"wo يدل على المكان الذي يحدث فيه العمل.","hints":["اسأل أين نعمل؟"],"de":{"prompt":"Ergänze das Wort für einen festen Ort.","explain":"`wo` zeigt den Ort, an dem gearbeitet wird.","hints":["Frag: Wo arbeiten wir?"]}},{"id":"relativ-ort-2","type":"cloze","topic":"relativ-ort","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بأداة الوجهة.","grounded":false,"text":"Das ist die Stadt, {{1}} sie morgen fährt.","blanks":[["wohin"]],"explain":"wohin يدل على اتجاه الحركة نحو المدينة.","hints":["اسأل إلى أين تتجه؟"],"de":{"prompt":"Ergänze das Wort für ein Ziel.","explain":"`wohin` zeigt die Richtung der Bewegung zur Stadt.","hints":["Frag: Wohin fährt sie?"]}},{"id":"relativ-ort-3","type":"mcq","topic":"relativ-ort","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي صيغة تصف بلد الأصل؟","grounded":false,"options":["das Land, woher er kommt","das Land, wohin er fährt","das Land, wo er wohnt"],"answer":0,"explain":"woher يحدد المنشأ. wohin للوجهة وwo للمكان.","hints":["فكّر في نقطة البداية."],"de":{"prompt":"Welche Form beschreibt das Herkunftsland?","explain":"`woher` bestimmt die Herkunft, `wohin` das Ziel, `wo` den Ort.","hints":["Denk an den Ausgangspunkt."]}},{"id":"relativ-ort-4","type":"cloze","topic":"relativ-ort","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بأداتين مختلفتين.","grounded":false,"text":"der Park, {{1}} wir spazieren gehen (داخل الحديقة) · der Park, {{2}} wir fahren (إليها)","blanks":[["wo"],["wohin"]],"explain":"المشي داخل الحديقة يحدد المكان، والذهاب إليها يحدد الوجهة.","hints":["قد توجد حركة حتى عند وصف موقع ثابت."],"de":{"prompt":"Ergänze zwei verschiedene Wörter.","explain":"Spazieren im Park nennt den Ort, zum Park gehen das Ziel.","hints":["Auch wenn man einen festen Ort beschreibt, kann es eine Bewegung geben."],"text":"der Park, {{1}} wir spazieren gehen (im Park) · der Park, {{2}} wir fahren (dorthin)"}},{"id":"relativ-ort-5","type":"mcq","topic":"relativ-ort","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي وصل قياسي يصف الشخص الذي رأيناه؟","grounded":false,"options":["die Person, die wir gesehen haben","die Person, wo wir gesehen haben","die Person, wohin wir gesehen haben"],"answer":0,"explain":"die ضمير الوصل في أكوزاتيف المؤنث. wo وwohin تعبّران عن علاقة مكانية هنا.","hints":["الشخص مفعول مباشر في الوصل."],"de":{"prompt":"Welcher Standard-Relativsatz beschreibt die Person, die wir gesehen haben?","explain":"`die` ist das Relativpronomen im Akkusativ feminin. `wo` und `wohin` drücken hier eine räumliche Beziehung aus.","hints":["Die Person ist im Relativsatz das Akkusativobjekt."]}},{"id":"relativ-ort-6","type":"order","topic":"relativ-ort","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب الجزء المكاني بعد die Stadt وابدأ بأداة المصدر. ضع sie قبل ursprünglich.","grounded":false,"items":["woher","sie","ursprünglich","kommt"],"explain":"woher تدل على الأصل. يأتي kommt في نهاية الجملة التابعة.","hints":["اجعل الفعل المصرف يغلق الوصل."],"de":{"prompt":"Ordne den Ortsteil nach `die Stadt` und beginne mit dem Herkunftswort. Setz `sie` vor `ursprünglich`.","explain":"`woher` zeigt die Herkunft. `kommt` steht am Ende des Nebensatzes.","hints":["Das konjugierte Verb schließt den Relativsatz."]}},{"id":"relativ-ort-7","type":"text","topic":"relativ-ort","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"أعد صياغة Das ist die Stadt, woher sie kommt باستعمال aus وضمير وصل.","grounded":false,"answer":"Das ist die Stadt, aus der sie kommt.","explain":"تحل aus der محل woher مع الحفاظ على معنى المصدر، ويبقى kommt في الآخر.","hints":["تطلب aus الداتيف. Stadt مؤنث."],"de":{"prompt":"Formuliere `Das ist die Stadt, woher sie kommt` mit `aus` und einem Relativpronomen.","explain":"`aus der` ersetzt `woher` und behält die Bedeutung der Herkunft; `kommt` bleibt am Ende.","hints":["`aus` verlangt den Dativ. `Stadt` ist feminin."]}},{"id":"relativ-ort-8","type":"text","topic":"relativ-ort","difficulty":3,"prompt":"صحّح أداة الوصل حتى تعني أن هذا المكان هو وجهة رحلتها غدًا.","context":"Das ist der Ort, woher sie morgen hinfährt.","answer":"Das ist der Ort, wohin sie morgen fährt.","explain":"إذا كانت تتجه إلى هذا المكان فقل `Das ist der Ort, wohin sie morgen fährt.` تدل `woher` على نقطة الانطلاق.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere das Wort im Relativsatz, sodass der Ort das Ziel ihrer Fahrt morgen ist.","explain":"Fährt sie zu diesem Ort, sag `Das ist der Ort, wohin sie morgen fährt.` `woher` bezeichnet den Ausgangspunkt.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"relativ-ort-9","type":"text","topic":"relativ-ort","difficulty":2,"prompt":"ما الأنسب مع `ursprünglich kommen` حين نقصد بلد الأصل؟","answer":"`woher`، مثل `das Land, woher sie ursprünglich kommt`. ويمكن القول `das Land, aus dem sie ursprünglich kommt`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Was passt zu `ursprünglich kommen`, wenn das Herkunftsland gemeint ist?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`woher`, z. B. `das Land, woher sie ursprünglich kommt`. Man kann auch sagen: `das Land, aus dem sie ursprünglich kommt`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"تخبرنا هذه الجمل بموقع الحدث أو وجهته أو مصدره. جرّب صياغة سؤال مكاني عن الفعل داخل الوصل لتعرف أي أداة تحتاج.","example":"Das ist der Ort, wo ich wohne / wohin ich ziehe / woher ich komme.","translation":"هذا هو المكان الذي أقيم فيه / أنتقل إليه / جئت منه.","pitfall":["Das ist der Ort, woher sie morgen hinfährt. → Das ist der Ort, wohin sie morgen fährt.","إذا كانت تتجه إلى هذا المكان فقل `Das ist der Ort, wohin sie morgen fährt.` تدل `woher` على نقطة الانطلاق."],"recall":["ما الأنسب مع `ursprünglich kommen` حين نقصد بلد الأصل؟","`woher`، مثل `das Land, woher sie ursprünglich kommt`. ويمكن القول `das Land, aus dem sie ursprünglich kommt`."],"de":{"title":"Relativsätze mit wo, wohin und woher","lead":"Diese Sätze sagen, wo etwas passiert, wohin es geht oder woher es kommt. Stell dir eine Ortsfrage zum Verb im Relativsatz, um das passende Wort zu finden.","steps":[{"text":"Benutze wo für den Ort des Geschehens","why":"Du fragst `Wo wohne ich?`. `wohnen` beschreibt den Aufenthalt an einem Ort. Bei Ortsnomen geht oft auch Präposition + Pronomen: `der Ort, an dem ich wohne`."},{"text":"Benutze wohin für das Ziel","why":"Die Frage `Wohin fährt sie?` zielt auf die Richtung. Gemeint ist die Bewegung zum Ziel. Bei einem Land geht auch `das Land, in das sie zieht`."},{"text":"Benutze woher für die Herkunft","why":"Frag `Woher kommt er?`. Im Fokus steht der Ausgangspunkt, z. B. `die Stadt, aus der er kommt`."},{"text":"Benutze diese Wörter nur für räumliche Bedeutung","why":"Mit `wo` kann es eine Bewegung geben, wenn du ihren Ort beschreibst – z. B. Laufen im Park. Beschreibst du eine Person, die wir gesehen haben, brauchst du ein Relativpronomen, das ihre Rolle zeigt: hier `die`."}],"explain":["Unterscheide Bewegung innerhalb eines Ortes und Bewegung zu einem Ort: `der Park, wo wir laufen` nennt den Ort des Laufens, `der Park, wohin wir laufen` das Ziel. Steht der Relativsatz in der Mitte, geht der Hauptsatz nach dem zweiten Komma weiter: `Dort, wo wir wohnen, ist es ruhig`."],"pitfall":"Fährt sie zu diesem Ort, sag `Das ist der Ort, wohin sie morgen fährt.` `woher` bezeichnet den Ausgangspunkt.","recall":["Was passt zu `ursprünglich kommen`, wenn das Herkunftsland gemeint ist?","`woher`, z. B. `das Land, woher sie ursprünglich kommt`. Man kann auch sagen: `das Land, aus dem sie ursprünglich kommt`."],"links":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis","Lokale Präpositionen · grammis"]},"pattern":["wo = Ort","·","wohin = Ziel","·","woher = Herkunft"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","der Ort, wo ich wohne"]]},{"k":"rel","parts":[["c","wo / wohin / woher"],["mf","ich"],["ve","wohne / ziehe / komme"]]}]},{"id":"komparativ","chapter":5,"title":"تصريف صفة المقارنة","german":"Adjektivdeklination mit Komparativ","emoji":"⚖️","links":[["فهرس قواعد الوحدة 5 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["تصريف الصفات · grammis","https://grammis.ids-mannheim.de/progr%40mm/4067"]],"steps":[{"text":"ابنِ درجة المقارنة","example":"günstig → günstiger · gesund → gesünder","why":"أضف غالبًا `-er`. يتغير الصوت في بعض الصفات مثل `alt → älter` و`kurz → kürzer`. احفظ الصيغ الخاصة مثل `gut → besser` و`viel → mehr` و`hoch → höher`."},{"text":"حدّد هل الصفة قبل اسم","example":"Der Salat ist günstiger. · ein günstigerer Salat","why":"بعد `sein` تأتي صيغة المقارنة وحدها. قبل الاسم تضيف نهاية الصفة المناسبة. `günstiger + er` يعطي `günstigerer` بعد `ein` مع المذكر في الرفع."},{"text":"اختر النهاية من الأداة والحالة والجنس","example":"einen günstigeren Salat · eine günstigere Suppe · ein günstigeres Menü","why":"كلها أمثلة في الأكوزاتيف. يأخذ المذكر بعد `einen` نهاية `-en`، والمؤنث بعد `eine` نهاية `-e`، والمحايد بعد `ein` نهاية `-es`."},{"text":"قارِن النمط مع الجمع والداتيف","example":"frischere Zutaten · mit frischeren Zutaten","why":"بلا أداة يأخذ جمع الأكوزاتيف في المثال `-e`، وبعد `mit` يأخذ جمع الداتيف `-en`. وفي `mit einer besseren Mischung` تؤدي `einer` وظيفة العلامة، وتأتي الصفة بـ `-en`."}],"explain":["استعمل `als` عند ذكر الطرف الثاني بعد المقارنة، مثل `Die Suppe ist günstiger als der Salat`. في المقارنة المتساوية تقول `so günstig wie`. بعض صيغ المقارنة مثل `mehr` و`weniger` تُستعمل عادة بلا نهاية عندما تدل على كمية في `mehr Wasser` و`weniger Salz`. في التمرين ابحث عن اسم يلي الصفة، ثم اختر طريقة التصريف."],"questions":[{"id":"komparativ-1","type":"cloze","topic":"komparativ","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"اكتب المقارنة من gut بعد sein.","grounded":false,"text":"Diese Suppe ist {{1}}.","blanks":[["besser"]],"explain":"المقارنة من gut هي besser وتأتي بلا نهاية تصريف هنا.","hints":["تذكّر أن هذه صيغة شاذة."],"de":{"prompt":"Schreib den Komparativ von `gut` nach `sein`.","explain":"Der Komparativ von `gut` ist `besser`, hier ohne Deklinationsendung.","hints":["Denk daran: Das ist eine unregelmäßige Form."]}},{"id":"komparativ-2","type":"cloze","topic":"komparativ","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل المقارنة من billig قبل الاسم.","grounded":false,"text":"Ich kaufe eine {{1}} Tasche.","blanks":[["billigere"]],"explain":"تضيف -e للمؤنث في الأكوزاتيف بعد eine.","hints":["ابدأ بـ billiger ثم انظر إلى أداة المؤنث."],"de":{"prompt":"Ergänze den Komparativ von `billig` vor dem Nomen.","explain":"Für das Femininum im Akkusativ nach `eine` kommt `-e` dazu.","hints":["Beginne mit `billiger` und schau dann auf den femininen Artikel."]}},{"id":"komparativ-3","type":"mcq","topic":"komparativ","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أيّ تركيب معياري يقارن وجبتين مختلفتين في السعر؟","grounded":false,"options":["billiger als","billiger wie","so billiger als"],"answer":0,"explain":"بعد billiger نستخدم als. في التساوي نقول so billig wie.","hints":["استخدم الرابط الذي يأتي بعد المقارنة غير المتساوية."],"de":{"prompt":"Welche Standardstruktur vergleicht zwei Gerichte mit verschiedenem Preis?","explain":"Nach `billiger` benutzen wir `als`. Bei Gleichheit sagen wir `so billig wie`.","hints":["Benutze das Wort, das nach einem ungleichen Vergleich folgt."]}},{"id":"komparativ-4","type":"cloze","topic":"komparativ","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"اكتب المقارنة المصرفة من gesund ثم frisch.","grounded":false,"te
