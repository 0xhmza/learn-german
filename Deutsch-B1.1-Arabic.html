elativsatz und ändert die Bedeutung. Die andere lässt das Komma vor dem Relativsatz weg.","hints":["Das Adverb gehört zum Finden, der Relativsatz zum Suchen."]}},{"id":"relativ-einschub-7","type":"text","topic":"relativ-einschub","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"ادمج Die Kollegin ruft morgen an وIch arbeite mit der Kollegin. ابدأ بـ Die Kollegin.","grounded":false,"answer":"Die Kollegin, mit der ich arbeite, ruft morgen an.","explain":"mit der داتيف المؤنث. بعد فاصلة الإغلاق تستأنف الرئيسية بالفعل المنفصل ruft … an.","hints":["ضع mit der في بداية الوصل واحتفظ ببادئة an للرئيسية."],"de":{"prompt":"Verbinde `Die Kollegin ruft morgen an` und `Ich arbeite mit der Kollegin`. Beginne mit `Die Kollegin`.","explain":"`mit der` ist Dativ feminin. Nach dem schließenden Komma geht der Hauptsatz mit dem trennbaren Verb `ruft … an` weiter.","hints":["Setz `mit der` an den Anfang des Relativsatzes und lass `an` im Hauptsatz."]}},{"id":"relativ-einschub-8","type":"text","topic":"relativ-einschub","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Die Bücher, die du suchst liegen hier.","answer":"Die Bücher, die du suchst, liegen hier.","explain":"الفاصلة الثانية تحدد بداية بقية الجملة الرئيسية عند `liegen`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Das zweite Komma markiert, wo der Rest des Hauptsatzes mit `liegen` beginnt.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"relativ-einschub-9","type":"text","topic":"relativ-einschub","difficulty":2,"prompt":"احذف الوصل من `Der Schlüssel, den du suchst, liegt auf dem Tisch`.","answer":"تبقى `Der Schlüssel liegt auf dem Tisch`. هذا اختبار سريع لمكان الفاصلتين.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Lass den Relativsatz in `Der Schlüssel, den du suchst, liegt auf dem Tisch` weg.","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Es bleibt `Der Schlüssel liegt auf dem Tisch`. Das ist ein schneller Test für die Position der Kommas."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"إذا جاء الاسم الموصوف قبل اكتمال الجملة الرئيسية، يمكنك إدراج جملة الوصل بعده مباشرة. استعمل الفاصلتين كي تعرف أين تتوقف الرئيسية وأين تستأنفها.","example":"Die Nachbarin, der ich geholfen habe, zieht morgen um.","translation":"الجارَة التي ساعدتُها ستنتقل غدًا.","pitfall":["Die Bücher, die du suchst liegen hier. → Die Bücher, die du suchst, liegen hier.","الفاصلة الثانية تحدد بداية بقية الجملة الرئيسية عند `liegen`."],"recall":["احذف الوصل من `Der Schlüssel, den du suchst, liegt auf dem Tisch`.","تبقى `Der Schlüssel liegt auf dem Tisch`. هذا اختبار سريع لمكان الفاصلتين."],"de":{"title":"Eingeschobene Relativsätze","lead":"Steht das Bezugswort, bevor der Hauptsatz fertig ist, kannst du den Relativsatz direkt danach einschieben. Die beiden Kommas zeigen dir, wo der Hauptsatz pausiert und wo er weitergeht.","steps":[{"text":"Lies das Gerüst vor dem Einschub","why":"Das ist der Hauptsatz. `zieht` steht auf Position 2 nach dem Subjekt, und das Präfix des trennbaren Verbs `umziehen` steht am Ende."},{"text":"Bilde den Relativsatz zuerst im Kopf","why":"`der` ist feminin Dativ, weil `helfen` den Dativ verlangt. `habe` bleibt am Ende des Nebensatzes."},{"text":"Schieb den Relativsatz zwischen zwei Kommas ein","why":"Nach dem zweiten Komma geht es mit `zieht` weiter. Lass den Teil zwischen den Kommas probeweise weg: Das Gerüst des Hauptsatzes muss intakt bleiben."},{"text":"Probiere den Einschub nach einem Objekt","why":"Das Bezugswort steht hier im Mittelfeld. `suchst` steht vor dem zweiten Komma, dann geht der Hauptsatz mit `gestern gefunden` weiter."}],"explain":["Steht der Relativsatz am Satzende, reichen ein öffnendes Komma und das Satzzeichen am Schluss. In `Ich besuche den Mann, dem ich helfe.` folgt kein Rest des Hauptsatzes. Stellst du ein Adverb an den Anfang des Hauptsatzes, richtet sich die Wortstellung danach: `Morgen besucht uns die Frau, die hier wohnt.` Der Relativsatz folgt immer seinem Bezugswort – auch wenn sich dessen Position ändert."],"pitfall":"Das zweite Komma markiert, wo der Rest des Hauptsatzes mit `liegen` beginnt.","recall":["Lass den Relativsatz in `Der Schlüssel, den du suchst, liegt auf dem Tisch` weg.","Es bleibt `Der Schlüssel liegt auf dem Tisch`. Das ist ein schneller Test für die Position der Kommas."],"links":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"]},"pattern":["Nomen",", Relativsatz ,","Rest des Hauptsatzes"],"frames":[{"k":"main","parts":[["vf","Die Nachbarin, der ich geholfen habe,"],["v","zieht"],["mf","morgen"],["ve","um"]]},{"k":"rel","parts":[["c","der"],["mf","ich"],["ve","geholfen habe"]]}]},{"id":"partizip1","chapter":2,"title":"وصف من يقوم بالفعل","german":"Partizip I","emoji":"🌱","links":[["فهرس قواعد الوحدة 2 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["Partizip I · grammis","https://grammis.ids-mannheim.de/terms/view/180"]],"steps":[{"text":"ابدأ بالمصدر كاملًا","example":"spielen","why":"المصدر هو شكل القاموس. احتفظ به كاملًا قبل إضافة حرف الاشتقاق."},{"text":"أضف d في نهاية المصدر","example":"spielen + d → spielend","why":"هذه صيغة `Partizip I` الأساسية. من `arbeiten` نحصل على `arbeitend` ومن `anrufen` على `anrufend`. تبقى البادئة المتصلة في صيغة المصدر جزءًا من الكلمة."},{"text":"ضع الصيغة قبل الاسم مع النهاية","example":"die spielenden Kinder","why":"عندما تتحول الصيغة إلى صفة قبل الاسم، تلحقها نهاية الصفة. هنا الجمع بعد `die` يأخذ `-en`. حرف `d` جزء من الصيغة، و`-en` جزء من التصريف."},{"text":"وسّع الوصف إذا احتجت","example":"die im Hof spielenden Kinder","why":"تسبق معلومات مثل `im Hof` الصفة. تستطيع تفكيك الوصف إلى جملة وصل، `die Kinder, die im Hof spielen`، لتحدد من يقوم بالفعل."}],"explain":["الزمن يُفهم من السياق. في `Gestern sah ich ein schlafendes Kind` كان الطفل نائمًا وقت رؤيتي له أمس. وفي `Sie kam lächelnd herein` تصف `lächelnd` طريقة دخولها، وتأتي هنا بلا نهاية صفة لأنها خارج المجموعة الاسمية. الصيغتان الشائعتان `seiend` و`tuend` تبنيان من `sein` و`tun` مع حرف العلة المسموع في الصيغة."],"questions":[{"id":"partizip1-1","type":"cloze","topic":"partizip1","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"اكتب Partizip I من warten بلا نهاية صفة.","grounded":false,"text":"warten → {{1}}","blanks":[["wartend"]],"explain":"تضاف d إلى المصدر كاملًا.","hints":["أضف حرفًا واحدًا إلى المصدر."],"de":{"prompt":"Schreib das Partizip I von `warten` ohne Adjektivendung.","explain":"An den vollständigen Infinitiv wird ein `d` angehängt.","hints":["Häng einen Buchstaben an den Infinitiv."]}},{"id":"partizip1-2","type":"cloze","topic":"partizip1","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"كوّن صيغة الوصف من schlafen بعد ein.","grounded":false,"text":"ein {{1}} Kind","blanks":[["schlafendes"]],"explain":"schlafen + d يعطي schlafend، ثم تأتي -es مع ein Kind.","hints":["افصل اشتقاق الصيغة عن نهاية المحايد."],"de":{"prompt":"Bilde die Form von `schlafen` nach `ein`.","explain":"`schlafen` + `d` ergibt `schlafend`, dann kommt `-es` mit `ein Kind`.","hints":["Trenne die Bildung des Partizips von der Neutrum-Endung."]}},{"id":"partizip1-3","type":"mcq","topic":"partizip1","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أي وصف يعني أن الضيوف يقومون بالانتظار؟","grounded":false,"options":["die wartenden Gäste","die gewarteten Gäste","die warten Gäste"],"answer":0,"explain":"Partizip I يدل على نشاط الضيوف. warteten/gewarteten لا يحققان هذا البناء، وwarten مصدر مجرد.","hints":["اختر صيغة المصدر + d مع النهاية المناسبة."],"de":{"prompt":"Welche Beschreibung bedeutet, dass die Gäste gerade warten?","explain":"Das Partizip I zeigt, dass die Gäste aktiv sind. `warteten`/`gewarteten` bilden diese Struktur nicht, und `warten` ist nur der Infinitiv.","hints":["Wähle Infinitiv + d mit der passenden Endung."]}},{"id":"partizip1-4","type":"cloze","topic":"partizip1","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"اشتق الصفة من ankommen للجمع.","grounded":false,"text":"Die {{1}} Gäste warten am Eingang.","blanks":[["ankommenden"]],"explain":"ankommen يصبح ankommend ثم ankommenden.","hints":["احتفظ بالبادئة وأضف نهاية الجمع بعد die."],"de":{"prompt":"Bilde das Adjektiv von `ankommen` für den Plural.","explain":"`ankommen` wird zu `ankommend`, dann `ankommenden`.","hints":["Behalte das Präfix und häng die Pluralendung nach `die` an."]}},{"id":"partizip1-5","type":"order","topic":"partizip1","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب العبارة بوضع الوصف قبل الاسم. ضع im Hof قبل الصفة.","grounded":false,"items":["die","im Hof","spielenden","Kinder"],"explain":"im Hof يحدد مكان اللعب ويتقدم على spielenden داخل المجموعة.","hints":["الوصف كله يجيب عن سؤال أي أطفال؟"],"de":{"prompt":"Ordne den Ausdruck und stell die Beschreibung vor das Nomen. Setz `im Hof` vor das Adjektiv.","explain":"`im Hof` gibt den Ort des Spielens an und steht in der Gruppe vor `spielenden`.","hints":["Die ganze Beschreibung beantwortet die Frage: Welche Kinder?"]}},{"id":"partizip1-6","type":"mcq","topic":"partizip1","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"لماذا تأتي lächelnd بلا نهاية في Sie kam lächelnd herein؟","grounded":false,"options":["تصف طريقة دخولها خارج المجموعة الاسمية.","لأن كل Partizip I بلا نهاية حتى قبل الاسم.","لأن الماضي يحذف نهايات الصفات."],"answer":0,"explain":"هنا الصيغة ظرفية. عندما تصف اسمًا قبلَه، مثل ein lächelndes Kind، تأخذ نهاية.","hints":["هل توجد كلمة اسمية بعدها تصفها مباشرة؟"],"de":{"prompt":"Warum hat `lächelnd` in `Sie kam lächelnd herein` keine Endung?","explain":"Hier wird das Partizip adverbial benutzt. Beschreibt es ein Nomen direkt davor, z. B. `ein lächelndes Kind`, bekommt es eine Endung.","hints":["Gibt es direkt danach ein Nomen, das es beschreibt?"],"options":["Es beschreibt, wie sie hereinkam – außerhalb einer Nominalgruppe.","Weil Partizip I nie eine Endung hat, auch nicht vor einem Nomen.","Weil die Vergangenheit Adjektivendungen löscht."]}},{"id":"partizip1-7","type":"text","topic":"partizip1","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"حوّل Die Kinder, die im Garten lachen إلى مجموعة اسمية فيها Partizip I.","grounded":false,"answer":"die im Garten lachenden Kinder","explain":"lachen + d يعطي lachend. أضف -en للجمع بعد die وضع im Garten قبل الصفة.","hints":["من الذي يضحك؟ أين توضع معلومات المكان داخل الوصف؟"],"de":{"prompt":"Mach aus `Die Kinder, die im Garten lachen` eine Nominalgruppe mit Partizip I.","explain":"`lachen` + `d` ergibt `lachend`. Häng `-en` für den Plural nach `die` an und stell `im Garten` vor das Adjektiv.","hints":["Wer lacht? Wo steht die Ortsangabe in der Beschreibung?"]}},{"id":"partizip1-8","type":"text","topic":"partizip1","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"ein weinenes Kind","answer":"ein weinendes Kind","explain":"أضف `d` إلى `weinen` أولًا، ثم `-es` للمحايد بعد `ein` في هذا السياق.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Häng zuerst ein `d` an `weinen` und dann in diesem Kontext `-es` für das Neutrum nach `ein`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"partizip1-9","type":"text","topic":"partizip1","difficulty":2,"prompt":"كيف تفكّ `die wartenden Gäste` إلى جملة وصل؟","answer":"`die Gäste, die warten`. الضيوف أنفسهم يقومون بالانتظار.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Wie löst du `die wartenden Gäste` in einen Relativsatz auf?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`die Gäste, die warten`. Die Gäste selbst warten."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"حين تريد وصف شخص أو شيء بفعل يؤديه، يمكنك بناء صيغة `Partizip I` من مصدر الفعل. غالبًا يصف الاسم وهو يقوم بالفعل في الوقت المعني بالسياق.","example":"Die Kinder spielen. → die spielenden Kinder","translation":"الأطفال يلعبون ← الأطفال الذين يلعبون.","pitfall":["ein weinenes Kind → ein weinendes Kind","أضف `d` إلى `weinen` أولًا، ثم `-es` للمحايد بعد `ein` في هذا السياق."],"recall":["كيف تفكّ `die wartenden Gäste` إلى جملة وصل؟","`die Gäste, die warten`. الضيوف أنفسهم يقومون بالانتظار."],"de":{"title":"Partizip I","lead":"Willst du eine Person oder Sache durch eine Handlung beschreiben, die sie gerade ausführt, kannst du aus dem Infinitiv das `Partizip I` bilden. Meist beschreibt es, dass das Nomen die Handlung zur gleichen Zeit ausführt.","steps":[{"text":"Beginne mit dem vollständigen Infinitiv","why":"Der Infinitiv ist die Wörterbuchform. Behalte ihn komplett, bevor du die Endung anhängst."},{"text":"Häng ein d an den Infinitiv","why":"Das ist die Grundform des `Partizip I`. Aus `arbeiten` wird `arbeitend`, aus `anrufen` `anrufend`. Das Präfix bleibt Teil des Wortes."},{"text":"Stell die Form mit Endung vor das Nomen","why":"Wird das Partizip zum Adjektiv vor einem Nomen, bekommt es eine Adjektivendung. Hier: Plural nach `die` → `-en`. Das `d` gehört zum Partizip, das `-en` zur Deklination."},{"text":"Erweitere die Beschreibung bei Bedarf","why":"Angaben wie `im Hof` stehen vor dem Partizip. Du kannst die Gruppe in einen Relativsatz auflösen – `die Kinder, die im Hof spielen` – und so sehen, wer die Handlung ausführt."}],"explain":["Die Zeit ergibt sich aus dem Kontext. In `Gestern sah ich ein schlafendes Kind` schlief das Kind, als ich es gestern sah. In `Sie kam lächelnd herein` beschreibt `lächelnd`, wie sie hereinkam – ohne Adjektivendung, weil es außerhalb einer Nominalgruppe steht. Die häufigen Formen `seiend` und `tuend` werden aus `sein` und `tun` gebildet."],"pitfall":"Häng zuerst ein `d` an `weinen` und dann in diesem Kontext `-es` für das Neutrum nach `ein`.","recall":["Wie löst du `die wartenden Gäste` in einen Relativsatz auf?","`die Gäste, die warten`. Die Gäste selbst warten."],"links":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Partizip I · grammis"]},"pattern":["Infinitiv","+ d","+ Adjektivendung"],"frames":[{"k":"np","parts":[["n","die"],["hl","im Hof spielenden"],["n","Kinder"]]},{"k":"rel","parts":[["n","die Kinder,"],["c","die"],["mf","im Hof"],["ve","spielen"]]}]},{"id":"partizip-adjektiv","chapter":2,"title":"الفرق بين الوصف بالفعل ونتيجته","german":"Partizip I und II als Adjektiv","emoji":"🎨","links":[["فهرس قواعد الوحدة 2 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["Partizip I · grammis","https://grammis.ids-mannheim.de/terms/view/180"]],"steps":[{"text":"افهم دور الاسم مع Partizip I","example":"die reparierende Person","why":"الشخص هو من يصلح. من المصدر `reparieren` نصنع `reparierend` ثم نضيف `-e` للمؤنث بعد الأداة المحددة في الرفع."},{"text":"اختر Partizip II لوصف النتيجة","example":"das reparierte Fahrrad","why":"الدراجة هي ما أُصلح. صيغة `repariert` تعرفها من الماضي، وتضاف إليها `-e` حين تأتي صفة للمحايد بعد `das` في الرفع أو الأكوزاتيف."},{"text":"انتبه إلى شكل الفعل الأصلي","example":"öffnen → geöffnet · schreiben → geschrieben · verkaufen → verkauft","why":"احتفظ بصيغة `Partizip II` كما هي قبل إلحاق نهاية الصفة. أفعال مثل `reparieren` و`verkaufen` لا تكتسب `ge-` في هذه الصيغة."},{"text":"افصل الصيغة عن النهاية","example":"mit einem frisch gestrichenen Tisch","why":"في `gestrichenen` الأساس `gestrichen`، ثم أضفت `-en` بعد `einem`. الداتيف يأتي من `mit`، حتى مع وجود كلمة إضافية مثل `frisch`."}],"explain":["قد يحمل `Partizip II` معنى الإتمام حتى عندما يكون الاسم نفسه من قام بالحركة. مثال ذلك `die angekommenen Gäste`، أي الضيوف الذين وصلوا بالفعل. قارنها بـ `die ankommenden Gäste` أي الذين يصلون الآن أو في الوقت المعني. الصفة قبل الاسم تحمل نهاية، بينما في `Die Tür ist geschlossen` تظهر `geschlossen` بلا نهاية بعد `sein`."],"questions":[{"id":"partizip-adjektiv-1","type":"mcq","topic":"partizip-adjektiv","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أي عبارة تعني «الدراجة التي أُصلحت»؟","grounded":false,"options":["das reparierte Fahrrad","das reparierende Fahrrad","das reparieren Fahrrad"],"answer":0,"explain":"repariert يصف نتيجة الإصلاح. reparierend يجعل الدراجة هي التي تصلح. reparieren مصدر.","hints":["اسأل من الذي قام بالإصلاح."],"de":{"prompt":"Welcher Ausdruck bedeutet „das Fahrrad, das repariert wurde“?","explain":"`repariert` beschreibt das Ergebnis der Reparatur. `reparierend` würde bedeuten, dass das Fahrrad repariert. `reparieren` ist der Infinitiv.","hints":["Frag, wer repariert hat."]}},{"id":"partizip-adjektiv-2","type":"cloze","topic":"partizip-adjektiv","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"صف الرسالة بوصفها نتيجة الكتابة. استعمل schreiben.","grounded":false,"text":"der {{1}} Brief","blanks":[["geschriebene"]],"explain":"geschrieben يأخذ -e قبل المذكر في الرفع بعد der.","hints":["ابدأ بصيغة Partizip II للفعل الشاذ."],"de":{"prompt":"Beschreib den Brief als Ergebnis des Schreibens. Benutze `schreiben`.","explain":"`geschrieben` bekommt `-e` vor einem Maskulinum im Nominativ nach `der`.","hints":["Beginne mit dem Partizip II des unregelmäßigen Verbs."]}},{"id":"partizip-adjektiv-3","type":"cloze","topic":"partizip-adjektiv","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل الوصف لعمّال يؤدّون العمل الآن. استعمل arbeiten.","grounded":false,"text":"die {{1}} Menschen","blanks":[["arbeitenden"]],"explain":"arbeitend + -en للجمع بعد die.","hints":["هؤلاء يقومون بالفعل."],"de":{"prompt":"Ergänze die Beschreibung für Arbeiter, die gerade arbeiten. Benutze `arbeiten`.","explain":"`arbeitend` + `-en` für den Plural nach `die`.","hints":["Diese Menschen führen die Handlung aus."]}},{"id":"partizip-adjektiv-4","type":"mcq","topic":"partizip-adjektiv","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أيّ عبارة تدل على أن الضيوف وصلوا بالفعل؟","grounded":false,"options":["die angekommenen Gäste","die ankommenden Gäste","die ankommen Gäste"],"answer":0,"explain":"angekommen يصف اكتمال الوصول. ankommend يصف حركة الوصول في الوقت المعني.","hints":["ركّز على اكتمال فعل الوصول."],"de":{"prompt":"Welcher Ausdruck zeigt, dass die Gäste schon angekommen sind?","explain":"`angekommen` beschreibt das abgeschlossene Ankommen. `ankommend` beschreibt das Ankommen zum gemeinten Zeitpunkt.","hints":["Konzentrier dich auf das abgeschlossene Ankommen."]}},{"id":"partizip-adjektiv-5","type":"cloze","topic":"partizip-adjektiv","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل بوصف الطاولة بعد دهنها. استعمل streichen.","grounded":false,"text":"mit einem frisch {{1}} Tisch","blanks":[["gestrichenen"]],"explain":"gestrichen + -en بعد einem مع الاسم المذكر في الداتيف.","hints":["اكتب Partizip II ثم نهاية الداتيف."],"de":{"prompt":"Beschreib den Tisch, nachdem er gestrichen wurde. Benutze `streichen`.","explain":"`gestrichen` + `-en` nach `einem` mit einem maskulinen Nomen im Dativ.","hints":["Schreib das Partizip II und dann die Dativendung."]}},{"id":"partizip-adjektiv-6","type":"mcq","topic":"partizip-adjektiv","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"اختر فرق المعنى بين das geöffnete Tor وdas sich öffnende Tor.","grounded":false,"options":["الأولى تصف بوابة فُتحت، والثانية بوابة تنفتح.","العبارتان تصفان بوابة أُغلقت.","الأولى تصف بدء الفتح، والثانية تصف اكتماله."],"answer":0,"explain":"geöffnet هو Partizip II ويعرض النتيجة. sich öffnend يصف ما يجري.","hints":["أيّ وصف يضم Partizip II؟"],"de":{"prompt":"Was ist der Unterschied zwischen `das geöffnete Tor` und `das sich öffnende Tor`?","explain":"`geöffnet` ist Partizip II und zeigt das Ergebnis. `sich öffnend` beschreibt, was gerade passiert.","hints":["Welche Beschreibung enthält ein Partizip II?"],"options":["Das erste ist ein Tor, das geöffnet wurde; das zweite ein Tor, das sich gerade öffnet.","Beide beschreiben ein geschlossenes Tor.","Das erste beschreibt den Beginn des Öffnens, das zweite das Ende."]}},{"id":"partizip-adjektiv-7","type":"text","topic":"partizip-adjektiv","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"اكتب وصفين لـ das Fenster. النافذة المنظَّفة من putzen، والنافذة التي تنغلق من sich schließen.","grounded":false,"answer":"das geputzte Fenster und das sich schließende Fenster","explain":"geputzt + -e وصف النتيجة. sich schließend + -e يصف الانغلاق الجاري.","hints":["حدّد أي وصف فيه نتيجة وأيهما فيه عملية."],"de":{"prompt":"Schreib zwei Beschreibungen für `das Fenster`: das geputzte Fenster (`putzen`) und das Fenster, das sich gerade schließt (`sich schließen`).","explain":"`geputzt` + `-e` beschreibt das Ergebnis. `sich schließend` + `-e` beschreibt das laufende Schließen.","hints":["Bestimme, welche Beschreibung ein Ergebnis und welche einen Vorgang zeigt."]}},{"id":"partizip-adjektiv-8","type":"text","topic":"partizip-adjektiv","difficulty":3,"prompt":"صحّح الوصف حتى يعني «الدراجات التي أُصلحت». واشرح اختيارك.","context":"die reparierenden Fahrräder","answer":"die reparierten Fahrräder","explain":"إذا كنت تقصد الدراجات التي أُصلحت فقل `die reparierten Fahrräder`. اختيار `reparierenden` يجعل الدراجات تقوم بالإصلاح.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere die Beschreibung, sodass sie „die Fahrräder, die repariert wurden“ bedeutet, und erkläre deine Wahl.","explain":"Meinst du Fahrräder, die repariert wurden, sag `die reparierten Fahrräder`. Mit `reparierenden` würden die Fahrräder selbst reparieren.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"partizip-adjektiv-9","type":"text","topic":"partizip-adjektiv","difficulty":2,"prompt":"ما الفرق بين `ein geschriebenes Wort` و`ein schreibendes Kind`؟","answer":"الكلمة نتيجة الكتابة، والطفل يقوم بالكتابة. نهاية المحايد بعد `ein` هي `-es` في الحالتين.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Was ist der Unterschied zwischen `ein geschriebenes Wort` und `ein schreibendes Kind`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Das Wort ist das Ergebnis des Schreibens, das Kind schreibt selbst. Die Neutrum-Endung nach `ein` ist in beiden Fällen `-es`."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"يقودك اختيار الصيغة إلى سؤالين. هل الاسم يقوم بالفعل؟ أم وقع عليه الإجراء أو صار في الحالة الناتجة عنه؟","example":"die schließende Tür · die geschlossene Tür","translation":"الباب الذي ينغلق الآن · الباب المغلق.","pitfall":["die reparierenden Fahrräder → die reparierten Fahrräder","إذا كنت تقصد الدراجات التي أُصلحت فقل `die reparierten Fahrräder`. اختيار `reparierenden` يجعل الدراجات تقوم بالإصلاح."],"recall":["ما الفرق بين `ein geschriebenes Wort` و`ein schreibendes Kind`؟","الكلمة نتيجة الكتابة، والطفل يقوم بالكتابة. نهاية المحايد بعد `ein` هي `-es` في الحالتين."],"de":{"title":"Partizip I und II als Adjektiv","lead":"Bei der Wahl der Form helfen dir zwei Fragen: Führt das Nomen die Handlung selbst aus? Oder ist mit ihm etwas passiert bzw. ist es im Ergebnis-Zustand?","steps":[{"text":"Verstehe die Rolle des Nomens beim Partizip I","why":"Die Person repariert selbst. Aus `reparieren` wird `reparierend`, dazu kommt `-e` für das Femininum nach dem bestimmten Artikel im Nominativ."},{"text":"Wähle Partizip II für das Ergebnis","why":"Das Fahrrad wurde repariert. Die Form `repariert` kennst du aus dem Perfekt; als Adjektiv für ein Neutrum nach `das` (Nominativ oder Akkusativ) bekommt sie `-e`."},{"text":"Achte auf die Form des Verbs","why":"Behalte das `Partizip II` genau so, bevor du die Adjektivendung anhängst. Verben wie `reparieren` und `verkaufen` bekommen in dieser Form kein `ge-`."},{"text":"Trenne Form und Endung","why":"In `gestrichenen` ist die Basis `gestrichen`, danach kommt `-en` nach `einem`. Der Dativ kommt von `mit` – auch mit einem Zusatzwort wie `frisch`."}],"explain":["Das `Partizip II` kann Abgeschlossenheit ausdrücken, sogar wenn das Nomen selbst die Bewegung gemacht hat: `die angekommenen Gäste` sind die Gäste, die schon da sind. Vergleiche mit `die ankommenden Gäste`, die gerade (oder zum gemeinten Zeitpunkt) ankommen. Vor dem Nomen hat das Partizip eine Endung, nach `sein` dagegen nicht: `Die Tür ist geschlossen`."],"pitfall":"Meinst du Fahrräder, die repariert wurden, sag `die reparierten Fahrräder`. Mit `reparierenden` würden die Fahrräder selbst reparieren.","recall":["Was ist der Unterschied zwischen `ein geschriebenes Wort` und `ein schreibendes Kind`?","Das Wort ist das Ergebnis des Schreibens, das Kind schreibt selbst. Die Neutrum-Endung nach `ein` ist in beiden Fällen `-es`."],"links":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Partizip I · grammis"]},"pattern":["Partizip I = macht gerade (aktiv)","·","Partizip II = Ergebnis (passiv / fertig)"],"frames":[{"k":"np","parts":[["n","die"],["hl","schließende"],["n","Tür"]]},{"k":"np","parts":[["n","die"],["hl","geschlossene"],["n","Tür"]]}]},{"id":"infinitiv-zu","chapter":2,"title":"المصدر مع zu","german":"Infinitiv mit zu","emoji":"✍️","links":[["فهرس قواعد الوحدة 2 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["المجموعات المصدرية · grammis","https://grammis.ids-mannheim.de/progr%40mm/6852"],["الفاصلة في الجمل التابعة · القواعد الإملائية الرسمية","https://grammis.ids-mannheim.de/rechtschreibung/6203"]],"steps":[{"text":"ابحث عن التعبير الذي يفتح المجموعة","example":"Ich versuche … · Ich habe vor … · Es ist wichtig …","why":"بعد تعبيرات مثل `versuchen` و`vorhaben` و`es ist wichtig` تكمل المجموعة المصدرية المعنى. اسأل ماذا يحاول الشخص أو ماذا ينوي."},{"text":"استدل على صاحب الفعل من الجملة","example":"Ich verspreche dir, pünktlich zu kommen.","why":"الذي سيأتي هو صاحب الوعد. في `Ich bitte dich, pünktlich zu kommen` المخاطب هو الذي سيأتي. الفعل الأول يساعدك على تحديد الشخص المقصود."},{"text":"ضع zu بحسب نوع الفعل","example":"zu lesen · zu verstehen · anzurufen","why":"مع الفعل البسيط وغير القابل للفصل تسبق `zu` المصدر. مع القابل للفصل تدخل بين البادئة والجذر وتكتب الكلمة متصلة، مثل `aufzustehen` و`mitzubringen`."},{"text":"راجع الفاصلة ومكان المجموعة","example":"Ich habe den Wunsch, im Ausland zu arbeiten.","why":"تفصل الفاصلة المجموعة المصدرية التي تؤدي وظيفة جملة تابعة. هنا تتعلق المجموعة بالاسم `Wunsch`. وتظهر الفاصلة كذلك مع رابط مثل `ohne` أو كلمة تمهّد للمجموعة مثل `daran` في `Sie denkt daran, früher zu gehen`."},{"text":"عبّر عن الهدف بـ um … zu","example":"Ich lerne Deutsch, um im Alltag sicherer zu sprechen.","why":"تجيب مجموعة `um … zu` عن سؤال `Wozu lerne ich Deutsch?`، أي ما الهدف؟ الذي يتعلّم هو نفسه الذي يريد أن يتحدث بثقة أكبر. إذا كان الهدف يخص شخصًا آخر يمكنك التصريح بفاعله في جملة `damit`، مثل `Ich spreche langsam, damit du mich verstehst`. وقارن `Ich hoffe, sicherer zu sprechen` حيث تبيّن المجموعة مضمون الأمل، و`Ich übe, um sicherer zu sprechen` حيث تبيّن الهدف."}],"explain":["قد تظهر `zu` مع فعل ناقص إذا كان هو نفسه آخر المجموعة المصدرية، كما في `Ich hoffe, bald kommen zu können`. أما عندما يكون الفعل الناقص مصرفًا في الرئيسية فتقول `Ich kann bald kommen` بمصدر مجرد. وعند الحاجة إلى ذكر فاعل مختلف صراحةً تستطيع استعمال جملة `dass` حيث يسمح التعبير بذلك، مثل `Ich hoffe, dass du bald kommst`. في الإملاء الحالي تفصل المجموعة المصدرية التي تؤدي وظيفة جملة تابعة بفاصلة. ويجوز في بعض التراكيب القصيرة مثل `Sie versucht(,) zu schlafen` تحليل المصدر وحده على أنه مجموعة كلمات، فتكون الفاصلة جائزة. وفي `Es scheint zu regnen` يشكل الفعلان مسندًا واحدًا وتكتب الجملة بلا فاصلة."],"questions":[{"id":"infinitiv-zu-1","type":"cloze","topic":"infinitiv-zu","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل صيغة المصدر من lernen مع zu.","grounded":false,"text":"Sie versucht, Deutsch {{1}}.","blanks":[["zu lernen"]],"explain":"تكتب zu كلمة منفصلة قبل lernen.","hints":["الفعل بسيط وغير قابل للفصل."],"de":{"prompt":"Ergänze den Infinitiv von `lernen` mit `zu`.","explain":"`zu` steht als eigenes Wort vor `lernen`.","hints":["Das Verb ist einfach und nicht trennbar."]}},{"id":"infinitiv-zu-2","type":"cloze","topic":"infinitiv-zu","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل صيغة anrufen مع zu.","grounded":false,"text":"Er hat vor, morgen {{1}}.","blanks":[["anzurufen"]],"explain":"an جزء قابل للفصل، فتأتي zu بعده داخل الكلمة.","hints":["أين تذهب البادئة في صيغة المصدر؟"],"de":{"prompt":"Ergänze die Form von `anrufen` mit `zu`.","explain":"`an` ist ein trennbares Präfix, deshalb steht `zu` danach im Wort.","hints":["Wohin geht das Präfix im Infinitiv?"]}},{"id":"infinitiv-zu-3","type":"mcq","topic":"infinitiv-zu","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"اختر ما يناسب Ich kann morgen ….","grounded":false,"options":["kommen","zu kommen","zukommen"],"answer":0,"explain":"يطلب kann هنا مصدرًا مجردًا. zu kommen لا يلائم هذا التركيب، وzukommen فعل مختلف.","hints":["kann فعل ناقص مصرف."],"de":{"prompt":"Was passt zu `Ich kann morgen …`?","explain":"`kann` verlangt hier den reinen Infinitiv. `zu kommen` passt nicht in diese Struktur, und `zukommen` ist ein anderes Verb.","hints":["`kann` ist ein konjugiertes Modalverb."]}},{"id":"infinitiv-zu-4","type":"mcq","topic":"infinitiv-zu","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"من المتصل في Ich bitte ihn, anzurufen؟","grounded":false,"options":["هو، أي الشخص الذي أطلب منه.","أنا، أي الشخص الذي يطلب.","يتصل الاثنان معًا."],"answer":0,"explain":"المخاطَب بالطلب هو من يُفهم أنه يؤدي الفعل في المصدر.","hints":["حلّل bitte ihn أولًا."],"de":{"prompt":"Wer ruft an in `Ich bitte ihn, anzurufen`?","explain":"Die Person, die gebeten wird, führt die Handlung im Infinitiv aus.","hints":["Analysiere zuerst `bitte ihn`."],"options":["Er – die Person, die ich bitte.","Ich – die Person, die bittet.","Beide rufen zusammen an."]}},{"id":"infinitiv-zu-5","type":"cloze","topic":"infinitiv-zu","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل مجموعة المصدر من mitbringen ثم صيغة الاستطاعة من kommen können.","grounded":false,"text":"Ich hoffe, den Pass {{1}}. · Ich hoffe, morgen {{2}}.","blanks":[["mitzubringen"],["kommen zu können"]],"explain":"mit + zu + bringen. في التركيب الثاني تأتي zu قبل können، وهو المصدر الأخير.","hints":["أدخل zu داخل الفعل المنفصل. عند وجود مصدر ناقص ضعه آخرًا."],"de":{"prompt":"Ergänze die Infinitivgruppe von `mitbringen` und dann die Form von `kommen können`.","explain":"`mit` + `zu` + `bringen`. In der zweiten Struktur steht `zu` vor `können`, dem letzten Infinitiv.","hints":["Setz `zu` in das trennbare Verb. Bei einem Modalverb steht es zuletzt."]}},{"id":"infinitiv-zu-6","type":"order","topic":"infinitiv-zu","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب مجموعة الهدف بعد Ich übe jeden Tag. ضع Deutsch قبل sicherer.","grounded":false,"items":["um","Deutsch","sicherer","zu sprechen"],"explain":"تبيّن مجموعة um … zu لماذا أتدرّب. تأتي بعد الفاصلة ويغلقها المصدر zu sprechen.","hints":["ابدأ برابط الهدف واختم بصيغة zu مع المصدر."],"de":{"prompt":"Ordne die Zielgruppe nach `Ich übe jeden Tag`. Setz `Deutsch` vor `sicherer`.","explain":"Die Gruppe `um … zu` zeigt, warum ich übe. Sie steht nach dem Komma und endet mit `zu sprechen`.","hints":["Beginne mit dem Ziel-Wort und ende mit zu + Infinitiv."]}},{"id":"infinitiv-zu-7","type":"order","topic":"infinitiv-zu","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب المصدر بعد Sie denkt daran. ضع المفعول قبل المصدر.","grounded":false,"items":["den Termin","rechtzeitig","abzusagen"],"explain":"تأتي المكملات قبل abzusagen. وتأتي فاصلة قبل المجموعة بعد daran.","hints":["أبقِ zu داخل الفعل المنفصل."],"de":{"prompt":"Ordne die Infinitivgruppe nach `Sie denkt daran`. Setz das Objekt vor den Infinitiv.","explain":"Die Ergänzungen stehen vor `abzusagen`. Nach `daran` steht ein Komma vor der Gruppe.","hints":["Lass `zu` im trennbaren Verb."]}},{"id":"infinitiv-zu-8","type":"text","topic":"infinitiv-zu","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"حوّل Sie sagt zu mir: „Bitte steh früh auf!“ إلى جملة تبدأ بـ Sie bittet mich.","grounded":false,"answer":"Sie bittet mich, früh aufzustehen.","explain":"mich يحدّد من يقوم بالفعل. aufstehen يعطي aufzustehen.","hints":["حافظ على الضمير الذي يحدد صاحب الفعل، وحوّل الأمر إلى مصدر."],"de":{"prompt":"Forme `Sie sagt zu mir: „Bitte steh früh auf!“` in einen Satz um, der mit `Sie bittet mich` beginnt.","explain":"`mich` bestimmt, wer handelt. `aufstehen` wird zu `aufzustehen`.","hints":["Behalte das Pronomen, das zeigt, wer handelt, und mach aus dem Imperativ einen Infinitiv."]}},{"id":"infinitiv-zu-9","type":"text","topic":"infinitiv-zu","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Ich versuche, morgen zu aufstehen.","answer":"Ich versuche, morgen aufzustehen.","explain":"الفعل `aufstehen` قابل للفصل، لذلك تدخل `zu` بعد `auf`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`aufstehen` ist trennbar, deshalb steht `zu` nach `auf`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"infinitiv-zu-10","type":"text","topic":"infinitiv-zu","difficulty":2,"prompt":"من الذي يرسل الرسالة في `Sie bittet mich, die Mail zu schicken`؟","answer":"المتكلم هو الذي يرسلها. `mich` يعيّن صاحب الفعل المطلوب في مجموعة المصدر.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Wer schickt die Mail in `Sie bittet mich, die Mail zu schicken`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Die sprechende Person (ich). `mich` bestimmt, wer die gewünschte Handlung in der Infinitivgruppe ausführt."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"بعد أفعال وتعبيرات معيّنة، يمكنك قول ما تنوي فعله أو ما هو مهم لك باستعمال مجموعة مصدرية. شكل المصدر نفسه يبقى ثابتًا.","example":"Ich habe vor, mich morgen zu bewerben.","translation":"أنوي أن أتقدّم غدًا بطلب.","pitfall":["Ich versuche, morgen zu aufstehen. → Ich versuche, morgen aufzustehen.","الفعل `aufstehen` قابل للفصل، لذلك تدخل `zu` بعد `auf`."],"recall":["من الذي يرسل الرسالة في `Sie bittet mich, die Mail zu schicken`؟","المتكلم هو الذي يرسلها. `mich` يعيّن صاحب الفعل المطلوب في مجموعة المصدر."],"de":{"title":"Infinitiv mit zu","lead":"Nach bestimmten Verben und Ausdrücken kannst du mit einer Infinitivgruppe sagen, was du vorhast oder was dir wichtig ist. Der Infinitiv selbst bleibt dabei unverändert.","steps":[{"text":"Finde den Ausdruck, der die Gruppe öffnet","why":"Nach Ausdrücken wie `versuchen`, `vorhaben` und `es ist wichtig` ergänzt die Infinitivgruppe die Bedeutung. Frag: Was versucht oder plant die Person?"},{"text":"Erschließe aus dem Satz, wer handelt","why":"Wer kommen wird, ist die Person, die das Versprechen gibt. In `Ich bitte dich, pünktlich zu kommen` ist es die angesprochene Person. Das erste Verb zeigt dir, wer gemeint ist."},{"text":"Setz zu je nach Verbtyp","why":"Bei einfachen und untrennbaren Verben steht `zu` vor dem Infinitiv. Bei trennbaren Verben steht es zwischen Präfix und Stamm, und man schreibt alles zusammen: `aufzustehen`, `mitzubringen`."},{"text":"Prüfe Komma und Position der Gruppe","why":"Das Komma trennt eine Infinitivgruppe, die wie ein Nebensatz funktioniert. Hier hängt die Gruppe am Nomen `Wunsch`. Ein Komma steht auch mit einem Einleitewort wie `ohne` oder mit einem Verweiswort wie `daran`: `Sie denkt daran, früher zu gehen`."},{"text":"Drück ein Ziel mit um … zu aus","why":"Die Gruppe `um … zu` beantwortet die Frage `Wozu lerne ich Deutsch?`. Wer lernt, ist auch die Person, die sicherer sprechen will. Betrifft das Ziel eine andere Person, nenne ihr Subjekt in einem `damit`-Satz: `Ich spreche langsam, damit du mich verstehst`. Vergleiche: `Ich hoffe, sicherer zu sprechen` (Inhalt der Hoffnung) und `Ich übe, um sicherer zu sprechen` (Ziel)."}],"explain":["`zu` kann mit einem Modalverb stehen, wenn das Modalverb selbst am Ende der Infinitivgruppe steht: `Ich hoffe, bald kommen zu können`. Ist das Modalverb im Hauptsatz konjugiert, steht der reine Infinitiv: `Ich kann bald kommen`. Willst du ausdrücklich ein anderes Subjekt nennen, benutze – wo es der Ausdruck erlaubt – einen `dass`-Satz: `Ich hoffe, dass du bald kommst`. Nach den aktuellen Regeln trennt man eine Infinitivgruppe, die wie ein Nebensatz funktioniert, mit Komma. Bei kurzen Strukturen wie `Sie versucht(,) zu schlafen` ist das Komma freigestellt. In `Es scheint zu regnen` bilden die beiden Verben ein Prädikat – ohne Komma."],"pitfall":"`aufstehen` ist trennbar, deshalb steht `zu` nach `auf`.","recall":["Wer schickt die Mail in `Sie bittet mich, die Mail zu schicken`?","Die sprechende Person (ich). `mich` bestimmt, wer die gewünschte Handlung in der Infinitivgruppe ausführt."],"links":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Infinitivgruppen · grammis","Komma bei Nebensätzen · Amtliches Regelwerk"]},"pattern":["Hauptsatz",",","… zu + Infinitiv"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","habe"],["ve","vor"]]},{"k":"inf","parts":[["mf","mich morgen"],["ve","zu bewerben"]]}]},{"id":"doppelkonjunktionen","chapter":2,"title":"الربط بأدوات من جزأين","german":"Doppelkonjunktionen","emoji":"🧵","links":[["فهرس قواعد الوحدة 2 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات الربط · grammis","https://grammis.ids-mannheim.de/kontrastive-grammatik/3789"]],"steps":[{"text":"اجمع شيئين أو أكّد الثاني","example":"sowohl A als auch B · nicht nur A, sondern auch B","why":"الأولى تثبت الأمرين. الثانية تضيف تأكيدًا على الثاني، مثل `Er schreibt nicht nur Berichte, sondern auch Angebote`. ضع الجزأين قبل العنصرين اللذين تريد ربطهما."},{"text":"اعرض بديلين","example":"entweder A oder B","why":"في `Wir arbeiten entweder im Büro oder zu Hause` البديلان مكانان للعمل. حافظ على التوازي حتى يقرأ السامع ما يقع في مقابل ماذا."},{"text":"انفِ الأمرين","example":"weder A noch B","why":"في `Er hat weder Zeit noch Geld` ينفي التركيب الوقت والمال معًا. يكفي النفي الذي يحمله الزوج نفسه في هذه الجملة."},{"text":"أثبت الأمر الأول ثم ضع قيدًا","example":"zwar A, aber B","why":"في `Die Stelle ist zwar befristet, aber sie ist gut bezahlt` الأمران صحيحان. تقصر `aber` أثر المعلومة الأولى أو توازنها بمعلومة مقابلة."}],"explain":["عند ربط مجموعات بسيطة تُكتب `sowohl … als auch` و`weder … noch` و`entweder … oder` عادة بلا فاصلة. ضع فاصلة قبل `aber` و`sondern`. وإذا ربطت جملتين رئيسيتين مستقلتين بـ `oder` تستطيع استخدام الفاصلة لتوضيح البنية. ترتيب الفعل يعتمد على موضع المجموعة في الجملة، وتستطيع استعمال الصيغة البسيطة بموازاة عنصرين بعد الفعل: `Wir brauchen sowohl Zeit als auch Geld`."],"questions":[{"id":"doppelkonjunktionen-1","type":"cloze","topic":"doppelkonjunktionen","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل الربط لإثبات الخيارين.","grounded":false,"text":"Wir brauchen sowohl Zeit {{1}} Geduld.","blanks":[["als auch"]],"explain":"sowohl … als auch يثبت الحاجة إلى الوقت والصبر معًا.","hints":["اختر المكمل المعتاد لـ sowohl."],"de":{"prompt":"Ergänze die Verbindung, die beide Möglichkeiten bestätigt.","explain":"`sowohl … als auch` bestätigt, dass man Zeit und Geduld braucht.","hints":["Wähle den üblichen zweiten Teil zu `sowohl`."]}},{"id":"doppelkonjunktionen-2","type":"cloze","topic":"doppelkonjunktionen","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل الربط لنفي الخيارين.","grounded":false,"text":"Sie hat weder angerufen {{1}} geschrieben.","blanks":[["noch"]],"explain":"weder … noch ينفي الاتصال والكتابة.","hints":["weder هي بداية زوج للنفي."],"de":{"prompt":"Ergänze die Verbindung, die beide Möglichkeiten verneint.","explain":"`weder … noch` verneint Anrufen und Schreiben.","hints":["`weder` ist der Anfang eines verneinenden Paares."]}},{"id":"doppelkonjunktionen-3","type":"mcq","topic":"doppelkonjunktionen","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أي زوج يعلن بديلين للاختيار؟","grounded":false,"options":["entweder … oder","sowohl … als auch","weder … noch"],"answer":0,"explain":"entweder … oder يقدّم بديلين. الزوج الثاني يجمعهما والثالث ينفيهما.","hints":["ابحث عن معنى «إما… أو…»."],"de":{"prompt":"Welches Paar nennt zwei Alternativen zur Wahl?","explain":"`entweder … oder` bietet zwei Alternativen an. Das zweite Paar verbindet beide, das dritte verneint beide.","hints":["Such die Bedeutung „das eine oder das andere“."]}},{"id":"doppelkonjunktionen-4","type":"cloze","topic":"doppelkonjunktionen","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل معنى الإضافة مع التأكيد.","grounded":false,"text":"Er liest nicht nur Berichte, {{1}} Angebote.","blanks":[["sondern auch"]],"explain":"يقابل nicht nur هنا sondern auch وتسبقها فاصلة.","hints":["الجزء الثاني إضافة مؤكدة."],"de":{"prompt":"Ergänze die Bedeutung „zusätzlich, mit Betonung“.","explain":"Zu `nicht nur` gehört hier `sondern auch`, davor steht ein Komma.","hints":["Der zweite Teil ist eine betonte Ergänzung."]}},{"id":"doppelkonjunktionen-5","type":"order","topic":"doppelkonjunktionen","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب الجملة. ضع zwar بعد ist مباشرة.","grounded":false,"items":["Die Stelle","ist","zwar","befristet,","aber","gut bezahlt."],"explain":"zwar يقدّم الصفة الأولى وتأتي aber بعد الفاصلة لتوازنها بالثانية.","hints":["ابدأ بتقرير المعلومة ثم ضع القيد بعدها."],"de":{"prompt":"Ordne den Satz. Setz `zwar` direkt nach `ist`.","explain":"`zwar` leitet die erste Eigenschaft ein, `aber` folgt nach dem Komma und stellt die zweite gegenüber.","hints":["Bestätige zuerst die Information und setz dann die Einschränkung."]}},{"id":"doppelkonjunktionen-6","type":"mcq","topic":"doppelkonjunktionen","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"اختر كتابة صحيحة لربط اسمين.","grounded":false,"options":["Sie spricht sowohl Deutsch als auch Arabisch.","Sie spricht sowohl Deutsch, als auch Arabisch.","Sie spricht sowohl Deutsch oder Arabisch."],"answer":0,"explain":"الزوج هو sowohl … als auch ولا توضع فاصلة بين العنصرين البسيطين.","hints":["هنا نربط اسمين بلا جملتين مستقلتين."],"de":{"prompt":"Wähle die richtige Schreibweise für die Verbindung zweier Nomen.","explain":"Das Paar ist `sowohl … als auch`, und zwischen zwei einfachen Elementen steht kein Komma.","hints":["Hier verbinden wir zwei Nomen, keine zwei Sätze."]}},{"id":"doppelkonjunktionen-7","type":"text","topic":"doppelkonjunktionen","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"ادمج Ich mag den Beruf وDie Arbeitszeiten sind schwierig مع zwar … aber.","grounded":false,"answer":"Ich mag zwar den Beruf, aber die Arbeitszeiten sind schwierig.","explain":"تأتي zwar مع الإثبات الأول. تسبق aber فاصلة وتبقى جملة Arbeitszeiten في ترتيب رئيسي.","hints":["أثبت حب العمل في الجزء الأول وأضف القيد في الثاني."],"de":{"prompt":"Verbinde `Ich mag den Beruf` und `Die Arbeitszeiten sind schwierig` mit zwar … aber.","explain":"`zwar` gehört zur ersten Aussage. Vor `aber` steht ein Komma, und der Satz mit den Arbeitszeiten bleibt in Hauptsatz-Wortstellung.","hints":["Bestätige im ersten Teil, dass du den Beruf magst, und setz die Einschränkung in den zweiten."]}},{"id":"doppelkonjunktionen-8","type":"text","topic":"doppelkonjunktionen","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Er hat zwar Zeit, sondern auch Geduld.","answer":"Er hat nicht nur Zeit, sondern auch Geduld.","explain":"الزوج `nicht nur … sondern auch` يثبت الاثنين مع التأكيد على الثاني. يقترن `zwar` بـ `aber` حين تقصد التقييد.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`nicht nur … sondern auch` bestätigt beides und betont das Zweite. `zwar` gehört zu `aber`, wenn du einschränken willst.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"doppelkonjunktionen-9","type":"text","topic":"doppelkonjunktionen","difficulty":2,"prompt":"أي زوج يناسب معنى «لا السبت ولا الأحد»؟","answer":"`weder am Samstag noch am Sonntag`. الزوج ينفي الخيارين.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Welches Paar passt zu „weder Samstag noch Sonntag“?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`weder am Samstag noch am Sonntag`. Das Paar verneint beide Möglichkeiten."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"table":[["العلاقة","الزوج"],["إثبات الاثنين","sowohl … als auch"],["إثبات الاثنين مع إبراز الثاني","nicht nur …, sondern auch"],["عرض بديلين","entweder … oder"],["نفي الاثنين","weder … noch"],["إثبات مع قيد","zwar …, aber"]],"lead":"يختصر الربط المزدوج علاقتك بين شيئين. حدّد هل تريد جمعهما أم الاختيار بينهما أم نفيهما أم إثبات أحدهما مع قيد أو إضافة.","example":"Sie hat sowohl Erfahrung als auch gute Sprachkenntnisse.","translation":"لديها خبرة ومهارات لغوية جيدة أيضًا.","pitfall":["Er hat zwar Zeit, sondern auch Geduld. → Er hat nicht nur Zeit, sondern auch Geduld.","الزوج `nicht nur … sondern auch` يثبت الاثنين مع التأكيد على الثاني. يقترن `zwar` بـ `aber` حين تقصد التقييد."],"recall":["أي زوج يناسب معنى «لا السبت ولا الأحد»؟","`weder am Samstag noch am Sonntag`. الزوج ينفي الخيارين."],"de":{"title":"Doppelkonjunktionen","lead":"Eine Doppelkonjunktion zeigt kurz die Beziehung zwischen zwei Dingen. Entscheide: Willst du beide verbinden, zwischen ihnen wählen, beide verneinen oder eines bestätigen und einschränken bzw. ergänzen?","steps":[{"text":"Verbinde zwei Dinge oder betone das zweite","why":"Die erste Form bestätigt beides. Die zweite betont zusätzlich das Zweite: `Er schreibt nicht nur Berichte, sondern auch Angebote`. Setz die beiden Teile vor die zwei Elemente, die du verbindest."},{"text":"Nenne zwei Alternativen","why":"In `Wir arbeiten entweder im Büro oder zu Hause` sind die Alternativen zwei Arbeitsorte. Bleib parallel, damit man versteht, was wem gegenübersteht."},{"text":"Verneine beides","why":"In `Er hat weder Zeit noch Geld` werden Zeit und Geld zusammen verneint. Die Verneinung steckt schon im Paar – mehr braucht der Satz nicht."},{"text":"Bestätige das Erste und schränke ein","why":"In `Die Stelle ist zwar befristet, aber sie ist gut bezahlt` stimmt beides. `aber` schränkt die erste Information ein oder stellt ihr etwas gegenüber."}],"explain":["Verbindest du einfache Gruppen, schreibt man `sowohl … als auch`, `weder … noch` und `entweder … oder` meist ohne Komma. Vor `aber` und `sondern` steht ein Komma. Verbindest du zwei selbstständige Hauptsätze mit `oder`, kannst du ein Komma setzen, um die Struktur klarer zu machen. Die Verbposition hängt davon ab, wo die Gruppe im Satz steht; parallel nach dem Verb geht es ganz einfach: `Wir brauchen sowohl Zeit als auch Geld`."],"pitfall":"`nicht nur … sondern auch` bestätigt beides und betont das Zweite. `zwar` gehört zu `aber`, wenn du einschränken willst.","recall":["Welches Paar passt zu „weder Samstag noch Sonntag“?","`weder am Samstag noch am Sonntag`. Das Paar verneint beide Möglichkeiten."],"links":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Konnektoren · grammis"],"table":[["Beziehung","Paar"],["beides bestätigen","sowohl … als auch"],["beides bestätigen, das Zweite betonen","nicht nur …, sondern auch"],["zwei Alternativen","entweder … oder"],["beides verneinen","weder … noch"],["bestätigen mit Einschränkung","zwar …, aber"]]},"pattern":["sowohl … als auch","·","nicht nur … sondern auch","·","entweder … oder","·","weder … noch","·","zwar … aber"],"frames":[{"k":"main","parts":[["vf","Sie"],["v","hat"],["c","sowohl"],["mf","Erfahrung"],["c","als auch"],["mf","gute Sprachkenntnisse"]]}]},{"id":"diminutiv","chapter":3,"title":"تصغير الأسماء","german":"Diminutiv","emoji":"🐣","links":[["فهرس قواعد الوحدة 3 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["شرح القواعد، ص 35 من الكتاب · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"]],"steps":[{"text":"ألحق نهاية التصغير","example":"der Tisch → das Tischchen","why":"النهاية `-chen` شائعة، وتجد أيضًا `-lein` مثل `das Büchlein`. تختار الصيغة المتداولة للكلمة، ويفيدك القاموس عندما تشك فيها."},{"text":"راقب تغيّر الحركة","example":"der Schrank → das Schränkchen · das Haus → das Häuschen","why":"كثيرًا ما تتحول `a/o/u` إلى `ä/ö/ü` أو `au` إلى `äu` في التصغير. هذا نمط شائع، وتوجد كلمات لا يظهر فيها تغير مثل `Tischchen`."},{"text":"احذف e النهائية حيث يلزم","example":"die Kanne → das Kännchen","why":"احذف `e` النهائية هنا. يبقى الجذر `Kann-`، وتتحول الحركة إلى `ä` قبل إضافة `-chen`."},{"text":"صرّف المجموعة حسب جنسها الجديد","example":"das kleine Schränkchen · mit dem kleinen Schränkchen","why":"الأسماء التي تصغّرها بـ `-chen` أو `-lein` محايدة مهما كان جنس الاسم الأصلي. تظهر الصيغة `das` في الرفع والأكوزاتيف و`dem` في الداتيف بعد `mit`."}],"explain":["يبقى شكل الاسم في الجمع عادة كما هو مع هاتين النهايتين، مثل `das Häuschen → die Häuschen`. وتوجد نهايات إقليمية مثل `-le` و`-erl`. قد يصبح الاسم المصغّر كلمة مستقلة شائعة، وقد يدل السياق على المودة أو السخرية. عند بناء الجملة اتبع الجنس النحوي الجديد مع الأداة والصفة وضمير الوصل."],"questions":[{"id":"diminutiv-1","type":"cloze","topic":"diminutiv","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"صغّر الاسم باستعمال -chen.","grounded":false,"text":"der Schrank → das {{1}}","blanks":[["Schränkchen"]],"explain":"تتحول a إلى ä ثم تضيف -chen.","hints":["راقب حركة a في الجذر."],"de":{"prompt":"Verkleinere das Nomen mit `-chen`.","explain":"`a` wird zu `ä`, dann kommt `-chen`.","hints":["Achte auf das `a` im Stamm."]}},{"id":"diminutiv-2","type":"cloze","topic":"diminutiv","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل أداة الاسم المصغّر في الرفع.","grounded":false,"text":"{{1}} Häuschen ist alt.","blanks":[["Das"]],"explain":"Häuschen محايد لأنه مصغّر بـ -chen.","hints":["انظر إلى جنس الاسم بعد التصغير."],"de":{"prompt":"Ergänze den Artikel des verkleinerten Nomens im Nominativ.","explain":"`Häuschen` ist neutral, weil es mit `-chen` verkleinert ist.","hints":["Schau auf das Genus nach der Verkleinerung."]}},{"id":"diminutiv-3","type":"mcq","topic":"diminutiv","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أي صيغة تنتج من die Kanne؟","grounded":false,"options":["das Kännchen","die Kännchen","das Kannechen"],"answer":0,"explain":"Kanne تصبح Kännchen بعد حذف e وتغيير الحركة. للمفرد استعمل das.","hints":["احذف e النهائية وراقب حركة الجذر."],"de":{"prompt":"Welche Form entsteht aus `die Kanne`?","explain":"`Kanne` wird zu `Kännchen`: `e` fällt weg und der Vokal ändert sich. Im Singular steht `das`.","hints":["Streich das End-e und achte auf den Vokal im Stamm."]}},{"id":"diminutiv-4","type":"cloze","topic":"diminutiv","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"اكتب الجمع من Häuschen ثم صرّف الأداة مع mit للمفرد.","grounded":false,"text":"Die {{1}} sind klein. · mit {{2}} Häuschen","blanks":[["Häuschen"],["dem"]],"explain":"شكل الاسم ثابت في الجمع. بعد mit تأخذ الأداة المحددة في المحايد dem.","hints":["قارن شكل اسم الجمع وشكل أداة المحايد في الداتيف."],"de":{"prompt":"Schreib den Plural von `Häuschen` und dann den Artikel mit `mit` im Singular.","explain":"Die Pluralform bleibt gleich. Nach `mit` heißt der bestimmte Artikel im Neutrum `dem`.","hints":["Vergleiche die Pluralform des Nomens und den Dativartikel im Neutrum."]}},{"id":"diminutiv-5","type":"mcq","topic":"diminutiv","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"اختر المجموعة الصحيحة في Ich kaufe ….","grounded":false,"options":["ein kleines Tischchen","einen kleinen Tischchen","ein kleiner Tischchen"],"answer":0,"explain":"Tischchen محايد في الأكوزاتيف بعد kaufen. اختر ein ونهاية الصفة -es.","hints":["أعد تحديد الجنس بعد إضافة -chen."],"de":{"prompt":"Wähle die richtige Gruppe in `Ich kaufe …`.","explain":"`Tischchen` ist neutral und steht nach `kaufen` im Akkusativ. Wähle `ein` und die Adjektivendung `-es`.","hints":["Bestimme das Genus nach dem Anhängen von `-chen` neu."]}},{"id":"diminutiv-6","type":"cloze","topic":"diminutiv","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"اكتب اسمًا مصغّرًا من das Buch مستعملًا -lein.","grounded":false,"text":"das {{1}}","blanks":[["Büchlein"]],"explain":"Buch تصبح Büchlein بتغير u إلى ü قبل -lein.","hints":["استعمل الحركة الأمامية المناسبة لـ u."],"de":{"prompt":"Bilde aus `das Buch` eine Verkleinerung mit `-lein`.","explain":"`Buch` wird zu `Büchlein`: `u` wird vor `-lein` zu `ü`.","hints":["Benutze den passenden Umlaut für `u`."]}},{"id":"diminutiv-7","type":"text","topic":"diminutiv","difficulty":3,"src":"TELC ص 28–35 (العينة)","prompt":"حوّل Ich spiele mit der kleinen Katze إلى جملة فيها Kätzchen، واحتفظ بالصفة.","grounded":false,"answer":"Ich spiele mit dem kleinen Kätzchen.","explain":"Kätzchen محايد، لذلك تحل dem محل der. تبقى نهاية kleinen هي -en.","hints":["mit يتطلب الداتيف. حدّد جنس الاسم الجديد."],"de":{"prompt":"Forme `Ich spiele mit der kleinen Katze` in einen Satz mit `Kätzchen` um und behalte das Adjektiv.","explain":"`Kätzchen` ist neutral, deshalb ersetzt `dem` das `der`. Die Endung von `kleinen` bleibt `-en`.","hints":["`mit` verlangt den Dativ. Bestimme das Genus des neuen Nomens."]}},{"id":"diminutiv-8","type":"text","topic":"diminutiv","difficulty":3,"prompt":"صحّح الجملة لتصف منزلًا صغيرًا واحدًا. واشرح اختيار الأداة.","context":"Die Häuschen ist hübsch.","answer":"Das Häuschen ist hübsch.","explain":"للمفرد قل `Das Häuschen ist hübsch.` وللجمع `Die Häuschen sind hübsch.`. يحدّد العدد الأداة وتصريف الفعل.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Korrigiere den Satz, sodass er ein einzelnes kleines Haus beschreibt, und erkläre die Wahl des Artikels.","explain":"Im Singular sagst du `Das Häuschen ist hübsch.`, im Plural `Die Häuschen sind hübsch.` Der Numerus bestimmt Artikel und Verbform.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"diminutiv-9","type":"text","topic":"diminutiv","difficulty":2,"prompt":"كيف تصف كرسيًا صغيرًا مع `mit` إذا اخترت `Stühlchen`؟","answer":"`mit einem kleinen Stühlchen`. حرف `mit` يطلب الداتيف، والاسم المصغّر محايد.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Wie beschreibst du mit `mit` einen kleinen Stuhl, wenn du `Stühlchen` wählst?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`mit einem kleinen Stühlchen`. `mit` verlangt den Dativ, und das verkleinerte Nomen ist neutral."}}],"src":"TELC ص 28–35 (العينة)","grounded":false,"lead":"يمكن أن تدل صيغة التصغير على الحجم أو التحبّب. ابدأ بتحديد الاسم الذي تغيّر معناه، ثم افحص ثلاثة أشياء في الصيغة الجديدة: النهاية والصوت والجنس.","example":"die Kanne → das Kännchen","translation":"الإبريق ← الإبريق الصغير.","pitfall":["Die Häuschen ist hübsch. → Das Häuschen ist hübsch.","للمفرد قل `Das Häuschen ist hübsch.` وللجمع `Die Häuschen sind hübsch.`. يحدّد العدد الأداة وتصريف الفعل."],"recall":["كيف تصف كرسيًا صغيرًا مع `mit` إذا اخترت `Stühlchen`؟","`mit einem kleinen Stühlchen`. حرف `mit` يطلب الداتيف، والاسم المصغّر محايد."],"de":{"title":"Diminutiv (Verkleinerung)","lead":"Eine Verkleinerungsform kann Größe oder Zuneigung ausdrücken. Bestimme zuerst das Nomen, dessen Bedeutung sich ändert, und prüfe dann drei Dinge an der neuen Form: Endung, Vokal und Genus.","steps":[{"text":"Häng die Verkleinerungsendung an","why":"Die Endung `-chen` ist häufig, du findest aber auch `-lein`, z. B. `das Büchlein`. Nimm die übliche Form des Wortes – im Zweifel hilft das Wörterbuch."},{"text":"Achte auf den Umlaut","why":"Oft wird `a/o/u` zu `ä/ö/ü` oder `au` zu `äu`. Das ist ein häufiges Muster, aber es gibt auch Wörter ohne Änderung, z. B. `Tischchen`."},{"text":"Streich das End-e, wo nötig","why":"Hier fällt das `e` am Ende weg. Es bleibt der Stamm `Kann-`, der Vokal wird zu `ä`, dann kommt `-chen`."},{"text":"Dekliniere nach dem neuen Genus","why":"Nomen mit `-chen` oder `-lein` sind immer neutral – egal, welches Genus das ursprüngliche Nomen hatte. Du siehst `das` im Nominativ und Akkusativ und `dem` im Dativ nach `mit`."}],"explain":["Im Plural bleibt die Form mit diesen Endungen meist gleich: `das Häuschen → die Häuschen`. Es gibt auch regionale Endungen wie `-le` und `-erl`. Manche Verkleinerungen sind eigene, gängige Wörter geworden, und je nach Kontext klingen sie liebevoll oder ironisch. Im Satz richtest du Artikel, Adjektiv und Relativpronomen nach dem neuen grammatischen Genus."],"pitfall":"Im Singular sagst du `Das Häuschen ist hübsch.`, im Plural `Die Häuschen sind hübsch.` Der Numerus bestimmt Artikel und Verbform.","recall":["Wie beschreibst du mit `mit` einen kleinen Stuhl, wenn du `Stühlchen` wählst?","`mit einem kleinen Stühlchen`. `mit` verlangt den Dativ, und das verkleinerte Nomen ist neutral."],"links":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc"]},"pattern":["Nomen","+ Umlaut?","+ -chen / -lein","→ immer das"],"frames":[{"k":"np","parts":[["n","die Kanne"],["hl","→"],["n","das Kännchen"]]},{"k":"main","parts":[["vf","Das Häuschen"],["v","ist"],["mf","hübsch"]]}]},{"id":"lokale-praep","chapter":3,"title":"الحركة حول مكان أو بمحاذاته","german":"um … herum · an … entlang","emoji":"🗺️","links":[["فهرس قواعد الوحدة 3 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["شرح القواعد، ص 35 من الكتاب · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"]],"steps":[{"text":"اختر العلاقة المكانية أولًا","example":"um … herum","why":"تأتي `um` قبل الاسم و`herum` بعده. تخيّل خط سير يمر حول المعلم، مثل `um den Park herum`."},{"text":"ضع الاسم بعد um في الأكوزاتيف","example":"um den Park herum · um das Haus herum","why":"في المذكر يتحول `der Park` إلى `den Park`. في المحايد تبقى `das` ظاهريًا كما هي، لكنها هنا في حالة الأكوزاتيف."},{"text":"استعمل an … entlang للمحاذاة","example":"an der Mauer entlang · an dem Fluss entlang","why":"هنا نضع المجموعة في الداتيف. تظهر `der` مع `Mauer` المؤنث و`dem` مع `Fluss` المذكر. يُختصر `an dem` غالبًا إلى `am`."},{"text":"افحص التركيب كله قبل تخمين الحالة","example":"Wir radeln am Kanal entlang.","why":"في الجملة حركة فعلية، ومع ذلك يستعمل هذا التركيب الداتيف. إذا استعملت `entlang` وحدها بعد الاسم ترى تركيبًا آخر مثل `den Kanal entlang` بالأكوزاتيف. في تمارين هذا الدرس استعمل التركيب المزدوج المطلوب."}],"explain":["جرّب أن تصف خطّين مختلفين حول المعلم نفسه. في `um das Gebäude herum` تلتف حول المبنى. في `an dem Gebäude entlang` تسير بمحاذاته. عندما تدخل صفةً تستمر قاعدة الحالة، فتقول `um den alten Park herum` و`an der alten Mauer entlang`."],"questions":[{"id":"lokale-praep-1","type":"cloze","topic":"lokale-praep","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل مسارًا يلتف حول الحديقة.","grounded":false,"text":"Wir gehen um {{1}} Park herum.","blanks":[["den"]],"explain":"um … herum يأخذ الأكوزاتيف، والمذكر المحدد فيه den.","hints":["انظر إلى الأداة للمذكر بعد um."],"de":{"prompt":"Ergänze einen Weg, der um den Park herumführt.","explain":"`um … herum` verlangt den Akkusativ, der bestimmte Artikel maskulin ist dort `den`.","hints":["Schau auf den maskulinen Artikel nach `um`."]}},{"id":"lokale-praep-2","type":"cloze","topic":"lokale-praep","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل بمحاذاة الجدار.","grounded":false,"text":"Wir gehen an {{1}} Mauer entlang.","blanks":[["der"]],"explain":"تأخذ المجموعة الداتيف. أداة المؤنث في الداتيف der.","hints":["Mauer مؤنث. حدّد الحالة مع an … entlang."],"de":{"prompt":"Ergänze: an der Mauer entlang.","explain":"Die Gruppe steht im Dativ. Der feminine Artikel im Dativ ist `der`.","hints":["`Mauer` ist feminin. Bestimme den Kasus bei `an … entlang`."]}},{"id":"lokale-praep-3","type":"mcq","topic":"lokale-praep","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أي تركيب يعني السير بمحاذاة النهر؟","grounded":false,"options":["am Fluss entlang","um den Fluss herum","vom Fluss weg"],"answer":0,"explain":"an … entlang يدل على المحاذاة. um … herum يدل على الالتفاف، وvon … weg على الابتعاد.","hints":["تخيّل السير على خط موازٍ للنهر."],"de":{"prompt":"Welche Struktur bedeutet, am Fluss entlangzugehen?","explain":"`an … entlang` bedeutet „parallel daneben“. `um … herum` heißt „rundherum“, `von … weg` „weg von“.","hints":["Stell dir einen Weg parallel zum Fluss vor."]}},{"id":"lokale-praep-4","type":"cloze","topic":"lokale-praep","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل أداة الجسر ثم أداة المبنى.","grounded":false,"text":"um {{1}} alte Brücke herum · an {{2}} alten Gebäude entlang","blanks":[["die"],["dem"]],"explain":"Brücke مؤنث في الأكوزاتيف فتأخذ die. Gebäude محايد في الداتيف فيأخذ dem.","hints":["افصل حكم um عن حكم an … entlang."],"de":{"prompt":"Ergänze den Artikel für die Brücke und dann für das Gebäude.","explain":"`Brücke` ist feminin im Akkusativ, also `die`. `Gebäude` ist neutral im Dativ, also `dem`.","hints":["Trenne die Regel für `um` von der Regel für `an … entlang`."]}},{"id":"lokale-praep-5","type":"order","topic":"lokale-praep","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"رتّب الجملة وابدأ بـ Wir ثم الفعل. المسار حول المنزل.","grounded":false,"items":["Wir","gehen","um","das Haus","herum."],"explain":"تأتي um قبل الاسم وherum بعده. Haus في الأكوزاتيف.","hints":["ضع كل جزء من حرف الجر في جهة من المجموعة."],"de":{"prompt":"Ordne den Satz und beginne mit `Wir` und dem Verb. Der Weg führt um das Haus.","explain":"`um` steht vor dem Nomen, `herum` danach. `Haus` steht im Akkusativ.","hints":["Setz jeden Teil der Präposition auf eine Seite der Gruppe."]}},{"id":"lokale-praep-6","type":"mcq","topic":"lokale-praep","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"في am Kanal entlang لماذا جاءت am رغم وجود حركة؟","grounded":false,"options":["التركيب an … entlang يطلب الداتيف.","الحركة هنا تتطلب الأكوزاتيف، وam هو أكوزاتيف.","Kanal محايد ولذلك لا تتغير الأداة."],"answer":0,"explain":"am تساوي an dem. الداتيف تحدده الصيغة المزدوجة.","hints":["فكّ الاختصار am."],"de":{"prompt":"Warum steht in `am Kanal entlang` `am`, obwohl es eine Bewegung gibt?","explain":"`am` = `an dem`. Den Dativ bestimmt die Doppelstruktur.","hints":["Löse die Kurzform `am` auf."],"options":["Die Struktur `an … entlang` verlangt den Dativ.","Die Bewegung verlangt hier den Akkusativ, und `am` ist Akkusativ.","`Kanal` ist neutral, deshalb ändert sich der Artikel nicht."]}},{"id":"lokale-praep-7","type":"text","topic":"lokale-praep","difficulty":3,"src":"TELC ص 28–35 (العينة)","prompt":"اكتب جملتين تبدأان بـ Wir radeln. في الأولى حول الحديقة der Park، وفي الثانية بمحاذاة النهر der Fluss.","grounded":false,"answer":"Wir radeln um den Park herum. Wir radeln am Fluss entlang.","explain":"den Park مع um … herum. وam Fluss اختصار an dem Fluss مع an … entlang.","hints":["استعمل الأكوزاتيف مع الالتفاف والداتيف مع المحاذاة."],"de":{"prompt":"Schreib zwei Sätze, die mit `Wir radeln` beginnen: im ersten um den Park (`der Park`), im zweiten am Fluss entlang (`der Fluss`).","explain":"`den Park` mit `um … herum`, und `am Fluss` als Kurzform von `an dem Fluss` mit `an … entlang`.","hints":["Akkusativ für „rundherum“, Dativ für „entlang“."]}},{"id":"lokale-praep-8","type":"text","topic":"lokale-praep","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Wir gehen an den Fluss entlang.","answer":"Wir gehen am Fluss entlang.","explain":"مع تركيب `an … entlang` تحتاج داتيف المذكر `an dem Fluss`، أي `am Fluss`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Bei `an … entlang` brauchst du den Dativ maskulin `an dem Fluss`, also `am Fluss`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"lokale-praep-9","type":"text","topic":"lokale-praep","difficulty":2,"prompt":"ما حالة الاسم في `um die Bäume herum`؟","answer":"الأكوزاتيف. أداة الجمع `die` تظهر بالشكل نفسه في الرفع والأكوزاتيف.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"In welchem Kasus steht das Nomen in `um die Bäume herum`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Im Akkusativ. Der Pluralartikel `die` sieht im Nominativ und Akkusativ gleich aus."}}],"src":"TELC ص 28–35 (العينة)","grounded":false,"lead":"تخيّل خط سيرك على خريطة. إذا كان المسار يلتف حول شيء فلك تركيب، وإذا تابع امتداد جدار أو نهر فلك تركيب آخر.","example":"Wir gehen um die Kirche herum. · Wir gehen am Fluss entlang.","translation":"نمشي حول الكنيسة · نمشي بمحاذاة النهر.","pitfall":["Wir gehen an den Fluss entlang. → Wir gehen am Fluss entlang.","مع تركيب `an … entlang` تحتاج داتيف المذكر `an dem Fluss`، أي `am Fluss`."],"recall":["ما حالة الاسم في `um die Bäume herum`؟","الأكوزاتيف. أداة الجمع `die` تظهر بالشكل نفسه في الرفع والأكوزاتيف."],"de":{"title":"um … herum · an … entlang","lead":"Stell dir deinen Weg auf einer Karte vor. Führt der Weg um etwas herum, gibt es eine Struktur dafür – folgt er einer Mauer oder einem Fluss, eine andere.","steps":[{"text":"Wähle zuerst die räumliche Beziehung","why":"`um` steht vor dem Nomen, `herum` danach. Stell dir einen Weg vor, der um den Ort herumführt, z. B. `um den Park herum`."},{"text":"Setz das Nomen nach um in den Akkusativ","why":"Beim Maskulinum wird `der Park` zu `den Park`. Beim Neutrum sieht `das` gleich aus, steht hier aber im Akkusativ."},{"text":"Benutze an … entlang für „parallel daneben“","why":"Hier steht die Gruppe im Dativ: `der` bei `Mauer` (feminin), `dem` bei `Fluss` (maskulin). `an dem` wird oft zu `am` verkürzt."},{"text":"Prüfe die ganze Struktur, bevor du den Kasus rätst","why":"Der Satz beschreibt eine Bewegung – trotzdem verlangt diese Struktur den Dativ. Steht `entlang` allein nach dem Nomen, ist es eine andere Struktur, z. B. `den Kanal entlang` mit Akkusativ. In dieser Lektion übst du die Doppelstruktur."}],"explain":["Beschreib zwei verschiedene Wege am selben Ort: Mit `um das Gebäude herum` gehst du um das Gebäude, mit `an dem Gebäude entlang` gehst du daran vorbei. Kommt ein Adjektiv dazu, bleibt die Kasusregel gleich: `um den alten Park herum` und `an der alten Mauer entlang`."],"pitfall":"Bei `an … entlang` brauchst du den Dativ maskulin `an dem Fluss`, also `am Fluss`.","recall":["In welchem Kasus steht das Nomen in `um die Bäume herum`?","Im Akkusativ. Der Pluralartikel `die` sieht im Nominativ und Akkusativ gleich aus."],"links":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc"]},"pattern":["um + Akkusativ + herum","·","an + Dativ + entlang"],"frames":[{"k":"main","parts":[["vf","Wir"],["v","gehen"],["c","um"],["mf","die Kirche"],["c","herum"]]},{"k":"main","parts":[["vf","Wir"],["v","gehen"],["c","am"],["mf","Fluss"],["c","entlang"]]}]},{"id":"irgendein","chapter":3,"title":"التعبير عن شيء أو شخص غير محدد","german":"irgendein / irgendeine / irgendwelche","emoji":"🎲","links":[["فهرس قواعد الوحدة 3 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["شرح القواعد، ص 35 من الكتاب · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"]],"steps":[{"text":"افهم أثر irgendein","example":"Hast du irgendeine Idee?","why":"قد تحمل العبارة معنى «أي فكرة على الإطلاق». ويمكن أن تعبّر عن هوية غير معروفة، كما في `Irgendein Nachbar hat angerufen`. يوضح السياق أي المعنيين تقصد."},{"text":"صرّف المفرد مثل ein","example":"Nom. irgendein / irgendeine / irgendein · Akk. irgendeinen / irgendeine / irgendein · Dat. irgendeinem / irgendeiner / irgendeinem","why":"الترتيب هنا مذكر، مؤنث، محايد. مع `suchen` المذكر مفعول مباشر، لذلك تقول `irgendeinen Stuhl`. ومع `mit` تقول `mit irgendeinem Stuhl`."},{"text":"كوّن الجمع بجذر irgendwelch-","example":"Nom./Akk. irgendwelche · Dat. irgendwelchen","why":"تحتاج في الجمع إلى الجذر `irgendwelch-`. ويأخذ اسم الجمع في الداتيف عادة `-n` إذا لم ينتهِ بها أو بـ `-s`، مثل `mit irgendwelchen Stühlen`."},{"text":"اقرأ موقع النفي","example":"Das ist nicht irgendein Tisch.","why":"قد تعني العبارة أن لهذه الطاولة بعينها أهمية خاصة. أما `Das ist kein Tisch` فتنفي انتماء الشيء إلى فئة الطاولات."}],"explain":["عندما تكتب، حدّد أولًا هل الاسم مفرد أو جمع. ثم عيّن الجنس للمفرد والحالة للجميع. قارن `irgendein Laden öffnet` و`ich suche irgendeinen Laden` و`ich kaufe in irgendeinem Laden ein`. بقي الاسم مذكرًا بينما تغيّرت وظيفته في الجملة."],"questions":[{"id":"irgendein-1","type":"cloze","topic":"irgendein","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل أداة غير المحدد مع المذكر في الجملة.","grounded":false,"text":"Ich suche {{1}} Laden.","blanks":[["irgendeinen"]],"explain":"Laden مذكر في الأكوزاتيف، فالنهاية -en.","hints":["ما حالة مفعول suchen؟"],"de":{"prompt":"Ergänze das unbestimmte Wort für das maskuline Nomen.","explain":"`Laden` ist maskulin im Akkusativ, also Endung `-en`.","hints":["In welchem Kasus steht das Objekt von `suchen`?"]}},{"id":"irgendein-2","type":"cloze","topic":"irgendein","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل أداة غير المحدد مع المؤنث.","grounded":false,"text":"Das ist {{1}} Lampe.","blanks":[["irgendeine"]],"explain":"الأداة في الرفع للمؤنث irgendeine.","hints":["بعد sein هنا تأتي مجموعة في الرفع."],"de":{"prompt":"Ergänze das unbestimmte Wort für ein feminines Nomen.","explain":"Im Nominativ feminin heißt es `irgendeine`.","hints":["Nach `sein` steht hier eine Gruppe im Nominativ."]}},{"id":"irgendein-3","type":"mcq","topic":"irgendein","difficulty":1,"src":"TELC ص 28–35 (العينة)","prompt":"أي أداة تسبق Bücher هنا؟ Ich kaufe … Bücher.","grounded":false,"options":["irgendwelche","irgendeine","irgendwelchen"],"answer":0,"explain":"irgendwelche للجمع في الرفع أو الأكوزاتيف، وirgendwelchen للداتيف.","hints":["Bücher جمع في الأكوزاتيف."],"de":{"prompt":"Welches Wort steht hier vor `Bücher`? `Ich kaufe … Bücher.`","explain":"`irgendwelche` für Plural im Nominativ oder Akkusativ, `irgendwelchen` im Dativ.","hints":["`Bücher` ist Plural im Akkusativ."]}},{"id":"irgendein-4","type":"cloze","topic":"irgendein","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل الأداة من irgendein-/irgendwelch-.","grounded":false,"text":"mit {{1}} Nachbarin · mit {{2}} Nachbarn (Pl.)","blanks":[["irgendeiner"],["irgendwelchen"]],"explain":"المؤنث المفرد في الداتيف -er. الجمع في الداتيف -en.","hints":["تحقق من العدد قبل كتابة النهاية."],"de":{"prompt":"Ergänze das Wort mit `irgendein-` / `irgendwelch-`.","explain":"Feminin Singular im Dativ: `-er`. Plural im Dativ: `-en`.","hints":["Prüf den Numerus, bevor du die Endung schreibst."]}},{"id":"irgendein-5","type":"cloze","topic":"irgendein","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"أكمل أداة غير المحدد ثم اسم الجمع في الداتيف.","grounded":false,"text":"mit {{1}} {{2}} (die Stühle)","blanks":[["irgendwelchen"],["Stühlen"]],"explain":"irgendwelchen تحمل -en. يضاف n إلى Stühle في داتيف الجمع.","hints":["راقب الاسم نفسه بعد تصريف الأداة."],"de":{"prompt":"Ergänze das unbestimmte Wort und dann das Pluralnomen im Dativ.","explain":"`irgendwelchen` hat `-en`. `Stühle` bekommt im Dativ Plural ein `n`.","hints":["Achte auch auf das Nomen selbst, nachdem du das Wort dekliniert hast."]}},{"id":"irgendein-6","type":"mcq","topic":"irgendein","difficulty":2,"src":"TELC ص 28–35 (العينة)","prompt":"أي معنى يلائم Das ist nicht irgendein Bild في سياق مدح اللوحة؟","grounded":false,"options":["هذه لوحة لها قيمة خاصة.","هذا الشيء ليس لوحة.","هذه أي لوحة، وتحديدها غير مهم."],"answer":0,"explain":"nicht irgendein يشير هنا إلى تميّز اللوحة. kein Bild ينفي أن تكون لوحة أصلًا.","hints":["النفي يقع على فكرة «أيّ لوحة»."],"de":{"prompt":"Welche Bedeutung passt zu `Das ist nicht irgendein Bild`, wenn jemand das Bild lobt?","explain":"`nicht irgendein` zeigt hier, dass das Bild besonders ist. `kein Bild` würde sagen, dass es gar kein Bild ist.","hints":["Die Verneinung bezieht sich auf die Idee „irgendein Bild“."],"options":["Das ist ein Bild mit besonderem Wert.","Das ist gar kein Bild.","Das ist irgendein Bild – welches, ist egal."]}},{"id":"irgendein-7","type":"text","topic":"irgendein","difficulty":3,"src":"TELC ص 28–35 (العينة)","prompt":"استبدل الأدوات العادية بأدوات عدم التحديد. Ich suche einen Tisch und spreche mit Freunden.","grounded":false,"answer":"Ich suche irgendeinen Tisch und spreche mit irgendwelchen Freunden.","explain":"المذكر في الأكوزاتيف irgendeinen. الجمع في الداتيف irgendwelchen، وFreunden في الداتيف بالفعل.","hints":["حدّد حالة Tisch ثم حالة Freunde بعد mit."],"de":{"prompt":"Ersetze die normalen Artikel durch unbestimmte Wörter: `Ich suche einen Tisch und spreche mit Freunden.`","explain":"Maskulin Akkusativ: `irgendeinen`. Plural Dativ: `irgendwelchen` – `Freunden` steht schon im Dativ.","hints":["Bestimme den Kasus von `Tisch` und dann den von `Freunde` nach `mit`."]}},{"id":"irgendein-8","type":"text","topic":"irgendein","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"mit irgendwelche Freunden","answer":"mit irgendwelchen Freunden","explain":"يطلب `mit` الداتيف، وصيغة الجمع في الداتيف هي `irgendwelchen`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`mit` verlangt den Dativ, und die Pluralform im Dativ ist `irgendwelchen`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"irgendein-9","type":"text","topic":"irgendein","difficulty":2,"prompt":"لماذا تختلف الأداة بين `irgendein Bild` و`irgendwelche Bilder`؟","answer":"الأولى مفرد محايد. الثانية جمع وتستعمل جذر `irgendwelch-`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 28–35 (العينة)","grounded":false,"de":{"prompt":"Warum unterscheidet sich das Wort in `irgendein Bild` und `irgendwelche Bilder`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Das erste ist Singular neutral. Das zweite ist Plural und benutzt den Stamm `irgendwelch-`."}}],"src":"TELC ص 28–35 (العينة)","grounded":false,"table":[["الحالة","مذكر","مؤنث","محايد","جمع"],["Nominativ","irgendein","irgendeine","irgendein","irgendwelche"],["Akkusativ","irgendeinen","irgendeine","irgendein","irgendwelche"],["Dativ","irgendeinem","irgendeiner","irgendeinem","irgendwelchen"]],"lead":"تستخدم هذه الأداة حين لا تعرف أي فرد تقصد، أو لا يهمك تحديد فرد بعينه. تحدد حالة الاسم نهايتها مثلما تحدد نهاية `ein`.","example":"Ich suche irgendeinen Stuhl. · Ich suche irgendwelche Stühle.","translation":"أبحث عن أي كرسي · أبحث عن بعض الكراسي أيًّا كانت.","pitfall":["mit irgendwelche Freunden → mit irgendwelchen Freunden","يطلب `mit` الداتيف، وصيغة الجمع في الداتيف هي `irgendwelchen`."],"recall":["لماذا تختلف الأداة بين `irgendein Bild` و`irgendwelche Bilder`؟","الأولى مفرد محايد. الثانية جمع وتستعمل جذر `irgendwelch-`."],"de":{"title":"irgendein / irgendeine / irgendwelche","lead":"Du benutzt dieses Wort, wenn du nicht weißt, welches einzelne Ding oder welche Person gemeint ist – oder wenn es dir egal ist. Der Kasus bestimmt die Endung genau wie bei `ein`.","steps":[{"text":"Verstehe die Wirkung von irgendein","why":"Der Ausdruck kann „überhaupt irgendeine Idee“ bedeuten. Er kann auch eine unbekannte Identität ausdrücken: `Irgendein Nachbar hat angerufen`. Der Kontext zeigt, was gemeint ist."},{"text":"Dekliniere den Singular wie ein","why":"Die Reihenfolge ist maskulin, feminin, neutral. Mit `suchen` ist das Maskulinum Akkusativobjekt
