* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 450 17px/1.85 var(--font); text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
:root[lang="de"] body { line-height: 1.65; }
a { color: var(--brand-ink); text-decoration: none; }
a:hover { color: var(--brand); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.4; text-wrap: balance; color: var(--ink); }
:root[lang="de"] h1, :root[lang="de"] h2 { letter-spacing: -.015em; line-height: 1.2; }
h1 { font-size: clamp(30px, 4vw, 52px); font-weight: 800; }
h2 { font-size: clamp(19px, 1.8vw, 23px); font-weight: 760; }
h3 { font-size: 17px; font-weight: 720; }
small { font-size: 13px; }
[lang="de"], .de { font-family: var(--font-de); }
[lang="ar"] { font-family: var(--font); }
bdi[lang="de"] { unicode-bidi: isolate; }
.term { color: var(--brand-ink); background: var(--brand-soft); padding: .05em .38em; border-radius: .4em; overflow-wrap: anywhere; font-size: .93em; font-weight: 650; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.skip { position: fixed; top: -100px; inset-inline-start: 1rem; background: var(--surface); color: var(--ink); z-index: 20; padding: .75rem 1rem; border-radius: 10px; box-shadow: var(--shadow); }
.skip:focus { top: 1rem; }

/* Top bar */
.topbar { height: var(--head); background: var(--topbar); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 8; }
.top-inner { max-width: 1600px; margin: auto; padding: 0 clamp(14px, 3vw, 36px); height: 100%; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); line-height: 1.3; flex-shrink: 0; margin-inline-end: auto; }
.brand:hover { color: var(--ink); }
.brand strong { display: block; font-size: 15px; font-weight: 760; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.brand-icon { background: linear-gradient(140deg, var(--brand), #9b5de5); color: #fff; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; font: 800 15px/1 var(--font-de); letter-spacing: .02em; box-shadow: 0 6px 16px #5b3fd040; }
.top-nav { display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: var(--surface-3); }
.top-nav a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.top-nav a:hover { color: var(--ink); }
.top-nav a[aria-current] { background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow-sm); }
.nav-icon { font-size: 15px; line-height: 1; }
.top-tools { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--line); direction: ltr; }
.seg button { border: 0; background: none; min-width: 38px; height: 32px; padding: 0 9px; border-radius: 8px; font-size: 13px; font-weight: 750; color: var(--muted); }
.seg button[lang="ar"] { font-family: var(--font); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow-sm); }
.icon-btn { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); width: 40px; height: 40px; display: inline-grid; place-items: center; color: var(--ink-2); flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }
.theme-btn .moon { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .moon { display: block; }

/* Layout and sidebar */
.layout { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: minmax(255px, 300px) minmax(0, 1fr); }
.sidebar { position: sticky; top: var(--head); height: calc(100vh - var(--head)); height: calc(100dvh - var(--head)); border-inline-end: 1px solid var(--line); background: var(--surface-2); padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.side-heading, .side-footer div, .section-heading, .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.side-heading h2 { font-size: 16px; }
.side-heading span, .side-footer span { color: var(--muted); font-size: 12px; }
.search-label { display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.search-label svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.search-label:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search-label input { min-width: 0; width: 100%; border: 0; outline: 0; background: none; padding: 9px 0; font-size: 13px; }
.search-label input::placeholder { color: var(--muted); }
.index { flex: 1; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; padding: 3px 3px 6px; margin: -3px; }
.index details { margin-bottom: 4px; }
.index summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; cursor: pointer; padding: 7px 6px; border-radius: 10px; font-size: 14px; font-weight: 720; line-height: 1.5; }
.index summary::-webkit-details-marker { display: none; }
.index summary:hover { background: var(--surface-3); }
.sum-emoji { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; }
.chevron { transition: transform .18s; color: var(--muted); }
details[open] > summary .chevron { transform: rotate(180deg); }
.index-links { border-inline-start: 2px solid var(--line); margin-inline-start: 20px; padding-block: 2px 6px; padding-inline: 8px 0; }
.index-links a { display: flex; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.6; padding: 6px 8px; border-radius: 8px; color: var(--muted); }
.index-links a:hover { background: var(--surface-3); color: var(--ink); }
.index-links a[aria-current] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
.index-links .dot { font-size: 11px; color: var(--good); width: 10px; flex-shrink: 0; text-align: center; }
.side-footer { border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; }
progress { width: 100%; height: 8px; border: none; border-radius: 100px; background: var(--surface-3); accent-color: var(--brand); overflow: hidden; }
progress::-webkit-progress-bar { background: var(--surface-3); border-radius: 100px; }
progress::-webkit-progress-value { background: linear-gradient(90deg, var(--brand), #9b6cf0); border-radius: 100px; }
progress::-moz-progress-bar { background: var(--brand); border-radius: 100px; }
main { min-width: 0; padding: clamp(18px, 3vw, 40px); outline: none; }
#content, .page-foot { max-width: 1120px; margin-inline: auto; }
.page-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); margin-top: 32px; padding-top: 15px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.page-foot a, .sources a { text-decoration: underline; text-underline-offset: 3px; }
.menu-toggle, .shade, .bottom-nav { display: none; }

/* Buttons */
.btn { border: 1px solid transparent; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; font-size: 14px; font-weight: 700; min-height: 44px; text-align: center; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 12px #5b3fd033; }
.btn.primary:hover { background: var(--brand-strong); color: var(--on-brand); }
.btn.secondary { background: var(--surface); border-color: var(--line-strong); color: var(--brand-ink); }
.btn.secondary:hover { background: var(--surface-3); }
.btn.quiet { background: var(--brand-soft); color: var(--brand-ink); }
.btn.quiet:hover { filter: brightness(.97); }
.btn[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good-line); color: var(--good); }

/* Home */
.hero { position: relative; isolation: isolate; border-radius: 26px; padding: clamp(24px, 4vw, 48px); background: radial-gradient(ellipse at 6% 110%, var(--hero-c) 0, transparent 60%), linear-gradient(125deg, var(--hero-a), var(--hero-b) 62%, var(--hero-c)); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, .55fr); align-items: center; gap: 22px; border: 1px solid var(--line); }
.hero-copy p { margin-top: 12px; color: var(--ink-2); max-width: 34rem; font-size: 17px; }
.hero-copy h1 span { display: block; color: var(--brand); margin-top: 4px; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--brand-ink); background: var(--surface); border: 1px solid var(--line); padding: 3px 12px; border-radius: 99px; font-weight: 700; font-size: 12.5px; margin-bottom: 14px; }
.hero-actions, .actions, .quiz-controls, .related { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
.hero-actions { margin-top: 22px; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line-strong); }
.hero-stats div { display: grid; line-height: 1.3; }
.hero-stats strong { font-size: 22px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-stats span { font-size: 13px; color: var(--muted); }
.hero-art { display: grid; place-items: center; position: relative; min-height: 220px; direction: ltr; }
.hero-art::before { content: ""; position: absolute; width: min(100%, 230px); aspect-ratio: 1; border-radius: 50%; background: var(--surface); opacity: .65; outline: 1px solid var(--line); outline-offset: 12px; }
.art-card { position: absolute; width: min(100%, 215px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 7px; transform: rotate(-6deg); font: 700 clamp(14px, 1.8vw, 19px)/1.45 var(--font-de); }
.art-card span { border-radius: 9px; padding: 6px 11px; }
.art-card span:first-child { background: var(--g-vf-bg); color: var(--g-vf); }
.art-card span + span { background: var(--g-v-bg); color: var(--g-v); }
.art-star { position: absolute; left: 4%; top: 8%; color: var(--brand); font-size: 28px; line-height: 1; }
.art-flower { position: absolute; right: 6%; bottom: 10%; font-size: 34px; line-height: 1; }
.resume { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); color: var(--ink); }
.resume:hover { border-color: var(--line-strong); color: var(--ink); }
.resume .unit-emoji { width: 44px; height: 44px; }
.resume span { min-width: 0; flex: 1; line-height: 1.5; }
.resume small { display: block; color: var(--muted); }
.resume b { font-weight: 720; }
.resume .go { color: var(--brand); font-weight: 800; font-size: 18px; }
.section-heading { margin: 30px 0 12px; flex-wrap: wrap; }
.section-heading > p { color: var(--muted); font-size: 14px; }
.units { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.unit-card, .panel, .quiz-box { border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); min-width: 0; }
.unit-card { padding: 16px 18px 10px; }
.unit-head { display: flex; align-items: center; gap: 12px; }
.unit-head > span:nth-child(2) { min-width: 0; flex: 1; }
.unit-head strong, .unit-head small { display: block; }
.unit-head strong { line-height: 1.45; }
.unit-head small { color: var(--muted); }
.unit-meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.unit-meter progress { height: 6px; }
.unit-meter span { white-space: nowrap; }
.unit-emoji, .lesson-emoji { display: grid; place-items: center; border-radius: 14px; width: 48px; height: 48px; flex-shrink: 0; font-size: 23px; }
.lilac { background: var(--t-lilac); }
.peach { background: var(--t-peach); }
.mint { background: var(--t-mint); }
.blue { background: var(--t-blue); }
.pink { background: var(--t-pink); }
.yellow { background: var(--t-yellow); }
.unit-card ul, .stat-list { list-style: none; padding: 0; margin: 10px 0 0; }
.unit-card li a { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--ink); border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; padding: 9px 2px; }
.unit-card li a:hover { color: var(--brand); }
.unit-card li a .de-name { color: var(--muted); font-size: 12px; display: block; }
.unit-card li span[aria-hidden] { color: var(--brand); flex-shrink: 0; }
.unit-card li span.done { color: var(--good); }

/* Lesson */
.crumb { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 13px; }
.lesson-banner, .simple-banner { border: 1px solid var(--line); padding: clamp(18px, 3.4vw, 34px); border-radius: 22px; }
.lesson-banner h1, .simple-banner h1 { font-size: clamp(26px, 3.6vw, 40px); }
.lesson-banner .unit-head { align-items: flex-start; }
.lesson-sub { color: var(--ink-2); font-weight: 600; margin-top: 2px; }
.lesson-count { display: inline-block; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; margin-bottom: 8px; }
.lesson-emoji { background: var(--surface); box-shadow: var(--shadow-sm); }
.lesson-banner .lead, .simple-banner p { margin-top: 12px; max-width: 46rem; color: var(--ink-2); }
.lesson-banner .actions { margin-top: 18px; }
.glance { margin-top: 15px; display: grid; gap: 16px; }
.glance-head { display: flex; align-items: center; gap: 10px; }
.glance-head .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-size: 17px; }
.label { display: block; font-size: 12px; font-weight: 750; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
:root[lang="ar"] .label { text-transform: none; letter-spacing: 0; font-size: 13px; }
.pattern { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; direction: ltr; justify-content: flex-start; }
.chip { font: 700 15px/1.3 var(--font-de); padding: 7px 12px; border-radius: 10px; background: var(--g-hl-bg); color: var(--g-hl); border: 1px solid var(--g-hl-line); }
.op { font: 700 16px/1 var(--font-de); color: var(--muted); padding: 0 1px; }
.frames { display: grid; gap: 12px; }
.frame { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.frame-kind { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; }
.slot { display: grid; gap: 2px; padding: 7px 11px 6px; border-radius: 11px; border: 1px solid var(--g-mf-line); background: var(--g-mf-bg); color: var(--g-mf); min-width: 0; text-align: center; }
.slot b { font: 700 15.5px/1.35 var(--font-de); overflow-wrap: anywhere; }
.slot i { font-style: normal; font-size: 11px; font-weight: 650; opacity: .85; line-height: 1.3; white-space: nowrap; }
.slot.vf { background: var(--g-vf-bg); color: var(--g-vf); border-color: var(--g-vf-line); }
.slot.v, .slot.ve { background: var(--g-v-bg); color: var(--g-v); border-color: var(--g-v-line); }
.slot.ve { border-style: dashed; }
.slot.c { background: var(--g-c-bg); color: var(--g-c); border-color: var(--g-c-line); }
.slot.hl { background: var(--g-hl-bg); color: var(--g-hl); border-color: var(--g-hl-line); }
.slot.n { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 3px; }
.frames-hint { font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--sw); border: 1px solid var(--swl); }
.lesson-body { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, .82fr); gap: 15px; margin-top: 15px; align-items: start; }
.lesson-side { display: grid; gap: 15px; min-width: 0; }
.panel, .quiz-box { padding: clamp(16px, 2.3vw, 26px); }
.panel h2, .quiz-box h2 { margin-bottom: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { margin: 0; }
.step-count { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-3); border-radius: 99px; padding: 2px 10px; }
.example { margin: 4px 0 16px; padding: 14px 16px; border-radius: 14px; background: var(--brand-soft); border: 1px solid var(--g-hl-line); }
.example .de { color: var(--brand-ink); font-size: clamp(17px, 1.9vw, 21px); font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.example p { color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.example .tr-label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 8px; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.step.enter { animation: reveal .28s ease-out both; }
@keyframes reveal { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.step-num { background: var(--brand-soft); color: var(--brand); border-radius: 10px; display: grid; place-items: center; width: 34px; height: 34px; font-weight: 800; font-size: 14px; }
.step h3 { font-size: 16px; line-height: 1.5; }
.step .de { display: block; margin: 7px 0; padding: 6px 11px; border-radius: 9px; background: var(--surface-3); color: var(--ink); font-weight: 650; overflow-wrap: anywhere; line-height: 1.55; width: fit-content; max-width: 100%; }
.step p, .reading p, .pitfall p, .recall p, .feedback p, .quiz-help { font-size: 16px; }
.step p, .reading p, .pitfall p { color: var(--ink-2); }
.reading p { max-inline-size: 40rem; }
.reading p + p { margin-top: .85em; }
.pitfall { background: var(--warn-bg); border-color: var(--warn-line); }
.pitfall h2 { color: var(--warn); }
.wr { display: grid; gap: 6px; margin-bottom: 10px; }
.wr div { display: flex; gap: 9px; align-items: baseline; padding: 7px 11px; border-radius: 10px; font-weight: 650; overflow-wrap: anywhere; line-height: 1.5; }
.wr .no { background: var(--bad-bg); color: var(--bad); }
.wr .no span:last-child { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.wr .yes { background: var(--good-bg); color: var(--good); }
.wr .mark { font: 800 13px/1 var(--font-de); flex-shrink: 0; }
.recall summary { cursor: pointer; font-weight: 700; color: var(--brand-ink); }
.recall > p { margin-top: 10px; }
.recall details { margin-top: 10px; padding: 10px 12px; border-radius: 11px; background: var(--surface-3); }
.recall details p { margin-top: 6px; }
.sources { margin: 15px 0 0; font-size: 13px; }
.sources summary { font-weight: 700; cursor: pointer; }
.sources p { margin-top: 8px; color: var(--muted); }
.sources ul { margin: 6px 0 0; padding-inline-start: 19px; }
.table-wrap { overflow: auto; margin-top: 4px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; border: 1px solid var(--line); border-radius: 12px; }
.table-help { display: none; color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
tbody tr:last-child > * { border-bottom: 0; }
thead th { background: var(--surface-3); white-space: nowrap; font-size: 13px; color: var(--ink-2); }
tbody th { color: var(--ink-2); font-weight: 650; }
tbody tr:hover > * { background: var(--surface-2); }
td bdi[lang="de"], td.de-cell { font-weight: 600; }
.lesson-nav { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }

/* Practice */
.practice-head { margin-bottom: 16px; background: linear-gradient(130deg, var(--hero-a), var(--hero-c)); }
.launcher { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .6fr); gap: 14px; }
.launcher .panel p { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.form-row { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
.form-row label { display: grid; gap: 4px; flex: 1 0 min(100%, 220px); font-size: 13px; font-weight: 700; }
select, textarea, .blank { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px; padding: 9px 11px; }
select { width: 100%; min-height: 44px; }
.quiz-box { max-width: 840px; }
.quiz-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); margin: 0 0 6px; font-size: 13px; }
.quiz-type { display: inline-block; border-radius: 99px; background: var(--brand-soft); color: var(--brand-ink); padding: 3px 12px; font-size: 12px; font-weight: 700; margin: 13px 0 8px; }
.quiz-prompt { font-size: clamp(19px, 2.1vw, 23px); line-height: 1.6; text-wrap: pretty; margin-bottom: 16px; }
.quiz-controls { margin-top: 16px; }
.choices { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, background-color .15s; }
.option:hover { border-color: var(--line-strong); }
.option:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.option:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=radio] { accent-color: var(--brand); }
textarea { width: 100%; display: block; min-height: 110px; resize: vertical; line-height: 1.6; }
.cloze { line-height: 2.6; font-size: 18px; overflow-wrap: anywhere; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.blank { min-width: 6ch; width: clamp(8ch, 17vw, 17ch); padding: 3px 7px; margin: 0 3px; text-align: center; }
.blank:focus { border-color: var(--brand); }
.blank.good, .option.good { background: var(--good-bg); border-color: var(--good-line); }
.blank.bad, .option.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.answer-order { min-height: 59px; padding: 8px; border: 1.5px dashed var(--line-strong); border-radius: 12px; margin: 6px 0 12px; background: var(--surface-2); }
.order-line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.order-token { border: 1px solid var(--g-hl-line); border-radius: 9px; background: var(--surface); padding: 6px 11px; min-height: 40px; font-weight: 600; }
.order-token:hover { background: var(--brand-soft); }
.answer-order .order-token { background: var(--brand-soft); color: var(--brand-ink); }
.quiz-help, .feedback, .notice { border-radius: 12px; padding: 11px 14px; background: var(--surface-3); margin-top: 12px; }
.quiz-help { background: var(--warn-bg); border: 1px solid var(--warn-line); }
.feedback { border: 1px solid var(--line); }
.feedback.correct { background: var(--good-bg); border-color: var(--good-line); color: var(--good); }
.feedback.incorrect { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.feedback.correct p, .feedback.incorrect p { color: var(--ink); }
.feedback strong { display: block; }
.feedback .de, .review-model { font-size: 16px; margin-top: 4px; overflow-wrap: anywhere; }
.feedback p + p { margin-top: 5px; }
.answer-label { display: block; color: var(--muted); font-size: 13px; }
.timer { font-variant-numeric: tabular-nums; color: var(--brand-ink); font-weight: 700; }
.timer.soon { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 13px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.stat strong { display: block; font-size: 24px; color: var(--ink); unicode-bidi: isolate; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat-list li > span { white-space: nowrap; color: var(--muted); font-size: 13px; }
.stat-list li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.stat-list li a { flex: 1; min-width: 0; color: var(--ink); }
.stat-list progress { max-width: 100px; }
.result-row { margin-top: 9px; border-top: 1px solid var(--line); padding: 10px 0 0; }
.result-row summary { cursor: pointer; font-size: 14px; }
.result-row p { margin-top: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.noscript { padding: 20px; background: var(--surface); }

@media (max-width: 1110px) {
  .lesson-body { grid-template-columns: 1fr; }
  .lesson-side { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lesson-side .reading { grid-column: 1/-1; }
}
@media (max-width: 860px) {
  .layout { display: block; }
  .sidebar { display: none; width: min(340px, 88vw); height: calc(100dvh - var(--head)); position: fixed; inset-inline-start: 0; top: var(--head); z-index: 12; box-shadow: var(--shadow); }
  .sidebar.open { display: flex; }
  .shade { display: block; position: fixed; inset: var(--head) 0 0; z-index: 11; border: 0; background: var(--scrim); }
  .menu-toggle { display: inline-grid; }
  .top-nav { display: none; }
  .bottom-nav { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; inset-inline: 0; bottom: 0; z-index: 9; background: var(--topbar); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav a { display: grid; justify-items: center; gap: 1px; padding: 5px 4px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }
  .bottom-nav a .nav-icon { font-size: 19px; }
  .bottom-nav a[aria-current] { color: var(--brand-ink); background: var(--brand-soft); }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
}
@media (max-width: 560px) {
  :root { --head: 60px; }
  body { font-size: 16px; }
  .top-inner { padding: 0 10px; gap: 8px; }
  .brand { gap: 8px; }
  .brand-icon { width: 34px; height: 34px; font-size: 13px; border-radius: 10px; }
  .brand strong { font-size: 14px; }
  .brand small { font-size: 11px; }
  .seg button { min-width: 34px; padding: 0 7px; }
  main { padding: 14px 14px; }
  .hero { grid-template-columns: 1fr; gap: 0; }
  .hero-art { display: none; }
  .hero-copy p { font-size: 15.5px; }
  .units, .lesson-side, .launcher { grid-template-columns: 1fr; }
  .table-help { display: block; }
  .stats { gap: 6px; }
  .stat { padding: 9px 10px; }
  .stat strong { font-size: 20px; }
  .lesson-banner .unit-head { align-items: center; }
  .lesson-emoji { width: 42px; height: 42px; }
  .lesson-nav .btn { flex: 1 1 0; font-size: 13px; padding: 8px; }
  .slot b { font-size: 14.5px; }
}
@media (max-width: 430px) {
  .brand { flex-shrink: 1; min-width: 0; }
  .brand > span:last-child { min-width: 0; }
  .brand strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
@media print {
  :root, body { background: #fff; color: #000; }
  .topbar, .sidebar, .page-foot, .actions, .lesson-nav, .quiz-controls, .shade, .bottom-nav { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  body { padding: 0; }
  .lesson-body, .lesson-side { display: block; }
  .panel { margin: 10px 0; box-shadow: none; }
  .step[hidden] { display: grid !important; }
  .step, .pitfall, .glance { break-inside: avoid; }
}

<script id="course" type="application/json">{"chapters":[["Ankommen","الوصول والاستقرار","🏡","lilac"],["Arbeiten, um zu leben?","العمل والحياة","💼","peach"],["Lebensräume","أماكن العيش","🌿","mint"],["Migration","الهجرة","🧳","blue"],["Auf die Gesundheit!","الصحة والتغذية","🍓","pink"],["Kaufen, kaufen, kaufen","التسوّق والاستهلاك","🛍️","yellow"]],"topics":[{"id":"passiv-perfekt","chapter":1,"title":"المبني للمجهول في الماضي","german":"Passiv Perfekt","emoji":"🧰","links":[["فهرس قواعد الوحدة 1 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أفعال المجهول · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/929"],["الصيغة worden · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/1612"]],"steps":[{"text":"حدّد المفعول المباشر","example":"Die Firma hat das Fenster repariert.","why":"اسأل عمّا أصلحته الشركة. الإجابة هي النافذة، وكانت مفعولًا في حالة `Akkusativ`. تصبح هي المسند إليه في صيغة المجهول."},{"text":"انقل المفعول إلى حالة الفاعل","example":"Das Fenster ist …","why":"قد لا تظهر الحركة في المحايد. مع المذكر تراها بوضوح: `den Aufzug` يصبح `der Aufzug`. صرّف `sein` مع الاسم الجديد، فتقول `ist` للمفرد و`sind` للجمع."},{"text":"أغلق الجملة بصيغة الماضي للمجهول","example":"Das Fenster ist repariert worden.","why":"يبقى `repariert` اسم المفعول للفعل الأصلي، وتأتي بعده `worden` ثابتة. يمكنك إضافة `von der Firma` عند الحاجة إلى ذكر المنفّذ."},{"text":"أعد بناء الجملة التابعة","example":"…, weil die Fenster repariert worden sind.","why":"في الجملة التابعة يأتي الفعل المصرف `sind` بعد `repariert worden`. لاحظ كيف تغير موقعه وبقي اتفاقه مع الجمع."}],"explain":["صف الفعل الذي حدث باستعمال `ist repariert worden`. إذا وصفت حالة النافذة الآن فقل `ist repariert`. واستعمل `wird repariert` حين تعرض الإجراء في الحاضر. تساعدك هذه المقارنة على تحديد ما إذا كنت تتكلم عن حدث مكتمل أو حالة أو إجراء جارٍ.","إذا عبّرت عن التحول بفعل `werden` نفسه فصيغة الماضي هي `ist geworden`، مثل `Es ist kalt geworden`. أما في هذا النوع من المجهول فالصيغة الخاصة هي `worden`. راجع أيضًا درس المجهول بلا فاعل لمعرفة ما يحدث عندما لا يوجد مفعول مباشر أصلاً."],"questions":[{"id":"passiv-perfekt-1","type":"cloze","topic":"passiv-perfekt","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل بـ sein المصرف.","grounded":false,"text":"Der Balkon {{1}} gestrichen worden.","blanks":[["ist"]],"explain":"الشرفة مفردة. تصريف sein معها هو ist.","hints":["عدّ الاسم في صدر الجملة."],"de":{"prompt":"Ergänze die konjugierte Form von `sein`.","explain":"`Der Balkon` ist Singular. Die passende Form von `sein` ist `ist`.","hints":["Zähl das Nomen am Satzanfang."]}},{"id":"passiv-perfekt-2","type":"cloze","topic":"passiv-perfekt","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل صيغة الفعل المساعد للمجهول.","grounded":false,"text":"Die Fenster sind geputzt {{1}}.","blanks":[["worden"]],"explain":"صيغة werden الخاصة في Passiv Perfekt هي worden.","hints":["الفعل الرئيسي قد أخذ صيغة Partizip II بالفعل."],"de":{"prompt":"Ergänze die Form des Passiv-Hilfsverbs.","explain":"Die besondere Form von `werden` im Passiv Perfekt ist `worden`.","hints":["Das Hauptverb steht schon im Partizip II."]}},{"id":"passiv-perfekt-3","type":"mcq","topic":"passiv-perfekt","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أي جملة تخبرنا بأن الطلب أُلغي بالفعل؟","grounded":false,"options":["Die Bestellung ist storniert worden.","Die Bestellung wird storniert.","Die Bestellung ist storniert."],"answer":0,"explain":"wird storniert إجراء في الحاضر. ist storniert تصف الحالة. ist storniert worden تعرض الحدث المكتمل.","hints":["ابحث عن أثرين للماضي المركب للمجهول."],"de":{"prompt":"Welcher Satz sagt, dass die Bestellung schon storniert wurde?","explain":"`wird storniert` ist ein Vorgang in der Gegenwart. `ist storniert` beschreibt den Zustand. `ist storniert worden` zeigt den abgeschlossenen Vorgang.","hints":["Such nach zwei Merkmalen des Passiv Perfekt."]}},{"id":"passiv-perfekt-4","type":"cloze","topic":"passiv-perfekt","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"حوّل الفعل المعلوم إلى مجهول. Man hat den Aufzug geprüft.","grounded":false,"text":"Der Aufzug {{1}} {{2}} {{3}}.","blanks":[["ist"],["geprüft"],["worden"]],"explain":"المصعد مفرد في الرفع، فتستعمل ist. يبقى geprüft ثم تأتي worden.","hints":["حوّل المفعول إلى الرفع ثم اختر sein."],"de":{"prompt":"Forme den Aktivsatz ins Passiv um: `Man hat den Aufzug geprüft.`","explain":"`Der Aufzug` ist Singular im Nominativ, also `ist`. `geprüft` bleibt, danach kommt `worden`.","hints":["Setz das Objekt in den Nominativ und wähl dann die Form von `sein`."]}},{"id":"passiv-perfekt-5","type":"order","topic":"passiv-perfekt","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب الجملة التابعة. اجعل weil أولًا والفاعل بعده.","grounded":false,"items":["weil","die Lampen","ausgetauscht","worden","sind"],"explain":"يأتي sind بعد ausgetauscht worden في ترتيب الجملة التابعة.","hints":["ابحث عن الفعل المصرف وضعه في الآخر."],"de":{"prompt":"Ordne den Nebensatz. Setz `weil` an den Anfang und danach das Subjekt.","explain":"Im Nebensatz steht `sind` nach `ausgetauscht worden`.","hints":["Such das konjugierte Verb und stell es ans Ende."]}},{"id":"passiv-perfekt-6","type":"mcq","topic":"passiv-perfekt","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"اختر العبارة التي تدل على تغيّر الطقس.","grounded":false,"options":["Es ist kälter geworden.","Es ist kälter worden.","Es ist kälter gemacht worden."],"answer":0,"explain":"مع التحوّل الذاتي نستعمل geworden. كلمة worden تخص المجهول، وgemacht worden تصف جعل الشيء أبرد.","hints":["هل werden هنا فعل التحوّل أم مساعد مجهول؟"],"de":{"prompt":"Wähle den Satz, der eine Wetteränderung ausdrückt.","explain":"Bei einer Veränderung von selbst benutzt man `geworden`. `worden` gehört zum Passiv, und `gemacht worden` bedeutet, dass jemand etwas kälter gemacht hat.","hints":["Ist `werden` hier ein Vollverb der Veränderung oder ein Passiv-Hilfsverb?"]}},{"id":"passiv-perfekt-7","type":"text","topic":"passiv-perfekt","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"حوّل Die Hausverwaltung hat die Aufzüge repariert إلى Passiv Perfekt واذكر المنفّذ.","grounded":false,"answer":"Die Aufzüge sind von der Hausverwaltung repariert worden.","explain":"die Aufzüge جمع، لذا اختر sind. أدخل von der Hausverwaltung بين الفعل المصرف ونهاية الجملة.","hints":["ابدأ بالمصاعد. استخدم von مع الداتيف لذكر الجهة المنفذة."],"de":{"prompt":"Forme `Die Hausverwaltung hat die Aufzüge repariert` ins Passiv Perfekt um und nenne den Täter.","explain":"`die Aufzüge` ist Plural, also `sind`. Setz `von der Hausverwaltung` zwischen das konjugierte Verb und das Satzende.","hints":["Beginne mit den Aufzügen. Nenne die Verwaltung mit `von` + Dativ."]}},{"id":"passiv-perfekt-8","type":"text","topic":"passiv-perfekt","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Der Aufzug ist repariert geworden.","answer":"Der Aufzug ist repariert worden.","explain":"الجملة تصف إصلاحًا قام به أحدهم. الفعل `werden` هنا مساعد للمجهول، وصيغته `worden`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Satz beschreibt eine Reparatur, die jemand gemacht hat. `werden` ist hier ein Hilfsverb des Passivs – seine Perfektform lautet `worden`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"passiv-perfekt-9","type":"text","topic":"passiv-perfekt","difficulty":2,"prompt":"لماذا نقول `sind` في `Die Türen sind geöffnet worden`؟","answer":"لأن `die Türen` جمع في حالة الفاعل بعد التحويل. عدد الأشخاص الذين فتحوا الأبواب لا يتحكم في التصريف.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Warum sagt man `sind` in `Die Türen sind geöffnet worden`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Weil `die Türen` nach der Umformung ein Plural im Nominativ ist. Wie viele Personen die Türen geöffnet haben, spielt für die Konjugation keine Rolle."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"كيف تقول إن النافذة أُصلحت، حين تكون النتيجة أهم من اسم من أصلحها؟ نبدأ بالجملة المعلومة ثم ننقل التركيز إلى الشيء الذي وقع عليه الفعل.","example":"Die Firma hat das Fenster repariert. → Das Fenster ist repariert worden.","translation":"أصلحت الشركة النافذة ← أُصلحت النافذة.","pitfall":["Der Aufzug ist repariert geworden. → Der Aufzug ist repariert worden.","الجملة تصف إصلاحًا قام به أحدهم. الفعل `werden` هنا مساعد للمجهول، وصيغته `worden`."],"recall":["لماذا نقول `sind` في `Die Türen sind geöffnet worden`؟","لأن `die Türen` جمع في حالة الفاعل بعد التحويل. عدد الأشخاص الذين فتحوا الأبواب لا يتحكم في التصريف."],"de":{"title":"Passiv im Perfekt","lead":"Wie sagst du, dass das Fenster repariert wurde, wenn das Ergebnis wichtiger ist als die Person, die es repariert hat? Wir beginnen mit dem Aktivsatz und verschieben dann den Fokus auf die Sache, mit der etwas passiert.","steps":[{"text":"Finde das Akkusativobjekt","why":"Frag: Was hat die Firma repariert? Antwort: das Fenster. Es war das Objekt im `Akkusativ` – im Passiv wird es zum Subjekt."},{"text":"Setze das Objekt in den Nominativ","why":"Beim Neutrum sieht man die Änderung oft nicht, beim Maskulinum sehr deutlich: `den Aufzug` wird zu `der Aufzug`. Konjugiere `sein` passend zum neuen Subjekt: `ist` im Singular, `sind` im Plural."},{"text":"Schließe den Satz mit der Passiv-Perfekt-Form","why":"`repariert` bleibt das Partizip II des ursprünglichen Verbs, danach steht unverändert `worden`. Willst du den Täter nennen, ergänze `von der Firma`."},{"text":"Baue den Nebensatz","why":"Im Nebensatz steht das konjugierte Verb `sind` nach `repariert worden`. Die Position ändert sich, aber `sind` passt weiterhin zum Plural."}],"explain":["Mit `ist repariert worden` beschreibst du einen Vorgang, der passiert ist. Beschreibst du den jetzigen Zustand des Fensters, sagst du `ist repariert`. Und `wird repariert` zeigt den Vorgang in der Gegenwart. Dieser Vergleich hilft dir zu entscheiden, ob du über einen abgeschlossenen Vorgang, einen Zustand oder eine laufende Handlung sprichst.","Drückst du eine Veränderung mit dem Vollverb `werden` aus, heißt das Perfekt `ist geworden`, z. B. `Es ist kalt geworden`. Im Passiv lautet die besondere Form dagegen `worden`. Schau dir auch die Lektion zum subjektlosen Passiv an: Dort geht es um Sätze ganz ohne Akkusativobjekt."],"pitfall":"Der Satz beschreibt eine Reparatur, die jemand gemacht hat. `werden` ist hier ein Hilfsverb des Passivs – seine Perfektform lautet `worden`.","recall":["Warum sagt man `sind` in `Die Türen sind geöffnet worden`?","Weil `die Türen` nach der Umformung ein Plural im Nominativ ist. Wie viele Personen die Türen geöffnet haben, spielt für die Konjugation keine Rolle."],"links":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Passiv-Hilfsverben · grammis","Die Form worden · grammis"]},"pattern":["sein","+","Partizip II","+","worden"],"frames":[{"k":"main","parts":[["vf","Das Fenster"],["v","ist"],["mf","(von der Firma)"],["ve","repariert worden"]]},{"k":"sub","parts":[["c","weil"],["mf","die Fenster"],["ve","repariert worden sind"]]}]},{"id":"je-desto","chapter":1,"title":"كلما… ازداد أو قلّ…","german":"je … desto / umso","emoji":"📈","links":[["فهرس قواعد الوحدة 1 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات الربط والمقارنة · grammis","https://grammis.ids-mannheim.de/kontrastive-grammatik/3790"]],"steps":[{"text":"كوّن درجتَي المقارنة","example":"lang → länger · gut → besser","why":"العلاقة تقوم على درجتين. اختر مقدارًا لكل جزء، مثل طول المدة وجودة المعرفة. بعض درجات المقارنة شاذ، ومنها `gut → besser`."},{"text":"ضع المقارنة مباشرة بعد je","example":"Je länger ich hier wohne, …","why":"الجزء الأول جملة تابعة. تأتي مجموعة المقارنة في البداية والفعل المصرف `wohne` في آخر الجزء قبل الفاصلة."},{"text":"ضع المقارنة الثانية في صدر النتيجة","example":"…, desto besser kenne ich die Gegend.","why":"يمكنك استعمال `umso` مكان `desto`. تحتل مجموعة `desto besser` الموقع الأول بكاملها، لذلك يأتي `kenne` مباشرة بعدها ثم الفاعل."},{"text":"جرّب المقارنة في اتجاهين مختلفين","example":"Je höher die Miete ist, desto weniger Geld bleibt übrig.","why":"قد تزيد قيمة بينما تنقص الأخرى. يحدد اختيار `höher` و`weniger` اتجاه التغيّر. المجموعة الثانية كلها هي `desto weniger Geld` قبل الفعل `bleibt`."}],"explain":["إذا كانت المقارنة داخل مجموعة اسمية تبقى المجموعة معًا. في `Je mehr Zeit wir haben, desto …` يبدأ الجزء الأول كله بـ `je mehr Zeit`. يمكنك أيضًا سماع الصيغة المختصرة `Je früher, desto besser` حين يفهم السامع ما الذي سيحدث مبكرًا وما الذي سيصبح أفضل."],"questions":[{"id":"je-desto-1","type":"cloze","topic":"je-desto","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل الجزء الأول بدرجة المقارنة من viel.","grounded":false,"text":"Je {{1}} du übst, desto leichter wird es.","blanks":[["mehr"]],"explain":"صيغة المقارنة من viel هي mehr.","hints":["ابحث عن صيغة viel الشاذة."],"de":{"prompt":"Ergänze den ersten Teil mit dem Komparativ von `viel`.","explain":"Der Komparativ von `viel` ist `mehr`.","hints":["Such die unregelmäßige Form von `viel`."]}},{"id":"je-desto-2","type":"cloze","topic":"je-desto","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"اكتب أحد الرابطين الممكنين في الجزء الثاني.","grounded":false,"text":"Je früher wir starten, {{1}} schneller kommen wir an.","blanks":[["desto","umso"]],"explain":"desto وumso صالحان بعد الفاصلة في هذا التركيب.","hints":["الجزء الثاني له بديلان متكافئان هنا."],"de":{"prompt":"Schreib eines der beiden möglichen Wörter für den zweiten Teil.","explain":"`desto` und `umso` passen beide nach dem Komma.","hints":["Für den zweiten Teil gibt es hier zwei gleichwertige Möglichkeiten."]}},{"id":"je-desto-3","type":"mcq","topic":"je-desto","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أيّ عبارة تعني «كلما ارتفع الإيجار، بقي مال أقل»؟","grounded":false,"options":["Je höher die Miete ist, desto weniger Geld bleibt übrig.","Je höher die Miete ist, desto mehr Geld bleibt übrig.","Je niedriger die Miete ist, desto weniger Geld bleibt übrig."],"answer":0,"explain":"höher يعبر عن الارتفاع وweniger عن الانخفاض. كل مشتّت يغيّر اتجاه قيمة واحدة.","hints":["تتجه القيمتان في اتجاهين متعاكسين."],"de":{"prompt":"Welcher Satz bedeutet: „Je höher die Miete, desto weniger Geld bleibt übrig“?","explain":"`höher` drückt den Anstieg aus, `weniger` die Abnahme. Jede falsche Antwort ändert die Richtung eines Wertes.","hints":["Die beiden Werte bewegen sich in entgegengesetzte Richtungen."]}},{"id":"je-desto-4","type":"order","topic":"je-desto","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب الجملة. أبقِ مجموعتَي المقارنة في الصدارة.","grounded":false,"items":["Je öfter","du","fragst,","desto schneller","lernst","du."],"explain":"fragst في نهاية الجزء الأول. المجموعة desto schneller تسبق lernst مباشرةً.","hints":["ابحث عن آخر كلمة قبل الفاصلة، ثم عن الفعل بعدها."],"de":{"prompt":"Ordne den Satz. Lass beide Komparativgruppen vorne stehen.","explain":"`fragst` steht am Ende des ersten Teils. Die Gruppe `desto schneller` steht direkt vor `lernst`.","hints":["Such das letzte Wort vor dem Komma und dann das Verb danach."]}},{"id":"je-desto-5","type":"cloze","topic":"je-desto","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"اكتب الصيغة المقارنة من gut ثم من wenig.","grounded":false,"text":"Je {{1}} ich plane, desto {{2}} Zeit verliere ich.","blanks":[["besser"],["weniger"]],"explain":"gut تصبح besser وwenig تصبح weniger.","hints":["تتغيّر كلمة gut كلها في المقارنة."],"de":{"prompt":"Schreib den Komparativ von `gut` und dann von `wenig`.","explain":"`gut` wird zu `besser`, `wenig` zu `weniger`.","hints":["Beim Komparativ ändert sich `gut` komplett."]}},{"id":"je-desto-6","type":"mcq","topic":"je-desto","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أين وقع الخطأ في Je mehr Zeit haben wir, desto entspannter lernen wir؟","grounded":false,"options":["haben يجب أن تأتي بعد wir في جزء je.","lernen يجب أن تأتي بعد wir في جزء desto.","desto يجب أن تستبدلها بـ je."],"answer":0,"explain":"في جزء je يأتي الفعل في النهاية. جزء desto مكتوب بالفعل بترتيب الجملة الرئيسية.","hints":["حدّد أي جزء هو الجملة التابعة."],"de":{"prompt":"Wo ist der Fehler in `Je mehr Zeit haben wir, desto entspannter lernen wir`?","explain":"Im je-Teil steht das Verb am Ende. Der desto-Teil hat schon die richtige Hauptsatz-Wortstellung.","hints":["Bestimme, welcher Teil der Nebensatz ist."],"options":["`haben` muss im je-Teil nach `wir` stehen.","`lernen` muss im desto-Teil nach `wir` stehen.","`desto` muss durch `je` ersetzt werden."]}},{"id":"je-desto-7","type":"text","topic":"je-desto","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"اربط الجملتين بـ je … umso، مع المقارنة من lang وschwer. Der Weg ist lang. Die Taschen werden schwer.","grounded":false,"answer":"Je länger der Weg ist, umso schwerer werden die Taschen.","explain":"أضيفت länger بعد je ثم جاء ist في نهاية التابع. في النتيجة جاء werden مباشرة بعد umso schwerer.","hints":["ابدأ كل جزء بعبارة المقارنة وحدّد موقع الفعلين."],"de":{"prompt":"Verbinde die Sätze mit je … umso und den Komparativen von `lang` und `schwer`: `Der Weg ist lang. Die Taschen werden schwer.`","explain":"Nach `je` steht `länger`, `ist` steht am Ende des Nebensatzes. Im Ergebnis folgt `werden` direkt nach `umso schwerer`.","hints":["Beginne jeden Teil mit dem Komparativ und bestimme die Position der beiden Verben."]}},{"id":"je-desto-8","type":"text","topic":"je-desto","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Je länger wohne ich hier, desto besser ich kenne die Gegend.","answer":"Je länger ich hier wohne, desto besser kenne ich die Gegend.","explain":"راجع كل جزء وحده. الأول تابع وينتهي بالفعل. الثاني رئيسي وتأتي مجموعة المقارنة قبل الفعل المصرف.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Prüf jeden Teil einzeln: Der erste ist ein Nebensatz und endet mit dem Verb. Der zweite ist ein Hauptsatz – die Komparativgruppe steht vor dem konjugierten Verb.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"je-desto-9","type":"text","topic":"je-desto","difficulty":2,"prompt":"أين الفعل في `Je öfter sie übt, umso sicherer spricht sie`؟","answer":"تنتهي الجملة الأولى بـ `übt`. يبدأ الجزء الثاني بـ `umso sicherer` ثم يأتي `spricht`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Wo steht das Verb in `Je öfter sie übt, umso sicherer spricht sie`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Der erste Teil endet mit `übt`. Der zweite beginnt mit `umso sicherer`, danach kommt `spricht`."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"تستعمل هذا التركيب عندما يتغيّر شيء مع تغيّر شيء آخر. مثال ذلك أن تقلّ الحيرة كلما زادت معرفة المرء بالحي.","example":"Je länger ich hier wohne, desto besser kenne ich die Gegend.","translation":"كلما سكنت هنا مدة أطول، عرفت المنطقة بصورة أفضل.","pitfall":["Je länger wohne ich hier, desto besser ich kenne die Gegend. → Je länger ich hier wohne, desto besser kenne ich die Gegend.","راجع كل جزء وحده. الأول تابع وينتهي بالفعل. الثاني رئيسي وتأتي مجموعة المقارنة قبل الفعل المصرف."],"recall":["أين الفعل في `Je öfter sie übt, umso sicherer spricht sie`؟","تنتهي الجملة الأولى بـ `übt`. يبدأ الجزء الثاني بـ `umso sicherer` ثم يأتي `spricht`."],"de":{"title":"je … desto / umso","lead":"Du benutzt diese Struktur, wenn sich etwas zusammen mit etwas anderem verändert – zum Beispiel: Je besser man das Viertel kennt, desto weniger verliert man sich.","steps":[{"text":"Bilde zwei Komparative","why":"Die Beziehung beruht auf zwei Steigerungen. Wähle für jeden Teil eine Größe, etwa die Dauer und wie gut man etwas kennt. Manche Komparative sind unregelmäßig, z. B. `gut → besser`."},{"text":"Stell den Komparativ direkt nach je","why":"Der erste Teil ist ein Nebensatz. Die Komparativgruppe steht am Anfang, das konjugierte Verb `wohne` am Ende vor dem Komma."},{"text":"Stell den zweiten Komparativ an den Anfang des Ergebnisses","why":"Statt `desto` kannst du auch `umso` sagen. Die ganze Gruppe `desto besser` besetzt Position 1, deshalb folgt direkt `kenne` und dann das Subjekt."},{"text":"Probiere den Vergleich in zwei Richtungen","why":"Ein Wert kann steigen, während der andere sinkt. `höher` und `weniger` bestimmen die Richtung. Die zweite Gruppe ist komplett `desto weniger Geld` vor dem Verb `bleibt`."}],"explain":["Steht der Komparativ in einer Nominalgruppe, bleibt die Gruppe zusammen: In `Je mehr Zeit wir haben, desto …` beginnt der erste Teil mit `je mehr Zeit`. Du hörst auch die Kurzform `Je früher, desto besser`, wenn klar ist, was früher passieren und was besser werden soll."],"pitfall":"Prüf jeden Teil einzeln: Der erste ist ein Nebensatz und endet mit dem Verb. Der zweite ist ein Hauptsatz – die Komparativgruppe steht vor dem konjugierten Verb.","recall":["Wo steht das Verb in `Je öfter sie übt, umso sicherer spricht sie`?","Der erste Teil endet mit `übt`. Der zweite beginnt mit `umso sicherer`, danach kommt `spricht`."],"links":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Konnektoren und Vergleich · grammis"]},"pattern":["je + Komparativ … Verb",",","desto / umso + Komparativ + Verb …"],"frames":[{"k":"sub","parts":[["c","Je länger"],["mf","ich hier"],["ve","wohne"]]},{"k":"main","parts":[["vf","desto besser"],["v","kenne"],["mf","ich die Gegend"]]}]},{"id":"relativ-dativ","chapter":1,"title":"ضمائر الوصل في الداتيف","german":"Relativpronomen und Relativsätze im Dativ","emoji":"🧩","links":[["فهرس قواعد الوحدة 1 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات جمل الوصل · grammis","https://grammis.ids-mannheim.de/progr%40mm/5272"]],"steps":[{"text":"افصل الجملتين","example":"Der Mann wohnt nebenan. Ich helfe dem Mann.","why":"الاسم المرجعي هو `der Mann`. في الجملة الثانية يطلب الفعل `helfen` داتيف. اسأل `Wem helfe ich?` لتتعرف على الوظيفة."},{"text":"اختر الضمير من الجنس والعدد","example":"Maskulin: dem · Feminin: der · Neutrum: dem · Plural: denen","why":"الجنس والعدد يأتيان من الاسم المرجعي. الحالة تأتي من موقع الضمير داخل جملة الوصل. انتبه إلى أن صيغة ضمير الوصل للجمع هنا `denen` حتى حين تبدأ مجموعة اسمية في الداتيف بـ `den`."},{"text":"رتّب الوصل بعد الاسم","example":"Der Mann, dem ich helfe, wohnt nebenan.","why":"حلّ الضمير محل الاسم المكرر. جاء في أول الوصل وانتقل `helfe` إلى آخره. ظل `wohnt` فعل الجملة الرئيسية."},{"text":"اختبر استقلال الحالتين","example":"Ich besuche die Nachbarin, der ich oft helfe.","why":"في الرئيسية `die Nachbarin` مفعول `besuchen` في الأكوزاتيف. في الوصل `der` داتيف مع `helfen`. تغيير وظيفة الاسم خارج الوصل لا يغيّر الوظيفة التي يحددها فعل الوصل."}],"explain":["استعمل الطريقة نفسها مع `danken` (يشكر)، و`vertrauen` (يثق)، و`antworten` (يجيب)، و`gefallen` (يروق). قارن `die Frau, die mich besucht` حيث `die` فاعل، و`die Frau, die ich besuche` حيث `die` مفعول مباشر، و`die Frau, der ich helfe` حيث `der` داتيف."],"questions":[{"id":"relativ-dativ-1","type":"cloze","topic":"relativ-dativ","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل ضمير الوصل للمذكر.","grounded":false,"text":"Das ist der Kollege, {{1}} ich danke.","blanks":[["dem"]],"explain":"danken يطلب الداتيف. المذكر المفرد في داتيف الوصل dem.","hints":["اسأل Wem danke ich?"],"de":{"prompt":"Ergänze das Relativpronomen für ein maskulines Nomen.","explain":"`danken` verlangt den Dativ. Maskulin Singular im Dativ: `dem`.","hints":["Frag: Wem danke ich?"]}},{"id":"relativ-dativ-2","type":"cloze","topic":"relativ-dativ","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل ضمير الوصل للمؤنث.","grounded":false,"text":"Die Freundin, {{1}} ich vertraue, wohnt hier.","blanks":[["der"]],"explain":"vertrauen يطلب الداتيف. die Freundin مؤنث، فيكون الضمير der.","hints":["حدّد الجنس ثم فكّر في الفعل vertrauen."],"de":{"prompt":"Ergänze das Relativpronomen für ein feminines Nomen.","explain":"`vertrauen` verlangt den Dativ. `die Freundin` ist feminin, also `der`.","hints":["Bestimme das Genus und denk an das Verb `vertrauen`."]}},{"id":"relativ-dativ-3","type":"mcq","topic":"relativ-dativ","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"ما ضمير داتيف الوصل لجمع die Kinder؟","grounded":false,"options":["denen","den","dem"],"answer":0,"explain":"den أداة الداتيف للجمع، وdem ضمير للمذكر أو المحايد المفرد، أما denen فهو ضمير الوصل في داتيف الجمع.","hints":["فكّر في صيغة الوصل الخاصة بالجمع."],"de":{"prompt":"Wie lautet das Relativpronomen im Dativ für den Plural `die Kinder`?","explain":"`den` ist der Dativartikel im Plural, `dem` das Pronomen für Maskulin oder Neutrum Singular. `denen` ist das Relativpronomen im Dativ Plural.","hints":["Denk an die besondere Pluralform des Relativpronomens."]}},{"id":"relativ-dativ-4","type":"cloze","topic":"relativ-dativ","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل الضمير ثم اكتب الفعل المصرف من antworten.","grounded":false,"text":"Das ist das Kind, {{1}} ich morgen {{2}}.","blanks":[["dem"],["antworte"]],"explain":"Kind محايد وantworten يطلب الداتيف. يبقى الفعل في آخر الوصل.","hints":["حدد الجنس والحالة أولًا، ثم صرّف مع ich."],"de":{"prompt":"Ergänze das Pronomen und dann die konjugierte Form von `antworten`.","explain":"`Kind` ist neutral und `antworten` verlangt den Dativ. Das Verb steht am Ende des Relativsatzes.","hints":["Bestimme erst Genus und Kasus, dann konjugiere mit `ich`."]}},{"id":"relativ-dativ-5","type":"order","topic":"relativ-dativ","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب الوصل بعد die Personen. اجعل er بعد الضمير، وoft قبل اسم المفعول.","grounded":false,"items":["denen","er","oft","geholfen","hat"],"explain":"denen يشير إلى جمع في الداتيف. ينتهي الوصل بـ geholfen hat.","hints":["ضع المساعد المصرف بعد اسم المفعول."],"de":{"prompt":"Ordne den Relativsatz nach `die Personen`. Setz `er` nach das Pronomen und `oft` vor das Partizip.","explain":"`denen` verweist auf einen Plural im Dativ. Der Relativsatz endet mit `geholfen hat`.","hints":["Setz das konjugierte Hilfsverb nach das Partizip."]}},{"id":"relativ-dativ-6","type":"mcq","topic":"relativ-dativ","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"في Ich kenne die Frau, der er hilft ما الذي حدّد der؟","grounded":false,"options":["الفعل hilft داخل الوصل والجنس المؤنث للاسم المرجعي.","الفعل kenne خارج الوصل والجنس المؤنث للاسم المرجعي.","كون المرأة فاعلًا في الجملة الرئيسية."],"answer":0,"explain":"helfen يطلب الداتيف. في الرئيسية المرأة مفعول، وحالة ذلك المفعول مستقلة عن حالة ضمير الوصل.","hints":["احسب الحالة من وظيفة الاسم في جملة الوصل."],"de":{"prompt":"Was bestimmt `der` in `Ich kenne die Frau, der er hilft`?","explain":"`helfen` verlangt den Dativ. Im Hauptsatz ist die Frau Objekt, aber ihr Kasus dort ist unabhängig vom Kasus des Relativpronomens.","hints":["Bestimme den Kasus aus der Funktion im Relativsatz."],"options":["Das Verb `hilft` im Relativsatz und das feminine Genus des Bezugsworts.","Das Verb `kenne` außerhalb des Relativsatzes und das feminine Genus des Bezugsworts.","Dass die Frau im Hauptsatz das Subjekt ist."]}},{"id":"relativ-dativ-7","type":"text","topic":"relativ-dativ","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"اربط الجملتين بضمير وصل. ضع الوصل بعد die Nachbarn. Ich kenne die Nachbarn. Ich habe den Nachbarn geholfen.","grounded":false,"answer":"Ich kenne die Nachbarn, denen ich geholfen habe.","explain":"استخدم denen للجمع في الداتيف، واختتم التابعة بالفعل المصرف habe.","hints":["هل الفعل الثاني يأخذ داتيفًا؟ وأين يأتي habe؟"],"de":{"prompt":"Verbinde die Sätze mit einem Relativpronomen. Stell den Relativsatz nach `die Nachbarn`: `Ich kenne die Nachbarn. Ich habe den Nachbarn geholfen.`","explain":"Benutze `denen` für den Dativ Plural und beende den Nebensatz mit dem konjugierten Verb `habe`.","hints":["Verlangt das zweite Verb einen Dativ? Und wo steht `habe`?"]}},{"id":"relativ-dativ-8","type":"text","topic":"relativ-dativ","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Das sind die Leute, den ich danke.","answer":"Das sind die Leute, denen ich danke.","explain":"لجمع الأشخاص مع `danken` نحتاج داتيف الجمع لضمير الوصل، أي `denen`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Bei Personen im Plural brauchen wir mit `danken` das Relativpronomen im Dativ Plural, also `denen`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"relativ-dativ-9","type":"text","topic":"relativ-dativ","difficulty":2,"prompt":"ما صيغة الداتيف مع `das Kind`؟","answer":"نختار `dem` لأن `Kind` محايد، مثل `das Kind, dem ich antworte`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Wie lautet der Dativ bei `das Kind`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`dem`, weil `Kind` neutral ist, z. B. `das Kind, dem ich antworte`."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"table":[["الحالة","مذكر","مؤنث","محايد","جمع"],["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","denen"]],"lead":"جملة الوصل تضيف معلومة إلى اسم سبق ذكره. حين يكون دور ذلك الاسم داخل الوصل في حالة الداتيف، تختار ضميرًا من `dem، der، denen`.","example":"Der Mann, dem ich helfe, wohnt nebenan.","translation":"الرجل الذي أساعده يسكن في البيت المجاور.","pitfall":["Das sind die Leute, den ich danke. → Das sind die Leute, denen ich danke.","لجمع الأشخاص مع `danken` نحتاج داتيف الجمع لضمير الوصل، أي `denen`."],"recall":["ما صيغة الداتيف مع `das Kind`؟","نختار `dem` لأن `Kind` محايد، مثل `das Kind, dem ich antworte`."],"de":{"title":"Relativpronomen im Dativ","lead":"Ein Relativsatz gibt mehr Informationen über ein Nomen, das schon genannt wurde. Hat dieses Nomen im Relativsatz die Rolle eines Dativs, wählst du eines der Pronomen `dem`, `der`, `denen`.","steps":[{"text":"Trenne die beiden Sätze","why":"Das Bezugswort ist `der Mann`. Im zweiten Satz verlangt `helfen` den Dativ. Frag `Wem helfe ich?`, um die Funktion zu erkennen."},{"text":"Wähle das Pronomen nach Genus und Numerus","why":"Genus und Numerus kommen vom Bezugswort, der Kasus von der Rolle des Pronomens im Relativsatz. Achtung: Im Plural heißt das Relativpronomen `denen`, auch wenn der Dativartikel im Plural `den` ist."},{"text":"Stell den Relativsatz hinter das Nomen","why":"Das Pronomen ersetzt das wiederholte Nomen. Es steht am Anfang des Relativsatzes, `helfe` geht ans Ende. `wohnt` bleibt das Verb des Hauptsatzes."},{"text":"Prüfe, dass beide Kasus unabhängig sind","why":"Im Hauptsatz ist `die Nachbarin` Akkusativobjekt von `besuchen`. Im Relativsatz steht `der` im Dativ wegen `helfen`. Die Funktion außerhalb ändert nichts am Kasus, den das Verb im Relativsatz verlangt."}],"explain":["Geh genauso mit `danken`, `vertrauen`, `antworten` und `gefallen` vor. Vergleiche: `die Frau, die mich besucht` (`die` = Subjekt), `die Frau, die ich besuche` (`die` = Akkusativobjekt) und `die Frau, der ich helfe` (`der` = Dativ)."],"pitfall":"Bei Personen im Plural brauchen wir mit `danken` das Relativpronomen im Dativ Plural, also `denen`.","recall":["Wie lautet der Dativ bei `das Kind`?","`dem`, weil `Kind` neutral ist, z. B. `das Kind, dem ich antworte`."],"links":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"],"table":[["Kasus","Maskulin","Feminin","Neutrum","Plural"],["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","denen"]]},"pattern":["Nomen",",","dem · der · dem · denen","…","Verb",","],"frames":[{"k":"main","parts":[["vf","Der Mann, dem ich helfe,"],["v","wohnt"],["mf","nebenan"]]},{"k":"rel","parts":[["c","dem"],["mf","ich"],["ve","helfe"]]}]},{"id":"relativ-praep","chapter":1,"title":"جملة الوصل مع حرف جر","german":"Relativsätze mit Präpositionen","emoji":"🔗","links":[["فهرس قواعد الوحدة 1 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات جمل الوصل · grammis","https://grammis.ids-mannheim.de/progr%40mm/5272"]],"steps":[{"text":"استرجع الجملة القصيرة","example":"Wir warten auf den Bus.","why":"احفظ التعبير كاملًا. هنا `auf` مع `warten` يطلب الأكوزاتيف. لذلك تكتب `den` للمذكر."},{"text":"استبدل الاسم وانقل المجموعة","example":"…, auf den wir warten.","why":"انتقل حرف الجر مع الضمير إلى البداية. وضع الفعل `warten` في النهاية يحافظ على ترتيب الوصل."},{"text":"قارن بحرف ثابت الداتيف","example":"Das ist die Frau, mit der ich arbeite.","why":"حرف `mit` يأخذ الداتيف دائمًا. الاسم المرجعي مؤنث، فتصبح المجموعة `mit der`. ومع الجمع تقول `mit denen`."},{"text":"افحص المكان والاتجاه إذا كان الحرف مكانيًا","example":"der Tisch, an dem wir sitzen · der Tisch, an den wir den Stuhl stellen","why":"الجلوس يصف موقعًا ثابتًا فيستعمل `an dem`. وضع الكرسي عند الطاولة يحدد وجهة الحركة فيستعمل `an den`."}],"explain":["اقرأ الجملة التابعة بمفردها قبل اختيار الضمير. في `Das ist das Thema, über das wir sprechen` تختار `über das` لأن `sprechen über` يأخذ الأكوزاتيف و`Thema` محايد. في `Das sind die Bücher, aus denen ich lerne` يحدد `aus` الداتيف ويحدد الجمع صيغة `denen`. الصيغ `im` و`am` تختصر حرف الجر مع الأداة، أما في الوصل فقل `in dem` و`an dem` لكي يبقى ضمير الوصل ظاهرًا."],"questions":[{"id":"relativ-praep-1","type":"cloze","topic":"relativ-praep","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل المجموعة المبدوءة بـ mit.","grounded":false,"text":"Das ist der Mann, {{1}} ich arbeite.","blanks":[["mit dem"]],"explain":"مع المذكر في الداتيف تقول mit dem.","hints":["mit يطلب حالة ثابتة."],"de":{"prompt":"Ergänze die Gruppe mit `mit`.","explain":"Maskulin im Dativ: `mit dem`.","hints":["`mit` verlangt immer denselben Kasus."]}},{"id":"relativ-praep-2","type":"cloze","topic":"relativ-praep","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل المجموعة المبدوءة بـ für.","grounded":false,"text":"Das ist die Firma, {{1}} ich arbeite.","blanks":[["für die"]],"explain":"für يطلب الأكوزاتيف. صيغة المؤنث هي die.","hints":["فكّر في صيغة أكوزاتيف المؤنث."],"de":{"prompt":"Ergänze die Gruppe mit `für`.","explain":"`für` verlangt den Akkusativ. Die feminine Form ist `die`.","hints":["Denk an den Akkusativ feminin."]}},{"id":"relativ-praep-3","type":"mcq","topic":"relativ-praep","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أيّ حرف يلائم الفعل warten عند الحديث عن انتظار القطار؟","grounded":false,"options":["auf","mit","über"],"answer":0,"explain":"نقول auf den Zug warten. لذلك تبدأ جملة الوصل بـ auf den.","hints":["تذكّر الحرف الملازم للفعل warten في هذا التعبير."],"de":{"prompt":"Welche Präposition passt zu `warten`, wenn man auf den Zug wartet?","explain":"Man sagt `auf den Zug warten`. Deshalb beginnt der Relativsatz mit `auf den`.","hints":["Erinnere dich an die feste Präposition von `warten`."]}},{"id":"relativ-praep-4","type":"cloze","topic":"relativ-praep","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل المكان الثابت ثم الوجهة.","grounded":false,"text":"Das ist der Schrank, {{1}} die Gläser stehen und {{2}} ich die Tassen stelle.","blanks":[["in dem"],["in den"]],"explain":"stehen يدل على مكان ثابت فيأخذ الداتيف مع in. stellen هنا اتجاه إلى داخل الخزانة فيأخذ الأكوزاتيف.","hints":["ميّز مكان الأشياء عن وجهة وضعها."],"de":{"prompt":"Ergänze zuerst den festen Ort, dann die Richtung.","explain":"`stehen` beschreibt einen festen Ort, also Dativ mit `in`. `stellen` gibt hier die Richtung in den Schrank an, also Akkusativ.","hints":["Unterscheide, wo etwas ist und wohin man es stellt."]}},{"id":"relativ-praep-5","type":"order","topic":"relativ-praep","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب الوصل بعد das Thema. ضع الفاعل قبل gestern.","grounded":false,"items":["über das","wir","gestern","gesprochen","haben"],"explain":"sprechen über يطلب Akkusativ هنا، وThema محايد. المساعد المصرف في الآخر.","hints":["ابدأ بحرف الجر والضمير كوحدة."],"de":{"prompt":"Ordne den Relativsatz nach `das Thema`. Setz das Subjekt vor `gestern`.","explain":"`sprechen über` verlangt hier den Akkusativ, und `Thema` ist neutral. Das konjugierte Hilfsverb steht am Ende.","hints":["Beginne mit Präposition und Pronomen als Einheit."]}},{"id":"relativ-praep-6","type":"mcq","topic":"relativ-praep","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"اختر جملة الوصل الصحيحة للجملة Wir lernen aus den Büchern.","grounded":false,"options":["die Bücher, aus denen wir lernen","die Bücher, aus den wir lernen","die Bücher, denen wir aus lernen"],"answer":0,"explain":"aus يطلب الداتيف. den أداة الجمع وليست صيغة ضمير الوصل هنا، وموضع aus قبل denen.","hints":["ضمير الوصل في داتيف الجمع له شكل خاص. ضع حرف الجر قبله."],"de":{"prompt":"Wähle den richtigen Relativsatz zu `Wir lernen aus den Büchern.`","explain":"`aus` verlangt den Dativ. `den` ist der Pluralartikel, nicht das Relativpronomen, und `aus` steht vor `denen`.","hints":["Das Relativpronomen im Dativ Plural hat eine besondere Form. Setz die Präposition davor."]}},{"id":"relativ-praep-7","type":"text","topic":"relativ-praep","difficulty":3,"src":"TELC ص 2 (الفهرس)","prompt":"ادمج الجملتين. Der Zug hat Verspätung. Wir warten auf den Zug.","grounded":false,"answer":"Der Zug, auf den wir warten, hat Verspätung.","explain":"auf den للمذكر في الأكوزاتيف مع warten auf. يوضع warten آخر الوصل ثم تستأنف الرئيسية بـ hat.","hints":["حافظ على حرف الجر، وأدرج الوصل بين فاصلتين."],"de":{"prompt":"Verbinde die Sätze: `Der Zug hat Verspätung. Wir warten auf den Zug.`","explain":"`auf den` für Maskulin Akkusativ mit `warten auf`. `warten` steht am Ende des Relativsatzes, dann geht der Hauptsatz mit `hat` weiter.","hints":["Behalte die Präposition und setz den Relativsatz zwischen zwei Kommas."]}},{"id":"relativ-praep-8","type":"text","topic":"relativ-praep","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Das ist die Person, der ich mit arbeite.","answer":"Das ist die Person, mit der ich arbeite.","explain":"تنتقل المجموعة `mit der` كوحدة واحدة إلى بداية الجملة.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Gruppe `mit der` wandert als Einheit an den Anfang des Nebensatzes.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"relativ-praep-9","type":"text","topic":"relativ-praep","difficulty":2,"prompt":"ماذا تقول مع `für` و`die Projekte`؟","answer":"`für die`، لأن `für` يأخذ الأكوزاتيف وصيغة جمع الوصل فيه `die`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 2 (الفهرس)","grounded":false,"de":{"prompt":"Was sagst du mit `für` und `die Projekte`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`für die`, weil `für` den Akkusativ verlangt und das Relativpronomen im Plural dort `die` lautet."}}],"src":"TELC ص 2 (الفهرس)","grounded":false,"lead":"إذا كان الفعل مرتبطًا بحرف جر مثل `warten auf`، احتفظ بالحرف حين تحوّل الاسم إلى ضمير وصل. الحرف والضمير يبدآن الجملة التابعة معًا.","example":"Das ist der Bus, auf den wir warten.","translation":"هذه هي الحافلة التي ننتظرها.","pitfall":["Das ist die Person, der ich mit arbeite. → Das ist die Person, mit der ich arbeite.","تنتقل المجموعة `mit der` كوحدة واحدة إلى بداية الجملة."],"recall":["ماذا تقول مع `für` و`die Projekte`؟","`für die`، لأن `für` يأخذ الأكوزاتيف وصيغة جمع الوصل فيه `die`."],"de":{"title":"Relativsätze mit Präposition","lead":"Gehört zum Verb eine feste Präposition wie bei `warten auf`, bleibt die Präposition erhalten, wenn das Nomen zum Relativpronomen wird. Präposition und Pronomen eröffnen den Nebensatz gemeinsam.","steps":[{"text":"Erinnere dich an den kurzen Satz","why":"Lerne den Ausdruck als Ganzes. `warten auf` verlangt den Akkusativ, deshalb schreibst du beim Maskulinum `den`."},{"text":"Ersetze das Nomen und verschiebe die Gruppe","why":"Die Präposition wandert zusammen mit dem Pronomen an den Anfang. `warten` steht am Ende – so bleibt die Wortstellung des Relativsatzes erhalten."},{"text":"Vergleiche mit einer Dativ-Präposition","why":"`mit` steht immer mit Dativ. Das Bezugswort ist feminin, also `mit der`. Im Plural sagst du `mit denen`."},{"text":"Prüfe Ort und Richtung bei Wechselpräpositionen","why":"Sitzen beschreibt einen festen Ort, deshalb `an dem`. Den Stuhl an den Tisch stellen gibt eine Richtung an, deshalb `an den`."}],"explain":["Lies den Nebensatz für sich, bevor du das Pronomen wählst. In `Das ist das Thema, über das wir sprechen` wählst du `über das`, weil `sprechen über` den Akkusativ verlangt und `Thema` neutral ist. In `Das sind die Bücher, aus denen ich lerne` bestimmt `aus` den Dativ und der Plural die Form `denen`. `im` und `am` sind Verschmelzungen aus Präposition und Artikel – im Relativsatz sagst du `in dem` und `an dem`, damit das Relativpronomen sichtbar bleibt."],"pitfall":"Die Gruppe `mit der` wandert als Einheit an den Anfang des Nebensatzes.","recall":["Was sagst du mit `für` und `die Projekte`?","`für die`, weil `für` den Akkusativ verlangt und das Relativpronomen im Plural dort `die` lautet."],"links":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"]},"pattern":["Präposition","+","Relativpronomen","…","Verb"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","der Bus, auf den wir warten"]]},{"k":"rel","parts":[["c","auf den"],["mf","wir"],["ve","warten"]]}]},{"id":"relativ-einschub","chapter":1,"title":"جملة الوصل الاعتراضية","german":"Eingeschobene Relativsätze","emoji":"🪡","links":[["فهرس قواعد الوحدة 1 · telc، ص 2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أدوات جمل الوصل · grammis","https://grammis.ids-mannheim.de/progr%40mm/5272"]],"steps":[{"text":"اقرأ الهيكل قبل الإدراج","example":"Die Nachbarin zieht morgen um.","why":"هذا هو الهيكل الرئيسي. موقع `zieht` الثاني محسوب بالنسبة إلى الفاعل، وتأتي بادئة الفعل القابل للفصل `umziehen` في النهاية."},{"text":"اكتب الوصل مستقلًا في ذهنك","example":"der ich geholfen habe","why":"أخذت `der` صيغة المؤنث في الداتيف لأن `helfen` يطلبها. بقي `habe` في نهاية الجملة التابعة."},{"text":"أدرج الوصل بين فاصلتين","example":"Die Nachbarin, der ich geholfen habe, zieht morgen um.","why":"بعد الفاصلة الثانية تعود إلى `zieht`. يمكنك حذف الجزء بين الفاصلتين مؤقتًا للتأكد من أن الهيكل الرئيسي بقي سليمًا."},{"text":"جرّب الإدراج بعد مفعول","example":"Ich habe den Schlüssel, den du suchst, gestern gefunden.","why":"الاسم الموصوف هنا جزء من وسط الجملة. يأتي `suchst` قبل الفاصلة الثانية ثم تستأنف الرئيسية بـ `gestern gefunden`."}],"explain":["إذا جاء الوصل في آخر الجملة، تكفي فاصلة افتتاحية ثم علامة انتهاء الجملة. في `Ich besuche den Mann, dem ich helfe.` لا توجد بقية رئيسية بعد الوصل. وإذا قدّمت ظرفًا في الرئيسية فترتيبها يظل خاضعًا له كما في `Morgen besucht uns die Frau, die hier wohnt.` موقع الوصل يتبع الاسم الذي يصفه حتى عندما يتغير موقع الاسم نفسه."],"questions":[{"id":"relativ-einschub-1","type":"mcq","topic":"relativ-einschub","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"اختر علامات الترقيم الصحيحة.","grounded":false,"options":["Die Frau, die hier arbeitet, ist nett.","Die Frau, die hier arbeitet ist nett.","Die Frau die hier arbeitet, ist nett."],"answer":0,"explain":"عند إدراج الوصل في الوسط نحتاج فاصلة قبله وفاصلة بعده.","hints":["حدّد بداية الوصل ونهايته."],"de":{"prompt":"Wähle die richtige Zeichensetzung.","explain":"Steht der Relativsatz in der Mitte, brauchen wir ein Komma davor und eins danach.","hints":["Bestimme Anfang und Ende des Relativsatzes."]}},{"id":"relativ-einschub-2","type":"cloze","topic":"relativ-einschub","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل فعل الرئيسية بعد الوصل. استعمل liegt.","grounded":false,"text":"Das Buch, das du suchst, {{1}} im Regal.","blanks":[["liegt"]],"explain":"تتبقى Das Buch liegt im Regal، ولذلك يعود الفعل liegt بعد الفاصلة.","hints":["احذف الوصل ذهنيًا واقرأ الجملة."],"de":{"prompt":"Ergänze das Verb des Hauptsatzes nach dem Relativsatz. Benutze `liegt`.","explain":"Übrig bleibt `Das Buch liegt im Regal`, deshalb kommt `liegt` nach dem Komma zurück.","hints":["Lass den Relativsatz im Kopf weg und lies den Satz."]}},{"id":"relativ-einschub-3","type":"mcq","topic":"relativ-einschub","difficulty":1,"src":"TELC ص 2 (الفهرس)","prompt":"أيّ هيكل يبقى بعد حذف الوصل؟ Der Nachbar, dem ich geholfen habe, zieht um.","grounded":false,"options":["Der Nachbar zieht um.","Der Nachbar habe geholfen.","Der Nachbar hilft."],"answer":0,"explain":"ينتمي habe إلى الوصل. الفعل القابل للفصل في الرئيسية هو zieht … um.","hints":["احذف كل ما بين الفاصلتين."],"de":{"prompt":"Welches Gerüst bleibt, wenn man den Relativsatz weglässt? `Der Nachbar, dem ich geholfen habe, zieht um.`","explain":"`habe` gehört zum Relativsatz. Das trennbare Verb des Hauptsatzes ist `zieht … um`.","hints":["Lass alles zwischen den Kommas weg."]}},{"id":"relativ-einschub-4","type":"order","topic":"relativ-einschub","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"رتّب الجملة بوضع الوصل مباشرة بعد die Lampe.","grounded":false,"items":["Die Lampe,","die du","gekauft hast,","steht jetzt","am Fenster."],"explain":"ينتهي الوصل بـ gekauft hast. بعد إغلاقه تعود الرئيسية إلى steht.","hints":["ابحث عن فعل كل جملة قبل ترتيبها."],"de":{"prompt":"Ordne den Satz und setz den Relativsatz direkt nach `die Lampe`.","explain":"Der Relativsatz endet mit `gekauft hast`. Danach kehrt der Hauptsatz zu `steht` zurück.","hints":["Such das Verb jedes Satzes, bevor du ordnest."]}},{"id":"relativ-einschub-5","type":"cloze","topic":"relativ-einschub","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أكمل الفعل المصرف في كل جملة.","grounded":false,"text":"Die Leute, denen du gestern geholfen {{1}}, {{2}} heute wieder. (haben / kommen)","blanks":[["hast"],["kommen"]],"explain":"نصرّف haben مع du، وkommen مع الجمع. كل فعل تابع لفاعله الخاص.","hints":["فاعل الوصل du وفاعل الرئيسية die Leute."],"de":{"prompt":"Ergänze das konjugierte Verb in jedem Satz.","explain":"`haben` wird mit `du` konjugiert, `kommen` mit dem Plural. Jedes Verb richtet sich nach seinem eigenen Subjekt.","hints":["Das Subjekt des Relativsatzes ist `du`, das des Hauptsatzes `die Leute`."]}},{"id":"relativ-einschub-6","type":"mcq","topic":"relativ-einschub","difficulty":2,"src":"TELC ص 2 (الفهرس)","prompt":"أيّ دمج يحافظ على موضع الظرف gestern داخل الرئيسية؟ Ich habe den Schlüssel gestern gefunden. Du suchst den Schlüssel.","grounded":false,"options":["Ich habe den Schlüssel, den du suchst, gestern gefunden.","Ich habe den Schlüssel, den du gestern suchst, gefunden.","Ich habe den Schlüssel den du suchst, gestern gefunden."],"answer":0,"explain":"المشتّت الأول يضع gestern في الوصل فيغيّر المعنى. المشتّت الآخر يحذف الفاصلة التي تفتح الوصل.","hints":["الظرف يخص العثور، والوصل يخص البحث."],"de":{"prompt":"Welche Verbindung lässt `gestern` im Hauptsatz? `Ich habe den Schlüssel gestern gefunden. Du suchst den Schlüssel.`","explain":"Die erste falsche Antwort setzt `gestern` in den R
