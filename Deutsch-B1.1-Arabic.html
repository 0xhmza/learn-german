xt":"Ich esse einen {{1}} Salat mit {{2}} Zutaten.","blanks":[["gesünderen"],["frischeren"]],"explain":"gesund تصبح gesünder ثم تأخذ -en بعد einen. frisch يضيف -er للمقارنة و-en للداتيف.","hints":["الأول مذكر في الأكوزاتيف، والثاني جمع في الداتيف."],"de":{"prompt":"Schreib den deklinierten Komparativ von `gesund` und dann von `frisch`.","explain":"`gesund` wird zu `gesünder` und bekommt nach `einen` `-en`. `frisch` bekommt `-er` für den Komparativ und `-en` für den Dativ.","hints":["Das erste ist Maskulinum im Akkusativ, das zweite Plural im Dativ."]}},{"id":"komparativ-5","type":"mcq","topic":"komparativ","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"اختر المجموعة الصحيحة في Ich suche ….","grounded":false,"options":["ein günstigeres Angebot","ein günstiger Angebot","einen günstigeren Angebot"],"answer":0,"explain":"المقارنة günstiger ثم النهاية -es مع المحايد في الأكوزاتيف.","hints":["Angebot محايد. انتبه إلى نهاية الصفة بعد ein."],"de":{"prompt":"Wähle die richtige Gruppe in `Ich suche …`.","explain":"Der Komparativ `günstiger` plus Endung `-es` für das Neutrum im Akkusativ.","hints":["`Angebot` ist neutral. Achte auf die Adjektivendung nach `ein`."]}},{"id":"komparativ-6","type":"cloze","topic":"komparativ","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل صيغ المقارنة من hoch وviel.","grounded":false,"text":"ein {{1}} Preis · {{2}} Wasser","blanks":[["höherer"],["mehr"]],"explain":"hoch تصبح höher ثم تأخذ -er للمذكر في الرفع بعد ein. viel تصبح mehr هنا بلا نهاية.","hints":["احفظ صيغة hoch الشاذة. الماء هنا كمية."],"de":{"prompt":"Ergänze die Komparative von `hoch` und `viel`.","explain":"`hoch` wird zu `höher` und bekommt `-er` für Maskulinum im Nominativ nach `ein`. `viel` wird zu `mehr` – hier ohne Endung.","hints":["Merk dir die unregelmäßige Form von `hoch`. Das Wasser ist hier eine Menge."]}},{"id":"komparativ-7","type":"text","topic":"komparativ","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Die Variante ist besser إلى مجموعة اسمية نكرة في الداتيف بعد mit.","grounded":false,"answer":"mit einer besseren Variante","explain":"mit يطلب الداتيف. أداة النكرة للمؤنث einer، وتتبعها besseren.","hints":["ابدأ بأداة الداتيف المؤنثة وأضف نهاية الصفة إلى besser."],"de":{"prompt":"Mach aus `Die Variante ist besser` eine unbestimmte Nominalgruppe im Dativ nach `mit`.","explain":"`mit` verlangt den Dativ. Der unbestimmte Artikel feminin ist `einer`, danach `besseren`.","hints":["Beginne mit dem femininen Dativartikel und häng die Adjektivendung an `besser`."]}},{"id":"komparativ-8","type":"text","topic":"komparativ","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Ich nehme einen gesünder Salat.","answer":"Ich nehme einen gesünderen Salat.","explain":"الصيغة `gesünder` صحيحة للمقارنة. موقعها قبل اسم مذكر بعد `einen` يتطلب `-en` إضافية.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Form `gesünder` ist als Komparativ richtig. Vor einem maskulinen Nomen nach `einen` braucht sie aber zusätzlich `-en`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"komparativ-9","type":"text","topic":"komparativ","difficulty":2,"prompt":"كيف تصف طبقًا محايدًا بعد `ein` باستعمال `besser` في الأكوزاتيف؟","answer":"`ein besseres Gericht`. أساس المقارنة `besser` ثم النهاية `-es`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Wie beschreibst du ein neutrales Gericht nach `ein` mit `besser` im Akkusativ?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`ein besseres Gericht`. Basis ist der Komparativ `besser`, dazu kommt die Endung `-es`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"table":[["مع ein-","مذكر","مؤنث","محايد","جمع مع keine"],["Nominativ","ein besserer Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Akkusativ","einen besseren Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Dativ","einem besseren Plan","einer besseren Idee","einem besseren Bild","keinen besseren Ideen"],["Genitiv","eines besseren Plans","einer besseren Idee","eines besseren Bildes","keiner besseren Ideen"]],"lead":"عندما تضع المقارنة قبل الاسم، يتكوّن شكل الصفة من درجة المقارنة أولًا ثم نهاية التصريف. افصل المهمتين في ذهنك حتى لا تخلط بين حرف المقارنة ونهاية الحالة.","example":"Der Salat ist günstiger. → Ich nehme einen günstigeren Salat.","translation":"السلطة أرخص ← سآخذ سلطة أرخص.","pitfall":["Ich nehme einen gesünder Salat. → Ich nehme einen gesünderen Salat.","الصيغة `gesünder` صحيحة للمقارنة. موقعها قبل اسم مذكر بعد `einen` يتطلب `-en` إضافية."],"recall":["كيف تصف طبقًا محايدًا بعد `ein` باستعمال `besser` في الأكوزاتيف؟","`ein besseres Gericht`. أساس المقارنة `besser` ثم النهاية `-es`."],"de":{"title":"Adjektivdeklination mit Komparativ","lead":"Steht ein Komparativ vor dem Nomen, besteht die Form aus zwei Teilen: zuerst die Steigerung, dann die Deklinationsendung. Trenne die beiden Aufgaben im Kopf, damit du das Komparativ-`er` nicht mit der Kasusendung verwechselst.","steps":[{"text":"Bilde den Komparativ","why":"Meist hängst du `-er` an. Bei manchen Adjektiven ändert sich der Vokal: `alt → älter`, `kurz → kürzer`. Lern die besonderen Formen: `gut → besser`, `viel → mehr`, `hoch → höher`."},{"text":"Prüfe, ob das Adjektiv vor einem Nomen steht","why":"Nach `sein` steht der Komparativ allein. Vor dem Nomen kommt die passende Adjektivendung dazu: `günstiger + er` ergibt `günstigerer` nach `ein` mit Maskulinum im Nominativ."},{"text":"Wähle die Endung nach Artikel, Kasus und Genus","why":"Alle Beispiele stehen im Akkusativ: Maskulinum nach `einen` → `-en`, Femininum nach `eine` → `-e`, Neutrum nach `ein` → `-es`."},{"text":"Vergleiche mit Plural und Dativ","why":"Ohne Artikel bekommt der Plural im Akkusativ hier `-e`, nach `mit` im Dativ `-en`. In `mit einer besseren Mischung` trägt `einer` das Signal, das Adjektiv bekommt `-en`."}],"explain":["Nennst du die Vergleichsgröße, benutze `als`: `Die Suppe ist günstiger als der Salat`. Bei Gleichheit sagst du `so günstig wie`. Manche Komparative wie `mehr` und `weniger` bleiben meist ohne Endung, wenn sie eine Menge angeben: `mehr Wasser`, `weniger Salz`. Such in der Übung nach einem Nomen hinter dem Adjektiv und entscheide dann über die Deklination."],"pitfall":"Die Form `gesünder` ist als Komparativ richtig. Vor einem maskulinen Nomen nach `einen` braucht sie aber zusätzlich `-en`.","recall":["Wie beschreibst du ein neutrales Gericht nach `ein` mit `besser` im Akkusativ?","`ein besseres Gericht`. Basis ist der Komparativ `besser`, dazu kommt die Endung `-es`."],"links":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Adjektivdeklination · grammis"],"table":[["mit ein-","Maskulin","Feminin","Neutrum","Plural mit keine"],["Nominativ","ein besserer Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Akkusativ","einen besseren Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Dativ","einem besseren Plan","einer besseren Idee","einem besseren Bild","keinen besseren Ideen"],["Genitiv","eines besseren Plans","einer besseren Idee","eines besseren Bildes","keiner besseren Ideen"]]},"pattern":["Adjektiv","+ -er (Komparativ)","+ Adjektivendung"],"frames":[{"k":"main","parts":[["vf","Der Salat"],["v","ist"],["hl","günstiger"]]},{"k":"main","parts":[["vf","Ich"],["v","nehme"],["mf","einen"],["hl","günstigeren"],["mf","Salat"]]}]},{"id":"superlativ","chapter":5,"title":"تصريف صفة التفضيل","german":"Adjektivdeklination mit Superlativ","emoji":"🏆","links":[["فهرس قواعد الوحدة 5 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["تصريف الصفات · grammis","https://grammis.ids-mannheim.de/progr%40mm/4067"]],"steps":[{"text":"ابنِ أساس التفضيل","example":"günstig → günstigst- · frisch → frischest-","why":"غالبًا تحصل على `-st-`. وقد تحتاج `-est-` لتسهيل النطق كما في `heißest-`. مع `frisch` تُستعمل الصيغتان `frischest-` و`frischst-`. احفظ الصيغ الشائعة مثل `best-` و`höchst-` و`nächst-`."},{"text":"استعمل am … -sten بعد الفعل عند وصف الدرجة","example":"Die Suppe ist am günstigsten.","why":"تتكون الصيغة من `am` ودرجة التفضيل في هذه البنية، مثل `am besten` و`am frischesten`. وهي تعمل أيضًا مع الفعل في `Sie kocht am schnellsten`."},{"text":"احذف am إذا وضعت الصفة مباشرة قبل اسم","example":"die günstigste Suppe · das frischeste Brot","why":"استخدم أساس التفضيل وأضف نهاية صفة. هنا تأتي `-e` بعد أداة التعريف للمؤنث والمحايد في الرفع. تجمع `frischeste` بين الأساس `frischest-` والنهاية `-e`."},{"text":"صرّف في الحالات الأخرى","example":"den besten Salat · mit der frischesten Milch · die günstigsten Angebote","why":"بعد الأداة المحددة نجد `-en` في المذكر في الأكوزاتيف، وفي الداتيف، وفي الجمع هنا. درجة التفضيل لا تغيّر قواعد الحالات."}],"explain":["اذكر المجموعة عند الحاجة، مثل `das günstigste Gericht auf der Karte` أو `Von allen Gerichten ist dieses am günstigsten`. وتظهر الصفة بعد أداة ملكية أيضًا، كما في `mein ältester Bruder`. قارن `mein älterer Bruder` التي تعني الأخ الأكبر مقارنةً بآخر، و`mein ältester Bruder` التي تحدد الأكبر ضمن المجموعة."],"questions":[{"id":"superlativ-1","type":"cloze","topic":"superlativ","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل صيغة التفضيل من gut بعد الفعل.","grounded":false,"text":"Dieses Brot schmeckt am {{1}}.","blanks":[["besten"]],"explain":"gut تصبح best- في التفضيل. في بناء am نكتب am besten.","hints":["تذكّر الأساس الشاذ للتفضيل."],"de":{"prompt":"Ergänze den Superlativ von `gut` nach dem Verb.","explain":"`gut` wird im Superlativ zu `best-`. Mit `am` schreiben wir `am besten`.","hints":["Denk an die unregelmäßige Superlativ-Basis."]}},{"id":"superlativ-2","type":"cloze","topic":"superlativ","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل التفضيل من günstig قبل اسم مؤنث.","grounded":false,"text":"Das ist die {{1}} Suppe.","blanks":[["günstigste"]],"explain":"günstigst- + -e بعد die للمؤنث في الرفع.","hints":["أضف نهاية الصفة بعد أساس التفضيل."],"de":{"prompt":"Ergänze den Superlativ von `günstig` vor einem femininen Nomen.","explain":"`günstigst-` + `-e` nach `die` für Femininum im Nominativ.","hints":["Häng nach der Superlativ-Basis die Adjektivendung an."]}},{"id":"superlativ-3","type":"mcq","topic":"superlativ","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"اختر العبارة التي تعني «أكثر الأطباق سخونة».","grounded":false,"options":["das heißeste Gericht","das heißste Gericht","das am heißesten Gericht"],"answer":0,"explain":"heiß يعطي heißest-. بعد das وقبل Gericht نضيف -e ونستعمل صيغة التفضيل بلا am.","hints":["انظر إلى نهاية heiß وإلى موقع الصفة قبل الاسم."],"de":{"prompt":"Wähle den Ausdruck für „das heißeste Gericht“.","explain":"`heiß` ergibt `heißest-`. Nach `das` und vor `Gericht` kommt `-e`, und der Superlativ steht ohne `am`.","hints":["Schau auf das Ende von `heiß` und auf die Position vor dem Nomen."]}},{"id":"superlativ-4","type":"cloze","topic":"superlativ","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل صيغتي التفضيل من gut وfrisch.","grounded":false,"text":"Ich nehme den {{1}} Salat mit der {{2}} Milch.","blanks":[["besten"],["frischesten","frischsten"]],"explain":"تأخذ الصفتان -en بعد الأداة هنا. الأساسان best- وfrischest-.","hints":["حدّد حالتي المذكر بعد den والمؤنث بعد mit."],"de":{"prompt":"Ergänze die Superlative von `gut` und `frisch`.","explain":"Beide Adjektive bekommen hier nach dem Artikel `-en`. Die Basen sind `best-` und `frischest-`.","hints":["Bestimme den Kasus beim Maskulinum nach `den` und beim Femininum nach `mit`."]}},{"id":"superlativ-5","type":"cloze","topic":"superlativ","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل التفضيل من alt بعد كلمة الملكية.","grounded":false,"text":"mein {{1}} Bruder","blanks":[["ältester"]],"explain":"alt يعطي ältest-. المذكر في الرفع بعد mein يحتاج -er على الصفة.","hints":["استعمل التفضيل ثم لاحظ غياب علامة النهاية عن mein."],"de":{"prompt":"Ergänze den Superlativ von `alt` nach dem Possessivartikel.","explain":"`alt` ergibt `ältest-`. Maskulinum im Nominativ nach `mein` braucht `-er` am Adjektiv.","hints":["Bilde den Superlativ und beachte, dass `mein` keine Endung zeigt."]}},{"id":"superlativ-6","type":"mcq","topic":"superlativ","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي جملة تعني «هذا الطبق هو الأصحّ بين جميع الأطباق»؟","grounded":false,"options":["Von allen Gerichten ist dieses am gesündesten.","Von allen Gerichten ist dieses gesünder.","Von allen Gerichten ist dieses so gesund wie das andere."],"answer":0,"explain":"am gesündesten للتفضيل. gesünder للمقارنة، وso gesund wie للتساوي.","hints":["أشر إلى أعلى درجة ضمن مجموعة."],"de":{"prompt":"Welcher Satz bedeutet „Dieses Gericht ist von allen das gesündeste“?","explain":"`am gesündesten` ist Superlativ, `gesünder` Komparativ, `so gesund wie` Gleichheit.","hints":["Zeig den höchsten Grad in einer Gruppe."]}},{"id":"superlativ-7","type":"text","topic":"superlativ","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"أعد صياغة Diese Angebote sind am günstigsten بدءًا من Das sind die، واذكر الاسم.","grounded":false,"answer":"Das sind die günstigsten Angebote.","explain":"تُحذف am في بناء الصفة قبل الاسم، ويأخذ الجمع بعد die نهاية -en.","hints":["انقل التفضيل إلى ما قبل جمع معرّف."],"de":{"prompt":"Formuliere `Diese Angebote sind am günstigsten` neu, beginne mit `Das sind die` und nenne das Nomen.","explain":"Vor dem Nomen fällt `am` weg, und der Plural nach `die` bekommt `-en`.","hints":["Stell den Superlativ vor ein bestimmtes Pluralnomen."]}},{"id":"superlativ-8","type":"text","topic":"superlativ","difficulty":3,"prompt":"صحّح الجملة حتى تعني «سآخذ أفضل خبز».","context":"Ich nehme das am besten Brot.","answer":"Ich nehme das beste Brot.","explain":"إذا قصدت «سآخذ أفضل خبز» فقل `Ich nehme das beste Brot.` قد تأتي `am besten` في جملة أخرى بمعنى «من الأفضل»، مثل `Am besten nehme ich Brot`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Satz, sodass er „Ich nehme das beste Brot“ bedeutet.","explain":"Meinst du „Ich nehme das beste Brot“, sag `Ich nehme das beste Brot.` `am besten` kann in einem anderen Satz „es ist das Beste, …“ bedeuten: `Am besten nehme ich Brot`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"superlativ-9","type":"text","topic":"superlativ","difficulty":2,"prompt":"لماذا نكتب `mit dem besten Plan`؟","answer":"`mit` يطلب الداتيف، وبعد `dem` تأخذ صفة التفضيل `-en`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Warum schreiben wir `mit dem besten Plan`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`mit` verlangt den Dativ, und nach `dem` bekommt der Superlativ `-en`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"table":[["مع أداة التعريف","مذكر","مؤنث","محايد","جمع"],["Nominativ","der beste Plan","die beste Idee","das beste Bild","die besten Pläne"],["Akkusativ","den besten Plan","die beste Idee","das beste Bild","die besten Pläne"],["Dativ","dem besten Plan","der besten Idee","dem besten Bild","den besten Plänen"],["Genitiv","des besten Plans","der besten Idee","des besten Bildes","der besten Pläne"]],"lead":"تستعمل درجة التفضيل لأعلى أو أدنى قيمة داخل مجموعة. تعلّم التبديل بين وصف النتيجة بعد الفعل ووصف الاسم مباشرة.","example":"Diese Suppe ist am günstigsten. → Das ist die günstigste Suppe.","translation":"هذا الحساء هو الأرخص ← هذا أرخص حساء.","pitfall":["Ich nehme das am besten Brot. → Ich nehme das beste Brot.","إذا قصدت «سآخذ أفضل خبز» فقل `Ich nehme das beste Brot.` قد تأتي `am besten` في جملة أخرى بمعنى «من الأفضل»، مثل `Am besten nehme ich Brot`."],"recall":["لماذا نكتب `mit dem besten Plan`؟","`mit` يطلب الداتيف، وبعد `dem` تأخذ صفة التفضيل `-en`."],"de":{"title":"Adjektivdeklination mit Superlativ","lead":"Mit dem Superlativ nennst du den höchsten oder niedrigsten Wert in einer Gruppe. Lern, zwischen der Form nach dem Verb und der Form direkt vor dem Nomen zu wechseln.","steps":[{"text":"Bilde die Superlativ-Basis","why":"Meist bekommst du `-st-`. Für die Aussprache brauchst du manchmal `-est-`, wie in `heißest-`. Bei `frisch` gehen `frischest-` und `frischst-`. Lern die häufigen Formen `best-`, `höchst-`, `nächst-`."},{"text":"Benutze am … -sten nach dem Verb","why":"Die Form besteht aus `am` und dem Superlativ: `am besten`, `am frischesten`. Sie funktioniert auch mit Verben: `Sie kocht am schnellsten`."},{"text":"Lass am weg, wenn das Adjektiv direkt vor dem Nomen steht","why":"Nimm die Superlativ-Basis und häng eine Adjektivendung an. Hier kommt `-e` nach dem bestimmten Artikel bei Femininum und Neutrum im Nominativ. `frischeste` = Basis `frischest-` + Endung `-e`."},{"text":"Dekliniere in den anderen Kasus","why":"Nach dem bestimmten Artikel steht `-en` im Akkusativ maskulin, im Dativ und hier im Plural. Der Superlativ ändert die Kasusregeln nicht."}],"explain":["Nenne die Gruppe, wenn nötig: `das günstigste Gericht auf der Karte` oder `Von allen Gerichten ist dieses am günstigsten`. Das Adjektiv steht auch nach einem Possessivartikel: `mein ältester Bruder`. Vergleiche `mein älterer Bruder` (älter als ein anderer) mit `mein ältester Bruder` (der Älteste in der Gruppe)."],"pitfall":"Meinst du „Ich nehme das beste Brot“, sag `Ich nehme das beste Brot.` `am besten` kann in einem anderen Satz „es ist das Beste, …“ bedeuten: `Am besten nehme ich Brot`.","recall":["Warum schreiben wir `mit dem besten Plan`?","`mit` verlangt den Dativ, und nach `dem` bekommt der Superlativ `-en`."],"links":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Adjektivdeklination · grammis"],"table":[["mit bestimmtem Artikel","Maskulin","Feminin","Neutrum","Plural"],["Nominativ","der beste Plan","die beste Idee","das beste Bild","die besten Pläne"],["Akkusativ","den besten Plan","die beste Idee","das beste Bild","die besten Pläne"],["Dativ","dem besten Plan","der besten Idee","dem besten Bild","den besten Plänen"],["Genitiv","des besten Plans","der besten Idee","des besten Bildes","der besten Pläne"]]},"pattern":["am … -sten (nach Verb)","·","der / die / das … -st- + Endung (vor Nomen)"],"frames":[{"k":"main","parts":[["vf","Diese Suppe"],["v","ist"],["hl","am günstigsten"]]},{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","die"],["hl","günstigste"],["mf","Suppe"]]}]},{"id":"statt-zu","chapter":5,"title":"البديل مع statt أو anstatt … zu","german":"Infinitivsätze mit (an)statt … zu","emoji":"🔀","links":[["فهرس قواعد الوحدة 5 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["المجموعات المصدرية · grammis","https://grammis.ids-mannheim.de/progr%40mm/6852"]],"steps":[{"text":"ميّز الفعل الفعلي عن البديل","example":"Ich koche zu Hause. · Ich bestelle kein Essen.","why":"تخبر الرئيسية عمّا أفعله. وتبين مجموعة `statt` الفعل الذي يحلّ الطبخ مكانه. في هذا السياق تعني `anstatt` الشيء نفسه."},{"text":"حدّد صاحب الفعلين","example":"Ich koche …, statt … zu bestellen.","why":"في هذا النمط يكون فاعل الفعل المصدر مفهومًا من الرئيسية، وهنا هو `ich`. إذا أردت التصريح بفاعل آخر تستطيع استعمال `statt dass`، كما في `Ich koche, statt dass du Essen bestellst`."},{"text":"ضع الفاصلة والمصدر","example":"…, statt Fertiggerichte einzukaufen.","why":"تجب الفاصلة مع هذا الرابط. إذا كان الفعل قابلًا للفصل فأدخل `zu` بعد البادئة. لذلك نحصل على `einzukaufen` من `einkaufen`."},{"text":"قدّم مجموعة البديل إذا أردت إبرازها","example":"Statt Essen zu bestellen, koche ich zu Hause.","why":"تشغل المجموعة المصدرية الموقع الأول للجملة. بعد الفاصلة يأتي `koche` ثم الفاعل `ich`."}],"explain":["في `statt eines Fertiggerichts` تأتي مجموعة اسمية مباشرةً بعد `statt`. وفي `statt ein Fertiggericht zu kaufen` تأتي مجموعة مصدرية فيها اسم هو مفعول `kaufen`. لهذا قد ترى جينيتيفًا في المثال الأول وأكوزاتيفًا داخل المجموعة في الثاني."],"questions":[{"id":"statt-zu-1","type":"cloze","topic":"statt-zu","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل المصدر البسيط مع zu.","grounded":false,"text":"Sie kocht, statt Essen {{1}}. (bestellen)","blanks":[["zu bestellen"]],"explain":"الفعل bestellen غير قابل للفصل. تكتب zu منفصلة.","hints":["ضع zu قبل المصدر البسيط."],"de":{"prompt":"Ergänze den einfachen Infinitiv mit `zu`.","explain":"`bestellen` ist nicht trennbar. Du schreibst `zu` getrennt.","hints":["Setz `zu` vor den einfachen Infinitiv."]}},{"id":"statt-zu-2","type":"cloze","topic":"statt-zu","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل المصدر المنفصل.","grounded":false,"text":"Wir kochen frisch, anstatt Tiefkühlpizza {{1}}. (aufwärmen)","blanks":[["aufzuwärmen"]],"explain":"البادئة auf تسبق zu داخل الكلمة.","hints":["أدخل zu بين جزأي aufwärmen."],"de":{"prompt":"Ergänze den trennbaren Infinitiv.","explain":"Das Präfix `auf` steht vor `zu` im Wort.","hints":["Setz `zu` zwischen die beiden Teile von `aufwärmen`."]}},{"id":"statt-zu-3","type":"mcq","topic":"statt-zu","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي نشاط يحدث فعلًا في Er läuft zur Arbeit, statt den Bus zu nehmen؟","grounded":false,"options":["يمشي إلى العمل.","يستقل الحافلة.","يمشي ويستقل الحافلة في الوقت نفسه."],"answer":0,"explain":"läuft يحدد الفعل الفعلي. ركوب الحافلة هو البديل المتروك.","hints":["ابحث عن الفعل المصرف في الرئيسية."],"de":{"prompt":"Was macht er tatsächlich in `Er läuft zur Arbeit, statt den Bus zu nehmen`?","explain":"`läuft` nennt die echte Handlung. Den Bus zu nehmen ist die verworfene Alternative.","hints":["Such das konjugierte Verb im Hauptsatz."],"options":["Er geht zu Fuß zur Arbeit.","Er nimmt den Bus.","Er geht zu Fuß und nimmt gleichzeitig den Bus."]}},{"id":"statt-zu-4","type":"order","topic":"statt-zu","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب بدءًا من Statt. اجعل ich فاعل الجزء الرئيسي.","grounded":false,"items":["Statt","Essen","zu bestellen,","koche","ich","heute."],"explain":"بعد الفاصلة يأتي koche ثم ich. الفعل المصدر في الجزء الأول هو zu bestellen.","hints":["مجموعة البديل تتصدر الجملة كاملة."],"de":{"prompt":"Ordne den Satz und beginne mit `Statt`. `ich` ist das Subjekt des Hauptsatzes.","explain":"Nach dem Komma kommt `koche`, dann `ich`. Der Infinitiv im ersten Teil ist `zu bestellen`.","hints":["Die Alternativgruppe steht komplett am Anfang."]}},{"id":"statt-zu-5","type":"mcq","topic":"statt-zu","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي جملة تصرّح بفاعل مختلف في البديل؟","grounded":false,"options":["Ich koche, statt dass du Essen bestellst.","Ich koche, statt Essen zu bestellen.","Ich koche, statt eines Fertiggerichts."],"answer":0,"explain":"statt dass du تُظهر du في الجملة التابعة، أما مجموعة المصدر فلا تذكر فاعلًا صريحًا.","hints":["ابحث عن فاعل ظاهر بعد الرابط."],"de":{"prompt":"Welcher Satz nennt in der Alternative ein anderes Subjekt?","explain":"`statt dass du` zeigt `du` im Nebensatz. Die Infinitivgruppe nennt kein eigenes Subjekt.","hints":["Such ein sichtbares Subjekt nach der Konjunktion."]}},{"id":"statt-zu-6","type":"cloze","topic":"statt-zu","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل شكل الفعل في تركيبَي المصدر والتابع.","grounded":false,"text":"Er radelt, statt den Bus {{1}}. · Er radelt, statt dass ihn jemand {{2}}. (nehmen / fahren)","blanks":[["zu nehmen"],["fährt"]],"explain":"في المجموعة المصدرية نكتب zu nehmen. في التابعة يتصرف fahren مع jemand ويأتي fährt أخيرًا.","hints":["قارن المصدر مع فعل يتصرف بحسب jemand."],"de":{"prompt":"Ergänze die Verbform in der Infinitivgruppe und im Nebensatz.","explain":"In der Infinitivgruppe schreiben wir `zu nehmen`. Im Nebensatz wird `fahren` mit `jemand` konjugiert, und `fährt` steht am Ende.","hints":["Vergleiche den Infinitiv mit einem Verb, das sich nach `jemand` richtet."]}},{"id":"statt-zu-7","type":"text","topic":"statt-zu","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"ادمج Sie nimmt die Treppe وSie fährt nicht mit dem Aufzug مع anstatt في نهاية الجملة.","grounded":false,"answer":"Sie nimmt die Treppe, anstatt mit dem Aufzug zu fahren.","explain":"المجموعة anstatt … zu تعرض البديل المتروك، وصاحب الفعل مفهوم من Sie.","hints":["الفعل المتروك هو fahren. ضع الفاصلة قبل anstatt."],"de":{"prompt":"Verbinde `Sie nimmt die Treppe` und `Sie fährt nicht mit dem Aufzug` mit `anstatt` am Satzende.","explain":"Die Gruppe `anstatt … zu` zeigt die verworfene Alternative; wer handelt, ergibt sich aus `Sie`.","hints":["Die verworfene Handlung ist `fahren`. Setz das Komma vor `anstatt`."]}},{"id":"statt-zu-8","type":"text","topic":"statt-zu","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Statt Essen bestellen, ich koche zu Hause.","answer":"Statt Essen zu bestellen, koche ich zu Hause.","explain":"تحتاج مجموعة المصدر إلى `zu`، ويأتي الفعل المصرف `koche` بعد الفاصلة.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Infinitivgruppe braucht `zu`, und das konjugierte Verb `koche` steht nach dem Komma.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"statt-zu-9","type":"text","topic":"statt-zu","difficulty":2,"prompt":"ما الفعل الذي يحصل في `Sie radelt zur Arbeit, statt den Bus zu nehmen`؟","answer":"تذهب بالدرّاجة. ركوب الحافلة هو البديل الذي عدلت عنه.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Was passiert tatsächlich in `Sie radelt zur Arbeit, statt den Bus zu nehmen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Sie fährt mit dem Rad. Den Bus zu nehmen ist die Alternative, auf die sie verzichtet."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"عندما يفعل شخص شيئًا بدلًا من شيء متوقَّع أو مقترح، تستطيع ذكر البديل الذي عدل عنه في مجموعة مصدرية.","example":"Ich koche zu Hause, statt Essen zu bestellen.","translation":"أطبخ في المنزل بدلًا من طلب الطعام.","pitfall":["Statt Essen bestellen, ich koche zu Hause. → Statt Essen zu bestellen, koche ich zu Hause.","تحتاج مجموعة المصدر إلى `zu`، ويأتي الفعل المصرف `koche` بعد الفاصلة."],"recall":["ما الفعل الذي يحصل في `Sie radelt zur Arbeit, statt den Bus zu nehmen`؟","تذهب بالدرّاجة. ركوب الحافلة هو البديل الذي عدلت عنه."],"de":{"title":"(an)statt … zu","lead":"Wenn jemand etwas anderes tut als das, was erwartet oder vorgeschlagen wurde, kannst du die Alternative, auf die er verzichtet, in einer Infinitivgruppe nennen.","steps":[{"text":"Unterscheide die echte Handlung von der Alternative","why":"Der Hauptsatz sagt, was ich tue. Die `statt`-Gruppe zeigt, welche Handlung das Kochen ersetzt. `anstatt` bedeutet hier dasselbe."},{"text":"Bestimme, wer beide Handlungen macht","why":"In diesem Muster ergibt sich das Subjekt des Infinitivs aus dem Hauptsatz – hier `ich`. Willst du ein anderes Subjekt nennen, benutze `statt dass`: `Ich koche, statt dass du Essen bestellst`."},{"text":"Setz Komma und Infinitiv","why":"Bei dieser Konjunktion steht ein Komma. Ist das Verb trennbar, kommt `zu` nach dem Präfix: aus `einkaufen` wird `einzukaufen`."},{"text":"Stell die Alternative nach vorn, wenn du sie betonen willst","why":"Die Infinitivgruppe besetzt Position 1. Nach dem Komma kommt `koche`, dann das Subjekt `ich`."}],"explain":["In `statt eines Fertiggerichts` folgt nach `statt` direkt eine Nominalgruppe. In `statt ein Fertiggericht zu kaufen` folgt eine Infinitivgruppe, in der das Nomen Objekt von `kaufen` ist. Deshalb siehst du im ersten Beispiel einen Genitiv und im zweiten einen Akkusativ in der Gruppe."],"pitfall":"Die Infinitivgruppe braucht `zu`, und das konjugierte Verb `koche` steht nach dem Komma.","recall":["Was passiert tatsächlich in `Sie radelt zur Arbeit, statt den Bus zu nehmen`?","Sie fährt mit dem Rad. Den Bus zu nehmen ist die Alternative, auf die sie verzichtet."],"links":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Infinitivgruppen · grammis"]},"pattern":["Hauptsatz",",","(an)statt … zu + Infinitiv"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","koche"],["mf","zu Hause"]]},{"k":"inf","parts":[["c","statt"],["mf","Essen"],["ve","zu bestellen"]]}]},{"id":"ohne-zu","chapter":5,"title":"فعل يحدث دون فعل آخر","german":"Infinitivsätze mit ohne … zu","emoji":"🍵","links":[["فهرس قواعد الوحدة 5 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["المجموعات المصدرية · grammis","https://grammis.ids-mannheim.de/progr%40mm/6852"]],"steps":[{"text":"افصل ما حصل عما لم يحصل","example":"Sie ging. · Sie verabschiedete sich nicht.","why":"حدثت المغادرة وغاب الوداع. تحمل `ohne` معنى الغياب بالفعل، لذلك لا تحتاج إلى `nicht` للتعبير عن هذا المعنى هنا."},{"text":"اربط الفعل المحذوف بالمصدر","example":"…, ohne sich zu verabschieden.","why":"يشير `sich` إلى الشخص نفسه في المثال. إذا كان الفاعل `ich` تقول `ohne mich zu verabschieden`. أبقِ علامة الانعكاس مع الفعل الذي يتطلبها."},{"text":"ضع الفعل القابل للفصل في صورة المصدر الصحيحة","example":"Sie isst, ohne vorher aufzuwärmen.","why":"مع `aufwärmen` تصبح الصيغة `aufzuwärmen`. وإذا ذكرت الطعام صراحةً تستطيع القول `ohne das Essen vorher aufzuwärmen`."},{"text":"اختر ohne dass عند التصريح بفاعل مختلف","example":"Sie ging, ohne dass ich es bemerkte.","why":"غادرت هي، وأنا الذي لم يلاحظ. بعد `ohne dass` توجد جملة تابعة بفاعل صريح وفعل مصرف في النهاية. ومع مجموعة المصدر توضع فاصلة كذلك."}],"explain":["في `Sie ging ohne Mantel` تأتي بعد `ohne` مجموعة اسمية في الأكوزاتيف. في `Sie ging, ohne den Mantel anzuziehen` يصف المصدر غياب فعل ارتداء المعطف. أما `statt den Mantel anzuziehen` فيبرز المعطف بوصفه بديلًا لسلوك آخر يذكره السياق. استعمل الرابط وفق العلاقة التي تريد التعبير عنها."],"questions":[{"id":"ohne-zu-1","type":"cloze","topic":"ohne-zu","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل المصدر من fragen.","grounded":false,"text":"Er nimmt das Brot, ohne vorher {{1}}.","blanks":[["zu fragen"]],"explain":"نكتب zu قبل fragen في المجموعة.","hints":["المصدر غير قابل للفصل."],"de":{"prompt":"Ergänze den Infinitiv von `fragen`.","explain":"In der Gruppe schreiben wir `zu` vor `fragen`.","hints":["Das Verb ist nicht trennbar."]}},{"id":"ohne-zu-2","type":"cloze","topic":"ohne-zu","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل ضمير الانعكاس المناسب مع ich.","grounded":false,"text":"Ich ging, ohne {{1}} zu verabschieden.","blanks":[["mich"]],"explain":"صاحب الفعل هو ich، فيلائمه ضمير الانعكاس mich.","hints":["من الذي كان يمكن أن يودّع؟"],"de":{"prompt":"Ergänze das passende Reflexivpronomen für `ich`.","explain":"Wer handelt, ist `ich` – dazu passt das Reflexivpronomen `mich`.","hints":["Wer hätte sich verabschieden können?"]}},{"id":"ohne-zu-3","type":"mcq","topic":"ohne-zu","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"ما الذي لم يحصل في Sie ging, ohne zu bezahlen؟","grounded":false,"options":["الدفع.","المغادرة.","الدفع والمغادرة."],"answer":0,"explain":"حصلت المغادرة حسب ging. لم يحصل الدفع حسب ohne zu bezahlen.","hints":["المجموعة بعد ohne تصف الفعل الغائب."],"de":{"prompt":"Was ist in `Sie ging, ohne zu bezahlen` nicht passiert?","explain":"Laut `ging` ist sie gegangen. Laut `ohne zu bezahlen` hat sie nicht bezahlt.","hints":["Die Gruppe nach `ohne` beschreibt die fehlende Handlung."],"options":["Das Bezahlen.","Das Gehen.","Das Bezahlen und das Gehen."]}},{"id":"ohne-zu-4","type":"cloze","topic":"ohne-zu","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل المصدر المنفصل من aufwärmen.","grounded":false,"text":"Er isst das Essen, ohne es {{1}}.","blanks":[["aufzuwärmen"]],"explain":"auf + zu + wärmen تصبح كلمة واحدة.","hints":["احتفظ بالبادئة وأدخل zu داخل الكلمة."],"de":{"prompt":"Ergänze den trennbaren Infinitiv von `aufwärmen`.","explain":"`auf` + `zu` + `wärmen` wird ein Wort.","hints":["Behalte das Präfix und setz `zu` ins Wort."]}},{"id":"ohne-zu-5","type":"mcq","topic":"ohne-zu","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"كيف تقول «غادرت دون أن يلاحظني هو»؟","grounded":false,"options":["Ich ging, ohne dass er mich bemerkte.","Ich ging, ohne ihn zu bemerken.","Ich ging, ohne mich zu bemerken."],"answer":0,"explain":"ohne dass يتيح ذكر er فاعلًا. الصيغتان المصدريتان تجعلان ich صاحب فعل الملاحظة.","hints":["المغادر والملاحظ شخصان مختلفان."],"de":{"prompt":"Wie sagst du „Ich bin gegangen, ohne dass er mich bemerkt hat“?","explain":"Mit `ohne dass` kannst du `er` als Subjekt nennen. Die Infinitivformen machen `ich` zur Person, die bemerkt.","hints":["Wer geht und wer bemerkt, sind verschiedene Personen."]}},{"id":"ohne-zu-6","type":"order","topic":"ohne-zu","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب مع تقديم المجموعة المصدرية. ضع الفاعل بعد فعل الرئيسية.","grounded":false,"items":["Ohne","sich","zu verabschieden,","ging","sie","nach Hause."],"explain":"zu verabschieden ينهي المصدرية. ging يبدأ الرئيسية لأن المصدرية تحتل الموقع الأول.","hints":["ابدأ بالمجموعة كلها ثم ضع الفعل المصرف بعد الفاصلة."],"de":{"prompt":"Ordne und stell die Infinitivgruppe nach vorn. Setz das Subjekt nach das Verb des Hauptsatzes.","explain":"`zu verabschieden` beendet die Infinitivgruppe. `ging` eröffnet den Hauptsatz, weil die Gruppe Position 1 besetzt.","hints":["Beginne mit der ganzen Gruppe und setz das konjugierte Verb nach das Komma."]}},{"id":"ohne-zu-7","type":"text","topic":"ohne-zu","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"ادمج Er trinkt den Saft وEr liest die Zutaten nicht مع ohne … zu.","grounded":false,"answer":"Er trinkt den Saft, ohne die Zutaten zu lesen.","explain":"اصنع المجموعة ohne die Zutaten zu lesen، وافصلها بفاصلة.","hints":["الفاعل واحد. معنى النفي يأتي من الرابط."],"de":{"prompt":"Verbinde `Er trinkt den Saft` und `Er liest die Zutaten nicht` mit ohne … zu.","explain":"Bilde die Gruppe `ohne die Zutaten zu lesen` und trenne sie mit Komma ab.","hints":["Das Subjekt ist dasselbe. Die Verneinung kommt aus der Konjunktion."]}},{"id":"ohne-zu-8","type":"text","topic":"ohne-zu","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Sie ging ohne sich verabschieden.","answer":"Sie ging, ohne sich zu verabschieden.","explain":"تبدأ المجموعة بـ `ohne` بعد فاصلة وتحتاج إلى `zu` قبل `verabschieden`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Gruppe beginnt nach einem Komma mit `ohne` und braucht `zu` vor `verabschieden`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"ohne-zu-9","type":"text","topic":"ohne-zu","difficulty":2,"prompt":"من الذي لم يقرأ المكونات في `Er kauft den Saft, ohne die Zutaten zu lesen`؟","answer":"المشتري نفسه. وتوضح `ohne dass` أي فاعل مختلف إذا دعت الحاجة.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Wer hat in `Er kauft den Saft, ohne die Zutaten zu lesen` die Zutaten nicht gelesen?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Der Käufer selbst. Mit `ohne dass` könntest du bei Bedarf ein anderes Subjekt nennen."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"يصف هذا التركيب فعلاً أساسيًا مع غياب فعل قد يصاحبه أو يُتوقع قبله. يساعدك تحديد صاحب الفعل على اختيار البنية.","example":"Sie ging, ohne sich zu verabschieden.","translation":"غادرت دون أن تودّع.","pitfall":["Sie ging ohne sich verabschieden. → Sie ging, ohne sich zu verabschieden.","تبدأ المجموعة بـ `ohne` بعد فاصلة وتحتاج إلى `zu` قبل `verabschieden`."],"recall":["من الذي لم يقرأ المكونات في `Er kauft den Saft, ohne die Zutaten zu lesen`؟","المشتري نفسه. وتوضح `ohne dass` أي فاعل مختلف إذا دعت الحاجة."],"de":{"title":"ohne … zu","lead":"Diese Struktur beschreibt eine Haupthandlung, bei der eine andere Handlung fehlt, die man erwarten würde. Wer handelt, entscheidet über die passende Struktur.","steps":[{"text":"Trenne, was passiert ist, von dem, was nicht passiert ist","why":"Sie ist gegangen, aber der Abschied fehlte. `ohne` trägt die Bedeutung des Fehlens schon in sich – du brauchst hier kein `nicht`."},{"text":"Verbinde die fehlende Handlung mit dem Infinitiv","why":"`sich` verweist im Beispiel auf dieselbe Person. Ist das Subjekt `ich`, sagst du `ohne mich zu verabschieden`. Das Reflexivpronomen bleibt beim Verb, das es braucht."},{"text":"Bring trennbare Verben in die richtige Infinitivform","why":"Aus `aufwärmen` wird `aufzuwärmen`. Nennst du das Essen ausdrücklich, kannst du sagen: `ohne das Essen vorher aufzuwärmen`."},{"text":"Wähle ohne dass für ein anderes Subjekt","why":"Sie ist gegangen, und ich habe es nicht bemerkt. Nach `ohne dass` folgt ein Nebensatz mit eigenem Subjekt und dem konjugierten Verb am Ende. Auch vor der Infinitivgruppe steht ein Komma."}],"explain":["In `Sie ging ohne Mantel` folgt nach `ohne` eine Nominalgruppe im Akkusativ. In `Sie ging, ohne den Mantel anzuziehen` beschreibt der Infinitiv, dass das Anziehen fehlt. `statt den Mantel anzuziehen` stellt das Anziehen dagegen als Alternative zu einem anderen Verhalten im Kontext dar. Wähle die Konjunktion nach der Beziehung, die du ausdrücken willst."],"pitfall":"Die Gruppe beginnt nach einem Komma mit `ohne` und braucht `zu` vor `verabschieden`.","recall":["Wer hat in `Er kauft den Saft, ohne die Zutaten zu lesen` die Zutaten nicht gelesen?","Der Käufer selbst. Mit `ohne dass` könntest du bei Bedarf ein anderes Subjekt nennen."],"links":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Infinitivgruppen · grammis"]},"pattern":["Hauptsatz",",","ohne … zu + Infinitiv"],"frames":[{"k":"main","parts":[["vf","Sie"],["v","ging"]]},{"k":"inf","parts":[["c","ohne"],["mf","sich"],["ve","zu verabschieden"]]}]},{"id":"passiv-modal","chapter":5,"title":"المبني للمجهول مع فعل ناقص","german":"Passiv mit Modalverben","emoji":"🛠️","links":[["فهرس قواعد الوحدة 5 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["أفعال المجهول · grammis","https://grammis.ids-mannheim.de/systematische-grammatik/929"]],"steps":[{"text":"ارفع المفعول المباشر","example":"die Zutaten → Die Zutaten","why":"تصبح المكوّنات مسندًا إليه في المجهول. كانت في الأكوزاتيف مع `prüfen` وصارت في الرفع. لا يظهر الفرق في أداة الجمع."},{"text":"صرّف الفعل الناقص مع المسند إليه","example":"Die Zutaten müssen …","why":"كان `muss` يوافق `man`. أصبح `müssen` يوافق جمع `die Zutaten`. عند الحديث عن مكوّن واحد تقول `Die Zutat muss …`."},{"text":"ضع Partizip II ثم المصدر werden","example":"Die Zutaten müssen geprüft werden.","why":"فعل `prüfen` يعطي `geprüft`. يأتي بعده `werden` مصدرًا لأن الفعل الناقص هو المصرف. تنطبق البنية مع `können` و`dürfen` و`sollen`."},{"text":"غيّر ترتيب التابع والزمن","example":"…, weil die Zutaten geprüft werden müssen. · Die Zutaten mussten geprüft werden.","why":"في الجملة التابعة يأتي `müssen` في النهاية بعد `geprüft werden`. وفي الماضي البسيط يُصرّف الفعل الناقص `mussten` ويبقى الطرف الأخير كما هو."}],"explain":["قارن `Die Zutaten werden geprüft` حيث نصف الإجراء، و`Die Zutaten müssen geprüft werden` حيث نضيف الوجوب، و`Die Zutaten sind geprüft worden` حيث نخبر عن فعل اكتمل. `Das darf nicht verkauft werden` يفيد المنع، و`Das muss nicht verkauft werden` يفيد أن البيع غير مطلوب."],"questions":[{"id":"passiv-modal-1","type":"cloze","topic":"passiv-modal","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الفعل الناقص müssen في الحاضر.","grounded":false,"text":"Die Regeln {{1}} erklärt werden.","blanks":[["müssen"]],"explain":"Die Regeln جمع، فالتصريف müssen.","hints":["طابق الفعل مع جمع القواعد."],"de":{"prompt":"Ergänze das Modalverb `müssen` im Präsens.","explain":"`Die Regeln` ist Plural, also `müssen`.","hints":["Passe das Verb an den Plural `Regeln` an."]}},{"id":"passiv-modal-2","type":"cloze","topic":"passiv-modal","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل مصدر المجهول.","grounded":false,"text":"Der Tisch kann repariert {{1}}.","blanks":[["werden"]],"explain":"بعد repariert يأتي مصدر المجهول werden.","hints":["الفعل الناقص هو المصرف بالفعل."],"de":{"prompt":"Ergänze den Passiv-Infinitiv.","explain":"Nach `repariert` kommt der Passiv-Infinitiv `werden`.","hints":["Das Modalverb ist schon konjugiert."]}},{"id":"passiv-modal-3","type":"mcq","topic":"passiv-modal","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي صيغة تمنع البيع؟","grounded":false,"options":["Das darf nicht verkauft werden.","Das muss nicht verkauft werden.","Das kann verkauft werden."],"answer":0,"explain":"darf nicht يفيد المنع. muss nicht ينفي الوجوب. kann يفيد الإمكان.","hints":["المنع يخص السماح بالفعل."],"de":{"prompt":"Welche Form verbietet den Verkauf?","explain":"`darf nicht` drückt ein Verbot aus. `muss nicht` verneint die Pflicht. `kann` drückt eine Möglichkeit aus.","hints":["Ein Verbot betrifft die Erlaubnis."]}},{"id":"passiv-modal-4","type":"cloze","topic":"passiv-modal","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Man muss den Antrag prüfen مع الحفاظ على المعنى.","grounded":false,"text":"Der Antrag {{1}} {{2}} {{3}}.","blanks":[["muss"],["geprüft"],["werden"]],"explain":"الطلب مفرد فيأخذ muss. الجزء الأخير geprüft werden.","hints":["انقل الطلب إلى الرفع ثم ابنِ القوس الفعلي."],"de":{"prompt":"Forme `Man muss den Antrag prüfen` um und behalte die Bedeutung.","explain":"Der Antrag ist Singular, also `muss`. Am Ende steht `geprüft werden`.","hints":["Setz den Antrag in den Nominativ und bau dann die Verbklammer."]}},{"id":"passiv-modal-5","type":"order","topic":"passiv-modal","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب التابعة وأبقِ الفاعل بعد weil.","grounded":false,"items":["weil","die Medikamente","richtig","gelagert","werden","müssen"],"explain":"يأتي müssen بعد gelagert werden. ظرف الكيفية richtig يسبق هذه المجموعة.","hints":["ينتهي التابع بالفعل الناقص المصرف."],"de":{"prompt":"Ordne den Nebensatz und lass das Subjekt nach `weil` stehen.","explain":"`müssen` steht nach `gelagert werden`. Das Adverb `richtig` steht vor dieser Gruppe.","hints":["Der Nebensatz endet mit dem konjugierten Modalverb."]}},{"id":"passiv-modal-6","type":"mcq","topic":"passiv-modal","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي جملة تعبّر عن وجوب ماضٍ؟","grounded":false,"options":["Die Ware musste geprüft werden.","Die Ware muss geprüft werden.","Die Ware ist geprüft worden."],"answer":0,"explain":"musste صيغة Präteritum. muss للحاضر وist geprüft worden يذكر الإجراء المكتمل بلا وجوب.","hints":["انظر إلى زمن الفعل الناقص."],"de":{"prompt":"Welcher Satz drückt eine Pflicht in der Vergangenheit aus?","explain":"`musste` ist Präteritum. `muss` ist Präsens, und `ist geprüft worden` nennt den abgeschlossenen Vorgang ohne Pflicht.","hints":["Schau auf die Zeitform des Modalverbs."]}},{"id":"passiv-modal-7","type":"text","topic":"passiv-modal","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Man kann die Formulare online ausfüllen إلى المجهول وابدأ بـ Die Formulare.","grounded":false,"answer":"Die Formulare können online ausgefüllt werden.","explain":"استعمل können مع الجمع ثم ausgefüllt werden. ظرف online يبقى قبل نهاية الأفعال.","hints":["انتبه إلى جمع Formulare وإلى صيغة ausfüllen في Partizip II."],"de":{"prompt":"Forme `Man kann die Formulare online ausfüllen` ins Passiv um und beginne mit `Die Formulare`.","explain":"Benutze `können` mit dem Plural, dann `ausgefüllt werden`. `online` steht vor den Verben am Ende.","hints":["Achte auf den Plural `Formulare` und auf das Partizip II von `ausfüllen`."]}},{"id":"passiv-modal-8","type":"text","topic":"passiv-modal","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Die Zutaten werden geprüft müssen.","answer":"Die Zutaten müssen geprüft werden.","explain":"في الرئيسية ضع الفعل الناقص المصرف في الموقع الثاني. تتكوّن النهاية من `geprüft werden`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Im Hauptsatz steht das konjugierte Modalverb auf Position 2. Am Ende steht `geprüft werden`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"passiv-modal-9","type":"text","topic":"passiv-modal","difficulty":2,"prompt":"كيف تقول إن تناول الدواء مسموح؟","answer":"`Das Medikament darf eingenommen werden.` استعمل `darf` للسماح، ثم `eingenommen werden`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Wie sagst du, dass man das Medikament einnehmen darf?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`Das Medikament darf eingenommen werden.` `darf` für die Erlaubnis, dann `eingenommen werden`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"في تعليمات أو قواعد الصحة، كثيرًا ما يهمك ما يجب فعله أو ما يُسمح به. يحتفظ المجهول بالتركيز على الشيء، ويضيف الفعل الناقص معنى الوجوب أو السماح أو الإمكان.","example":"Man muss die Zutaten prüfen. → Die Zutaten müssen geprüft werden.","translation":"يجب فحص المكوّنات.","pitfall":["Die Zutaten werden geprüft müssen. → Die Zutaten müssen geprüft werden.","في الرئيسية ضع الفعل الناقص المصرف في الموقع الثاني. تتكوّن النهاية من `geprüft werden`."],"recall":["كيف تقول إن تناول الدواء مسموح؟","`Das Medikament darf eingenommen werden.` استعمل `darf` للسماح، ثم `eingenommen werden`."],"de":{"title":"Passiv mit Modalverben","lead":"In Anleitungen oder Gesundheitsregeln geht es oft darum, was getan werden muss oder darf. Das Passiv hält den Fokus auf der Sache, das Modalverb ergänzt Pflicht, Erlaubnis oder Möglichkeit.","steps":[{"text":"Mach das Akkusativobjekt zum Subjekt","why":"Die Zutaten werden im Passiv zum Subjekt. Mit `prüfen` standen sie im Akkusativ, jetzt im Nominativ. Am Pluralartikel sieht man den Unterschied nicht."},{"text":"Konjugiere das Modalverb passend zum Subjekt","why":"`muss` passte zu `man`. Jetzt passt `müssen` zum Plural `die Zutaten`. Bei einer einzigen Zutat sagst du `Die Zutat muss …`."},{"text":"Setz Partizip II und dann den Infinitiv werden","why":"`prüfen` ergibt `geprüft`. Danach steht `werden` im Infinitiv, weil das Modalverb konjugiert ist. Die Struktur funktioniert auch mit `können`, `dürfen` und `sollen`."},{"text":"Ändere Nebensatz und Zeit","why":"Im Nebensatz steht `müssen` am Ende nach `geprüft werden`. Im Präteritum wird das Modalverb zu `mussten`, der Rest bleibt gleich."}],"explain":["Vergleiche: `Die Zutaten werden geprüft` beschreibt den Vorgang, `Die Zutaten müssen geprüft werden` ergänzt die Pflicht, `Die Zutaten sind geprüft worden` berichtet über einen abgeschlossenen Vorgang. `Das darf nicht verkauft werden` ist ein Verbot, `Das muss nicht verkauft werden` heißt, dass der Verkauf nicht nötig ist."],"pitfall":"Im Hauptsatz steht das konjugierte Modalverb auf Position 2. Am Ende steht `geprüft werden`.","recall":["Wie sagst du, dass man das Medikament einnehmen darf?","`Das Medikament darf eingenommen werden.` `darf` für die Erlaubnis, dann `eingenommen werden`."],"links":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Passiv-Hilfsverben · grammis"]},"pattern":["Modalverb","…","Partizip II","+","werden"],"frames":[{"k":"main","parts":[["vf","Die Zutaten"],["v","müssen"],["ve","geprüft werden"]]},{"k":"sub","parts":[["c","weil"],["mf","die Zutaten"],["ve","geprüft werden müssen"]]}]},{"id":"lassen","chapter":6,"title":"معاني الفعل lassen","german":"Das Verb lassen","emoji":"🪄","links":[["فهرس قواعد الوحدة 6 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["المصدر البديل وترتيب الأفعال · grammis","https://grammis.ids-mannheim.de/fragen/101"]],"steps":[{"text":"عبّر عن خدمة يقوم بها شخص آخر","example":"Ich lasse meine Brille reparieren.","why":"المتكلم يرتب إصلاح النظارة. الشخص الذي يقوم بالإصلاح يمكن أن يبقى مجهولًا. ضع `lassen` المصرف مبكرًا في الرئيسية، ثم المصدر `reparieren` في النهاية بلا `zu`."},{"text":"عبّر عن السماح أو المنع","example":"Sie lässt die Kinder draußen spielen. · Sie lässt die Kinder dort nicht spielen.","why":"تلعب المجموعة التي تظهر في الأكوزاتيف، وهي `die Kinder`. يظهر ذلك بوضوح مع الضمير `sie` أو مع المذكر في `Sie lässt ihn spielen`. النفي يمنع الفعل في المثال الثاني."},{"text":"تعرّف إلى التركيب الانعكاسي وإلى الفعل المستقل","example":"Das lässt sich reparieren. · Ich lasse die Tasche hier.","why":"التركيب الانعكاسي يفيد إمكان الإصلاح، أي `Das kann repariert werden`. وفي مثال الحقيبة يعني الفعل أنني أتركها هنا، ويكتمل المعنى بلا مصدر إضافي."},{"text":"صرّف الفعل وميّز الماضي","example":"ich lasse · du lässt · er lässt · wir lassen","why":"يتغيّر حرف العلة مع `du` و`er/sie/es`. في الماضي البسيط تقول `ich ließ`. في الماضي المركب مع مصدر آخر تقول `Ich habe das Rad reparieren lassen`، وحين يستعمل وحده تقول `Ich habe die Tasche hier gelassen`."}],"explain":["ميّز الخدمة عن الفعل الذاتي في `Ich lasse mir die Haare schneiden` و`Ich schneide mir die Haare`. في الجملة الأولى يحدد `mir` المستفيد من الخدمة. وفي `Lass das!` يطلب المتكلم ترك الفعل أو التوقف عنه. إذا احتجت إلى تحديد المعنى، اسأل من يقوم بالفعل الذي يظهر في المصدر."],"questions":[{"id":"lassen-1","type":"cloze","topic":"lassen","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"صرّف lassen مع er.","grounded":false,"text":"Er {{1}} sein Rad reparieren.","blanks":[["lässt"]],"explain":"نقول er lässt ثم المصدر المجرد.","hints":["تتغيّر حركة a في المفرد الثالث."],"de":{"prompt":"Konjugiere `lassen` mit `er`.","explain":"Wir sagen `er lässt` und dann den reinen Infinitiv.","hints":["In der 3. Person Singular ändert sich der Vokal `a`."]}},{"id":"lassen-2","type":"cloze","topic":"lassen","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل المصدر الذي يدل على خدمة إصلاح.","grounded":false,"text":"Ich lasse die Uhr {{1}}. (reparieren)","blanks":[["reparieren"]],"explain":"يأتي reparieren بلا zu.","hints":["lassen هنا فعل مصرف يتبعه مصدر."],"de":{"prompt":"Ergänze den Infinitiv, der eine Reparatur als Dienstleistung ausdrückt.","explain":"`reparieren` steht ohne `zu`.","hints":["`lassen` ist hier konjugiert, danach folgt ein Infinitiv."]}},{"id":"lassen-3","type":"mcq","topic":"lassen","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"من يصلح الأحذية في Ich lasse meine Schuhe reparieren؟","grounded":false,"options":["شخص آخر يتولى الخدمة.","المتكلم يصلحها بيده.","الحذاء يقوم بالإصلاح بنفسه."],"answer":0,"explain":"lassen هنا يفيد أن المتكلم يرتب إصلاح الحذاء لدى شخص آخر.","hints":["فرق بين ترتيب الخدمة وأداء الفعل."],"de":{"prompt":"Wer repariert die Schuhe in `Ich lasse meine Schuhe reparieren`?","explain":"`lassen` bedeutet hier, dass die sprechende Person die Reparatur bei jemand anderem beauftragt.","hints":["Unterscheide: eine Dienstleistung organisieren oder selbst handeln."],"options":["Eine andere Person übernimmt die Arbeit.","Die sprechende Person repariert sie selbst.","Der Schuh repariert sich selbst."]}},{"id":"lassen-4","type":"cloze","topic":"lassen","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل الماضي من lassen في حالتين.","grounded":false,"text":"Ich habe den Wagen waschen {{1}}. · Ich habe die Tasche zu Hause {{2}}.","blanks":[["lassen"],["gelassen"]],"explain":"مع waschen نستخدم المصدر البديل lassen. عند استعماله وحده بمعنى ترك نكتب gelassen.","hints":["هل يوجد مصدر آخر في الجملة؟"],"de":{"prompt":"Ergänze die Vergangenheit von `lassen` in zwei Fällen.","explain":"Mit `waschen` benutzen wir den Ersatzinfinitiv `lassen`. Allein im Sinne von „zurücklassen“ schreiben wir `gelassen`.","hints":["Gibt es noch einen weiteren Infinitiv im Satz?"]}},{"id":"lassen-5","type":"mcq","topic":"lassen","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي صيغة تعبّر عن إمكان الفتح؟","grounded":false,"options":["Die Tür lässt sich öffnen.","Die Tür lässt mich öffnen.","Ich lasse die Tür offen."],"answer":0,"explain":"sich öffnen مع lassen يفيد الإمكان. mich يدل على شخص، وoffen تصف الباب متروكًا مفتوحًا.","hints":["ابحث عن ضمير انعكاسي مع lassen والمصدر."],"de":{"prompt":"Welche Form drückt aus, dass man etwas öffnen kann?","explain":"`sich öffnen` mit `lassen` drückt eine Möglichkeit aus. `mich` verweist auf eine Person, `offen` beschreibt eine Tür, die offen gelassen wird.","hints":["Such ein Reflexivpronomen mit `lassen` und dem Infinitiv."]}},{"id":"lassen-6","type":"order","topic":"lassen","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب الجملة مع Heute أولًا. المتكلم هو من يطلب الخدمة لنفسه.","grounded":false,"items":["Heute","lasse","ich","mir","die Haare","schneiden."],"explain":"lasse يأتي بعد Heute، وmir يحدد المستفيد من خدمة القص.","hints":["بعد الظرف الأول يأتي الفعل المصرف، والمصدر يأتي في الآخر."],"de":{"prompt":"Ordne den Satz mit `Heute` am Anfang. Die sprechende Person beauftragt die Dienstleistung für sich selbst.","explain":"`lasse` kommt nach `Heute`, und `mir` zeigt, wer vom Haareschneiden profitiert.","hints":["Nach dem ersten Adverb steht das konjugierte Verb, der Infinitiv kommt ans Ende."]}},{"id":"lassen-7","type":"text","topic":"lassen","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"اكتب «هي لا تسمح له باللعب هنا» باستعمال lassen وihn.","grounded":false,"answer":"Sie lässt ihn hier nicht spielen.","explain":"lässt مع المفرد الثالث. ihn هو الشخص الذي سيؤدي spielen، وهو مصدر بلا zu.","hints":["صرّف lassen مع Sie وضع فعل اللعب في الطرف الآخر."],"de":{"prompt":"Schreib „Sie lässt ihn hier nicht spielen“ mit `lassen` und `ihn`.","explain":"`lässt` in der 3. Person Singular. `ihn` ist die Person, die spielen würde; `spielen` steht ohne `zu`.","hints":["Konjugiere `lassen` mit `Sie` und setz das Verb `spielen` ans andere Ende."]}},{"id":"lassen-8","type":"text","topic":"lassen","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Ich lasse mein Fahrrad zu reparieren.","answer":"Ich lasse mein Fahrrad reparieren.","explain":"في هذا الاستعمال يأتي المصدر بعد `lassen` بلا `zu`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"In dieser Bedeutung steht der Infinitiv nach `lassen` ohne `zu`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"lassen-9","type":"text","topic":"lassen","difficulty":2,"prompt":"ماذا تعني `Die Tür lässt sich öffnen`؟","answer":"يمكن فتح الباب. تركيب `sich lassen + Infinitiv` هنا يعبر عن الإمكان.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Was bedeutet `Die Tür lässt sich öffnen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Man kann die Tür öffnen. `sich lassen + Infinitiv` drückt hier eine Möglichkeit aus."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"يمكن أن يدل `lassen` على طلب تنفيذ خدمة أو السماح لآخر بفعل شيء. وتوجد استعمالات مألوفة أخرى تعرفها من الكلمات التي تأتي معه.","example":"Ich lasse mein Fahrrad reparieren.","translation":"أطلب إصلاح دراجتي لدى شخص آخر.","pitfall":["Ich lasse mein Fahrrad zu reparieren. → Ich lasse mein Fahrrad reparieren.","في هذا الاستعمال يأتي المصدر بعد `lassen` بلا `zu`."],"recall":["ماذا تعني `Die Tür lässt sich öffnen`؟","يمكن فتح الباب. تركيب `sich lassen + Infinitiv` هنا يعبر عن الإمكان."],"de":{"title":"Das Verb lassen","lead":"`lassen` kann bedeuten, dass man eine Dienstleistung beauftragt oder jemandem etwas erlaubt. Es gibt noch weitere gängige Bedeutungen, die du an den Wörtern daneben erkennst.","steps":[{"text":"Drück eine Dienstleistung durch eine andere Person aus","why":"Die sprechende Person organisiert die Reparatur der Brille. Wer repariert, kann unbekannt bleiben. Setz konjugiertes `lassen` früh in den Hauptsatz und den Infinitiv `reparieren` ohne `zu` ans Ende."},{"text":"Drück Erlaubnis oder Verbot aus","why":"Wer spielt, ist die Gruppe im Akkusativ: `die Kinder`. Deutlich sieht man das mit dem Pronomen `sie` oder mit dem Maskulinum: `Sie lässt ihn spielen`. Die Verneinung verbietet im zweiten Beispiel die Handlung."},{"text":"Lerne die reflexive Struktur und das Vollverb kennen","why":"Die reflexive Struktur drückt Möglichkeit aus: `Das kann repariert werden`. Im Beispiel mit der Tasche bedeutet das Verb, dass ich sie hier zurücklasse – ohne weiteren Infinitiv."},{"text":"Konjugiere das Verb und unterscheide die Vergangenheit","why":"Bei `du` und `er/sie/es` ändert sich der Vokal. Im Präteritum sagst du `ich ließ`. Im Perfekt mit einem weiteren Infinitiv: `Ich habe das Rad reparieren lassen`; allein: `Ich habe die Tasche hier gelassen`."}],"explain":["Unterscheide die Dienstleistung von der eigenen Handlung: `Ich lasse mir die Haare schneiden` und `Ich schneide mir die Haare`. Im ersten Satz zeigt `mir`, wer von der Dienstleistung profitiert. Mit `Lass das!` fordert man jemanden auf, mit etwas aufzuhören. Brauchst du Klarheit, frag: Wer führt die Handlung im Infinitiv aus?"],"pitfall":"In dieser Bedeutung steht der Infinitiv nach `lassen` ohne `zu`.","recall":["Was bedeutet `Die Tür lässt sich öffnen`?","Man kann die Tür öffnen. `sich lassen + Infinitiv` drückt hier eine Möglichkeit aus."],"links":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Ersatzinfinitiv und Verbstellung · grammis"]},"pattern":["lassen","…","Infinitiv (ohne zu)"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","lasse"],["mf","mein Fahrrad"],["ve","reparieren"]]}]},{"id":"pronominaladverbien","chapter":6,"title":"الإحالة إلى شيء أو فكرة بـ da- وwo-","german":"Präpositionaladverbien","emoji":"💬","links":[["فهرس قواعد الوحدة 6 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["ظروف حروف الجر · grammis","https://grammis.ids-mannheim.de/kontrastive-grammatik/3885"]],"steps":[{"text":"ابدأ من الفعل مع حرف الجر","example":"warten auf · sprechen über · rechnen mit","why":"لكل تعبير حرف ينبغي حفظه. تستعمل `auf` مع `warten`، ولذلك يبقى `auf` ظاهرًا في `darauf` و`worauf`."},{"text":"ابنِ صيغة الإشارة أو السؤال","example":"da + mit → damit · wo + mit → womit","why":"تعود `da-` إلى شيء أو فكرة، وتستعمل `wo-` للسؤال عنه. قبل حرف جر يبدأ بحركة أضف `r`، مثل `darüber / worüber` و`darauf / worauf`."},{"text":"ميّز الشخص عن الشيء","example":"Worauf wartest du? · Auf wen wartest du?","why":"اسأل `worauf` عندما تقصد الحافلة مثلًا، و`auf wen` عندما تقصد شخصًا. وفي الجواب عن شخص تقول `Ich warte auf ihn` أو `auf sie`."},{"text":"مهّد لمعلومة تأتي في جملة","example":"Ich freue mich darauf, dass du kommst.","why":"تشير `darauf` إلى محتوى جملة `dass`. وتستطيع أن تمهّد لمجموعة مصدرية كما في `Sie denkt daran, die Bestellung zurückzuschicken`."}],"explain":["احفظ أيضًا `dafür / wofür` مع `für`، و`davon / wovon` مع `von`، و`daran / woran` مع `an`. قارن `Ich freue mich darauf` لأمر منتظر و`Ich freue mich darüber` للتعبير عن الفرح بأمر حاصل أو معلوم. وإذا تقدمت الصيغة إلى الموقع الأول في الرئيسية جاء الفعل بعدها، مثل `Darüber sprechen wir morgen`."],"questions":[{"id":"pronominaladverbien-1","type":"cloze","topic":"pronominaladverbien","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل جواب السؤال عن الحافلة.","grounded":false,"text":"Worauf wartest du? – Ich warte {{1}}.","blanks":[["darauf"]],"explain":"dar + auf يعطي darauf.","hints":["حوّل wo- إلى صيغة إحالة واحتفظ بـ auf."],"de":{"prompt":"Ergänze die Antwort auf die Frage nach dem Bus.","explain":"`dar` + `auf` ergibt `darauf`.","hints":["Mach aus `wo-` eine Verweisform und behalte `auf`."]}},{"id":"pronominaladverbien-2","type":"cloze","topic":"pronominaladverbien","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"اسأل عمّا يتحدثون عنه.","grounded":false,"text":"{{1}} sprecht ihr? (über)","blanks":[["Worüber"]],"explain":"wo + r + über يعطي Worüber.","hints":["أضف r قبل حرف الجر المبدوء بحركة."],"de":{"prompt":"Frag, worüber sie sprechen.","explain":"`wo` + `r` + `über` ergibt `Worüber`.","hints":["Setz ein `r` vor eine Präposition, die mit einem Vokal beginnt."]}},{"id":"pronominaladverbien-3","type":"mcq","topic":"pronominaladverbien","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي سؤال تسأله عن شخص ينتظرونه؟","grounded":false,"options":["Auf wen wartet ihr?","Worauf wartet ihr?","Womit wartet ihr?"],"answer":0,"explain":"auf wen للسؤال عن شخص. worauf عن شيء، وwomit يسأل بحرف mit.","hints":["للسؤال عن شخص استعمل ضمير استفهام مع الحرف."],"de":{"prompt":"Mit welcher Frage fragst du nach einer Person, auf die sie warten?","explain":"`auf wen` fragt nach einer Person, `worauf` nach einer Sache; `womit` benutzt die Präposition `mit`.","hints":["Für Personen: Präposition + Fragepronomen."]}},{"id":"pronominaladverbien-4","type":"cloze","topic":"pronominaladverbien","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل صيغتي الإحالة.","grounded":false,"text":"Wir rechnen {{1}}, dass es regnet. · Sie denkt {{2}}, das Paket zurückzuschicken. (mit / an)","blanks":[["damit"],["daran"]],"explain":"mit يبدأ بصامت، لذا damit. an يبدأ بحركة، لذا daran.","hints":["مع الحرف الذي يبدأ بحركة أضف r."],"de":{"prompt":"Ergänze beide Verweisformen.","explain":"`mit` beginnt mit einem Konsonanten, also `damit`. `an` beginnt mit einem Vokal, also `daran`.","hints":["Bei einer Präposition mit Vokal am Anfang kommt ein `r` dazu."]}},{"id":"pronominaladverbien-5","type":"mcq","topic":"pronominaladverbien","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"اختر الصيغة التي ترجع إلى خبر أسعدك بالفعل.","grounded":false,"options":["Ich freue mich darüber.","Ich freue mich darauf.","Ich freue mich damit."],"answer":0,"explain":"sich über etwas freuen يعطي darüber. darauf يعبّر عادةً عن التطلّع، وdamit يحافظ على حرف غير مناسب هنا.","hints":["ميّز السرور بحدث قائم عن ترقّب أمر آتٍ."],"de":{"prompt":"Wähle die Form, die auf eine Nachricht verweist, über die du dich schon gefreut hast.","explain":"`sich über etwas freuen` ergibt `darüber`. `darauf` drückt meist Vorfreude aus, und `damit` hat hier die falsche Präposition.","hints":["Unterscheide Freude über etwas Bestehendes und Vorfreude auf etwas Kommendes."]}},{"id":"pronominaladverbien-6","type":"order","topic":"pronominaladverbien","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب الجواب وابدأ بالإحالة إلى موضوع الحديث، ثم الفعل.","grounded":false,"items":["Darüber","sprechen","wir","morgen."],"explain":"Darüber تأتي قبل الفعل في الرئيسية، لذلك يأتي sprechen قبل wir.","hints":["إذا تقدمت عبارة الإحالة فإنها تشغل الموقع الأول."],"de":{"prompt":"Ordne die Antwort und beginne mit dem Verweis auf das Gesprächsthema, dann das Verb.","explain":"`Darüber` steht vor dem Verb im Hauptsatz, deshalb kommt `sprechen` vor `wir`.","hints":["Steht der Verweis vorne, besetzt er Position 1."]}},{"id":"pronominaladverbien-7","type":"text","topic":"pronominaladverbien","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"حوّل Ich interessiere mich für den Kurs إلى إحالة على شيء مذكور، ثم اكتب سؤالًا عن الشيء.","grounded":false,"answer":"Ich interessiere mich dafür. Wofür interessierst du dich?","explain":"für يبدأ بصامت، لذلك نكتب dafür وwofür بلا r إضافية. يتغير الضمير الانعكاسي مع المخاطب.","hints":["حافظ على für في الإشارة والسؤال."],"de":{"prompt":"Mach aus `Ich interessiere mich für den Kurs` einen Verweis auf eine genannte Sache und schreib dann eine Frage nach der Sache.","explain":"`für` beginnt mit einem Konsonanten, deshalb schreiben wir `dafür` und `wofür` ohne zusätzliches `r`. Das Reflexivpronomen ändert sich mit der angesprochenen Person.","hints":["Behalte `für` im Verweis und in der Frage."]}},{"id":"pronominaladverbien-8","type":"text","topic":"pronominaladverbien","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Woüber sprecht ihr?","answer":"Worüber sprecht ihr?","explain":"تحتاج `r` لأن `über` يبدأ بصوت علّة. وإذا سألت عن شخص فقل `Über wen sprecht ihr?`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Du brauchst ein `r`, weil `über` mit einem Vokal beginnt. Fragst du nach einer Person, sag `Über wen sprecht ihr?`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"pronominaladverbien-9","type":"text","topic":"pronominaladverbien","difficulty":2,"prompt":"كيف تشير إلى خطة السفر في `Wir sprechen über die Reise`؟","answer":"`Wir sprechen darüber.` أبقِ `über` بعد `dar-`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Wie verweist du auf die Reise in `Wir sprechen über die Reise`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"`Wir sprechen darüber.` Behalte `über` nach `dar-`."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"table":[["حرف الجر","السؤال عن شيء","الإحالة إلى شيء"],["mit","womit","damit"],["für","wofür","dafür"],["von","wovon","davon"],["auf","worauf","darauf"],["über","worüber","darüber"],["an","woran","daran"]],"lead":"إذا كان الفعل مرتبطًا بحرف جر، يمكنك الرجوع إلى شيء ذكرته أو السؤال عنه بصيغة قصيرة مثل `darüber` أو `worauf`. حافظ على حرف الجر الأصلي حتى بعد دمجه.","example":"Worauf wartest du? – Ich warte darauf.","translation":"ماذا تنتظر؟ – أنتظر ذلك.","pitfall":["Woüber sprecht ihr? → Worüber sprecht ihr?","تحتاج `r` لأن `über` يبدأ بصوت علّة. وإذا سألت عن شخص فقل `Über wen sprecht ihr?`."],"recall":["كيف تشير إلى خطة السفر في `Wir sprechen über die Reise`؟","`Wir sprechen darüber.` أبقِ `über` بعد `dar-`."],"de":{"title":"Präpositionaladverbien mit da- und wo-","lead":"Gehört zum Verb eine Präposition, kannst du mit einer kurzen Form wie `darüber` oder `worauf` auf etwas Genanntes verweisen oder danach fragen. Die ursprüngliche Präposition bleibt dabei erhalten.","steps":[{"text":"Beginne mit Verb + Präposition","why":"Jeder Ausdruck hat eine Präposition, die man lernen muss. Zu `warten` gehört `auf`, deshalb bleibt `auf` in `darauf` und `worauf` sichtbar."},{"text":"Bilde die Verweis- oder Frageform","why":"`da-` verweist auf eine Sache oder Idee, mit `wo-` fragst du danach. Vor einer Präposition, die mit einem Vokal beginnt, kommt ein `r` dazu: `darüber / worüber`, `darauf / worauf`."},{"text":"Unterscheide Person und Sache","why":"Frag `worauf`, wenn du z. B. den Bus meinst, und `auf wen`, wenn du eine Person meinst. In der Antwort über eine Person sagst du `Ich warte auf ihn` oder `auf sie`."},{"text":"Kündige eine Information in einem Satz an","why":"`darauf` verweist auf den Inhalt eines `dass`-Satzes. Es kann auch eine Infinitivgruppe ankündigen: `Sie denkt daran, die Bestellung zurückzuschicken`."}],"explain":["Lern auch `dafür / wofür` mit `für`, `davon / wovon` mit `von` und `daran / woran` mit `an`. Vergleiche `Ich freue mich darauf` (etwas Kommendes) mit `Ich freue mich darüber` (Freude über etwas, das schon da oder bekannt ist). Steht die Form auf Position 1 im Hauptsatz, folgt danach das Verb: `Darüber sprechen wir morgen`."],"pitfall":"Du brauchst ein `r`, weil `über` mit einem Vokal beginnt. Fragst du nach einer Person, sag `Über wen sprecht ihr?`.","recall":["Wie verweist du auf die Reise in `Wir sprechen über die Reise`?","`Wir sprechen darüber.` Behalte `über` nach `dar-`."],"links":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Präpositionaladverbien · grammis"],"table":[["Präposition","Frage nach einer Sache","Verweis auf eine Sache"],["mit","womit","damit"],["für","wofür","dafür"],["von","wovon","davon"],["auf","worauf","darauf"],["über","worüber","darüber"],["an","woran","daran"]]},"pattern":["da(r) + Präposition = Verweis","·","wo(r) + Präposition = Frage"],"frames":[{"k":"main","parts":[["vf","Worauf"],["v","wartest"],["mf","du"]]},{"k":"main","parts":[["vf","Ich"],["v","warte"],["hl","darauf"]]}]},{"id":"sonst","chapter":6,"title":"وإلّا: نتيجة عدم فعل شيء","german":"Satzverbindendes Adverb andernfalls / sonst","emoji":"🚦","links":[["فهرس قواعد الوحدة 6 · telc، ص 3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3"],["حلول الكتاب الرسمية · telc","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf"],["معنى sonst · grammis","https://grammis.ids-mannheim.de/konnektoren/406877"]],"steps":[{"text":"استخرج الشرط الضمني","example":"Wenn du dich nicht beeilst, verpasst du den Bus.","why":"تفهم من التحذير أن الفوات مرتبط بعدم الإسراع. يحل الرابط محل إعادة ذكر الشرط المنفي. وقد تشير الجملة الأولى أيضًا إلى شرط كافٍ للنجاح، مثل `Du musst dich anmelden`."},{"text":"ابدأ الرئيسية الثانية بالرابط ثم الفعل","example":"…, sonst verpasst du den Bus.","why":"تحتل `sonst` الموقع الأول، و`verpasst` الثاني. هذا الترتيب مهم عند التحويل من جملة شرطية إلى رابط ظرفي."},{"text":"استعمل andernfalls بنفس الوظيفة","example":"Bitte zahlen Sie heute. Andernfalls wird die Bestellung storniert.","why":"تشيع `andernfalls` في اللغة الرسمية. يمكن أن يبدأ الرابط جملةً مستقلة بعد نقطة، أو أن يفصل بين الجملتين بفاصلة في مثال مناسب."},{"text":"تعرّف إلى موقع الظرف داخل الجملة","example":"Du musst leise sein. Du weckst sonst das Kind.","why":"قد يأتي الرابط وسط الجملة بعد الفعل المصرف. وانتبه إلى معنى `sonst` في `Was machst du sonst?`، حيث يقصد ما تفعله أيضًا أو عادةً بحسب السياق."}],"explain":["قارن `Nimm den Schirm, sonst wirst du nass` و`Es regnet, deshalb nehme ich den Schirm`. الأولى تحذّر مما يقع عند عدم أخذ المظلة. الثانية تستنتج أخذها من حالة قائمة هي المطر. استعمل `sonst` عندما تستطيع صياغة الشرط الخفي بـ `wenn nicht`."],"questions":[{"id":"sonst-1","type":"cloze","topic":"sonst","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بالفعل المصرف verpassen.","grounded":false,"text":"Beeil dich, sonst {{1}} du den Bus.","blanks":[["verpasst"]],"explain":"بعد sonst يأتي الفعل المصرف، ثم du.","hints":["sonst تشغل الموقع الأول في الجزء الثاني."],"de":{"prompt":"Ergänze die konjugierte Form von `verpassen`.","explain":"Nach `sonst` kommt das konjugierte Verb, dann `du`.","hints":["`sonst` besetzt im zweiten Teil Position 1."]}},{"id":"sonst-2","type":"cloze","topic":"sonst","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بمرادف رسمي لـ sonst.","grounded":false,"text":"Bitte zahlen Sie heute. {{1}} wird der Auftrag storniert.","blanks":[["Andernfalls"]],"explain":"Andernfalls يؤدي المعنى نفسه ويستعمل كثيرًا في اللغة الرسمية.","hints":["ابحث عن ظرف رسمي يعني «وإلا»."],"de":{"prompt":"Ergänze ein formelles Synonym für `sonst`.","explain":"`Andernfalls` hat dieselbe Bedeutung und ist in formeller Sprache häufig.","hints":["Such ein formelles Adverb mit der Bedeutung „wenn nicht“."]}},{"id":"sonst-3","type":"mcq","topic":"sonst","difficulty":1,"src":"TELC ص 3 (الفهرس)","prompt":"أي شرط يختبئ في Ruf an, sonst weiß ich nichts؟","grounded":false,"options":["إذا لم تتصل.","إذا اتصلت.","لأنك اتصلت بالفعل."],"answer":0,"explain":"النتيجة متوقفة على عدم الاتصال، لذلك الشرط المنفي هو الصحيح.","hints":["أعد كتابة الرابط بمعنى wenn nicht."],"de":{"prompt":"Welche Bedingung steckt in `Ruf an, sonst weiß ich nichts`?","explain":"Die Folge hängt davon ab, dass man nicht anruft – deshalb ist die verneinte Bedingung richtig.","hints":["Formuliere das Adverb als `wenn nicht`."],"options":["Wenn du nicht anrufst.","Wenn du anrufst.","Weil du schon angerufen hast."]}},{"id":"sonst-4","type":"order","topic":"sonst","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"رتّب الجزء الثاني بعد الفاصلة. ابدأ بـ sonst ثم الفعل.","grounded":false,"items":["sonst","kann","ich","die Bestellung","nicht ändern."],"explain":"kann يأتي بعد sonst. ويظهر المصدر ändern في نهاية الجملة.","hints":["ضع المصرف بعد الرابط، والمصدر في الآخر."],"de":{"prompt":"Ordne den zweiten Teil nach dem Komma. Beginne mit `sonst`, dann das Verb.","explain":"`kann` steht nach `sonst`, der Infinitiv `ändern` am Satzende.","hints":["Setz das konjugierte Verb nach das Adverb und den Infinitiv ans Ende."]}},{"id":"sonst-5","type":"mcq","topic":"sonst","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أي رابط يوضح نتيجة عدم ارتداء المعطف؟ Zieh den Mantel an, … frierst du.","grounded":false,"options":["sonst","deshalb","denn"],"answer":0,"explain":"sonst للتحذير الشرطي. deshalb نتيجة لسبب قائم، وdenn يذكر تفسيرًا.","hints":["أعد الصياغة بـ «إن لم ترتده…»."],"de":{"prompt":"Welches Wort zeigt die Folge, wenn man den Mantel nicht anzieht? `Zieh den Mantel an, … frierst du.`","explain":"`sonst` für eine Warnung mit Bedingung. `deshalb` nennt eine Folge aus einem bestehenden Grund, `denn` eine Erklärung.","hints":["Formuliere um: „Wenn du ihn nicht anziehst …“"]}},{"id":"sonst-6","type":"cloze","topic":"sonst","difficulty":2,"src":"TELC ص 3 (الفهرس)","prompt":"أكمل بالفعل المصرف وحدد موقعه.","grounded":false,"text":"Du musst leise sein. Du {{1}} sonst das Kind. (wecken)","blanks":[["weckst"]],"explain":"لما تقدم الفاعل Du، يتبعه الفعل weckst، ويأتي sonst بعده.","hints":["sonst هنا في وسط الجملة."],"de":{"prompt":"Ergänze das konjugierte Verb und bestimme seine Position.","explain":"Weil das Subjekt `Du` vorne steht, folgt das Verb `weckst`, und `sonst` steht danach.","hints":["`sonst` steht hier in der Satzmitte."]}},{"id":"sonst-7","type":"text","topic":"sonst","difficulty":3,"src":"TELC ص 3 (الفهرس)","prompt":"اختصر Wenn du die Nummer nicht notierst, vergisst du sie إلى تحذير يبدأ بـ Notier die Nummer ويستعمل sonst.","grounded":false,"answer":"Notier die Nummer, sonst vergisst du sie.","explain":"تدل sonst على نتيجة عدم اتباع الأمر. يأتي vergisst بعدها مباشرةً.","hints":["حوّل الشرط المنفي إلى أمر، وابدأ النتيجة بـ sonst."],"de":{"prompt":"Kürze `Wenn du die Nummer nicht notierst, vergisst du sie` zu einer Warnung, die mit `Notier die Nummer` beginnt und `sonst` benutzt.","explain":"`sonst` zeigt die Folge, wenn man der Aufforderung nicht folgt. `vergisst` steht direkt danach.","hints":["Mach aus der verneinten Bedingung einen Imperativ und beginne die Folge mit `sonst`."]}},{"id":"sonst-8","type":"text","topic":"sonst","difficulty":3,"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","context":"Schick die Rechnung, sonst ich kann nicht zahlen.","answer":"Schick die Rechnung, sonst kann ich nicht zahlen.","explain":"إذا بدأت الجملة الثانية بـ `sonst` فضع الفعل المصرف `kann` مباشرة بعدها.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Beginnt der zweite Satz mit `sonst`, steht das konjugierte Verb `kann` direkt danach.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}},{"id":"sonst-9","type":"text","topic":"sonst","difficulty":2,"prompt":"ما الشرط الضمني في `Ruf vorher an, andernfalls ist niemand da`؟","answer":"إذا لم تتصل مسبقًا، فلن يكون هناك أحد بحسب التحذير.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."],"src":"TELC ص 3 (الفهرس)","grounded":false,"de":{"prompt":"Welche Bedingung steckt in `Ruf vorher an, andernfalls ist niemand da`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."],"answer":"Wenn du nicht vorher anrufst, ist laut der Warnung niemand da."}}],"src":"TELC ص 3 (الفهرس)","grounded":false,"lead":"حين تحذّر من نتيجة قد تحصل إذا لم يُنفَّذ أمر، استعمل `sonst` أو `andernfalls`. معنى الربط هنا قريب من «وإلا» أو «في الحالة الأخرى».","example":"Beeil dich, sonst verpasst du den Bus.","translation":"أسرع، وإلّا فاتتك الحافلة.","pitfall":["Schick die Rechnung, sonst ich kann nicht zahlen. → Schick die Rechnung, sonst kann ich nicht zahlen.","إذا بدأت الجملة الثانية بـ `sonst` فضع الفعل المصرف `kann` مباشرة بعدها."],"recall":["ما الشرط الضمني في
