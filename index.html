<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn German — Deutsch lernen</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #d97706;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 12px 28px -4px rgba(15, 23, 42, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --surface: #131a2a;
        --surface-hover: #1b2438;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #243049;
        --accent: #f59e0b;
        --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        --shadow-hover: 0 12px 28px -4px rgba(0, 0, 0, 0.6);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      padding: 1.5rem;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 44rem;
      text-align: center;
    }

    .flag-bar {
      display: inline-flex;
      width: 3rem;
      height: 0.3rem;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .flag-bar span:nth-child(1) { flex: 1; background: #18181b; }
    .flag-bar span:nth-child(2) { flex: 1; background: #dc2626; }
    .flag-bar span:nth-child(3) { flex: 1; background: #facc15; }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 auto 2.25rem;
      max-width: 30rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1.25rem;
      text-align: left;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.5rem;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      background-color: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: var(--shadow-hover);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .icon {
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 0.65rem;
      background-color: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-desc {
      margin: 0;
      font-size: 0.925rem;
      color: var(--muted);
    }

    .arrow {
      transition: transform 0.18s ease;
    }

    .card:hover .arrow {
      transform: translateX(4px);
    }
  </style>
</head>
<body>
  <main>
    <div class="flag-bar" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <h1>Learn German</h1>
    <p class="subtitle">Choose a study mode to practice listening comprehension or master core grammar rules.</p>

    <nav aria-label="Learn German">
      <a class="card" href="./media-player/">
        <div class="icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <div class="card-title">
          <span>Media Player</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </div>
        <p class="card-desc">Immerse yourself in German audio and video with interactive playback.</p>
      </a>

      <a class="card" href="./grammar/">
        <div class="icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="card-title">
          <span>Grammar Platform</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </div>
        <p class="card-desc">Explore structured lessons, cases, verb conjugations, and exercises.</p>
      </a>
    </nav>
  </main>
</body>
</html>
