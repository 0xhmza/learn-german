,"explain":"`nur … brauchen zu` = es reicht. `unterschreiben` ist nicht trennbar, `zu` steht davor.","hints":["`unterschreiben` ist untrennbar."]}}},{"id":"brauchen-5","type":"order","difficulty":2,"items":["Ihr","braucht","keine Angst","zu","haben."],"i18n":{"ar":{"prompt":"رتّب الجملة.","explain":"`braucht` في الموقع الثاني، و`zu haben` في الآخر.","hints":["ابدأ بـ `Ihr`."]},"de":{"prompt":"Ordne den Satz.","explain":"`braucht` auf Position 2, `zu haben` am Ende.","hints":["Beginne mit `Ihr`."]}}},{"id":"brauchen-6","type":"mcq","difficulty":2,"options":["Wir müssen morgen früh aufstehen.","Wir brauchen morgen früh aufzustehen.","Wir brauchen morgen früh aufstehen."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة للتعبير عن الإلزام؟","explain":"في الجملة المثبتة بمعنى «يجب» نستعمل `müssen`، لا `brauchen zu`.","hints":["هل في الجملة نفي أو `nur`؟"]},"de":{"prompt":"Welcher Satz drückt die Pflicht richtig aus?","explain":"In einem bejahten Satz mit der Bedeutung „Pflicht“ steht `müssen`, nicht `brauchen zu`.","hints":["Gibt es eine Verneinung oder `nur`?"]}}},{"id":"brauchen-7","type":"text","difficulty":3,"answer":"Du brauchst mich nicht abzuholen.","i18n":{"ar":{"prompt":"حوّل الجملة إلى `brauchen`: `Du musst mich nicht abholen.`","explain":"`Du brauchst mich nicht abzuholen.` ومع الفعل المنفصل تدخل `zu` في وسطه.","hints":["`abholen` فعل منفصل."]},"de":{"prompt":"Forme um mit `brauchen`: `Du musst mich nicht abholen.`","explain":"`Du brauchst mich nicht abzuholen.` Bei trennbaren Verben steht `zu` in der Mitte.","hints":["`abholen` ist trennbar."]}}},{"id":"brauchen-8","type":"text","difficulty":3,"context":"Du brauchst morgen zu kommen.","answer":"Du musst morgen kommen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الجملة مثبتة وتعبّر عن إلزام، فالصحيح `müssen`. أما `brauchen zu` فلا تأتي إلا مع `nicht` أو `kein` أو `nur`.","hints":["هل في الجملة نفي؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Satz ist bejaht und drückt eine Pflicht aus. Richtig ist `müssen`. `brauchen zu` steht nur mit `nicht`, `kein` oder `nur`.","hints":["Gibt es eine Verneinung?"]}}},{"id":"brauchen-9","type":"text","difficulty":2,"answer":"Am Wochenende brauche ich nicht zu arbeiten.","i18n":{"ar":{"prompt":"اكتب ما لا يلزمك فعله في عطلة نهاية الأسبوع. استعمل `nicht … zu`.","explain":"مثال: `Am Wochenende brauche ich nicht zu arbeiten.`","hints":["`brauche` في الموقع الثاني."]},"de":{"prompt":"Schreib, was du am Wochenende nicht tun musst. Benutze `brauchen` mit `nicht … zu`.","explain":"Zum Beispiel: `Am Wochenende brauche ich nicht zu arbeiten.`","hints":["`brauche` steht auf Position 2."]}}}]},{"id":"lassen","level":"B1.1","island":"infinitiv-verben","order":5,"prereqs":[],"emoji":"🪄","german":"Das Verb lassen","source":{"lektion":6,"kind":"toc"},"pattern":["lassen","…","Infinitiv (ohne zu)"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","lasse"],["mf","mein Fahrrad"],["ve","reparieren"]]}],"example":"Ich lasse mein Fahrrad reparieren.","stepExamples":["Ich lasse meine Brille reparieren.","Sie lässt die Kinder draußen spielen. · Sie lässt die Kinder dort nicht spielen.","Das lässt sich reparieren. · Ich lasse die Tasche hier.","ich lasse · du lässt · er lässt · wir lassen"],"pitfallPair":"Ich lasse mein Fahrrad zu reparieren. → Ich lasse mein Fahrrad reparieren.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/fragen/101"],"i18n":{"ar":{"title":"معاني الفعل lassen","lead":"يمكن أن يدل `lassen` على طلب تنفيذ خدمة أو السماح لآخر بفعل شيء. وتوجد استعمالات مألوفة أخرى تعرفها من الكلمات التي تأتي معه.","translation":"أطلب إصلاح دراجتي لدى شخص آخر.","steps":[{"text":"عبّر عن خدمة يقوم بها شخص آخر","why":"المتكلم يرتب إصلاح النظارة. الشخص الذي يقوم بالإصلاح يمكن أن يبقى مجهولًا. ضع `lassen` المصرف مبكرًا في الرئيسية، ثم المصدر `reparieren` في النهاية بلا `zu`."},{"text":"عبّر عن السماح أو المنع","why":"تلعب المجموعة التي تظهر في الأكوزاتيف، وهي `die Kinder`. يظهر ذلك بوضوح مع الضمير `sie` أو مع المذكر في `Sie lässt ihn spielen`. النفي يمنع الفعل في المثال الثاني."},{"text":"تعرّف إلى التركيب الانعكاسي وإلى الفعل المستقل","why":"التركيب الانعكاسي يفيد إمكان الإصلاح، أي `Das kann repariert werden`. وفي مثال الحقيبة يعني الفعل أنني أتركها هنا، ويكتمل المعنى بلا مصدر إضافي."},{"text":"صرّف الفعل وميّز الماضي","why":"يتغيّر حرف العلة مع `du` و`er/sie/es`. في الماضي البسيط تقول `ich ließ`. في الماضي المركب مع مصدر آخر تقول `Ich habe das Rad reparieren lassen`، وحين يستعمل وحده تقول `Ich habe die Tasche hier gelassen`."}],"explain":["ميّز الخدمة عن الفعل الذاتي في `Ich lasse mir die Haare schneiden` و`Ich schneide mir die Haare`. في الجملة الأولى يحدد `mir` المستفيد من الخدمة. وفي `Lass das!` يطلب المتكلم ترك الفعل أو التوقف عنه. إذا احتجت إلى تحديد المعنى، اسأل من يقوم بالفعل الذي يظهر في المصدر."],"pitfall":"في هذا الاستعمال يأتي المصدر بعد `lassen` بلا `zu`.","recall":["ماذا تعني `Die Tür lässt sich öffnen`؟","يمكن فتح الباب. تركيب `sich lassen + Infinitiv` هنا يعبر عن الإمكان."],"linkTitles":["فهرس قواعد الوحدة 6 · telc، ص 3","حلول الكتاب الرسمية · telc","المصدر البديل وترتيب الأفعال · grammis"]},"de":{"title":"Das Verb lassen","lead":"`lassen` kann bedeuten, dass man eine Dienstleistung beauftragt oder jemandem etwas erlaubt. Es gibt noch weitere gängige Bedeutungen, die du an den Wörtern daneben erkennst.","steps":[{"text":"Drück eine Dienstleistung durch eine andere Person aus","why":"Die sprechende Person organisiert die Reparatur der Brille. Wer repariert, kann unbekannt bleiben. Setz konjugiertes `lassen` früh in den Hauptsatz und den Infinitiv `reparieren` ohne `zu` ans Ende."},{"text":"Drück Erlaubnis oder Verbot aus","why":"Wer spielt, ist die Gruppe im Akkusativ: `die Kinder`. Deutlich sieht man das mit dem Pronomen `sie` oder mit dem Maskulinum: `Sie lässt ihn spielen`. Die Verneinung verbietet im zweiten Beispiel die Handlung."},{"text":"Lerne die reflexive Struktur und das Vollverb kennen","why":"Die reflexive Struktur drückt Möglichkeit aus: `Das kann repariert werden`. Im Beispiel mit der Tasche bedeutet das Verb, dass ich sie hier zurücklasse – ohne weiteren Infinitiv."},{"text":"Konjugiere das Verb und unterscheide die Vergangenheit","why":"Bei `du` und `er/sie/es` ändert sich der Vokal. Im Präteritum sagst du `ich ließ`. Im Perfekt mit einem weiteren Infinitiv: `Ich habe das Rad reparieren lassen`; allein: `Ich habe die Tasche hier gelassen`."}],"explain":["Unterscheide die Dienstleistung von der eigenen Handlung: `Ich lasse mir die Haare schneiden` und `Ich schneide mir die Haare`. Im ersten Satz zeigt `mir`, wer von der Dienstleistung profitiert. Mit `Lass das!` fordert man jemanden auf, mit etwas aufzuhören. Brauchst du Klarheit, frag: Wer führt die Handlung im Infinitiv aus?"],"pitfall":"In dieser Bedeutung steht der Infinitiv nach `lassen` ohne `zu`.","recall":["Was bedeutet `Die Tür lässt sich öffnen`?","Man kann die Tür öffnen. `sich lassen + Infinitiv` drückt hier eine Möglichkeit aus."],"linkTitles":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Ersatzinfinitiv und Verbstellung · grammis"]}},"questions":[{"id":"lassen-1","type":"cloze","difficulty":1,"text":"Er {{1}} sein Rad reparieren.","blanks":[["lässt"]],"i18n":{"ar":{"prompt":"صرّف lassen مع er.","explain":"نقول er lässt ثم المصدر المجرد.","hints":["تتغيّر حركة a في المفرد الثالث."]},"de":{"prompt":"Konjugiere `lassen` mit `er`.","explain":"Wir sagen `er lässt` und dann den reinen Infinitiv.","hints":["In der 3. Person Singular ändert sich der Vokal `a`."]}}},{"id":"lassen-2","type":"cloze","difficulty":1,"text":"Ich lasse die Uhr {{1}}. (reparieren)","blanks":[["reparieren"]],"i18n":{"ar":{"prompt":"أكمل المصدر الذي يدل على خدمة إصلاح.","explain":"يأتي reparieren بلا zu.","hints":["lassen هنا فعل مصرف يتبعه مصدر."]},"de":{"prompt":"Ergänze den Infinitiv, der eine Reparatur als Dienstleistung ausdrückt.","explain":"`reparieren` steht ohne `zu`.","hints":["`lassen` ist hier konjugiert, danach folgt ein Infinitiv."]}}},{"id":"lassen-3","type":"mcq","difficulty":1,"answer":0,"i18n":{"ar":{"prompt":"من يصلح الأحذية في Ich lasse meine Schuhe reparieren؟","explain":"lassen هنا يفيد أن المتكلم يرتب إصلاح الحذاء لدى شخص آخر.","hints":["فرق بين ترتيب الخدمة وأداء الفعل."],"options":["شخص آخر يتولى الخدمة.","المتكلم يصلحها بيده.","الحذاء يقوم بالإصلاح بنفسه."]},"de":{"prompt":"Wer repariert die Schuhe in `Ich lasse meine Schuhe reparieren`?","explain":"`lassen` bedeutet hier, dass die sprechende Person die Reparatur bei jemand anderem beauftragt.","hints":["Unterscheide: eine Dienstleistung organisieren oder selbst handeln."],"options":["Eine andere Person übernimmt die Arbeit.","Die sprechende Person repariert sie selbst.","Der Schuh repariert sich selbst."]}}},{"id":"lassen-4","type":"cloze","difficulty":2,"text":"Ich habe den Wagen waschen {{1}}. · Ich habe die Tasche zu Hause {{2}}.","blanks":[["lassen"],["gelassen"]],"i18n":{"ar":{"prompt":"أكمل الماضي من lassen في حالتين.","explain":"مع waschen نستخدم المصدر البديل lassen. عند استعماله وحده بمعنى ترك نكتب gelassen.","hints":["هل يوجد مصدر آخر في الجملة؟"]},"de":{"prompt":"Ergänze die Vergangenheit von `lassen` in zwei Fällen.","explain":"Mit `waschen` benutzen wir den Ersatzinfinitiv `lassen`. Allein im Sinne von „zurücklassen“ schreiben wir `gelassen`.","hints":["Gibt es noch einen weiteren Infinitiv im Satz?"]}}},{"id":"lassen-5","type":"mcq","difficulty":2,"options":["Die Tür lässt sich öffnen.","Die Tür lässt mich öffnen.","Ich lasse die Tür offen."],"answer":0,"i18n":{"ar":{"prompt":"أي صيغة تعبّر عن إمكان الفتح؟","explain":"sich öffnen مع lassen يفيد الإمكان. mich يدل على شخص، وoffen تصف الباب متروكًا مفتوحًا.","hints":["ابحث عن ضمير انعكاسي مع lassen والمصدر."]},"de":{"prompt":"Welche Form drückt aus, dass man etwas öffnen kann?","explain":"`sich öffnen` mit `lassen` drückt eine Möglichkeit aus. `mich` verweist auf eine Person, `offen` beschreibt eine Tür, die offen gelassen wird.","hints":["Such ein Reflexivpronomen mit `lassen` und dem Infinitiv."]}}},{"id":"lassen-6","type":"order","difficulty":2,"items":["Heute","lasse","ich","mir","die Haare","schneiden."],"i18n":{"ar":{"prompt":"رتّب الجملة مع Heute أولًا. المتكلم هو من يطلب الخدمة لنفسه.","explain":"lasse يأتي بعد Heute، وmir يحدد المستفيد من خدمة القص.","hints":["بعد الظرف الأول يأتي الفعل المصرف، والمصدر يأتي في الآخر."]},"de":{"prompt":"Ordne den Satz mit `Heute` am Anfang. Die sprechende Person beauftragt die Dienstleistung für sich selbst.","explain":"`lasse` kommt nach `Heute`, und `mir` zeigt, wer vom Haareschneiden profitiert.","hints":["Nach dem ersten Adverb steht das konjugierte Verb, der Infinitiv kommt ans Ende."]}}},{"id":"lassen-7","type":"text","difficulty":3,"answer":"Sie lässt ihn hier nicht spielen.","i18n":{"ar":{"prompt":"اكتب «هي لا تسمح له باللعب هنا» باستعمال lassen وihn.","explain":"lässt مع المفرد الثالث. ihn هو الشخص الذي سيؤدي spielen، وهو مصدر بلا zu.","hints":["صرّف lassen مع Sie وضع فعل اللعب في الطرف الآخر."]},"de":{"prompt":"Schreib „Sie lässt ihn hier nicht spielen“ mit `lassen` und `ihn`.","explain":"`lässt` in der 3. Person Singular. `ihn` ist die Person, die spielen würde; `spielen` steht ohne `zu`.","hints":["Konjugiere `lassen` mit `Sie` und setz das Verb `spielen` ans andere Ende."]}}},{"id":"lassen-8","type":"text","difficulty":3,"answer":"Ich lasse mein Fahrrad reparieren.","context":"Ich lasse mein Fahrrad zu reparieren.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"في هذا الاستعمال يأتي المصدر بعد `lassen` بلا `zu`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"In dieser Bedeutung steht der Infinitiv nach `lassen` ohne `zu`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"lassen-9","type":"text","difficulty":2,"answer":"يمكن فتح الباب. تركيب `sich lassen + Infinitiv` هنا يعبر عن الإمكان.","i18n":{"ar":{"prompt":"ماذا تعني `Die Tür lässt sich öffnen`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Was bedeutet `Die Tür lässt sich öffnen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"passiv-perfekt","level":"B1.1","island":"passiv","order":1,"prereqs":[],"emoji":"🧰","german":"Passiv Perfekt","source":{"lektion":1,"kind":"toc"},"pattern":["sein","+","Partizip II","+","worden"],"frames":[{"k":"main","parts":[["vf","Das Fenster"],["v","ist"],["mf","(von der Firma)"],["ve","repariert worden"]]},{"k":"sub","parts":[["c","weil"],["mf","die Fenster"],["ve","repariert worden sind"]]}],"example":"Die Firma hat das Fenster repariert. → Das Fenster ist repariert worden.","stepExamples":["Die Firma hat das Fenster repariert.","Das Fenster ist …","Das Fenster ist repariert worden.","…, weil die Fenster repariert worden sind."],"pitfallPair":"Der Aufzug ist repariert geworden. → Der Aufzug ist repariert worden.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/systematische-grammatik/929","https://grammis.ids-mannheim.de/systematische-grammatik/1612"],"i18n":{"ar":{"title":"المبني للمجهول في الماضي","lead":"كيف تقول إن النافذة أُصلحت، حين تكون النتيجة أهم من اسم من أصلحها؟ نبدأ بالجملة المعلومة ثم ننقل التركيز إلى الشيء الذي وقع عليه الفعل.","translation":"أصلحت الشركة النافذة ← أُصلحت النافذة.","steps":[{"text":"حدّد المفعول المباشر","why":"اسأل عمّا أصلحته الشركة. الإجابة هي النافذة، وكانت مفعولًا في حالة `Akkusativ`. تصبح هي المسند إليه في صيغة المجهول."},{"text":"انقل المفعول إلى حالة الفاعل","why":"قد لا تظهر الحركة في المحايد. مع المذكر تراها بوضوح: `den Aufzug` يصبح `der Aufzug`. صرّف `sein` مع الاسم الجديد، فتقول `ist` للمفرد و`sind` للجمع."},{"text":"أغلق الجملة بصيغة الماضي للمجهول","why":"يبقى `repariert` اسم المفعول للفعل الأصلي، وتأتي بعده `worden` ثابتة. يمكنك إضافة `von der Firma` عند الحاجة إلى ذكر المنفّذ."},{"text":"أعد بناء الجملة التابعة","why":"في الجملة التابعة يأتي الفعل المصرف `sind` بعد `repariert worden`. لاحظ كيف تغير موقعه وبقي اتفاقه مع الجمع."}],"explain":["صف الفعل الذي حدث باستعمال `ist repariert worden`. إذا وصفت حالة النافذة الآن فقل `ist repariert`. واستعمل `wird repariert` حين تعرض الإجراء في الحاضر. تساعدك هذه المقارنة على تحديد ما إذا كنت تتكلم عن حدث مكتمل أو حالة أو إجراء جارٍ.","إذا عبّرت عن التحول بفعل `werden` نفسه فصيغة الماضي هي `ist geworden`، مثل `Es ist kalt geworden`. أما في هذا النوع من المجهول فالصيغة الخاصة هي `worden`. راجع أيضًا درس المجهول بلا فاعل لمعرفة ما يحدث عندما لا يوجد مفعول مباشر أصلاً."],"pitfall":"الجملة تصف إصلاحًا قام به أحدهم. الفعل `werden` هنا مساعد للمجهول، وصيغته `worden`.","recall":["لماذا نقول `sind` في `Die Türen sind geöffnet worden`؟","لأن `die Türen` جمع في حالة الفاعل بعد التحويل. عدد الأشخاص الذين فتحوا الأبواب لا يتحكم في التصريف."],"linkTitles":["فهرس قواعد الوحدة 1 · telc، ص 2","حلول الكتاب الرسمية · telc","أفعال المجهول · grammis","الصيغة worden · grammis"]},"de":{"title":"Passiv im Perfekt","lead":"Wie sagst du, dass das Fenster repariert wurde, wenn das Ergebnis wichtiger ist als die Person, die es repariert hat? Wir beginnen mit dem Aktivsatz und verschieben dann den Fokus auf die Sache, mit der etwas passiert.","steps":[{"text":"Finde das Akkusativobjekt","why":"Frag: Was hat die Firma repariert? Antwort: das Fenster. Es war das Objekt im `Akkusativ` – im Passiv wird es zum Subjekt."},{"text":"Setze das Objekt in den Nominativ","why":"Beim Neutrum sieht man die Änderung oft nicht, beim Maskulinum sehr deutlich: `den Aufzug` wird zu `der Aufzug`. Konjugiere `sein` passend zum neuen Subjekt: `ist` im Singular, `sind` im Plural."},{"text":"Schließe den Satz mit der Passiv-Perfekt-Form","why":"`repariert` bleibt das Partizip II des ursprünglichen Verbs, danach steht unverändert `worden`. Willst du den Täter nennen, ergänze `von der Firma`."},{"text":"Baue den Nebensatz","why":"Im Nebensatz steht das konjugierte Verb `sind` nach `repariert worden`. Die Position ändert sich, aber `sind` passt weiterhin zum Plural."}],"explain":["Mit `ist repariert worden` beschreibst du einen Vorgang, der passiert ist. Beschreibst du den jetzigen Zustand des Fensters, sagst du `ist repariert`. Und `wird repariert` zeigt den Vorgang in der Gegenwart. Dieser Vergleich hilft dir zu entscheiden, ob du über einen abgeschlossenen Vorgang, einen Zustand oder eine laufende Handlung sprichst.","Drückst du eine Veränderung mit dem Vollverb `werden` aus, heißt das Perfekt `ist geworden`, z. B. `Es ist kalt geworden`. Im Passiv lautet die besondere Form dagegen `worden`. Schau dir auch die Lektion zum subjektlosen Passiv an: Dort geht es um Sätze ganz ohne Akkusativobjekt."],"pitfall":"Der Satz beschreibt eine Reparatur, die jemand gemacht hat. `werden` ist hier ein Hilfsverb des Passivs – seine Perfektform lautet `worden`.","recall":["Warum sagt man `sind` in `Die Türen sind geöffnet worden`?","Weil `die Türen` nach der Umformung ein Plural im Nominativ ist. Wie viele Personen die Türen geöffnet haben, spielt für die Konjugation keine Rolle."],"linkTitles":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Passiv-Hilfsverben · grammis","Die Form worden · grammis"]}},"questions":[{"id":"passiv-perfekt-1","type":"cloze","difficulty":1,"text":"Der Balkon {{1}} gestrichen worden.","blanks":[["ist"]],"i18n":{"ar":{"prompt":"أكمل بـ sein المصرف.","explain":"الشرفة مفردة. تصريف sein معها هو ist.","hints":["عدّ الاسم في صدر الجملة."]},"de":{"prompt":"Ergänze die konjugierte Form von `sein`.","explain":"`Der Balkon` ist Singular. Die passende Form von `sein` ist `ist`.","hints":["Zähl das Nomen am Satzanfang."]}}},{"id":"passiv-perfekt-2","type":"cloze","difficulty":1,"text":"Die Fenster sind geputzt {{1}}.","blanks":[["worden"]],"i18n":{"ar":{"prompt":"أكمل صيغة الفعل المساعد للمجهول.","explain":"صيغة werden الخاصة في Passiv Perfekt هي worden.","hints":["الفعل الرئيسي قد أخذ صيغة Partizip II بالفعل."]},"de":{"prompt":"Ergänze die Form des Passiv-Hilfsverbs.","explain":"Die besondere Form von `werden` im Passiv Perfekt ist `worden`.","hints":["Das Hauptverb steht schon im Partizip II."]}}},{"id":"passiv-perfekt-3","type":"mcq","difficulty":1,"options":["Die Bestellung ist storniert worden.","Die Bestellung wird storniert.","Die Bestellung ist storniert."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تخبرنا بأن الطلب أُلغي بالفعل؟","explain":"wird storniert إجراء في الحاضر. ist storniert تصف الحالة. ist storniert worden تعرض الحدث المكتمل.","hints":["ابحث عن أثرين للماضي المركب للمجهول."]},"de":{"prompt":"Welcher Satz sagt, dass die Bestellung schon storniert wurde?","explain":"`wird storniert` ist ein Vorgang in der Gegenwart. `ist storniert` beschreibt den Zustand. `ist storniert worden` zeigt den abgeschlossenen Vorgang.","hints":["Such nach zwei Merkmalen des Passiv Perfekt."]}}},{"id":"passiv-perfekt-4","type":"cloze","difficulty":2,"text":"Der Aufzug {{1}} {{2}} {{3}}.","blanks":[["ist"],["geprüft"],["worden"]],"i18n":{"ar":{"prompt":"حوّل الفعل المعلوم إلى مجهول. Man hat den Aufzug geprüft.","explain":"المصعد مفرد في الرفع، فتستعمل ist. يبقى geprüft ثم تأتي worden.","hints":["حوّل المفعول إلى الرفع ثم اختر sein."]},"de":{"prompt":"Forme den Aktivsatz ins Passiv um: `Man hat den Aufzug geprüft.`","explain":"`Der Aufzug` ist Singular im Nominativ, also `ist`. `geprüft` bleibt, danach kommt `worden`.","hints":["Setz das Objekt in den Nominativ und wähl dann die Form von `sein`."]}}},{"id":"passiv-perfekt-5","type":"order","difficulty":2,"items":["weil","die Lampen","ausgetauscht","worden","sind"],"i18n":{"ar":{"prompt":"رتّب الجملة التابعة. اجعل weil أولًا والفاعل بعده.","explain":"يأتي sind بعد ausgetauscht worden في ترتيب الجملة التابعة.","hints":["ابحث عن الفعل المصرف وضعه في الآخر."]},"de":{"prompt":"Ordne den Nebensatz. Setz `weil` an den Anfang und danach das Subjekt.","explain":"Im Nebensatz steht `sind` nach `ausgetauscht worden`.","hints":["Such das konjugierte Verb und stell es ans Ende."]}}},{"id":"passiv-perfekt-6","type":"mcq","difficulty":2,"options":["Es ist kälter geworden.","Es ist kälter worden.","Es ist kälter gemacht worden."],"answer":0,"i18n":{"ar":{"prompt":"اختر العبارة التي تدل على تغيّر الطقس.","explain":"مع التحوّل الذاتي نستعمل geworden. كلمة worden تخص المجهول، وgemacht worden تصف جعل الشيء أبرد.","hints":["هل werden هنا فعل التحوّل أم مساعد مجهول؟"]},"de":{"prompt":"Wähle den Satz, der eine Wetteränderung ausdrückt.","explain":"Bei einer Veränderung von selbst benutzt man `geworden`. `worden` gehört zum Passiv, und `gemacht worden` bedeutet, dass jemand etwas kälter gemacht hat.","hints":["Ist `werden` hier ein Vollverb der Veränderung oder ein Passiv-Hilfsverb?"]}}},{"id":"passiv-perfekt-7","type":"text","difficulty":3,"answer":"Die Aufzüge sind von der Hausverwaltung repariert worden.","i18n":{"ar":{"prompt":"حوّل Die Hausverwaltung hat die Aufzüge repariert إلى Passiv Perfekt واذكر المنفّذ.","explain":"die Aufzüge جمع، لذا اختر sind. أدخل von der Hausverwaltung بين الفعل المصرف ونهاية الجملة.","hints":["ابدأ بالمصاعد. استخدم von مع الداتيف لذكر الجهة المنفذة."]},"de":{"prompt":"Forme `Die Hausverwaltung hat die Aufzüge repariert` ins Passiv Perfekt um und nenne den Täter.","explain":"`die Aufzüge` ist Plural, also `sind`. Setz `von der Hausverwaltung` zwischen das konjugierte Verb und das Satzende.","hints":["Beginne mit den Aufzügen. Nenne die Verwaltung mit `von` + Dativ."]}}},{"id":"passiv-perfekt-8","type":"text","difficulty":3,"answer":"Der Aufzug ist repariert worden.","context":"Der Aufzug ist repariert geworden.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الجملة تصف إصلاحًا قام به أحدهم. الفعل `werden` هنا مساعد للمجهول، وصيغته `worden`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Satz beschreibt eine Reparatur, die jemand gemacht hat. `werden` ist hier ein Hilfsverb des Passivs – seine Perfektform lautet `worden`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"passiv-perfekt-9","type":"text","difficulty":2,"answer":"لأن `die Türen` جمع في حالة الفاعل بعد التحويل. عدد الأشخاص الذين فتحوا الأبواب لا يتحكم في التصريف.","i18n":{"ar":{"prompt":"لماذا نقول `sind` في `Die Türen sind geöffnet worden`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Warum sagt man `sind` in `Die Türen sind geöffnet worden`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"passiv-modal","level":"B1.1","island":"passiv","order":2,"prereqs":[],"emoji":"🛠️","german":"Passiv mit Modalverben","source":{"lektion":5,"kind":"toc"},"pattern":["Modalverb","…","Partizip II","+","werden"],"frames":[{"k":"main","parts":[["vf","Die Zutaten"],["v","müssen"],["ve","geprüft werden"]]},{"k":"sub","parts":[["c","weil"],["mf","die Zutaten"],["ve","geprüft werden müssen"]]}],"example":"Man muss die Zutaten prüfen. → Die Zutaten müssen geprüft werden.","stepExamples":["die Zutaten → Die Zutaten","Die Zutaten müssen …","Die Zutaten müssen geprüft werden.","…, weil die Zutaten geprüft werden müssen. · Die Zutaten mussten geprüft werden."],"pitfallPair":"Die Zutaten werden geprüft müssen. → Die Zutaten müssen geprüft werden.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/systematische-grammatik/929"],"i18n":{"ar":{"title":"المبني للمجهول مع فعل ناقص","lead":"في تعليمات أو قواعد الصحة، كثيرًا ما يهمك ما يجب فعله أو ما يُسمح به. يحتفظ المجهول بالتركيز على الشيء، ويضيف الفعل الناقص معنى الوجوب أو السماح أو الإمكان.","translation":"يجب فحص المكوّنات.","steps":[{"text":"ارفع المفعول المباشر","why":"تصبح المكوّنات مسندًا إليه في المجهول. كانت في الأكوزاتيف مع `prüfen` وصارت في الرفع. لا يظهر الفرق في أداة الجمع."},{"text":"صرّف الفعل الناقص مع المسند إليه","why":"كان `muss` يوافق `man`. أصبح `müssen` يوافق جمع `die Zutaten`. عند الحديث عن مكوّن واحد تقول `Die Zutat muss …`."},{"text":"ضع Partizip II ثم المصدر werden","why":"فعل `prüfen` يعطي `geprüft`. يأتي بعده `werden` مصدرًا لأن الفعل الناقص هو المصرف. تنطبق البنية مع `können` و`dürfen` و`sollen`."},{"text":"غيّر ترتيب التابع والزمن","why":"في الجملة التابعة يأتي `müssen` في النهاية بعد `geprüft werden`. وفي الماضي البسيط يُصرّف الفعل الناقص `mussten` ويبقى الطرف الأخير كما هو."}],"explain":["قارن `Die Zutaten werden geprüft` حيث نصف الإجراء، و`Die Zutaten müssen geprüft werden` حيث نضيف الوجوب، و`Die Zutaten sind geprüft worden` حيث نخبر عن فعل اكتمل. `Das darf nicht verkauft werden` يفيد المنع، و`Das muss nicht verkauft werden` يفيد أن البيع غير مطلوب."],"pitfall":"في الرئيسية ضع الفعل الناقص المصرف في الموقع الثاني. تتكوّن النهاية من `geprüft werden`.","recall":["كيف تقول إن تناول الدواء مسموح؟","`Das Medikament darf eingenommen werden.` استعمل `darf` للسماح، ثم `eingenommen werden`."],"linkTitles":["فهرس قواعد الوحدة 5 · telc، ص 3","حلول الكتاب الرسمية · telc","أفعال المجهول · grammis"]},"de":{"title":"Passiv mit Modalverben","lead":"In Anleitungen oder Gesundheitsregeln geht es oft darum, was getan werden muss oder darf. Das Passiv hält den Fokus auf der Sache, das Modalverb ergänzt Pflicht, Erlaubnis oder Möglichkeit.","steps":[{"text":"Mach das Akkusativobjekt zum Subjekt","why":"Die Zutaten werden im Passiv zum Subjekt. Mit `prüfen` standen sie im Akkusativ, jetzt im Nominativ. Am Pluralartikel sieht man den Unterschied nicht."},{"text":"Konjugiere das Modalverb passend zum Subjekt","why":"`muss` passte zu `man`. Jetzt passt `müssen` zum Plural `die Zutaten`. Bei einer einzigen Zutat sagst du `Die Zutat muss …`."},{"text":"Setz Partizip II und dann den Infinitiv werden","why":"`prüfen` ergibt `geprüft`. Danach steht `werden` im Infinitiv, weil das Modalverb konjugiert ist. Die Struktur funktioniert auch mit `können`, `dürfen` und `sollen`."},{"text":"Ändere Nebensatz und Zeit","why":"Im Nebensatz steht `müssen` am Ende nach `geprüft werden`. Im Präteritum wird das Modalverb zu `mussten`, der Rest bleibt gleich."}],"explain":["Vergleiche: `Die Zutaten werden geprüft` beschreibt den Vorgang, `Die Zutaten müssen geprüft werden` ergänzt die Pflicht, `Die Zutaten sind geprüft worden` berichtet über einen abgeschlossenen Vorgang. `Das darf nicht verkauft werden` ist ein Verbot, `Das muss nicht verkauft werden` heißt, dass der Verkauf nicht nötig ist."],"pitfall":"Im Hauptsatz steht das konjugierte Modalverb auf Position 2. Am Ende steht `geprüft werden`.","recall":["Wie sagst du, dass man das Medikament einnehmen darf?","`Das Medikament darf eingenommen werden.` `darf` für die Erlaubnis, dann `eingenommen werden`."],"linkTitles":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Passiv-Hilfsverben · grammis"]}},"questions":[{"id":"passiv-modal-1","type":"cloze","difficulty":1,"text":"Die Regeln {{1}} erklärt werden.","blanks":[["müssen"]],"i18n":{"ar":{"prompt":"أكمل الفعل الناقص müssen في الحاضر.","explain":"Die Regeln جمع، فالتصريف müssen.","hints":["طابق الفعل مع جمع القواعد."]},"de":{"prompt":"Ergänze das Modalverb `müssen` im Präsens.","explain":"`Die Regeln` ist Plural, also `müssen`.","hints":["Passe das Verb an den Plural `Regeln` an."]}}},{"id":"passiv-modal-2","type":"cloze","difficulty":1,"text":"Der Tisch kann repariert {{1}}.","blanks":[["werden"]],"i18n":{"ar":{"prompt":"أكمل مصدر المجهول.","explain":"بعد repariert يأتي مصدر المجهول werden.","hints":["الفعل الناقص هو المصرف بالفعل."]},"de":{"prompt":"Ergänze den Passiv-Infinitiv.","explain":"Nach `repariert` kommt der Passiv-Infinitiv `werden`.","hints":["Das Modalverb ist schon konjugiert."]}}},{"id":"passiv-modal-3","type":"mcq","difficulty":1,"options":["Das darf nicht verkauft werden.","Das muss nicht verkauft werden.","Das kann verkauft werden."],"answer":0,"i18n":{"ar":{"prompt":"أي صيغة تمنع البيع؟","explain":"darf nicht يفيد المنع. muss nicht ينفي الوجوب. kann يفيد الإمكان.","hints":["المنع يخص السماح بالفعل."]},"de":{"prompt":"Welche Form verbietet den Verkauf?","explain":"`darf nicht` drückt ein Verbot aus. `muss nicht` verneint die Pflicht. `kann` drückt eine Möglichkeit aus.","hints":["Ein Verbot betrifft die Erlaubnis."]}}},{"id":"passiv-modal-4","type":"cloze","difficulty":2,"text":"Der Antrag {{1}} {{2}} {{3}}.","blanks":[["muss"],["geprüft"],["werden"]],"i18n":{"ar":{"prompt":"حوّل Man muss den Antrag prüfen مع الحفاظ على المعنى.","explain":"الطلب مفرد فيأخذ muss. الجزء الأخير geprüft werden.","hints":["انقل الطلب إلى الرفع ثم ابنِ القوس الفعلي."]},"de":{"prompt":"Forme `Man muss den Antrag prüfen` um und behalte die Bedeutung.","explain":"Der Antrag ist Singular, also `muss`. Am Ende steht `geprüft werden`.","hints":["Setz den Antrag in den Nominativ und bau dann die Verbklammer."]}}},{"id":"passiv-modal-5","type":"order","difficulty":2,"items":["weil","die Medikamente","richtig","gelagert","werden","müssen"],"i18n":{"ar":{"prompt":"رتّب التابعة وأبقِ الفاعل بعد weil.","explain":"يأتي müssen بعد gelagert werden. ظرف الكيفية richtig يسبق هذه المجموعة.","hints":["ينتهي التابع بالفعل الناقص المصرف."]},"de":{"prompt":"Ordne den Nebensatz und lass das Subjekt nach `weil` stehen.","explain":"`müssen` steht nach `gelagert werden`. Das Adverb `richtig` steht vor dieser Gruppe.","hints":["Der Nebensatz endet mit dem konjugierten Modalverb."]}}},{"id":"passiv-modal-6","type":"mcq","difficulty":2,"options":["Die Ware musste geprüft werden.","Die Ware muss geprüft werden.","Die Ware ist geprüft worden."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تعبّر عن وجوب ماضٍ؟","explain":"musste صيغة Präteritum. muss للحاضر وist geprüft worden يذكر الإجراء المكتمل بلا وجوب.","hints":["انظر إلى زمن الفعل الناقص."]},"de":{"prompt":"Welcher Satz drückt eine Pflicht in der Vergangenheit aus?","explain":"`musste` ist Präteritum. `muss` ist Präsens, und `ist geprüft worden` nennt den abgeschlossenen Vorgang ohne Pflicht.","hints":["Schau auf die Zeitform des Modalverbs."]}}},{"id":"passiv-modal-7","type":"text","difficulty":3,"answer":"Die Formulare können online ausgefüllt werden.","i18n":{"ar":{"prompt":"حوّل Man kann die Formulare online ausfüllen إلى المجهول وابدأ بـ Die Formulare.","explain":"استعمل können مع الجمع ثم ausgefüllt werden. ظرف online يبقى قبل نهاية الأفعال.","hints":["انتبه إلى جمع Formulare وإلى صيغة ausfüllen في Partizip II."]},"de":{"prompt":"Forme `Man kann die Formulare online ausfüllen` ins Passiv um und beginne mit `Die Formulare`.","explain":"Benutze `können` mit dem Plural, dann `ausgefüllt werden`. `online` steht vor den Verben am Ende.","hints":["Achte auf den Plural `Formulare` und auf das Partizip II von `ausfüllen`."]}}},{"id":"passiv-modal-8","type":"text","difficulty":3,"answer":"Die Zutaten müssen geprüft werden.","context":"Die Zutaten werden geprüft müssen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"في الرئيسية ضع الفعل الناقص المصرف في الموقع الثاني. تتكوّن النهاية من `geprüft werden`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Im Hauptsatz steht das konjugierte Modalverb auf Position 2. Am Ende steht `geprüft werden`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"passiv-modal-9","type":"text","difficulty":2,"answer":"`Das Medikament darf eingenommen werden.` استعمل `darf` للسماح، ثم `eingenommen werden`.","i18n":{"ar":{"prompt":"كيف تقول إن تناول الدواء مسموح؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wie sagst du, dass man das Medikament einnehmen darf?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"subjektlos","level":"B1.1","island":"passiv","order":3,"prereqs":[],"emoji":"🎶","german":"Subjektloses Passiv","source":{"lektion":6,"kind":"toc"},"pattern":["(Es / Adverb)","+","wird","…","Partizip II"],"frames":[{"k":"main","parts":[["vf","Hier"],["v","wird"],["ve","getanzt"]]},{"k":"main","parts":[["vf","Den Gästen"],["v","wird"],["ve","geholfen"]]}],"example":"Hier tanzt man. → Hier wird getanzt.","stepExamples":["Man tanzt hier.","Hier wird getanzt.","Es wird hier getanzt. · Heute wird hier getanzt.","Man hilft den Gästen. → Den Gästen wird geholfen."],"pitfallPair":"Den Kindern werden geholfen. → Den Kindern wird geholfen.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/systematische-grammatik/929","https://grammis.ids-mannheim.de/systematische-grammatik/1068"],"i18n":{"ar":{"title":"المبني للمجهول بلا فاعل نحوي","lead":"أحيانًا نريد وصف نشاط عام مثل العمل أو الرقص من دون ذكر من يقوم به. عندما لا يوجد مفعول مباشر قابل للتحويل، قد نحصل على مجهول من دون مسند إليه.","translation":"يرقص الناس هنا ← يجري الرقص هنا.","steps":[{"text":"افحص الجملة الأصلية","why":"يوجد فاعل عام هو `man` وظرف مكان هو `hier`. لا يوجد مفعول مباشر يصبح فاعلًا نحويًا. هذا النوع ممكن مع أنشطة مثل `tanzen` و`arbeiten`."},{"text":"احذف الفاعل العام واستعمل المفرد","why":"عند عدم وجود مسند إليه صرّف `werden` بصيغة الغائب المفرد. وأبقِ الظرف ثم ضع اسم المفعول في النهاية."},{"text":"املأ الموقع الأول بـ es إذا لم تقدّم شيئًا آخر","why":"تملأ `es` صدر الرئيسية. تختفي عندما يتصدر `heute` أو `hier`. وفي `…, weil hier getanzt wird` لا تحتاج إليها أيضًا."},{"text":"أبقِ مفعول الداتيف إن وجد","why":"الضيوف في الداتيف لأن `helfen` يطلبه. حتى مع جمع `den Gästen` يبقى الفعل `wird` مفردًا. قارن `Die Gäste werden begrüßt` حيث صار المفعول المباشر فاعلًا نحويًا."}],"explain":["ليست كل الأفعال بلا مفعول مباشر صالحة لهذا التحويل. تدرب أولًا على الأفعال التي تصف نشاطًا يؤديه أحد مثل `arbeiten` و`lachen`، ومع أفعال مثل `helfen`. ويمكن وصف نشاط مكتمل بـ `Gestern ist hier getanzt worden`، أو ضرورة بـ `Hier muss gearbeitet werden`. تبقى صيغة الغائب المفرد في الحالتين."],"pitfall":"تبقى `den Kindern` في الداتيف، فلا تُصرّف الفعل معها كجمع.","recall":["هل تبقى `es` في `Heute wird gearbeitet`؟","لا حاجة إليها. يشغل `Heute` الموقع الأول في الرئيسية بالفعل."],"linkTitles":["فهرس قواعد الوحدة 6 · telc، ص 3","حلول الكتاب الرسمية · telc","أفعال المجهول · grammis","المجهول دون فاعل نحوي · grammis"]},"de":{"title":"Subjektloses Passiv","lead":"Manchmal wollen wir eine allgemeine Tätigkeit wie Arbeiten oder Tanzen beschreiben, ohne zu sagen, wer sie macht. Gibt es kein Akkusativobjekt, das man umformen kann, entsteht ein Passiv ohne Subjekt.","steps":[{"text":"Prüfe den Ausgangssatz","why":"Es gibt ein allgemeines Subjekt `man` und eine Ortsangabe `hier`. Es gibt kein Akkusativobjekt, das Subjekt werden könnte. Das geht mit Tätigkeiten wie `tanzen` und `arbeiten`."},{"text":"Lass das allgemeine Subjekt weg und benutze den Singular","why":"Gibt es kein Subjekt, konjugierst du `werden` in der 3. Person Singular. Behalte das Adverb und setz das Partizip II ans Ende."},{"text":"Füll Position 1 mit es, wenn sonst nichts vorne steht","why":"`es` füllt die erste Position im Hauptsatz. Es verschwindet, wenn `heute` oder `hier` vorne steht. Auch in `…, weil hier getanzt wird` brauchst du es nicht."},{"text":"Behalte ein Dativobjekt, wenn es eines gibt","why":"Die Gäste stehen im Dativ, weil `helfen` den Dativ verlangt. Auch mit dem Plural `den Gästen` bleibt `wird` im Singular. Vergleiche `Die Gäste werden begrüßt`: Hier ist das Akkusativobjekt zum Subjekt geworden."}],"explain":["Nicht jedes Verb ohne Akkusativobjekt eignet sich für diese Umformung. Üb zuerst mit Verben, die eine Tätigkeit von Menschen beschreiben, wie `arbeiten` und `lachen`, und mit Verben wie `helfen`. Eine abgeschlossene Tätigkeit beschreibst du mit `Gestern ist hier getanzt worden`, eine Notwendigkeit mit `Hier muss gearbeitet werden`. In beiden Fällen bleibt die 3. Person Singular."],"pitfall":"`den Kindern` bleibt im Dativ – konjugiere das Verb deshalb nicht im Plural.","recall":["Bleibt `es` in `Heute wird gearbeitet`?","Nein. `Heute` besetzt schon Position 1 im Hauptsatz."],"linkTitles":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Passiv-Hilfsverben · grammis","Subjektloses Passiv · grammis"]}},"questions":[{"id":"subjektlos-1","type":"cloze","difficulty":1,"text":"Heute {{1}} hier gearbeitet.","blanks":[["wird"]],"i18n":{"ar":{"prompt":"صرّف werden للمجهول بلا فاعل.","explain":"لا يوجد فاعل نحوي في الجملة، فتبقى الصيغة مفرد الغائب wird.","hints":["هل يوجد مسند إليه يتحكم في العدد؟"]},"de":{"prompt":"Konjugiere `werden` für das subjektlose Passiv.","explain":"Im Satz gibt es kein Subjekt, deshalb bleibt die 3. Person Singular `wird`.","hints":["Gibt es ein Subjekt, das den Numerus bestimmt?"]}}},{"id":"subjektlos-2","type":"cloze","difficulty":1,"text":"{{1}} wird im Saal getanzt.","blanks":[["Es"]],"i18n":{"ar":{"prompt":"أكمل العبارة المبدوءة من دون ظرف أول.","explain":"Es هنا تملأ الموضع الأول. ويمكن تقديم im Saal وحذفها.","hints":["املأ موقع الصدارة في الرئيسية."]},"de":{"prompt":"Ergänze den Satz, der ohne Adverb am Anfang beginnt.","explain":"`Es` füllt hier Position 1. Stellst du `im Saal` nach vorn, fällt es weg.","hints":["Füll die erste Position im Hauptsatz."]}}},{"id":"subjektlos-3","type":"mcq","difficulty":1,"options":["Hier wird getanzt.","Die Gäste werden begrüßt.","Der Saal wird geöffnet."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة مجهول بلا فاعل نحوي؟","explain":"مع getanzt لا توجد مجموعة رفع. Gäste وSaal مسندان إليهما في الجملتين الأخريين.","hints":["هل توجد مجموعة في الرفع تتوافق مع werden؟"]},"de":{"prompt":"Welcher Satz ist ein Passiv ohne Subjekt?","explain":"Bei `getanzt` gibt es keine Gruppe im Nominativ. In den anderen beiden Sätzen sind `Gäste` und `Saal` Subjekte.","hints":["Gibt es eine Nominativgruppe, zu der `werden` passt?"]}}},{"id":"subjektlos-4","type":"cloze","difficulty":2,"text":"Den Kindern {{1}} {{2}}.","blanks":[["wird"],["geholfen"]],"i18n":{"ar":{"prompt":"حوّل Man hilft den Kindern إلى مجهول يبدأ بالداتيف.","explain":"Den Kindern لا تصبح فاعلًا، لذلك يبقى wird مفردًا ثم geholfen.","hints":["helfen يطلب الداتيف حتى بعد التحويل."]},"de":{"prompt":"Forme `Man hilft den Kindern` in ein Passiv um, das mit dem Dativ beginnt.","explain":"`Den Kindern` wird nicht zum Subjekt, deshalb bleibt `wird` im Singular, dann `geholfen`.","hints":["`helfen` verlangt auch nach der Umformung den Dativ."]}}},{"id":"subjektlos-5","type":"order","difficulty":2,"items":["weil","hier","leise","gearbeitet","wird"],"i18n":{"ar":{"prompt":"رتّب التابعة بلا فاعل. ضع hier قبل leise.","explain":"الترتيب هو Partizip II ثم wird في التابعة. لا تحتاج إلى es.","hints":["الفعل المصرف في الآخر. الصدارة مشغولة بـ weil."]},"de":{"prompt":"Ordne den Nebensatz ohne Subjekt. Setz `hier` vor `leise`.","explain":"Im Nebensatz steht zuerst das Partizip II, dann `wird`. Du brauchst kein `es`.","hints":["Das konjugierte Verb steht am Ende. Position 1 ist durch `weil` besetzt."]}}},{"id":"subjektlos-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"لماذا لا نكتب werden في Den Gästen wird geholfen؟","explain":"Den Gästen جمع في الداتيف، لكنه لا يتحكم في التصريف. غياب المسند إليه يقتضي wird.","hints":["انظر إلى حالة الضيوف."],"options":["لأن الضيوف في الداتيف وليسوا مسندًا إليه في الرفع.","لأن كلمة Gästen في المفرد.","لأن helfen يُصرّف دائمًا في المفرد مهما كان الفاعل."]},"de":{"prompt":"Warum schreiben wir in `Den Gästen wird geholfen` nicht `werden`?","explain":"`Den Gästen` ist Plural im Dativ, bestimmt aber nicht die Konjugation. Ohne Subjekt steht `wird`.","hints":["Schau auf den Kasus der Gäste."],"options":["Weil die Gäste im Dativ stehen und nicht Subjekt im Nominativ sind.","Weil `Gästen` Singular ist.","Weil `helfen` immer im Singular konjugiert wird, egal welches Subjekt."]}}},{"id":"subjektlos-7","type":"text","difficulty":3,"answer":"Hier muss leise gesprochen werden.","i18n":{"ar":{"prompt":"حوّل Man muss hier leise sprechen إلى مجهول بلا فاعل يبدأ بـ Hier.","explain":"muss في الموقع الثاني. في النهاية gesprochen werden. لا تحتاج إلى es مع Hier.","hints":["احتفظ بمعنى الوجوب وصرّف الفعل الناقص بالمفرد."]},"de":{"prompt":"Forme `Man muss hier leise sprechen` in ein subjektloses Passiv um, das mit `Hier` beginnt.","explain":"`muss` steht auf Position 2, am Ende `gesprochen werden`. Mit `Hier` vorne brauchst du kein `es`.","hints":["Behalte die Bedeutung der Pflicht und konjugiere das Modalverb im Singular."]}}},{"id":"subjektlos-8","type":"text","difficulty":3,"answer":"Den Kindern wird geholfen.","context":"Den Kindern werden geholfen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"تبقى `den Kindern` في الداتيف، فلا تُصرّف الفعل معها كجمع.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`den Kindern` bleibt im Dativ – konjugiere das Verb deshalb nicht im Plural.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"subjektlos-9","type":"text","difficulty":2,"answer":"لا حاجة إليها. يشغل `Heute` الموقع الأول في الرئيسية بالفعل.","i18n":{"ar":{"prompt":"هل تبقى `es` في `Heute wird gearbeitet`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Bleibt `es` in `Heute wird gearbeitet`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"erststellen-es","level":"B1.2","island":"passiv","order":4,"prereqs":["subjektlos"],"emoji":"🪑","german":"Das Erststellen-es","source":{"lektion":11,"kind":"toc"},"pattern":["Es","+","Verb","+","Subjekt","…"],"frames":[{"k":"main","parts":[["hl","Es"],["v","kamen"],["mf","viele Gäste"]]},{"k":"main","parts":[["vf","Viele Gäste"],["v","kamen"]]},{"k":"main","parts":[["vf","Gestern"],["v","wurde"],["mf","viel"],["ve","gelacht"]]}],"example":"Es kamen viele Gäste. → Viele Gäste kamen.","stepExamples":["Viele Gäste kamen zur Feier.","Es kamen viele Gäste zur Feier.","Es wurde viel gelacht.","Gestern wurde viel gelacht.","Es ist ein Unfall passiert. → Ist ein Unfall passiert?"],"pitfallPair":"Gestern wurde es viel gelacht. → Gestern wurde viel gelacht.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/395","https://grammis.ids-mannheim.de/terminologie/1206"],"i18n":{"ar":{"title":"es يملأ الموقع الأول","lead":"أحيانًا تبدأ الجملة الألمانية بـ `es` دون أن تعني شيئًا. وظيفتها الوحيدة أن تملأ الموقع الأول حتى يأتي الفاعل الحقيقي متأخرًا، كما في بدايات الأخبار والحكايات. ستتعلم متى تبقى `es` ومتى تختفي.","translation":"جاء ضيوف كثيرون.","steps":[{"text":"ابدأ بجملة عادية","why":"الفاعل `viele Gäste` في الموقع الأول، والفعل `kamen` في الموقع الثاني."},{"text":"ضع es في الموقع الأول وأخّر الفاعل","why":"`Es kamen viele Gäste`: صار الفاعل بعد الفعل، فيبدو كمعلومة جديدة. و`es` لا معنى لها هنا، والفعل `kamen` بالجمع لأنه يتفق مع `Gäste` لا مع `es`."},{"text":"تكثر es في المجهول بلا فاعل","why":"في `Es wurde viel gelacht` لا يوجد فاعل نحوي، فتملأ `es` الموقع الأول فقط."},{"text":"إذا وقف شيء آخر في الموقع الأول تختفي es","why":"`Gestern wurde viel gelacht`: الكلمة `gestern` تملأ الموقع الأول، فلم يبقَ لـ `es` مكان."},{"text":"في السؤال والجملة التابعة تختفي es أيضًا","why":"في السؤال يبدأ الفعل: `Ist ein Unfall passiert?`. وفي الجملة التابعة: `…, dass ein Unfall passiert ist.` لا توجد `es` لأنه لا يوجد موقع أول يجب ملؤه."}],"explain":["هذه `es` غير `es` في `Es regnet` و`Es gibt`. هناك تبقى `es` في كل ترتيب: `Heute regnet es` و`Gibt es Kaffee?`. أما `es` الموقع الأول فتختفي فور تغيّر الترتيب.","الاختبار السهل: ضع كلمة أخرى في البداية. إذا اختفت `es` فهي `es` الموقع الأول، وإذا بقيت فهي فاعل شكلي ثابت."],"pitfall":"حين تقف `gestern` في الموقع الأول لم يبقَ لـ `es` مكان، فتُحذف.","recall":["لماذا نقول `Es warten drei Leute` وليس `Es wartet drei Leute`؟","لأن الفعل يتفق مع الفاعل الحقيقي `drei Leute`، وهو جمع، لا مع `es`."],"linkTitles":["الكلمة es واستعمالاتها · grammis","الكلمة الشكلية · grammis"],"table":[["نوع es","مثال","بعد تغيير الترتيب"],["es في الموقع الأول","Es kamen viele Gäste.","Gestern kamen viele Gäste."],["المجهول بلا فاعل","Es wird hier gearbeitet.","Hier wird gearbeitet."],["فاعل شكلي ثابت","Es regnet.","Heute regnet es."],["es gibt","Es gibt Kaffee.","Gibt es Kaffee?"]]},"de":{"title":"Das Erststellen-es (Vorfeld-es)","lead":"Manchmal beginnt ein deutscher Satz mit `es`, das nichts bedeutet. Es füllt nur die erste Position, damit das eigentliche Subjekt später kommen kann – typisch für Nachrichten und Erzählungen. Du lernst, wann `es` bleibt und wann es verschwindet.","steps":[{"text":"Beginne mit einem normalen Satz","why":"Das Subjekt `viele Gäste` steht auf Position 1, das Verb `kamen` auf Position 2."},{"text":"Setz es auf Position 1 und stell das Subjekt nach hinten","why":"`Es kamen viele Gäste`: Das Subjekt steht jetzt nach dem Verb und wirkt wie eine neue Information. `es` bedeutet nichts. `kamen` steht im Plural, weil es zu `Gäste` passt, nicht zu `es`."},{"text":"Häufig im subjektlosen Passiv","why":"In `Es wurde viel gelacht` gibt es kein Subjekt. `es` füllt nur Position 1."},{"text":"Steht etwas anderes vorn, fällt es weg","why":"`Gestern wurde viel gelacht`: `gestern` besetzt Position 1, für `es` ist kein Platz mehr."},{"text":"Auch in Fragen und Nebensätzen fällt es weg","why":"In der Frage steht das Verb vorn: `Ist ein Unfall passiert?`. Im Nebensatz: `…, dass ein Unfall passiert ist.` Es gibt keine Position 1 zu füllen."}],"explain":["Dieses `es` ist ein anderes als in `Es regnet` oder `Es gibt`. Dort bleibt `es` in jeder Stellung: `Heute regnet es`, `Gibt es Kaffee?`. Das Vorfeld-es verschwindet, sobald sich die Wortstellung ändert.","Der einfache Test: Stell ein anderes Satzglied an den Anfang. Fällt `es` weg, ist es ein Vorfeld-es. Bleibt es, ist es ein festes formales Subjekt."],"pitfall":"Steht `gestern` auf Position 1, ist für `es` kein Platz mehr. Es fällt weg.","recall":["Warum heißt es `Es warten drei Leute` und nicht `Es wartet drei Leute`?","Das Verb richtet sich nach dem eigentlichen Subjekt `drei Leute` (Plural), nicht nach `es`."],"linkTitles":["Die Form es und ihre Verwendungen · grammis","Expletivum · grammis"],"table":[["Art von es","Beispiel","nach Umstellung"],["Vorfeld-es","Es kamen viele Gäste.","Gestern kamen viele Gäste."],["subjektloses Passiv","Es wird hier gearbeitet.","Hier wird gearbeitet."],["festes formales Subjekt","Es regnet.","Heute regnet es."],["es gibt","Es gibt Kaffee.","Gibt es Kaffee?"]]}},"questions":[{"id":"erststellen-es-1","type":"cloze","difficulty":1,"text":"{{1}} haben sich zwanzig Personen für den Kurs angemeldet.","blanks":[["Es"]],"i18n":{"ar":{"prompt":"أكمل الموقع الأول بالكلمة المناسبة.","explain":"الفاعل `zwanzig Personen` جاء بعد الفعل، فتملأ `Es` الموقع الأول.","hints":["الكلمة لا معنى لها هنا."]},"de":{"prompt":"Füll die erste Position.","explain":"Das Subjekt `zwanzig Personen` steht nach dem Verb, deshalb füllt `Es` Position 1.","hints":["Das Wort hat hier keine Bedeutung."]}}},{"id":"erststellen-es-2","type":"cloze","difficulty":1,"text":"Es {{1}} heute zwei Pakete für dich gekommen.","blanks":[["sind"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد `sein`.","explain":"الفعل يتفق مع الفاعل الحقيقي `zwei Pakete`، وهو جمع: `sind`.","hints":["مع ماذا يتفق الفعل؟"]},"de":{"prompt":"Ergänze das Hilfsverb `sein`.","explain":"Das Verb richtet sich nach dem Subjekt `zwei Pakete` (Plural): `sind`.","hints":["Wonach richtet sich das Verb?"]}}},{"id":"erststellen-es-3","type":"mcq","difficulty":1,"options":["Heute wird nicht gearbeitet.","Heute wird es nicht gearbeitet.","Heute es wird nicht gearbeitet."],"answer":0,"i18n":{"ar":{"prompt":"حوّل `Es wird heute nicht gearbeitet.` بحيث تبدأ بـ `Heute`. أي جملة صحيحة؟","explain":"`Heute` يملأ الموقع الأول، فتختفي `es`.","hints":["هل بقي لـ `es` مكان؟"]},"de":{"prompt":"Beginne `Es wird heute nicht gearbeitet.` mit `Heute`. Welcher Satz ist richtig?","explain":"`Heute` besetzt Position 1, `es` fällt weg.","hints":["Ist noch Platz für `es`?"]}}},{"id":"erststellen-es-4","type":"cloze","difficulty":2,"text":"Es {{1}} ein Fehler passiert. Leider {{2}} ein Fehler passiert.","blanks":[["ist"],["ist"]],"i18n":{"ar":{"prompt":"أكمل الجملتين بالفعل المساعد.","explain":"في الجملتين `ist`. في الثانية `Leider` في الموقع الأول، فلا توجد `es`.","hints":["`passieren` يأخذ `sein`."]},"de":{"prompt":"Ergänze in beiden Sätzen das Hilfsverb.","explain":"Beide Male `ist`. Im zweiten Satz steht `Leider` vorn, deshalb kein `es`.","hints":["`passieren` bildet das Perfekt mit `sein`."]}}},{"id":"erststellen-es-5","type":"order","difficulty":2,"items":["Am Wochenende","wird","im Garten","gegrillt."],"i18n":{"ar":{"prompt":"رتّب الجملة: «في عطلة نهاية الأسبوع يُشوى اللحم في الحديقة».","explain":"`Am Wochenende` في الموقع الأول، فلا حاجة إلى `es`. والفعل `wird` في الموقع الثاني.","hints":["ابدأ بالظرف الزمني."]},"de":{"prompt":"Ordne den Satz.","explain":"`Am Wochenende` steht vorn, deshalb kein `es`. `wird` auf Position 2.","hints":["Beginne mit der Zeitangabe."]}}},{"id":"erststellen-es-6","type":"mcq","difficulty":2,"options":["Heute regnet es.","Heute kamen es viele Leute.","Gestern wurde es getanzt."],"answer":0,"i18n":{"ar":{"prompt":"في أي جملة تبقى `es` بحق بعد تغيير الترتيب؟","explain":"`es` في `regnen` فاعل شكلي ثابت يبقى دائمًا. أما في الجملتين الأخريين فهي `es` الموقع الأول ويجب حذفها.","hints":["فكّر في `Es regnet`."]},"de":{"prompt":"In welchem Satz bleibt `es` zu Recht nach der Umstellung?","explain":"Bei `regnen` ist `es` ein festes formales Subjekt und bleibt. In den anderen Sätzen ist es ein Vorfeld-es und fällt weg.","hints":["Denk an `Es regnet`."]}}},{"id":"erststellen-es-7","type":"text","difficulty":3,"answer":"Es stehen viele Fahrräder vor dem Haus.","i18n":{"ar":{"prompt":"ابدأ الجملة بـ `Es`: `Viele Fahrräder stehen vor dem Haus.`","explain":"`Es stehen viele Fahrräder vor dem Haus.` الفعل بالجمع لأنه يتفق مع `Fahrräder`.","hints":["هل يتغير الفعل؟"]},"de":{"prompt":"Beginne mit `Es`: `Viele Fahrräder stehen vor dem Haus.`","explain":"`Es stehen viele Fahrräder vor dem Haus.` Das Verb bleibt im Plural, weil es zu `Fahrräder` passt.","hints":["Ändert sich das Verb?"]}}},{"id":"erststellen-es-8","type":"text","difficulty":3,"context":"Gestern wurde es viel gelacht.","answer":"Gestern wurde viel gelacht.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`Gestern` يملأ الموقع الأول، فلا حاجة إلى `es`.","hints":["ما الذي يقف في الموقع الأول؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`Gestern` besetzt Position 1. `es` wird nicht gebraucht.","hints":["Was steht auf Position 1?"]}}},{"id":"erststellen-es-9","type":"text","difficulty":2,"answer":"Es gab einmal einen König, der drei Töchter hatte.","i18n":{"ar":{"prompt":"اكتب بداية حكاية تبدأ بـ `Es`.","explain":"مثال: `Es war einmal ein König …` أو `Es gab einmal einen König, der drei Töchter hatte.`","hints":["بدايات الحكايات الألمانية تبدأ كثيرًا بـ `Es`."]},"de":{"prompt":"Schreib den Anfang einer Geschichte, der mit `Es` beginnt.","explain":"Zum Beispiel: `Es war einmal ein König …` oder `Es gab einmal einen König, der drei Töchter hatte.`","hints":["Märchen beginnen oft mit `Es`."]}}}]},{"id":"plusquamperfekt","level":"B1.2","island":"zeiten","order":1,"prereqs":[],"emoji":"⏪","german":"Das Plusquamperfekt","source":{"lektion":10,"kind":"toc"},"pattern":["hatte / war","+","Partizip II"],"frames":[{"k":"main","parts":[["vf","Der Zug"],["v","war"],["mf","schon"],["ve","abgefahren"]]},{"k":"main","parts":[["vf","Ich"],["v","hatte"],["mf","mein Ticket zu Hause"],["ve","vergessen"]]},{"k":"sub","parts":[["c","weil"],["mf","ich den Wecker nicht"],["ve","gehört hatte"]]}],"example":"Als ich am Bahnhof ankam, war der Zug schon abgefahren.","stepExamples":["Ich kam am Bahnhof an. Der Zug fuhr ab.","Als ich ankam, war der Zug schon abgefahren.","Ich hatte mein Ticket zu Hause vergessen.","Ich bin zu spät gekommen, weil ich den Wecker nicht gehört hatte."],"pitfallPair":"Ich hatte schon nach Hause gegangen. → Ich war schon nach Hause gegangen.","links":["https://grammis.ids-mannheim.de/vggf/2228","https://grammis.ids-mannheim.de/fragen/6706"],"i18n":{"ar":{"title":"الماضي الأسبق: Plusquamperfekt","lead":"حين تحكي عن الماضي يحدث أن يكون أمر قد وقع قبل أمر آخر. وصلتَ إلى المحطة، لكن القطار كان قد غادر قبل ذلك. لهذا «الماضي قبل الماضي» تحتاج إلى `Plusquamperfekt`.","translation":"حين وصلتُ إلى المحطة كان القطار قد غادر.","steps":[{"text":"رتّب الحدثين على خط الزمن","why":"كلا الحدثين في الماضي، لكن مغادرة القطار وقعت أولًا. الحدث الأقدم هو الذي يأخذ `Plusquamperfekt`."},{"text":"كوّن الصيغة من hatte أو war مع Partizip II","why":"هي مثل `Perfekt`، لكن الفعل المساعد في الماضي: `ist abgefahren` تصير `war abgefahren`. ويبقى `Partizip II` في آخر الجملة."},{"text":"اختر المساعد كما في Perfekt","why":"الأفعال التي تأخذ `haben` في `Perfekt` تأخذ `hatte`، والتي تأخذ `sein` تأخذ `war`: `hatte vergessen` و`war gegangen`."},{"text":"في الجملة التابعة يذهب المساعد إلى الآخر","why":"بعد `weil` أو `nachdem` يقف `Partizip II` ثم المساعد المصرف: `gehört hatte`."}],"explain":["يُستعمل `Plusquamperfekt` غالبًا مع `Präteritum` في الحكاية: الأحداث الأساسية في `Präteritum`، وما وقع قبلها في `Plusquamperfekt`.","إذا كان الترتيب واضحًا من السياق فلا حاجة دائمًا إليه في الكلام اليومي. لكن بعد `nachdem` وفي النصوص المكتوبة ستراه كثيرًا."],"pitfall":"الأفعال التي تدل على حركة أو تغيّر حال تأخذ `war`، لا `hatte`، كما تأخذ `ist` في `Perfekt`.","recall":["ما صيغة `Plusquamperfekt` من `Wir sind umgezogen`؟","`Wir waren umgezogen.` الفعل المساعد `sein` يصير `waren`."],"linkTitles":["الماضي الأسبق · grammis","هل ما زال Plusquamperfekt مستعملًا؟ · grammis"],"table":[["الضمير","haben","sein"],["ich","hatte gemacht","war gegangen"],["du","hattest gemacht","warst gegangen"],["er / sie / es","hatte gemacht","war gegangen"],["wir","hatten gemacht","waren gegangen"],["ihr","hattet gemacht","wart gegangen"],["sie / Sie","hatten gemacht","waren gegangen"]]},"de":{"title":"Das Plusquamperfekt","lead":"Wenn du von der Vergangenheit erzählst, ist manchmal etwas noch früher passiert. Du kamst am Bahnhof an, aber der Zug war schon vorher abgefahren. Für diese „Vorvergangenheit“ brauchst du das Plusquamperfekt.","steps":[{"text":"Ordne die zwei Ereignisse auf der Zeitachse","why":"Beide liegen in der Vergangenheit, aber der Zug fuhr zuerst ab. Das frühere Ereignis steht im Plusquamperfekt."},{"text":"Bilde hatte oder war + Partizip II","why":"Es ist wie das Perfekt, nur steht das Hilfsverb im Präteritum: aus `ist abgefahren` wird `war abgefahren`. Das Partizip II steht am Satzende."},{"text":"Wähle das Hilfsverb wie im Perfekt","why":"Verben mit `haben` im Perfekt bekommen `hatte`, Verben mit `sein` bekommen `war`: `hatte vergessen`, `war gegangen`."},{"text":"Im Nebensatz steht das Hilfsverb am Ende","why":"Nach `weil` oder `nachdem` kommen erst das Partizip II, dann das konjugierte Hilfsverb: `gehört hatte`."}],"explain":["Beim Erzählen steht das Plusquamperfekt oft zusammen mit dem Präteritum: Die Haupthandlung steht im Präteritum, was vorher passiert war, im Plusquamperfekt.","Wenn die Reihenfolge aus dem Kontext klar ist, verzichtet man in der gesprochenen Sprache oft darauf. Nach `nachdem` und in geschriebenen Texten siehst du es aber häufig."],"pitfall":"Verben der Bewegung oder Zustandsveränderung bilden das Plusquamperfekt mit `war`, nicht mit `hatte` – wie mit `ist` im Perfekt.","recall":["Wie heißt `Wir sind umgezogen` im Plusquamperfekt?","`Wir waren umgezogen.` Das Hilfsverb `sein` wird zu `waren`."],"linkTitles":["Plusquamperfekt · grammis","Wird das Plusquamperfekt noch benutzt? · grammis"],"table":[["Person","haben","sein"],["ich","hatte gemacht","war gegangen"],["du","hattest gemacht","warst gegangen"],["er / sie / es","hatte gemacht","war gegangen"],["wir","hatten gemacht","waren gegangen"],["ihr","hattet gemacht","wart gegangen"],["sie / Sie","hatten gemacht","waren gegangen"]]}},"questions":[{"id":"plusquamperfekt-1","type":"cloze","difficulty":1,"text":"Als wir ins Kino kamen, {{1}} der Film schon angefangen.","blanks":[["hatte"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد المناسب.","explain":"`anfangen` يأخذ `haben` في `Perfekt`، فيصير `hatte angefangen`.","hints":["الفيلم بدأ قبل وصولنا."]},"de":{"prompt":"Ergänze das passende Hilfsverb.","explain":"`anfangen` bildet das Perfekt mit `haben`, also `hatte angefangen`.","hints":["Der Film begann vor unserer Ankunft."]}}},{"id":"plusquamperfekt-2","type":"cloze","difficulty":1,"text":"Sie war müde, weil sie den ganzen Tag gearbeitet {{1}}.","blanks":[["hatte"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد في الآخر.","explain":"العمل وقع قبل التعب، و`arbeiten` يأخذ `haben`: `gearbeitet hatte`.","hints":["الفعل المساعد في آخر جملة `weil`."]},"de":{"prompt":"Ergänze das Hilfsverb am Ende.","explain":"Die Arbeit war vor der Müdigkeit, `arbeiten` bildet das Perfekt mit `haben`: `gearbeitet hatte`.","hints":["Im weil-Satz steht das Hilfsverb am Ende."]}}},{"id":"plusquamperfekt-3","type":"mcq","difficulty":1,"options":["Er war schon nach Hause gefahren.","Er hatte schon nach Hause gefahren.","Er war schon nach Hause fahren."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة في `Plusquamperfekt`؟","explain":"`fahren` فعل حركة يأخذ `sein`، فالصيغة `war … gefahren`.","hints":["هل `fahren` يأخذ `haben` أم `sein`؟"]},"de":{"prompt":"Welcher Satz steht richtig im Plusquamperfekt?","explain":"`fahren` ist ein Bewegungsverb mit `sein`: `war … gefahren`.","hints":["Bildet `fahren` das Perfekt mit `haben` oder `sein`?"]}}},{"id":"plusquamperfekt-4","type":"cloze","difficulty":2,"text":"Ich konnte nicht bezahlen, denn ich {{1}} mein Portemonnaie {{2}}.","blanks":[["hatte"],["verloren","vergessen"]],"i18n":{"ar":{"prompt":"أكمل بـ `Plusquamperfekt` من `verlieren`.","explain":"بعد `denn` يبقى الترتيب رئيسيًا: `hatte` في الموقع الثاني و`verloren` في الآخر.","hints":["`denn` لا ترسل الفعل إلى الآخر."]},"de":{"prompt":"Ergänze das Plusquamperfekt von `verlieren`.","explain":"Nach `denn` bleibt die Hauptsatzstellung: `hatte` auf Position 2, `verloren` am Ende.","hints":["`denn` schickt das Verb nicht ans Ende."]}}},{"id":"plusquamperfekt-5","type":"order","difficulty":2,"items":["Wir","waren","noch nie","in Berlin","gewesen."],"i18n":{"ar":{"prompt":"رتّب الجملة: «لم نكن قد زرنا برلين من قبل».","explain":"`waren` في الموقع الثاني و`gewesen` في الآخر. الفعل `sein` يأخذ `sein` كمساعد.","hints":["ابدأ بـ `Wir`."]},"de":{"prompt":"Ordne den Satz.","explain":"`waren` auf Position 2, `gewesen` am Ende. `sein` bildet das Perfekt mit `sein`.","hints":["Beginne mit `Wir`."]}}},{"id":"plusquamperfekt-6","type":"mcq","difficulty":2,"options":["Er hat die Tür abgeschlossen.","Er ist losgegangen.","Beide Handlungen passierten gleichzeitig."],"answer":0,"i18n":{"ar":{"prompt":"في الجملة `Er ging los. Er hatte die Tür abgeschlossen.` ما الذي حدث أولًا؟","explain":"الحدث الذي في `Plusquamperfekt` وقع قبل الحدث الذي في `Präteritum`: أقفل الباب أولًا.","hints":["أي فعل جاء في `Plusquamperfekt`؟"]},"de":{"prompt":"In `Er ging los. Er hatte die Tür abgeschlossen.` – was passierte zuerst?","explain":"Was im Plusquamperfekt steht, passierte vor dem Ereignis im Präteritum: Er schloss zuerst ab.","hints":["Welches Verb steht im Plusquamperfekt?"]}}},{"id":"plusquamperfekt-7","type":"text","difficulty":3,"answer":"Ich hatte das Buch schon gelesen.","i18n":{"ar":{"prompt":"حوّل إلى `Plusquamperfekt`: `Ich habe das Buch schon gelesen.`","explain":"`habe` تصير `hatte`، ويبقى `gelesen` في الآخر.","hints":["غيّر الفعل المساعد فقط."]},"de":{"prompt":"Setz ins Plusquamperfekt: `Ich habe das Buch schon gelesen.`","explain":"Aus `habe` wird `hatte`, `gelesen` bleibt am Ende.","hints":["Ändere nur das Hilfsverb."]}}},{"id":"plusquamperfekt-8","type":"text","difficulty":3,"context":"Ich hatte schon nach Hause gegangen.","answer":"Ich war schon nach Hause gegangen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`gehen` فعل حركة يأخذ `sein` في `Perfekt`، فيصير المساعد `war` في `Plusquamperfekt`.","hints":["`Ich bin gegangen` أم `Ich habe gegangen`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`gehen` ist ein Bewegungsverb mit `sein`. Im Plusquamperfekt heißt das Hilfsverb deshalb `war`.","hints":["`Ich bin gegangen` oder `Ich habe gegangen`?"]}}},{"id":"plusquamperfekt-9","type":"text","difficulty":2,"answer":"Als ich nach Hause kam, hatte meine Mutter schon gekocht.","i18n":{"ar":{"prompt":"اكتب جملة تبدأ بـ `Als ich nach Hause kam,` وأكملها بحدث وقع قبل ذلك.","explain":"مثال: `Als ich nach Hause kam, hatte meine Mutter schon gekocht.`","hints":["بعد الفاصلة: الفعل المساعد ثم الفاعل."]},"de":{"prompt":"Schreib einen Satz, der mit `Als ich nach Hause kam,` beginnt, und ergänze etwas, das vorher passiert war.","explain":"Zum Beispiel: `Als ich nach Hause kam, hatte meine Mutter schon gekocht.`","hints":["Nach dem Komma: Hilfsverb, dann Subjekt."]}}}]},{"id":"nachdem","level":"B1.2","island":"zeiten","order":2,"prereqs":["plusquamperfekt"],"emoji":"🔁","german":"Temporale Nebensätze mit nachdem","source":{"lektion":10,"kind":"toc"},"pattern":["nachdem","+","Plusquamperfekt",",","Präteritum / Perfekt"],"frames":[{"k":"sub","parts":[["c","Nachdem"],["mf","ich"],["ve","gegessen hatte"]]},{"k":"main","parts":[["vf","Nachdem ich gegessen hatte,"],["v","ging"],["mf","ich spazieren"]]},{"k":"main","parts":[["vf","Nachdem ich gegessen habe,"],["v","gehe"],["mf","ich spazieren"]]}],"example":"Nachdem ich gegessen hatte, ging ich spazieren.","stepExamples":["Ich aß. Danach ging ich spazieren.","Nachdem ich gegessen hatte, ging ich spazieren.","Ich ging spazieren, nachdem ich gegessen hatte.","Nachdem ich gegessen habe, gehe ich spazieren."],"pitfallPair":"Nachdem ich aß, ging ich spazieren. → Nachdem ich gegessen hatte, ging ich spazieren.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/2104","https://www.dwds.de/wb/nachdem"],"i18n":{"ar":{"title":"بعد أن: nachdem وتتابع الأزمنة","lead":"`nachdem` تعني «بعد أن». لها قاعدة خاصة: الجملة التي تبدأ بها تكون في زمن أقدم بدرجة من الجملة الرئيسية. ستتعلم الزوجين المعتادين من الأزمنة.","translation":"بعد أن أكلتُ خرجتُ للنزهة.","steps":[{"text":"رتّب الحدثين","why":"الأكل أولًا، ثم النزهة. `nachdem` تقف أمام الحدث الأول."},{"text":"ضع الحدث الأول في Plusquamperfekt","why":"الجملة الرئيسية في `Präteritum` (`ging`)، فجملة `nachdem` تكون أقدم بدرجة: `gegessen hatte`. والفعل المساعد في آخرها."},{"text":"الجملة الرئيسية يمكن أن تأتي أولًا","why":"يبقى الزمنان كما هما وتنتقل الجملة التابعة إلى الآخر: `…, nachdem ich gegessen hatte.`"},{"text":"في الحاضر: Perfekt ثم Präsens","why":"إذا كانت الجملة الرئيسية في `Präsens` فجملة `nachdem` في `Perfekt`: `Nachdem ich gegessen habe, gehe ich spazieren.`"}],"explain":["قاعدة التتابع: `nachdem` + `Plusquamperfekt` مع `Präteritum` أو `Perfekt` في الجملة الرئيسية، و`nachdem` + `Perfekt` مع `Präsens` أو `Futur`.","لا تخلط بين `nachdem` و`nach`: الأولى أداة ربط تتبعها جملة كاملة، والثانية حرف جر يتبعه اسم: `nach dem Essen`."],"pitfall":"إذا كان الحدثان في `Präteritum` معًا ضاع الترتيب. الحدث الذي بعد `nachdem` يكون أقدم بدرجة.","recall":["كيف تقول بـ `nachdem`: `Er duschte. Dann frühstückte er.`؟","`Nachdem er geduscht hatte, frühstückte er.` الحدث الأول في `Plusquamperfekt`."],"linkTitles":["الجمل الزمنية · grammis","nachdem في معجم DWDS"],"table":[["جملة nachdem","الجملة الرئيسية","مثال"],["Plusquamperfekt","Präteritum / Perfekt","Nachdem er angerufen hatte, kam er."],["Perfekt","Präsens / Futur","Nachdem er angerufen hat, kommt er."]]},"de":{"title":"Temporale Nebensätze mit nachdem","lead":"`nachdem` nennt, was vorher passiert ist. Es hat eine besondere Regel: Der nachdem-Satz steht eine Zeitstufe früher als der Hauptsatz. Du lernst die üblichen Zeitpaare.","steps":[{"text":"Ordne die Ereignisse","why":"Erst essen, dann spazieren gehen. `nachdem` steht vor dem ersten Ereignis."},{"text":"Setz das erste Ereignis ins Plusquamperfekt","why":"Der Hauptsatz steht im Präteritum (`ging`), der nachdem-Satz eine Stufe früher: `gegessen hatte`. Das Hilfsverb steht am Ende."},{"text":"Der Hauptsatz kann vorn stehen","why":"Die Zeiten bleiben gleich, nur der Nebensatz rückt nach hinten: `…, nachdem ich gegessen hatte.`"},{"text":"In der Gegenwart: Perfekt und Präsens","why":"Steht der Hauptsatz im Präsens, steht der nachdem-Satz im Perfekt: `Nachdem ich gegessen habe, gehe ich spazieren.`"}],"explain":["Die Zeitenfolge: `nachdem` + Plusquamperfekt zu Präteritum oder Perfekt im Hauptsatz; `nachdem` + Perfekt zu Präsens oder Futur.","Verwechsle `nachdem` nicht mit `nach`: `nachdem` leitet einen ganzen Satz ein, `nach` ist eine Präposition mit Nomen: `nach dem Essen`."],"pitfall":"Stehen beide Ereignisse im Präteritum, fehlt die Reihenfolge. Der nachdem-Satz steht eine Stufe früher.","recall":["Wie verbindest du mit `nachdem`: `Er duschte. Dann frühstückte er.`?","`Nachdem er geduscht hatte, frühstückte er.` Das erste Ereignis steht im Plusquamperfekt."],"linkTitles":["Temporalsätze · grammis","nachdem im DWDS"],"table":[["nachdem-Satz","Hauptsatz","Beispiel"],["Plusquamperfekt","Präteritum / Perfekt","Nachdem er angerufen hatte, kam er."],["Perfekt","Präsens / Futur","Nachdem er angerufen hat, kommt er."]]}},"questions":[{"id":"nachdem-1","type":"cloze","difficulty":1,"text":"Nachdem wir die Wohnung {{1}} hatten, zogen wir ein.","blanks":[["gestrichen","renoviert","geputzt"]],"i18n":{"ar":{"prompt":"أكمل بـ `Partizip II` من فعل مثل `streichen`.","explain":"الحدث الأول في `Plusquamperfekt`: `gestrichen hatten`.","hints":["`Partizip II` يأتي قبل `hatten`."]},"de":{"prompt":"Ergänze das Partizip II, zum Beispiel von `streichen`.","explain":"Das erste Ereignis steht im Plusquamperfekt: `gestrichen hatten`.","hints":["Das Partizip II steht vor `hatten`."]}}},{"id":"nachdem-2","type":"cloze","difficulty":1,"text":"Nachdem sie angekommen {{1}}, rief sie ihre Eltern an.","blanks":[["war"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد المناسب.","explain":"`ankommen` يأخذ `sein`، فيصير `angekommen war`.","hints":["`Sie ist angekommen.`"]},"de":{"prompt":"Ergänze das passende Hilfsverb.","explain":"`ankommen` bildet das Perfekt mit `sein`: `angekommen war`.","hints":["`Sie ist angekommen.`"]}}},{"id":"nachdem-3","type":"mcq","difficulty":1,"options":["Nachdem er die Prüfung bestanden hatte, feierte er.","Nachdem er die Prüfung bestand, feierte er.","Nachdem er die Prüfung bestanden hatte, feiert er."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة في تتابع الأزمنة؟","explain":"`Plusquamperfekt` بعد `nachdem` يتناسب مع `Präteritum` في الجملة الرئيسية.","hints":["جملة `nachdem` أقدم بدرجة."]},"de":{"prompt":"Welcher Satz hat die richtige Zeitenfolge?","explain":"Plusquamperfekt im nachdem-Satz passt zu Präteritum im Hauptsatz.","hints":["Der nachdem-Satz steht eine Stufe früher."]}}},{"id":"nachdem-4","type":"cloze","difficulty":2,"text":"Nachdem du die Datei gespeichert {{1}}, kannst du den Computer ausschalten.","blanks":[["hast"]],"i18n":{"ar":{"prompt":"أكمل. الجملة الرئيسية في `Präsens`.","explain":"مع `Präsens` في الجملة الرئيسية تكون جملة `nachdem` في `Perfekt`: `gespeichert hast`.","hints":["`kannst` في الحاضر."]},"de":{"prompt":"Ergänze. Der Hauptsatz steht im Präsens.","explain":"Zum Präsens im Hauptsatz passt Perfekt im nachdem-Satz: `gespeichert hast`.","hints":["`kannst` steht im Präsens."]}}},{"id":"nachdem-5","type":"order","difficulty":2,"items":["Nachdem","der Film","zu Ende","war,","gingen","wir","nach Hause."],"i18n":{"ar":{"prompt":"رتّب الجملة. ابدأ بـ `Nachdem`.","explain":"الجملة التابعة أولًا، ثم الفعل `gingen` ثم الفاعل `wir`.","hints":["بعد الفاصلة: الفعل ثم الفاعل."]},"de":{"prompt":"Ordne den Satz. Beginne mit `Nachdem`.","explain":"Erst der Nebensatz, dann `gingen`, dann `wir`.","hints":["Nach dem Komma: Verb, dann Subjekt."]}}},{"id":"nachdem-6","type":"mcq","difficulty":2,"options":["nach dem","nachdem","danach"],"answer":0,"i18n":{"ar":{"prompt":"أي كلمة تكمل الجملة؟ `___ Unterricht gehe ich in die Bibliothek.`","explain":"بعد الفراغ اسم وليس جملة، فنحتاج إلى حرف الجر `nach` مع الأداة `dem`.","hints":["هل تأتي بعد الفراغ جملة كاملة؟"]},"de":{"prompt":"Welches Wort passt? `___ Unterricht gehe ich in die Bibliothek.`","explain":"Nach der Lücke steht ein Nomen, kein Satz. Deshalb Präposition + Artikel: `nach dem`.","hints":["Folgt ein ganzer Satz?"]}}},{"id":"nachdem-7","type":"text","difficulty":3,"answer":"Nachdem sie das Abitur gemacht hatte, studierte sie Medizin.","i18n":{"ar":{"prompt":"اربط بـ `nachdem`: `Sie machte das Abitur. Dann studierte sie Medizin.`","explain":"الحدث الأول في `Plusquamperfekt`: `gemacht hatte`، ثم `studierte sie`.","hints":["`machen` يأخذ `haben`."]},"de":{"prompt":"Verbinde mit `nachdem`: `Sie machte das Abitur. Dann studierte sie Medizin.`","explain":"Das erste Ereignis im Plusquamperfekt: `gemacht hatte`, dann `studierte sie`.","hints":["`machen` bildet das Perfekt mit `haben`."]}}},{"id":"nachdem-8","type":"text","difficulty":3,"context":"Nachdem ich aß, ging ich spazieren.","answer":"Nachdem ich gegessen hatte, ging ich spazieren.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الجملة الرئيسية في `Präteritum`، فجملة `nachdem` تكون أقدم بدرجة: `Plusquamperfekt`.","hints":["ما الزمن الأقدم من `Präteritum`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Hauptsatz steht im Präteritum, also braucht der nachdem-Satz das Plusquamperfekt.","hints":["Welche Zeit liegt vor dem Präteritum?"]}}},{"id":"nachdem-9","type":"text","difficulty":2,"answer":"Nachdem ich aufgestanden bin, trinke ich einen Kaffee.","i18n":{"ar":{"prompt":"صف عادتك الصباحية بجملة مع `nachdem` في الحاضر.","explain":"مثال: `Nachdem ich aufgestanden bin, trinke ich einen Kaffee.` `Perfekt` مع `Präsens`.","hints":["جملة `nachdem` في `Perfekt`."]},"de":{"prompt":"Beschreib deine Morgenroutine mit einem nachdem-Satz in der Gegenwart.","explain":"Zum Beispiel: `Nachdem ich aufgestanden bin, trinke ich einen Kaffee.` Perfekt + Präsens.","hints":["Der nachdem-Satz steht im Perfekt."]}}}]},{"id":"bevor-bis","level":"B1.2","island":"zeiten","order":3,"prereqs":[],"emoji":"⏱️","german":"Temporale Nebensätze mit bevor / bis","source":{"lektion":10,"kind":"toc"},"pattern":["bevor / bis","…","Verb am Ende"],"frames":[{"k":"sub","parts":[["c","Bevor"],["mf","ich"],["ve","frühstücke"]]},{"k":"main","parts":[["vf","Bevor ich frühstücke,"],["v","dusche"],["mf","ich"]]},{"k":"sub","parts":[["c","bis"],["mf","du"],["ve","kommst"]]}],"example":"Bevor ich frühstücke, dusche ich.","stepExamples":["Ich dusche. Danach frühstücke ich.","Bevor ich frühstücke, dusche ich.","Ich warte hier, bis du kommst.","Vor dem Frühstück dusche ich."],"pitfallPair":"Vor ich esse, wasche ich mir die Hände. → Bevor ich esse, wasche ich mir die Hände.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/2104","https://www.dwds.de/wb/bevor"],"i18n":{"ar":{"title":"قبل أن وإلى أن: bevor و bis","lead":"`bevor` تقول إن شيئًا يحدث قبل شيء آخر، و`bis` تحدد نقطة النهاية: إلى متى يستمر الأمر. كلتاهما أداة ربط تابعة، فيذهب الفعل إلى آخر جملتها.","translation":"قبل أن أفطر أستحم.","steps":[{"text":"رتّب الحدثين","why":"الاستحمام أولًا ثم الفطور. الكلمة `bevor` تقف أمام الحدث الذي يأتي لاحقًا، أي الفطور."},{"text":"اربط بـ bevor والفعل في الآخر","why":"`Bevor ich frühstücke` جملة تابعة، فيأتي بعدها الفعل `dusche` ثم الفاعل. والزمنان في الجملتين متماثلان عادة."},{"text":"bis تعني «إلى أن»","why":"الانتظار يستمر حتى لحظة مجيئك ثم ينتهي. الفعل `kommst` في آخر جملة `bis`."},{"text":"مع الاسم استعمل vor أو bis zu","why":"`bevor` تأتي قبل جملة، و`vor` قبل اسم: `vor dem Frühstück`. وكذلك `bis` قبل جملة، و`bis zum Abend` قبل اسم."}],"explain":["مع `bevor` يكون الحدث في الجملة الرئيسية أسبق، ومع `bis` تستمر الجملة الرئيسية حتى يبدأ ما في جملة `bis`.","لاحظ أن `bis` تأتي كثيرًا مع النفي: `Ich gehe nicht, bis du fertig bist` تعني أنني لن أذهب قبل أن تنتهي."],"pitfall":"`vor` حرف جر يحتاج إلى اسم. قبل الجملة الكاملة نحتاج إلى `bevor`.","recall":["أكمل: `Ich bleibe im Büro, ___ die Arbeit fertig ist.`","`bis`: البقاء يستمر حتى ينتهي العمل."],"linkTitles":["الجمل الزمنية · grammis","bevor في معجم DWDS"],"table":[["مع جملة","مع اسم","المعنى"],["bevor ich esse","vor dem Essen","قبل"],["bis du kommst","bis zum Abend","إلى أن، حتى"]]},"de":{"title":"Temporale Nebensätze mit bevor und bis","lead":"`bevor` sagt, dass etwas vor etwas anderem passiert. `bis` nennt den Endpunkt: wie lange etwas dauert. Beide sind Subjunktoren, das Verb steht am Ende ihres Satzes.","steps":[{"text":"Ordne die Ereignisse","why":"Erst duschen, dann frühstücken. `bevor` steht vor dem späteren Ereignis, dem Frühstück."},{"text":"Verbinde mit bevor, das Verb am Ende","why":"`Bevor ich frühstücke` ist ein Nebensatz. Danach folgen `dusche` und das Subjekt. Beide Sätze stehen meist in derselben Zeit."},{"text":"bis nennt den Endpunkt","why":"Das Warten dauert bis zu dem Moment, in dem du kommst. `kommst` steht am Ende des bis-Satzes."},{"text":"Mit Nomen: vor und bis zu","why":"`bevor` steht vor einem Satz, `vor` vor einem Nomen: `vor dem Frühstück`. Ebenso `bis` vor einem Satz, `bis zum Abend` vor einem Nomen."}],"explain":["Bei `bevor` passiert der Hauptsatz früher. Bei `bis` dauert der Hauptsatz an, bis das Ereignis im bis-Satz beginnt.","`bis` steht oft mit Verneinung: `Ich gehe nicht, bis du fertig bist` heißt: Ich gehe erst, wenn du fertig bist."],"pitfall":"`vor` ist eine Präposition und braucht ein Nomen. Vor einem ganzen Satz steht `bevor`.","recall":["Ergänze: `Ich bleibe im Büro, ___ die Arbeit fertig ist.`","`bis`: Ich bleibe so lange, bis die Arbeit fertig ist."],"linkTitles":["Temporalsätze · grammis","bevor im DWDS"],"table":[["mit Satz","mit Nomen","Bedeutung"],["bevor ich esse","vor dem Essen","früher als"],["bis du kommst","bis zum Abend","Endpunkt"]]}},"questions":[{"id":"bevor-bis-1","type":"cloze","difficulty":1,"text":"{{1}} du gehst, mach bitte das Fenster zu.","blanks":[["Bevor"]],"i18n":{"ar":{"prompt":"أكمل بأداة تعني «قبل أن».","explain":"إغلاق النافذة يحدث قبل الذهاب: `Bevor du gehst`.","hints":["بعد الفراغ جملة كاملة."]},"de":{"prompt":"Ergänze das Wort für „früher als“.","explain":"Das Fenster schließt du vor dem Gehen: `Bevor du gehst`.","hints":["Nach der Lücke steht ein ganzer Satz."]}}},{"id":"bevor-bis-2","type":"cloze","difficulty":1,"text":"Wir warten, {{1}} der Regen aufhört.","blanks":[["bis"]],"i18n":{"ar":{"prompt":"أكمل بأداة تعني «إلى أن».","explain":"الانتظار يستمر حتى يتوقف المطر: `bis`.","hints":["متى ينتهي الانتظار؟"]},"de":{"prompt":"Ergänze das Wort für den Endpunkt.","explain":"Das Warten dauert, bis der Regen aufhört: `bis`.","hints":["Wann endet das Warten?"]}}},{"id":"bevor-bis-3","type":"mcq","difficulty":1,"options":["Vor dem Essen","Bevor dem Essen","Bis dem Essen"],"answer":0,"i18n":{"ar":{"prompt":"أي عبارة تكمل الجملة؟ `___ wasche ich mir die Hände.`","explain":"قبل الاسم `dem Essen` نحتاج إلى حرف الجر `vor`.","hints":["بعد الفراغ اسم، لا جملة."]},"de":{"prompt":"Was passt? `___ wasche ich mir die Hände.`","explain":"Vor dem Nomen `dem Essen` steht die Präposition `vor`.","hints":["Nach der Lücke steht ein Nomen, kein Satz."]}}},{"id":"bevor-bis-4","type":"cloze","difficulty":2,"text":"Bevor er nach Deutschland {{1}}, hat er einen Sprachkurs {{2}}.","blanks":[["kam","gekommen ist"],["gemacht","besucht"]],"i18n":{"ar":{"prompt":"أكمل بفعل `kommen` في الماضي وبـ `Partizip II` مناسب.","explain":"الفعل في آخر جملة `bevor`: `kam`. والجملة الرئيسية في `Perfekt`: `hat … gemacht`.","hints":["الفراغ الأول في آخر الجملة التابعة."]},"de":{"prompt":"Ergänze `kommen` in der Vergangenheit und ein passendes Partizip II.","explain":"Am Ende des bevor-Satzes: `kam`. Der Hauptsatz steht im Perfekt: `hat … gemacht`.","hints":["Die erste Lücke steht am Ende des Nebensatzes."]}}},{"id":"bevor-bis-5","type":"order","difficulty":2,"items":["Ich","bleibe","im Bett,","bis","das Fieber","weg","ist."],"i18n":{"ar":{"prompt":"رتّب الجملة.","explain":"الجملة الرئيسية أولًا، ثم `bis das Fieber weg ist` والفعل `ist` في الآخر.","hints":["ابدأ بـ `Ich bleibe`."]},"de":{"prompt":"Ordne den Satz.","explain":"Erst der Hauptsatz, dann `bis das Fieber weg ist` mit `ist` am Ende.","hints":["Beginne mit `Ich bleibe`."]}}},{"id":"bevor-bis-6","type":"mcq","difficulty":2,"options":["Wir essen zuerst, dann sehen wir fern.","Wir sehen zuerst fern, dann essen wir.","Wir essen und sehen gleichzeitig fern."],"answer":0,"i18n":{"ar":{"prompt":"ما معنى `Bevor wir fernsehen, essen wir`؟","explain":"`bevor` تقف أمام الحدث اللاحق، أي مشاهدة التلفاز. الأكل يأتي أولًا.","hints":["أمام أي حدث تقف `bevor`؟"]},"de":{"prompt":"Was bedeutet `Bevor wir fernsehen, essen wir`?","explain":"`bevor` steht vor dem späteren Ereignis, dem Fernsehen. Gegessen wird zuerst.","hints":["Vor welchem Ereignis steht `bevor`?"]}}},{"id":"bevor-bis-7","type":"text","difficulty":3,"answer":"Bevor ich ins Bett gehe, lese ich ein bisschen.","i18n":{"ar":{"prompt":"اربط بـ `bevor` وابدأ بها: `Ich lese ein bisschen. Dann gehe ich ins Bett.`","explain":"`bevor` أمام الحدث اللاحق: `Bevor ich ins Bett gehe, lese ich ein bisschen.`","hints":["أي حدث يأتي لاحقًا؟"]},"de":{"prompt":"Verbinde mit `bevor` am Anfang: `Ich lese ein bisschen. Dann gehe ich ins Bett.`","explain":"`bevor` steht vor dem späteren Ereignis: `Bevor ich ins Bett gehe, lese ich ein bisschen.`","hints":["Welches Ereignis kommt später?"]}}},{"id":"bevor-bis-8","type":"text","difficulty":3,"context":"Vor ich esse, wasche ich mir die Hände.","answer":"Bevor ich esse, wasche ich mir die Hände.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","expla
