,"hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"relativ-praep-9","type":"text","difficulty":2,"answer":"`für die`، لأن `für` يأخذ الأكوزاتيف وصيغة جمع الوصل فيه `die`.","i18n":{"ar":{"prompt":"ماذا تقول مع `für` و`die Projekte`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Was sagst du mit `für` und `die Projekte`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"relativ-einschub","level":"B1.1","island":"relativsaetze","order":3,"prereqs":["relativ-dativ"],"emoji":"🪡","german":"Eingeschobene Relativsätze","source":{"lektion":1,"kind":"toc"},"pattern":["Nomen",", Relativsatz ,","Rest des Hauptsatzes"],"frames":[{"k":"main","parts":[["vf","Die Nachbarin, der ich geholfen habe,"],["v","zieht"],["mf","morgen"],["ve","um"]]},{"k":"rel","parts":[["c","der"],["mf","ich"],["ve","geholfen habe"]]}],"example":"Die Nachbarin, der ich geholfen habe, zieht morgen um.","stepExamples":["Die Nachbarin zieht morgen um.","der ich geholfen habe","Die Nachbarin, der ich geholfen habe, zieht morgen um.","Ich habe den Schlüssel, den du suchst, gestern gefunden."],"pitfallPair":"Die Bücher, die du suchst liegen hier. → Die Bücher, die du suchst, liegen hier.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/5272"],"i18n":{"ar":{"title":"جملة الوصل الاعتراضية","lead":"إذا جاء الاسم الموصوف قبل اكتمال الجملة الرئيسية، يمكنك إدراج جملة الوصل بعده مباشرة. استعمل الفاصلتين كي تعرف أين تتوقف الرئيسية وأين تستأنفها.","translation":"الجارَة التي ساعدتُها ستنتقل غدًا.","steps":[{"text":"اقرأ الهيكل قبل الإدراج","why":"هذا هو الهيكل الرئيسي. موقع `zieht` الثاني محسوب بالنسبة إلى الفاعل، وتأتي بادئة الفعل القابل للفصل `umziehen` في النهاية."},{"text":"اكتب الوصل مستقلًا في ذهنك","why":"أخذت `der` صيغة المؤنث في الداتيف لأن `helfen` يطلبها. بقي `habe` في نهاية الجملة التابعة."},{"text":"أدرج الوصل بين فاصلتين","why":"بعد الفاصلة الثانية تعود إلى `zieht`. يمكنك حذف الجزء بين الفاصلتين مؤقتًا للتأكد من أن الهيكل الرئيسي بقي سليمًا."},{"text":"جرّب الإدراج بعد مفعول","why":"الاسم الموصوف هنا جزء من وسط الجملة. يأتي `suchst` قبل الفاصلة الثانية ثم تستأنف الرئيسية بـ `gestern gefunden`."}],"explain":["إذا جاء الوصل في آخر الجملة، تكفي فاصلة افتتاحية ثم علامة انتهاء الجملة. في `Ich besuche den Mann, dem ich helfe.` لا توجد بقية رئيسية بعد الوصل. وإذا قدّمت ظرفًا في الرئيسية فترتيبها يظل خاضعًا له كما في `Morgen besucht uns die Frau, die hier wohnt.` موقع الوصل يتبع الاسم الذي يصفه حتى عندما يتغير موقع الاسم نفسه."],"pitfall":"الفاصلة الثانية تحدد بداية بقية الجملة الرئيسية عند `liegen`.","recall":["احذف الوصل من `Der Schlüssel, den du suchst, liegt auf dem Tisch`.","تبقى `Der Schlüssel liegt auf dem Tisch`. هذا اختبار سريع لمكان الفاصلتين."],"linkTitles":["فهرس قواعد الوحدة 1 · telc، ص 2","حلول الكتاب الرسمية · telc","أدوات جمل الوصل · grammis"]},"de":{"title":"Eingeschobene Relativsätze","lead":"Steht das Bezugswort, bevor der Hauptsatz fertig ist, kannst du den Relativsatz direkt danach einschieben. Die beiden Kommas zeigen dir, wo der Hauptsatz pausiert und wo er weitergeht.","steps":[{"text":"Lies das Gerüst vor dem Einschub","why":"Das ist der Hauptsatz. `zieht` steht auf Position 2 nach dem Subjekt, und das Präfix des trennbaren Verbs `umziehen` steht am Ende."},{"text":"Bilde den Relativsatz zuerst im Kopf","why":"`der` ist feminin Dativ, weil `helfen` den Dativ verlangt. `habe` bleibt am Ende des Nebensatzes."},{"text":"Schieb den Relativsatz zwischen zwei Kommas ein","why":"Nach dem zweiten Komma geht es mit `zieht` weiter. Lass den Teil zwischen den Kommas probeweise weg: Das Gerüst des Hauptsatzes muss intakt bleiben."},{"text":"Probiere den Einschub nach einem Objekt","why":"Das Bezugswort steht hier im Mittelfeld. `suchst` steht vor dem zweiten Komma, dann geht der Hauptsatz mit `gestern gefunden` weiter."}],"explain":["Steht der Relativsatz am Satzende, reichen ein öffnendes Komma und das Satzzeichen am Schluss. In `Ich besuche den Mann, dem ich helfe.` folgt kein Rest des Hauptsatzes. Stellst du ein Adverb an den Anfang des Hauptsatzes, richtet sich die Wortstellung danach: `Morgen besucht uns die Frau, die hier wohnt.` Der Relativsatz folgt immer seinem Bezugswort – auch wenn sich dessen Position ändert."],"pitfall":"Das zweite Komma markiert, wo der Rest des Hauptsatzes mit `liegen` beginnt.","recall":["Lass den Relativsatz in `Der Schlüssel, den du suchst, liegt auf dem Tisch` weg.","Es bleibt `Der Schlüssel liegt auf dem Tisch`. Das ist ein schneller Test für die Position der Kommas."],"linkTitles":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"]}},"questions":[{"id":"relativ-einschub-1","type":"mcq","difficulty":1,"options":["Die Frau, die hier arbeitet, ist nett.","Die Frau, die hier arbeitet ist nett.","Die Frau die hier arbeitet, ist nett."],"answer":0,"i18n":{"ar":{"prompt":"اختر علامات الترقيم الصحيحة.","explain":"عند إدراج الوصل في الوسط نحتاج فاصلة قبله وفاصلة بعده.","hints":["حدّد بداية الوصل ونهايته."]},"de":{"prompt":"Wähle die richtige Zeichensetzung.","explain":"Steht der Relativsatz in der Mitte, brauchen wir ein Komma davor und eins danach.","hints":["Bestimme Anfang und Ende des Relativsatzes."]}}},{"id":"relativ-einschub-2","type":"cloze","difficulty":1,"text":"Das Buch, das du suchst, {{1}} im Regal.","blanks":[["liegt"]],"i18n":{"ar":{"prompt":"أكمل فعل الرئيسية بعد الوصل. استعمل liegt.","explain":"تتبقى Das Buch liegt im Regal، ولذلك يعود الفعل liegt بعد الفاصلة.","hints":["احذف الوصل ذهنيًا واقرأ الجملة."]},"de":{"prompt":"Ergänze das Verb des Hauptsatzes nach dem Relativsatz. Benutze `liegt`.","explain":"Übrig bleibt `Das Buch liegt im Regal`, deshalb kommt `liegt` nach dem Komma zurück.","hints":["Lass den Relativsatz im Kopf weg und lies den Satz."]}}},{"id":"relativ-einschub-3","type":"mcq","difficulty":1,"options":["Der Nachbar zieht um.","Der Nachbar habe geholfen.","Der Nachbar hilft."],"answer":0,"i18n":{"ar":{"prompt":"أيّ هيكل يبقى بعد حذف الوصل؟ Der Nachbar, dem ich geholfen habe, zieht um.","explain":"ينتمي habe إلى الوصل. الفعل القابل للفصل في الرئيسية هو zieht … um.","hints":["احذف كل ما بين الفاصلتين."]},"de":{"prompt":"Welches Gerüst bleibt, wenn man den Relativsatz weglässt? `Der Nachbar, dem ich geholfen habe, zieht um.`","explain":"`habe` gehört zum Relativsatz. Das trennbare Verb des Hauptsatzes ist `zieht … um`.","hints":["Lass alles zwischen den Kommas weg."]}}},{"id":"relativ-einschub-4","type":"order","difficulty":2,"items":["Die Lampe,","die du","gekauft hast,","steht jetzt","am Fenster."],"i18n":{"ar":{"prompt":"رتّب الجملة بوضع الوصل مباشرة بعد die Lampe.","explain":"ينتهي الوصل بـ gekauft hast. بعد إغلاقه تعود الرئيسية إلى steht.","hints":["ابحث عن فعل كل جملة قبل ترتيبها."]},"de":{"prompt":"Ordne den Satz und setz den Relativsatz direkt nach `die Lampe`.","explain":"Der Relativsatz endet mit `gekauft hast`. Danach kehrt der Hauptsatz zu `steht` zurück.","hints":["Such das Verb jedes Satzes, bevor du ordnest."]}}},{"id":"relativ-einschub-5","type":"cloze","difficulty":2,"text":"Die Leute, denen du gestern geholfen {{1}}, {{2}} heute wieder. (haben / kommen)","blanks":[["hast"],["kommen"]],"i18n":{"ar":{"prompt":"أكمل الفعل المصرف في كل جملة.","explain":"نصرّف haben مع du، وkommen مع الجمع. كل فعل تابع لفاعله الخاص.","hints":["فاعل الوصل du وفاعل الرئيسية die Leute."]},"de":{"prompt":"Ergänze das konjugierte Verb in jedem Satz.","explain":"`haben` wird mit `du` konjugiert, `kommen` mit dem Plural. Jedes Verb richtet sich nach seinem eigenen Subjekt.","hints":["Das Subjekt des Relativsatzes ist `du`, das des Hauptsatzes `die Leute`."]}}},{"id":"relativ-einschub-6","type":"mcq","difficulty":2,"options":["Ich habe den Schlüssel, den du suchst, gestern gefunden.","Ich habe den Schlüssel, den du gestern suchst, gefunden.","Ich habe den Schlüssel den du suchst, gestern gefunden."],"answer":0,"i18n":{"ar":{"prompt":"أيّ دمج يحافظ على موضع الظرف gestern داخل الرئيسية؟ Ich habe den Schlüssel gestern gefunden. Du suchst den Schlüssel.","explain":"المشتّت الأول يضع gestern في الوصل فيغيّر المعنى. المشتّت الآخر يحذف الفاصلة التي تفتح الوصل.","hints":["الظرف يخص العثور، والوصل يخص البحث."]},"de":{"prompt":"Welche Verbindung lässt `gestern` im Hauptsatz? `Ich habe den Schlüssel gestern gefunden. Du suchst den Schlüssel.`","explain":"Die erste falsche Antwort setzt `gestern` in den Relativsatz und ändert die Bedeutung. Die andere lässt das Komma vor dem Relativsatz weg.","hints":["Das Adverb gehört zum Finden, der Relativsatz zum Suchen."]}}},{"id":"relativ-einschub-7","type":"text","difficulty":3,"answer":"Die Kollegin, mit der ich arbeite, ruft morgen an.","i18n":{"ar":{"prompt":"ادمج Die Kollegin ruft morgen an وIch arbeite mit der Kollegin. ابدأ بـ Die Kollegin.","explain":"mit der داتيف المؤنث. بعد فاصلة الإغلاق تستأنف الرئيسية بالفعل المنفصل ruft … an.","hints":["ضع mit der في بداية الوصل واحتفظ ببادئة an للرئيسية."]},"de":{"prompt":"Verbinde `Die Kollegin ruft morgen an` und `Ich arbeite mit der Kollegin`. Beginne mit `Die Kollegin`.","explain":"`mit der` ist Dativ feminin. Nach dem schließenden Komma geht der Hauptsatz mit dem trennbaren Verb `ruft … an` weiter.","hints":["Setz `mit der` an den Anfang des Relativsatzes und lass `an` im Hauptsatz."]}}},{"id":"relativ-einschub-8","type":"text","difficulty":3,"answer":"Die Bücher, die du suchst, liegen hier.","context":"Die Bücher, die du suchst liegen hier.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الفاصلة الثانية تحدد بداية بقية الجملة الرئيسية عند `liegen`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Das zweite Komma markiert, wo der Rest des Hauptsatzes mit `liegen` beginnt.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"relativ-einschub-9","type":"text","difficulty":2,"answer":"تبقى `Der Schlüssel liegt auf dem Tisch`. هذا اختبار سريع لمكان الفاصلتين.","i18n":{"ar":{"prompt":"احذف الوصل من `Der Schlüssel, den du suchst, liegt auf dem Tisch`.","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Lass den Relativsatz in `Der Schlüssel, den du suchst, liegt auf dem Tisch` weg.","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"relativ-genitiv","level":"B1.1","island":"relativsaetze","order":4,"prereqs":["relativ-dativ","genitiv"],"emoji":"🔑","german":"Relativpronomen und Relativsätze im Genitiv","source":{"lektion":4,"kind":"toc"},"pattern":["m / n → dessen","·","f / Pl → deren","+ Nomen ohne Artikel"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","die Frau, deren Sohn hier arbeitet"]]},{"k":"rel","parts":[["c","deren Sohn"],["mf","hier"],["ve","arbeitet"]]}],"example":"Das ist die Frau, deren Sohn hier arbeitet.","stepExamples":["die Frau","dessen: der Mann / das Kind · deren: die Frau / die Eltern","…, deren Sohn hier arbeitet.","das Kind, mit dessen Mutter ich gesprochen habe"],"pitfallPair":"Das ist das Kind, deren Mutter hier arbeitet. → Das ist das Kind, dessen Mutter hier arbeitet.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/5272"],"i18n":{"ar":{"title":"الملكية داخل جملة الوصل","lead":"قد تصف شخصًا أو مكانًا بشيء يرتبط به، مثل امرأة يعمل ابنها معنا. تستعمل `dessen` و`deren` كي تربط الشيء أو الشخص التابع بالاسم المرجعي.","translation":"هذه هي المرأة التي يعمل ابنها هنا.","steps":[{"text":"حدّد الاسم المرجعي","why":"صاحب العلاقة في المثال هو المرأة. اسأل لمن ينتمي الابن أو بمن يرتبط. الاسم الذي يجيب عن ذلك هو ما يحدد شكل ضمير الوصل."},{"text":"اختر الضمير بحسب المالك","why":"المذكر والمحايد يأخذان `dessen`. المؤنث والجمع يأخذان `deren`. فكر في الاسم السابق حتى إذا كان الشيء الذي يملكه من جنس آخر."},{"text":"ضمّ الاسم المملوك إلى الضمير","why":"تأتي المجموعة في أول الوصل. لا تضع أداة أخرى أمام `Sohn`. وهو فاعل `arbeitet` هنا، ويمكن أن يصبح مفعولًا في `deren Sohn ich kenne`. يظل `deren` ثابتًا."},{"text":"قدّم حرف الجر مع المجموعة إذا احتجت إليه","why":"يتعلق `mit` بـ `Mutter` في جملة الوصل. `dessen` يعود إلى `Kind` المحايد، ويبقى كما هو مع أن `mit` يطلب الداتيف للمجموعة الاسمية."}],"explain":["قارِن `die Frau, der ich helfe` و`die Frau, deren Bruder ich helfe`. في الأولى أتحدث عن مساعدة المرأة نفسها. في الثانية أساعد أخاها. إذا أضفت صفة بعد `dessen` أو `deren` فتعامل معها كصفة بلا أداة تصرّفها، مثل `deren ältester Sohn hier arbeitet` و`mit dessen älterem Bruder`."],"pitfall":"اختر `dessen` لأن المالك هو `das Kind`. جنس `Mutter` لا يحدد شكل الضمير.","recall":["ما الضمير في `die Leute, … Haus verkauft wurde`؟","`deren` لأن الاسم المرجعي `die Leute` جمع، حتى مع `Haus` المحايد."],"linkTitles":["فهرس قواعد الوحدة 4 · telc، ص 3","حلول الكتاب الرسمية · telc","أدوات جمل الوصل · grammis"]},"de":{"title":"Relativpronomen im Genitiv","lead":"Du beschreibst eine Person oder einen Ort durch etwas, das dazugehört – z. B. eine Frau, deren Sohn bei uns arbeitet. Mit `dessen` und `deren` verbindest du das Zugehörige mit dem Bezugswort.","steps":[{"text":"Bestimme das Bezugswort","why":"Die „Besitzerin“ im Beispiel ist die Frau. Frag: Zu wem gehört der Sohn? Das Nomen, das die Antwort gibt, bestimmt die Form des Relativpronomens."},{"text":"Wähle das Pronomen nach dem Besitzer","why":"Maskulinum und Neutrum bekommen `dessen`, Femininum und Plural `deren`. Denk an das vorherige Nomen – auch wenn das Zugehörige ein anderes Genus hat."},{"text":"Verbinde das Zugehörige mit dem Pronomen","why":"Die Gruppe steht am Anfang des Relativsatzes. Vor `Sohn` steht kein weiterer Artikel. Hier ist es Subjekt von `arbeitet`; in `deren Sohn ich kenne` wäre es Objekt. `deren` bleibt gleich."},{"text":"Stell bei Bedarf die Präposition vor die Gruppe","why":"`mit` gehört zu `Mutter` im Relativsatz. `dessen` verweist auf das neutrale `Kind` und bleibt gleich, obwohl `mit` den Dativ für die Nominalgruppe verlangt."}],"explain":["Vergleiche `die Frau, der ich helfe` und `die Frau, deren Bruder ich helfe`. Im ersten Satz helfe ich der Frau selbst, im zweiten ihrem Bruder. Kommt nach `dessen` oder `deren` ein Adjektiv, behandle es wie ein Adjektiv ohne Artikel: `deren ältester Sohn hier arbeitet`, `mit dessen älterem Bruder`."],"pitfall":"Wähle `dessen`, weil der Besitzer `das Kind` ist. Das Genus von `Mutter` bestimmt die Form des Pronomens nicht.","recall":["Welches Pronomen passt in `die Leute, … Haus verkauft wurde`?","`deren`, weil das Bezugswort `die Leute` Plural ist – auch mit dem neutralen `Haus`."],"linkTitles":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"]}},"questions":[{"id":"relativ-genitiv-1","type":"cloze","difficulty":1,"text":"Der Mann, {{1}} Tochter hier arbeitet, wohnt nebenan.","blanks":[["dessen"]],"i18n":{"ar":{"prompt":"أكمل الضمير للمالك المذكر.","explain":"Mann مذكر وهو المرجع، لذا dessen.","hints":["حدّد جنس المالك، لا اسم الابنة."]},"de":{"prompt":"Ergänze das Pronomen für einen maskulinen Besitzer.","explain":"`Mann` ist maskulin und das Bezugswort, also `dessen`.","hints":["Bestimme das Genus des Besitzers, nicht das der Tochter."]}}},{"id":"relativ-genitiv-2","type":"cloze","difficulty":1,"text":"Die Frau, {{1}} Sohn hier arbeitet, wohnt nebenan.","blanks":[["deren"]],"i18n":{"ar":{"prompt":"أكمل الضمير للمالك المؤنث.","explain":"Frau هي المرجع المؤنث. Sohn لا يحدد شكل الضمير.","hints":["أي شخص يربطه الوصل بالابن؟"]},"de":{"prompt":"Ergänze das Pronomen für eine feminine Besitzerin.","explain":"`Frau` ist das feminine Bezugswort. `Sohn` bestimmt die Form nicht.","hints":["Mit welcher Person verbindet der Relativsatz den Sohn?"]}}},{"id":"relativ-genitiv-3","type":"mcq","difficulty":1,"options":["deren","dessen","denen"],"answer":0,"i18n":{"ar":{"prompt":"ما الضمير المناسب لـ die Eltern في die Eltern, … Kind hier lernt؟","explain":"deren ضمير ملكية وصلي للجمع. dessen للمذكر أو المحايد، وdenen للداتيف.","hints":["علاقة الوصل ملكية والمرجع جمع."]},"de":{"prompt":"Welches Pronomen passt zu `die Eltern` in `die Eltern, … Kind hier lernt`?","explain":"`deren` ist das Relativpronomen für Besitz im Plural. `dessen` gilt für Maskulinum oder Neutrum, `denen` für den Dativ.","hints":["Es geht um Besitz, und das Bezugswort ist Plural."]}}},{"id":"relativ-genitiv-4","type":"cloze","difficulty":2,"text":"Das ist das Kind, mit {{1}} Mutter ich gesprochen habe.","blanks":[["dessen"]],"i18n":{"ar":{"prompt":"أكمل الوصل بعد mit.","explain":"المرجع Kind محايد. يأتي mit أمام المجموعة dessen Mutter، ويبقى dessen ثابتًا.","hints":["فرّق بين جنس المالك والحالة التي يفرضها mit على Mutter."]},"de":{"prompt":"Ergänze den Relativsatz nach `mit`.","explain":"Das Bezugswort `Kind` ist neutral. `mit` steht vor der Gruppe `dessen Mutter`, und `dessen` bleibt gleich.","hints":["Unterscheide das Genus des Besitzers vom Kasus, den `mit` für `Mutter` verlangt."]}}},{"id":"relativ-genitiv-5","type":"order","difficulty":2,"items":["deren Sohn","ich","gestern","besucht","habe"],"i18n":{"ar":{"prompt":"رتّب الوصل بعد die Frau. اجعل ich قبل gestern.","explain":"deren Sohn مفعول داخل الوصل. ينتهي الوصل بالمساعد habe.","hints":["ابدأ بمجموعة الملكية كاملة."]},"de":{"prompt":"Ordne den Relativsatz nach `die Frau`. Setz `ich` vor `gestern`.","explain":"`deren Sohn` ist Objekt im Relativsatz. Der Relativsatz endet mit dem Hilfsverb `habe`.","hints":["Beginne mit der ganzen Besitzgruppe."]}}},{"id":"relativ-genitiv-6","type":"mcq","difficulty":2,"options":["die Frau, deren Bruder ich helfe","die Frau, der ich helfe","die Frau, deren Bruder mir hilft"],"answer":0,"i18n":{"ar":{"prompt":"اختر وصف المرأة التي تساعد أخاها أنت.","explain":"deren Bruder هو من أساعده في الأولى. الثانية تتعلق بالمرأة نفسها، والثالثة تجعل الأخ يساعدني.","hints":["حدّد المساعد والمستفيد في كل صيغة."]},"de":{"prompt":"Wähle die Beschreibung der Frau, deren Bruder du hilfst.","explain":"Im ersten Satz helfe ich `deren Bruder`. Der zweite handelt von der Frau selbst, im dritten hilft der Bruder mir.","hints":["Bestimme in jeder Variante, wer hilft und wem geholfen wird."]}}},{"id":"relativ-genitiv-7","type":"text","difficulty":3,"answer":"Das ist das Haus, dessen Dach neu ist.","i18n":{"ar":{"prompt":"اربط Das ist das Haus وSein Dach ist neu بجملة وصل ملكية.","explain":"dessen يعود إلى Haus. Dach فاعل جملة الوصل، ويأتي ist في آخرها.","hints":["Haus محايد. انقل فعل الوصل إلى النهاية."]},"de":{"prompt":"Verbinde `Das ist das Haus` und `Sein Dach ist neu` mit einem Relativsatz im Genitiv.","explain":"`dessen` verweist auf `Haus`. `Dach` ist Subjekt des Relativsatzes, `ist` steht am Ende.","hints":["`Haus` ist neutral. Setz das Verb des Relativsatzes ans Ende."]}}},{"id":"relativ-genitiv-8","type":"text","difficulty":3,"answer":"Das ist das Kind, dessen Mutter hier arbeitet.","context":"Das ist das Kind, deren Mutter hier arbeitet.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"اختر `dessen` لأن المالك هو `das Kind`. جنس `Mutter` لا يحدد شكل الضمير.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Wähle `dessen`, weil der Besitzer `das Kind` ist. Das Genus von `Mutter` bestimmt die Form des Pronomens nicht.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"relativ-genitiv-9","type":"text","difficulty":2,"answer":"`deren` لأن الاسم المرجعي `die Leute` جمع، حتى مع `Haus` المحايد.","i18n":{"ar":{"prompt":"ما الضمير في `die Leute, … Haus verkauft wurde`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Welches Pronomen passt in `die Leute, … Haus verkauft wurde`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"relativ-ort","level":"B1.1","island":"relativsaetze","order":5,"prereqs":[],"emoji":"📍","german":"Relativsätze mit wo, wohin und woher","source":{"lektion":4,"kind":"toc"},"pattern":["wo = Ort","·","wohin = Ziel","·","woher = Herkunft"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","der Ort, wo ich wohne"]]},{"k":"rel","parts":[["c","wo / wohin / woher"],["mf","ich"],["ve","wohne / ziehe / komme"]]}],"example":"Das ist der Ort, wo ich wohne / wohin ich ziehe / woher ich komme.","stepExamples":["Dort, wo ich wohne, gibt es einen Park.","Das ist der Ort, wohin sie fährt.","Das ist die Stadt, woher er kommt.","der Park, wo wir laufen · die Person, die wir sehen"],"pitfallPair":"Das ist der Ort, woher sie morgen hinfährt. → Das ist der Ort, wohin sie morgen fährt.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/5272","https://grammis.ids-mannheim.de/systematische-grammatik/2093"],"i18n":{"ar":{"title":"الوصل المكاني: أين، إلى أين، من أين","lead":"تخبرنا هذه الجمل بموقع الحدث أو وجهته أو مصدره. جرّب صياغة سؤال مكاني عن الفعل داخل الوصل لتعرف أي أداة تحتاج.","translation":"هذا هو المكان الذي أقيم فيه / أنتقل إليه / جئت منه.","steps":[{"text":"استعمل wo لموقع الحدث","why":"تسأل `Wo wohne ich?` أي أين أقيم. الفعل `wohnen` يصف الإقامة في المكان. يمكن في أمثلة كثيرة مع اسم مكان استعمال حرف وضمير، مثل `der Ort, an dem ich wohne`."},{"text":"استعمل wohin للوجهة","why":"السؤال `Wohin fährt sie?` يعني إلى أين. الحركة نحو الوجهة هي المقصودة. ويمكن صياغة وجهة إلى بلد مثل `das Land, in das sie zieht`."},{"text":"استعمل woher للمصدر","why":"اسأل `Woher kommt er?`. التركيز على نقطة المنشأ، مثل `die Stadt, aus der er kommt`."},{"text":"احصر هذا الاستعمال في المعنى المكاني","why":"يمكن أن توجد حركة مع `wo` حين نصف مكانها، مثل الجري داخل الحديقة. لو وصفت شخصًا رأيناه تستعمل ضمير وصل يبيّن دوره، فتقول `die` في المثال."}],"explain":["يفيدك التمييز بين الحركة في نطاق والحركة إلى نطاق. `der Park, wo wir laufen` يفيد مكان الجري. `der Park, wohin wir laufen` يفيد وجهته. وإذا كانت جملة الوصل في الوسط فاستأنف الرئيسية بعد الفاصلة الثانية، مثل `Dort, wo wir wohnen, ist es ruhig`."],"pitfall":"إذا كانت تتجه إلى هذا المكان فقل `Das ist der Ort, wohin sie morgen fährt.` تدل `woher` على نقطة الانطلاق.","recall":["ما الأنسب مع `ursprünglich kommen` حين نقصد بلد الأصل؟","`woher`، مثل `das Land, woher sie ursprünglich kommt`. ويمكن القول `das Land, aus dem sie ursprünglich kommt`."],"linkTitles":["فهرس قواعد الوحدة 4 · telc، ص 3","حلول الكتاب الرسمية · telc","أدوات جمل الوصل · grammis","أدوات المكان · grammis"]},"de":{"title":"Relativsätze mit wo, wohin und woher","lead":"Diese Sätze sagen, wo etwas passiert, wohin es geht oder woher es kommt. Stell dir eine Ortsfrage zum Verb im Relativsatz, um das passende Wort zu finden.","steps":[{"text":"Benutze wo für den Ort des Geschehens","why":"Du fragst `Wo wohne ich?`. `wohnen` beschreibt den Aufenthalt an einem Ort. Bei Ortsnomen geht oft auch Präposition + Pronomen: `der Ort, an dem ich wohne`."},{"text":"Benutze wohin für das Ziel","why":"Die Frage `Wohin fährt sie?` zielt auf die Richtung. Gemeint ist die Bewegung zum Ziel. Bei einem Land geht auch `das Land, in das sie zieht`."},{"text":"Benutze woher für die Herkunft","why":"Frag `Woher kommt er?`. Im Fokus steht der Ausgangspunkt, z. B. `die Stadt, aus der er kommt`."},{"text":"Benutze diese Wörter nur für räumliche Bedeutung","why":"Mit `wo` kann es eine Bewegung geben, wenn du ihren Ort beschreibst – z. B. Laufen im Park. Beschreibst du eine Person, die wir gesehen haben, brauchst du ein Relativpronomen, das ihre Rolle zeigt: hier `die`."}],"explain":["Unterscheide Bewegung innerhalb eines Ortes und Bewegung zu einem Ort: `der Park, wo wir laufen` nennt den Ort des Laufens, `der Park, wohin wir laufen` das Ziel. Steht der Relativsatz in der Mitte, geht der Hauptsatz nach dem zweiten Komma weiter: `Dort, wo wir wohnen, ist es ruhig`."],"pitfall":"Fährt sie zu diesem Ort, sag `Das ist der Ort, wohin sie morgen fährt.` `woher` bezeichnet den Ausgangspunkt.","recall":["Was passt zu `ursprünglich kommen`, wenn das Herkunftsland gemeint ist?","`woher`, z. B. `das Land, woher sie ursprünglich kommt`. Man kann auch sagen: `das Land, aus dem sie ursprünglich kommt`."],"linkTitles":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis","Lokale Präpositionen · grammis"]}},"questions":[{"id":"relativ-ort-1","type":"cloze","difficulty":1,"text":"Das ist der Ort, {{1}} wir arbeiten.","blanks":[["wo"]],"i18n":{"ar":{"prompt":"أكمل بأداة الموقع الثابت.","explain":"wo يدل على المكان الذي يحدث فيه العمل.","hints":["اسأل أين نعمل؟"]},"de":{"prompt":"Ergänze das Wort für einen festen Ort.","explain":"`wo` zeigt den Ort, an dem gearbeitet wird.","hints":["Frag: Wo arbeiten wir?"]}}},{"id":"relativ-ort-2","type":"cloze","difficulty":1,"text":"Das ist die Stadt, {{1}} sie morgen fährt.","blanks":[["wohin"]],"i18n":{"ar":{"prompt":"أكمل بأداة الوجهة.","explain":"wohin يدل على اتجاه الحركة نحو المدينة.","hints":["اسأل إلى أين تتجه؟"]},"de":{"prompt":"Ergänze das Wort für ein Ziel.","explain":"`wohin` zeigt die Richtung der Bewegung zur Stadt.","hints":["Frag: Wohin fährt sie?"]}}},{"id":"relativ-ort-3","type":"mcq","difficulty":1,"options":["das Land, woher er kommt","das Land, wohin er fährt","das Land, wo er wohnt"],"answer":0,"i18n":{"ar":{"prompt":"أي صيغة تصف بلد الأصل؟","explain":"woher يحدد المنشأ. wohin للوجهة وwo للمكان.","hints":["فكّر في نقطة البداية."]},"de":{"prompt":"Welche Form beschreibt das Herkunftsland?","explain":"`woher` bestimmt die Herkunft, `wohin` das Ziel, `wo` den Ort.","hints":["Denk an den Ausgangspunkt."]}}},{"id":"relativ-ort-4","type":"cloze","difficulty":2,"text":"der Park, {{1}} wir spazieren gehen (داخل الحديقة) · der Park, {{2}} wir fahren (إليها)","blanks":[["wo"],["wohin"]],"i18n":{"ar":{"prompt":"أكمل بأداتين مختلفتين.","explain":"المشي داخل الحديقة يحدد المكان، والذهاب إليها يحدد الوجهة.","hints":["قد توجد حركة حتى عند وصف موقع ثابت."]},"de":{"prompt":"Ergänze zwei verschiedene Wörter.","explain":"Spazieren im Park nennt den Ort, zum Park gehen das Ziel.","hints":["Auch wenn man einen festen Ort beschreibt, kann es eine Bewegung geben."],"text":"der Park, {{1}} wir spazieren gehen (im Park) · der Park, {{2}} wir fahren (dorthin)"}}},{"id":"relativ-ort-5","type":"mcq","difficulty":2,"options":["die Person, die wir gesehen haben","die Person, wo wir gesehen haben","die Person, wohin wir gesehen haben"],"answer":0,"i18n":{"ar":{"prompt":"أي وصل قياسي يصف الشخص الذي رأيناه؟","explain":"die ضمير الوصل في أكوزاتيف المؤنث. wo وwohin تعبّران عن علاقة مكانية هنا.","hints":["الشخص مفعول مباشر في الوصل."]},"de":{"prompt":"Welcher Standard-Relativsatz beschreibt die Person, die wir gesehen haben?","explain":"`die` ist das Relativpronomen im Akkusativ feminin. `wo` und `wohin` drücken hier eine räumliche Beziehung aus.","hints":["Die Person ist im Relativsatz das Akkusativobjekt."]}}},{"id":"relativ-ort-6","type":"order","difficulty":2,"items":["woher","sie","ursprünglich","kommt"],"i18n":{"ar":{"prompt":"رتّب الجزء المكاني بعد die Stadt وابدأ بأداة المصدر. ضع sie قبل ursprünglich.","explain":"woher تدل على الأصل. يأتي kommt في نهاية الجملة التابعة.","hints":["اجعل الفعل المصرف يغلق الوصل."]},"de":{"prompt":"Ordne den Ortsteil nach `die Stadt` und beginne mit dem Herkunftswort. Setz `sie` vor `ursprünglich`.","explain":"`woher` zeigt die Herkunft. `kommt` steht am Ende des Nebensatzes.","hints":["Das konjugierte Verb schließt den Relativsatz."]}}},{"id":"relativ-ort-7","type":"text","difficulty":3,"answer":"Das ist die Stadt, aus der sie kommt.","i18n":{"ar":{"prompt":"أعد صياغة Das ist die Stadt, woher sie kommt باستعمال aus وضمير وصل.","explain":"تحل aus der محل woher مع الحفاظ على معنى المصدر، ويبقى kommt في الآخر.","hints":["تطلب aus الداتيف. Stadt مؤنث."]},"de":{"prompt":"Formuliere `Das ist die Stadt, woher sie kommt` mit `aus` und einem Relativpronomen.","explain":"`aus der` ersetzt `woher` und behält die Bedeutung der Herkunft; `kommt` bleibt am Ende.","hints":["`aus` verlangt den Dativ. `Stadt` ist feminin."]}}},{"id":"relativ-ort-8","type":"text","difficulty":3,"answer":"Das ist der Ort, wohin sie morgen fährt.","context":"Das ist der Ort, woher sie morgen hinfährt.","i18n":{"ar":{"prompt":"صحّح أداة الوصل حتى تعني أن هذا المكان هو وجهة رحلتها غدًا.","explain":"إذا كانت تتجه إلى هذا المكان فقل `Das ist der Ort, wohin sie morgen fährt.` تدل `woher` على نقطة الانطلاق.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere das Wort im Relativsatz, sodass der Ort das Ziel ihrer Fahrt morgen ist.","explain":"Fährt sie zu diesem Ort, sag `Das ist der Ort, wohin sie morgen fährt.` `woher` bezeichnet den Ausgangspunkt.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"relativ-ort-9","type":"text","difficulty":2,"answer":"`woher`، مثل `das Land, woher sie ursprünglich kommt`. ويمكن القول `das Land, aus dem sie ursprünglich kommt`.","i18n":{"ar":{"prompt":"ما الأنسب مع `ursprünglich kommen` حين نقصد بلد الأصل؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Was passt zu `ursprünglich kommen`, wenn das Herkunftsland gemeint ist?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"relativ-was","level":"B1.2","island":"relativsaetze","order":6,"prereqs":["relativ-dativ"],"emoji":"❔","german":"Relativsätze mit was","source":{"lektion":8,"kind":"toc"},"pattern":["alles / nichts / etwas / das",",","was","…","Verb am Ende"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","alles"]]},{"k":"rel","parts":[["c","was"],["mf","ich"],["ve","weiß"]]},{"k":"rel","parts":[["c","worüber"],["mf","wir lange"],["ve","gesprochen haben"]]}],"example":"Das ist alles, was ich weiß.","stepExamples":["Das ist der Film, den ich gesehen habe.","Das ist alles, was ich weiß.","Das ist das Beste, was mir passiert ist.","Sie hat die Prüfung bestanden, was mich sehr freut.","Es gibt etwas, worüber ich mit dir sprechen möchte."],"pitfallPair":"Das ist alles, das ich weiß. → Das ist alles, was ich weiß.","links":["https://grammis.ids-mannheim.de/progr%40mm/6869","https://grammis.ids-mannheim.de/fragen/131"],"i18n":{"ar":{"title":"جملة الوصل بـ was","lead":"بعد اسم محدد مثل `der Film` تقول `den`. لكن بعد كلمات مثل `alles` و`nichts` و`etwas`، أو حين تشير إلى جملة كاملة، تحتاج إلى `was`. ستتعلم متى تختار `was` بدل `das`.","translation":"هذا كل ما أعرفه.","steps":[{"text":"تذكّر جملة الوصل العادية","why":"حين تشير إلى اسم له جنس واضح تختار `der` أو `die` أو `das` بحسب جنسه وحالته. هنا `den Film` مفعول به مذكر."},{"text":"بعد alles و nichts و etwas استعمل was","why":"هذه الكلمات لا تشير إلى شيء محدد له جنس، لذلك نقول `was`. والفعل المصرف `weiß` يقف في آخر الجملة كما في كل جملة وصل."},{"text":"بعد صيغة التفضيل المحايدة استعمل was أيضًا","why":"`das Beste` و`das Schönste` و`das Einzige` تشير إلى شيء عام غير محدد، فتأتي بعدها `was`."},{"text":"حين تشير إلى الجملة كلها استعمل was","why":"هنا لا يفرح الشخص بالامتحان نفسه، بل بخبر النجاح كله. `was` تشير إلى الجملة الرئيسية كاملة، وتأتي بعدها دائمًا."},{"text":"مع حرف جر تصبح was كلمة تبدأ بـ wo","why":"الفعل `sprechen über` يحتاج إلى حرف جر، فتصير `was` كلمة واحدة: `worüber`. وبالمثل `wofür` و`womit`، ومع حرف علة تضاف `r`: `woran` و`worauf`."}],"explain":["استعمل `was` بعد: `alles` و`nichts` و`etwas` و`vieles` و`einiges` و`das`، وبعد صيغة التفضيل المحايدة (`das Beste`)، وحين تشير إلى جملة كاملة.","في الكلام يُسمع أحيانًا `etwas, das`، وهو مقبول. لكن بعد `alles` و`nichts` وبعد الإشارة إلى الجملة كلها تكون `was` هي الصيغة الصحيحة."],"pitfall":"بعد `alles` لا يوجد اسم له جنس، لذلك لا تصلح `das`. الصحيح `was`.","recall":["لماذا نقول `Er kommt immer zu spät, was mich ärgert`؟","لأن ما يزعجني هو الحدث كله، أي أنه يتأخر دائمًا. `was` تشير إلى الجملة الرئيسية كاملة."],"linkTitles":["جمل الوصل بـ was · grammis","das أم was؟ · grammis"],"table":[["تشير إلى","الأداة","مثال"],["اسم له جنس","der / die / das …","der Film, den ich kenne"],["alles · nichts · etwas · vieles","was","alles, was ich brauche"],["صيغة التفضيل المحايدة","was","das Beste, was es gibt"],["الجملة كلها","was","…, was mich freut"],["مع حرف جر","wo(r) + حرف الجر","nichts, worauf ich warte"]]},"de":{"title":"Relativsätze mit was","lead":"Nach einem Nomen wie `der Film` heißt es `den`. Nach Wörtern wie `alles`, `nichts`, `etwas` oder wenn du dich auf einen ganzen Satz beziehst, brauchst du `was`. Du lernst, wann `was` statt `das` steht.","steps":[{"text":"Erinnere dich an den normalen Relativsatz","why":"Bei einem Nomen mit klarem Genus wählst du `der`, `die` oder `das` nach Genus und Kasus. Hier: `den Film`, maskulin, Akkusativ."},{"text":"Nach alles, nichts und etwas steht was","why":"Diese Wörter zeigen auf nichts Bestimmtes mit Genus. Deshalb heißt es `was`. Das Verb `weiß` steht wie in jedem Relativsatz am Ende."},{"text":"Auch nach einem neutralen Superlativ steht was","why":"`das Beste`, `das Schönste`, `das Einzige` meinen etwas Allgemeines. Danach folgt `was`."},{"text":"Bezieht sich der Satz auf den ganzen Hauptsatz, steht was","why":"Die Person freut sich nicht über die Prüfung, sondern über die ganze Nachricht. `was` zeigt auf den ganzen Hauptsatz und steht immer danach."},{"text":"Mit Präposition wird was zu wo(r)-","why":"`sprechen über` braucht eine Präposition, also `worüber`. Ebenso `wofür`, `womit`. Vor Vokal kommt ein `r` dazu: `woran`, `worauf`."}],"explain":["`was` steht nach `alles`, `nichts`, `etwas`, `vieles`, `einiges`, `das`, nach einem neutralen Superlativ (`das Beste`) und wenn sich der Relativsatz auf einen ganzen Satz bezieht.","Nach `etwas` hört man auch `das`, das ist akzeptiert. Nach `alles`, `nichts` und beim Bezug auf einen ganzen Satz ist `was` richtig."],"pitfall":"Nach `alles` gibt es kein Nomen mit Genus, deshalb passt `das` nicht. Richtig ist `was`.","recall":["Warum heißt es `Er kommt immer zu spät, was mich ärgert`?","Mich ärgert die ganze Tatsache, dass er immer zu spät kommt. `was` bezieht sich auf den ganzen Hauptsatz."],"linkTitles":["Relativsätze mit was · grammis","das oder was? · grammis"],"table":[["Bezug","Relativwort","Beispiel"],["Nomen mit Genus","der / die / das …","der Film, den ich kenne"],["alles · nichts · etwas · vieles","was","alles, was ich brauche"],["neutraler Superlativ","was","das Beste, was es gibt"],["ganzer Satz","was","…, was mich freut"],["mit Präposition","wo(r) + Präposition","nichts, worauf ich warte"]]}},"questions":[{"id":"relativ-was-1","type":"cloze","difficulty":1,"text":"Ich habe nichts gekauft, {{1}} ich nicht brauche.","blanks":[["was"]],"i18n":{"ar":{"prompt":"أكمل بأداة الوصل.","explain":"بعد `nichts` نستعمل `was`.","hints":["هل قبل الفراغ اسم له جنس؟"]},"de":{"prompt":"Ergänze das Relativwort.","explain":"Nach `nichts` steht `was`.","hints":["Steht vor der Lücke ein Nomen mit Genus?"]}}},{"id":"relativ-was-2","type":"cloze","difficulty":1,"text":"Das ist das Schönste, {{1}} ich je gesehen {{2}}.","blanks":[["was"],["habe"]],"i18n":{"ar":{"prompt":"أكمل بأداة الوصل وبالفعل المساعد.","explain":"بعد صيغة التفضيل المحايدة `das Schönste` نقول `was`، والفعل المساعد `habe` في الآخر.","hints":["أين يقف الفعل في جملة الوصل؟"]},"de":{"prompt":"Ergänze Relativwort und Hilfsverb.","explain":"Nach dem neutralen Superlativ `das Schönste` steht `was`, das Hilfsverb `habe` am Ende.","hints":["Wo steht das Verb im Relativsatz?"]}}},{"id":"relativ-was-3","type":"mcq","difficulty":1,"options":["Er hat mir geholfen, was sehr nett war.","Er hat mir geholfen, das sehr nett war.","Er hat mir geholfen, der sehr nett war."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟ المعنى: كانت مساعدته لطيفة جدًا.","explain":"اللطيف هو الأمر كله، أي أنه ساعدني. لذلك تشير `was` إلى الجملة كاملة.","hints":["إلى ماذا تشير جملة الوصل؟"]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Nett war die ganze Handlung, also bezieht sich `was` auf den ganzen Satz.","hints":["Worauf bezieht sich der Relativsatz?"]}}},{"id":"relativ-was-4","type":"cloze","difficulty":2,"text":"Gibt es etwas, {{1}} du dich besonders freust? – Ja, auf den Urlaub, {{2}} ich schon lange warte.","blanks":[["worauf"],["auf den"]],"i18n":{"ar":{"prompt":"أكمل. الفعلان `sich freuen auf` و`warten auf`.","explain":"بعد `etwas` مع حرف الجر نقول `worauf`. أما بعد الاسم `der Urlaub` فنقول `auf den` لأن له جنسًا.","hints":["الفراغ الأول بعد `etwas`، والثاني بعد اسم مذكر."]},"de":{"prompt":"Ergänze. Die Verben sind `sich freuen auf` und `warten auf`.","explain":"Nach `etwas` mit Präposition: `worauf`. Nach dem Nomen `der Urlaub`: `auf den`.","hints":["Die erste Lücke steht nach `etwas`, die zweite nach einem maskulinen Nomen."]}}},{"id":"relativ-was-5","type":"order","difficulty":2,"items":["Ich","verstehe","alles,","was","der Lehrer","sagt."],"i18n":{"ar":{"prompt":"رتّب الجملة.","explain":"الجملة الرئيسية أولًا، ثم `was` والفاعل، والفعل `sagt` في الآخر.","hints":["ابدأ بـ `Ich`."]},"de":{"prompt":"Ordne den Satz.","explain":"Erst der Hauptsatz, dann `was`, das Subjekt und `sagt` am Ende.","hints":["Beginne mit `Ich`."]}}},{"id":"relativ-was-6","type":"mcq","difficulty":2,"options":["das","was","dem"],"answer":0,"i18n":{"ar":{"prompt":"أي كلمة تكمل الجملة؟ `Das ist das Buch, ___ ich dir empfohlen habe.`","explain":"`das Buch` اسم محايد محدد، فنقول `das`. `was` تأتي بعد كلمات غير محددة مثل `alles`.","hints":["هل يوجد اسم له جنس قبل الفراغ؟"]},"de":{"prompt":"Welches Wort passt? `Das ist das Buch, ___ ich dir empfohlen habe.`","explain":"`das Buch` ist ein konkretes neutrales Nomen, also `das`. `was` steht nach unbestimmten Wörtern wie `alles`.","hints":["Steht vor der Lücke ein Nomen mit Genus?"]}}},{"id":"relativ-was-7","type":"text","difficulty":3,"answer":"Der Zug hatte Verspätung, was uns viel Zeit gekostet hat.","i18n":{"ar":{"prompt":"اربط بجملة وصل بـ `was`: `Der Zug hatte Verspätung. Das hat uns viel Zeit gekostet.`","explain":"`was` تشير إلى الجملة الأولى كلها، والفعل المساعد `hat` في الآخر.","hints":["`Das` في الجملة الثانية تشير إلى الجملة الأولى كلها."]},"de":{"prompt":"Verbinde mit einem was-Relativsatz: `Der Zug hatte Verspätung. Das hat uns viel Zeit gekostet.`","explain":"`was` bezieht sich auf den ganzen ersten Satz. Das Hilfsverb `hat` steht am Ende.","hints":["`Das` im zweiten Satz meint den ganzen ersten Satz."]}}},{"id":"relativ-was-8","type":"text","difficulty":3,"context":"Das ist alles, das ich weiß.","answer":"Das ist alles, was ich weiß.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"بعد `alles` لا يوجد اسم له جنس، فنستعمل `was`.","hints":["إلى أي اسم تشير جملة الوصل؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Nach `alles` gibt es kein Nomen mit Genus. Deshalb steht `was`.","hints":["Auf welches Nomen bezieht sich der Relativsatz?"]}}},{"id":"relativ-was-9","type":"text","difficulty":2,"answer":"Das Beste, was ich in Deutschland erlebt habe, war das Oktoberfest.","i18n":{"ar":{"prompt":"اكتب جملة تبدأ بـ `Das Beste, was …`","explain":"مثال: `Das Beste, was ich in Deutschland erlebt habe, war das Oktoberfest.`","hints":["بعد جملة الوصل يأتي الفعل الرئيسي `war`."]},"de":{"prompt":"Schreib einen Satz, der mit `Das Beste, was …` beginnt.","explain":"Zum Beispiel: `Das Beste, was ich in Deutschland erlebt habe, war das Oktoberfest.`","hints":["Nach dem Relativsatz kommt das Hauptverb `war`."]}}}]},{"id":"infinitiv-zu","level":"B1.1","island":"infinitiv-verben","order":1,"prereqs":[],"emoji":"✍️","german":"Infinitiv mit zu","source":{"lektion":2,"kind":"toc"},"pattern":["Hauptsatz",",","… zu + Infinitiv"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","habe"],["ve","vor"]]},{"k":"inf","parts":[["mf","mich morgen"],["ve","zu bewerben"]]}],"example":"Ich habe vor, mich morgen zu bewerben.","stepExamples":["Ich versuche … · Ich habe vor … · Es ist wichtig …","Ich verspreche dir, pünktlich zu kommen.","zu lesen · zu verstehen · anzurufen","Ich habe den Wunsch, im Ausland zu arbeiten.","Ich lerne Deutsch, um im Alltag sicherer zu sprechen."],"pitfallPair":"Ich versuche, morgen zu aufstehen. → Ich versuche, morgen aufzustehen.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/6852","https://grammis.ids-mannheim.de/rechtschreibung/6203"],"i18n":{"ar":{"title":"المصدر مع zu","lead":"بعد أفعال وتعبيرات معيّنة، يمكنك قول ما تنوي فعله أو ما هو مهم لك باستعمال مجموعة مصدرية. شكل المصدر نفسه يبقى ثابتًا.","translation":"أنوي أن أتقدّم غدًا بطلب.","steps":[{"text":"ابحث عن التعبير الذي يفتح المجموعة","why":"بعد تعبيرات مثل `versuchen` و`vorhaben` و`es ist wichtig` تكمل المجموعة المصدرية المعنى. اسأل ماذا يحاول الشخص أو ماذا ينوي."},{"text":"استدل على صاحب الفعل من الجملة","why":"الذي سيأتي هو صاحب الوعد. في `Ich bitte dich, pünktlich zu kommen` المخاطب هو الذي سيأتي. الفعل الأول يساعدك على تحديد الشخص المقصود."},{"text":"ضع zu بحسب نوع الفعل","why":"مع الفعل البسيط وغير القابل للفصل تسبق `zu` المصدر. مع القابل للفصل تدخل بين البادئة والجذر وتكتب الكلمة متصلة، مثل `aufzustehen` و`mitzubringen`."},{"text":"راجع الفاصلة ومكان المجموعة","why":"تفصل الفاصلة المجموعة المصدرية التي تؤدي وظيفة جملة تابعة. هنا تتعلق المجموعة بالاسم `Wunsch`. وتظهر الفاصلة كذلك مع رابط مثل `ohne` أو كلمة تمهّد للمجموعة مثل `daran` في `Sie denkt daran, früher zu gehen`."},{"text":"عبّر عن الهدف بـ um … zu","why":"تجيب مجموعة `um … zu` عن سؤال `Wozu lerne ich Deutsch?`، أي ما الهدف؟ الذي يتعلّم هو نفسه الذي يريد أن يتحدث بثقة أكبر. إذا كان الهدف يخص شخصًا آخر يمكنك التصريح بفاعله في جملة `damit`، مثل `Ich spreche langsam, damit du mich verstehst`. وقارن `Ich hoffe, sicherer zu sprechen` حيث تبيّن المجموعة مضمون الأمل، و`Ich übe, um sicherer zu sprechen` حيث تبيّن الهدف."}],"explain":["قد تظهر `zu` مع فعل ناقص إذا كان هو نفسه آخر المجموعة المصدرية، كما في `Ich hoffe, bald kommen zu können`. أما عندما يكون الفعل الناقص مصرفًا في الرئيسية فتقول `Ich kann bald kommen` بمصدر مجرد. وعند الحاجة إلى ذكر فاعل مختلف صراحةً تستطيع استعمال جملة `dass` حيث يسمح التعبير بذلك، مثل `Ich hoffe, dass du bald kommst`. في الإملاء الحالي تفصل المجموعة المصدرية التي تؤدي وظيفة جملة تابعة بفاصلة. ويجوز في بعض التراكيب القصيرة مثل `Sie versucht(,) zu schlafen` تحليل المصدر وحده على أنه مجموعة كلمات، فتكون الفاصلة جائزة. وفي `Es scheint zu regnen` يشكل الفعلان مسندًا واحدًا وتكتب الجملة بلا فاصلة."],"pitfall":"الفعل `aufstehen` قابل للفصل، لذلك تدخل `zu` بعد `auf`.","recall":["من الذي يرسل الرسالة في `Sie bittet mich, die Mail zu schicken`؟","المتكلم هو الذي يرسلها. `mich` يعيّن صاحب الفعل المطلوب في مجموعة المصدر."],"linkTitles":["فهرس قواعد الوحدة 2 · telc، ص 2","حلول الكتاب الرسمية · telc","المجموعات المصدرية · grammis","الفاصلة في الجمل التابعة · القواعد الإملائية الرسمية"]},"de":{"title":"Infinitiv mit zu","lead":"Nach bestimmten Verben und Ausdrücken kannst du mit einer Infinitivgruppe sagen, was du vorhast oder was dir wichtig ist. Der Infinitiv selbst bleibt dabei unverändert.","steps":[{"text":"Finde den Ausdruck, der die Gruppe öffnet","why":"Nach Ausdrücken wie `versuchen`, `vorhaben` und `es ist wichtig` ergänzt die Infinitivgruppe die Bedeutung. Frag: Was versucht oder plant die Person?"},{"text":"Erschließe aus dem Satz, wer handelt","why":"Wer kommen wird, ist die Person, die das Versprechen gibt. In `Ich bitte dich, pünktlich zu kommen` ist es die angesprochene Person. Das erste Verb zeigt dir, wer gemeint ist."},{"text":"Setz zu je nach Verbtyp","why":"Bei einfachen und untrennbaren Verben steht `zu` vor dem Infinitiv. Bei trennbaren Verben steht es zwischen Präfix und Stamm, und man schreibt alles zusammen: `aufzustehen`, `mitzubringen`."},{"text":"Prüfe Komma und Position der Gruppe","why":"Das Komma trennt eine Infinitivgruppe, die wie ein Nebensatz funktioniert. Hier hängt die Gruppe am Nomen `Wunsch`. Ein Komma steht auch mit einem Einleitewort wie `ohne` oder mit einem Verweiswort wie `daran`: `Sie denkt daran, früher zu gehen`."},{"text":"Drück ein Ziel mit um … zu aus","why":"Die Gruppe `um … zu` beantwortet die Frage `Wozu lerne ich Deutsch?`. Wer lernt, ist auch die Person, die sicherer sprechen will. Betrifft das Ziel eine andere Person, nenne ihr Subjekt in einem `damit`-Satz: `Ich spreche langsam, damit du mich verstehst`. Vergleiche: `Ich hoffe, sicherer zu sprechen` (Inhalt der Hoffnung) und `Ich übe, um sicherer zu sprechen` (Ziel)."}],"explain":["`zu` kann mit einem Modalverb stehen, wenn das Modalverb selbst am Ende der Infinitivgruppe steht: `Ich hoffe, bald kommen zu können`. Ist das Modalverb im Hauptsatz konjugiert, steht der reine Infinitiv: `Ich kann bald kommen`. Willst du ausdrücklich ein anderes Subjekt nennen, benutze – wo es der Ausdruck erlaubt – einen `dass`-Satz: `Ich hoffe, dass du bald kommst`. Nach den aktuellen Regeln trennt man eine Infinitivgruppe, die wie ein Nebensatz funktioniert, mit Komma. Bei kurzen Strukturen wie `Sie versucht(,) zu schlafen` ist das Komma freigestellt. In `Es scheint zu regnen` bilden die beiden Verben ein Prädikat – ohne Komma."],"pitfall":"`aufstehen` ist trennbar, deshalb steht `zu` nach `auf`.","recall":["Wer schickt die Mail in `Sie bittet mich, die Mail zu schicken`?","Die sprechende Person (ich). `mich` bestimmt, wer die gewünschte Handlung in der Infinitivgruppe ausführt."],"linkTitles":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Infinitivgruppen · grammis","Komma bei Nebensätzen · Amtliches Regelwerk"]}},"questions":[{"id":"infinitiv-zu-1","type":"cloze","difficulty":1,"text":"Sie versucht, Deutsch {{1}}.","blanks":[["zu lernen"]],"i18n":{"ar":{"prompt":"أكمل صيغة المصدر من lernen مع zu.","explain":"تكتب zu كلمة منفصلة قبل lernen.","hints":["الفعل بسيط وغير قابل للفصل."]},"de":{"prompt":"Ergänze den Infinitiv von `lernen` mit `zu`.","explain":"`zu` steht als eigenes Wort vor `lernen`.","hints":["Das Verb ist einfach und nicht trennbar."]}}},{"id":"infinitiv-zu-2","type":"cloze","difficulty":1,"text":"Er hat vor, morgen {{1}}.","blanks":[["anzurufen"]],"i18n":{"ar":{"prompt":"أكمل صيغة anrufen مع zu.","explain":"an جزء قابل للفصل، فتأتي zu بعده داخل الكلمة.","hints":["أين تذهب البادئة في صيغة المصدر؟"]},"de":{"prompt":"Ergänze die Form von `anrufen` mit `zu`.","explain":"`an` ist ein trennbares Präfix, deshalb steht `zu` danach im Wort.","hints":["Wohin geht das Präfix im Infinitiv?"]}}},{"id":"infinitiv-zu-3","type":"mcq","difficulty":1,"options":["kommen","zu kommen","zukommen"],"answer":0,"i18n":{"ar":{"prompt":"اختر ما يناسب Ich kann morgen ….","explain":"يطلب kann هنا مصدرًا مجردًا. zu kommen لا يلائم هذا التركيب، وzukommen فعل مختلف.","hints":["kann فعل ناقص مصرف."]},"de":{"prompt":"Was passt zu `Ich kann morgen …`?","explain":"`kann` verlangt hier den reinen Infinitiv. `zu kommen` passt nicht in diese Struktur, und `zukommen` ist ein anderes Verb.","hints":["`kann` ist ein konjugiertes Modalverb."]}}},{"id":"infinitiv-zu-4","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"من المتصل في Ich bitte ihn, anzurufen؟","explain":"المخاطَب بالطلب هو من يُفهم أنه يؤدي الفعل في المصدر.","hints":["حلّل bitte ihn أولًا."],"options":["هو، أي الشخص الذي أطلب منه.","أنا، أي الشخص الذي يطلب.","يتصل الاثنان معًا."]},"de":{"prompt":"Wer ruft an in `Ich bitte ihn, anzurufen`?","explain":"Die Person, die gebeten wird, führt die Handlung im Infinitiv aus.","hints":["Analysiere zuerst `bitte ihn`."],"options":["Er – die Person, die ich bitte.","Ich – die Person, die bittet.","Beide rufen zusammen an."]}}},{"id":"infinitiv-zu-5","type":"cloze","difficulty":2,"text":"Ich hoffe, den Pass {{1}}. · Ich hoffe, morgen {{2}}.","blanks":[["mitzubringen"],["kommen zu können"]],"i18n":{"ar":{"prompt":"أكمل مجموعة المصدر من mitbringen ثم صيغة الاستطاعة من kommen können.","explain":"mit + zu + bringen. في التركيب الثاني تأتي zu قبل können، وهو المصدر الأخير.","hints":["أدخل zu داخل الفعل المنفصل. عند وجود مصدر ناقص ضعه آخرًا."]},"de":{"prompt":"Ergänze die Infinitivgruppe von `mitbringen` und dann die Form von `kommen können`.","explain":"`mit` + `zu` + `bringen`. In der zweiten Struktur steht `zu` vor `können`, dem letzten Infinitiv.","hints":["Setz `zu` in das trennbare Verb. Bei einem Modalverb steht es zuletzt."]}}},{"id":"infinitiv-zu-6","type":"order","difficulty":2,"items":["um","Deutsch","sicherer","zu sprechen"],"i18n":{"ar":{"prompt":"رتّب مجموعة الهدف بعد Ich übe jeden Tag. ضع Deutsch قبل sicherer.","explain":"تبيّن مجموعة um … zu لماذا أتدرّب. تأتي بعد الفاصلة ويغلقها المصدر zu sprechen.","hints":["ابدأ برابط الهدف واختم بصيغة zu مع المصدر."]},"de":{"prompt":"Ordne die Zielgruppe nach `Ich übe jeden Tag`. Setz `Deutsch` vor `sicherer`.","explain":"Die Gruppe `um … zu` zeigt, warum ich übe. Sie steht nach dem Komma und endet mit `zu sprechen`.","hints":["Beginne mit dem Ziel-Wort und ende mit zu + Infinitiv."]}}},{"id":"infinitiv-zu-7","type":"order","difficulty":2,"items":["den Termin","rechtzeitig","abzusagen"],"i18n":{"ar":{"prompt":"رتّب المصدر بعد Sie denkt daran. ضع المفعول قبل المصدر.","explain":"تأتي المكملات قبل abzusagen. وتأتي فاصلة قبل المجموعة بعد daran.","hints":["أبقِ zu داخل الفعل المنفصل."]},"de":{"prompt":"Ordne die Infinitivgruppe nach `Sie denkt daran`. Setz das Objekt vor den Infinitiv.","explain":"Die Ergänzungen stehen vor `abzusagen`. Nach `daran` steht ein Komma vor der Gruppe.","hints":["Lass `zu` im trennbaren Verb."]}}},{"id":"infinitiv-zu-8","type":"text","difficulty":3,"answer":"Sie bittet mich, früh aufzustehen.","i18n":{"ar":{"prompt":"حوّل Sie sagt zu mir: „Bitte steh früh auf!“ إلى جملة تبدأ بـ Sie bittet mich.","explain":"mich يحدّد من يقوم بالفعل. aufstehen يعطي aufzustehen.","hints":["حافظ على الضمير الذي يحدد صاحب الفعل، وحوّل الأمر إلى مصدر."]},"de":{"prompt":"Forme `Sie sagt zu mir: „Bitte steh früh auf!“` in einen Satz um, der mit `Sie bittet mich` beginnt.","explain":"`mich` bestimmt, wer handelt. `aufstehen` wird zu `aufzustehen`.","hints":["Behalte das Pronomen, das zeigt, wer handelt, und mach aus dem Imperativ einen Infinitiv."]}}},{"id":"infinitiv-zu-9","type":"text","difficulty":3,"answer":"Ich versuche, morgen aufzustehen.","context":"Ich versuche, morgen zu aufstehen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الفعل `aufstehen` قابل للفصل، لذلك تدخل `zu` بعد `auf`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`aufstehen` ist trennbar, deshalb steht `zu` nach `auf`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"infinitiv-zu-10","type":"text","difficulty":2,"answer":"المتكلم هو الذي يرسلها. `mich` يعيّن صاحب الفعل المطلوب في مجموعة المصدر.","i18n":{"ar":{"prompt":"من الذي يرسل الرسالة في `Sie bittet mich, die Mail zu schicken`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wer schickt die Mail in `Sie bittet mich, die Mail zu schicken`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"statt-zu","level":"B1.1","island":"infinitiv-verben","order":2,"prereqs":["infinitiv-zu"],"emoji":"🔀","german":"Infinitivsätze mit (an)statt … zu","source":{"lektion":5,"kind":"toc"},"pattern":["Hauptsatz",",","(an)statt … zu + Infinitiv"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","koche"],["mf","zu Hause"]]},{"k":"inf","parts":[["c","statt"],["mf","Essen"],["ve","zu bestellen"]]}],"example":"Ich koche zu Hause, statt Essen zu bestellen.","stepExamples":["Ich koche zu Hause. · Ich bestelle kein Essen.","Ich koche …, statt … zu bestellen.","…, statt Fertiggerichte einzukaufen.","Statt Essen zu bestellen, koche ich zu Hause."],"pitfallPair":"Statt Essen bestellen, ich koche zu Hause. → Statt Essen zu bestellen, koche ich zu Hause.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/6852"],"i18n":{"ar":{"title":"البديل مع statt أو anstatt … zu","lead":"عندما يفعل شخص شيئًا بدلًا من شيء متوقَّع أو مقترح، تستطيع ذكر البديل الذي عدل عنه في مجموعة مصدرية.","translation":"أطبخ في المنزل بدلًا من طلب الطعام.","steps":[{"text":"ميّز الفعل الفعلي عن البديل","why":"تخبر الرئيسية عمّا أفعله. وتبين مجموعة `statt` الفعل الذي يحلّ الطبخ مكانه. في هذا السياق تعني `anstatt` الشيء نفسه."},{"text":"حدّد صاحب الفعلين","why":"في هذا النمط يكون فاعل الفعل المصدر مفهومًا من الرئيسية، وهنا هو `ich`. إذا أردت التصريح بفاعل آخر تستطيع استعمال `statt dass`، كما في `Ich koche, statt dass du Essen bestellst`."},{"text":"ضع الفاصلة والمصدر","why":"تجب الفاصلة مع هذا الرابط. إذا كان الفعل قابلًا للفصل فأدخل `zu` بعد البادئة. لذلك نحصل على `einzukaufen` من `einkaufen`."},{"text":"قدّم مجموعة البديل إذا أردت إبرازها","why":"تشغل المجموعة المصدرية الموقع الأول للجملة. بعد الفاصلة يأتي `koche` ثم الفاعل `ich`."}],"explain":["في `statt eines Fertiggerichts` تأتي مجموعة اسمية مباشرةً بعد `statt`. وفي `statt ein Fertiggericht zu kaufen` تأتي مجموعة مصدرية فيها اسم هو مفعول `kaufen`. لهذا قد ترى جينيتيفًا في المثال الأول وأكوزاتيفًا داخل المجموعة في الثاني."],"pitfall":"تحتاج مجموعة المصدر إلى `zu`، ويأتي الفعل المصرف `koche` بعد الفاصلة.","recall":["ما الفعل الذي يحصل في `Sie radelt zur Arbeit, statt den Bus zu nehmen`؟","تذهب بالدرّاجة. ركوب الحافلة هو البديل الذي عدلت عنه."],"linkTitles":["فهرس قواعد الوحدة 5 · telc، ص 3","حلول الكتاب الرسمية · telc","المجموعات المصدرية · grammis"]},"de":{"title":"(an)statt … zu","lead":"Wenn jemand etwas anderes tut als das, was erwartet oder vorgeschlagen wurde, kannst du die Alternative, auf die er verzichtet, in einer Infinitivgruppe nennen.","steps":[{"text":"Unterscheide die echte Handlung von der Alternative","why":"Der Hauptsatz sagt, was ich tue. Die `statt`-Gruppe zeigt, welche Handlung das Kochen ersetzt. `anstatt` bedeutet hier dasselbe."},{"text":"Bestimme, wer beide Handlungen macht","why":"In diesem Muster ergibt sich das Subjekt des Infinitivs aus dem Hauptsatz – hier `ich`. Willst du ein anderes Subjekt nennen, benutze `statt dass`: `Ich koche, statt dass du Essen bestellst`."},{"text":"Setz Komma und Infinitiv","why":"Bei dieser Konjunktion steht ein Komma. Ist das Verb trennbar, kommt `zu` nach dem Präfix: aus `einkaufen` wird `einzukaufen`."},{"text":"Stell die Alternative nach vorn, wenn du sie betonen willst","why":"Die Infinitivgruppe besetzt Position 1. Nach dem Komma kommt `koche`, dann das Subjekt `ich`."}],"explain":["In `statt eines Fertiggerichts` folgt nach `statt` direkt eine Nominalgruppe. In `statt ein Fertiggericht zu kaufen` folgt eine Infinitivgruppe, in der das Nomen Objekt von `kaufen` ist. Deshalb siehst du im ersten Beispiel einen Genitiv und im zweiten einen Akkusativ in der Gruppe."],"pitfall":"Die Infinitivgruppe braucht `zu`, und das konjugierte Verb `koche` steht nach dem Komma.","recall":["Was passiert tatsächlich in `Sie radelt zur Arbeit, statt den Bus zu nehmen`?","Sie fährt mit dem Rad. Den Bus zu nehmen ist die Alternative, auf die sie verzichtet."],"linkTitles":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Infinitivgruppen · grammis"]}},"questions":[{"id":"statt-zu-1","type":"cloze","difficulty":1,"text":"Sie kocht, statt Essen {{1}}. (bestellen)","blanks":[["zu bestellen"]],"i18n":{"ar":{"prompt":"أكمل المصدر البسيط مع zu.","explain":"الفعل bestellen غير قابل للفصل. تكتب zu منفصلة.","hints":["ضع zu قبل المصدر البسيط."]},"de":{"prompt":"Ergänze den einfachen Infinitiv mit `zu`.","explain":"`bestellen` ist nicht trennbar. Du schreibst `zu` getrennt.","hints":["Setz `zu` vor den einfachen Infinitiv."]}}},{"id":"statt-zu-2","type":"cloze","difficulty":1,"text":"Wir kochen frisch, anstatt Tiefkühlpizza {{1}}. (aufwärmen)","blanks":[["aufzuwärmen"]],"i18n":{"ar":{"prompt":"أكمل المصدر المنفصل.","explain":"البادئة auf تسبق zu داخل الكلمة.","hints":["أدخل zu بين جزأي aufwärmen."]},"de":{"prompt":"Ergänze den trennbaren Infinitiv.","explain":"Das Präfix `auf` steht vor `zu` im Wort.","hints":["Setz `zu` zwischen die beiden Teile von `aufwärmen`."]}}},{"id":"statt-zu-3","type":"mcq","difficulty":1,"answer":0,"i18n":{"ar":{"prompt":"أي نشاط يحدث فعلًا في Er läuft zur Arbeit, statt den Bus zu nehmen؟","explain":"läuft يحدد الفعل الفعلي. ركوب الحافلة هو البديل المتروك.","hints":["ابحث عن الفعل المصرف في الرئيسية."],"options":["يمشي إلى العمل.","يستقل الحافلة.","يمشي ويستقل الحافلة في الوقت نفسه."]},"de":{"prompt":"Was macht er tatsächlich in `Er läuft zur Arbeit, statt den Bus zu nehmen`?","explain":"`läuft` nennt die echte Handlung. Den Bus zu nehmen ist die verworfene Alternative.","hints":["Such das konjugierte Verb im Hauptsatz."],"options":["Er geht zu Fuß zur Arbeit.","Er nimmt den Bus.","Er geht zu Fuß und nimmt gleichzeitig den Bus."]}}},{"id":"statt-zu-4","type":"order","difficulty":2,"items":["Statt","Essen","zu bestellen,","koche","ich","heute."],"i18n":{"ar":{"prompt":"رتّب بدءًا من Statt. اجعل ich فاعل الجزء الرئيسي.","explain":"بعد الفاصلة يأتي koche ثم ich. الفعل المصدر في الجزء الأول هو zu bestellen.","hints":["مجموعة البديل تتصدر الجملة كاملة."]},"de":{"prompt":"Ordne den Satz und beginne mit `Statt`. `ich` ist das Subjekt des Hauptsatzes.","explain":"Nach dem Komma kommt `koche`, dann `ich`. Der Infinitiv im ersten Teil ist `zu bestellen`.","hints":["Die Alternativgruppe steht komplett am Anfang."]}}},{"id":"statt-zu-5","type":"mcq","difficulty":2,"options":["Ich koche, statt dass du Essen bestellst.","Ich koche, statt Essen zu bestellen.","Ich koche, statt eines Fertiggerichts."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تصرّح بفاعل مختلف في البديل؟","explain":"statt dass du تُظهر du في الجملة التابعة، أما مجموعة المصدر فلا تذكر فاعلًا صريحًا.","hints":["ابحث عن فاعل ظاهر بعد الرابط."]},"de":{"prompt":"Welcher Satz nennt in der Alternative ein anderes Subjekt?","explain":"`statt dass du` zeigt `du` im Nebensatz. Die Infinitivgruppe nennt kein eigenes Subjekt.","hints":["Such ein sichtbares Subjekt nach der Konjunktion."]}}},{"id":"statt-zu-6","type":"cloze","difficulty":2,"text":"Er radelt, statt den Bus {{1}}. · Er radelt, statt dass ihn jemand {{2}}. (nehmen / fahren)","blanks":[["zu nehmen"],["fährt"]],"i18n":{"ar":{"prompt":"أكمل شكل الفعل في تركيبَي المصدر والتابع.","explain":"في المجموعة المصدرية نكتب zu nehmen. في التابعة يتصرف fahren مع jemand ويأتي fährt أخيرًا.","hints":["قارن المصدر مع فعل يتصرف بحسب jemand."]},"de":{"prompt":"Ergänze die Verbform in der Infinitivgruppe und im Nebensatz.","explain":"In der Infinitivgruppe schreiben wir `zu nehmen`. Im Nebensatz wird `fahren` mit `jemand` konjugiert, und `fährt` steht am Ende.","hints":["Vergleiche den Infinitiv mit einem Verb, das sich nach `jemand` richtet."]}}},{"id":"statt-zu-7","type":"text","difficulty":3,"answer":"Sie nimmt die Treppe, anstatt mit dem Aufzug zu fahren.","i18n":{"ar":{"prompt":"ادمج Sie nimmt die Treppe وSie fährt nicht mit dem Aufzug مع anstatt في نهاية الجملة.","explain":"المجموعة anstatt … zu تعرض البديل المتروك، وصاحب الفعل مفهوم من Sie.","hints":["الفعل المتروك هو fahren. ضع الفاصلة قبل anstatt."]},"de":{"prompt":"Verbinde `Sie nimmt die Treppe` und `Sie fährt nicht mit dem Aufzug` mit `anstatt` am Satzende.","explain":"Die Gruppe `anstatt … zu` zeigt die verworfene Alternative; wer handelt, ergibt sich aus `Sie`.","hints":["Die verworfene Handlung ist `fahren`. Setz das Komma vor `anstatt`."]}}},{"id":"statt-zu-8","type":"text","difficulty":3,"answer":"Statt Essen zu bestellen, koche ich zu Hause.","context":"Statt Essen bestellen, ich koche zu Hause.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"تحتاج مجموعة المصدر إلى `zu`، ويأتي الفعل المصرف `koche` بعد الفاصلة.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Infinitivgruppe braucht `zu`, und das konjugierte Verb `koche` steht nach dem Komma.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"statt-zu-9","type":"text","difficulty":2,"answer":"تذهب بالدرّاجة. ركوب الحافلة هو البديل الذي عدلت عنه.","i18n":{"ar":{"prompt":"ما الفعل الذي يحصل في `Sie radelt zur Arbeit, statt den Bus zu nehmen`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Was passiert tatsächlich in `Sie radelt zur Arbeit, statt den Bus zu nehmen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"ohne-zu","level":"B1.1","island":"infinitiv-verben","order":3,"prereqs":["infinitiv-zu"],"emoji":"🍵","german":"Infinitivsätze mit ohne … zu","source":{"lektion":5,"kind":"toc"},"pattern":["Hauptsatz",",","ohne … zu + Infinitiv"],"frames":[{"k":"main","parts":[["vf","Sie"],["v","ging"]]},{"k":"inf","parts":[["c","ohne"],["mf","sich"],["ve","zu verabschieden"]]}],"example":"Sie ging, ohne sich zu verabschieden.","stepExamples":["Sie ging. · Sie verabschiedete sich nicht.","…, ohne sich zu verabschieden.","Sie isst, ohne vorher aufzuwärmen.","Sie ging, ohne dass ich es bemerkte."],"pitfallPair":"Sie ging ohne sich verabschieden. → Sie ging, ohne sich zu verabschieden.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/6852"],"i18n":{"ar":{"title":"فعل يحدث دون فعل آخر","lead":"يصف هذا التركيب فعلاً أساسيًا مع غياب فعل قد يصاحبه أو يُتوقع قبله. يساعدك تحديد صاحب الفعل على اختيار البنية.","translation":"غادرت دون أن تودّع.","steps":[{"text":"افصل ما حصل عما لم يحصل","why":"حدثت المغادرة وغاب الوداع. تحمل `ohne` معنى الغياب بالفعل، لذلك لا تحتاج إلى `nicht` للتعبير عن هذا المعنى هنا."},{"text":"اربط الفعل المحذوف بالمصدر","why":"يشير `sich` إلى الشخص نفسه في المثال. إذا كان الفاعل `ich` تقول `ohne mich zu verabschieden`. أبقِ علامة الانعكاس مع الفعل الذي يتطلبها."},{"text":"ضع الفعل القابل للفصل في صورة المصدر الصحيحة","why":"مع `aufwärmen` تصبح الصيغة `aufzuwärmen`. وإذا ذكرت الطعام صراحةً تستطيع القول `ohne das Essen vorher aufzuwärmen`."},{"text":"اختر ohne dass عند التصريح بفاعل مختلف","why":"غادرت هي، وأنا الذي لم يلاحظ. بعد `ohne dass` توجد جملة تابعة بفاعل صريح وفعل مصرف في النهاية. ومع مجموعة المصدر توضع فاصلة كذلك."}],"explain":["في `Sie ging ohne Mantel` تأتي بعد `ohne` مجموعة اسمية في الأكوزاتيف. في `Sie ging, ohne den Mantel anzuziehen` يصف المصدر غياب فعل ارتداء المعطف. أما `statt den Mantel anzuziehen` فيبرز المعطف بوصفه بديلًا لسلوك آخر يذكره السياق. استعمل الرابط وفق العلاقة التي تريد التعبير عنها."],"pitfall":"تبدأ المجموعة بـ `ohne` بعد فاصلة وتحتاج إلى `zu` قبل `verabschieden`.","recall":["من الذي لم يقرأ المكونات في `Er kauft den Saft, ohne die Zutaten zu lesen`؟","المشتري نفسه. وتوضح `ohne dass` أي فاعل مختلف إذا دعت الحاجة."],"linkTitles":["فهرس قواعد الوحدة 5 · telc، ص 3","حلول الكتاب الرسمية · telc","المجموعات المصدرية · grammis"]},"de":{"title":"ohne … zu","lead":"Diese Struktur beschreibt eine Haupthandlung, bei der eine andere Handlung fehlt, die man erwarten würde. Wer handelt, entscheidet über die passende Struktur.","steps":[{"text":"Trenne, was passiert ist, von dem, was nicht passiert ist","why":"Sie ist gegangen, aber der Abschied fehlte. `ohne` trägt die Bedeutung des Fehlens schon in sich – du brauchst hier kein `nicht`."},{"text":"Verbinde die fehlende Handlung mit dem Infinitiv","why":"`sich` verweist im Beispiel auf dieselbe Person. Ist das Subjekt `ich`, sagst du `ohne mich zu verabschieden`. Das Reflexivpronomen bleibt beim Verb, das es braucht."},{"text":"Bring trennbare Verben in die richtige Infinitivform","why":"Aus `aufwärmen` wird `aufzuwärmen`. Nennst du das Essen ausdrücklich, kannst du sagen: `ohne das Essen vorher aufzuwärmen`."},{"text":"Wähle ohne dass für ein anderes Subjekt","why":"Sie ist gegangen, und ich habe es nicht bemerkt. Nach `ohne dass` folgt ein Nebensatz mit eigenem Subjekt und dem konjugierten Verb am Ende. Auch vor der Infinitivgruppe steht ein Komma."}],"explain":["In `Sie ging ohne Mantel` folgt nach `ohne` eine Nominalgruppe im Akkusativ. In `Sie ging, ohne den Mantel anzuziehen` beschreibt der Infinitiv, dass das Anziehen fehlt. `statt den Mantel anzuziehen` stellt das Anziehen dagegen als Alternative zu einem anderen Verhalten im Kontext dar. Wähle die Konjunktion nach der Beziehung, die du ausdrücken willst."],"pitfall":"Die Gruppe beginnt nach einem Komma mit `ohne` und braucht `zu` vor `verabschieden`.","recall":["Wer hat in `Er kauft den Saft, ohne die Zutaten zu lesen` die Zutaten nicht gelesen?","Der Käufer selbst. Mit `ohne dass` könntest du bei Bedarf ein anderes Subjekt nennen."],"linkTitles":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Infinitivgruppen · grammis"]}},"questions":[{"id":"ohne-zu-1","type":"cloze","difficulty":1,"text":"Er nimmt das Brot, ohne vorher {{1}}.","blanks":[["zu fragen"]],"i18n":{"ar":{"prompt":"أكمل المصدر من fragen.","explain":"نكتب zu قبل fragen في المجموعة.","hints":["المصدر غير قابل للفصل."]},"de":{"prompt":"Ergänze den Infinitiv von `fragen`.","explain":"In der Gruppe schreiben wir `zu` vor `fragen`.","hints":["Das Verb ist nicht trennbar."]}}},{"id":"ohne-zu-2","type":"cloze","difficulty":1,"text":"Ich ging, ohne {{1}} zu verabschieden.","blanks":[["mich"]],"i18n":{"ar":{"prompt":"أكمل ضمير الانعكاس المناسب مع ich.","explain":"صاحب الفعل هو ich، فيلائمه ضمير الانعكاس mich.","hints":["من الذي كان يمكن أن يودّع؟"]},"de":{"prompt":"Ergänze das passende Reflexivpronomen für `ich`.","explain":"Wer handelt, ist `ich` – dazu passt das Reflexivpronomen `mich`.","hints":["Wer hätte sich verabschieden können?"]}}},{"id":"ohne-zu-3","type":"mcq","difficulty":1,"answer":0,"i18n":{"ar":{"prompt":"ما الذي لم يحصل في Sie ging, ohne zu bezahlen؟","explain":"حصلت المغادرة حسب ging. لم يحصل الدفع حسب ohne zu bezahlen.","hints":["المجموعة بعد ohne تصف الفعل الغائب."],"options":["الدفع.","المغادرة.","الدفع والمغادرة."]},"de":{"prompt":"Was ist in `Sie ging, ohne zu bezahlen` nicht passiert?","explain":"Laut `ging` ist sie gegangen. Laut `ohne zu bezahlen` hat sie nicht bezahlt.","hints":["Die Gruppe nach `ohne` beschreibt die fehlende Handlung."],"options":["Das Bezahlen.","Das Gehen.","Das Bezahlen und das Gehen."]}}},{"id":"ohne-zu-4","type":"cloze","difficulty":2,"text":"Er isst das Essen, ohne es {{1}}.","blanks":[["aufzuwärmen"]],"i18n":{"ar":{"prompt":"أكمل المصدر المنفصل من aufwärmen.","explain":"auf + zu + wärmen تصبح كلمة واحدة.","hints":["احتفظ بالبادئة وأدخل zu داخل الكلمة."]},"de":{"prompt":"Ergänze den trennbaren Infinitiv von `aufwärmen`.","explain":"`auf` + `zu` + `wärmen` wird ein Wort.","hints":["Behalte das Präfix und setz `zu` ins Wort."]}}},{"id":"ohne-zu-5","type":"mcq","difficulty":2,"options":["Ich ging, ohne dass er mich bemerkte.","Ich ging, ohne ihn zu bemerken.","Ich ging, ohne mich zu bemerken."],"answer":0,"i18n":{"ar":{"prompt":"كيف تقول «غادرت دون أن يلاحظني هو»؟","explain":"ohne dass يتيح ذكر er فاعلًا. الصيغتان المصدريتان تجعلان ich صاحب فعل الملاحظة.","hints":["المغادر والملاحظ شخصان مختلفان."]},"de":{"prompt":"Wie sagst du „Ich bin gegangen, ohne dass er mich bemerkt hat“?","explain":"Mit `ohne dass` kannst du `er` als Subjekt nennen. Die Infinitivformen machen `ich` zur Person, die bemerkt.","hints":["Wer geht und wer bemerkt, sind verschiedene Personen."]}}},{"id":"ohne-zu-6","type":"order","difficulty":2,"items":["Ohne","sich","zu verabschieden,","ging","sie","nach Hause."],"i18n":{"ar":{"prompt":"رتّب مع تقديم المجموعة المصدرية. ضع الفاعل بعد فعل الرئيسية.","explain":"zu verabschieden ينهي المصدرية. ging يبدأ الرئيسية لأن المصدرية تحتل الموقع الأول.","hints":["ابدأ بالمجموعة كلها ثم ضع الفعل المصرف بعد الفاصلة."]},"de":{"prompt":"Ordne und stell die Infinitivgruppe nach vorn. Setz das Subjekt nach das Verb des Hauptsatzes.","explain":"`zu verabschieden` beendet die Infinitivgruppe. `ging` eröffnet den Hauptsatz, weil die Gruppe Position 1 besetzt.","hints":["Beginne mit der ganzen Gruppe und setz das konjugierte Verb nach das Komma."]}}},{"id":"ohne-zu-7","type":"text","difficulty":3,"answer":"Er trinkt den Saft, ohne die Zutaten zu lesen.","i18n":{"ar":{"prompt":"ادمج Er trinkt den Saft وEr liest die Zutaten nicht مع ohne … zu.","explain":"اصنع المجموعة ohne die Zutaten zu lesen، وافصلها بفاصلة.","hints":["الفاعل واحد. معنى النفي يأتي من الرابط."]},"de":{"prompt":"Verbinde `Er trinkt den Saft` und `Er liest die Zutaten nicht` mit ohne … zu.","explain":"Bilde die Gruppe `ohne die Zutaten zu lesen` und trenne sie mit Komma ab.","hints":["Das Subjekt ist dasselbe. Die Verneinung kommt aus der Konjunktion."]}}},{"id":"ohne-zu-8","type":"text","difficulty":3,"answer":"Sie ging, ohne sich zu verabschieden.","context":"Sie ging ohne sich verabschieden.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"تبدأ المجموعة بـ `ohne` بعد فاصلة وتحتاج إلى `zu` قبل `verabschieden`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Gruppe beginnt nach einem Komma mit `ohne` und braucht `zu` vor `verabschieden`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"ohne-zu-9","type":"text","difficulty":2,"answer":"المشتري نفسه. وتوضح `ohne dass` أي فاعل مختلف إذا دعت الحاجة.","i18n":{"ar":{"prompt":"من الذي لم يقرأ المكونات في `Er kauft den Saft, ohne die Zutaten zu lesen`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wer hat in `Er kauft den Saft, ohne die Zutaten zu lesen` die Zutaten nicht gelesen?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"brauchen","level":"B1.2","island":"infinitiv-verben","order":4,"prereqs":["infinitiv-zu"],"emoji":"🧺","german":"Das Verb brauchen","source":{"lektion":9,"kind":"toc"},"pattern":["nicht / nur","+","brauchen","+","zu","+","Infinitiv"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","brauche"],["mf","einen neuen Laptop"]]},{"k":"main","parts":[["vf","Du"],["v","brauchst"],["mf","nicht"],["ve","zu warten"]]},{"k":"main","parts":[["vf","Sie"],["v","brauchen"],["mf","nur"],["ve","anzurufen"]]}],"example":"Du musst nicht warten. → Du brauchst nicht zu warten.","stepExamples":["Ich brauche einen neuen Laptop.","Du musst heute nicht kommen.","Du brauchst heute nicht zu kommen.","Sie brauchen nur anzurufen.","Du musst morgen kommen."],"pitfallPair":"Du brauchst morgen zu kommen. → Du musst morgen kommen.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/1558","https://grammis.ids-mannheim.de/fragen/98"],"i18n":{"ar":{"title":"الفعل brauchen بمعنييه","lead":"تعرف `brauchen` بمعنى «يحتاج إلى شيء». لكن مع النفي و`zu` يصير معناه «لا يلزم»، ويحل محل `nicht müssen`. ستتعلم متى يصح هذا الاستعمال ومتى لا يصح.","translation":"لا يلزمك أن تنتظر.","steps":[{"text":"brauchen + مفعول به: يحتاج إلى","why":"هذا هو المعنى المعروف: `brauchen` مع اسم في حالة `Akkusativ`."},{"text":"انطلق من nicht müssen","why":"`Du musst nicht kommen` تعني أن المجيء غير ضروري. لا تعني أنه ممنوع."},{"text":"استبدل nicht müssen بـ nicht brauchen zu","why":"المعنى نفسه: `Du brauchst nicht zu kommen`. الفعل `brauchen` في الموقع الثاني، والمصدر مع `zu` في آخر الجملة."},{"text":"مع nur يعني «يكفي أن»","why":"`Sie brauchen nur anzurufen` تعني «كل ما عليك أن تتصل». ومع الأفعال المنفصلة تقف `zu` في وسطها: `anzurufen`."},{"text":"للإلزام المثبت استعمل müssen","why":"`brauchen zu` لا يأتي إلا مع `nicht` أو `kein` أو `nur` أو `erst`. حين يكون الأمر لازمًا فعلًا تقول `müssen`."}],"explain":["`brauchen + zu + مصدر` ينفي الضرورة أو يقلّلها. والكلمات التي تفتحه هي: `nicht` و`kein` و`nur` و`erst` و`kaum`.","في الكلام اليومي تسقط `zu` كثيرًا: `Du brauchst nicht warten`. يفهمها الجميع، لكن الصيغة مع `zu` أفضل في الكتابة وفي الامتحان."],"pitfall":"`brauchen zu` لا تأتي في جملة مثبتة بمعنى «يجب». هنا الصحيح `müssen`.","recall":["حوّل إلى `brauchen`: `Ihr müsst keine Angst haben.`","`Ihr braucht keine Angst zu haben.` النفي `keine` يسمح باستعمال `brauchen zu`."],"linkTitles":["brauchen ضمن الأفعال الناقصة · grammis","مع zu أو بدونها؟ · grammis"],"table":[["الصيغة","المعنى","مثال"],["brauchen + Akkusativ","يحتاج إلى","Ich brauche Hilfe."],["nicht / kein … brauchen zu","لا يلزم","Du brauchst nicht zu warten."],["nur … brauchen zu","يكفي أن","Du brauchst nur zu klingeln."],["müssen","يجب","Du musst morgen kommen."]]},"de":{"title":"Das Verb brauchen","lead":"Du kennst `brauchen` als „etwas nötig haben“. Mit Verneinung und `zu` bedeutet es aber „nicht müssen“. Du lernst, wann diese Konstruktion passt und wann nicht.","steps":[{"text":"brauchen + Akkusativ: etwas nötig haben","why":"Das ist die bekannte Bedeutung: `brauchen` mit einem Akkusativobjekt."},{"text":"Geh von nicht müssen aus","why":"`Du musst nicht kommen` heißt: Es ist nicht nötig. Es ist nicht verboten."},{"text":"Ersetze nicht müssen durch nicht brauchen zu","why":"Gleiche Bedeutung: `Du brauchst nicht zu kommen`. `brauchen` steht auf Position 2, der Infinitiv mit `zu` am Ende."},{"text":"Mit nur heißt es „es reicht, wenn“","why":"`Sie brauchen nur anzurufen` heißt: Mehr müssen Sie nicht tun. Bei trennbaren Verben steht `zu` in der Mitte: `anzurufen`."},{"text":"Für eine echte Pflicht nimmst du müssen","why":"`brauchen zu` steht nur mit `nicht`, `kein`, `nur`, `erst`. Ist etwas wirklich nötig, heißt es `müssen`."}],"explain":["`brauchen + zu + Infinitiv` verneint oder begrenzt eine Notwendigkeit. Typische Begleiter sind `nicht`, `kein`, `nur`, `erst`, `kaum`.","In der gesprochenen Sprache fällt `zu` oft weg: `Du brauchst nicht warten`. Das versteht jeder, schriftlich und in Prüfungen ist die Form mit `zu` sicherer."],"pitfall":"`brauchen zu` steht nicht in einem bejahten Satz im Sinn von „müssen“. Dann heißt es `müssen`.","recall":["Forme um mit `brauchen`: `Ihr müsst keine Angst haben.`","`Ihr braucht keine Angst zu haben.` Die Verneinung mit `keine` erlaubt `brauchen zu`."],"linkTitles":["brauchen im System der Modalverben · grammis","Infinitiv mit oder ohne zu? · grammis"],"table":[["Form","Bedeutung","Beispiel"],["brauchen + Akkusativ","nötig haben","Ich brauche Hilfe."],["nicht / kein … brauchen zu","nicht müssen","Du brauchst nicht zu warten."],["nur … brauchen zu","es reicht","Du brauchst nur zu klingeln."],["müssen","Pflicht","Du musst morgen kommen."]]}},"questions":[{"id":"brauchen-1","type":"cloze","difficulty":1,"text":"Morgen ist Sonntag. Du brauchst nicht früh {{1}}.","blanks":[["aufzustehen"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `aufstehen` مع `zu`. انتبه: الفعل منفصل.","explain":"مع الفعل المنفصل تدخل `zu` في وسطه وتُكتب كلمة واحدة: `aufzustehen`.","hints":["أين تقف `zu` في الأفعال المنفصلة؟"]},"de":{"prompt":"Ergänze `aufstehen` mit `zu`. Achtung: Das Verb ist trennbar.","explain":"Bei trennbaren Verben steht `zu` in der Mitte, alles in einem Wort: `aufzustehen`.","hints":["Wo steht `zu` bei trennbaren Verben?"]}}},{"id":"brauchen-2","type":"cloze","difficulty":1,"text":"Sie {{1}} keinen Termin zu machen, Sie können einfach kommen.","blanks":[["brauchen"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `brauchen` مع `Sie` (صيغة الاحترام).","explain":"`Sie brauchen keinen Termin zu machen` = لا يلزمك موعد.","hints":["`Sie` بصيغة الاحترام يصرّف كالجمع."]},"de":{"prompt":"Ergänze `brauchen` in der Höflichkeitsform.","explain":"`Sie brauchen keinen Termin zu machen` = Sie müssen keinen Termin machen.","hints":["Die Höflichkeitsform hat die Form der 3. Person Plural."]}}},{"id":"brauchen-3","type":"mcq","difficulty":1,"options":["Du musst nicht kochen.","Du darfst nicht kochen.","Du sollst kochen."],"answer":0,"i18n":{"ar":{"prompt":"ما معنى `Du brauchst nicht zu kochen`؟","explain":"`nicht brauchen zu` = `nicht müssen`: الطبخ غير ضروري، لكنه ليس ممنوعًا.","hints":["هل هو منع أم عدم لزوم؟"]},"de":{"prompt":"Was bedeutet `Du brauchst nicht zu kochen`?","explain":"`nicht brauchen zu` = `nicht müssen`: Es ist nicht nötig, aber nicht verboten.","hints":["Verbot oder keine Notwendigkeit?"]}}},{"id":"brauchen-4","type":"cloze","difficulty":2,"text":"Das Formular ist fast fertig. Sie brauchen {{1}} noch zu {{2}}.","blanks":[["nur"],["unterschreiben"]],"i18n":{"ar":{"prompt":"أكمل: «كل ما عليك الآن أن توقّع».","explain":"`nur … brauchen zu` = يكفي أن. و`unterschreiben` فعل غير منفصل، فتأتي `zu` قبله.","hints":["`unterschreiben` لا ينفصل."]},"de":{"prompt":"Ergänze: Es reicht, wenn Sie noch unterschreiben."
