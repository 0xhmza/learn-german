نها جاء اسمه."},{"text":"اعرف المجموعة من نهاية الكلمة","why":"الأسماء المذكرة المنتهية بـ `-e` للأشخاص والحيوانات (`der Kollege` و`der Junge` و`der Löwe`)، والمنتهية بـ `-ent` و`-ant` و`-ist` و`-at` و`-oge` (`der Student` و`der Praktikant` و`der Polizist`)."},{"text":"احفظ بعض الكلمات الخاصة","why":"`der Mensch` و`der Herr` و`der Nachbar` و`der Bauer` تتبع هذا التصريف أيضًا رغم نهاياتها. و`Herr` يأخذ `-n` في المفرد: `Herrn Müller`."},{"text":"في الجمع تبقى النهاية في كل الحالات","why":"الجمع `die Kunden` لا يتغير: `mit vielen Kunden`. فلا تضيف `-n` أخرى في `Dativ` الجمع."}],"explain":["يُسمى هذا التصريف `N-Deklination`. لا يأخذ الاسم فيه `-s` في `Genitiv`، بل `-n` أو `-en`: `des Kollegen` وليس `des Kolleges`.","بعض الكلمات تختلف قليلًا: `der Name` يصير `des Namens`، وكذلك `der Gedanke` و`der Buchstabe`. وفي الكلام اليومي يُسمع أحيانًا `dem Student`، لكن الصيغة الصحيحة في الكتابة `dem Studenten`."],"pitfall":"`Student` من هذه المجموعة، فيأخذ `-en` بعد `den`.","recall":["لماذا نقول `Ich frage den Nachbarn`؟","لأن `der Nachbar` من أسماء `N-Deklination`، فيأخذ `-n` في `Akkusativ`."],"linkTitles":["أصناف تصريف الأسماء · grammis","حالات خاصة في التصريف · grammis"],"table":[["الحالة","مفرد","جمع"],["Nominativ","der Kunde","die Kunden"],["Akkusativ","den Kunden","die Kunden"],["Dativ","dem Kunden","den Kunden"],["Genitiv","des Kunden","der Kunden"]]},"de":{"title":"Die N-Deklination","lead":"Die meisten Nomen ändern sich nach `den` und `dem` nicht. Eine Gruppe maskuliner Nomen, meist Personen, bekommt aber in allen Fällen außer dem Nominativ Singular ein `-n` oder `-en`. Du lernst, wie du sie erkennst.","steps":[{"text":"Im Nominativ bleibt das Nomen gleich","why":"`der Kunde` ist Subjekt im Nominativ und steht in der Wörterbuchform."},{"text":"In den anderen Fällen kommt -n oder -en dazu","why":"Akkusativ, Dativ und Genitiv: `den Kunden`, `dem Kunden`, `des Kunden`. Dieses `-n` gibt der Deklination ihren Namen."},{"text":"Erkenne die Gruppe an der Endung","why":"Maskuline Nomen auf `-e` für Personen und Tiere (`der Kollege`, `der Junge`, `der Löwe`) und Nomen auf `-ent`, `-ant`, `-ist`, `-at`, `-oge` (`der Student`, `der Praktikant`, `der Polizist`)."},{"text":"Lerne einige Sonderfälle","why":"`der Mensch`, `der Herr`, `der Nachbar`, `der Bauer` gehören auch dazu. `Herr` hat im Singular `-n`: `Herrn Müller`."},{"text":"Im Plural bleibt die Endung überall gleich","why":"Der Plural `die Kunden` ändert sich nicht: `mit vielen Kunden`. Im Dativ Plural kommt kein zusätzliches `-n` dazu."}],"explain":["Im Genitiv bekommen diese Nomen kein `-s`, sondern `-n` oder `-en`: `des Kollegen`, nicht `des Kolleges`.","Einige Wörter haben eine Mischform: `der Name`, `des Namens`; ebenso `der Gedanke`, `der Buchstabe`. Umgangssprachlich hört man manchmal `dem Student`, geschrieben ist `dem Studenten` richtig."],"pitfall":"`Student` gehört zur N-Deklination und bekommt nach `den` ein `-en`.","recall":["Warum heißt es `Ich frage den Nachbarn`?","`der Nachbar` gehört zur N-Deklination und bekommt im Akkusativ ein `-n`."],"linkTitles":["Flexionsklassen der Nomina · grammis","Problemfälle der Flexion · grammis"],"table":[["Kasus","Singular","Plural"],["Nominativ","der Kunde","die Kunden"],["Akkusativ","den Kunden","die Kunden"],["Dativ","dem Kunden","den Kunden"],["Genitiv","des Kunden","der Kunden"]]}},"questions":[{"id":"n-deklination-1","type":"cloze","difficulty":1,"text":"Kannst du bitte deinen {{1}} fragen? (der Kollege)","blanks":[["Kollegen"]],"i18n":{"ar":{"prompt":"أكمل بالصيغة الصحيحة للاسم.","explain":"`fragen` يطلب `Akkusativ`، و`Kollege` يأخذ `-n`: `deinen Kollegen`.","hints":["الاسم مذكر وينتهي بـ `-e`."]},"de":{"prompt":"Ergänze die richtige Form des Nomens.","explain":"`fragen` verlangt den Akkusativ, `Kollege` bekommt `-n`: `deinen Kollegen`.","hints":["Das Nomen ist maskulin und endet auf `-e`."]}}},{"id":"n-deklination-2","type":"cloze","difficulty":1,"text":"Der Arzt gibt dem {{1}} ein Rezept. (der Patient)","blanks":[["Patienten"]],"i18n":{"ar":{"prompt":"أكمل بالصيغة الصحيحة.","explain":"`Patient` ينتهي بـ `-ent`، فيأخذ `-en` في `Dativ`: `dem Patienten`.","hints":["لاحظ النهاية `-ent`."]},"de":{"prompt":"Ergänze die richtige Form.","explain":"`Patient` endet auf `-ent` und bekommt im Dativ `-en`: `dem Patienten`.","hints":["Achte auf die Endung `-ent`."]}}},{"id":"n-deklination-3","type":"mcq","difficulty":1,"options":["der Tisch","der Junge","der Polizist"],"answer":0,"i18n":{"ar":{"prompt":"أي اسم لا يتبع `N-Deklination`؟","explain":"`der Tisch` اسم عادي: `den Tisch`. أما `Junge` و`Polizist` فيأخذان `-n` و`-en`.","hints":["أغلب أسماء هذه المجموعة لأشخاص."]},"de":{"prompt":"Welches Nomen gehört nicht zur N-Deklination?","explain":"`der Tisch` ist normal: `den Tisch`. `Junge` und `Polizist` bekommen `-n` bzw. `-en`.","hints":["Die meisten dieser Nomen bezeichnen Personen."]}}},{"id":"n-deklination-4","type":"cloze","difficulty":2,"text":"Das ist das Fahrrad des {{1}}. Ich habe es von {{2}} Meier gekauft. (der Nachbar · Herr)","blanks":[["Nachbarn"],["Herrn"]],"i18n":{"ar":{"prompt":"أكمل بالصيغتين الصحيحتين.","explain":"`des Nachbarn` في `Genitiv` بلا `-s`، و`von Herrn Meier` في `Dativ`.","hints":["الكلمتان من الأسماء الخاصة في هذه المجموعة."]},"de":{"prompt":"Ergänze beide Formen.","explain":"`des Nachbarn` im Genitiv ohne `-s`, `von Herrn Meier` im Dativ.","hints":["Beide Wörter sind Sonderfälle der Gruppe."]}}},{"id":"n-deklination-5","type":"cloze","difficulty":2,"text":"Der {{1}} hat mit dem {{2}} gesprochen. (Praktikant · Kunde)","blanks":[["Praktikant"],["Kunden"]],"i18n":{"ar":{"prompt":"أكمل. انتبه: أحد الاسمين فاعل.","explain":"`Der Praktikant` فاعل فيبقى بلا نهاية. و`mit dem Kunden` في `Dativ` يأخذ `-n`.","hints":["الفاعل في `Nominativ` لا يتغير."]},"de":{"prompt":"Ergänze. Achtung: Ein Nomen ist Subjekt.","explain":"`Der Praktikant` ist Subjekt und bleibt ohne Endung. `mit dem Kunden` im Dativ bekommt `-n`.","hints":["Im Nominativ ändert sich das Nomen nicht."]}}},{"id":"n-deklination-6","type":"mcq","difficulty":2,"options":["Wir haben einen neuen Kollegen.","Wir haben einen neuen Kollege.","Wir haben einen neue Kollegen."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"الصفة تأخذ `-en` بعد `einen`، والاسم يأخذ `-n`: `einen neuen Kollegen`.","hints":["انتبه إلى الصفة وإلى الاسم معًا."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Das Adjektiv bekommt nach `einen` die Endung `-en`, das Nomen ein `-n`: `einen neuen Kollegen`.","hints":["Achte auf Adjektiv und Nomen."]}}},{"id":"n-deklination-7","type":"text","difficulty":3,"answer":"Ich habe dem Studenten den Weg erklärt.","i18n":{"ar":{"prompt":"ترجم: «شرحت للطالب الطريق.» استعمل `erklären` في الماضي المركب.","explain":"`dem Studenten` في `Dativ` مع `-en`، و`den Weg` في `Akkusativ`.","hints":["`der Student` يأخذ `-en`."]},"de":{"prompt":"Schreib: Du hast dem Studenten den Weg erklärt. Benutze das Perfekt.","explain":"`dem Studenten` im Dativ mit `-en`, `den Weg` im Akkusativ.","hints":["`der Student` bekommt `-en`."]}}},{"id":"n-deklination-8","type":"text","difficulty":3,"context":"Ich kenne den Student.","answer":"Ich kenne den Studenten.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`Student` ينتهي بـ `-ent`، فيأخذ `-en` في `Akkusativ`.","hints":["ما نهاية الكلمة `Student`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`Student` endet auf `-ent` und bekommt im Akkusativ `-en`.","hints":["Wie endet das Wort `Student`?"]}}},{"id":"n-deklination-9","type":"text","difficulty":2,"answer":"Ich treffe morgen meinen Nachbarn.","i18n":{"ar":{"prompt":"اكتب جملة فيها `der Nachbar` كمفعول به.","explain":"مثال: `Ich treffe morgen meinen Nachbarn.`","hints":["المفعول به في `Akkusativ` يأخذ `-n`."]},"de":{"prompt":"Schreib einen Satz mit `der Nachbar` als Akkusativobjekt.","explain":"Zum Beispiel: `Ich treffe morgen meinen Nachbarn.`","hints":["Im Akkusativ kommt `-n` dazu."]}}}]},{"id":"diminutiv","level":"B1.1","island":"nomen-kasus","order":5,"prereqs":[],"emoji":"🐣","german":"Diminutiv","source":{"lektion":3,"kind":"sample"},"pattern":["Nomen","+ Umlaut?","+ -chen / -lein","→ immer das"],"frames":[{"k":"np","parts":[["n","die Kanne"],["hl","→"],["n","das Kännchen"]]},{"k":"main","parts":[["vf","Das Häuschen"],["v","ist"],["mf","hübsch"]]}],"example":"die Kanne → das Kännchen","stepExamples":["der Tisch → das Tischchen","der Schrank → das Schränkchen · das Haus → das Häuschen","die Kanne → das Kännchen","das kleine Schränkchen · mit dem kleinen Schränkchen"],"pitfallPair":"Die Häuschen ist hübsch. → Das Häuschen ist hübsch.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"],"i18n":{"ar":{"title":"تصغير الأسماء","lead":"يمكن أن تدل صيغة التصغير على الحجم أو التحبّب. ابدأ بتحديد الاسم الذي تغيّر معناه، ثم افحص ثلاثة أشياء في الصيغة الجديدة: النهاية والصوت والجنس.","translation":"الإبريق ← الإبريق الصغير.","steps":[{"text":"ألحق نهاية التصغير","why":"النهاية `-chen` شائعة، وتجد أيضًا `-lein` مثل `das Büchlein`. تختار الصيغة المتداولة للكلمة، ويفيدك القاموس عندما تشك فيها."},{"text":"راقب تغيّر الحركة","why":"كثيرًا ما تتحول `a/o/u` إلى `ä/ö/ü` أو `au` إلى `äu` في التصغير. هذا نمط شائع، وتوجد كلمات لا يظهر فيها تغير مثل `Tischchen`."},{"text":"احذف e النهائية حيث يلزم","why":"احذف `e` النهائية هنا. يبقى الجذر `Kann-`، وتتحول الحركة إلى `ä` قبل إضافة `-chen`."},{"text":"صرّف المجموعة حسب جنسها الجديد","why":"الأسماء التي تصغّرها بـ `-chen` أو `-lein` محايدة مهما كان جنس الاسم الأصلي. تظهر الصيغة `das` في الرفع والأكوزاتيف و`dem` في الداتيف بعد `mit`."}],"explain":["يبقى شكل الاسم في الجمع عادة كما هو مع هاتين النهايتين، مثل `das Häuschen → die Häuschen`. وتوجد نهايات إقليمية مثل `-le` و`-erl`. قد يصبح الاسم المصغّر كلمة مستقلة شائعة، وقد يدل السياق على المودة أو السخرية. عند بناء الجملة اتبع الجنس النحوي الجديد مع الأداة والصفة وضمير الوصل."],"pitfall":"للمفرد قل `Das Häuschen ist hübsch.` وللجمع `Die Häuschen sind hübsch.`. يحدّد العدد الأداة وتصريف الفعل.","recall":["كيف تصف كرسيًا صغيرًا مع `mit` إذا اخترت `Stühlchen`؟","`mit einem kleinen Stühlchen`. حرف `mit` يطلب الداتيف، والاسم المصغّر محايد."],"linkTitles":["فهرس قواعد الوحدة 3 · telc، ص 2","شرح القواعد، ص 35 من الكتاب · telc"]},"de":{"title":"Diminutiv (Verkleinerung)","lead":"Eine Verkleinerungsform kann Größe oder Zuneigung ausdrücken. Bestimme zuerst das Nomen, dessen Bedeutung sich ändert, und prüfe dann drei Dinge an der neuen Form: Endung, Vokal und Genus.","steps":[{"text":"Häng die Verkleinerungsendung an","why":"Die Endung `-chen` ist häufig, du findest aber auch `-lein`, z. B. `das Büchlein`. Nimm die übliche Form des Wortes – im Zweifel hilft das Wörterbuch."},{"text":"Achte auf den Umlaut","why":"Oft wird `a/o/u` zu `ä/ö/ü` oder `au` zu `äu`. Das ist ein häufiges Muster, aber es gibt auch Wörter ohne Änderung, z. B. `Tischchen`."},{"text":"Streich das End-e, wo nötig","why":"Hier fällt das `e` am Ende weg. Es bleibt der Stamm `Kann-`, der Vokal wird zu `ä`, dann kommt `-chen`."},{"text":"Dekliniere nach dem neuen Genus","why":"Nomen mit `-chen` oder `-lein` sind immer neutral – egal, welches Genus das ursprüngliche Nomen hatte. Du siehst `das` im Nominativ und Akkusativ und `dem` im Dativ nach `mit`."}],"explain":["Im Plural bleibt die Form mit diesen Endungen meist gleich: `das Häuschen → die Häuschen`. Es gibt auch regionale Endungen wie `-le` und `-erl`. Manche Verkleinerungen sind eigene, gängige Wörter geworden, und je nach Kontext klingen sie liebevoll oder ironisch. Im Satz richtest du Artikel, Adjektiv und Relativpronomen nach dem neuen grammatischen Genus."],"pitfall":"Im Singular sagst du `Das Häuschen ist hübsch.`, im Plural `Die Häuschen sind hübsch.` Der Numerus bestimmt Artikel und Verbform.","recall":["Wie beschreibst du mit `mit` einen kleinen Stuhl, wenn du `Stühlchen` wählst?","`mit einem kleinen Stühlchen`. `mit` verlangt den Dativ, und das verkleinerte Nomen ist neutral."],"linkTitles":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc"]}},"questions":[{"id":"diminutiv-1","type":"cloze","difficulty":1,"text":"der Schrank → das {{1}}","blanks":[["Schränkchen"]],"i18n":{"ar":{"prompt":"صغّر الاسم باستعمال -chen.","explain":"تتحول a إلى ä ثم تضيف -chen.","hints":["راقب حركة a في الجذر."]},"de":{"prompt":"Verkleinere das Nomen mit `-chen`.","explain":"`a` wird zu `ä`, dann kommt `-chen`.","hints":["Achte auf das `a` im Stamm."]}}},{"id":"diminutiv-2","type":"cloze","difficulty":1,"text":"{{1}} Häuschen ist alt.","blanks":[["Das"]],"i18n":{"ar":{"prompt":"أكمل أداة الاسم المصغّر في الرفع.","explain":"Häuschen محايد لأنه مصغّر بـ -chen.","hints":["انظر إلى جنس الاسم بعد التصغير."]},"de":{"prompt":"Ergänze den Artikel des verkleinerten Nomens im Nominativ.","explain":"`Häuschen` ist neutral, weil es mit `-chen` verkleinert ist.","hints":["Schau auf das Genus nach der Verkleinerung."]}}},{"id":"diminutiv-3","type":"mcq","difficulty":1,"options":["das Kännchen","die Kännchen","das Kannechen"],"answer":0,"i18n":{"ar":{"prompt":"أي صيغة تنتج من die Kanne؟","explain":"Kanne تصبح Kännchen بعد حذف e وتغيير الحركة. للمفرد استعمل das.","hints":["احذف e النهائية وراقب حركة الجذر."]},"de":{"prompt":"Welche Form entsteht aus `die Kanne`?","explain":"`Kanne` wird zu `Kännchen`: `e` fällt weg und der Vokal ändert sich. Im Singular steht `das`.","hints":["Streich das End-e und achte auf den Vokal im Stamm."]}}},{"id":"diminutiv-4","type":"cloze","difficulty":2,"text":"Die {{1}} sind klein. · mit {{2}} Häuschen","blanks":[["Häuschen"],["dem"]],"i18n":{"ar":{"prompt":"اكتب الجمع من Häuschen ثم صرّف الأداة مع mit للمفرد.","explain":"شكل الاسم ثابت في الجمع. بعد mit تأخذ الأداة المحددة في المحايد dem.","hints":["قارن شكل اسم الجمع وشكل أداة المحايد في الداتيف."]},"de":{"prompt":"Schreib den Plural von `Häuschen` und dann den Artikel mit `mit` im Singular.","explain":"Die Pluralform bleibt gleich. Nach `mit` heißt der bestimmte Artikel im Neutrum `dem`.","hints":["Vergleiche die Pluralform des Nomens und den Dativartikel im Neutrum."]}}},{"id":"diminutiv-5","type":"mcq","difficulty":2,"options":["ein kleines Tischchen","einen kleinen Tischchen","ein kleiner Tischchen"],"answer":0,"i18n":{"ar":{"prompt":"اختر المجموعة الصحيحة في Ich kaufe ….","explain":"Tischchen محايد في الأكوزاتيف بعد kaufen. اختر ein ونهاية الصفة -es.","hints":["أعد تحديد الجنس بعد إضافة -chen."]},"de":{"prompt":"Wähle die richtige Gruppe in `Ich kaufe …`.","explain":"`Tischchen` ist neutral und steht nach `kaufen` im Akkusativ. Wähle `ein` und die Adjektivendung `-es`.","hints":["Bestimme das Genus nach dem Anhängen von `-chen` neu."]}}},{"id":"diminutiv-6","type":"cloze","difficulty":2,"text":"das {{1}}","blanks":[["Büchlein"]],"i18n":{"ar":{"prompt":"اكتب اسمًا مصغّرًا من das Buch مستعملًا -lein.","explain":"Buch تصبح Büchlein بتغير u إلى ü قبل -lein.","hints":["استعمل الحركة الأمامية المناسبة لـ u."]},"de":{"prompt":"Bilde aus `das Buch` eine Verkleinerung mit `-lein`.","explain":"`Buch` wird zu `Büchlein`: `u` wird vor `-lein` zu `ü`.","hints":["Benutze den passenden Umlaut für `u`."]}}},{"id":"diminutiv-7","type":"text","difficulty":3,"answer":"Ich spiele mit dem kleinen Kätzchen.","i18n":{"ar":{"prompt":"حوّل Ich spiele mit der kleinen Katze إلى جملة فيها Kätzchen، واحتفظ بالصفة.","explain":"Kätzchen محايد، لذلك تحل dem محل der. تبقى نهاية kleinen هي -en.","hints":["mit يتطلب الداتيف. حدّد جنس الاسم الجديد."]},"de":{"prompt":"Forme `Ich spiele mit der kleinen Katze` in einen Satz mit `Kätzchen` um und behalte das Adjektiv.","explain":"`Kätzchen` ist neutral, deshalb ersetzt `dem` das `der`. Die Endung von `kleinen` bleibt `-en`.","hints":["`mit` verlangt den Dativ. Bestimme das Genus des neuen Nomens."]}}},{"id":"diminutiv-8","type":"text","difficulty":3,"answer":"Das Häuschen ist hübsch.","context":"Die Häuschen ist hübsch.","i18n":{"ar":{"prompt":"صحّح الجملة لتصف منزلًا صغيرًا واحدًا. واشرح اختيار الأداة.","explain":"للمفرد قل `Das Häuschen ist hübsch.` وللجمع `Die Häuschen sind hübsch.`. يحدّد العدد الأداة وتصريف الفعل.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Satz, sodass er ein einzelnes kleines Haus beschreibt, und erkläre die Wahl des Artikels.","explain":"Im Singular sagst du `Das Häuschen ist hübsch.`, im Plural `Die Häuschen sind hübsch.` Der Numerus bestimmt Artikel und Verbform.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"diminutiv-9","type":"text","difficulty":2,"answer":"`mit einem kleinen Stühlchen`. حرف `mit` يطلب الداتيف، والاسم المصغّر محايد.","i18n":{"ar":{"prompt":"كيف تصف كرسيًا صغيرًا مع `mit` إذا اخترت `Stühlchen`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wie beschreibst du mit `mit` einen kleinen Stuhl, wenn du `Stühlchen` wählst?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"verben-als-nomen","level":"B1.2","island":"nomen-kasus","order":6,"prereqs":[],"emoji":"🔤","german":"Verben als Nomen","source":{"lektion":7,"kind":"toc"},"pattern":["das","+","Infinitiv (großgeschrieben)"],"frames":[{"k":"main","parts":[["vf","Das Lernen"],["v","macht"],["mf","mir Spaß"]]},{"k":"main","parts":[["vf","Beim Kochen"],["v","höre"],["mf","ich Musik"]]},{"k":"np","parts":[["hl","zum"],["n","Schreiben"]]}],"example":"Ich lerne gern. → Das Lernen macht mir Spaß.","stepExamples":["Ich lerne jeden Abend.","Das Lernen am Abend fällt mir leicht.","Beim Lernen höre ich keine Musik.","Ich brauche einen Tisch zum Lernen."],"pitfallPair":"Beim lernen höre ich Musik. → Beim Lernen höre ich Musik.","links":["https://grammis.ids-mannheim.de/rechtschreibung/6194","https://grammis.ids-mannheim.de/terminologie/107"],"i18n":{"ar":{"title":"تحويل الفعل إلى اسم","lead":"في الألمانية تستطيع أن تجعل أي فعل اسمًا: تكتب المصدر بحرف كبير وتضع قبله `das`. ستتعلم كيف تتحدث عن النشاط نفسه، وكيف تقول «أثناء الطبخ» و«من أجل الكتابة».","translation":"أحب التعلم ← التعلم يمتعني.","steps":[{"text":"ابدأ بجملة فيها فعل","why":"الفعل `lernen` هنا يصف ما يفعله الشخص. نريد الآن أن نتكلم عن النشاط نفسه كشيء."},{"text":"اكتب المصدر بحرف كبير وضع قبله das","why":"كل مصدر يصبح اسمًا محايدًا: `das Lernen` و`das Kochen` و`das Warten`. لا جمع له، ويمكن أن تأتي بعده إضافات مثل `am Abend`."},{"text":"استعمل beim للتعبير عن «أثناء»","why":"`beim` اختصار `bei dem`. تقول `beim Lernen` بمعنى «أثناء التعلم» أو «حين أتعلم»."},{"text":"استعمل zum للتعبير عن الغرض","why":"`zum` اختصار `zu dem`. تقول `zum Lernen` بمعنى «من أجل التعلم». هذا التعبير قصير وشائع جدًا في الكلام اليومي."}],"explain":["الاسم المصنوع من الفعل محايد دائمًا، لذلك تأتي معه `das` و`dem` و`des` (`des Lernens`). الحرف الكبير إلزامي لأنه صار اسمًا.","التعابير المختصرة الأكثر استعمالًا: `beim` (أثناء)، و`zum` (من أجل)، و`vom` (من كثرة)، مثل `Ich bin müde vom Laufen`."],"pitfall":"بعد `beim` و`zum` و`vom` صار الفعل اسمًا، فيجب أن يُكتب بحرف كبير.","recall":["ماذا تعني `Ich brauche Ruhe zum Schlafen`؟","أحتاج إلى الهدوء من أجل النوم. `zum` + مصدر يعبر عن الغرض."],"linkTitles":["تحويل الكلمات إلى أسماء · القواعد الإملائية الرسمية","المصدر · grammis"],"table":[["التعبير","المعنى","مثال"],["das + Infinitiv","النشاط نفسه","Das Warten nervt mich."],["beim + Infinitiv","أثناء","Beim Essen spricht man nicht."],["zum + Infinitiv","من أجل","Das Wasser ist zum Trinken."],["vom + Infinitiv","بسبب كثرة","Ich bin müde vom Laufen."]]},"de":{"title":"Verben als Nomen","lead":"Im Deutschen kannst du fast jedes Verb zum Nomen machen: Du schreibst den Infinitiv groß und setzt `das` davor. Du lernst, wie du über die Tätigkeit selbst sprichst und wie du „während des Kochens“ oder „um zu schreiben“ kurz ausdrückst.","steps":[{"text":"Beginne mit einem Satz mit Verb","why":"Das Verb `lernen` beschreibt, was die Person tut. Jetzt wollen wir über die Tätigkeit selbst sprechen."},{"text":"Schreib den Infinitiv groß und setz das davor","why":"Jeder Infinitiv wird zu einem neutralen Nomen: `das Lernen`, `das Kochen`, `das Warten`. Es hat keinen Plural und kann Ergänzungen wie `am Abend` haben."},{"text":"beim drückt „während“ aus","why":"`beim` ist `bei dem`. `beim Lernen` heißt: während ich lerne."},{"text":"zum drückt den Zweck aus","why":"`zum` ist `zu dem`. `zum Lernen` heißt: um zu lernen. Diese Kurzform ist im Alltag sehr häufig."}],"explain":["Das Nomen aus einem Infinitiv ist immer neutral: `das`, `dem`, `des Lernens`. Die Großschreibung ist Pflicht, weil es jetzt ein Nomen ist.","Die häufigsten Kurzformen: `beim` (während), `zum` (Zweck), `vom` (Ursache), zum Beispiel `Ich bin müde vom Laufen`."],"pitfall":"Nach `beim`, `zum` und `vom` ist das Verb ein Nomen und wird großgeschrieben.","recall":["Was bedeutet `Ich brauche Ruhe zum Schlafen`?","Ich brauche Ruhe, um zu schlafen. `zum` + Infinitiv nennt den Zweck."],"linkTitles":["Substantivierungen · Amtliches Regelwerk","Infinitiv · grammis"],"table":[["Ausdruck","Bedeutung","Beispiel"],["das + Infinitiv","die Tätigkeit","Das Warten nervt mich."],["beim + Infinitiv","während","Beim Essen spricht man nicht."],["zum + Infinitiv","Zweck","Das Wasser ist zum Trinken."],["vom + Infinitiv","Ursache","Ich bin müde vom Laufen."]]}},"questions":[{"id":"verben-als-nomen-1","type":"cloze","difficulty":1,"text":"{{1}} Schwimmen ist gut für den Rücken.","blanks":[["Das"]],"i18n":{"ar":{"prompt":"أكمل بالأداة المناسبة.","explain":"الاسم المصنوع من فعل محايد دائمًا: `das Schwimmen`.","hints":["ما جنس الأفعال حين تصير أسماء؟"]},"de":{"prompt":"Ergänze den Artikel.","explain":"Nominalisierte Infinitive sind immer neutral: `das Schwimmen`.","hints":["Welches Genus haben Verben als Nomen?"]}}},{"id":"verben-als-nomen-2","type":"cloze","difficulty":1,"text":"{{1}} Autofahren telefoniere ich nie.","blanks":[["Beim"]],"i18n":{"ar":{"prompt":"أكمل بالكلمة التي تعني «أثناء».","explain":"`beim` = `bei dem` وتعني «أثناء». وفي أول الجملة تُكتب بحرف كبير.","hints":["الكلمة اختصار لحرف جر وأداة."]},"de":{"prompt":"Ergänze das Wort für „während“.","explain":"`beim` = `bei dem` und bedeutet „während“. Am Satzanfang groß: `Beim`.","hints":["Das Wort ist aus Präposition und Artikel verschmolzen."]}}},{"id":"verben-als-nomen-3","type":"mcq","difficulty":1,"options":["Ich brauche eine Brille zum Lesen.","Ich brauche eine Brille zum lesen.","Ich brauche eine Brille zu Lesen."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة مكتوبة بشكل صحيح؟","explain":"بعد `zum` صار الفعل اسمًا ويُكتب بحرف كبير. و`zu` وحدها لا تكفي، فنحتاج إلى `zum` (`zu dem`).","hints":["انتبه إلى الحرف الكبير وإلى الأداة."]},"de":{"prompt":"Welcher Satz ist richtig geschrieben?","explain":"Nach `zum` ist das Verb ein Nomen und wird großgeschrieben. Mit `zu` allein fehlt der Artikel.","hints":["Achte auf Großschreibung und Artikel."]}}},{"id":"verben-als-nomen-4","type":"cloze","difficulty":2,"text":"Nach dem langen {{1}} am Bahnhof war ich müde {{2}} Stehen.","blanks":[["Warten"],["vom"]],"i18n":{"ar":{"prompt":"أكمل باسم من الفعل `warten` وبحرف الجر المدمج المناسب.","explain":"`das Warten` اسم محايد، و`vom Stehen` تعني «بسبب الوقوف الطويل».","hints":["الفراغ الثاني يعبر عن السبب."]},"de":{"prompt":"Ergänze ein Nomen aus `warten` und die passende Kurzform.","explain":"`das Warten` ist ein Nomen. `vom Stehen` nennt die Ursache der Müdigkeit.","hints":["Die zweite Lücke nennt eine Ursache."]}}},{"id":"verben-als-nomen-5","type":"cloze","difficulty":2,"text":"Hast du Papier {{1}} {{2}}?","blanks":[["zum"],["Schreiben"]],"i18n":{"ar":{"prompt":"أكمل: «هل عندك ورق للكتابة؟»","explain":"الغرض يُعبَّر عنه بـ `zum` + مصدر بحرف كبير: `zum Schreiben`.","hints":["فكّر في `zu dem`."]},"de":{"prompt":"Ergänze: Du fragst nach Papier, um etwas zu schreiben.","explain":"Den Zweck drückst du mit `zum` + großgeschriebenem Infinitiv aus: `zum Schreiben`.","hints":["Denk an `zu dem`."]}}},{"id":"verben-als-nomen-6","type":"mcq","difficulty":2,"options":["Während ich lese, schlafe ich oft ein.","Um zu lesen, schlafe ich oft ein.","Weil ich viel lese, schlafe ich oft ein."],"answer":0,"i18n":{"ar":{"prompt":"ما معنى `Beim Lesen schlafe ich oft ein`؟","explain":"`beim` تعني «أثناء»، فالجملة المساوية تبدأ بـ `während`.","hints":["`beim` تدل على وقت."]},"de":{"prompt":"Was bedeutet `Beim Lesen schlafe ich oft ein`?","explain":"`beim` bedeutet „während“. Der passende Satz beginnt mit `während`.","hints":["`beim` drückt Zeit aus."]}}},{"id":"verben-als-nomen-7","type":"text","difficulty":3,"answer":"Das Aufräumen dauert immer lange.","i18n":{"ar":{"prompt":"حوّل `Ich räume auf. Das dauert immer lange.` إلى جملة واحدة يكون فاعلها اسمًا من الفعل `aufräumen`.","explain":"`aufräumen` يصير `das Aufräumen` ويصبح فاعل الجملة.","hints":["ابدأ بـ `Das`."]},"de":{"prompt":"Mach aus `Ich räume auf. Das dauert immer lange.` einen Satz mit dem Nomen aus `aufräumen` als Subjekt.","explain":"Aus `aufräumen` wird `das Aufräumen`, das Subjekt des Satzes.","hints":["Beginne mit `Das`."]}}},{"id":"verben-als-nomen-8","type":"text","difficulty":3,"context":"Beim lernen höre ich Musik.","answer":"Beim Lernen höre ich Musik.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"بعد `beim` صار الفعل اسمًا، والأسماء تُكتب بحرف كبير: `Lernen`.","hints":["هل `lernen` هنا فعل أم اسم؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Nach `beim` ist `Lernen` ein Nomen und wird großgeschrieben.","hints":["Ist `lernen` hier Verb oder Nomen?"]}}},{"id":"verben-als-nomen-9","type":"text","difficulty":2,"answer":"Beim Kochen höre ich gern Radio.","i18n":{"ar":{"prompt":"اكتب جملة تقول فيها إنك تحب الاستماع إلى الراديو أثناء الطبخ. ابدأ بـ `Beim`.","explain":"`beim Kochen` في أول الجملة، ثم الفعل في الموقع الثاني: `höre ich`.","hints":["بعد التعبير الزمني يأتي الفعل مباشرة."]},"de":{"prompt":"Schreib, dass du beim Kochen gern Radio hörst. Beginne mit `Beim`.","explain":"`Beim Kochen` steht im Vorfeld, danach kommt das Verb: `höre ich`.","hints":["Nach dem Vorfeld folgt sofort das Verb."]}}}]},{"id":"nominalisierte-adjektive","level":"B1.2","island":"nomen-kasus","order":7,"prereqs":["genitiv-adjektiv","partizip-adjektiv"],"emoji":"🧍","german":"Nominalisierte Adjektive und Partizipien","source":{"lektion":11,"kind":"toc"},"pattern":["Artikel","+","Adjektiv mit Endung (großgeschrieben)"],"frames":[{"k":"np","parts":[["n","ein"],["hl","Bekannter"],["n","von mir"]]},{"k":"np","parts":[["n","der"],["hl","Bekannte"]]},{"k":"np","parts":[["n","etwas"],["hl","Neues"]]}],"example":"Ein Bekannter von mir arbeitet hier.","stepExamples":["Ein bekannter Mann arbeitet hier.","Ein Bekannter arbeitet hier.","Der Bekannte arbeitet hier. · Die Bekannte arbeitet hier.","Die Angestellten · die Reisenden · der Verletzte","Ich habe etwas Neues gelernt."],"pitfallPair":"Ein Deutsche wohnt neben mir. → Ein Deutscher wohnt neben mir.","links":["https://grammis.ids-mannheim.de/rechtschreibung/6194","https://grammis.ids-mannheim.de/fragen/46"],"i18n":{"ar":{"title":"صفات تصير أسماء","lead":"في العربية نقول «المريض» و«الموظفون» دون كلمة «رجل» أو «أشخاص». والألمانية تفعل الشيء نفسه: تحذف الاسم وتكتب الصفة بحرف كبير. لكن الصفة تحتفظ بنهايتها كأن الاسم ما زال موجودًا.","translation":"أحد معارفي يعمل هنا.","steps":[{"text":"ابدأ بصفة قبل اسم","why":"`ein bekannter Mann`: الصفة `bekannt` تأخذ `-er` بعد `ein` مع المذكر في `Nominativ`."},{"text":"احذف الاسم واكتب الصفة بحرف كبير","why":"`ein Bekannter`: صارت الصفة اسمًا، لكن نهايتها `-er` بقيت كما هي. فكّر كأن كلمة `Mann` ما زالت موجودة."},{"text":"النهاية تتغير بحسب الأداة","why":"بعد `der` تقول `der Bekannte`، وبعد `ein` تقول `ein Bekannter`. وللمؤنث: `die Bekannte` و`eine Bekannte`. هذه هي نهايات الصفة المعروفة."},{"text":"اسما الفاعل والمفعول يعملان بالطريقة نفسها","why":"`angestellt` تصير `der Angestellte` و`die Angestellten`، و`reisend` تصير `die Reisenden`. وفي الجمع يشمل الاسم كل الأجناس."},{"text":"بعد etwas و nichts و viel: صيغة المحايد","why":"`etwas Neues` و`nichts Besonderes` و`viel Gutes`: الصفة تأخذ `-es` وتُكتب بحرف كبير."}],"explain":["أهم كلمات هذه المجموعة: `der/die Deutsche` و`der/die Erwachsene` و`der/die Jugendliche` و`der/die Kranke` و`der/die Angestellte` و`der/die Verwandte` و`der/die Bekannte` و`der/die Arbeitslose`. استثناء: `der Beamte` لكن `die Beamtin`.","في `Dativ` و`Genitiv` تأخذ هذه الكلمات `-en` كأي صفة: `mit dem Angestellten` و`die Wohnung des Verletzten`."],"pitfall":"بعد `ein` يحتاج المذكر في `Nominativ` إلى `-er`: `ein Deutscher`. أما `ein Deutsche` فخطأ.","recall":["لماذا نقول `die Deutschen` في الجمع ولكن `Deutsche` بدون أداة؟","بعد `die` تأخذ الصفة `-en`، وبدون أداة تأخذ الصفة في الجمع `-e`، تمامًا كالصفة قبل الاسم."],"linkTitles":["تحويل الكلمات إلى أسماء · القواعد الإملائية الرسمية","الصفات بلا اسم · grammis"],"table":[["الحالة","مع der / die","مع ein / eine","جمع"],["Nominativ","der / die Bekannte","ein Bekannter / eine Bekannte","die Bekannten · Bekannte"],["Akkusativ","den Bekannten / die Bekannte","einen Bekannten / eine Bekannte","die Bekannten · Bekannte"],["Dativ","dem / der Bekannten","einem / einer Bekannten","den Bekannten · Bekannten"]]},"de":{"title":"Nominalisierte Adjektive und Partizipien","lead":"Statt „der kranke Mensch“ sagst du oft einfach „der Kranke“. Das Nomen fällt weg, das Adjektiv wird großgeschrieben. Es behält aber seine Endung, als ob das Nomen noch da wäre.","steps":[{"text":"Beginne mit Adjektiv + Nomen","why":"`ein bekannter Mann`: Das Adjektiv `bekannt` bekommt nach `ein` im Nominativ maskulin `-er`."},{"text":"Lass das Nomen weg und schreib das Adjektiv groß","why":"`ein Bekannter`: Das Adjektiv ist jetzt ein Nomen, behält aber die Endung `-er`. Denk dir das Wort `Mann` dazu."},{"text":"Die Endung hängt vom Artikel ab","why":"Nach `der`: `der Bekannte`. Nach `ein`: `ein Bekannter`. Feminin: `die Bekannte`, `eine Bekannte`. Es sind die bekannten Adjektivendungen."},{"text":"Partizipien funktionieren genauso","why":"Aus `angestellt` wird `der Angestellte`, `die Angestellten`. Aus `reisend` wird `die Reisenden`. Im Plural sind alle Geschlechter gemeint."},{"text":"Nach etwas, nichts, viel: neutrale Form","why":"`etwas Neues`, `nichts Besonderes`, `viel Gutes`: Das Adjektiv bekommt `-es` und wird großgeschrieben."}],"explain":["Wichtige Wörter dieser Gruppe: `der/die Deutsche`, `Erwachsene`, `Jugendliche`, `Kranke`, `Angestellte`, `Verwandte`, `Bekannte`, `Arbeitslose`. Ausnahme: `der Beamte`, aber `die Beamtin`.","Im Dativ und Genitiv haben sie `-en` wie jedes Adjektiv: `mit dem Angestellten`, `die Wohnung des Verletzten`."],"pitfall":"Nach `ein` braucht maskulin im Nominativ `-er`: `ein Deutscher`. `ein Deutsche` ist falsch.","recall":["Warum heißt es `die Deutschen`, aber ohne Artikel `Deutsche`?","Nach `die` hat das Adjektiv `-en`, ohne Artikel im Plural `-e` – wie bei einem Adjektiv vor einem Nomen."],"linkTitles":["Substantivierungen · Amtliches Regelwerk","Adjektive in elliptischen Nominalphrasen · grammis"],"table":[["Kasus","mit der / die","mit ein / eine","Plural"],["Nominativ","der / die Bekannte","ein Bekannter / eine Bekannte","die Bekannten · Bekannte"],["Akkusativ","den Bekannten / die Bekannte","einen Bekannten / eine Bekannte","die Bekannten · Bekannte"],["Dativ","dem / der Bekannten","einem / einer Bekannten","den Bekannten · Bekannten"]]}},"questions":[{"id":"nominalisierte-adjektive-1","type":"cloze","difficulty":1,"text":"Die {{1}} müssen draußen warten. (krank)","blanks":[["Kranken"]],"i18n":{"ar":{"prompt":"أكمل بالصفة كاسم في الجمع.","explain":"بعد `die` في الجمع تأخذ الصفة `-en`، وتُكتب بحرف كبير: `die Kranken`.","hints":["الفعل `müssen` جمع."]},"de":{"prompt":"Ergänze das Adjektiv als Nomen im Plural.","explain":"Nach `die` im Plural: `-en`, großgeschrieben: `die Kranken`.","hints":["Das Verb `müssen` steht im Plural."]}}},{"id":"nominalisierte-adjektive-2","type":"cloze","difficulty":1,"text":"Hast du am Wochenende etwas {{1}} erlebt? (spannend)","blanks":[["Spannendes"]],"i18n":{"ar":{"prompt":"أكمل بالصفة بعد `etwas`.","explain":"بعد `etwas` تأخذ الصفة `-es` وتُكتب بحرف كبير.","hints":["فكّر في `etwas Neues`."]},"de":{"prompt":"Ergänze das Adjektiv nach `etwas`.","explain":"Nach `etwas` bekommt das Adjektiv `-es` und wird großgeschrieben.","hints":["Denk an `etwas Neues`."]}}},{"id":"nominalisierte-adjektive-3","type":"mcq","difficulty":1,"options":["Mein Kollege ist ein Deutscher.","Mein Kollege ist ein Deutsche.","Mein Kollege ist ein deutscher."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"بعد `ein` مع المذكر: `-er`، والاسم بحرف كبير: `ein Deutscher`.","hints":["انتبه إلى النهاية وإلى الحرف الكبير."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Nach `ein` maskulin: `-er`, als Nomen großgeschrieben: `ein Deutscher`.","hints":["Achte auf Endung und Großschreibung."]}}},{"id":"nominalisierte-adjektive-4","type":"cloze","difficulty":2,"text":"Der Chef hat mit allen {{1}} gesprochen. Eine {{2}} hat dann Fragen gestellt. (angestellt)","blanks":[["Angestellten"],["Angestellte"]],"i18n":{"ar":{"prompt":"أكمل بالكلمة `angestellt` كاسم مرتين.","explain":"بعد `allen` في `Dativ` الجمع: `Angestellten`. وبعد `eine` في المؤنث: `Angestellte`.","hints":["الأولى جمع في `Dativ`، والثانية مفرد مؤنث."]},"de":{"prompt":"Ergänze zweimal `angestellt` als Nomen.","explain":"Nach `allen` im Dativ Plural: `Angestellten`. Nach `eine` feminin: `Angestellte`.","hints":["Erst Dativ Plural, dann feminin Singular."]}}},{"id":"nominalisierte-adjektive-5","type":"cloze","difficulty":2,"text":"Gestern habe ich einen {{1}} getroffen. Sie ist eine {{2}} von mir. (bekannt · verwandt)","blanks":[["Bekannten"],["Verwandte"]],"i18n":{"ar":{"prompt":"أكمل بالكلمتين كاسمين.","explain":"`einen Bekannten` مذكر في `Akkusativ` مع `-en`. و`eine Verwandte` مؤنث مع `-e`.","hints":["لاحظ الأداة قبل كل فراغ."]},"de":{"prompt":"Ergänze beide Wörter als Nomen.","explain":"`einen Bekannten`: maskulin Akkusativ mit `-en`. `eine Verwandte`: feminin mit `-e`.","hints":["Achte auf den Artikel vor jeder Lücke."]}}},{"id":"nominalisierte-adjektive-6","type":"mcq","difficulty":2,"options":["Ich habe nichts Neues gehört.","Ich habe nichts neues gehört.","Ich habe nichts Neue gehört."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"بعد `nichts` تأخذ الصفة `-es` وتُكتب بحرف كبير: `nichts Neues`.","hints":["مثل `etwas Neues`."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Nach `nichts`: `-es` und großgeschrieben: `nichts Neues`.","hints":["Wie `etwas Neues`."]}}},{"id":"nominalisierte-adjektive-7","type":"text","difficulty":3,"answer":"Die Jugendlichen treffen sich jeden Freitag.","i18n":{"ar":{"prompt":"اختصر بصفة كاسم: `Die jugendlichen Leute treffen sich jeden Freitag.`","explain":"احذف `Leute` واكتب الصفة بحرف كبير مع `-en`: `Die Jugendlichen`.","hints":["النهاية تبقى كما هي."]},"de":{"prompt":"Kürze mit einem nominalisierten Adjektiv: `Die jugendlichen Leute treffen sich jeden Freitag.`","explain":"Lass `Leute` weg und schreib groß mit `-en`: `Die Jugendlichen`.","hints":["Die Endung bleibt gleich."]}}},{"id":"nominalisierte-adjektive-8","type":"text","difficulty":3,"context":"Ein Deutsche wohnt neben mir.","answer":"Ein Deutscher wohnt neben mir.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"بعد `ein` مع المذكر في `Nominativ` تأخذ الصفة `-er`: `ein Deutscher`. أما المؤنث فـ `eine Deutsche`.","hints":["ما نهاية الصفة بعد `ein` مع المذكر؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Nach `ein` maskulin im Nominativ: `-er`, also `ein Deutscher`. Feminin hieße es `eine Deutsche`.","hints":["Welche Endung hat das Adjektiv nach `ein` maskulin?"]}}},{"id":"nominalisierte-adjektive-9","type":"text","difficulty":2,"answer":"In meinem Kurs sind viele Erwachsene, aber auch zwei Jugendliche.","i18n":{"ar":{"prompt":"صف الناس في دورتك بصفتين كاسمين في الجمع.","explain":"مثال: `In meinem Kurs sind viele Erwachsene, aber auch zwei Jugendliche.` بدون أداة: `-e`.","hints":["بعد `viele` بلا أداة تأخذ الصفة `-e`."]},"de":{"prompt":"Beschreib die Leute in deinem Kurs mit zwei nominalisierten Adjektiven im Plural.","explain":"Zum Beispiel: `In meinem Kurs sind viele Erwachsene, aber auch zwei Jugendliche.` Ohne Artikel: `-e`.","hints":["Nach `viele` ohne Artikel: `-e`."]}}}]},{"id":"komparativ","level":"B1.1","island":"adjektive","order":1,"prereqs":[],"emoji":"⚖️","german":"Adjektivdeklination mit Komparativ","source":{"lektion":5,"kind":"toc"},"pattern":["Adjektiv","+ -er (Komparativ)","+ Adjektivendung"],"frames":[{"k":"main","parts":[["vf","Der Salat"],["v","ist"],["hl","günstiger"]]},{"k":"main","parts":[["vf","Ich"],["v","nehme"],["mf","einen"],["hl","günstigeren"],["mf","Salat"]]}],"example":"Der Salat ist günstiger. → Ich nehme einen günstigeren Salat.","stepExamples":["günstig → günstiger · gesund → gesünder","Der Salat ist günstiger. · ein günstigerer Salat","einen günstigeren Salat · eine günstigere Suppe · ein günstigeres Menü","frischere Zutaten · mit frischeren Zutaten"],"pitfallPair":"Ich nehme einen gesünder Salat. → Ich nehme einen gesünderen Salat.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/4067"],"i18n":{"ar":{"title":"تصريف صفة المقارنة","lead":"عندما تضع المقارنة قبل الاسم، يتكوّن شكل الصفة من درجة المقارنة أولًا ثم نهاية التصريف. افصل المهمتين في ذهنك حتى لا تخلط بين حرف المقارنة ونهاية الحالة.","translation":"السلطة أرخص ← سآخذ سلطة أرخص.","steps":[{"text":"ابنِ درجة المقارنة","why":"أضف غالبًا `-er`. يتغير الصوت في بعض الصفات مثل `alt → älter` و`kurz → kürzer`. احفظ الصيغ الخاصة مثل `gut → besser` و`viel → mehr` و`hoch → höher`."},{"text":"حدّد هل الصفة قبل اسم","why":"بعد `sein` تأتي صيغة المقارنة وحدها. قبل الاسم تضيف نهاية الصفة المناسبة. `günstiger + er` يعطي `günstigerer` بعد `ein` مع المذكر في الرفع."},{"text":"اختر النهاية من الأداة والحالة والجنس","why":"كلها أمثلة في الأكوزاتيف. يأخذ المذكر بعد `einen` نهاية `-en`، والمؤنث بعد `eine` نهاية `-e`، والمحايد بعد `ein` نهاية `-es`."},{"text":"قارِن النمط مع الجمع والداتيف","why":"بلا أداة يأخذ جمع الأكوزاتيف في المثال `-e`، وبعد `mit` يأخذ جمع الداتيف `-en`. وفي `mit einer besseren Mischung` تؤدي `einer` وظيفة العلامة، وتأتي الصفة بـ `-en`."}],"explain":["استعمل `als` عند ذكر الطرف الثاني بعد المقارنة، مثل `Die Suppe ist günstiger als der Salat`. في المقارنة المتساوية تقول `so günstig wie`. بعض صيغ المقارنة مثل `mehr` و`weniger` تُستعمل عادة بلا نهاية عندما تدل على كمية في `mehr Wasser` و`weniger Salz`. في التمرين ابحث عن اسم يلي الصفة، ثم اختر طريقة التصريف."],"pitfall":"الصيغة `gesünder` صحيحة للمقارنة. موقعها قبل اسم مذكر بعد `einen` يتطلب `-en` إضافية.","recall":["كيف تصف طبقًا محايدًا بعد `ein` باستعمال `besser` في الأكوزاتيف؟","`ein besseres Gericht`. أساس المقارنة `besser` ثم النهاية `-es`."],"linkTitles":["فهرس قواعد الوحدة 5 · telc، ص 3","حلول الكتاب الرسمية · telc","تصريف الصفات · grammis"],"table":[["مع ein-","مذكر","مؤنث","محايد","جمع مع keine"],["Nominativ","ein besserer Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Akkusativ","einen besseren Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Dativ","einem besseren Plan","einer besseren Idee","einem besseren Bild","keinen besseren Ideen"],["Genitiv","eines besseren Plans","einer besseren Idee","eines besseren Bildes","keiner besseren Ideen"]]},"de":{"title":"Adjektivdeklination mit Komparativ","lead":"Steht ein Komparativ vor dem Nomen, besteht die Form aus zwei Teilen: zuerst die Steigerung, dann die Deklinationsendung. Trenne die beiden Aufgaben im Kopf, damit du das Komparativ-`er` nicht mit der Kasusendung verwechselst.","steps":[{"text":"Bilde den Komparativ","why":"Meist hängst du `-er` an. Bei manchen Adjektiven ändert sich der Vokal: `alt → älter`, `kurz → kürzer`. Lern die besonderen Formen: `gut → besser`, `viel → mehr`, `hoch → höher`."},{"text":"Prüfe, ob das Adjektiv vor einem Nomen steht","why":"Nach `sein` steht der Komparativ allein. Vor dem Nomen kommt die passende Adjektivendung dazu: `günstiger + er` ergibt `günstigerer` nach `ein` mit Maskulinum im Nominativ."},{"text":"Wähle die Endung nach Artikel, Kasus und Genus","why":"Alle Beispiele stehen im Akkusativ: Maskulinum nach `einen` → `-en`, Femininum nach `eine` → `-e`, Neutrum nach `ein` → `-es`."},{"text":"Vergleiche mit Plural und Dativ","why":"Ohne Artikel bekommt der Plural im Akkusativ hier `-e`, nach `mit` im Dativ `-en`. In `mit einer besseren Mischung` trägt `einer` das Signal, das Adjektiv bekommt `-en`."}],"explain":["Nennst du die Vergleichsgröße, benutze `als`: `Die Suppe ist günstiger als der Salat`. Bei Gleichheit sagst du `so günstig wie`. Manche Komparative wie `mehr` und `weniger` bleiben meist ohne Endung, wenn sie eine Menge angeben: `mehr Wasser`, `weniger Salz`. Such in der Übung nach einem Nomen hinter dem Adjektiv und entscheide dann über die Deklination."],"pitfall":"Die Form `gesünder` ist als Komparativ richtig. Vor einem maskulinen Nomen nach `einen` braucht sie aber zusätzlich `-en`.","recall":["Wie beschreibst du ein neutrales Gericht nach `ein` mit `besser` im Akkusativ?","`ein besseres Gericht`. Basis ist der Komparativ `besser`, dazu kommt die Endung `-es`."],"linkTitles":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Adjektivdeklination · grammis"],"table":[["mit ein-","Maskulin","Feminin","Neutrum","Plural mit keine"],["Nominativ","ein besserer Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Akkusativ","einen besseren Plan","eine bessere Idee","ein besseres Bild","keine besseren Ideen"],["Dativ","einem besseren Plan","einer besseren Idee","einem besseren Bild","keinen besseren Ideen"],["Genitiv","eines besseren Plans","einer besseren Idee","eines besseren Bildes","keiner besseren Ideen"]]}},"questions":[{"id":"komparativ-1","type":"cloze","difficulty":1,"text":"Diese Suppe ist {{1}}.","blanks":[["besser"]],"i18n":{"ar":{"prompt":"اكتب المقارنة من gut بعد sein.","explain":"المقارنة من gut هي besser وتأتي بلا نهاية تصريف هنا.","hints":["تذكّر أن هذه صيغة شاذة."]},"de":{"prompt":"Schreib den Komparativ von `gut` nach `sein`.","explain":"Der Komparativ von `gut` ist `besser`, hier ohne Deklinationsendung.","hints":["Denk daran: Das ist eine unregelmäßige Form."]}}},{"id":"komparativ-2","type":"cloze","difficulty":1,"text":"Ich kaufe eine {{1}} Tasche.","blanks":[["billigere"]],"i18n":{"ar":{"prompt":"أكمل المقارنة من billig قبل الاسم.","explain":"تضيف -e للمؤنث في الأكوزاتيف بعد eine.","hints":["ابدأ بـ billiger ثم انظر إلى أداة المؤنث."]},"de":{"prompt":"Ergänze den Komparativ von `billig` vor dem Nomen.","explain":"Für das Femininum im Akkusativ nach `eine` kommt `-e` dazu.","hints":["Beginne mit `billiger` und schau dann auf den femininen Artikel."]}}},{"id":"komparativ-3","type":"mcq","difficulty":1,"options":["billiger als","billiger wie","so billiger als"],"answer":0,"i18n":{"ar":{"prompt":"أيّ تركيب معياري يقارن وجبتين مختلفتين في السعر؟","explain":"بعد billiger نستخدم als. في التساوي نقول so billig wie.","hints":["استخدم الرابط الذي يأتي بعد المقارنة غير المتساوية."]},"de":{"prompt":"Welche Standardstruktur vergleicht zwei Gerichte mit verschiedenem Preis?","explain":"Nach `billiger` benutzen wir `als`. Bei Gleichheit sagen wir `so billig wie`.","hints":["Benutze das Wort, das nach einem ungleichen Vergleich folgt."]}}},{"id":"komparativ-4","type":"cloze","difficulty":2,"text":"Ich esse einen {{1}} Salat mit {{2}} Zutaten.","blanks":[["gesünderen"],["frischeren"]],"i18n":{"ar":{"prompt":"اكتب المقارنة المصرفة من gesund ثم frisch.","explain":"gesund تصبح gesünder ثم تأخذ -en بعد einen. frisch يضيف -er للمقارنة و-en للداتيف.","hints":["الأول مذكر في الأكوزاتيف، والثاني جمع في الداتيف."]},"de":{"prompt":"Schreib den deklinierten Komparativ von `gesund` und dann von `frisch`.","explain":"`gesund` wird zu `gesünder` und bekommt nach `einen` `-en`. `frisch` bekommt `-er` für den Komparativ und `-en` für den Dativ.","hints":["Das erste ist Maskulinum im Akkusativ, das zweite Plural im Dativ."]}}},{"id":"komparativ-5","type":"mcq","difficulty":2,"options":["ein günstigeres Angebot","ein günstiger Angebot","einen günstigeren Angebot"],"answer":0,"i18n":{"ar":{"prompt":"اختر المجموعة الصحيحة في Ich suche ….","explain":"المقارنة günstiger ثم النهاية -es مع المحايد في الأكوزاتيف.","hints":["Angebot محايد. انتبه إلى نهاية الصفة بعد ein."]},"de":{"prompt":"Wähle die richtige Gruppe in `Ich suche …`.","explain":"Der Komparativ `günstiger` plus Endung `-es` für das Neutrum im Akkusativ.","hints":["`Angebot` ist neutral. Achte auf die Adjektivendung nach `ein`."]}}},{"id":"komparativ-6","type":"cloze","difficulty":2,"text":"ein {{1}} Preis · {{2}} Wasser","blanks":[["höherer"],["mehr"]],"i18n":{"ar":{"prompt":"أكمل صيغ المقارنة من hoch وviel.","explain":"hoch تصبح höher ثم تأخذ -er للمذكر في الرفع بعد ein. viel تصبح mehr هنا بلا نهاية.","hints":["احفظ صيغة hoch الشاذة. الماء هنا كمية."]},"de":{"prompt":"Ergänze die Komparative von `hoch` und `viel`.","explain":"`hoch` wird zu `höher` und bekommt `-er` für Maskulinum im Nominativ nach `ein`. `viel` wird zu `mehr` – hier ohne Endung.","hints":["Merk dir die unregelmäßige Form von `hoch`. Das Wasser ist hier eine Menge."]}}},{"id":"komparativ-7","type":"text","difficulty":3,"answer":"mit einer besseren Variante","i18n":{"ar":{"prompt":"حوّل Die Variante ist besser إلى مجموعة اسمية نكرة في الداتيف بعد mit.","explain":"mit يطلب الداتيف. أداة النكرة للمؤنث einer، وتتبعها besseren.","hints":["ابدأ بأداة الداتيف المؤنثة وأضف نهاية الصفة إلى besser."]},"de":{"prompt":"Mach aus `Die Variante ist besser` eine unbestimmte Nominalgruppe im Dativ nach `mit`.","explain":"`mit` verlangt den Dativ. Der unbestimmte Artikel feminin ist `einer`, danach `besseren`.","hints":["Beginne mit dem femininen Dativartikel und häng die Adjektivendung an `besser`."]}}},{"id":"komparativ-8","type":"text","difficulty":3,"answer":"Ich nehme einen gesünderen Salat.","context":"Ich nehme einen gesünder Salat.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الصيغة `gesünder` صحيحة للمقارنة. موقعها قبل اسم مذكر بعد `einen` يتطلب `-en` إضافية.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Form `gesünder` ist als Komparativ richtig. Vor einem maskulinen Nomen nach `einen` braucht sie aber zusätzlich `-en`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"komparativ-9","type":"text","difficulty":2,"answer":"`ein besseres Gericht`. أساس المقارنة `besser` ثم النهاية `-es`.","i18n":{"ar":{"prompt":"كيف تصف طبقًا محايدًا بعد `ein` باستعمال `besser` في الأكوزاتيف؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wie beschreibst du ein neutrales Gericht nach `ein` mit `besser` im Akkusativ?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"superlativ","level":"B1.1","island":"adjektive","order":2,"prereqs":["komparativ"],"emoji":"🏆","german":"Adjektivdeklination mit Superlativ","source":{"lektion":5,"kind":"toc"},"pattern":["am … -sten (nach Verb)","·","der / die / das … -st- + Endung (vor Nomen)"],"frames":[{"k":"main","parts":[["vf","Diese Suppe"],["v","ist"],["hl","am günstigsten"]]},{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","die"],["hl","günstigste"],["mf","Suppe"]]}],"example":"Diese Suppe ist am günstigsten. → Das ist die günstigste Suppe.","stepExamples":["günstig → günstigst- · frisch → frischest-","Die Suppe ist am günstigsten.","die günstigste Suppe · das frischeste Brot","den besten Salat · mit der frischesten Milch · die günstigsten Angebote"],"pitfallPair":"Ich nehme das am besten Brot. → Ich nehme das beste Brot.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/4067"],"i18n":{"ar":{"title":"تصريف صفة التفضيل","lead":"تستعمل درجة التفضيل لأعلى أو أدنى قيمة داخل مجموعة. تعلّم التبديل بين وصف النتيجة بعد الفعل ووصف الاسم مباشرة.","translation":"هذا الحساء هو الأرخص ← هذا أرخص حساء.","steps":[{"text":"ابنِ أساس التفضيل","why":"غالبًا تحصل على `-st-`. وقد تحتاج `-est-` لتسهيل النطق كما في `heißest-`. مع `frisch` تُستعمل الصيغتان `frischest-` و`frischst-`. احفظ الصيغ الشائعة مثل `best-` و`höchst-` و`nächst-`."},{"text":"استعمل am … -sten بعد الفعل عند وصف الدرجة","why":"تتكون الصيغة من `am` ودرجة التفضيل في هذه البنية، مثل `am besten` و`am frischesten`. وهي تعمل أيضًا مع الفعل في `Sie kocht am schnellsten`."},{"text":"احذف am إذا وضعت الصفة مباشرة قبل اسم","why":"استخدم أساس التفضيل وأضف نهاية صفة. هنا تأتي `-e` بعد أداة التعريف للمؤنث والمحايد في الرفع. تجمع `frischeste` بين الأساس `frischest-` والنهاية `-e`."},{"text":"صرّف في الحالات الأخرى","why":"بعد الأداة المحددة نجد `-en` في المذكر في الأكوزاتيف، وفي الداتيف، وفي الجمع هنا. درجة التفضيل لا تغيّر قواعد الحالات."}],"explain":["اذكر المجموعة عند الحاجة، مثل `das günstigste Gericht auf der Karte` أو `Von allen Gerichten ist dieses am günstigsten`. وتظهر الصفة بعد أداة ملكية أيضًا، كما في `mein ältester Bruder`. قارن `mein älterer Bruder` التي تعني الأخ الأكبر مقارنةً بآخر، و`mein ältester Bruder` التي تحدد الأكبر ضمن المجموعة."],"pitfall":"إذا قصدت «سآخذ أفضل خبز» فقل `Ich nehme das beste Brot.` قد تأتي `am besten` في جملة أخرى بمعنى «من الأفضل»، مثل `Am besten nehme ich Brot`.","recall":["لماذا نكتب `mit dem besten Plan`؟","`mit` يطلب الداتيف، وبعد `dem` تأخذ صفة التفضيل `-en`."],"linkTitles":["فهرس قواعد الوحدة 5 · telc، ص 3","حلول الكتاب الرسمية · telc","تصريف الصفات · grammis"],"table":[["مع أداة التعريف","مذكر","مؤنث","محايد","جمع"],["Nominativ","der beste Plan","die beste Idee","das beste Bild","die besten Pläne"],["Akkusativ","den besten Plan","die beste Idee","das beste Bild","die besten Pläne"],["Dativ","dem besten Plan","der besten Idee","dem besten Bild","den besten Plänen"],["Genitiv","des besten Plans","der besten Idee","des besten Bildes","der besten Pläne"]]},"de":{"title":"Adjektivdeklination mit Superlativ","lead":"Mit dem Superlativ nennst du den höchsten oder niedrigsten Wert in einer Gruppe. Lern, zwischen der Form nach dem Verb und der Form direkt vor dem Nomen zu wechseln.","steps":[{"text":"Bilde die Superlativ-Basis","why":"Meist bekommst du `-st-`. Für die Aussprache brauchst du manchmal `-est-`, wie in `heißest-`. Bei `frisch` gehen `frischest-` und `frischst-`. Lern die häufigen Formen `best-`, `höchst-`, `nächst-`."},{"text":"Benutze am … -sten nach dem Verb","why":"Die Form besteht aus `am` und dem Superlativ: `am besten`, `am frischesten`. Sie funktioniert auch mit Verben: `Sie kocht am schnellsten`."},{"text":"Lass am weg, wenn das Adjektiv direkt vor dem Nomen steht","why":"Nimm die Superlativ-Basis und häng eine Adjektivendung an. Hier kommt `-e` nach dem bestimmten Artikel bei Femininum und Neutrum im Nominativ. `frischeste` = Basis `frischest-` + Endung `-e`."},{"text":"Dekliniere in den anderen Kasus","why":"Nach dem bestimmten Artikel steht `-en` im Akkusativ maskulin, im Dativ und hier im Plural. Der Superlativ ändert die Kasusregeln nicht."}],"explain":["Nenne die Gruppe, wenn nötig: `das günstigste Gericht auf der Karte` oder `Von allen Gerichten ist dieses am günstigsten`. Das Adjektiv steht auch nach einem Possessivartikel: `mein ältester Bruder`. Vergleiche `mein älterer Bruder` (älter als ein anderer) mit `mein ältester Bruder` (der Älteste in der Gruppe)."],"pitfall":"Meinst du „Ich nehme das beste Brot“, sag `Ich nehme das beste Brot.` `am besten` kann in einem anderen Satz „es ist das Beste, …“ bedeuten: `Am besten nehme ich Brot`.","recall":["Warum schreiben wir `mit dem besten Plan`?","`mit` verlangt den Dativ, und nach `dem` bekommt der Superlativ `-en`."],"linkTitles":["Grammatikübersicht Lektion 5 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Adjektivdeklination · grammis"],"table":[["mit bestimmtem Artikel","Maskulin","Feminin","Neutrum","Plural"],["Nominativ","der beste Plan","die beste Idee","das beste Bild","die besten Pläne"],["Akkusativ","den besten Plan","die beste Idee","das beste Bild","die besten Pläne"],["Dativ","dem besten Plan","der besten Idee","dem besten Bild","den besten Plänen"],["Genitiv","des besten Plans","der besten Idee","des besten Bildes","der besten Pläne"]]}},"questions":[{"id":"superlativ-1","type":"cloze","difficulty":1,"text":"Dieses Brot schmeckt am {{1}}.","blanks":[["besten"]],"i18n":{"ar":{"prompt":"أكمل صيغة التفضيل من gut بعد الفعل.","explain":"gut تصبح best- في التفضيل. في بناء am نكتب am besten.","hints":["تذكّر الأساس الشاذ للتفضيل."]},"de":{"prompt":"Ergänze den Superlativ von `gut` nach dem Verb.","explain":"`gut` wird im Superlativ zu `best-`. Mit `am` schreiben wir `am besten`.","hints":["Denk an die unregelmäßige Superlativ-Basis."]}}},{"id":"superlativ-2","type":"cloze","difficulty":1,"text":"Das ist die {{1}} Suppe.","blanks":[["günstigste"]],"i18n":{"ar":{"prompt":"أكمل التفضيل من günstig قبل اسم مؤنث.","explain":"günstigst- + -e بعد die للمؤنث في الرفع.","hints":["أضف نهاية الصفة بعد أساس التفضيل."]},"de":{"prompt":"Ergänze den Superlativ von `günstig` vor einem femininen Nomen.","explain":"`günstigst-` + `-e` nach `die` für Femininum im Nominativ.","hints":["Häng nach der Superlativ-Basis die Adjektivendung an."]}}},{"id":"superlativ-3","type":"mcq","difficulty":1,"options":["das heißeste Gericht","das heißste Gericht","das am heißesten Gericht"],"answer":0,"i18n":{"ar":{"prompt":"اختر العبارة التي تعني «أكثر الأطباق سخونة».","explain":"heiß يعطي heißest-. بعد das وقبل Gericht نضيف -e ونستعمل صيغة التفضيل بلا am.","hints":["انظر إلى نهاية heiß وإلى موقع الصفة قبل الاسم."]},"de":{"prompt":"Wähle den Ausdruck für „das heißeste Gericht“.","explain":"`heiß` ergibt `heißest-`. Nach `das` und vor `Gericht` kommt `-e`, und der Superlativ steht ohne `am`.","hints":["Schau auf das Ende von `heiß` und auf die Position vor dem Nomen."]}}},{"id":"superlativ-4","type":"cloze","difficulty":2,"text":"Ich nehme den {{1}} Salat mit der {{2}} Milch.","blanks":[["besten"],["frischesten","frischsten"]],"i18n":{"ar":{"prompt":"أكمل صيغتي التفضيل من gut وfrisch.","explain":"تأخذ الصفتان -en بعد الأداة هنا. الأساسان best- وfrischest-.","hints":["حدّد حالتي المذكر بعد den والمؤنث بعد mit."]},"de":{"prompt":"Ergänze die Superlative von `gut` und `frisch`.","explain":"Beide Adjektive bekommen hier nach dem Artikel `-en`. Die Basen sind `best-` und `frischest-`.","hints":["Bestimme den Kasus beim Maskulinum nach `den` und beim Femininum nach `mit`."]}}},{"id":"superlativ-5","type":"cloze","difficulty":2,"text":"mein {{1}} Bruder","blanks":[["ältester"]],"i18n":{"ar":{"prompt":"أكمل التفضيل من alt بعد كلمة الملكية.","explain":"alt يعطي ältest-. المذكر في الرفع بعد mein يحتاج -er على الصفة.","hints":["استعمل التفضيل ثم لاحظ غياب علامة النهاية عن mein."]},"de":{"prompt":"Ergänze den Superlativ von `alt` nach dem Possessivartikel.","explain":"`alt` ergibt `ältest-`. Maskulinum im Nominativ nach `mein` braucht `-er` am Adjektiv.","hints":["Bilde den Superlativ und beachte, dass `mein` keine Endung zeigt."]}}},{"id":"superlativ-6","type":"mcq","difficulty":2,"options":["Von allen Gerichten ist dieses am gesündesten.","Von allen Gerichten ist dieses gesünder.","Von allen Gerichten ist dieses so gesund wie das andere."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تعني «هذا الطبق هو الأصحّ بين جميع الأطباق»؟","explain":"am gesündesten للتفضيل. gesünder للمقارنة، وso gesund wie للتساوي.","hints":["أشر إلى أعلى درجة ضمن مجموعة."]},"de":{"prompt":"Welcher Satz bedeutet „Dieses Gericht ist von allen das gesündeste“?","explain":"`am gesündesten` ist Superlativ, `gesünder` Komparativ, `so gesund wie` Gleichheit.","hints":["Zeig den höchsten Grad in einer Gruppe."]}}},{"id":"superlativ-7","type":"text","difficulty":3,"answer":"Das sind die günstigsten Angebote.","i18n":{"ar":{"prompt":"أعد صياغة Diese Angebote sind am günstigsten بدءًا من Das sind die، واذكر الاسم.","explain":"تُحذف am في بناء الصفة قبل الاسم، ويأخذ الجمع بعد die نهاية -en.","hints":["انقل التفضيل إلى ما قبل جمع معرّف."]},"de":{"prompt":"Formuliere `Diese Angebote sind am günstigsten` neu, beginne mit `Das sind die` und nenne das Nomen.","explain":"Vor dem Nomen fällt `am` weg, und der Plural nach `die` bekommt `-en`.","hints":["Stell den Superlativ vor ein bestimmtes Pluralnomen."]}}},{"id":"superlativ-8","type":"text","difficulty":3,"answer":"Ich nehme das beste Brot.","context":"Ich nehme das am besten Brot.","i18n":{"ar":{"prompt":"صحّح الجملة حتى تعني «سآخذ أفضل خبز».","explain":"إذا قصدت «سآخذ أفضل خبز» فقل `Ich nehme das beste Brot.` قد تأتي `am besten` في جملة أخرى بمعنى «من الأفضل»، مثل `Am besten nehme ich Brot`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Satz, sodass er „Ich nehme das beste Brot“ bedeutet.","explain":"Meinst du „Ich nehme das beste Brot“, sag `Ich nehme das beste Brot.` `am besten` kann in einem anderen Satz „es ist das Beste, …“ bedeuten: `Am besten nehme ich Brot`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"superlativ-9","type":"text","difficulty":2,"answer":"`mit` يطلب الداتيف، وبعد `dem` تأخذ صفة التفضيل `-en`.","i18n":{"ar":{"prompt":"لماذا نكتب `mit dem besten Plan`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Warum schreiben wir `mit dem besten Plan`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"genitiv-adjektiv","level":"B1.1","island":"adjektive","order":3,"prereqs":["genitiv"],"emoji":"🧶","german":"Adjektivdeklination im Genitiv","source":{"lektion":4,"kind":"toc"},"pattern":["mit Artikel → -en","·","ohne Artikel: f / Pl → -er","·","m / n → -en"],"frames":[{"k":"np","parts":[["c","wegen"],["n","des"],["hl","starken"],["n","Regens"]]},{"k":"np","parts":[["c","wegen"],["hl","starker"],["n","Regenfälle"]]}],"example":"wegen des starken Regens · wegen starker Regenfälle","stepExamples":["trotz des kalten Windes","eines guten Freundes · der netten Nachbarin · meiner neuen Kollegen","wegen starker Kälte · wegen starker Regenfälle","trotz starken Windes · der Geschmack frischen Brotes"],"pitfallPair":"wegen starken Kälte → wegen starker Kälte","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/korpusgrammatik/6941"],"i18n":{"ar":{"title":"نهايات الصفة في Genitiv","lead":"عندما تضيف صفة إلى اسم في الجينيتيف، تتوزع علامات الحالة بين الأداة والصفة والاسم. لاحظ ما يظهر بالفعل قبل أن تختار نهاية الصفة.","translation":"بسبب المطر الغزير · بسبب أمطار غزيرة.","steps":[{"text":"تعرّف إلى المجموعة كلها","why":"أولًا يحدد `trotz` الجينيتيف. الاسم `Wind` مذكر وتظهر الحالة في `des` و`Windes`. تأخذ الصفة `-en`."},{"text":"اكتب -en بعد الأداة المحددة أو ما يشبه ein","why":"تأخذ الصفة `-en` في كل الأجناس وفي الجمع هنا. تعمل أدوات الملكية مثل `meiner` بالطريقة نفسها في الجينيتيف."},{"text":"استعمل -er بلا أداة للمؤنث والجمع","why":"تحمل الصفة علامة الحالة عندما تغيب الأداة في هذين الصنفين. أسماء المؤنث والجمع نفسها لا تضيف `-s` خاصة بالجينيتيف."},{"text":"استعمل -en بلا أداة للمذكر والمحايد","why":"في هذين المثالين يحمل الاسم نهاية الجينيتيف `-es`. تأتي الصفة بـ `-en` حتى من دون أداة. افحص شكل الاسم إلى جانب الصفة."}],"explain":["إذا اجتمعت صفتان لهما وظيفة متوازية اتبعتا نمط التصريف نفسه في أمثلة مثل `wegen des starken, kalten Windes` و`wegen starker, anhaltender Regenfälle`. قارن أيضًا `wegen der kalten Luft` و`wegen kalter Luft`. الاسم مؤنث في الاثنين، ووجود الأداة هو الذي يغيّر النهاية."],"pitfall":"الاسم مؤنث والجينيتيف هنا بلا أداة، فتأخذ الصفة `-er`.","recall":["أين علامات الجينيتيف في `des alten Computers`؟","تظهر `des` للأداة و`-s` في الاسم. الصفة `alt` تأخذ `-en` بعد الأداة."],"linkTitles":["فهرس قواعد الوحدة 4 · telc، ص 3","حلول الكتاب الرسمية · telc","علامات الجينيتيف · grammis"],"table":[["أداة","مذكر","مؤنث","محايد","جمع"],["محدّدة","des kalten Windes","der kalten Luft","des kalten Wassers","der kalten Tage"],["بلا أداة","kalten Windes","kalter Luft","kalten Wassers","kalter Tage"]]},"de":{"title":"Adjektivdeklination im Genitiv","lead":"Kommt ein Adjektiv zu einem Nomen im Genitiv, verteilen sich die Kasussignale auf Artikel, Adjektiv und Nomen. Schau, was schon sichtbar ist, bevor du die Adjektivendung wählst.","steps":[{"text":"Erkenne die ganze Gruppe","why":"Zuerst bestimmt `trotz` den Genitiv. `Wind` ist maskulin; den Kasus zeigen `des` und `Windes`. Das Adjektiv bekommt `-en`."},{"text":"Schreib -en nach bestimmtem Artikel oder ein-Wort","why":"Das Adjektiv bekommt hier bei allen Genera und im Plural `-en`. Possessivartikel wie `meiner` funktionieren im Genitiv genauso."},{"text":"Benutze -er ohne Artikel bei Femininum und Plural","why":"Fehlt der Artikel, trägt das Adjektiv das Kasussignal. Feminine Nomen und Pluralnomen bekommen selbst kein Genitiv-`s`."},{"text":"Benutze -en ohne Artikel bei Maskulinum und Neutrum","why":"In diesen Beispielen trägt das Nomen die Genitivendung `-es`. Das Adjektiv bekommt `-en`, auch ohne Artikel. Prüf die Form des Nomens zusammen mit dem Adjektiv."}],"explain":["Stehen zwei gleichrangige Adjektive zusammen, folgen sie demselben Muster: `wegen des starken, kalten Windes` und `wegen starker, anhaltender Regenfälle`. Vergleiche auch `wegen der kalten Luft` und `wegen kalter Luft`: In beiden ist das Nomen feminin – nur der Artikel ändert die Endung."],"pitfall":"Das Nomen ist feminin und der Genitiv steht hier ohne Artikel, deshalb bekommt das Adjektiv `-er`.","recall":["Wo sind die Genitivsignale in `des alten Computers`?","`des` am Artikel und `-s` am Nomen. Das Adjektiv `alt` bekommt nach dem Artikel `-en`."],"linkTitles":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Genitivmarkierung · grammis"],"table":[["Artikel","Maskulin","Feminin","Neutrum","Plural"],["bestimmt","des kalten Windes","der kalten Luft","des kalten Wassers","der kalten Tage"],["ohne Artikel","kalten Windes","kalter Luft","kalten Wassers","kalter Tage"]]}},"questions":[{"id":"genitiv-adjektiv-1","type":"cloze","difficulty":1,"text":"wegen des stark{{1}} Regens","blanks":[["-en","en"]],"i18n":{"ar":{"prompt":"أكمل نهاية الصفة.","explain":"بعد des تأخذ الصفة في الجينيتيف -en.","hints":["هل الأداة موجودة؟"]},"de":{"prompt":"Ergänze die Adjektivendung.","explain":"Nach `des` bekommt das Adjektiv im Genitiv `-en`.","hints":["Gibt es einen Artikel?"]}}},{"id":"genitiv-adjektiv-2","type":"cloze","difficulty":1,"text":"die Idee einer {{1}} Kollegin","blanks":[["netten"]],"i18n":{"ar":{"prompt":"أكمل الصفة بعد einer. استعمل nett.","explain":"بعد einer تأخذ الصفة -en في الجينيتيف.","hints":["الأداة هنا تحمل علامة الجينيتيف."]},"de":{"prompt":"Ergänze das Adjektiv nach `einer`. Benutze `nett`.","explain":"Nach `einer` bekommt das Adjektiv im Genitiv `-en`.","hints":["Der Artikel trägt hier das Genitivsignal."]}}},{"id":"genitiv-adjektiv-3","type":"mcq","difficulty":1,"options":["wegen starker Regenfälle","wegen starken Regenfälle","wegen starke Regenfälle"],"answer":0,"i18n":{"ar":{"prompt":"اختر جينيتيف الجمع بلا أداة.","explain":"-er علامة الصفة للجمع بلا أداة. -en يلائم وجود أداة في هذا المثال.","hints":["في الجمع بلا أداة احمل العلامة على الصفة."]},"de":{"prompt":"Wähle den Genitiv Plural ohne Artikel.","explain":"`-er` ist das Signal des Adjektivs im Plural ohne Artikel. `-en` passt, wenn es in diesem Beispiel einen Artikel gibt.","hints":["Im Plural ohne Artikel trägt das Adjektiv das Signal."]}}},{"id":"genitiv-adjektiv-4","type":"cloze","difficulty":2,"text":"der Duft {{1}} Luft · der Duft {{2}} Brotes","blanks":[["frischer"],["frischen"]],"i18n":{"ar":{"prompt":"أكمل الصفة بلا أداة. استعمل frisch في الموضعين.","explain":"Luft مؤنث بلا أداة فتأخذ الصفة -er. Brot محايد والجينيتيف ظاهر في Brotes، فتأخذ الصفة -en.","hints":["ميّز المؤنث عن المحايد."]},"de":{"prompt":"Ergänze das Adjektiv ohne Artikel. Benutze zweimal `frisch`.","explain":"`Luft` ist feminin ohne Artikel, also `-er`. `Brot` ist neutral, der Genitiv ist in `Brotes` sichtbar, also `-en`.","hints":["Unterscheide Femininum und Neutrum."]}}},{"id":"genitiv-adjektiv-5","type":"cloze","difficulty":2,"text":"trotz {{1}}, {{2}} Winde","blanks":[["kalter"],["starker"]],"i18n":{"ar":{"prompt":"أكمل الصفتين بلا أداة من kalt وstark.","explain":"في جينيتيف الجمع بلا أداة تأخذ الصفتان -er.","hints":["الصفتان تصفان الجمع نفسه."]},"de":{"prompt":"Ergänze beide Adjektive ohne Artikel mit `kalt` und `stark`.","explain":"Im Genitiv Plural ohne Artikel bekommen beide Adjektive `-er`.","hints":["Beide Adjektive beschreiben denselben Plural."]}}},{"id":"genitiv-adjektiv-6","type":"mcq","difficulty":2,"options":["die Fragen meiner neuen Nachbarn","die Fragen meiner neuer Nachbarn","die Fragen meiner neue Nachbarn"],"answer":0,"i18n":{"ar":{"prompt":"أي صيغة صحيحة مع كلمة الملكية meiner؟","explain":"بعد meiner تأخذ الصفة -en في الجينيتيف مهما كان الجنس أو العدد.","hints":["تعامل مع meiner كما تتعامل مع أداة مصرّفة."]},"de":{"prompt":"Welche Form ist mit dem Possessivartikel `meiner` richtig?","explain":"Nach `meiner` bekommt das Adjektiv im Genitiv immer `-en`, egal welches Genus oder welcher Numerus.","hints":["Behandle `meiner` wie einen deklinierten Artikel."]}}},{"id":"genitiv-adjektiv-7","type":"text","difficulty":3,"answer":"wegen starker Kälte","i18n":{"ar":{"prompt":"أعد كتابة wegen der starken Kälte بلا أداة مع تصريف الصفة.","explain":"الاسم مؤنث، لذلك نكتب starker بلا أداة في الجينيتيف.","hints":["بعد حذف der تنتقل العلامة إلى الصفة."]},"de":{"prompt":"Schreib `wegen der starken Kälte` ohne Artikel und dekliniere das Adjektiv.","explain":"Das Nomen ist feminin, deshalb schreiben wir ohne Artikel im Genitiv `starker`.","hints":["Ohne `der` wandert das Signal zum Adjektiv."]}}},{"id":"genitiv-adjektiv-8","type":"text","difficulty":3,"answer":"wegen starker Kälte","context":"wegen starken Kälte","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الاسم مؤنث والجينيتيف هنا بلا أداة، فتأخذ الصفة `-er`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Das Nomen ist feminin und der Genitiv steht hier ohne Artikel, deshalb bekommt das Adjektiv `-er`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"genitiv-adjektiv-9","type":"text","difficulty":2,"answer":"تظهر `des` للأداة و`-s` في الاسم. الصفة `alt` تأخذ `-en` بعد الأداة.","i18n":{"ar":{"prompt":"أين علامات الجينيتيف في `des alten Computers`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wo sind die Genitivsignale in `des alten Computers`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"partizip1","level":"B1.1","island":"adjektive","order":4,"prereqs":[],"emoji":"🌱","german":"Partizip I","source":{"lektion":2,"kind":"toc"},"pattern":["Infinitiv","+ d","+ Adjektivendung"],"frames":[{"k":"np","parts":[["n","die"],["hl","im Hof spielenden"],["n","Kinder"]]},{"k":"rel","parts":[["n","die Kinder,"],["c","die"],["mf","im Hof"],["ve","spielen"]]}],"example":"Die Kinder spielen. → die spielenden Kinder","stepExamples":["spielen","spielen + d → spielend","die spielenden Kinder","die im Hof spielenden Kinder"],"pitfallPair":"ein weinenes Kind → ein weinendes Kind","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/terms/view/180"],"i18n":{"ar":{"title":"وصف من يقوم بالفعل","lead":"حين تريد وصف شخص أو شيء بفعل يؤديه، يمكنك بناء صيغة `Partizip I` من مصدر الفعل. غالبًا يصف الاسم وهو يقوم بالفعل في الوقت المعني بالسياق.","translation":"الأطفال يلعبون ← الأطفال الذين يلعبون.","steps":[{"text":"ابدأ بالمصدر كاملًا","why":"المصدر هو شكل القاموس. احتفظ به كاملًا قبل إضافة حرف الاشتقاق."},{"text":"أضف d في نهاية المصدر","why":"هذه صيغة `Partizip I` الأساسية. من `arbeiten` نحصل على `arbeitend` ومن `anrufen` على `anrufend`. تبقى البادئة المتصلة في صيغة المصدر جزءًا من الكلمة."},{"text":"ضع الصيغة قبل الاسم مع النهاية","why":"عندما تتحول الصيغة إلى صفة قبل الاسم، تلحقها نهاية الصفة. هنا الجمع بعد `die` يأخذ `-en`. حرف `d` جزء من الصيغة، و`-en` جزء من التصريف."},{"text":"وسّع الوصف إذا احتجت","why":"تسبق معلومات مثل `im Hof` الصفة. تستطيع تفكيك الوصف إلى جملة وصل، `die Kinder, die im Hof spielen`، لتحدد من يقوم بالفعل."}],"explain":["الزمن يُفهم من السياق. في `Gestern sah ich ein schlafendes Kind` كان الطفل نائمًا وقت رؤيتي له أمس. وفي `Sie kam lächelnd herein` تصف `lächelnd` طريقة دخولها، وتأتي هنا بلا نهاية صفة لأنها خارج المجموعة الاسمية. الصيغتان الشائعتان `seiend` و`tuend` تبنيان من `sein` و`tun` مع حرف العلة المسموع في الصيغة."],"pitfall":"أضف `d` إلى `weinen` أولًا، ثم `-es` للمحايد بعد `ein` في هذا السياق.","recall":["كيف تفكّ `die wartenden Gäste` إلى جملة وصل؟","`die Gäste, die warten`. الضيوف أنفسهم يقومون بالانتظار."],"linkTitles":["فهرس قواعد الوحدة 2 · telc، ص 2","حلول الكتاب الرسمية · telc","Partizip I · grammis"]},"de":{"title":"Partizip I","lead":"Willst du eine Person oder Sache durch eine Handlung beschreiben, die sie gerade ausführt, kannst du aus dem Infinitiv das `Partizip I` bilden. Meist beschreibt es, dass das Nomen die Handlung zur gleichen Zeit ausführt.","steps":[{"text":"Beginne mit dem vollständigen Infinitiv","why":"Der Infinitiv ist die Wörterbuchform. Behalte ihn komplett, bevor du die Endung anhängst."},{"text":"Häng ein d an den Infinitiv","why":"Das ist die Grundform des `Partizip I`. Aus `arbeiten` wird `arbeitend`, aus `anrufen` `anrufend`. Das Präfix bleibt Teil des Wortes."},{"text":"Stell die Form mit Endung vor das Nomen","why":"Wird das Partizip zum Adjektiv vor einem Nomen, bekommt es eine Adjektivendung. Hier: Plural nach `die` → `-en`. Das `d` gehört zum Partizip, das `-en` zur Deklination."},{"text":"Erweitere die Beschreibung bei Bedarf","why":"Angaben wie `im Hof` stehen vor dem Partizip. Du kannst die Gruppe in einen Relativsatz auflösen – `die Kinder, die im Hof spielen` – und so sehen, wer die Handlung ausführt."}],"explain":["Die Zeit ergibt sich aus dem Kontext. In `Gestern sah ich ein schlafendes Kind` schlief das Kind, als ich es gestern sah. In `Sie kam lächelnd herein` beschreibt `lächelnd`, wie sie hereinkam – ohne Adjektivendung, weil es außerhalb einer Nominalgruppe steht. Die häufigen Formen `seiend` und `tuend` werden aus `sein` und `tun` gebildet."],"pitfall":"Häng zuerst ein `d` an `weinen` und dann in diesem Kontext `-es` für das Neutrum nach `ein`.","recall":["Wie löst du `die wartenden Gäste` in einen Relativsatz auf?","`die Gäste, die warten`. Die Gäste selbst warten."],"linkTitles":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Partizip I · grammis"]}},"questions":[{"id":"partizip1-1","type":"cloze","difficulty":1,"text":"warten → {{1}}","blanks":[["wartend"]],"i18n":{"ar":{"prompt":"اكتب Partizip I من warten بلا نهاية صفة.","explain":"تضاف d إلى المصدر كاملًا.","hints":["أضف حرفًا واحدًا إلى المصدر."]},"de":{"prompt":"Schreib das Partizip I von `warten` ohne Adjektivendung.","explain":"An den vollständigen Infinitiv wird ein `d` angehängt.","hints":["Häng einen Buchstaben an den Infinitiv."]}}},{"id":"partizip1-2","type":"cloze","difficulty":1,"text":"ein {{1}} Kind","blanks":[["schlafendes"]],"i18n":{"ar":{"prompt":"كوّن صيغة الوصف من schlafen بعد ein.","explain":"schlafen + d يعطي schlafend، ثم تأتي -es مع ein Kind.","hints":["افصل اشتقاق الصيغة عن نهاية المحايد."]},"de":{"prompt":"Bilde die Form von `schlafen` nach `ein`.","explain":"`schlafen` + `d` ergibt `schlafend`, dann kommt `-es` mit `ein Kind`.","hints":["Trenne die Bildung des Partizips von der Neutrum-Endung."]}}},{"id":"partizip1-3","type":"mcq","difficulty":1,"options":["die wartenden Gäste","die gewarteten Gäste","die warten Gäste"],"answer":0,"i18n":{"ar":{"prompt":"أي وصف يعني أن الضيوف يقومون بالانتظار؟","explain":"Partizip I يدل على نشاط الضيوف. warteten/gewarteten لا يحققان هذا البناء، وwarten مصدر مجرد.","hints":["اختر صيغة المصدر + d مع النهاية المناسبة."]},"de":{"prompt":"Welche Beschreibung bedeutet, dass die Gäste gerade warten?","explain":"Das Partizip I zeigt, dass die Gäste aktiv sind. `warteten`/`gewarteten` bilden diese Struktur nicht, und `warten` ist nur der Infinitiv.","hints":["Wähle Infinitiv + d mit der passenden Endung."]}}},{"id":"partizip1-4","type":"cloze","difficulty":2,"text":"Die {{1}} Gäste warten am Eingang.","blanks":[["ankommenden"]],"i18n":{"ar":{"prompt":"اشتق الصفة من ankommen للجمع.","explain":"ankommen يصبح ankommend ثم ankommenden.","hints":["احتفظ بالبادئة وأضف نهاية الجمع بعد die."]},"de":{"prompt":"Bilde das Adjektiv von `ankommen` für den Plural.","explain":"`ankommen` wird zu `ankommend`, dann `ankommenden`.","hints":["Behalte das Präfix und häng die Pluralendung nach `die` an."]}}},{"id":"partizip1-5","type":"order","difficulty":2,"items":["die","im Hof","spielenden","Kinder"],"i18n":{"ar":{"prompt":"رتّب العبارة بوضع الوصف قبل الاسم. ضع im Hof قبل الصفة.","explain":"im Hof يحدد مكان اللعب ويتقدم على spielenden داخل المجموعة.","hints":["الوصف كله يجيب عن سؤال أي أطفال؟"]},"de":{"prompt":"Ordne den Ausdruck und stell die Beschreibung vor das Nomen. Setz `im Hof` vor das Adjektiv.","explain":"`im Hof` gibt den Ort des Spielens an und steht in der Gruppe vor `spielenden`.","hints":["Die ganze Beschreibung beantwortet die Frage: Welche Kinder?"]}}},{"id":"partizip1-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"لماذا تأتي lächelnd بلا نهاية في Sie kam lächelnd herein؟","explain":"هنا الصيغة ظرفية. عندما تصف اسمًا قبلَه، مثل ein lächelndes Kind، تأخذ نهاية.","hints":["هل توجد كلمة اسمية بعدها تصفها مباشرة؟"],"options":["تصف طريقة دخولها خارج المجموعة الاسمية.","لأن كل Partizip I بلا نهاية حتى قبل الاسم.","لأن الماضي يحذف نهايات الصفات."]},"de":{"prompt":"Warum hat `lächelnd` in `Sie kam lächelnd herein` keine Endung?","explain":"Hier wird das Partizip adverbial benutzt. Beschreibt es ein Nomen direkt davor, z. B. `ein lächelndes Kind`, bekommt es eine Endung.","hints":["Gibt es direkt danach ein Nomen, das es beschreibt?"],"options":["Es beschreibt, wie sie hereinkam – außerhalb einer Nominalgruppe.","Weil Partizip I nie eine Endung hat, auch nicht vor einem Nomen.","Weil die Vergangenheit Adjektivendungen löscht."]}}},{"id":"partizip1-7","type":"text","difficulty":3,"answer":"die im Garten lachenden Kinder","i18n":{"ar":{"prompt":"حوّل Die Kinder, die im Garten lachen إلى مجموعة اسمية فيها Partizip I.","explain":"lachen + d يعطي lachend. أضف -en للجمع بعد die وضع im Garten قبل الصفة.","hints":["من الذي يضحك؟ أين توضع معلومات المكان داخل الوصف؟"]},"de":{"prompt":"Mach aus `Die Kinder, die im Garten lachen` eine Nominalgruppe mit Partizip I.","explain":"`lachen` + `d` ergibt `lachend`. Häng `-en` für den Plural nach `die` an und stell `im Garten` vor das Adjektiv.","hints":["Wer lacht? Wo steht die Ortsangabe in der Beschreibung?"]}}},{"id":"partizip1-8","type":"text","difficulty":3,"answer":"ein weinendes Kind","context":"ein weinenes Kind","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"أضف `d` إلى `weinen` أولًا، ثم `-es` للمحايد بعد `ein` في هذا السياق.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Häng zuerst ein `d` an `weinen` und dann in diesem Kontext `-es` für das Neutrum nach `ein`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"partizip1-9","type":"text","difficulty":2,"answer":"`die Gäste, die warten`. الضيوف أنفسهم يقومون بالانتظار.","i18n":{"ar":{"prompt":"كيف تفكّ `die wartenden Gäste` إلى جملة وصل؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wie löst du `die wartenden Gäste` in einen Relativsatz auf?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"partizip-adjektiv","level":"B1.1","island":"adjektive","order":5,"prereqs":["partizip1"],"emoji":"🎨","german":"Partizip I und II als Adjektiv","source":{"lektion":2,"kind":"toc"},"pattern":["Partizip I = macht gerade (aktiv)","·","Partizip II = Ergebnis (passiv / fertig)"],"frames":[{"k":"np","parts":[["n","die"],["hl","schließende"],["n","Tür"]]},{"k":"np","parts":[["n","die"],["hl","geschlossene"],["n","Tür"]]}],"example":"die schließende Tür · die geschlossene Tür","stepExamples":["die reparierende Person","das reparierte Fahrrad","öffnen → geöffnet · schreiben → geschrieben · verkaufen → verkauft","mit einem frisch gestrichenen Tisch"],"pitfallPair":"die reparierenden Fahrräder → die reparierten Fahrräder","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/terms/view/180"],"i18n":{"ar":{"title":"الفرق بين الوصف بالفعل ونتيجته","lead":"يقودك اختيار الصيغة إلى سؤالين. هل الاسم يقوم بالفعل؟ أم وقع عليه الإجراء أو صار في الحالة الناتجة عنه؟","translation":
