in":"بعد الكلمة جملة كاملة فيها فعل، فنحتاج إلى أداة الربط `Bevor`. أما `vor` فتأتي قبل اسم.","hints":["هل يأتي بعدها اسم أم جملة؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Danach folgt ein ganzer Satz mit Verb, also brauchst du den Subjunktor `Bevor`. `vor` steht vor einem Nomen.","hints":["Folgt ein Nomen oder ein Satz?"]}}},{"id":"bevor-bis-9","type":"text","difficulty":2,"answer":"Ich lerne jeden Tag, bis ich die Prüfung bestanden habe.","i18n":{"ar":{"prompt":"اكتب ما ستفعله حتى تنجح في الامتحان. استعمل `bis`.","explain":"مثال: `Ich lerne jeden Tag, bis ich die Prüfung bestanden habe.`","hints":["الفعل المصرف في آخر جملة `bis`."]},"de":{"prompt":"Schreib, was du tust, bis du die Prüfung bestanden hast. Benutze `bis`.","explain":"Zum Beispiel: `Ich lerne jeden Tag, bis ich die Prüfung bestanden habe.`","hints":["Das konjugierte Verb steht am Ende des bis-Satzes."]}}}]},{"id":"seit-waehrend","level":"B1.2","island":"zeiten","order":4,"prereqs":[],"emoji":"🕰️","german":"Temporale Nebensätze mit seit(dem) / während","source":{"lektion":10,"kind":"toc"},"pattern":["seit(dem) / während","…","Verb am Ende"],"frames":[{"k":"sub","parts":[["c","Seit"],["mf","ich in Berlin"],["ve","wohne"]]},{"k":"main","parts":[["vf","Seit ich in Berlin wohne,"],["v","lerne"],["mf","ich Deutsch"]]},{"k":"sub","parts":[["c","während"],["mf","ich"],["ve","koche"]]}],"example":"Seit ich in Berlin wohne, lerne ich Deutsch.","stepExamples":["Ich wohne seit zwei Jahren in Berlin.","Seit ich in Berlin wohne, lerne ich Deutsch.","Seitdem sie Rad fährt, ist sie fitter.","Während ich koche, höre ich Radio.","Während des Essens telefoniert er nie."],"pitfallPair":"Seit ich bin in Berlin, lerne ich Deutsch. → Seit ich in Berlin bin, lerne ich Deutsch.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/2104","https://www.dwds.de/wb/seitdem"],"i18n":{"ar":{"title":"منذ أن وبينما: seit(dem) و während","lead":"`seit` أو `seitdem` تحدد بداية أمر ما زال مستمرًا حتى الآن. و`während` تقول إن أمرين يحدثان في الوقت نفسه. ستتعلم كيف تربط بهما جملتين.","translation":"منذ أن أسكن في برلين أتعلم الألمانية.","steps":[{"text":"تذكّر seit مع الاسم","why":"`seit zwei Jahren` حرف جر مع `Dativ`. السكن بدأ قبل سنتين وما زال مستمرًا، لذلك الفعل في `Präsens`."},{"text":"مع جملة كاملة: seit أو seitdem","why":"الأداتان بمعنى واحد. الفعل `wohne` في آخر الجملة التابعة، ثم `lerne ich`. وكلا الأمرين مستمر حتى الآن، فيبقى الفعلان في `Präsens`."},{"text":"seitdem تذكر سبب تغيّر بدأ في الماضي","why":"`Seitdem sie Rad fährt, ist sie fitter`: منذ أن بدأت ركوب الدراجة صارت لياقتها أفضل، وما زالت كذلك."},{"text":"während: أمران في الوقت نفسه","why":"`Während ich koche, höre ich Radio`: الطبخ والاستماع يحدثان معًا. والفعل `koche` في آخر الجملة التابعة."},{"text":"während مع الاسم تأخذ Genitiv","why":"`während` حرف جر أيضًا: `während des Essens`. أما قبل جملة كاملة فهي أداة ربط والفعل في الآخر."}],"explain":["مع `seit` يقع الحدث في الماضي ويستمر حتى الآن، لذلك يكون الفعل غالبًا في `Präsens` لا في `Perfekt`: `Ich wohne seit 2020 hier.`","لـ `während` معنى ثانٍ هو المقابلة بين أمرين («في حين أنّ»). ستتعلمه في درس خاص في جزيرة التضاد."],"pitfall":"`seit` تبدأ جملة تابعة، فيقف الفعل المصرف `bin` في آخرها.","recall":["لماذا نقول `Seit ich hier arbeite, bin ich zufrieden` وليس `war ich`؟","لأن العمل والرضا مستمران حتى الآن، والحالة الحاضرة تُذكر في `Präsens`."],"linkTitles":["الجمل الزمنية · grammis","seitdem في معجم DWDS"],"table":[["الأداة","المعنى","مع اسم","مع جملة"],["seit / seitdem","منذ (والأمر مستمر)","seit dem Umzug","seit ich umgezogen bin"],["während","في الوقت نفسه","während des Essens","während ich esse"]]},"de":{"title":"Temporale Nebensätze mit seit(dem) und während","lead":"`seit` oder `seitdem` nennt den Beginn von etwas, das bis heute andauert. `während` sagt, dass zwei Dinge gleichzeitig passieren. Du lernst, wie du damit zwei Sätze verbindest.","steps":[{"text":"Erinnere dich an seit mit Nomen","why":"`seit zwei Jahren` ist eine Präposition mit Dativ. Das Wohnen begann vor zwei Jahren und dauert an, deshalb steht das Verb im Präsens."},{"text":"Mit einem ganzen Satz: seit oder seitdem","why":"Beide bedeuten dasselbe. `wohne` steht am Ende des Nebensatzes, dann folgt `lerne ich`. Beides dauert bis heute, deshalb Präsens."},{"text":"seitdem nennt den Beginn einer Veränderung","why":"`Seitdem sie Rad fährt, ist sie fitter`: Sie fing an, Rad zu fahren, und ist seitdem fitter – bis heute."},{"text":"während: zwei Dinge gleichzeitig","why":"`Während ich koche, höre ich Radio`: Kochen und Radiohören passieren zur selben Zeit. `koche` steht am Ende des Nebensatzes."},{"text":"während mit Nomen verlangt den Genitiv","why":"`während` ist auch eine Präposition: `während des Essens`. Vor einem Satz ist es ein Subjunktor mit Verb am Ende."}],"explain":["Bei `seit` beginnt etwas in der Vergangenheit und dauert bis jetzt. Deshalb steht das Verb meist im Präsens, nicht im Perfekt: `Ich wohne seit 2020 hier.`","`während` hat noch eine zweite Bedeutung, den Gegensatz („wohingegen“). Den lernst du in einer eigenen Lektion auf den Kontrast-Klippen."],"pitfall":"`seit` leitet einen Nebensatz ein, das konjugierte Verb `bin` steht am Ende.","recall":["Warum heißt es `Seit ich hier arbeite, bin ich zufrieden` und nicht `war ich`?","Die Arbeit und die Zufriedenheit dauern bis jetzt. Den heutigen Zustand drückt das Präsens aus."],"linkTitles":["Temporalsätze · grammis","seitdem im DWDS"],"table":[["Wort","Bedeutung","mit Nomen","mit Satz"],["seit / seitdem","Beginn, dauert an","seit dem Umzug","seit ich umgezogen bin"],["während","gleichzeitig","während des Essens","während ich esse"]]}},"questions":[{"id":"seit-waehrend-1","type":"cloze","difficulty":1,"text":"Seit er Sport {{1}}, schläft er besser.","blanks":[["macht","treibt"]],"i18n":{"ar":{"prompt":"أكمل بالفعل في المكان الصحيح.","explain":"الفعل المصرف في آخر جملة `seit`: `Sport macht`. والزمن `Präsens` لأن الأمر مستمر.","hints":["الفاعل `er`."]},"de":{"prompt":"Ergänze das Verb.","explain":"Am Ende des seit-Satzes: `Sport macht`. Präsens, weil es andauert.","hints":["Das Subjekt ist `er`."]}}},{"id":"seit-waehrend-2","type":"cloze","difficulty":1,"text":"{{1}} ich auf den Bus warte, lese ich meine Nachrichten.","blanks":[["Während"]],"i18n":{"ar":{"prompt":"أكمل بأداة تعني «بينما».","explain":"الانتظار والقراءة في الوقت نفسه: `Während`.","hints":["أمران يحدثان معًا."]},"de":{"prompt":"Ergänze das Wort für „gleichzeitig“.","explain":"Warten und Lesen passieren gleichzeitig: `Während`.","hints":["Zwei Dinge zur selben Zeit."]}}},{"id":"seit-waehrend-3","type":"mcq","difficulty":1,"options":["Ich lerne seit drei Monaten Deutsch.","Ich habe seit drei Monaten Deutsch gelernt.","Ich lerne vor drei Monaten Deutsch."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تقول إنك بدأت قبل ثلاثة أشهر وما زلت تتعلم؟","explain":"مع `seit` والأمر مستمر نستعمل `Präsens`: `Ich lerne seit …`.","hints":["هل التعلم مستمر الآن؟"]},"de":{"prompt":"Welcher Satz sagt: Du hast vor drei Monaten angefangen und lernst immer noch?","explain":"Mit `seit` und andauernder Handlung steht das Präsens: `Ich lerne seit …`.","hints":["Dauert das Lernen noch an?"]}}},{"id":"seit-waehrend-4","type":"cloze","difficulty":2,"text":"{{1}} des Fluges darf man nicht rauchen. {{2}} das Flugzeug landet, bleiben alle sitzen.","blanks":[["Während"],["Während","Bis"]],"i18n":{"ar":{"prompt":"أكمل الفراغين.","explain":"الأول حرف جر مع `Genitiv`: `Während des Fluges`. والثاني أداة ربط والفعل `landet` في الآخر.","hints":["الكلمة نفسها تصلح في الموضعين."]},"de":{"prompt":"Ergänze beide Lücken.","explain":"Zuerst Präposition mit Genitiv: `Während des Fluges`. Dann Subjunktor mit `landet` am Ende.","hints":["Dasselbe Wort passt zweimal."]}}},{"id":"seit-waehrend-5","type":"order","difficulty":2,"items":["Seitdem","wir einen Hund","haben,","gehen","wir","jeden Tag spazieren."],"i18n":{"ar":{"prompt":"رتّب الجملة. ابدأ بـ `Seitdem`.","explain":"الجملة التابعة أولًا مع `haben` في آخرها، ثم `gehen wir`.","hints":["بعد الفاصلة: الفعل ثم الفاعل."]},"de":{"prompt":"Ordne den Satz. Beginne mit `Seitdem`.","explain":"Erst der Nebensatz mit `haben` am Ende, dann `gehen wir`.","hints":["Nach dem Komma: Verb, dann Subjekt."]}}},{"id":"seit-waehrend-6","type":"mcq","difficulty":2,"options":["Seit ich in der Stadt wohne, fahre ich mit der U-Bahn.","Seit ich in der Stadt wohne, bin ich mit der U-Bahn gefahren.","Seit ich wohne in der Stadt, fahre ich mit der U-Bahn."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"الأمران مستمران فالفعلان في `Präsens`، والفعل `wohne` في آخر الجملة التابعة.","hints":["انتبه إلى الزمن وإلى موقع الفعل."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Beides dauert an, also Präsens. `wohne` steht am Ende des Nebensatzes.","hints":["Achte auf Zeit und Verbstellung."]}}},{"id":"seit-waehrend-7","type":"text","difficulty":3,"answer":"Während meine Frau arbeitet, kümmere ich mich um die Kinder.","i18n":{"ar":{"prompt":"اربط بـ `während` وابدأ بها: `Meine Frau arbeitet. Gleichzeitig kümmere ich mich um die Kinder.`","explain":"`Während meine Frau arbeitet, kümmere ich mich um die Kinder.` الكلمة `gleichzeitig` لم تعد لازمة.","hints":["`während` تحل محل `gleichzeitig`."]},"de":{"prompt":"Verbinde mit `während` am Anfang: `Meine Frau arbeitet. Gleichzeitig kümmere ich mich um die Kinder.`","explain":"`Während meine Frau arbeitet, kümmere ich mich um die Kinder.` `gleichzeitig` brauchst du nicht mehr.","hints":["`während` ersetzt `gleichzeitig`."]}}},{"id":"seit-waehrend-8","type":"text","difficulty":3,"context":"Seit ich bin in Berlin, lerne ich Deutsch.","answer":"Seit ich in Berlin bin, lerne ich Deutsch.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`seit` تبدأ جملة تابعة، فيقف الفعل `bin` في آخرها.","hints":["أين الفعل بعد `seit`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`seit` leitet einen Nebensatz ein, `bin` steht am Ende.","hints":["Wo steht das Verb nach `seit`?"]}}},{"id":"seit-waehrend-9","type":"text","difficulty":2,"answer":"Seitdem ich Deutsch lerne, verstehe ich die Nachrichten besser.","i18n":{"ar":{"prompt":"اكتب ماذا تغيّر منذ أن بدأت تعلم الألمانية. استعمل `Seitdem`.","explain":"مثال: `Seitdem ich Deutsch lerne, verstehe ich die Nachrichten besser.`","hints":["الفعلان في `Präsens`."]},"de":{"prompt":"Schreib, was sich verändert hat, seit du Deutsch lernst. Benutze `Seitdem`.","explain":"Zum Beispiel: `Seitdem ich Deutsch lerne, verstehe ich die Nachrichten besser.`","hints":["Beide Verben stehen im Präsens."]}}}]},{"id":"futur1","level":"B1.2","island":"zeiten","order":5,"prereqs":[],"emoji":"🔮","german":"Futur I","source":{"lektion":12,"kind":"sample"},"pattern":["werden","+","…","+","Infinitiv"],"frames":[{"k":"main","parts":[["vf","In zehn Jahren"],["v","werden"],["mf","viele Menschen von zu Hause"],["ve","arbeiten"]]},{"k":"main","parts":[["vf","Er"],["v","wird"],["mf","wohl krank"],["ve","sein"]]},{"k":"sub","parts":[["c","dass"],["mf","es morgen"],["ve","regnen wird"]]}],"example":"In zehn Jahren werden viele Menschen von zu Hause arbeiten.","stepExamples":["Viele Menschen arbeiten von zu Hause.","In zehn Jahren werden viele Menschen von zu Hause arbeiten.","Er ist nicht da. Er wird wohl krank sein.","Ich glaube, dass es morgen regnen wird.","Nächste Woche fliege ich nach Rom."],"pitfallPair":"Morgen werde ich gehe zum Arzt. → Morgen werde ich zum Arzt gehen.","links":["https://grammis.ids-mannheim.de/vggf/2229","https://grammis.ids-mannheim.de/kontrastive-grammatik/4152"],"i18n":{"ar":{"title":"المستقبل والتوقّع بـ werden","lead":"كيف سيكون العالم بعد عشر سنوات؟ للتوقعات والتخمينات تستعمل `werden` مع المصدر في آخر الجملة. أما خطتك المؤكدة للأسبوع القادم فيكفيها المضارع مع كلمة زمن.","translation":"بعد عشر سنوات سيعمل كثير من الناس من البيت.","steps":[{"text":"ابدأ بجملة في الحاضر","why":"`arbeiten` في الموقع الثاني. نريد الآن أن نتوقع ما سيحدث في المستقبل."},{"text":"werden في الموقع الثاني والمصدر في الآخر","why":"صرّف `werden` مع الفاعل: `werden` مع `viele Menschen`. والفعل الأساسي يبقى مصدرًا في آخر الجملة: `arbeiten`."},{"text":"werden مع wohl أو sicher للتخمين","why":"`Er wird wohl krank sein` لا تتكلم عن المستقبل، بل تخمّن حالة الآن: «لعله مريض». كلمات مثل `wohl` و`wahrscheinlich` و`sicher` تقوّي هذا المعنى."},{"text":"في الجملة التابعة يأتي werden في الآخر","why":"بعد `dass` أو `weil` يقف المصدر ثم `werden` المصرف: `regnen wird`."},{"text":"للخطط المؤكدة: المضارع وكلمة زمن","why":"`Nächste Woche fliege ich nach Rom` أبسط وأكثر استعمالًا للخطط. كلمة الزمن تكفي لتدل على المستقبل."}],"explain":["تصريف `werden`: `ich werde` و`du wirst` و`er/sie/es wird` و`wir werden` و`ihr werdet` و`sie/Sie werden`.","لا تخلط بين المستقبل والمجهول: `Das Haus wird gebaut` مجهول (`werden` + `Partizip II`)، و`Wir werden ein Haus bauen` مستقبل (`werden` + مصدر)."],"pitfall":"بعد `werden` لا يأتي فعل مصرف ثانٍ. الفعل الأساسي يبقى مصدرًا في آخر الجملة.","recall":["ما الفرق بين `Sie wird gefragt` و`Sie wird fragen`؟","الأولى مجهول (يُسأل أحد إياها)، والثانية مستقبل (هي ستسأل)."],"linkTitles":["المستقبل · grammis","المستقبل في المقارنة بين اللغات · grammis"],"table":[["الضمير","werden","مثال"],["ich","werde","Ich werde dich anrufen."],["du","wirst","Du wirst das schaffen."],["er / sie / es","wird","Es wird bald regnen."],["wir","werden","Wir werden umziehen."],["ihr","werdet","Ihr werdet sehen."],["sie / Sie","werden","Sie werden zufrieden sein."]]},"de":{"title":"Futur I","lead":"Wie wird die Welt in zehn Jahren aussehen? Für Prognosen und Vermutungen nimmst du `werden` mit dem Infinitiv am Satzende. Für einen festen Plan nächste Woche reicht das Präsens mit einer Zeitangabe.","steps":[{"text":"Beginne mit einem Satz im Präsens","why":"`arbeiten` steht auf Position 2. Jetzt wollen wir eine Prognose für die Zukunft machen."},{"text":"werden auf Position 2, Infinitiv am Ende","why":"Konjugiere `werden` passend zum Subjekt: `werden` zu `viele Menschen`. Das Vollverb steht als Infinitiv am Satzende: `arbeiten`."},{"text":"werden mit wohl oder sicher für Vermutungen","why":"`Er wird wohl krank sein` spricht nicht über die Zukunft, sondern vermutet etwas über jetzt. Wörter wie `wohl`, `wahrscheinlich`, `sicher` verstärken das."},{"text":"Im Nebensatz steht werden am Ende","why":"Nach `dass` oder `weil` kommt erst der Infinitiv, dann das konjugierte `werden`: `regnen wird`."},{"text":"Für feste Pläne: Präsens mit Zeitangabe","why":"`Nächste Woche fliege ich nach Rom` ist einfacher und üblicher. Die Zeitangabe zeigt die Zukunft."}],"explain":["Konjugation von `werden`: `ich werde`, `du wirst`, `er/sie/es wird`, `wir werden`, `ihr werdet`, `sie/Sie werden`.","Verwechsle Futur und Passiv nicht: `Das Haus wird gebaut` ist Passiv (`werden` + Partizip II), `Wir werden ein Haus bauen` ist Futur (`werden` + Infinitiv)."],"pitfall":"Nach `werden` kommt kein zweites konjugiertes Verb. Das Vollverb steht als Infinitiv am Satzende.","recall":["Was ist der Unterschied zwischen `Sie wird gefragt` und `Sie wird fragen`?","Der erste Satz ist Passiv (jemand fragt sie), der zweite Futur (sie fragt später)."],"linkTitles":["Futur · grammis","Das Futur im Sprachvergleich · grammis"],"table":[["Person","werden","Beispiel"],["ich","werde","Ich werde dich anrufen."],["du","wirst","Du wirst das schaffen."],["er / sie / es","wird","Es wird bald regnen."],["wir","werden","Wir werden umziehen."],["ihr","werdet","Ihr werdet sehen."],["sie / Sie","werden","Sie werden zufrieden sein."]]}},"questions":[{"id":"futur1-1","type":"cloze","difficulty":1,"text":"Keine Sorge, du {{1}} die Prüfung bestimmt bestehen.","blanks":[["wirst"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `werden` المصرف.","explain":"مع `du`: `wirst`، والمصدر `bestehen` في الآخر.","hints":["`du` + `werden`."]},"de":{"prompt":"Ergänze die konjugierte Form von `werden`.","explain":"Mit `du`: `wirst`. Der Infinitiv `bestehen` steht am Ende.","hints":["`du` + `werden`."]}}},{"id":"futur1-2","type":"cloze","difficulty":1,"text":"In Zukunft werden Autos selbst {{1}}.","blanks":[["fahren"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `fahren` في الصيغة الصحيحة.","explain":"بعد `werden` يأتي المصدر في الآخر: `fahren`.","hints":["لا تصرّف الفعل الثاني."]},"de":{"prompt":"Ergänze `fahren` in der richtigen Form.","explain":"Nach `werden` steht der Infinitiv am Ende: `fahren`.","hints":["Das zweite Verb wird nicht konjugiert."]}}},{"id":"futur1-3","type":"mcq","difficulty":1,"options":["Ich vermute, dass er im Büro ist.","Er geht morgen ins Büro.","Er war gestern im Büro."],"answer":0,"i18n":{"ar":{"prompt":"ما معنى `Er wird wohl im Büro sein`؟","explain":"`werden` + `wohl` هنا تخمين عن الحاضر، لا خبر عن المستقبل.","hints":["`wohl` = على الأرجح."]},"de":{"prompt":"Was bedeutet `Er wird wohl im Büro sein`?","explain":"`werden` + `wohl` drückt hier eine Vermutung über jetzt aus, keine Zukunft.","hints":["`wohl` = wahrscheinlich."]}}},{"id":"futur1-4","type":"cloze","difficulty":2,"text":"Ich bin sicher, dass ihr euch in der neuen Stadt wohlfühlen {{1}}.","blanks":[["werdet"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `werden` في آخر الجملة التابعة.","explain":"مع `ihr`: `werdet`، ويقف بعد المصدر في الجملة التابعة.","hints":["`ihr` + `werden`."]},"de":{"prompt":"Ergänze `werden` am Ende des Nebensatzes.","explain":"Mit `ihr`: `werdet`. Im Nebensatz steht es nach dem Infinitiv.","hints":["`ihr` + `werden`."]}}},{"id":"futur1-5","type":"order","difficulty":2,"items":["Wir","werden","nächstes Jahr","ein Haus","kaufen."],"i18n":{"ar":{"prompt":"رتّب الجملة.","explain":"`werden` في الموقع الثاني، و`kaufen` في الآخر.","hints":["ابدأ بـ `Wir`."]},"de":{"prompt":"Ordne den Satz.","explain":"`werden` auf Position 2, `kaufen` am Ende.","hints":["Beginne mit `Wir`."]}}},{"id":"futur1-6","type":"mcq","difficulty":2,"options":["Die Straße wird repariert.","Die Stadt wird die Straße reparieren.","Die Straße wird bald fertig sein."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة في المجهول وليست في المستقبل؟","explain":"`wird repariert` = `werden` + `Partizip II`، أي مجهول. الجملتان الأخريان فيهما `werden` + مصدر.","hints":["ابحث عن `Partizip II`."]},"de":{"prompt":"Welcher Satz ist Passiv und nicht Futur?","explain":"`wird repariert` = `werden` + Partizip II, also Passiv. Die anderen haben `werden` + Infinitiv.","hints":["Such ein Partizip II."]}}},{"id":"futur1-7","type":"text","difficulty":3,"answer":"Morgen wird es schneien.","i18n":{"ar":{"prompt":"حوّل إلى `Futur I`: `Morgen schneit es.`","explain":"`Morgen wird es schneien.` الفعل `wird` في الموقع الثاني و`schneien` في الآخر.","hints":["`es` + `werden`."]},"de":{"prompt":"Setz ins Futur I: `Morgen schneit es.`","explain":"`Morgen wird es schneien.` `wird` auf Position 2, `schneien` am Ende.","hints":["`es` + `werden`."]}}},{"id":"futur1-8","type":"text","difficulty":3,"context":"Morgen werde ich gehe zum Arzt.","answer":"Morgen werde ich zum Arzt gehen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"بعد `werden` لا يأتي فعل مصرف ثانٍ. `gehen` يبقى مصدرًا في آخر الجملة.","hints":["كم فعلًا مصرفًا في الجملة؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Nach `werden` kommt kein zweites konjugiertes Verb. `gehen` steht als Infinitiv am Satzende.","hints":["Wie viele konjugierte Verben hat der Satz?"]}}},{"id":"futur1-9","type":"text","difficulty":2,"answer":"In zwanzig Jahren werden die Menschen mehr mit künstlicher Intelligenz arbeiten.","i18n":{"ar":{"prompt":"اكتب توقعًا عن المستقبل بعد عشرين سنة.","explain":"مثال: `In zwanzig Jahren werden die Menschen mehr mit künstlicher Intelligenz arbeiten.`","hints":["`werden` في الموقع الثاني والمصدر في الآخر."]},"de":{"prompt":"Schreib eine Prognose für die Zeit in zwanzig Jahren.","explain":"Zum Beispiel: `In zwanzig Jahren werden die Menschen mehr mit künstlicher Intelligenz arbeiten.`","hints":["`werden` auf Position 2, der Infinitiv am Ende."]}}}]},{"id":"kausal-da-weil","level":"B1.2","island":"grund-folge","order":1,"prereqs":[],"emoji":"🌧️","german":"Kausale Nebensätze mit da / weil","source":{"lektion":7,"kind":"toc"},"pattern":["Hauptsatz",",","weil / da","…","Verb am Ende"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","bleibe"],["mf","zu Hause"]]},{"k":"sub","parts":[["c","weil"],["mf","ich krank"],["ve","bin"]]},{"k":"main","parts":[["vf","Da ich krank bin,"],["v","bleibe"],["mf","ich zu Hause"]]}],"example":"Ich bleibe zu Hause, weil ich krank bin.","stepExamples":["Ich bleibe zu Hause. Ich bin krank.","Ich bleibe zu Hause, weil ich krank bin.","Da ich krank bin, bleibe ich zu Hause.","Warum bleibst du zu Hause? – Weil ich krank bin."],"pitfallPair":"Ich bleibe zu Hause, weil ich bin krank. → Ich bleibe zu Hause, weil ich krank bin.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/2102","https://grammis.ids-mannheim.de/konnektoren/406991"],"i18n":{"ar":{"title":"ذكر السبب بـ weil و da","lead":"لماذا بقيت في البيت؟ لأنك مريض. حين تربط النتيجة بسببها في جملة واحدة تحتاج إلى `weil` أو `da`، وكلتاهما ترسل الفعل إلى آخر الجملة.","translation":"أبقى في البيت لأنني مريض.","steps":[{"text":"ابدأ بجملتين مستقلتين","why":"الجملة الأولى نتيجة، والثانية سبب. نريد أن نجمعهما بأداة تدل على السبب."},{"text":"اربط بـ weil وانقل الفعل المصرف إلى الآخر","why":"`weil` تبدأ جملة تابعة، والفعل المصرف `bin` يقف في آخرها. وتفصل بين الجملتين فاصلة دائمًا."},{"text":"مع da يأتي السبب غالبًا في البداية","why":"`da` تعني أيضًا «لأنّ»، وتُستعمل خاصة حين يكون السبب معروفًا للسامع، وكثيرًا ما تقف في أول الجملة. حين تأتي الجملة التابعة أولًا يبدأ ما بعدها بالفعل: `bleibe ich`."},{"text":"على السؤال بـ warum أجب بـ weil","why":"جواب `Warum?` يكون بـ `weil` فقط، ويجوز أن يأتي وحده دون جملة رئيسية. لا يصح هنا `da`."}],"explain":["`weil` و`da` أداتا ربط تابعتان، لذلك يقف الفعل المصرف في آخر الجملة. `weil` محايدة وتصلح في كل المواقف، أما `da` فهي أكثر رسمية وتقدّم سببًا يعرفه السامع أو يتوقعه.","قارن مع `denn`: هي أيضًا تذكر السبب، لكنها تربط جملتين رئيسيتين فيبقى الفعل في الموقع الثاني: `Ich bleibe zu Hause, denn ich bin krank.`"],"pitfall":"بعد `weil` يذهب الفعل المصرف إلى آخر الجملة. الترتيب `weil ich bin` يسمع كثيرًا في الكلام السريع، لكنه خطأ في الكتابة.","recall":["لماذا نقول `bleibe ich` في `Da ich krank bin, bleibe ich zu Hause`؟","لأن الجملة التابعة كلها تشغل الموقع الأول، فيأتي الفعل المصرف بعدها مباشرة ثم الفاعل."],"linkTitles":["جمل السبب · grammis","معجم أدوات الربط: weil · grammis"],"table":[["الأداة","نوع الجملة","موقع الفعل","مثال"],["weil","تابعة","في الآخر","…, weil ich krank bin."],["da","تابعة","في الآخر","Da ich krank bin, …"],["denn","رئيسية","الموقع الثاني","…, denn ich bin krank."]]},"de":{"title":"Kausale Nebensätze mit weil und da","lead":"Warum bist du zu Hause geblieben? Weil du krank bist. Wenn du Folge und Grund in einem Satz verbindest, brauchst du `weil` oder `da` – und beide schicken das Verb ans Satzende.","steps":[{"text":"Beginne mit zwei Hauptsätzen","why":"Der erste Satz ist die Folge, der zweite der Grund. Wir verbinden sie mit einem kausalen Wort."},{"text":"Verbinde mit weil und stell das konjugierte Verb ans Ende","why":"`weil` leitet einen Nebensatz ein. Das konjugierte Verb `bin` steht am Ende. Zwischen den Sätzen steht immer ein Komma."},{"text":"Mit da steht der Grund meist vorn","why":"`da` bedeutet auch „weil“ und nennt oft einen Grund, den der Hörer schon kennt. Der da-Satz steht häufig am Anfang. Dann beginnt der Hauptsatz mit dem Verb: `bleibe ich`."},{"text":"Auf warum antwortest du mit weil","why":"Die Antwort auf `Warum?` beginnt mit `weil` und kann allein stehen. `da` ist hier nicht möglich."}],"explain":["`weil` und `da` sind Subjunktoren: Das konjugierte Verb steht am Ende. `weil` ist neutral und passt überall. `da` klingt etwas formeller und nennt einen bekannten oder erwartbaren Grund.","Vergleiche mit `denn`: Es nennt auch einen Grund, verbindet aber zwei Hauptsätze. Das Verb bleibt an Position 2: `Ich bleibe zu Hause, denn ich bin krank.`"],"pitfall":"Nach `weil` steht das konjugierte Verb am Ende. `weil ich bin` hört man in schneller Rede, geschrieben ist es falsch.","recall":["Warum heißt es `bleibe ich` in `Da ich krank bin, bleibe ich zu Hause`?","Der ganze Nebensatz besetzt Position 1. Danach kommt sofort das konjugierte Verb, dann das Subjekt."],"linkTitles":["Kausalsätze · grammis","Konnektoren-Wörterbuch: weil · grammis"],"table":[["Wort","Satzart","Verbstellung","Beispiel"],["weil","Nebensatz","am Ende","…, weil ich krank bin."],["da","Nebensatz","am Ende","Da ich krank bin, …"],["denn","Hauptsatz","Position 2","…, denn ich bin krank."]]}},"questions":[{"id":"kausal-da-weil-1","type":"cloze","difficulty":1,"text":"Ich komme heute später, weil mein Bus Verspätung {{1}}.","blanks":[["hat"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `haben` المصرف في المكان الصحيح.","explain":"بعد `weil` يقف الفعل المصرف في الآخر: `Verspätung hat`.","hints":["الفاعل هو `mein Bus`."]},"de":{"prompt":"Ergänze die konjugierte Form von `haben`.","explain":"Nach `weil` steht das konjugierte Verb am Ende: `Verspätung hat`.","hints":["Das Subjekt ist `mein Bus`."]}}},{"id":"kausal-da-weil-2","type":"cloze","difficulty":1,"text":"{{1}} das Wetter schlecht ist, {{2}} wir den Ausflug.","blanks":[["Da","Weil"],["verschieben"]],"i18n":{"ar":{"prompt":"أكمل بأداة السبب ثم بالفعل `verschieben`.","explain":"الجملة التابعة في البداية، لذلك يأتي الفعل `verschieben` بعدها مباشرة ثم `wir`.","hints":["ماذا يأتي بعد الفاصلة حين تبدأ الجملة بجملة تابعة؟"]},"de":{"prompt":"Ergänze das kausale Wort und das Verb `verschieben`.","explain":"Der Nebensatz steht vorn, deshalb folgt sofort das Verb `verschieben` und dann `wir`.","hints":["Was steht nach dem Komma, wenn der Nebensatz vorn steht?"]}}},{"id":"kausal-da-weil-3","type":"mcq","difficulty":1,"options":["Er lernt viel, weil er die Prüfung bestehen will.","Er lernt viel, weil er will die Prüfung bestehen.","Er lernt viel, weil will er die Prüfung bestehen."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"الفعل المصرف `will` يقف في آخر الجملة التابعة بعد المصدر `bestehen`.","hints":["ابحث عن الفعل المصرف."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Das konjugierte Verb `will` steht am Ende des Nebensatzes, nach dem Infinitiv `bestehen`.","hints":["Such das konjugierte Verb."]}}},{"id":"kausal-da-weil-4","type":"cloze","difficulty":2,"text":"Sie ist müde, weil sie gestern lange {{1}} {{2}}.","blanks":[["gearbeitet"],["hat"]],"i18n":{"ar":{"prompt":"أكمل بالماضي المركب من `arbeiten`.","explain":"في الجملة التابعة يأتي `Partizip II` أولًا ثم الفعل المساعد المصرف: `gearbeitet hat`.","hints":["المساعد المصرف هو الكلمة الأخيرة."]},"de":{"prompt":"Ergänze das Perfekt von `arbeiten`.","explain":"Im Nebensatz steht zuerst das Partizip II, dann das konjugierte Hilfsverb: `gearbeitet hat`.","hints":["Das konjugierte Hilfsverb ist das letzte Wort."]}}},{"id":"kausal-da-weil-5","type":"order","difficulty":2,"items":["Da","der Zug","ausgefallen","ist,","nehmen","wir","ein Taxi."],"i18n":{"ar":{"prompt":"رتّب الجملة. ابدأ بـ `Da`.","explain":"الجملة التابعة أولًا والفعل في آخرها، ثم الفعل `nehmen` ثم الفاعل `wir`.","hints":["بعد الفاصلة يأتي الفعل قبل الفاعل."]},"de":{"prompt":"Ordne den Satz. Beginne mit `Da`.","explain":"Zuerst der Nebensatz mit dem Verb am Ende, dann `nehmen`, dann das Subjekt `wir`.","hints":["Nach dem Komma steht das Verb vor dem Subjekt."]}}},{"id":"kausal-da-weil-6","type":"mcq","difficulty":2,"options":["Weil ich keine Zeit hatte.","Da ich keine Zeit hatte.","Denn ich hatte keine Zeit hatte."],"answer":0,"i18n":{"ar":{"prompt":"ما الجواب الصحيح عن السؤال `Warum bist du nicht gekommen?`","explain":"جواب `Warum?` القصير يبدأ بـ `weil`. لا تصح `da` هنا، والخيار الثالث فيه فعلان.","hints":["أي أداة تجيب عن `warum`؟"]},"de":{"prompt":"Welche Antwort passt auf `Warum bist du nicht gekommen?`","explain":"Die kurze Antwort auf `Warum?` beginnt mit `weil`. `da` passt hier nicht, und die dritte Antwort hat zwei Verben.","hints":["Welches Wort antwortet auf `warum`?"]}}},{"id":"kausal-da-weil-7","type":"text","difficulty":3,"answer":"Da die Straße gesperrt ist, müssen wir einen Umweg fahren.","i18n":{"ar":{"prompt":"اربط الجملتين بـ `da` وابدأ بالسبب: `Die Straße ist gesperrt. Wir müssen einen Umweg fahren.`","explain":"الجملة التابعة في البداية والفعل `ist` في آخرها، ثم `müssen wir`.","hints":["لا تنس الفاصلة وموقع `müssen`."]},"de":{"prompt":"Verbinde mit `da` und beginne mit dem Grund: `Die Straße ist gesperrt. Wir müssen einen Umweg fahren.`","explain":"Der Nebensatz steht vorn, `ist` am Ende, danach `müssen wir`.","hints":["Denk an das Komma und die Position von `müssen`."]}}},{"id":"kausal-da-weil-8","type":"text","difficulty":3,"context":"Ich bleibe zu Hause, weil ich bin krank.","answer":"Ich bleibe zu Hause, weil ich krank bin.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`weil` تبدأ جملة تابعة، فيقف الفعل المصرف `bin` في آخرها.","hints":["أين يقف الفعل بعد `weil`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`weil` leitet einen Nebensatz ein. Das konjugierte Verb `bin` steht am Ende.","hints":["Wo steht das Verb nach `weil`?"]}}},{"id":"kausal-da-weil-9","type":"text","difficulty":2,"answer":"Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","i18n":{"ar":{"prompt":"اكتب لماذا تتعلم الألمانية. استعمل `weil` والفعل `möchte`.","explain":"مثال: `…, weil ich in Deutschland arbeiten möchte.` يأتي `möchte` في الآخر بعد المصدر.","hints":["المصدر أولًا ثم الفعل الناقص المصرف."]},"de":{"prompt":"Schreib, warum du Deutsch lernst. Benutze `weil` und `möchte`.","explain":"Zum Beispiel: `…, weil ich in Deutschland arbeiten möchte.` `möchte` steht am Ende, nach dem Infinitiv.","hints":["Zuerst der Infinitiv, dann das konjugierte Modalverb."]}}}]},{"id":"deshalb-daher","level":"B1.2","island":"grund-folge","order":2,"prereqs":["kausal-da-weil"],"emoji":"➡️","german":"Konsekutive Verbindungsadverbien deshalb / daher / darum / deswegen","source":{"lektion":7,"kind":"toc"},"pattern":["Grund",".","deshalb","+","Verb","+","Subjekt"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","bin"],["mf","krank"]]},{"k":"main","parts":[["vf","Deshalb"],["v","bleibe"],["mf","ich zu Hause"]]},{"k":"main","parts":[["vf","Ich"],["v","bleibe"],["mf","deshalb zu Hause"]]}],"example":"Ich bin krank. Deshalb bleibe ich zu Hause.","stepExamples":["Ich bleibe zu Hause, weil ich krank bin.","Ich bin krank. Deshalb bleibe ich zu Hause.","Ich bin krank. Ich bleibe deshalb zu Hause.","Ich bin krank, daher bleibe ich zu Hause."],"pitfallPair":"Ich bin krank, deshalb ich bleibe zu Hause. → Ich bin krank, deshalb bleibe ich zu Hause.","links":["https://grammis.ids-mannheim.de/progr%40mm/6770","https://www.dwds.de/wb/deshalb"],"i18n":{"ar":{"title":"ذكر النتيجة بـ deshalb وأخواتها","lead":"مع `weil` تبدأ بالسبب في جملة تابعة. أما مع `deshalb` فتذكر السبب أولًا في جملة كاملة، ثم تقول «لذلك» وتذكر النتيجة. هنا يبقى الفعل في الموقع الثاني.","translation":"أنا مريض. لذلك أبقى في البيت.","steps":[{"text":"انطلق من جملة مع weil","why":"في هذه الجملة تأتي النتيجة أولًا، ثم السبب في جملة تابعة. الآن نعكس الترتيب: السبب أولًا ثم النتيجة."},{"text":"اذكر السبب، ثم ابدأ الجملة التالية بـ deshalb","why":"`deshalb` ظرف يشغل الموقع الأول وحده، فيأتي الفعل المصرف `bleibe` بعده مباشرة ثم الفاعل `ich`."},{"text":"يمكن أن يقف deshalb في وسط الجملة","why":"إذا بدأت بالفاعل وضعت `deshalb` بعد الفعل: `Ich bleibe deshalb zu Hause.` المعنى لا يتغير."},{"text":"daher و darum و deswegen لها المعنى نفسه","why":"الكلمات الأربع تعني «لذلك». `daher` أكثر رسمية، و`darum` و`deswegen` شائعتان في الكلام. ويجوز أن تربطها بالجملة الأولى بفاصلة."}],"explain":["`deshalb` وأخواتها ليست أدوات ربط تابعة، بل ظروف تشير إلى السبب المذكور قبلها. لذلك تبقى الجملة رئيسية ويقف الفعل المصرف في الموقع الثاني.","تذكّر الفرق: `weil` تحمل السبب وترسل الفعل إلى الآخر، و`deshalb` تحمل النتيجة ويبقى الفعل بعدها مباشرة."],"pitfall":"`deshalb` تشغل الموقع الأول، فلا مكان للفاعل قبل الفعل. الترتيب الصحيح: `deshalb bleibe ich`.","recall":["أين يقف الفعل في `Es regnet, darum nehme ich den Schirm`؟","بعد `darum` مباشرة، لأن `darum` تشغل الموقع الأول وحدها، ثم يأتي الفاعل `ich`."],"linkTitles":["التعبير عن النتيجة · grammis","deshalb في معجم DWDS"],"table":[["الكلمة","ماذا تحمل؟","نوع الجملة","موقع الفعل"],["weil / da","السبب","تابعة","في الآخر"],["denn","السبب","رئيسية (الموقع 0)","الموقع الثاني"],["deshalb / daher / darum / deswegen","النتيجة","رئيسية","الموقع الثاني"]]},"de":{"title":"Konsekutive Verbindungsadverbien deshalb, daher, darum, deswegen","lead":"Mit `weil` steht der Grund im Nebensatz. Mit `deshalb` nennst du zuerst den Grund in einem ganzen Satz und dann die Folge. Das Verb bleibt dabei auf Position 2.","steps":[{"text":"Geh von einem weil-Satz aus","why":"Hier steht zuerst die Folge, dann der Grund im Nebensatz. Jetzt drehen wir die Reihenfolge um: erst der Grund, dann die Folge."},{"text":"Nenne den Grund und beginne den nächsten Satz mit deshalb","why":"`deshalb` ist ein Adverb und besetzt allein Position 1. Danach kommt sofort das konjugierte Verb `bleibe`, dann das Subjekt `ich`."},{"text":"deshalb kann auch im Mittelfeld stehen","why":"Wenn du mit dem Subjekt beginnst, steht `deshalb` nach dem Verb: `Ich bleibe deshalb zu Hause.` Die Bedeutung bleibt gleich."},{"text":"daher, darum und deswegen bedeuten dasselbe","why":"Alle vier heißen „aus diesem Grund“. `daher` klingt formeller, `darum` und `deswegen` sind im Gespräch häufig. Du kannst den Satz auch mit Komma anschließen."}],"explain":["`deshalb` und seine Partner sind keine Subjunktoren, sondern Adverbien, die auf den vorher genannten Grund zeigen. Der Satz bleibt ein Hauptsatz, das konjugierte Verb steht auf Position 2.","Merke den Unterschied: `weil` trägt den Grund und schickt das Verb ans Ende. `deshalb` trägt die Folge, das Verb folgt direkt danach."],"pitfall":"`deshalb` besetzt Position 1. Für das Subjekt ist davor kein Platz: `deshalb bleibe ich`.","recall": gierte Verb `habe`, dann das Subjekt.","hints":["`darum` ist kein Subjunktor."]}}},{"id":"deshalb-daher-4","type":"cloze","difficulty":2,"text":"Ich habe den Bus verpasst. Ich {{1}} {{2}} zu spät gekommen.","blanks":[["bin"],["deshalb","daher","darum","deswegen"]],"i18n":{"ar":{"prompt":"أكمل الجملة الثانية. الفاعل في البداية، وكلمة «لذلك» في الوسط.","explain":"`Ich bin deshalb zu spät gekommen.` الفعل المساعد في الموقع الثاني، و`deshalb` في وسط الجملة.","hints":["`kommen` يصرّف مع `sein` في الماضي المركب."]},"de":{"prompt":"Ergänze den zweiten Satz. Das Subjekt steht vorn, „aus diesem Grund“ im Mittelfeld.","explain":"`Ich bin deshalb zu spät gekommen.` Das Hilfsverb steht auf Position 2, `deshalb` im Mittelfeld.","hints":["`kommen` bildet das Perfekt mit `sein`."]}}},{"id":"deshalb-daher-5","type":"order","difficulty":2,"items":["Die Miete","ist","gestiegen.","Deswegen","suchen","wir","eine neue Wohnung."],"i18n":{"ar":{"prompt":"رتّب الجملتين: السبب ثم النتيجة.","explain":"بعد `Deswegen` يأتي الفعل `suchen` ثم الفاعل `wir`.","hints":["ابدأ بالسبب: `Die Miete`."]},"de":{"prompt":"Ordne die zwei Sätze: zuerst der Grund, dann die Folge.","explain":"Nach `Deswegen` folgt das Verb `suchen`, dann das Subjekt `wir`.","hints":["Beginne mit dem Grund: `Die Miete`."]}}},{"id":"deshalb-daher-6","type":"mcq","difficulty":2,"options":["Ich hatte Hunger. Deshalb habe ich gekocht.","Ich habe gekocht. Deshalb hatte ich Hunger.","Deshalb ich hatte Hunger und habe gekocht."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تساوي في المعنى `Ich habe gekocht, weil ich Hunger hatte`؟","explain":"السبب هو الجوع، والنتيجة هي الطبخ. لذلك تأتي `deshalb` قبل النتيجة.","hints":["ما السبب وما النتيجة؟"]},"de":{"prompt":"Welcher Satz bedeutet dasselbe wie `Ich habe gekocht, weil ich Hunger hatte`?","explain":"Der Hunger ist der Grund, das Kochen die Folge. `Deshalb` steht vor der Folge.","hints":["Was ist Grund, was ist Folge?"]}}},{"id":"deshalb-daher-7","type":"text","difficulty":3,"answer":"Ich spreche gut Deutsch. Deshalb habe ich die Stelle bekommen.","i18n":{"ar":{"prompt":"حوّل الجملة إلى جملتين مع `deshalb`: `Ich habe die Stelle bekommen, weil ich gut Deutsch spreche.`","explain":"السبب أولًا كجملة رئيسية، ثم `Deshalb habe ich …`.","hints":["اقلب الترتيب: السبب ثم النتيجة."]},"de":{"prompt":"Mach daraus zwei Sätze mit `deshalb`: `Ich habe die Stelle bekommen, weil ich gut Deutsch spreche.`","explain":"Zuerst der Grund als Hauptsatz, dann `Deshalb habe ich …`.","hints":["Dreh die Reihenfolge um: erst Grund, dann Folge."]}}},{"id":"deshalb-daher-8","type":"text","difficulty":3,"context":"Ich bin krank, deshalb ich bleibe zu Hause.","answer":"Ich bin krank, deshalb bleibe ich zu Hause.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`deshalb` تشغل الموقع الأول، فيأتي الفعل `bleibe` بعدها ثم الفاعل `ich`.","hints":["كم كلمة تقف قبل الفعل؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`deshalb` besetzt Position 1. Danach kommen `bleibe` und dann `ich`.","hints":["Was steht vor dem Verb?"]}}},{"id":"deshalb-daher-9","type":"text","difficulty":2,"answer":"Morgen habe ich eine Prüfung. Darum lerne ich heute Abend.","i18n":{"ar":{"prompt":"اكتب سببًا ونتيجته. استعمل `darum` في بداية الجملة الثانية.","explain":"مثال: `Morgen habe ich eine Prüfung. Darum lerne ich heute Abend.`","hints":["بعد `Darum` الفعل ثم الفاعل."]},"de":{"prompt":"Schreib einen Grund und seine Folge. Beginne den zweiten Satz mit `Darum`.","explain":"Zum Beispiel: `Morgen habe ich eine Prüfung. Darum lerne ich heute Abend.`","hints":["Nach `Darum`: Verb, dann Subjekt."]}}}]},{"id":"sodass","level":"B1.2","island":"grund-folge","order":3,"prereqs":[],"emoji":"🌊","german":"Konsekutive Nebensätze mit sodass / so … dass","source":{"lektion":9,"kind":"toc"},"pattern":["Hauptsatz",",","sodass","…","Verb am Ende"],"frames":[{"k":"main","parts":[["vf","Es"],["v","hat"],["mf","stark"],["ve","geregnet"]]},{"k":"sub","parts":[["c","sodass"],["mf","wir zu Hause"],["ve","geblieben sind"]]},{"k":"main","parts":[["vf","Es"],["v","war"],["hl","so kalt,"],["c","dass"],["mf","der See"],["ve","gefroren ist"]]}],"example":"Es hat stark geregnet, sodass wir zu Hause geblieben sind.","stepExamples":["Es hat stark geregnet. Wir sind zu Hause geblieben.","Es hat stark geregnet, sodass wir zu Hause geblieben sind.","Es hat so stark geregnet, dass wir zu Hause geblieben sind.","Er sprach so leise, dass niemand ihn verstand."],"pitfallPair":"Es war so kalt, sodass wir gefroren haben. → Es war so kalt, dass wir gefroren haben.","links":["https://grammis.ids-mannheim.de/konnektoren/406996","https://grammis.ids-mannheim.de/systematische-grammatik/2103"],"i18n":{"ar":{"title":"النتيجة بـ sodass و so … dass","lead":"مع `deshalb` تذكر النتيجة في جملة رئيسية. ومع `sodass` تذكرها في جملة تابعة تأتي بعد السبب مباشرة، فيذهب الفعل إلى آخرها. وإذا أردت التركيز على شدة الأمر استعملت `so … dass`.","translation":"أمطرت بغزارة، فبقينا في البيت.","steps":[{"text":"ابدأ بسبب ونتيجة","why":"المطر الغزير هو السبب، والبقاء في البيت هو النتيجة. الترتيب ثابت: السبب أولًا ثم النتيجة."},{"text":"اربط النتيجة بـ sodass","why":"`sodass` أداة ربط تابعة، فيقف الفعل المصرف `sind` في الآخر. وجملة `sodass` تأتي دائمًا بعد الجملة الرئيسية."},{"text":"للتركيز على الشدة ضع so قبل الصفة","why":"`so stark` في الجملة الرئيسية تقول «بغزارة شديدة إلى حد أن…». ثم تبدأ النتيجة بـ `dass` وحدها."},{"text":"استعمل so … dass مع الصفات والظروف","why":"`so leise` و`so müde` و`so viel`: كلمة `so` تقف قبل الصفة أو الظرف، والفعل في جملة `dass` في الآخر."}],"explain":["`sodass` تُكتب أيضًا `so dass` بكلمتين، والصيغتان صحيحتان. أما في `so … dass` فتنفصل `so` عن `dass` وتقف قبل الصفة.","لا تبدأ الجملة بـ `sodass`: النتيجة لا تأتي قبل سببها. وإذا أردت أن تبدأ بالنتيجة فاستعمل `weil` للسبب."],"pitfall":"إذا كانت `so` قبل الصفة فلا تكررها: تأتي بعدها `dass` وحدها.","recall":["ما الفرق بين `Er war krank, sodass er nicht kam` و`Er war so krank, dass er nicht kam`؟","المعنى متقارب، لكن الثانية تركز على شدة المرض: كان مريضًا إلى درجة أنه لم يأتِ."],"linkTitles":["معجم أدوات الربط: sodass · grammis","جمل النتيجة · grammis"]},"de":{"title":"Konsekutive Nebensätze mit sodass und so … dass","lead":"Mit `deshalb` steht die Folge in einem Hauptsatz. Mit `sodass` steht sie in einem Nebensatz direkt nach dem Grund, und das Verb geht ans Ende. Willst du betonen, wie stark etwas war, nimmst du `so … dass`.","steps":[{"text":"Beginne mit Grund und Folge","why":"Der starke Regen ist der Grund, das Zuhausebleiben die Folge. Die Reihenfolge ist fest: erst Grund, dann Folge."},{"text":"Schließ die Folge mit sodass an","why":"`sodass` ist ein Subjunktor: Das konjugierte Verb `sind` steht am Ende. Der sodass-Satz steht immer nach dem Hauptsatz."},{"text":"Für die Intensität steht so vor dem Adjektiv","why":"`so stark` im Hauptsatz heißt „so stark, dass es eine Folge hat“. Die Folge beginnt dann nur mit `dass`."},{"text":"so … dass funktioniert mit Adjektiven und Adverbien","why":"`so leise`, `so müde`, `so viel`: `so` steht vor dem Adjektiv oder Adverb, im dass-Satz steht das Verb am Ende."}],"explain":["`sodass` kann man auch getrennt `so dass` schreiben, beides ist richtig. Bei `so … dass` sind die Teile getrennt, und `so` steht vor dem Adjektiv.","Ein sodass-Satz steht nie am Satzanfang, denn die Folge kommt nicht vor dem Grund. Willst du mit der Folge beginnen, nennst du den Grund mit `weil`."],"pitfall":"Steht `so` schon vor dem Adjektiv, wiederholst du es nicht. Danach kommt nur `dass`.","recall":["Was ist der Unterschied zwischen `Er war krank, sodass er nicht kam` und `Er war so krank, dass er nicht kam`?","Die Bedeutung ist ähnlich, der zweite Satz betont aber, wie krank er war."],"linkTitles":["Konnektoren-Wörterbuch: sodass · grammis","Konsekutivsätze · grammis"]}},"questions":[{"id":"sodass-1","type":"cloze","difficulty":1,"text":"Der Akku war leer, sodass ich nicht telefonieren {{1}}.","blanks":[["konnte"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `können` في الماضي.","explain":"بعد `sodass` يقف الفعل المصرف في الآخر: `telefonieren konnte`.","hints":["المصدر أولًا ثم الفعل الناقص."]},"de":{"prompt":"Ergänze `können` im Präteritum.","explain":"Nach `sodass` steht das konjugierte Verb am Ende: `telefonieren konnte`.","hints":["Erst der Infinitiv, dann das Modalverb."]}}},{"id":"sodass-2","type":"cloze","difficulty":1,"text":"Die Musik war {{1}} laut, {{2}} ich nicht schlafen konnte.","blanks":[["so"],["dass"]],"i18n":{"ar":{"prompt":"أكمل بالجزأين `so … dass`.","explain":"`so` قبل الصفة `laut`، ثم `dass` في بداية جملة النتيجة.","hints":["الكلمة الأولى تقف قبل الصفة."]},"de":{"prompt":"Ergänze die zwei Teile `so … dass`.","explain":"`so` steht vor dem Adjektiv `laut`, `dass` am Anfang des Folgesatzes.","hints":["Das erste Wort steht vor dem Adjektiv."]}}},{"id":"sodass-3","type":"mcq","difficulty":1,"options":["Der Zug hatte Verspätung, sodass ich den Anschluss verpasst habe.","Der Zug hatte Verspätung, sodass ich habe den Anschluss verpasst.","Sodass ich den Anschluss verpasst habe, hatte der Zug Verspätung."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"جملة `sodass` تأتي بعد السبب، والفعل المساعد `habe` في آخرها.","hints":["النتيجة بعد السبب دائمًا."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Der sodass-Satz steht nach dem Grund, `habe` am Ende.","hints":["Die Folge steht immer nach dem Grund."]}}},{"id":"sodass-4","type":"cloze","difficulty":2,"text":"Ich hatte {{1}} viel Arbeit, dass ich das Mittagessen {{2}} habe.","blanks":[["so"],["vergessen"]],"i18n":{"ar":{"prompt":"أكمل بكلمة الشدة وبالتصريف الثالث للفعل `vergessen`.","explain":"`so viel` تركز على الكمية، و`vergessen habe` في آخر جملة `dass`.","hints":["`Partizip II` من `vergessen` لا يأخذ `ge-`."]},"de":{"prompt":"Ergänze das Intensitätswort und das Partizip II von `vergessen`.","explain":"`so viel` betont die Menge, `vergessen habe` steht am Ende des dass-Satzes.","hints":["Das Partizip II von `vergessen` hat kein `ge-`."]}}},{"id":"sodass-5","type":"order","difficulty":2,"items":["Ich","habe","verschlafen,","sodass","ich","zu spät","gekommen bin."],"i18n":{"ar":{"prompt":"رتّب الجملة: السبب ثم النتيجة.","explain":"الجملة الرئيسية أولًا، ثم `sodass` والفاعل، والفعل `gekommen bin` في الآخر.","hints":["ابدأ بـ `Ich habe`."]},"de":{"prompt":"Ordne den Satz: erst der Grund, dann die Folge.","explain":"Erst der Hauptsatz, dann `sodass`, das Subjekt und `gekommen bin` am Ende.","hints":["Beginne mit `Ich habe`."]}}},{"id":"sodass-6","type":"mcq","difficulty":2,"options":["Der Koffer ist so schwer, dass ich ihn nicht tragen kann.","Der Koffer ist schwer, dass ich ihn nicht tragen kann.","Der Koffer ist so schwer, sodass ich ihn nicht tragen kann."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟","explain":"مع `so` قبل الصفة تأتي `dass` وحدها. بدون `so` لا يكفي `dass` هنا، ومع `so` لا نقول `sodass`.","hints":["`so` لا تتكرر."]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Mit `so` vor dem Adjektiv folgt nur `dass`. Ohne `so` reicht `dass` hier nicht, und mit `so` heißt es nicht `sodass`.","hints":["`so` steht nur einmal."]}}},{"id":"sodass-7","type":"text","difficulty":3,"answer":"Der Film war so langweilig, dass ich eingeschlafen bin.","i18n":{"ar":{"prompt":"اربط بـ `so … dass`: `Der Film war langweilig. Ich bin eingeschlafen.`","explain":"`so` قبل `langweilig`، و`dass ich eingeschlafen bin` بالفعل المساعد في الآخر.","hints":["`eingeschlafen bin` في الآخر."]},"de":{"prompt":"Verbinde mit `so … dass`: `Der Film war langweilig. Ich bin eingeschlafen.`","explain":"`so` vor `langweilig`, dann `dass ich eingeschlafen bin` mit dem Hilfsverb am Ende.","hints":["`eingeschlafen bin` steht am Ende."]}}},{"id":"sodass-8","type":"text","difficulty":3,"context":"Es war so kalt, sodass wir gefroren haben.","answer":"Es war so kalt, dass wir gefroren haben.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`so` موجودة قبل `kalt`، فتبدأ النتيجة بـ `dass` وحدها.","hints":["كم مرة تظهر `so`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`so` steht schon vor `kalt`. Die Folge beginnt nur mit `dass`.","hints":["Wie oft steht `so` im Satz?"]}}},{"id":"sodass-9","type":"text","difficulty":2,"answer":"Ich war so müde, dass ich früh ins Bett gegangen bin.","i18n":{"ar":{"prompt":"اكتب جملة عن التعب ونتيجته مع `so … dass`.","explain":"مثال: `Ich war so müde, dass ich früh ins Bett gegangen bin.`","hints":["`so` قبل الصفة."]},"de":{"prompt":"Schreib einen Satz über Müdigkeit und ihre Folge mit `so … dass`.","explain":"Zum Beispiel: `Ich war so müde, dass ich früh ins Bett gegangen bin.`","hints":["`so` steht vor dem Adjektiv."]}}}]},{"id":"indem","level":"B1.2","island":"grund-folge","order":4,"prereqs":[],"emoji":"🛠️","german":"Modale Nebensätze mit indem","source":{"lektion":9,"kind":"toc"},"pattern":["Ziel",",","indem","…","Verb am Ende"],"frames":[{"k":"main","parts":[["vf","Man"],["v","spart"],["mf","Strom"]]},{"k":"sub","parts":[["c","indem"],["mf","man das Licht"],["ve","ausschaltet"]]},{"k":"main","parts":[["vf","Durch das Ausschalten des Lichts"],["v","spart"],["mf","man Strom"]]}],"example":"Man spart Strom, indem man das Licht ausschaltet.","stepExamples":["Wie spart man Strom?","Man spart Strom, indem man das Licht ausschaltet.","Indem man das Licht ausschaltet, spart man Strom.","Man spart Strom durch das Ausschalten des Lichts."],"pitfallPair":"Das ist das Haus, indem ich wohne. → Das ist das Haus, in dem ich wohne.","links":["https://grammis.ids-mannheim.de/konnektoren/407023","https://grammis.ids-mannheim.de/progr%40mm/6823"],"i18n":{"ar":{"title":"الوسيلة والطريقة بـ indem","lead":"كيف توفّر الكهرباء؟ بأن تطفئ الضوء. حين تذكر الوسيلة التي تصل بها إلى هدف تستعمل `indem`، وهي تجيب عن السؤالين `Wie?` و`Wodurch?`.","translation":"يوفّر المرء الكهرباء بأن يطفئ الضوء.","steps":[{"text":"ابدأ بسؤال عن الطريقة","why":"السؤال `Wie spart man Strom?` يبحث عن وسيلة، لا عن سبب ولا عن وقت."},{"text":"اذكر الهدف، ثم الوسيلة بعد indem","why":"`indem` أداة ربط تابعة، فيقف الفعل المصرف `ausschaltet` في آخرها، ويلتصق الجزء المنفصل `aus` بالفعل من جديد."},{"text":"يمكن أن تبدأ بالوسيلة","why":"حين تأتي جملة `indem` أولًا يبدأ ما بعد الفاصلة بالفعل المصرف: `spart man`."},{"text":"البديل الاسمي: durch + اسم","why":"في الكتابة الرسمية تُقال الوسيلة أحيانًا باسم: `durch das Ausschalten des Lichts`. المعنى نفسه، لكن الأسلوب أثقل."}],"explain":["في الغالب يكون الفاعل واحدًا في الجملتين: الشخص الذي يحقق الهدف هو نفسه من يقوم بالوسيلة.","لا تخلط بين `indem` كلمة واحدة و`in dem` كلمتين. الثانية حرف جر مع ضمير وصل: `das Haus, in dem ich wohne` أي «البيت الذي أسكن فيه»."],"pitfall":"`in dem` بكلمتين تعني «الذي … فيه». أما `indem` كلمة واحدة فتعني «بأن، عن طريق».","recall":["أجب بـ `indem`: `Wie kann man gesund bleiben?`","مثلًا `Man bleibt gesund, indem man sich viel bewegt.` الفعل المصرف `bewegt` في الآخر."],"linkTitles":["معجم أدوات الربط: indem · grammis","التعبير عن الوسيلة والهدف · grammis"]},"de":{"title":"Modale Nebensätze mit indem","lead":"Wie spart man Strom? Indem man das Licht ausschaltet. Wenn du das Mittel nennst, mit dem du ein Ziel erreichst, nimmst du `indem`. Es antwortet auf `Wie?` und `Wodurch?`.","steps":[{"text":"Beginne mit einer Frage nach dem Wie","why":"`Wie spart man Strom?` fragt nach einem Mittel, nicht nach einem Grund oder einer Zeit."},{"text":"Nenne das Ziel, dann das Mittel mit indem","why":"`indem` ist ein Subjunktor: Das konjugierte Verb `ausschaltet` steht am Ende, und das Präfix `aus` ist wieder mit dem Verb verbunden."},{"text":"Du kannst auch mit dem Mittel beginnen","why":"Steht der indem-Satz vorn, beginnt der Hauptsatz mit dem Verb: `spart man`."},{"text":"Die nominale Variante: durch + Nomen","why":"In formellen Texten steht das Mittel oft als Nomen: `durch das Ausschalten des Lichts`. Gleiche Bedeutung, schwererer Stil."}],"explain":["Meist ist das Subjekt in beiden Sätzen gleich: Wer das Ziel erreicht, tut auch das Mittel.","Verwechsle `indem` nicht mit `in dem`. Getrennt geschrieben ist es Präposition + Relativpronomen: `das Haus, in dem ich wohne`."],"pitfall":"`in dem` getrennt heißt „in dem Haus“. `indem` zusammen nennt das Mittel.","recall":["Antworte mit `indem`: `Wie kann man gesund bleiben?`","Zum Beispiel `Man bleibt gesund, indem man sich viel bewegt.` `bewegt` steht am Ende."],"linkTitles":["Konnektoren-Wörterbuch: indem · grammis","Das Mittel für einen Zweck ausdrücken · grammis"]}},"questions":[{"id":"indem-1","type":"cloze","difficulty":1,"text":"Ich lerne neue Wörter, indem ich Karteikarten {{1}}.","blanks":[["schreibe","benutze"]],"i18n":{"ar":{"prompt":"أكمل بفعل مناسب في المكان الصحيح.","explain":"بعد `indem` يأتي الفعل المصرف في الآخر، مثل `schreibe` أو `benutze`.","hints":["الفاعل `ich`."]},"de":{"prompt":"Ergänze ein passendes Verb.","explain":"Nach `indem` steht das konjugierte Verb am Ende, zum Beispiel `schreibe` oder `benutze`.","hints":["Das Subjekt ist `ich`."]}}},{"id":"indem-2","type":"cloze","difficulty":1,"text":"Sie hat ihr Deutsch verbessert, {{1}} sie jeden Tag Nachrichten gehört hat.","blanks":[["indem"]],"i18n":{"ar":{"prompt":"أكمل بالأداة التي تدل على الوسيلة.","explain":"سماع الأخبار هو الطريقة التي حسّنت بها لغتها: `indem`.","hints":["الجملة تجيب عن `Wie?`."]},"de":{"prompt":"Ergänze das Wort für das Mittel.","explain":"Nachrichten hören ist das Mittel, mit dem sie ihr Deutsch verbessert hat: `indem`.","hints":["Der Satz antwortet auf `Wie?`."]}}},{"id":"indem-3","type":"mcq","difficulty":1,"options":["Wie hast du das Problem gelöst?","Warum hast du das Problem gelöst?","Wann hast du das Problem gelöst?"],"answer":0,"i18n":{"ar":{"prompt":"أي سؤال يُجاب عنه بـ `Indem ich den Computer neu gestartet habe.`؟","explain":"`indem` تذكر الطريقة، فهي تجيب عن `Wie?`.","hints":["`indem` = بأن، عن طريق."]},"de":{"prompt":"Auf welche Frage antwortet `Indem ich den Computer neu gestartet habe.`?","explain":"`indem` nennt die Art und Weise und antwortet auf `Wie?`.","hints":["`indem` nennt ein Mittel."]}}},{"id":"indem-4","type":"cloze","difficulty":2,"text":"Wir sparen Wasser, indem wir kürzer {{1}}. {{2}} wir das Fahrrad nehmen, schützen wir die Umwelt.","blanks":[["duschen"],["Indem"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `duschen` ثم بالأداة في بداية الجملة الثانية.","explain":"`duschen` في آخر جملة `indem`. وفي الجملة الثانية تأتي الوسيلة أولًا: `Indem … nehmen, schützen wir …`.","hints":["لاحظ `schützen wir` بعد الفاصلة."]},"de":{"prompt":"Ergänze `duschen` und das Wort am Anfang des zweiten Satzes.","explain":"`duschen` steht am Ende des indem-Satzes. Im zweiten Satz steht das Mittel vorn: `Indem … nehmen, schützen wir …`.","hints":["Achte auf `schützen wir` nach dem Komma."]}}},{"id":"indem-5","type":"order","difficulty":2,"items":["Man","kann","Geld sparen,","indem","man","selbst","kocht."],"i18n":{"ar":{"prompt":"رتّب الجملة: الهدف ثم الوسيلة.","explain":"الجملة الرئيسية أولًا، ثم `indem man selbst kocht` والفعل في الآخر.","hints":["ابدأ بـ `Man kann`."]},"de":{"prompt":"Ordne den Satz: erst das Ziel, dann das Mittel.","explain":"Erst der Hauptsatz, dann `indem man selbst kocht` mit dem Verb am Ende.","hints":["Beginne mit `Man kann`."]}}},{"id":"indem-6","type":"mcq","difficulty":2,"options":["Das ist die Firma, in der ich arbeite.","Das ist die Firma, indem ich arbeite.","Das ist die Firma, indem ich arbeite in."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟ المعنى: «هذه الشركة التي أعمل فيها».","explain":"هنا نحتاج إلى حرف جر مع ضمير وصل: `in der` لأن `die Firma` مؤنثة. `indem` تعني الوسيلة.","hints":["هل الجملة تذكر وسيلة أم مكانًا؟"]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"Hier brauchst du Präposition + Relativpronomen: `in der`, weil `die Firma` feminin ist. `indem` nennt ein Mittel.","hints":["Geht es um ein Mittel oder einen Ort?"]}}},{"id":"indem-7","type":"text","difficulty":3,"answer":"Man kann Müll vermeiden, indem man Mehrwegflaschen kauft.","i18n":{"ar":{"prompt":"اربط بـ `indem`: `Man kann Müll vermeiden. Man kauft Mehrwegflaschen.`","explain":"الهدف أولًا، ثم `indem man Mehrwegflaschen kauft` مع `kauft` في الآخر.","hints":["الجملة الثانية هي الوسيلة."]},"de":{"prompt":"Verbinde mit `indem`: `Man kann Müll vermeiden. Man kauft Mehrwegflaschen.`","explain":"Erst das Ziel, dann `indem man Mehrwegflaschen kauft` mit `kauft` am Ende.","hints":["Der zweite Satz ist das Mittel."]}}},{"id":"indem-8","type":"text","difficulty":3,"context":"Das ist das Haus, indem ich wohne.","answer":"Das ist das Haus, in dem ich wohne.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"المقصود «البيت الذي أسكن فيه»، فنحتاج إلى `in dem` بكلمتين: حرف جر وضمير وصل.","hints":["هل الجملة تذكر وسيلة؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Gemeint ist das Haus als Ort. Dafür brauchst du `in dem`: Präposition + Relativpronomen.","hints":["Nennt der Satz ein Mittel?"]}}},{"id":"indem-9","type":"text","difficulty":2,"answer":"Ich entspanne mich, indem ich im Park spazieren gehe.","i18n":{"ar":{"prompt":"اكتب كيف ترتاح بعد يوم متعب. استعمل `indem`.","explain":"مثال: `Ich entspanne mich, indem ich im Park spazieren gehe.`","hints":["الفعل المصرف في آخر جملة `indem`."]},"de":{"prompt":"Schreib, wie du dich nach einem anstrengenden Tag entspannst. Benutze `indem`.","explain":"Zum Beispiel: `Ich entspanne mich, indem ich im Park spazieren gehe.`","hints":["Das konjugierte Verb steht am Ende des indem-Satzes."]}}}]},{"id":"obwohl","level":"B1.2","island":"gegensatz-vergleich","order":1,"prereqs":[],"emoji":"🌦️","german":"Nebensätze mit obwohl","source":{"lektion":7,"kind":"toc"},"pattern":["obwohl","…","Verb am Ende",",","Verb","+","Subjekt"],"frames":[{"k":"sub","parts":[["c","Obwohl"],["mf","es"],["ve","regnet"]]},{"k":"main","parts":[["vf","Obwohl es regnet,"],["v","gehe"],["mf","ich spazieren"]]},{"k":"sub","parts":[["c","obwohl"],["mf","sie müde"],["ve","war"]]}],"example":"Obwohl es regnet, gehe ich spazieren.","stepExamples":["Es regnet. Ich gehe spazieren.","Ich gehe spazieren, obwohl es regnet.","Obwohl es regnet, gehe ich spazieren.","Sie hat weitergearbeitet, obwohl sie müde war."],"pitfallPair":"Obwohl es regnet, ich gehe spazieren. → Obwohl es regnet, gehe ich spazieren.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/2109","https://www.dwds.de/wb/obwohl"],"i18n":{"ar":{"title":"مع أنّ: التناقض بـ obwohl","lead":"عادةً لا نخرج للنزهة حين يمطر. فإذا فعلنا ذلك رغم المطر فالنتيجة غير متوقعة. هذا التناقض تعبّر عنه `obwohl`، وهي ترسل الفعل إلى آخر جملتها.","translation":"مع أنها تمطر أخرج للنزهة.","steps":[{"text":"لاحظ التناقض بين الجملتين","why":"المطر يجعلنا نتوقع البقاء في البيت، لكن الشخص يخرج. حين لا تتفق النتيجة مع المتوقع نستعمل `obwohl`."},{"text":"ضع obwohl قبل الأمر الذي كان يجب أن يمنع الفعل","why":"`obwohl` تبدأ جملة تابعة، فيقف الفعل المصرف `regnet` في آخرها. وبين الجملتين فاصلة."},{"text":"يمكن أن تبدأ الجملة كلها بـ obwohl","why":"حين تأتي الجملة التابعة أولًا تشغل الموقع الأول، فيبدأ ما بعد الفاصلة بالفعل المصرف `gehe` ثم الفاعل."},{"text":"في الماضي يبقى الفعل المصرف في الآخر أيضًا","why":"مع الأزمنة المركبة يأتي `Partizip II` ثم الفعل المساعد: `obwohl sie lange gearbeitet hatte`. ومع `war` وحدها تقف `war` في الآخر."}],"explain":["تذكر `obwohl` السبب الذي كان من المفترض أن يمنع شيئًا، لكنه لم يمنعه. فالجملة الرئيسية تحمل ما حدث رغم ذلك.","`obwohl` أداة ربط تابعة مثل `weil`، لكن معناها عكسه: `weil` سبب ينتج عنه الفعل، و`obwohl` سبب لم يمنع الفعل."],"pitfall":"إذا بدأت بالجملة التابعة فهي تشغل الموقع الأول كله، فيأتي الفعل المصرف بعد الفاصلة مباشرة ثم الفاعل.","recall":["ما الفرق بين `Ich gehe raus, weil es regnet` و`Ich gehe raus, obwohl es regnet`؟","الأولى تجعل المطر سبب الخروج، والثانية تقول إن المطر لم يمنع الخروج."],"linkTitles":["جمل التنازل · grammis","obwohl في معجم DWDS"]},"de":{"title":"Nebensätze mit obwohl","lead":"Bei Regen geht man normalerweise nicht spazieren. Wer es trotzdem tut, macht etwas Unerwartetes. Diesen Gegensatz drückt `obwohl` aus – und schickt das Verb ans Ende seines Satzes.","steps":[{"text":"Erkenne den Widerspruch","why":"Bei Regen erwartet man, dass jemand zu Hause bleibt. Die Person geht aber raus. Wenn die Folge der Erwartung widerspricht, nimmst du `obwohl`."},{"text":"Setz obwohl vor das, was die Handlung eigentlich verhindern müsste","why":"`obwohl` leitet einen Nebensatz ein. Das konjugierte Verb `regnet` steht am Ende. Dazwischen steht ein Komma."},{"text":"Der obwohl-Satz kann vorn stehen","why":"Steht der Nebensatz am Anfang, besetzt er Position 1. Nach dem Komma kommt sofort das Verb `gehe`, dann das Subjekt."},{"text":"Auch in der Vergangenheit steht das konjugierte Verb am Ende","why":"Bei zusammengesetzten Zeiten kommt erst das Partizip II, dann das Hilfsverb: `obwohl sie lange gearbeitet hatte`. Mit `war` allein steht `war` am Ende."}],"explain":["`obwohl` nennt einen Umstand, der eigentlich etwas verhindern müsste, es aber nicht tut. Der Hauptsatz sagt, was trotzdem passiert.","`obwohl` ist ein Subjunktor wie `weil`, aber mit der umgekehrten Logik: `weil` nennt den Grund für die Handlung, `obwohl` einen Grund, der sie nicht verhindert."],"pitfall":"Steht der Nebensatz vorn, besetzt er die ganze Position 1. Nach dem Komma folgt sofort das konjugierte Verb, dann das Subjekt.","recall":["Was ist der Unterschied zwischen `Ich gehe raus, weil es regnet` und `Ich gehe raus, obwohl es regnet`?","Im ersten Satz ist der Regen der Grund fürs Rausgehen. Im zweiten verhindert der Regen das Rausgehen nicht."],"linkTitles":["Konzessivsätze · grammis","obwohl im DWDS"]}},"questions":[{"id":"obwohl-1","type":"cloze","difficulty":1,"text":"Er trinkt Kaffee, obwohl es schon spät {{1}}.","blanks":[["ist"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `sein` في المكان الصحيح.","explain":"بعد `obwohl` يقف الفعل المصرف في آخر الجملة: `spät ist`.","hints":["الفاعل هو `es`."]},"de":{"prompt":"Ergänze die Form von `sein`.","explain":"Nach `obwohl` steht das konjugierte Verb am Ende: `spät ist`.","hints":["Das Subjekt ist `es`."]}}},{"id":"obwohl-2","type":"cloze","difficulty":1,"text":"{{1}} die Wohnung klein ist, {{2}} wir sehr gern dort.","blanks":[["Obwohl"],["wohnen"]],"i18n":{"ar":{"prompt":"أكمل بأداة التنازل ثم بالفعل `wohnen`.","explain":"الشقة صغيرة، لكنهم يحبون السكن فيها: هذا تناقض. وبعد الجملة التابعة يأتي الفعل `wohnen` ثم `wir`.","hints":["هل يتفق الصِّغَر مع الرضا؟"]},"de":{"prompt":"Ergänze das konzessive Wort und das Verb `wohnen`.","explain":"Die Wohnung ist klein, trotzdem wohnen sie gern dort. Nach dem Nebensatz kommt `wohnen`, dann `wir`.","hints":["Passt „klein“ zu „gern“?"]}}},{"id":"obwohl-3","type":"mcq","difficulty":1,"options":["Sie ging zur Arbeit, obwohl sie Fieber hatte.","Sie ging zur Arbeit, weil sie Fieber hatte.","Sie ging zur Arbeit, obwohl sie hatte Fieber."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة ومنطقية؟","explain":"الحمى لا تكون سببًا للذهاب إلى العمل، بل أمرًا كان يجب أن يمنعه. والفعل `hatte` في الآخر.","hints":["انتبه إلى المعنى وإلى موقع الفعل."]},"de":{"prompt":"Welcher Satz ist richtig und logisch?","explain":"Fieber ist kein Grund, zur Arbeit zu gehen, sondern ein Gegengrund. `hatte` steht am Ende.","hints":["Achte auf Logik und Verbstellung."]}}},{"id":"obwohl-4","type":"cloze","difficulty":2,"text":"Ich bin nicht zur Party gegangen, obwohl Tom mich {{1}} {{2}}.","blanks":[["eingeladen"],["hatte","hat"]],"i18n":{"ar":{"prompt":"أكمل بالماضي من `einladen`.","explain":"في الجملة التابعة يأتي `eingeladen` ثم الفعل المساعد المصرف `hatte` أو `hat`.","hints":["المساعد هو الكلمة الأخيرة."]},"de":{"prompt":"Ergänze die Vergangenheit von `einladen`.","explain":"Im Nebensatz kommt `eingeladen`, dann das Hilfsverb `hatte` oder `hat`.","hints":["Das Hilfsverb steht ganz am Ende."]}}},{"id":"obwohl-5","type":"order","difficulty":2,"items":["Obwohl","das Essen","teuer","war,","hat","es","uns nicht geschmeckt."],"i18n":{"ar":{"prompt":"رتّب الجملة. ابدأ بـ `Obwohl`.","explain":"الجملة التابعة أولًا مع `war` في آخرها، ثم الفعل المساعد `hat` ثم الفاعل `es`.","hints":["بعد الفاصلة: الفعل ثم الفاعل."]},"de":{"prompt":"Ordne den Satz. Beginne mit `Obwohl`.","explain":"Erst der Nebensatz mit `war` am Ende, dann `hat`, dann das Subjekt `es`.","hints":["Nach dem Komma: Verb, dann Subjekt."]}}},{"id":"obwohl-6","type":"mcq","difficulty":2,"options":["obwohl","weil","denn"],"answer":0,"i18n":{"ar":{"prompt":"أي كلمة تكمل الجملة؟ `Er hat die Prüfung bestanden, ___ er wenig gelernt hat.`","explain":"القليل من الدراسة لا يكون سببًا للنجاح، بل أمرًا لم يمنعه. والفعل في الآخر، فلا تصلح `denn`.","hints":["هل الدراسة القليلة سبب للنجاح؟"]},"de":{"prompt":"Welches Wort passt? `Er hat die Prüfung bestanden, ___ er wenig gelernt hat.`","explain":"Wenig lernen ist kein Grund zu bestehen. Und das Verb steht am Ende, deshalb passt `denn` nicht.","hints":["Ist wenig Lernen ein Grund zu bestehen?"]}}},{"id":"obwohl-7","type":"text","difficulty":3,"answer":"Obwohl ich wenig Zeit habe, mache ich jeden Tag Sport.","i18n":{"ar":{"prompt":"اربط بـ `obwohl` وابدأ بها: `Ich habe wenig Zeit. Ich mache jeden Tag Sport.`","explain":"`Obwohl ich wenig Zeit habe, mache ich jeden Tag Sport.` الفعل `habe` في الآخر، ثم `mache ich`.","hints":["أي الجملتين كان يجب أن يمنع الأخرى؟"]},"de":{"prompt":"Verbinde mit `obwohl` am Satzanfang: `Ich habe wenig Zeit. Ich mache jeden Tag Sport.`","explain":"`Obwohl ich wenig Zeit habe, mache ich jeden Tag Sport.` `habe` steht am Ende, danach `mache ich`.","hints":["Welcher Satz müsste den anderen eigentlich verhindern?"]}}},{"id":"obwohl-8","type":"text","difficulty":3,"context":"Obwohl es regnet, ich gehe spazieren.","answer":"Obwohl es regnet, gehe ich spazieren.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الجملة التابعة تشغل الموقع الأول، فيأتي الفعل `gehe` بعد الفاصلة مباشرة ثم `ich`.","hints":["ماذا يأتي بعد الفاصلة؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Nebensatz besetzt Position 1. Nach dem Komma folgt `gehe`, dann `ich`.","hints":["Was steht nach dem Komma?"]}}},{"id":"obwohl-9","type":"text","difficulty":2,"answer":"Ich lerne Deutsch, obwohl die Grammatik schwer ist.","i18n":{"ar":{"prompt":"اكتب جملة عن تعلم الألمانية مع `obwohl`.","explain":"مثال: `Ich lerne Deutsch, obwohl die Grammatik schwer ist.`","hints":["الفعل المصرف في آخر جملة `obwohl`."]},"de":{"prompt":"Schreib einen Satz über dein Deutschlernen mit `obwohl`.","explain":"Zum Beispiel: `Ich lerne Deutsch, obwohl die Grammatik schwer ist.`","hints":["Im obwohl-Satz steht das konjugierte Verb am Ende."]}}}]},{"id":"trotzdem","level":"B1.2","island":"gegensatz-vergleich","order":2,"prereqs":["obwohl"],"emoji":"💪","german":"Konzessives Verbindungsadverb trotzdem","source":{"lektion":7,"kind":"toc"},"pattern":["Tatsache",".","trotzdem","+","Verb","+","Subjekt"],"frames":[{"k":"main","parts":[["vf","Es"],["v","regnet"]]},{"k":"main","parts":[["vf","Trotzdem"],["v","gehe"],["mf","ich spazieren"]]},{"k":"main","parts":[["vf","Ich"],["v","gehe"],["mf","trotzdem spazieren"]]}],"example":"Es regnet. Trotzdem gehe ich spazieren.","stepExamples":["Obwohl es regnet, gehe ich spazieren.","Es regnet. Trotzdem gehe ich spazieren.","Es regnet. Ich gehe trotzdem spazieren.","Es regnet, aber ich gehe trotzdem spazieren."],"pitfallPair":"Trotzdem es regnet, gehe ich spazieren. → Obwohl es regnet, gehe ich spazieren.","links":["https://grammis.ids-mannheim.de/terminologie/1874","https://www.dwds.de/wb/trotzdem"],"i18n":{"ar":{"title":"ومع ذلك: trotzdem","lead":"`trotzdem` تقول المعنى نفسه الذي تقوله `obwohl`، لكن من الجهة الأخرى: تذكر الأمر المعيق أولًا في جملة كاملة، ثم تقول «ومع ذلك» وتذكر ما فعلته. والفعل هنا يبقى في الموقع الثاني.","translation":"إنها تمطر. ومع ذلك أخرج للنزهة.","steps":[{"text":"انطلق من جملة مع obwohl","why":"`obwohl` تقف أمام الأمر المعيق، أي المطر. أما `trotzdem` فتقف أمام النتيجة غير المتوقعة، أي النزهة."},{"text":"اجعل المعيق جملة رئيسية، وابدأ النتيجة بـ trotzdem","why":"`trotzdem` ظرف يشغل الموقع الأول وحده، فيأتي الفعل المصرف `gehe` بعده مباشرة ثم الفاعل."},{"text":"أو ضع trotzdem في وسط الجملة","why":"إذا بدأت بالفاعل يقف `trotzdem` بعد الفعل: `Ich gehe trotzdem spazieren.`"},{"text":"يمكنك الجمع بين aber و trotzdem","why":"`aber` تقف في الموقع صفر ولا تغير ترتيب الجملة، و`trotzdem` في الوسط تقوّي المعنى: `…, aber ich gehe trotzdem spazieren.`"}],"explain":["`trotzdem` تعني «رغم ذلك» وتشير إلى الجملة السابقة. لهذا لا تأتي إلا بعد أن تذكر الأمر المعيق.","القاعدة السهلة: `obwohl` + المعيق والفعل في الآخر. `trotzdem` + النتيجة والفعل في الموقع الثاني. المعنى واحد، والبناء مختلف."],"pitfall":"`trotzdem` ليست أداة ربط تابعة. لا تضعها أمام الأمر المعيق، بل أمام النتيجة، أو استعمل `obwohl`.","recall":["أكمل بـ `trotzdem`: `Der Film war lang. …`","مثلًا `Trotzdem war er spannend.` الفعل `war` بعد `Trotzdem` مباشرة."],"linkTitles":["أدوات التنازل · grammis","trotzdem في معجم DWDS"],"table":[["الكلمة","تقف أمام","موقع الفعل","مثال"],["obwohl","الأمر المعيق","في الآخر","Obwohl es regnet, gehe ich raus."],["trotzdem","النتيجة غير المتوقعة","الموقع الثاني","Es regnet. Trotzdem gehe ich raus."]]},"de":{"title":"Das konzessive Verbindungsadverb trotzdem","lead":"`trotzdem` sagt dasselbe wie `obwohl`, nur von der anderen Seite: Du nennst zuerst das Hindernis in einem ganzen Satz und dann, was du „trotzdem“ tust. Das Verb bleibt dabei auf Position 2.","steps":[{"text":"Geh von einem obwohl-Satz aus","why":"`obwohl` steht vor dem Hindernis, dem Regen. `trotzdem` steht vor der unerwarteten Folge, dem Spaziergang."},{"text":"Mach das Hindernis zum Hauptsatz und beginne die Folge mit trotzdem","why":"`trotzdem` ist ein Adverb und besetzt allein Position 1. Danach kommen das konjugierte Verb `gehe` und das Subjekt."},{"text":"Oder stell trotzdem ins Mittelfeld","why":"Beginnst du mit dem Subjekt, steht `trotzdem` nach dem Verb: `Ich gehe trotzdem spazieren.`"},{"text":"aber und trotzdem kannst du kombinieren","why":"`aber` steht auf Position 0 und ändert die Wortstellung nicht. `trotzdem` im Mittelfeld verstärkt: `…, aber ich gehe trotzdem spazieren.`"}],"explain":["`trotzdem` heißt „obwohl das so ist“ und zeigt auf den vorigen Satz. Deshalb steht es erst, nachdem das Hindernis genannt wurde.","Eine einfache Regel: `obwohl` + Hindernis, Verb am Ende. `trotzdem` + Folge, Verb auf Position 2. Gleiche Bedeutung, anderer Satzbau."],"pitfall":"`trotzdem` ist kein Subjunktor. Es steht nicht vor dem Hindernis, sondern vor der Folge – oder du nimmst `obwohl`.","recall":["Ergänze mit `trotzdem`: `Der Film war lang. …`","Zum Beispiel `Trotzdem war er spannend.` `war` folgt direkt auf `Trotzdem`."],"linkTitles":["Konzessive Konnektoren · grammis","trotzdem im DWDS"],"table":[["Wort","steht vor","Verbstellung","Beispiel"],["obwohl","dem Hindernis","am Ende","Obwohl es regnet, gehe ich raus."],["trotzdem","der unerwarteten Folge","Position 2","Es regnet. Trotzdem gehe ich raus."]]}},"questions":[{"id":"trotzdem-1","type":"cloze","difficulty":1,"text":"Das Hotel war teuer. Trotzdem {{1}} wir dort übernachtet.","blanks":[["haben"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد المناسب.","explain":"بعد `Trotzdem` يأتي الفعل المصرف مباشرة: `haben wir`.","hints":["`übernachten` يصرّف مع `haben`."]},"de":{"prompt":"Ergänze das passende Hilfsverb.","explain":"Nach `Trotzdem` folgt sofort das konjugierte Verb: `haben wir`.","hints":["`übernachten` bildet das Perfekt mit `haben`."]}}},{"id":"trotzdem-2","type":"cloze","difficulty":1,"text":"Ich bin müde, aber ich gehe {{1}} ins Kino.","blanks":[["trotzdem"]],"i18n":{"ar":{"prompt":"أكمل بكلمة تعني «ومع ذلك».","explain":"`trotzdem` في وسط الجملة بعد الفعل، وتقوّي معنى `aber`.","hints":["الكلمة تبدأ بـ `trotz`."]},"de":{"prompt":"Ergänze das Wort für „obwohl das so ist“.","explain":"`trotzdem` steht im Mittelfeld nach dem Verb und verstärkt `aber`.","hints":["Das Wort beginnt mit `trotz`."]}}},{"id":"trotzdem-3","type":"mcq","difficulty":1,"options":["Er war krank.
