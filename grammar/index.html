"الباب الذي ينغلق الآن · الباب المغلق.","steps":[{"text":"افهم دور الاسم مع Partizip I","why":"الشخص هو من يصلح. من المصدر `reparieren` نصنع `reparierend` ثم نضيف `-e` للمؤنث بعد الأداة المحددة في الرفع."},{"text":"اختر Partizip II لوصف النتيجة","why":"الدراجة هي ما أُصلح. صيغة `repariert` تعرفها من الماضي، وتضاف إليها `-e` حين تأتي صفة للمحايد بعد `das` في الرفع أو الأكوزاتيف."},{"text":"انتبه إلى شكل الفعل الأصلي","why":"احتفظ بصيغة `Partizip II` كما هي قبل إلحاق نهاية الصفة. أفعال مثل `reparieren` و`verkaufen` لا تكتسب `ge-` في هذه الصيغة."},{"text":"افصل الصيغة عن النهاية","why":"في `gestrichenen` الأساس `gestrichen`، ثم أضفت `-en` بعد `einem`. الداتيف يأتي من `mit`، حتى مع وجود كلمة إضافية مثل `frisch`."}],"explain":["قد يحمل `Partizip II` معنى الإتمام حتى عندما يكون الاسم نفسه من قام بالحركة. مثال ذلك `die angekommenen Gäste`، أي الضيوف الذين وصلوا بالفعل. قارنها بـ `die ankommenden Gäste` أي الذين يصلون الآن أو في الوقت المعني. الصفة قبل الاسم تحمل نهاية، بينما في `Die Tür ist geschlossen` تظهر `geschlossen` بلا نهاية بعد `sein`."],"pitfall":"إذا كنت تقصد الدراجات التي أُصلحت فقل `die reparierten Fahrräder`. اختيار `reparierenden` يجعل الدراجات تقوم بالإصلاح.","recall":["ما الفرق بين `ein geschriebenes Wort` و`ein schreibendes Kind`؟","الكلمة نتيجة الكتابة، والطفل يقوم بالكتابة. نهاية المحايد بعد `ein` هي `-es` في الحالتين."],"linkTitles":["فهرس قواعد الوحدة 2 · telc، ص 2","حلول الكتاب الرسمية · telc","Partizip I · grammis"]},"de":{"title":"Partizip I und II als Adjektiv","lead":"Bei der Wahl der Form helfen dir zwei Fragen: Führt das Nomen die Handlung selbst aus? Oder ist mit ihm etwas passiert bzw. ist es im Ergebnis-Zustand?","steps":[{"text":"Verstehe die Rolle des Nomens beim Partizip I","why":"Die Person repariert selbst. Aus `reparieren` wird `reparierend`, dazu kommt `-e` für das Femininum nach dem bestimmten Artikel im Nominativ."},{"text":"Wähle Partizip II für das Ergebnis","why":"Das Fahrrad wurde repariert. Die Form `repariert` kennst du aus dem Perfekt; als Adjektiv für ein Neutrum nach `das` (Nominativ oder Akkusativ) bekommt sie `-e`."},{"text":"Achte auf die Form des Verbs","why":"Behalte das `Partizip II` genau so, bevor du die Adjektivendung anhängst. Verben wie `reparieren` und `verkaufen` bekommen in dieser Form kein `ge-`."},{"text":"Trenne Form und Endung","why":"In `gestrichenen` ist die Basis `gestrichen`, danach kommt `-en` nach `einem`. Der Dativ kommt von `mit` – auch mit einem Zusatzwort wie `frisch`."}],"explain":["Das `Partizip II` kann Abgeschlossenheit ausdrücken, sogar wenn das Nomen selbst die Bewegung gemacht hat: `die angekommenen Gäste` sind die Gäste, die schon da sind. Vergleiche mit `die ankommenden Gäste`, die gerade (oder zum gemeinten Zeitpunkt) ankommen. Vor dem Nomen hat das Partizip eine Endung, nach `sein` dagegen nicht: `Die Tür ist geschlossen`."],"pitfall":"Meinst du Fahrräder, die repariert wurden, sag `die reparierten Fahrräder`. Mit `reparierenden` würden die Fahrräder selbst reparieren.","recall":["Was ist der Unterschied zwischen `ein geschriebenes Wort` und `ein schreibendes Kind`?","Das Wort ist das Ergebnis des Schreibens, das Kind schreibt selbst. Die Neutrum-Endung nach `ein` ist in beiden Fällen `-es`."],"linkTitles":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Partizip I · grammis"]}},"questions":[{"id":"partizip-adjektiv-1","type":"mcq","difficulty":1,"options":["das reparierte Fahrrad","das reparierende Fahrrad","das reparieren Fahrrad"],"answer":0,"i18n":{"ar":{"prompt":"أي عبارة تعني «الدراجة التي أُصلحت»؟","explain":"repariert يصف نتيجة الإصلاح. reparierend يجعل الدراجة هي التي تصلح. reparieren مصدر.","hints":["اسأل من الذي قام بالإصلاح."]},"de":{"prompt":"Welcher Ausdruck bedeutet „das Fahrrad, das repariert wurde“?","explain":"`repariert` beschreibt das Ergebnis der Reparatur. `reparierend` würde bedeuten, dass das Fahrrad repariert. `reparieren` ist der Infinitiv.","hints":["Frag, wer repariert hat."]}}},{"id":"partizip-adjektiv-2","type":"cloze","difficulty":1,"text":"der {{1}} Brief","blanks":[["geschriebene"]],"i18n":{"ar":{"prompt":"صف الرسالة بوصفها نتيجة الكتابة. استعمل schreiben.","explain":"geschrieben يأخذ -e قبل المذكر في الرفع بعد der.","hints":["ابدأ بصيغة Partizip II للفعل الشاذ."]},"de":{"prompt":"Beschreib den Brief als Ergebnis des Schreibens. Benutze `schreiben`.","explain":"`geschrieben` bekommt `-e` vor einem Maskulinum im Nominativ nach `der`.","hints":["Beginne mit dem Partizip II des unregelmäßigen Verbs."]}}},{"id":"partizip-adjektiv-3","type":"cloze","difficulty":1,"text":"die {{1}} Menschen","blanks":[["arbeitenden"]],"i18n":{"ar":{"prompt":"أكمل الوصف لعمّال يؤدّون العمل الآن. استعمل arbeiten.","explain":"arbeitend + -en للجمع بعد die.","hints":["هؤلاء يقومون بالفعل."]},"de":{"prompt":"Ergänze die Beschreibung für Arbeiter, die gerade arbeiten. Benutze `arbeiten`.","explain":"`arbeitend` + `-en` für den Plural nach `die`.","hints":["Diese Menschen führen die Handlung aus."]}}},{"id":"partizip-adjektiv-4","type":"mcq","difficulty":2,"options":["die angekommenen Gäste","die ankommenden Gäste","die ankommen Gäste"],"answer":0,"i18n":{"ar":{"prompt":"أيّ عبارة تدل على أن الضيوف وصلوا بالفعل؟","explain":"angekommen يصف اكتمال الوصول. ankommend يصف حركة الوصول في الوقت المعني.","hints":["ركّز على اكتمال فعل الوصول."]},"de":{"prompt":"Welcher Ausdruck zeigt, dass die Gäste schon angekommen sind?","explain":"`angekommen` beschreibt das abgeschlossene Ankommen. `ankommend` beschreibt das Ankommen zum gemeinten Zeitpunkt.","hints":["Konzentrier dich auf das abgeschlossene Ankommen."]}}},{"id":"partizip-adjektiv-5","type":"cloze","difficulty":2,"text":"mit einem frisch {{1}} Tisch","blanks":[["gestrichenen"]],"i18n":{"ar":{"prompt":"أكمل بوصف الطاولة بعد دهنها. استعمل streichen.","explain":"gestrichen + -en بعد einem مع الاسم المذكر في الداتيف.","hints":["اكتب Partizip II ثم نهاية الداتيف."]},"de":{"prompt":"Beschreib den Tisch, nachdem er gestrichen wurde. Benutze `streichen`.","explain":"`gestrichen` + `-en` nach `einem` mit einem maskulinen Nomen im Dativ.","hints":["Schreib das Partizip II und dann die Dativendung."]}}},{"id":"partizip-adjektiv-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"اختر فرق المعنى بين das geöffnete Tor وdas sich öffnende Tor.","explain":"geöffnet هو Partizip II ويعرض النتيجة. sich öffnend يصف ما يجري.","hints":["أيّ وصف يضم Partizip II؟"],"options":["الأولى تصف بوابة فُتحت، والثانية بوابة تنفتح.","العبارتان تصفان بوابة أُغلقت.","الأولى تصف بدء الفتح، والثانية تصف اكتماله."]},"de":{"prompt":"Was ist der Unterschied zwischen `das geöffnete Tor` und `das sich öffnende Tor`?","explain":"`geöffnet` ist Partizip II und zeigt das Ergebnis. `sich öffnend` beschreibt, was gerade passiert.","hints":["Welche Beschreibung enthält ein Partizip II?"],"options":["Das erste ist ein Tor, das geöffnet wurde; das zweite ein Tor, das sich gerade öffnet.","Beide beschreiben ein geschlossenes Tor.","Das erste beschreibt den Beginn des Öffnens, das zweite das Ende."]}}},{"id":"partizip-adjektiv-7","type":"text","difficulty":3,"answer":"das geputzte Fenster und das sich schließende Fenster","i18n":{"ar":{"prompt":"اكتب وصفين لـ das Fenster. النافذة المنظَّفة من putzen، والنافذة التي تنغلق من sich schließen.","explain":"geputzt + -e وصف النتيجة. sich schließend + -e يصف الانغلاق الجاري.","hints":["حدّد أي وصف فيه نتيجة وأيهما فيه عملية."]},"de":{"prompt":"Schreib zwei Beschreibungen für `das Fenster`: das geputzte Fenster (`putzen`) und das Fenster, das sich gerade schließt (`sich schließen`).","explain":"`geputzt` + `-e` beschreibt das Ergebnis. `sich schließend` + `-e` beschreibt das laufende Schließen.","hints":["Bestimme, welche Beschreibung ein Ergebnis und welche einen Vorgang zeigt."]}}},{"id":"partizip-adjektiv-8","type":"text","difficulty":3,"answer":"die reparierten Fahrräder","context":"die reparierenden Fahrräder","i18n":{"ar":{"prompt":"صحّح الوصف حتى يعني «الدراجات التي أُصلحت». واشرح اختيارك.","explain":"إذا كنت تقصد الدراجات التي أُصلحت فقل `die reparierten Fahrräder`. اختيار `reparierenden` يجعل الدراجات تقوم بالإصلاح.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere die Beschreibung, sodass sie „die Fahrräder, die repariert wurden“ bedeutet, und erkläre deine Wahl.","explain":"Meinst du Fahrräder, die repariert wurden, sag `die reparierten Fahrräder`. Mit `reparierenden` würden die Fahrräder selbst reparieren.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"partizip-adjektiv-9","type":"text","difficulty":2,"answer":"الكلمة نتيجة الكتابة، والطفل يقوم بالكتابة. نهاية المحايد بعد `ein` هي `-es` في الحالتين.","i18n":{"ar":{"prompt":"ما الفرق بين `ein geschriebenes Wort` و`ein schreibendes Kind`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Was ist der Unterschied zwischen `ein geschriebenes Wort` und `ein schreibendes Kind`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"gradpartikeln","level":"B1.2","island":"adjektive","order":6,"prereqs":[],"emoji":"🎚️","german":"Gradpartikeln","source":{"lektion":8,"kind":"toc"},"pattern":["Gradpartikel","+","Adjektiv / Adverb"],"frames":[{"k":"main","parts":[["vf","Der Film"],["v","war"],["mf","ziemlich"],["hl","spannend"]]},{"k":"main","parts":[["vf","Das neue Handy"],["v","ist"],["mf","viel"],["hl","besser"]]},{"k":"np","parts":[["n","ein"],["mf","besonders"],["hl","schönes"],["n","Foto"]]}],"example":"Der Film war ziemlich spannend.","stepExamples":["Der Film war spannend.","Der Film war sehr spannend. · Der Film war etwas langweilig.","Der Film war ziemlich spannend.","Die Jacke ist zu teuer.","Das neue Handy ist viel besser."],"pitfallPair":"Das neue Handy ist sehr besser. → Das neue Handy ist viel besser.","links":["https://www.dwds.de/wb/Gradpartikel","https://www.dwds.de/wb/ziemlich"],"i18n":{"ar":{"title":"تقوية الصفة وتخفيفها","lead":"هل كان الفيلم مشوّقًا قليلًا أم كثيرًا أم إلى حد ما؟ الكلمات الصغيرة قبل الصفة تحدد الدرجة بدقة. ستتعلم ترتيبها من الأضعف إلى الأقوى، ومتى تقول `zu` ومتى تقول `viel`.","translation":"كان الفيلم مشوّقًا إلى حد كبير.","steps":[{"text":"ابدأ بالصفة وحدها","why":"الصفة `spannend` تصف الفيلم، لكنها لا تقول إلى أي درجة كان مشوّقًا."},{"text":"ضع كلمة الدرجة مباشرة قبل الصفة","why":"`sehr` تقوّي و`etwas` أو `ein bisschen` تخفّف. كلمة الدرجة لا تتغير أبدًا ولا تأخذ نهايات."},{"text":"اختر الدرجة المتوسطة بدقة","why":"`ziemlich` و`recht` تعنيان «إلى حد كبير». أما `ganz` فمعناها في الغالب «لا بأس، بشكل مقبول» حين لا تُنطق بقوة: `Das Essen war ganz gut.`"},{"text":"zu تعني «أكثر من اللازم»","why":"`zu teuer` لا تعني «غالية جدًا» فقط، بل أنها غالية إلى درجة لا تناسبك. غالبًا لن تشتريها."},{"text":"مع صيغة المقارنة استعمل viel أو etwas","why":"`sehr` لا تقف قبل صيغة المقارنة. تقول `viel besser` و`etwas billiger` و`noch schneller`."}],"explain":["تُسمّى هذه الكلمات في كتب الألمانية للأجانب `Gradpartikeln`، وبعض كتب القواعد تسمّيها كلمات الشدة. تقف قبل الصفة أو الظرف مباشرة، وإذا جاءت الصفة قبل اسم بقيت كلمة الدرجة بلا نهاية: `ein besonders schönes Foto`.","في الكلام اليومي تسمع أيضًا `echt` و`total` و`voll` للتقوية، و`gar nicht` و`überhaupt nicht` للنفي القوي."],"pitfall":"قبل صيغة المقارنة لا تأتي `sehr`. استعمل `viel` أو `etwas` أو `noch`.","recall":["ما الفرق بين `Die Jacke ist sehr teuer` و`Die Jacke ist zu teuer`؟","الأولى تقول إن السعر مرتفع. والثانية تقول إن السعر أعلى مما يناسبك، فالأرجح أنك لن تشتريها."],"linkTitles":["Gradpartikel في معجم DWDS","ziemlich في معجم DWDS"],"table":[["الدرجة","الكلمات","مثال"],["لا شيء","gar nicht · überhaupt nicht","Das ist gar nicht schwer."],["قليلًا","etwas · ein bisschen · kaum","Ich bin ein bisschen müde."],["متوسط","ganz · ziemlich · recht","Der Kurs ist ziemlich gut."],["كثيرًا","sehr · besonders · wirklich · total","Das ist wirklich toll."],["أكثر من اللازم","zu","Der Kaffee ist zu heiß."],["مع المقارنة","viel · etwas · noch","Heute ist es viel wärmer."]]},"de":{"title":"Gradpartikeln","lead":"War der Film ein bisschen, ziemlich oder sehr spannend? Kleine Wörter vor dem Adjektiv bestimmen den Grad genau. Du lernst ihre Reihenfolge von schwach bis stark und wann du `zu` und wann `viel` brauchst.","steps":[{"text":"Beginne mit dem Adjektiv allein","why":"`spannend` beschreibt den Film, sagt aber nicht, wie stark."},{"text":"Stell das Gradwort direkt vor das Adjektiv","why":"`sehr` verstärkt, `etwas` oder `ein bisschen` schwächt ab. Das Gradwort ändert sich nie und bekommt keine Endung."},{"text":"Wähle die Mitte genau","why":"`ziemlich` und `recht` heißen „mehr als erwartet“. `ganz` bedeutet unbetont meist „okay, nicht schlecht“: `Das Essen war ganz gut.`"},{"text":"zu heißt „mehr als passend“","why":"`zu teuer` heißt nicht nur „sehr teuer“, sondern: so teuer, dass es nicht passt. Du kaufst es wahrscheinlich nicht."},{"text":"Beim Komparativ nimmst du viel oder etwas","why":"Vor einem Komparativ steht kein `sehr`. Du sagst `viel besser`, `etwas billiger`, `noch schneller`."}],"explain":["In Lehrwerken heißen diese Wörter Gradpartikeln, manche Grammatiken sprechen von Intensitätspartikeln. Sie stehen direkt vor dem Adjektiv oder Adverb. Vor einem Nomen bleibt das Gradwort ohne Endung: `ein besonders schönes Foto`.","Umgangssprachlich verstärkst du auch mit `echt`, `total` oder `voll`. Stark verneint wird mit `gar nicht` und `überhaupt nicht`."],"pitfall":"Vor einem Komparativ steht kein `sehr`. Nimm `viel`, `etwas` oder `noch`.","recall":["Was ist der Unterschied zwischen `Die Jacke ist sehr teuer` und `Die Jacke ist zu teuer`?","Der erste Satz sagt: Der Preis ist hoch. Der zweite: Der Preis ist höher, als es für dich passt – du kaufst sie wohl nicht."],"linkTitles":["Gradpartikel im DWDS","ziemlich im DWDS"],"table":[["Grad","Wörter","Beispiel"],["gar nicht","gar nicht · überhaupt nicht","Das ist gar nicht schwer."],["wenig","etwas · ein bisschen · kaum","Ich bin ein bisschen müde."],["mittel","ganz · ziemlich · recht","Der Kurs ist ziemlich gut."],["stark","sehr · besonders · wirklich · total","Das ist wirklich toll."],["zu stark","zu","Der Kaffee ist zu heiß."],["beim Komparativ","viel · etwas · noch","Heute ist es viel wärmer."]]}},"questions":[{"id":"gradpartikeln-1","type":"cloze","difficulty":1,"text":"Ich kann den Tee nicht trinken, er ist {{1}} heiß.","blanks":[["zu"]],"i18n":{"ar":{"prompt":"أكمل بالكلمة التي تعني «أكثر من اللازم».","explain":"الشاي ساخن إلى درجة لا تسمح بشربه: `zu heiß`.","hints":["النتيجة: لا أستطيع الشرب."]},"de":{"prompt":"Ergänze das Wort für „mehr als passend“.","explain":"Der Tee ist so heiß, dass man ihn nicht trinken kann: `zu heiß`.","hints":["Die Folge: Ich kann nicht trinken."]}}},{"id":"gradpartikeln-2","type":"cloze","difficulty":1,"text":"Mit dem Zug bist du {{1}} schneller als mit dem Bus.","blanks":[["viel","noch","etwas"]],"i18n":{"ar":{"prompt":"أكمل بكلمة درجة قبل صيغة المقارنة.","explain":"قبل `schneller` نستعمل `viel` أو `etwas` أو `noch`، لا `sehr`.","hints":["`schneller` صيغة مقارنة."]},"de":{"prompt":"Ergänze ein Gradwort vor dem Komparativ.","explain":"Vor `schneller` passt `viel`, `etwas` oder `noch`, aber nicht `sehr`.","hints":["`schneller` ist ein Komparativ."]}}},{"id":"gradpartikeln-3","type":"mcq","difficulty":1,"options":["ein bisschen","sehr","total"],"answer":0,"i18n":{"ar":{"prompt":"أي كلمة تخفّف المعنى؟ `Ich bin ___ müde, aber ich komme mit.`","explain":"`ein bisschen` تعني «قليلًا». الشخص متعب قليلًا فقط، لذلك يأتي معنا.","hints":["الشخص سيأتي رغم التعب."]},"de":{"prompt":"Welches Wort schwächt ab? `Ich bin ___ müde, aber ich komme mit.`","explain":"`ein bisschen` heißt „nur wenig“. Die Person ist nur wenig müde und kommt deshalb mit.","hints":["Die Person kommt trotz Müdigkeit mit."]}}},{"id":"gradpartikeln-4","type":"cloze","difficulty":2,"text":"Das war ein {{1}} schöner Abend, und das Essen war {{2}} nicht teuer.","blanks":[["besonders","sehr","wirklich"],["gar","überhaupt"]],"i18n":{"ar":{"prompt":"أكمل بكلمة تقوية ثم بكلمة نفي قوي.","explain":"قبل الصفة مع الاسم تبقى كلمة الدرجة بلا نهاية: `ein besonders schöner Abend`. والنفي القوي `gar nicht` أو `überhaupt nicht`.","hints":["الفراغ الثاني يقف قبل `nicht`."]},"de":{"prompt":"Ergänze ein verstärkendes Wort und eine starke Verneinung.","explain":"Vor dem Adjektiv bleibt das Gradwort ohne Endung: `ein besonders schöner Abend`. Stark verneint: `gar nicht` oder `überhaupt nicht`.","hints":["Die zweite Lücke steht vor `nicht`."]}}},{"id":"gradpartikeln-5","type":"cloze","difficulty":2,"text":"Die Prüfung war nicht leicht, aber auch nicht sehr schwer. Sie war {{1}} schwer.","blanks":[["ziemlich","recht","etwas","ein bisschen"]],"i18n":{"ar":{"prompt":"أكمل بكلمة درجة متوسطة.","explain":"بين «سهل» و«صعب جدًا» تصلح `ziemlich` أو `recht` أو `etwas`.","hints":["ابحث عن الوسط."]},"de":{"prompt":"Ergänze ein Gradwort für die Mitte.","explain":"Zwischen „leicht“ und „sehr schwer“ passen `ziemlich`, `recht` oder `etwas`.","hints":["Such die Mitte."]}}},{"id":"gradpartikeln-6","type":"mcq","difficulty":2,"options":["Die Hose ist zu klein.","Die Hose ist sehr klein.","Die Hose ist ziemlich klein."],"answer":0,"i18n":{"ar":{"prompt":"تجرّب سروالًا ولا يناسبك لأنه صغير. ماذا تقول للبائع؟","explain":"`zu klein` تعني أنه أصغر مما يناسبك. الجملتان الأخريان لا تقولان إنه لا يناسب.","hints":["المشكلة أنه لا يناسب."]},"de":{"prompt":"Du probierst eine Hose an, sie passt nicht, weil sie klein ist. Was sagst du?","explain":"`zu klein` heißt: kleiner, als es passt. Die anderen Sätze sagen nicht, dass sie nicht passt.","hints":["Das Problem: Sie passt nicht."]}}},{"id":"gradpartikeln-7","type":"text","difficulty":3,"answer":"Die neue Wohnung ist viel größer als die alte.","i18n":{"ar":{"prompt":"اكتب أن الشقة الجديدة أكبر بكثير من القديمة. استعمل `größer`.","explain":"قبل صيغة المقارنة نقول `viel`: `viel größer als die alte`.","hints":["لا تستعمل `sehr`."]},"de":{"prompt":"Schreib, dass die neue Wohnung deutlich größer als die alte ist. Benutze `größer`.","explain":"Vor dem Komparativ steht `viel`: `viel größer als die alte`.","hints":["Nicht `sehr` benutzen."]}}},{"id":"gradpartikeln-8","type":"text","difficulty":3,"context":"Das neue Handy ist sehr besser.","answer":"Das neue Handy ist viel besser.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"`besser` صيغة مقارنة، وقبلها نقول `viel` أو `etwas` أو `noch`، لا `sehr`.","hints":["ما نوع الصفة `besser`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`besser` ist ein Komparativ. Davor steht `viel`, `etwas` oder `noch`, nicht `sehr`.","hints":["Was für eine Form ist `besser`?"]}}},{"id":"gradpartikeln-9","type":"text","difficulty":2,"answer":"Mein Deutschkurs ist ziemlich gut, aber ein bisschen zu früh am Morgen.","i18n":{"ar":{"prompt":"صف دورة الألمانية بجملة فيها كلمتا درجة مختلفتان.","explain":"مثال: `Mein Deutschkurs ist ziemlich gut, aber ein bisschen zu früh am Morgen.`","hints":["كلمة درجة تقف مباشرة قبل الصفة."]},"de":{"prompt":"Beschreib deinen Deutschkurs mit zwei verschiedenen Gradwörtern.","explain":"Zum Beispiel: `Mein Deutschkurs ist ziemlich gut, aber ein bisschen zu früh am Morgen.`","hints":["Das Gradwort steht direkt vor dem Adjektiv."]}}}]},{"id":"irgendein","level":"B1.1","island":"pronomen","order":1,"prereqs":[],"emoji":"🎲","german":"irgendein / irgendeine / irgendwelche","source":{"lektion":3,"kind":"sample"},"pattern":["irgend-","+","ein- (Singular)","·","welch- (Plural)","+ Endung wie ein"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","suche"],["hl","irgendeinen"],["mf","Stuhl"]]},{"k":"main","parts":[["vf","Ich"],["v","suche"],["hl","irgendwelche"],["mf","Stühle"]]}],"example":"Ich suche irgendeinen Stuhl. · Ich suche irgendwelche Stühle.","stepExamples":["Hast du irgendeine Idee?","Nom. irgendein / irgendeine / irgendein · Akk. irgendeinen / irgendeine / irgendein · Dat. irgendeinem / irgendeiner / irgendeinem","Nom./Akk. irgendwelche · Dat. irgendwelchen","Das ist nicht irgendein Tisch."],"pitfallPair":"mit irgendwelche Freunden → mit irgendwelchen Freunden","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"],"i18n":{"ar":{"title":"التعبير عن شيء أو شخص غير محدد","lead":"تستخدم هذه الأداة حين لا تعرف أي فرد تقصد، أو لا يهمك تحديد فرد بعينه. تحدد حالة الاسم نهايتها مثلما تحدد نهاية `ein`.","translation":"أبحث عن أي كرسي · أبحث عن بعض الكراسي أيًّا كانت.","steps":[{"text":"افهم أثر irgendein","why":"قد تحمل العبارة معنى «أي فكرة على الإطلاق». ويمكن أن تعبّر عن هوية غير معروفة، كما في `Irgendein Nachbar hat angerufen`. يوضح السياق أي المعنيين تقصد."},{"text":"صرّف المفرد مثل ein","why":"الترتيب هنا مذكر، مؤنث، محايد. مع `suchen` المذكر مفعول مباشر، لذلك تقول `irgendeinen Stuhl`. ومع `mit` تقول `mit irgendeinem Stuhl`."},{"text":"كوّن الجمع بجذر irgendwelch-","why":"تحتاج في الجمع إلى الجذر `irgendwelch-`. ويأخذ اسم الجمع في الداتيف عادة `-n` إذا لم ينتهِ بها أو بـ `-s`، مثل `mit irgendwelchen Stühlen`."},{"text":"اقرأ موقع النفي","why":"قد تعني العبارة أن لهذه الطاولة بعينها أهمية خاصة. أما `Das ist kein Tisch` فتنفي انتماء الشيء إلى فئة الطاولات."}],"explain":["عندما تكتب، حدّد أولًا هل الاسم مفرد أو جمع. ثم عيّن الجنس للمفرد والحالة للجميع. قارن `irgendein Laden öffnet` و`ich suche irgendeinen Laden` و`ich kaufe in irgendeinem Laden ein`. بقي الاسم مذكرًا بينما تغيّرت وظيفته في الجملة."],"pitfall":"يطلب `mit` الداتيف، وصيغة الجمع في الداتيف هي `irgendwelchen`.","recall":["لماذا تختلف الأداة بين `irgendein Bild` و`irgendwelche Bilder`؟","الأولى مفرد محايد. الثانية جمع وتستعمل جذر `irgendwelch-`."],"linkTitles":["فهرس قواعد الوحدة 3 · telc، ص 2","شرح القواعد، ص 35 من الكتاب · telc"],"table":[["الحالة","مذكر","مؤنث","محايد","جمع"],["Nominativ","irgendein","irgendeine","irgendein","irgendwelche"],["Akkusativ","irgendeinen","irgendeine","irgendein","irgendwelche"],["Dativ","irgendeinem","irgendeiner","irgendeinem","irgendwelchen"]]},"de":{"title":"irgendein / irgendeine / irgendwelche","lead":"Du benutzt dieses Wort, wenn du nicht weißt, welches einzelne Ding oder welche Person gemeint ist – oder wenn es dir egal ist. Der Kasus bestimmt die Endung genau wie bei `ein`.","steps":[{"text":"Verstehe die Wirkung von irgendein","why":"Der Ausdruck kann „überhaupt irgendeine Idee“ bedeuten. Er kann auch eine unbekannte Identität ausdrücken: `Irgendein Nachbar hat angerufen`. Der Kontext zeigt, was gemeint ist."},{"text":"Dekliniere den Singular wie ein","why":"Die Reihenfolge ist maskulin, feminin, neutral. Mit `suchen` ist das Maskulinum Akkusativobjekt, also `irgendeinen Stuhl`. Mit `mit` sagst du `mit irgendeinem Stuhl`."},{"text":"Bilde den Plural mit irgendwelch-","why":"Im Plural brauchst du den Stamm `irgendwelch-`. Nomen im Dativ Plural bekommen meist ein `-n`, wenn sie nicht schon auf `-n` oder `-s` enden: `mit irgendwelchen Stühlen`."},{"text":"Lies die Position der Verneinung","why":"Der Satz kann bedeuten, dass gerade dieser Tisch etwas Besonderes ist. `Das ist kein Tisch` dagegen sagt, dass es überhaupt kein Tisch ist."}],"explain":["Wenn du schreibst, bestimme zuerst, ob das Nomen Singular oder Plural ist. Dann bestimmst du das Genus (im Singular) und den Kasus. Vergleiche: `irgendein Laden öffnet`, `ich suche irgendeinen Laden`, `ich kaufe in irgendeinem Laden ein`. Das Nomen bleibt maskulin, nur seine Funktion im Satz ändert sich."],"pitfall":"`mit` verlangt den Dativ, und die Pluralform im Dativ ist `irgendwelchen`.","recall":["Warum unterscheidet sich das Wort in `irgendein Bild` und `irgendwelche Bilder`?","Das erste ist Singular neutral. Das zweite ist Plural und benutzt den Stamm `irgendwelch-`."],"linkTitles":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc"],"table":[["Kasus","Maskulin","Feminin","Neutrum","Plural"],["Nominativ","irgendein","irgendeine","irgendein","irgendwelche"],["Akkusativ","irgendeinen","irgendeine","irgendein","irgendwelche"],["Dativ","irgendeinem","irgendeiner","irgendeinem","irgendwelchen"]]}},"questions":[{"id":"irgendein-1","type":"cloze","difficulty":1,"text":"Ich suche {{1}} Laden.","blanks":[["irgendeinen"]],"i18n":{"ar":{"prompt":"أكمل أداة غير المحدد مع المذكر في الجملة.","explain":"Laden مذكر في الأكوزاتيف، فالنهاية -en.","hints":["ما حالة مفعول suchen؟"]},"de":{"prompt":"Ergänze das unbestimmte Wort für das maskuline Nomen.","explain":"`Laden` ist maskulin im Akkusativ, also Endung `-en`.","hints":["In welchem Kasus steht das Objekt von `suchen`?"]}}},{"id":"irgendein-2","type":"cloze","difficulty":1,"text":"Das ist {{1}} Lampe.","blanks":[["irgendeine"]],"i18n":{"ar":{"prompt":"أكمل أداة غير المحدد مع المؤنث.","explain":"الأداة في الرفع للمؤنث irgendeine.","hints":["بعد sein هنا تأتي مجموعة في الرفع."]},"de":{"prompt":"Ergänze das unbestimmte Wort für ein feminines Nomen.","explain":"Im Nominativ feminin heißt es `irgendeine`.","hints":["Nach `sein` steht hier eine Gruppe im Nominativ."]}}},{"id":"irgendein-3","type":"mcq","difficulty":1,"options":["irgendwelche","irgendeine","irgendwelchen"],"answer":0,"i18n":{"ar":{"prompt":"أي أداة تسبق Bücher هنا؟ Ich kaufe … Bücher.","explain":"irgendwelche للجمع في الرفع أو الأكوزاتيف، وirgendwelchen للداتيف.","hints":["Bücher جمع في الأكوزاتيف."]},"de":{"prompt":"Welches Wort steht hier vor `Bücher`? `Ich kaufe … Bücher.`","explain":"`irgendwelche` für Plural im Nominativ oder Akkusativ, `irgendwelchen` im Dativ.","hints":["`Bücher` ist Plural im Akkusativ."]}}},{"id":"irgendein-4","type":"cloze","difficulty":2,"text":"mit {{1}} Nachbarin · mit {{2}} Nachbarn (Pl.)","blanks":[["irgendeiner"],["irgendwelchen"]],"i18n":{"ar":{"prompt":"أكمل الأداة من irgendein-/irgendwelch-.","explain":"المؤنث المفرد في الداتيف -er. الجمع في الداتيف -en.","hints":["تحقق من العدد قبل كتابة النهاية."]},"de":{"prompt":"Ergänze das Wort mit `irgendein-` / `irgendwelch-`.","explain":"Feminin Singular im Dativ: `-er`. Plural im Dativ: `-en`.","hints":["Prüf den Numerus, bevor du die Endung schreibst."]}}},{"id":"irgendein-5","type":"cloze","difficulty":2,"text":"mit {{1}} {{2}} (die Stühle)","blanks":[["irgendwelchen"],["Stühlen"]],"i18n":{"ar":{"prompt":"أكمل أداة غير المحدد ثم اسم الجمع في الداتيف.","explain":"irgendwelchen تحمل -en. يضاف n إلى Stühle في داتيف الجمع.","hints":["راقب الاسم نفسه بعد تصريف الأداة."]},"de":{"prompt":"Ergänze das unbestimmte Wort und dann das Pluralnomen im Dativ.","explain":"`irgendwelchen` hat `-en`. `Stühle` bekommt im Dativ Plural ein `n`.","hints":["Achte auch auf das Nomen selbst, nachdem du das Wort dekliniert hast."]}}},{"id":"irgendein-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"أي معنى يلائم Das ist nicht irgendein Bild في سياق مدح اللوحة؟","explain":"nicht irgendein يشير هنا إلى تميّز اللوحة. kein Bild ينفي أن تكون لوحة أصلًا.","hints":["النفي يقع على فكرة «أيّ لوحة»."],"options":["هذه لوحة لها قيمة خاصة.","هذا الشيء ليس لوحة.","هذه أي لوحة، وتحديدها غير مهم."]},"de":{"prompt":"Welche Bedeutung passt zu `Das ist nicht irgendein Bild`, wenn jemand das Bild lobt?","explain":"`nicht irgendein` zeigt hier, dass das Bild besonders ist. `kein Bild` würde sagen, dass es gar kein Bild ist.","hints":["Die Verneinung bezieht sich auf die Idee „irgendein Bild“."],"options":["Das ist ein Bild mit besonderem Wert.","Das ist gar kein Bild.","Das ist irgendein Bild – welches, ist egal."]}}},{"id":"irgendein-7","type":"text","difficulty":3,"answer":"Ich suche irgendeinen Tisch und spreche mit irgendwelchen Freunden.","i18n":{"ar":{"prompt":"استبدل الأدوات العادية بأدوات عدم التحديد. Ich suche einen Tisch und spreche mit Freunden.","explain":"المذكر في الأكوزاتيف irgendeinen. الجمع في الداتيف irgendwelchen، وFreunden في الداتيف بالفعل.","hints":["حدّد حالة Tisch ثم حالة Freunde بعد mit."]},"de":{"prompt":"Ersetze die normalen Artikel durch unbestimmte Wörter: `Ich suche einen Tisch und spreche mit Freunden.`","explain":"Maskulin Akkusativ: `irgendeinen`. Plural Dativ: `irgendwelchen` – `Freunden` steht schon im Dativ.","hints":["Bestimme den Kasus von `Tisch` und dann den von `Freunde` nach `mit`."]}}},{"id":"irgendein-8","type":"text","difficulty":3,"answer":"mit irgendwelchen Freunden","context":"mit irgendwelche Freunden","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"يطلب `mit` الداتيف، وصيغة الجمع في الداتيف هي `irgendwelchen`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`mit` verlangt den Dativ, und die Pluralform im Dativ ist `irgendwelchen`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"irgendein-9","type":"text","difficulty":2,"answer":"الأولى مفرد محايد. الثانية جمع وتستعمل جذر `irgendwelch-`.","i18n":{"ar":{"prompt":"لماذا تختلف الأداة بين `irgendein Bild` و`irgendwelche Bilder`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Warum unterscheidet sich das Wort in `irgendein Bild` und `irgendwelche Bilder`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"indefinitpronomen","level":"B1.2","island":"pronomen","order":2,"prereqs":[],"emoji":"👥","german":"Indefinitpronomen: einer, keiner, welche","source":{"lektion":7,"kind":"toc"},"pattern":["ein- / kein-","+","Endung","→","einer · eine · eins · welche"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","habe"],["hl","einen"],["mf","im Rucksack"]]},{"k":"main","parts":[["vf","Hier"],["v","ist"],["hl","keiner"],["mf","frei"]]},{"k":"main","parts":[["vf","Ich"],["v","brauche"],["hl","welche"]]}],"example":"Hast du einen Stift? – Ja, ich habe einen.","stepExamples":["Ich suche einen Parkplatz.","Dort ist einer frei.","Hier ist keiner frei.","Brauchst du Briefmarken? – Ja, ich brauche welche.","Hast du jemanden gefragt? – Nein, niemanden."],"pitfallPair":"Das ist ein von meinen Kollegen. → Das ist einer von meinen Kollegen.","links":["https://grammis.ids-mannheim.de/progr%40mm/5310","https://grammis.ids-mannheim.de/fragen/4332"],"i18n":{"ar":{"title":"ضمائر غير محددة تحلّ محل الاسم","lead":"حين يسألك أحد «هل عندك قلم؟» لا تحتاج إلى تكرار كلمة القلم في الجواب. تكفي كلمة واحدة تحمل نهاية الأداة. ستتعلّم كيف تختار هذه الكلمة بحسب الجنس والعدد والحالة.","translation":"هل عندك قلم؟ – نعم، عندي واحد.","steps":[{"text":"حدّد الاسم الذي لا تريد تكراره","why":"الاسم هو `Parkplatz`، وهو مذكر ومفعول به في حالة `Akkusativ`، لذلك جاءت الأداة `einen`. هذه المعلومات الثلاث هي ما ستحمله الكلمة البديلة."},{"text":"احذف الاسم واترك الأداة وحدها بنهاية كاملة","why":"إذا وقف الضمير وحده أخذ نهاية الأداة المعرفة: `der` تصير `einer` و`das` تصير `eins`. هنا صار الضمير فاعلًا، فجاء في حالة `Nominativ`: `einer`."},{"text":"للنفي استعمل keiner وأخواتها","why":"تتصرف `kein-` كما تتصرف `ein-` تمامًا: `keiner` و`keine` و`keins` و`keinen` و`keinem`."},{"text":"في الجمع استعمل welche","why":"لا جمع لكلمة `ein`، لذلك نقول `welche` في الإثبات و`keine` في النفي. وفي حالة `Dativ` نقول `welchen` و`keinen`."},{"text":"للأشخاص: jemand و niemand","why":"حين تتكلم عن شخص غير معروف استعمل `jemand`، ونفيه `niemand`. في حالة `Akkusativ` تقول `jemanden` وفي `Dativ` تقول `jemandem`. وفي الكلام اليومي تُسمع أحيانًا الصيغة بلا نهاية."}],"explain":["يشبه الضمير غير المحدد أداة النكرة، لكنه يقف وحده. لذلك تظهر عليه نهاية تدل على الجنس والحالة حتى حيث تكون الأداة بلا نهاية: نقول `ein Stift` لكن `einer`، ونقول `ein Heft` لكن `eins` (وفي الكتابة الرسمية `eines`).","الكلمة `man` لا تتغيّر في حالة `Nominativ`، لكنها تصير `einen` في `Akkusativ` و`einem` في `Dativ`: `Das freut einen.` و`Das kann einem passieren.`"],"pitfall":"حين يقف الضمير دون اسم بعده يحتاج إلى نهاية كاملة. الكلمة `ein` وحدها لا تكفي للمذكر في حالة `Nominativ`.","recall":["لماذا نقول `Ich habe keins` حين نتكلم عن `das Auto`؟","لأن `das Auto` محايد، والضمير المحايد في `Nominativ` و`Akkusativ` هو `eins` أو `keins`."],"linkTitles":["الضمائر غير المحددة · grammis","jemand أم jemanden؟ · grammis"],"table":[["الحالة","مذكر","مؤنث","محايد","جمع"],["Nominativ","einer / keiner","eine / keine","eins / keins","welche / keine"],["Akkusativ","einen / keinen","eine / keine","eins / keins","welche / keine"],["Dativ","einem / keinem","einer / keiner","einem / keinem","welchen / keinen"]]},"de":{"title":"Indefinitpronomen im Nominativ, Akkusativ und Dativ","lead":"Auf die Frage „Hast du einen Stift?“ musst du das Nomen nicht wiederholen. Ein Wort mit der passenden Endung reicht. Du lernst, wie du dieses Wort nach Genus, Zahl und Kasus wählst.","steps":[{"text":"Finde das Nomen, das du nicht wiederholen willst","why":"Das Nomen ist `Parkplatz`: maskulin und Akkusativ, deshalb `einen`. Genau diese drei Informationen trägt später das Pronomen."},{"text":"Lass das Nomen weg und gib dem Artikelwort die volle Endung","why":"Ohne Nomen bekommt das Pronomen die Endung des bestimmten Artikels: aus `der` wird `einer`, aus `das` wird `eins`. Hier ist es Subjekt, also Nominativ: `einer`."},{"text":"Für die Verneinung nimmst du keiner und seine Formen","why":"`kein-` funktioniert genauso wie `ein-`: `keiner`, `keine`, `keins`, `keinen`, `keinem`."},{"text":"Im Plural heißt es welche","why":"Von `ein` gibt es keinen Plural. Deshalb sagst du `welche`, verneint `keine`, im Dativ `welchen` und `keinen`."},{"text":"Für Personen: jemand und niemand","why":"Für eine unbekannte Person nimmst du `jemand`, verneint `niemand`. Akkusativ: `jemanden`, Dativ: `jemandem`. In der gesprochenen Sprache hört man oft auch die Form ohne Endung."}],"explain":["Das Indefinitpronomen sieht aus wie der unbestimmte Artikel, steht aber allein. Deshalb zeigt es Genus und Kasus auch dort, wo der Artikel keine Endung hat: `ein Stift`, aber `einer`; `ein Heft`, aber `eins` (geschrieben auch `eines`).","`man` bleibt im Nominativ unverändert, wird aber im Akkusativ zu `einen` und im Dativ zu `einem`: `Das freut einen.`, `Das kann einem passieren.`"],"pitfall":"Ohne Nomen braucht das Pronomen die volle Endung. Für maskulin im Nominativ reicht `ein` nicht.","recall":["Warum heißt es `Ich habe keins`, wenn es um `das Auto` geht?","Weil `das Auto` ein Neutrum ist. Im Nominativ und Akkusativ heißt das Pronomen dann `eins` bzw. `keins`."],"linkTitles":["Indefinit-Pronomen · grammis","jemand oder jemanden? · grammis"],"table":[["Kasus","maskulin","feminin","neutral","Plural"],["Nominativ","einer / keiner","eine / keine","eins / keins","welche / keine"],["Akkusativ","einen / keinen","eine / keine","eins / keins","welche / keine"],["Dativ","einem / keinem","einer / keiner","einem / keinem","welchen / keinen"]]}},"questions":[{"id":"indefinitpronomen-1","type":"cloze","difficulty":1,"text":"Hast du ein Fahrrad? – Ja, ich habe {{1}}.","blanks":[["eins","eines"]],"i18n":{"ar":{"prompt":"أكمل بالضمير المناسب.","explain":"`das Fahrrad` محايد ومفعول به، لذلك نقول `eins`.","hints":["ما جنس كلمة `Fahrrad`؟"]},"de":{"prompt":"Ergänze das passende Pronomen.","explain":"`das Fahrrad` ist neutral und steht im Akkusativ: `eins`.","hints":["Welches Genus hat `Fahrrad`?"]}}},{"id":"indefinitpronomen-2","type":"cloze","difficulty":1,"text":"Gibt es hier noch Stühle? – Nein, hier gibt es {{1}} mehr.","blanks":[["keine"]],"i18n":{"ar":{"prompt":"أكمل بالنفي.","explain":"`Stühle` جمع، ونفي الجمع هو `keine`.","hints":["هل الكلمة مفرد أم جمع؟"]},"de":{"prompt":"Ergänze die Verneinung.","explain":"`Stühle` ist Plural. Verneint heißt es `keine`.","hints":["Singular oder Plural?"]}}},{"id":"indefinitpronomen-3","type":"mcq","difficulty":1,"options":["Ja, ich brauche eine.","Ja, ich brauche einen.","Ja, ich brauche eins."],"answer":0,"i18n":{"ar":{"prompt":"اختر الجواب الصحيح عن السؤال `Brauchst du eine Tasche?`","explain":"`die Tasche` مؤنث، فالضمير هو `eine`.","hints":["انظر إلى الأداة في السؤال."]},"de":{"prompt":"Wähle die richtige Antwort auf `Brauchst du eine Tasche?`","explain":"`die Tasche` ist feminin, also `eine`.","hints":["Schau auf den Artikel in der Frage."]}}},{"id":"indefinitpronomen-4","type":"cloze","difficulty":2,"text":"Ich habe keinen Kuli. Kannst du mir {{1}} leihen? – Tut mir leid, ich habe auch {{2}}.","blanks":[["einen"],["keinen"]],"i18n":{"ar":{"prompt":"أكمل الحوار بضميرين.","explain":"`der Kuli` مذكر ومفعول به في الجملتين، لذلك نقول `einen` ثم `keinen`.","hints":["الأداة في الجملة الأولى تكشف الجنس والحالة."]},"de":{"prompt":"Ergänze den Dialog mit zwei Pronomen.","explain":"`der Kuli` ist maskulin und in beiden Sätzen Akkusativ: `einen`, dann `keinen`.","hints":["Der Artikel im ersten Satz verrät Genus und Kasus."]}}},{"id":"indefinitpronomen-5","type":"cloze","difficulty":2,"text":"Kennst du hier {{1}}? – Nein, ich kenne {{2}}.","blanks":[["jemanden","jemand"],["niemanden","niemand"]],"i18n":{"ar":{"prompt":"أكمل بضميرين للأشخاص.","explain":"الفعل `kennen` يطلب `Akkusativ`: `jemanden` و`niemanden`. والصيغة بلا نهاية مقبولة في الكلام اليومي.","hints":["السؤال عن شخص غير معروف."]},"de":{"prompt":"Ergänze zwei Pronomen für Personen.","explain":"`kennen` verlangt den Akkusativ: `jemanden`, `niemanden`. Die Form ohne Endung ist umgangssprachlich auch üblich.","hints":["Es geht um eine unbekannte Person."]}}},{"id":"indefinitpronomen-6","type":"mcq","difficulty":2,"options":["Ich habe mit einem aus dem Kurs gesprochen.","Ich habe mit einen aus dem Kurs gesprochen.","Ich habe mit ein aus dem Kurs gesprochen."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟ المقصود: «تكلمت مع واحد من الدورة».","explain":"حرف الجر `mit` يطلب `Dativ`، والمذكر في `Dativ` هو `einem`.","hints":["أي حالة يطلبها `mit`؟"]},"de":{"prompt":"Welcher Satz ist richtig?","explain":"`mit` verlangt den Dativ. Maskulin im Dativ heißt `einem`.","hints":["Welchen Kasus verlangt `mit`?"]}}},{"id":"indefinitpronomen-7","type":"text","difficulty":3,"answer":"Nein, ich habe keine.","i18n":{"ar":{"prompt":"أجب بالنفي دون أن تكرر الاسم: `Hast du Geschwister?`","explain":"`Geschwister` جمع، ونفي الجمع `keine`.","hints":["في الجمع لا نستعمل `keins`."]},"de":{"prompt":"Antworte verneint, ohne das Nomen zu wiederholen: `Hast du Geschwister?`","explain":"`Geschwister` ist Plural. Verneint: `keine`.","hints":["Im Plural gibt es kein `keins`."]}}},{"id":"indefinitpronomen-8","type":"text","difficulty":3,"context":"Das ist ein von meinen Kollegen.","answer":"Das ist einer von meinen Kollegen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الضمير يقف وحده دون اسم، فيحتاج إلى النهاية الكاملة للمذكر في `Nominativ`: `einer`.","hints":["هل يأتي بعد الضمير اسم؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Das Pronomen steht ohne Nomen und braucht die volle Endung für maskulin im Nominativ: `einer`.","hints":["Folgt dem Pronomen ein Nomen?"]}}},{"id":"indefinitpronomen-9","type":"text","difficulty":2,"answer":"Ja, hier in der Nähe gibt es eine.","i18n":{"ar":{"prompt":"أجب بالإثبات دون تكرار الاسم: `Gibt es hier in der Nähe eine Apotheke?`","explain":"`die Apotheke` مؤنث، فالضمير هو `eine`.","hints":["انقل الأداة من السؤال إلى الجواب."]},"de":{"prompt":"Antworte bejahend, ohne das Nomen zu wiederholen: `Gibt es hier in der Nähe eine Apotheke?`","explain":"`die Apotheke` ist feminin, also `eine`.","hints":["Übernimm das Artikelwort aus der Frage."]}}}]},{"id":"irgend-pronomen","level":"B1.2","island":"pronomen","order":3,"prereqs":["irgendein"],"emoji":"🌫️","german":"Indefinitpronomen mit irgend-","source":{"lektion":12,"kind":"sample"},"pattern":["irgend","+","wann / wo / wie / wer / was"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","habe"],["mf","das"],["hl","irgendwo"],["ve","gelesen"]]},{"k":"main","parts":[["hl","Irgendwann"],["v","mache"],["mf","ich eine Weltreise"]]},{"k":"main","parts":[["hl","Irgendjemand"],["v","hat"],["mf","angerufen"]]}],"example":"Ich habe das irgendwo gelesen.","stepExamples":["Wo hast du das gelesen? – Ich weiß es nicht mehr genau.","Ich habe das irgendwo gelesen.","Irgendwann mache ich eine Weltreise.","Irgendjemand hat angerufen. · Irgendwas stimmt hier nicht.","Das finde ich irgendwie komisch."],"pitfallPair":"Ich habe das irgendwie im Internet gelesen. → Ich habe das irgendwo im Internet gelesen.","links":["https://grammis.ids-mannheim.de/progr%40mm/5310","https://www.dwds.de/wb/irgendwo"],"i18n":{"ar":{"title":"irgendwo و irgendwann وأخواتهما","lead":"تذكر أنك قرأت شيئًا، لكن لا تذكر أين. في الألمانية تضع `irgend-` قبل كلمة السؤال: `irgendwo` «في مكان ما»، و`irgendwann` «في وقت ما». هذه الكلمات شائعة جدًا في الكلام اليومي.","translation":"قرأتُ ذلك في مكان ما.","steps":[{"text":"ابدأ بشيء لا تعرفه بدقة","why":"السؤال `Wo?` ينتظر مكانًا، لكنك لا تعرفه. الكلمة `irgend-` تقول «لا أعرف بالضبط، ولا يهم كثيرًا»."},{"text":"irgend + wo = في مكان ما","why":"`irgendwo` تقف مكان ظرف المكان، فلا تغيّر ترتيب الجملة: `Ich habe das irgendwo gelesen.`"},{"text":"irgend + wann = في وقت ما","why":"`irgendwann` ظرف زمان. وفي أول الجملة يأتي الفعل بعدها مباشرة: `Irgendwann mache ich …`."},{"text":"للشخص والشيء: irgendwer و irgendwas","why":"`irgendwer` أو `irgendjemand` تعني «شخص ما»، و`irgendwas` أو `irgendetwas` تعني «شيء ما». وفي الكتابة الرسمية يُفضَّل `irgendjemand` و`irgendetwas`."},{"text":"irgendwie = بطريقة ما","why":"`irgendwie` تصف الطريقة، وفي الكلام تعني أيضًا «نوعًا ما»: `Das ist irgendwie seltsam.`"}],"explain":["كلمات `irgend-` لا تأخذ نهايات، إلا `irgendjemand` التي تُصرّف مثل `jemand`: `irgendjemanden` و`irgendjemandem`، وفي الكلام تبقى غالبًا بلا نهاية.","لا تخلط بين هذه الكلمات و`irgendein`: الأخيرة تقف قبل اسم وتأخذ نهايات الأداة (`irgendein Buch`)، أما `irgendwas` فتقف وحدها."],"pitfall":"`irgendwie` تصف الطريقة، و`irgendwo` تصف المكان. القراءة في الإنترنت مكان، فالصحيح `irgendwo`.","recall":["أي كلمة تكمل: `Ich habe meinen Schlüssel ___ verloren, aber ich weiß nicht, wo.`؟","`irgendwo`، لأن ما لا نعرفه هو المكان."],"linkTitles":["الضمائر غير المحددة · grammis","irgendwo في معجم DWDS"],"table":[["الكلمة","ماذا يبقى مجهولًا؟","مثال"],["irgendwann","الوقت","Ich rufe dich irgendwann an."],["irgendwo","المكان","Mein Handy ist irgendwo hier."],["irgendwie","الطريقة","Wir schaffen das irgendwie."],["irgendwer / irgendjemand","الشخص","Irgendjemand hat geklopft."],["irgendwas / irgendetwas","الشيء","Iss doch irgendwas!"]]},"de":{"title":"Indefinitpronomen mit irgend-","lead":"Du weißt, dass du etwas gelesen hast, aber nicht mehr, wo. Im Deutschen setzt du `irgend-` vor das Fragewort: `irgendwo`, `irgendwann`. Diese Wörter sind in der Umgangssprache sehr häufig.","steps":[{"text":"Beginne mit etwas Unbekanntem","why":"Die Frage `Wo?` erwartet einen Ort, aber du kennst ihn nicht. `irgend-` sagt: Ich weiß es nicht genau, und es ist nicht so wichtig."},{"text":"irgend + wo = an einem unbestimmten Ort","why":"`irgendwo` steht wie eine Ortsangabe und ändert die Wortstellung nicht: `Ich habe das irgendwo gelesen.`"},{"text":"irgend + wann = zu einer unbestimmten Zeit","why":"`irgendwann` ist eine Zeitangabe. Am Satzanfang folgt direkt das Verb: `Irgendwann mache ich …`."},{"text":"Für Person und Sache: irgendwer und irgendwas","why":"`irgendwer` oder `irgendjemand` heißt „eine unbestimmte Person“, `irgendwas` oder `irgendetwas` „eine unbestimmte Sache“. Geschrieben sind `irgendjemand` und `irgendetwas` üblicher."},{"text":"irgendwie = auf eine unbestimmte Art","why":"`irgendwie` beschreibt die Art und Weise und heißt umgangssprachlich auch „ein bisschen“: `Das ist irgendwie seltsam.`"}],"explain":["Die irgend-Wörter haben keine Endungen. Nur `irgendjemand` wird wie `jemand` dekliniert: `irgendjemanden`, `irgendjemandem` – gesprochen oft ohne Endung.","Verwechsle sie nicht mit `irgendein`: Es steht vor einem Nomen und hat Artikelendungen (`irgendein Buch`). `irgendwas` steht allein."],"pitfall":"`irgendwie` beschreibt die Art und Weise, `irgendwo` den Ort. Im Internet ist ein Ort, also `irgendwo`.","recall":["Was passt? `Ich habe meinen Schlüssel ___ verloren, aber ich weiß nicht, wo.`","`irgendwo`, denn unbekannt ist der Ort."],"linkTitles":["Indefinit-Pronomen · grammis","irgendwo im DWDS"],"table":[["Wort","Was ist unbestimmt?","Beispiel"],["irgendwann","die Zeit","Ich rufe dich irgendwann an."],["irgendwo","der Ort","Mein Handy ist irgendwo hier."],["irgendwie","die Art und Weise","Wir schaffen das irgendwie."],["irgendwer / irgendjemand","die Person","Irgendjemand hat geklopft."],["irgendwas / irgendetwas","die Sache","Iss doch irgendwas!"]]}},"questions":[{"id":"irgend-pronomen-1","type":"cloze","difficulty":1,"text":"Ich möchte {{1}} in Japan leben – vielleicht in zehn Jahren.","blanks":[["irgendwann"]],"i18n":{"ar":{"prompt":"أكمل بكلمة تعني «في وقت ما».","explain":"الوقت غير محدد: `irgendwann`.","hints":["`vielleicht in zehn Jahren` يتحدث عن الوقت."]},"de":{"prompt":"Ergänze das Wort für „zu einer unbestimmten Zeit“.","explain":"Die Zeit ist unbestimmt: `irgendwann`.","hints":["`vielleicht in zehn Jahren` nennt eine Zeit."]}}},{"id":"irgend-pronomen-2","type":"cloze","difficulty":1,"text":"Hat {{1}} meine Brille gesehen?","blanks":[["irgendjemand","irgendwer","jemand"]],"i18n":{"ar":{"prompt":"أكمل بكلمة تعني «أحد ما».","explain":"الشخص غير معروف: `irgendjemand` أو `irgendwer`.","hints":["السؤال عن شخص."]},"de":{"prompt":"Ergänze das Wort für „eine unbestimmte Person“.","explain":"Die Person ist unbekannt: `irgendjemand` oder `irgendwer`.","hints":["Gefragt wird nach einer Person."]}}},{"id":"irgend-pronomen-3","type":"mcq","difficulty":1,"options":["irgendwie","irgendwo","irgendwann"],"answer":0,"i18n":{"ar":{"prompt":"أي كلمة تكمل؟ `Ich weiß nicht wie, aber wir schaffen das ___.`","explain":"المجهول هو الطريقة: `irgendwie`.","hints":["`wie` = الطريقة."]},"de":{"prompt":"Was passt? `Ich weiß nicht wie, aber wir schaffen das ___.`","explain":"Unbekannt ist die Art und Weise: `irgendwie`.","hints":["`wie` = Art und Weise."]}}},{"id":"irgend-pronomen-4","type":"cloze","difficulty":2,"text":"Ich habe Hunger. Gibt es {{1}} zu essen? – Ja, {{2}} im Kühlschrank ist noch Käse.","blanks":[["irgendwas","irgendetwas","etwas"],["irgendwo"]],"i18n":{"ar":{"prompt":"أكمل بكلمتين من `irgend-`.","explain":"الأولى شيء غير محدد: `irgendwas`. والثانية مكان غير محدد داخل الثلاجة: `irgendwo`.","hints":["شيء ثم مكان."]},"de":{"prompt":"Ergänze zwei irgend-Wörter.","explain":"Erst eine unbestimmte Sache: `irgendwas`. Dann ein unbestimmter Ort: `irgendwo`.","hints":["Erst eine Sache, dann ein Ort."]}}},{"id":"irgend-pronomen-5","type":"order","difficulty":2,"items":["Irgendwann","werde","ich","das","verstehen."],"i18n":{"ar":{"prompt":"رتّب الجملة. ابدأ بـ `Irgendwann`.","explain":"`Irgendwann` في الموقع الأول، ثم الفعل `werde` ثم الفاعل، و`verstehen` في الآخر.","hints":["بعد الظرف يأتي الفعل."]},"de":{"prompt":"Ordne den Satz. Beginne mit `Irgendwann`.","explain":"`Irgendwann` auf Position 1, dann `werde`, dann das Subjekt, `verstehen` am Ende.","hints":["Nach der Zeitangabe kommt das Verb."]}}},{"id":"irgend-pronomen-6","type":"mcq","difficulty":2,"options":["Ich brauche irgendein Ladekabel.","Ich brauche irgendwas Ladekabel.","Ich brauche irgendwer Ladekabel."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة؟ تحتاج إلى أي سلك شحن، لا يهم أيّه.","explain":"قبل اسم نستعمل `irgendein` مع نهاية الأداة. أما `irgendwas` و`irgendwer` فتقفان وحدهما.","hints":["هل يأتي بعد الكلمة اسم؟"]},"de":{"prompt":"Welcher Satz ist richtig? Dir ist egal, welches Ladekabel.","explain":"Vor einem Nomen steht `irgendein` mit Artikelendung. `irgendwas` und `irgendwer` stehen allein.","hints":["Folgt ein Nomen?"]}}},{"id":"irgend-pronomen-7","type":"text","difficulty":3,"answer":"Irgendjemand hat mir das erzählt, aber ich weiß nicht mehr, wer.","i18n":{"ar":{"prompt":"اكتب أن شخصًا ما أخبرك بشيء، لكنك لا تذكر من هو. ابدأ بـ `Irgendjemand`.","explain":"مثال: `Irgendjemand hat mir das erzählt, aber ich weiß nicht mehr, wer.`","hints":["`Irgendjemand` فاعل مفرد."]},"de":{"prompt":"Schreib, dass dir jemand etwas erzählt hat, du aber nicht mehr weißt, wer. Beginne mit `Irgendjemand`.","explain":"Zum Beispiel: `Irgendjemand hat mir das erzählt, aber ich weiß nicht mehr, wer.`","hints":["`Irgendjemand` ist ein Subjekt im Singular."]}}},{"id":"irgend-pronomen-8","type":"text","difficulty":3,"context":"Ich habe das irgendwie im Internet gelesen.","answer":"Ich habe das irgendwo im Internet gelesen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"المجهول هو المكان في الإنترنت، لا الطريقة. فالصحيح `irgendwo`.","hints":["مكان أم طريقة؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Unbekannt ist der Ort im Internet, nicht die Art und Weise. Richtig ist `irgendwo`.","hints":["Ort oder Art und Weise?"]}}},{"id":"irgend-pronomen-9","type":"text","difficulty":2,"answer":"Irgendwann möchte ich in einem Haus am Meer wohnen.","i18n":{"ar":{"prompt":"اكتب حلمًا تريد تحقيقه يومًا ما. ابدأ بـ `Irgendwann`.","explain":"مثال: `Irgendwann möchte ich in einem Haus am Meer wohnen.`","hints":["بعد `Irgendwann` الفعل ثم الفاعل."]},"de":{"prompt":"Schreib einen Traum, den du irgendwann verwirklichen willst. Beginne mit `Irgendwann`.","explain":"Zum Beispiel: `Irgendwann möchte ich in einem Haus am Meer wohnen.`","hints":["Nach `Irgendwann`: Verb, dann Subjekt."]}}}]},{"id":"pronominaladverbien","level":"B1.1","island":"pronomen","order":4,"prereqs":[],"emoji":"💬","german":"Präpositionaladverbien","source":{"lektion":6,"kind":"toc"},"pattern":["da(r) + Präposition = Verweis","·","wo(r) + Präposition = Frage"],"frames":[{"k":"main","parts":[["vf","Worauf"],["v","wartest"],["mf","du"]]},{"k":"main","parts":[["vf","Ich"],["v","warte"],["hl","darauf"]]}],"example":"Worauf wartest du? – Ich warte darauf.","stepExamples":["warten auf · sprechen über · rechnen mit","da + mit → damit · wo + mit → womit","Worauf wartest du? · Auf wen wartest du?","Ich freue mich darauf, dass du kommst."],"pitfallPair":"Woüber sprecht ihr? → Worüber sprecht ihr?","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/kontrastive-grammatik/3885"],"i18n":{"ar":{"title":"الإحالة إلى شيء أو فكرة بـ da- وwo-","lead":"إذا كان الفعل مرتبطًا بحرف جر، يمكنك الرجوع إلى شيء ذكرته أو السؤال عنه بصيغة قصيرة مثل `darüber` أو `worauf`. حافظ على حرف الجر الأصلي حتى بعد دمجه.","translation":"ماذا تنتظر؟ – أنتظر ذلك.","steps":[{"text":"ابدأ من الفعل مع حرف الجر","why":"لكل تعبير حرف ينبغي حفظه. تستعمل `auf` مع `warten`، ولذلك يبقى `auf` ظاهرًا في `darauf` و`worauf`."},{"text":"ابنِ صيغة الإشارة أو السؤال","why":"تعود `da-` إلى شيء أو فكرة، وتستعمل `wo-` للسؤال عنه. قبل حرف جر يبدأ بحركة أضف `r`، مثل `darüber / worüber` و`darauf / worauf`."},{"text":"ميّز الشخص عن الشيء","why":"اسأل `worauf` عندما تقصد الحافلة مثلًا، و`auf wen` عندما تقصد شخصًا. وفي الجواب عن شخص تقول `Ich warte auf ihn` أو `auf sie`."},{"text":"مهّد لمعلومة تأتي في جملة","why":"تشير `darauf` إلى محتوى جملة `dass`. وتستطيع أن تمهّد لمجموعة مصدرية كما في `Sie denkt daran, die Bestellung zurückzuschicken`."}],"explain":["احفظ أيضًا `dafür / wofür` مع `für`، و`davon / wovon` مع `von`، و`daran / woran` مع `an`. قارن `Ich freue mich darauf` لأمر منتظر و`Ich freue mich darüber` للتعبير عن الفرح بأمر حاصل أو معلوم. وإذا تقدمت الصيغة إلى الموقع الأول في الرئيسية جاء الفعل بعدها، مثل `Darüber sprechen wir morgen`."],"pitfall":"تحتاج `r` لأن `über` يبدأ بصوت علّة. وإذا سألت عن شخص فقل `Über wen sprecht ihr?`.","recall":["كيف تشير إلى خطة السفر في `Wir sprechen über die Reise`؟","`Wir sprechen darüber.` أبقِ `über` بعد `dar-`."],"linkTitles":["فهرس قواعد الوحدة 6 · telc، ص 3","حلول الكتاب الرسمية · telc","ظروف حروف الجر · grammis"],"table":[["حرف الجر","السؤال عن شيء","الإحالة إلى شيء"],["mit","womit","damit"],["für","wofür","dafür"],["von","wovon","davon"],["auf","worauf","darauf"],["über","worüber","darüber"],["an","woran","daran"]]},"de":{"title":"Präpositionaladverbien mit da- und wo-","lead":"Gehört zum Verb eine Präposition, kannst du mit einer kurzen Form wie `darüber` oder `worauf` auf etwas Genanntes verweisen oder danach fragen. Die ursprüngliche Präposition bleibt dabei erhalten.","steps":[{"text":"Beginne mit Verb + Präposition","why":"Jeder Ausdruck hat eine Präposition, die man lernen muss. Zu `warten` gehört `auf`, deshalb bleibt `auf` in `darauf` und `worauf` sichtbar."},{"text":"Bilde die Verweis- oder Frageform","why":"`da-` verweist auf eine Sache oder Idee, mit `wo-` fragst du danach. Vor einer Präposition, die mit einem Vokal beginnt, kommt ein `r` dazu: `darüber / worüber`, `darauf / worauf`."},{"text":"Unterscheide Person und Sache","why":"Frag `worauf`, wenn du z. B. den Bus meinst, und `auf wen`, wenn du eine Person meinst. In der Antwort über eine Person sagst du `Ich warte auf ihn` oder `auf sie`."},{"text":"Kündige eine Information in einem Satz an","why":"`darauf` verweist auf den Inhalt eines `dass`-Satzes. Es kann auch eine Infinitivgruppe ankündigen: `Sie denkt daran, die Bestellung zurückzuschicken`."}],"explain":["Lern auch `dafür / wofür` mit `für`, `davon / wovon` mit `von` und `daran / woran` mit `an`. Vergleiche `Ich freue mich darauf` (etwas Kommendes) mit `Ich freue mich darüber` (Freude über etwas, das schon da oder bekannt ist). Steht die Form auf Position 1 im Hauptsatz, folgt danach das Verb: `Darüber sprechen wir morgen`."],"pitfall":"Du brauchst ein `r`, weil `über` mit einem Vokal beginnt. Fragst du nach einer Person, sag `Über wen sprecht ihr?`.","recall":["Wie verweist du auf die Reise in `Wir sprechen über die Reise`?","`Wir sprechen darüber.` Behalte `über` nach `dar-`."],"linkTitles":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Präpositionaladverbien · grammis"],"table":[["Präposition","Frage nach einer Sache","Verweis auf eine Sache"],["mit","womit","damit"],["für","wofür","dafür"],["von","wovon","davon"],["auf","worauf","darauf"],["über","worüber","darüber"],["an","woran","daran"]]}},"questions":[{"id":"pronominaladverbien-1","type":"cloze","difficulty":1,"text":"Worauf wartest du? – Ich warte {{1}}.","blanks":[["darauf"]],"i18n":{"ar":{"prompt":"أكمل جواب السؤال عن الحافلة.","explain":"dar + auf يعطي darauf.","hints":["حوّل wo- إلى صيغة إحالة واحتفظ بـ auf."]},"de":{"prompt":"Ergänze die Antwort auf die Frage nach dem Bus.","explain":"`dar` + `auf` ergibt `darauf`.","hints":["Mach aus `wo-` eine Verweisform und behalte `auf`."]}}},{"id":"pronominaladverbien-2","type":"cloze","difficulty":1,"text":"{{1}} sprecht ihr? (über)","blanks":[["Worüber"]],"i18n":{"ar":{"prompt":"اسأل عمّا يتحدثون عنه.","explain":"wo + r + über يعطي Worüber.","hints":["أضف r قبل حرف الجر المبدوء بحركة."]},"de":{"prompt":"Frag, worüber sie sprechen.","explain":"`wo` + `r` + `über` ergibt `Worüber`.","hints":["Setz ein `r` vor eine Präposition, die mit einem Vokal beginnt."]}}},{"id":"pronominaladverbien-3","type":"mcq","difficulty":1,"options":["Auf wen wartet ihr?","Worauf wartet ihr?","Womit wartet ihr?"],"answer":0,"i18n":{"ar":{"prompt":"أي سؤال تسأله عن شخص ينتظرونه؟","explain":"auf wen للسؤال عن شخص. worauf عن شيء، وwomit يسأل بحرف mit.","hints":["للسؤال عن شخص استعمل ضمير استفهام مع الحرف."]},"de":{"prompt":"Mit welcher Frage fragst du nach einer Person, auf die sie warten?","explain":"`auf wen` fragt nach einer Person, `worauf` nach einer Sache; `womit` benutzt die Präposition `mit`.","hints":["Für Personen: Präposition + Fragepronomen."]}}},{"id":"pronominaladverbien-4","type":"cloze","difficulty":2,"text":"Wir rechnen {{1}}, dass es regnet. · Sie denkt {{2}}, das Paket zurückzuschicken. (mit / an)","blanks":[["damit"],["daran"]],"i18n":{"ar":{"prompt":"أكمل صيغتي الإحالة.","explain":"mit يبدأ بصامت، لذا damit. an يبدأ بحركة، لذا daran.","hints":["مع الحرف الذي يبدأ بحركة أضف r."]},"de":{"prompt":"Ergänze beide Verweisformen.","explain":"`mit` beginnt mit einem Konsonanten, also `damit`. `an` beginnt mit einem Vokal, also `daran`.","hints":["Bei einer Präposition mit Vokal am Anfang kommt ein `r` dazu."]}}},{"id":"pronominaladverbien-5","type":"mcq","difficulty":2,"options":["Ich freue mich darüber.","Ich freue mich darauf.","Ich freue mich damit."],"answer":0,"i18n":{"ar":{"prompt":"اختر الصيغة التي ترجع إلى خبر أسعدك بالفعل.","explain":"sich über etwas freuen يعطي darüber. darauf يعبّر عادةً عن التطلّع، وdamit يحافظ على حرف غير مناسب هنا.","hints":["ميّز السرور بحدث قائم عن ترقّب أمر آتٍ."]},"de":{"prompt":"Wähle die Form, die auf eine Nachricht verweist, über die du dich schon gefreut hast.","explain":"`sich über etwas freuen` ergibt `darüber`. `darauf` drückt meist Vorfreude aus, und `damit` hat hier die falsche Präposition.","hints":["Unterscheide Freude über etwas Bestehendes und Vorfreude auf etwas Kommendes."]}}},{"id":"pronominaladverbien-6","type":"order","difficulty":2,"items":["Darüber","sprechen","wir","morgen."],"i18n":{"ar":{"prompt":"رتّب الجواب وابدأ بالإحالة إلى موضوع الحديث، ثم الفعل.","explain":"Darüber تأتي قبل الفعل في الرئيسية، لذلك يأتي sprechen قبل wir.","hints":["إذا تقدمت عبارة الإحالة فإنها تشغل الموقع الأول."]},"de":{"prompt":"Ordne die Antwort und beginne mit dem Verweis auf das Gesprächsthema, dann das Verb.","explain":"`Darüber` steht vor dem Verb im Hauptsatz, deshalb kommt `sprechen` vor `wir`.","hints":["Steht der Verweis vorne, besetzt er Position 1."]}}},{"id":"pronominaladverbien-7","type":"text","difficulty":3,"answer":"Ich interessiere mich dafür. Wofür interessierst du dich?","i18n":{"ar":{"prompt":"حوّل Ich interessiere mich für den Kurs إلى إحالة على شيء مذكور، ثم اكتب سؤالًا عن الشيء.","explain":"für يبدأ بصامت، لذلك نكتب dafür وwofür بلا r إضافية. يتغير الضمير الانعكاسي مع المخاطب.","hints":["حافظ على für في الإشارة والسؤال."]},"de":{"prompt":"Mach aus `Ich interessiere mich für den Kurs` einen Verweis auf eine genannte Sache und schreib dann eine Frage nach der Sache.","explain":"`für` beginnt mit einem Konsonanten, deshalb schreiben wir `dafür` und `wofür` ohne zusätzliches `r`. Das Reflexivpronomen ändert sich mit der angesprochenen Person.","hints":["Behalte `für` im Verweis und in der Frage."]}}},{"id":"pronominaladverbien-8","type":"text","difficulty":3,"answer":"Worüber sprecht ihr?","context":"Woüber sprecht ihr?","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"تحتاج `r` لأن `über` يبدأ بصوت علّة. وإذا سألت عن شخص فقل `Über wen sprecht ihr?`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Du brauchst ein `r`, weil `über` mit einem Vokal beginnt. Fragst du nach einer Person, sag `Über wen sprecht ihr?`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"pronominaladverbien-9","type":"text","difficulty":2,"answer":"`Wir sprechen darüber.` أبقِ `über` بعد `dar-`.","i18n":{"ar":{"prompt":"كيف تشير إلى خطة السفر في `Wir sprechen über die Reise`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wie verweist du auf die Reise in `Wir sprechen über die Reise`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"relativ-dativ","level":"B1.1","island":"relativsaetze","order":1,"prereqs":[],"emoji":"🧩","german":"Relativpronomen und Relativsätze im Dativ","source":{"lektion":1,"kind":"toc"},"pattern":["Nomen",",","dem · der · dem · denen","…","Verb",","],"frames":[{"k":"main","parts":[["vf","Der Mann, dem ich helfe,"],["v","wohnt"],["mf","nebenan"]]},{"k":"rel","parts":[["c","dem"],["mf","ich"],["ve","helfe"]]}],"example":"Der Mann, dem ich helfe, wohnt nebenan.","stepExamples":["Der Mann wohnt nebenan. Ich helfe dem Mann.","Maskulin: dem · Feminin: der · Neutrum: dem · Plural: denen","Der Mann, dem ich helfe, wohnt nebenan.","Ich besuche die Nachbarin, der ich oft helfe."],"pitfallPair":"Das sind die Leute, den ich danke. → Das sind die Leute, denen ich danke.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/5272"],"i18n":{"ar":{"title":"ضمائر الوصل في الداتيف","lead":"جملة الوصل تضيف معلومة إلى اسم سبق ذكره. حين يكون دور ذلك الاسم داخل الوصل في حالة الداتيف، تختار ضميرًا من `dem، der، denen`.","translation":"الرجل الذي أساعده يسكن في البيت المجاور.","steps":[{"text":"افصل الجملتين","why":"الاسم المرجعي هو `der Mann`. في الجملة الثانية يطلب الفعل `helfen` داتيف. اسأل `Wem helfe ich?` لتتعرف على الوظيفة."},{"text":"اختر الضمير من الجنس والعدد","why":"الجنس والعدد يأتيان من الاسم المرجعي. الحالة تأتي من موقع الضمير داخل جملة الوصل. انتبه إلى أن صيغة ضمير الوصل للجمع هنا `denen` حتى حين تبدأ مجموعة اسمية في الداتيف بـ `den`."},{"text":"رتّب الوصل بعد الاسم","why":"حلّ الضمير محل الاسم المكرر. جاء في أول الوصل وانتقل `helfe` إلى آخره. ظل `wohnt` فعل الجملة الرئيسية."},{"text":"اختبر استقلال الحالتين","why":"في الرئيسية `die Nachbarin` مفعول `besuchen` في الأكوزاتيف. في الوصل `der` داتيف مع `helfen`. تغيير وظيفة الاسم خارج الوصل لا يغيّر الوظيفة التي يحددها فعل الوصل."}],"explain":["استعمل الطريقة نفسها مع `danken` (يشكر)، و`vertrauen` (يثق)، و`antworten` (يجيب)، و`gefallen` (يروق). قارن `die Frau, die mich besucht` حيث `die` فاعل، و`die Frau, die ich besuche` حيث `die` مفعول مباشر، و`die Frau, der ich helfe` حيث `der` داتيف."],"pitfall":"لجمع الأشخاص مع `danken` نحتاج داتيف الجمع لضمير الوصل، أي `denen`.","recall":["ما صيغة الداتيف مع `das Kind`؟","نختار `dem` لأن `Kind` محايد، مثل `das Kind, dem ich antworte`."],"linkTitles":["فهرس قواعد الوحدة 1 · telc، ص 2","حلول الكتاب الرسمية · telc","أدوات جمل الوصل · grammis"],"table":[["الحالة","مذكر","مؤنث","محايد","جمع"],["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","denen"]]},"de":{"title":"Relativpronomen im Dativ","lead":"Ein Relativsatz gibt mehr Informationen über ein Nomen, das schon genannt wurde. Hat dieses Nomen im Relativsatz die Rolle eines Dativs, wählst du eines der Pronomen `dem`, `der`, `denen`.","steps":[{"text":"Trenne die beiden Sätze","why":"Das Bezugswort ist `der Mann`. Im zweiten Satz verlangt `helfen` den Dativ. Frag `Wem helfe ich?`, um die Funktion zu erkennen."},{"text":"Wähle das Pronomen nach Genus und Numerus","why":"Genus und Numerus kommen vom Bezugswort, der Kasus von der Rolle des Pronomens im Relativsatz. Achtung: Im Plural heißt das Relativpronomen `denen`, auch wenn der Dativartikel im Plural `den` ist."},{"text":"Stell den Relativsatz hinter das Nomen","why":"Das Pronomen ersetzt das wiederholte Nomen. Es steht am Anfang des Relativsatzes, `helfe` geht ans Ende. `wohnt` bleibt das Verb des Hauptsatzes."},{"text":"Prüfe, dass beide Kasus unabhängig sind","why":"Im Hauptsatz ist `die Nachbarin` Akkusativobjekt von `besuchen`. Im Relativsatz steht `der` im Dativ wegen `helfen`. Die Funktion außerhalb ändert nichts am Kasus, den das Verb im Relativsatz verlangt."}],"explain":["Geh genauso mit `danken`, `vertrauen`, `antworten` und `gefallen` vor. Vergleiche: `die Frau, die mich besucht` (`die` = Subjekt), `die Frau, die ich besuche` (`die` = Akkusativobjekt) und `die Frau, der ich helfe` (`der` = Dativ)."],"pitfall":"Bei Personen im Plural brauchen wir mit `danken` das Relativpronomen im Dativ Plural, also `denen`.","recall":["Wie lautet der Dativ bei `das Kind`?","`dem`, weil `Kind` neutral ist, z. B. `das Kind, dem ich antworte`."],"linkTitles":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"],"table":[["Kasus","Maskulin","Feminin","Neutrum","Plural"],["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","denen"]]}},"questions":[{"id":"relativ-dativ-1","type":"cloze","difficulty":1,"text":"Das ist der Kollege, {{1}} ich danke.","blanks":[["dem"]],"i18n":{"ar":{"prompt":"أكمل ضمير الوصل للمذكر.","explain":"danken يطلب الداتيف. المذكر المفرد في داتيف الوصل dem.","hints":["اسأل Wem danke ich?"]},"de":{"prompt":"Ergänze das Relativpronomen für ein maskulines Nomen.","explain":"`danken` verlangt den Dativ. Maskulin Singular im Dativ: `dem`.","hints":["Frag: Wem danke ich?"]}}},{"id":"relativ-dativ-2","type":"cloze","difficulty":1,"text":"Die Freundin, {{1}} ich vertraue, wohnt hier.","blanks":[["der"]],"i18n":{"ar":{"prompt":"أكمل ضمير الوصل للمؤنث.","explain":"vertrauen يطلب الداتيف. die Freundin مؤنث، فيكون الضمير der.","hints":["حدّد الجنس ثم فكّر في الفعل vertrauen."]},"de":{"prompt":"Ergänze das Relativpronomen für ein feminines Nomen.","explain":"`vertrauen` verlangt den Dativ. `die Freundin` ist feminin, also `der`.","hints":["Bestimme das Genus und denk an das Verb `vertrauen`."]}}},{"id":"relativ-dativ-3","type":"mcq","difficulty":1,"options":["denen","den","dem"],"answer":0,"i18n":{"ar":{"prompt":"ما ضمير داتيف الوصل لجمع die Kinder؟","explain":"den أداة الداتيف للجمع، وdem ضمير للمذكر أو المحايد المفرد، أما denen فهو ضمير الوصل في داتيف الجمع.","hints":["فكّر في صيغة الوصل الخاصة بالجمع."]},"de":{"prompt":"Wie lautet das Relativpronomen im Dativ für den Plural `die Kinder`?","explain":"`den` ist der Dativartikel im Plural, `dem` das Pronomen für Maskulin oder Neutrum Singular. `denen` ist das Relativpronomen im Dativ Plural.","hints":["Denk an die besondere Pluralform des Relativpronomens."]}}},{"id":"relativ-dativ-4","type":"cloze","difficulty":2,"text":"Das ist das Kind, {{1}} ich morgen {{2}}.","blanks":[["dem"],["antworte"]],"i18n":{"ar":{"prompt":"أكمل الضمير ثم اكتب الفعل المصرف من antworten.","explain":"Kind محايد وantworten يطلب الداتيف. يبقى الفعل في آخر الوصل.","hints":["حدد الجنس والحالة أولًا، ثم صرّف مع ich."]},"de":{"prompt":"Ergänze das Pronomen und dann die konjugierte Form von `antworten`.","explain":"`Kind` ist neutral und `antworten` verlangt den Dativ. Das Verb steht am Ende des Relativsatzes.","hints":["Bestimme erst Genus und Kasus, dann konjugiere mit `ich`."]}}},{"id":"relativ-dativ-5","type":"order","difficulty":2,"items":["denen","er","oft","geholfen","hat"],"i18n":{"ar":{"prompt":"رتّب الوصل بعد die Personen. اجعل er بعد الضمير، وoft قبل اسم المفعول.","explain":"denen يشير إلى جمع في الداتيف. ينتهي الوصل بـ geholfen hat.","hints":["ضع المساعد المصرف بعد اسم المفعول."]},"de":{"prompt":"Ordne den Relativsatz nach `die Personen`. Setz `er` nach das Pronomen und `oft` vor das Partizip.","explain":"`denen` verweist auf einen Plural im Dativ. Der Relativsatz endet mit `geholfen hat`.","hints":["Setz das konjugierte Hilfsverb nach das Partizip."]}}},{"id":"relativ-dativ-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"في Ich kenne die Frau, der er hilft ما الذي حدّد der؟","explain":"helfen يطلب الداتيف. في الرئيسية المرأة مفعول، وحالة ذلك المفعول مستقلة عن حالة ضمير الوصل.","hints":["احسب الحالة من وظيفة الاسم في جملة الوصل."],"options":["الفعل hilft داخل الوصل والجنس المؤنث للاسم المرجعي.","الفعل kenne خارج الوصل والجنس المؤنث للاسم المرجعي.","كون المرأة فاعلًا في الجملة الرئيسية."]},"de":{"prompt":"Was bestimmt `der` in `Ich kenne die Frau, der er hilft`?","explain":"`helfen` verlangt den Dativ. Im Hauptsatz ist die Frau Objekt, aber ihr Kasus dort ist unabhängig vom Kasus des Relativpronomens.","hints":["Bestimme den Kasus aus der Funktion im Relativsatz."],"options":["Das Verb `hilft` im Relativsatz und das feminine Genus des Bezugsworts.","Das Verb `kenne` außerhalb des Relativsatzes und das feminine Genus des Bezugsworts.","Dass die Frau im Hauptsatz das Subjekt ist."]}}},{"id":"relativ-dativ-7","type":"text","difficulty":3,"answer":"Ich kenne die Nachbarn, denen ich geholfen habe.","i18n":{"ar":{"prompt":"اربط الجملتين بضمير وصل. ضع الوصل بعد die Nachbarn. Ich kenne die Nachbarn. Ich habe den Nachbarn geholfen.","explain":"استخدم denen للجمع في الداتيف، واختتم التابعة بالفعل المصرف habe.","hints":["هل الفعل الثاني يأخذ داتيفًا؟ وأين يأتي habe؟"]},"de":{"prompt":"Verbinde die Sätze mit einem Relativpronomen. Stell den Relativsatz nach `die Nachbarn`: `Ich kenne die Nachbarn. Ich habe den Nachbarn geholfen.`","explain":"Benutze `denen` für den Dativ Plural und beende den Nebensatz mit dem konjugierten Verb `habe`.","hints":["Verlangt das zweite Verb einen Dativ? Und wo steht `habe`?"]}}},{"id":"relativ-dativ-8","type":"text","difficulty":3,"answer":"Das sind die Leute, denen ich danke.","context":"Das sind die Leute, den ich danke.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"لجمع الأشخاص مع `danken` نحتاج داتيف الجمع لضمير الوصل، أي `denen`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Bei Personen im Plural brauchen wir mit `danken` das Relativpronomen im Dativ Plural, also `denen`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"relativ-dativ-9","type":"text","difficulty":2,"answer":"نختار `dem` لأن `Kind` محايد، مثل `das Kind, dem ich antworte`.","i18n":{"ar":{"prompt":"ما صيغة الداتيف مع `das Kind`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wie lautet der Dativ bei `das Kind`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"relativ-praep","level":"B1.1","island":"relativsaetze","order":2,"prereqs":["relativ-dativ"],"emoji":"🔗","german":"Relativsätze mit Präpositionen","source":{"lektion":1,"kind":"toc"},"pattern":["Präposition","+","Relativpronomen","…","Verb"],"frames":[{"k":"main","parts":[["vf","Das"],["v","ist"],["mf","der Bus, auf den wir warten"]]},{"k":"rel","parts":[["c","auf den"],["mf","wir"],["ve","warten"]]}],"example":"Das ist der Bus, auf den wir warten.","stepExamples":["Wir warten auf den Bus.","…, auf den wir warten.","Das ist die Frau, mit der ich arbeite.","der Tisch, an dem wir sitzen · der Tisch, an den wir den Stuhl stellen"],"pitfallPair":"Das ist die Person, der ich mit arbeite. → Das ist die Person, mit der ich arbeite.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/progr%40mm/5272"],"i18n":{"ar":{"title":"جملة الوصل مع حرف جر","lead":"إذا كان الفعل مرتبطًا بحرف جر مثل `warten auf`، احتفظ بالحرف حين تحوّل الاسم إلى ضمير وصل. الحرف والضمير يبدآن الجملة التابعة معًا.","translation":"هذه هي الحافلة التي ننتظرها.","steps":[{"text":"استرجع الجملة القصيرة","why":"احفظ التعبير كاملًا. هنا `auf` مع `warten` يطلب الأكوزاتيف. لذلك تكتب `den` للمذكر."},{"text":"استبدل الاسم وانقل المجموعة","why":"انتقل حرف الجر مع الضمير إلى البداية. وضع الفعل `warten` في النهاية يحافظ على ترتيب الوصل."},{"text":"قارن بحرف ثابت الداتيف","why":"حرف `mit` يأخذ الداتيف دائمًا. الاسم المرجعي مؤنث، فتصبح المجموعة `mit der`. ومع الجمع تقول `mit denen`."},{"text":"افحص المكان والاتجاه إذا كان الحرف مكانيًا","why":"الجلوس يصف موقعًا ثابتًا فيستعمل `an dem`. وضع الكرسي عند الطاولة يحدد وجهة الحركة فيستعمل `an den`."}],"explain":["اقرأ الجملة التابعة بمفردها قبل اختيار الضمير. في `Das ist das Thema, über das wir sprechen` تختار `über das` لأن `sprechen über` يأخذ الأكوزاتيف و`Thema` محايد. في `Das sind die Bücher, aus denen ich lerne` يحدد `aus` الداتيف ويحدد الجمع صيغة `denen`. الصيغ `im` و`am` تختصر حرف الجر مع الأداة، أما في الوصل فقل `in dem` و`an dem` لكي يبقى ضمير الوصل ظاهرًا."],"pitfall":"تنتقل المجموعة `mit der` كوحدة واحدة إلى بداية الجملة.","recall":["ماذا تقول مع `für` و`die Projekte`؟","`für die`، لأن `für` يأخذ الأكوزاتيف وصيغة جمع الوصل فيه `die`."],"linkTitles":["فهرس قواعد الوحدة 1 · telc، ص 2","حلول الكتاب الرسمية · telc","أدوات جمل الوصل · grammis"]},"de":{"title":"Relativsätze mit Präposition","lead":"Gehört zum Verb eine feste Präposition wie bei `warten auf`, bleibt die Präposition erhalten, wenn das Nomen zum Relativpronomen wird. Präposition und Pronomen eröffnen den Nebensatz gemeinsam.","steps":[{"text":"Erinnere dich an den kurzen Satz","why":"Lerne den Ausdruck als Ganzes. `warten auf` verlangt den Akkusativ, deshalb schreibst du beim Maskulinum `den`."},{"text":"Ersetze das Nomen und verschiebe die Gruppe","why":"Die Präposition wandert zusammen mit dem Pronomen an den Anfang. `warten` steht am Ende – so bleibt die Wortstellung des Relativsatzes erhalten."},{"text":"Vergleiche mit einer Dativ-Präposition","why":"`mit` steht immer mit Dativ. Das Bezugswort ist feminin, also `mit der`. Im Plural sagst du `mit denen`."},{"text":"Prüfe Ort und Richtung bei Wechselpräpositionen","why":"Sitzen beschreibt einen festen Ort, deshalb `an dem`. Den Stuhl an den Tisch stellen gibt eine Richtung an, deshalb `an den`."}],"explain":["Lies den Nebensatz für sich, bevor du das Pronomen wählst. In `Das ist das Thema, über das wir sprechen` wählst du `über das`, weil `sprechen über` den Akkusativ verlangt und `Thema` neutral ist. In `Das sind die Bücher, aus denen ich lerne` bestimmt `aus` den Dativ und der Plural die Form `denen`. `im` und `am` sind Verschmelzungen aus Präposition und Artikel – im Relativsatz sagst du `in dem` und `an dem`, damit das Relativpronomen sichtbar bleibt."],"pitfall":"Die Gruppe `mit der` wandert als Einheit an den Anfang des Nebensatzes.","recall":["Was sagst du mit `für` und `die Projekte`?","`für die`, weil `für` den Akkusativ verlangt und das Relativpronomen im Plural dort `die` lautet."],"linkTitles":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Relativpronomen · grammis"]}},"questions":[{"id":"relativ-praep-1","type":"cloze","difficulty":1,"text":"Das ist der Mann, {{1}} ich arbeite.","blanks":[["mit dem"]],"i18n":{"ar":{"prompt":"أكمل المجموعة المبدوءة بـ mit.","explain":"مع المذكر في الداتيف تقول mit dem.","hints":["mit يطلب حالة ثابتة."]},"de":{"prompt":"Ergänze die Gruppe mit `mit`.","explain":"Maskulin im Dativ: `mit dem`.","hints":["`mit` verlangt immer denselben Kasus."]}}},{"id":"relativ-praep-2","type":"cloze","difficulty":1,"text":"Das ist die Firma, {{1}} ich arbeite.","blanks":[["für die"]],"i18n":{"ar":{"prompt":"أكمل المجموعة المبدوءة بـ für.","explain":"für يطلب الأكوزاتيف. صيغة المؤنث هي die.","hints":["فكّر في صيغة أكوزاتيف المؤنث."]},"de":{"prompt":"Ergänze die Gruppe mit `für`.","explain":"`für` verlangt den Akkusativ. Die feminine Form ist `die`.","hints":["Denk an den Akkusativ feminin."]}}},{"id":"relativ-praep-3","type":"mcq","difficulty":1,"options":["auf","mit","über"],"answer":0,"i18n":{"ar":{"prompt":"أيّ حرف يلائم الفعل warten عند الحديث عن انتظار القطار؟","explain":"نقول auf den Zug warten. لذلك تبدأ جملة الوصل بـ auf den.","hints":["تذكّر الحرف الملازم للفعل warten في هذا التعبير."]},"de":{"prompt":"Welche Präposition passt zu `warten`, wenn man auf den Zug wartet?","explain":"Man sagt `auf den Zug warten`. Deshalb beginnt der Relativsatz mit `auf den`.","hints":["Erinnere dich an die feste Präposition von `warten`."]}}},{"id":"relativ-praep-4","type":"cloze","difficulty":2,"text":"Das ist der Schrank, {{1}} die Gläser stehen und {{2}} ich die Tassen stelle.","blanks":[["in dem"],["in den"]],"i18n":{"ar":{"prompt":"أكمل المكان الثابت ثم الوجهة.","explain":"stehen يدل على مكان ثابت فيأخذ الداتيف مع in. stellen هنا اتجاه إلى داخل الخزانة فيأخذ الأكوزاتيف.","hints":["ميّز مكان الأشياء عن وجهة وضعها."]},"de":{"prompt":"Ergänze zuerst den festen Ort, dann die Richtung.","explain":"`stehen` beschreibt einen festen Ort, also Dativ mit `in`. `stellen` gibt hier die Richtung in den Schrank an, also Akkusativ.","hints":["Unterscheide, wo etwas ist und wohin man es stellt."]}}},{"id":"relativ-praep-5","type":"order","difficulty":2,"items":["über das","wir","gestern","gesprochen","haben"],"i18n":{"ar":{"prompt":"رتّب الوصل بعد das Thema. ضع الفاعل قبل gestern.","explain":"sprechen über يطلب Akkusativ هنا، وThema محايد. المساعد المصرف في الآخر.","hints":["ابدأ بحرف الجر والضمير كوحدة."]},"de":{"prompt":"Ordne den Relativsatz nach `das Thema`. Setz das Subjekt vor `gestern`.","explain":"`sprechen über` verlangt hier den Akkusativ, und `Thema` ist neutral. Das konjugierte Hilfsverb steht am Ende.","hints":["Beginne mit Präposition und Pronomen als Einheit."]}}},{"id":"relativ-praep-6","type":"mcq","difficulty":2,"options":["die Bücher, aus denen wir lernen","die Bücher, aus den wir lernen","die Bücher, denen wir aus lernen"],"answer":0,"i18n":{"ar":{"prompt":"اختر جملة الوصل الصحيحة للجملة Wir lernen aus den Büchern.","explain":"aus يطلب الداتيف. den أداة الجمع وليست صيغة ضمير الوصل هنا، وموضع aus قبل denen.","hints":["ضمير الوصل في داتيف الجمع له شكل خاص. ضع حرف الجر قبله."]},"de":{"prompt":"Wähle den richtigen Relativsatz zu `Wir lernen aus den Büchern.`","explain":"`aus` verlangt den Dativ. `den` ist der Pluralartikel, nicht das Relativpronomen, und `aus` steht vor `denen`.","hints":["Das Relativpronomen im Dativ Plural hat eine besondere Form. Setz die Präposition davor."]}}},{"id":"relativ-praep-7","type":"text","difficulty":3,"answer":"Der Zug, auf den wir warten, hat Verspätung.","i18n":{"ar":{"prompt":"ادمج الجملتين. Der Zug hat Verspätung. Wir warten auf den Zug.","explain":"auf den للمذكر في الأكوزاتيف مع warten auf. يوضع warten آخر الوصل ثم تستأنف الرئيسية بـ hat.","hints":["حافظ على حرف الجر، وأدرج الوصل بين فاصلتين."]},"de":{"prompt":"Verbinde die Sätze: `Der Zug hat Verspätung. Wir warten auf den Zug.`","explain":"`auf den` für Maskulin Akkusativ mit `warten auf`. `warten` steht am Ende des Relativsatzes, dann geht der Hauptsatz mit `hat` weiter.","hints":["Behalte die Präposition und setz den Relativsatz zwischen zwei Kommas."]}}},{"id":"relativ-praep-8","type":"text","difficulty":3,"answer":"Das ist die Person, mit der ich arbeite.","context":"Das ist die Person, der ich mit arbeite.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"تنتقل المجموعة `mit der` كوحدة واحدة إلى بداية الجملة.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Die Gruppe `mit der` wandert als Einheit an den Anfang des Nebensatzes."
