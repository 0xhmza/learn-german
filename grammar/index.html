aren wir am Strand.`","hints":["Nach `Trotzdem`: Verb, dann Subjekt."]}}}]},{"id":"waehrend-adversativ","level":"B1.2","island":"gegensatz-vergleich","order":3,"prereqs":["seit-waehrend"],"emoji":"↔️","german":"Adversative Nebensätze mit während","source":{"lektion":11,"kind":"toc"},"pattern":["während","…","Verb am Ende",",","Verb","+","Subjekt"],"frames":[{"k":"sub","parts":[["c","Während"],["mf","mein Bruder gern Sport"],["ve","macht"]]},{"k":"main","parts":[["vf","Während mein Bruder gern Sport macht,"],["v","lese"],["mf","ich lieber"]]},{"k":"main","parts":[["vf","Mein Bruder"],["v","macht"],["mf","gern Sport, ich dagegen lese lieber"]]}],"example":"Während mein Bruder gern Sport macht, lese ich lieber.","stepExamples":["Mein Bruder macht gern Sport. Ich lese lieber.","Während mein Bruder gern Sport macht, lese ich lieber.","Ich lese lieber, während mein Bruder gern Sport macht.","Während ich koche, höre ich Radio. ↔ Während ich gern koche, isst er lieber im Restaurant."],"pitfallPair":"Während mein Bruder macht gern Sport, ich lese lieber. → Während mein Bruder gern Sport macht, lese ich lieber.","links":["https://www.dwds.de/wb/w%C3%A4hrend","https://grammis.ids-mannheim.de/kontrastive-grammatik/3789"],"i18n":{"ar":{"title":"في حين أنّ: während للمقابلة","lead":"تعرف `während` بمعنى «بينما» للوقت. لكن لها معنى ثانيًا: المقابلة بين شخصين أو أمرين مختلفين، كما في العربية «في حين أنّ». البناء واحد، والسياق يحدد المعنى.","translation":"في حين أن أخي يحب الرياضة، أفضّل أنا القراءة.","steps":[{"text":"ابدأ بأمرين متقابلين","why":"الأخ يحب الرياضة، وأنا أفضل القراءة. لا علاقة زمنية بينهما، بل مقابلة."},{"text":"اربط بـ während والفعل في الآخر","why":"`während` أداة ربط تابعة، فيقف الفعل المصرف `macht` في آخر جملتها. ثم يبدأ ما بعد الفاصلة بالفعل `lese`."},{"text":"يمكن أن تأتي جملة während في الآخر","why":"`Ich lese lieber, während mein Bruder gern Sport macht.` المعنى نفسه."},{"text":"فرّق بين المعنيين","why":"الزمني: أمران في الوقت نفسه ولشخص واحد غالبًا. المقابل: أمران مختلفان لشخصين أو شيئين، وغالبًا مع كلمات مثل `lieber` أو `gern` أو مقارنة."}],"explain":["في المعنى المقابل يمكن استبدال `während` بـ `aber` أو `dagegen` أو `wohingegen` (الأخيرة رسمية). مثلًا: `Mein Bruder macht gern Sport, ich dagegen lese lieber.`","كثيرًا ما يظهر في الجملتين فاعلان مختلفان يتقابلان: `mein Bruder` ↔ `ich`، و`im Norden` ↔ `im Süden`."],"pitfall":"`während` ترسل الفعل إلى آخر جملتها، والجملة الرئيسية بعدها تبدأ بالفعل.","recall":["هل `während` هنا زمنية أم للمقابلة؟ `Während es im Norden regnet, scheint im Süden die Sonne.`","للمقابلة: مكانان مختلفان وطقسان متقابلان."],"linkTitles":["während في معجم DWDS","أدوات الربط · grammis"]},"de":{"title":"Adversative Nebensätze mit während","lead":"Du kennst `während` als Zeitwort für Gleichzeitigkeit. Es hat aber eine zweite Bedeutung: den Gegensatz zwischen zwei Personen oder Dingen. Der Satzbau ist gleich, der Kontext entscheidet.","steps":[{"text":"Beginne mit zwei Gegensätzen","why":"Der Bruder macht gern Sport, ich lese lieber. Es gibt keine zeitliche Beziehung, sondern einen Kontrast."},{"text":"Verbinde mit während, das Verb am Ende","why":"`während` ist ein Subjunktor: `macht` steht am Ende des Nebensatzes. Nach dem Komma beginnt der Hauptsatz mit `lese`."},{"text":"Der während-Satz kann auch hinten stehen","why":"`Ich lese lieber, während mein Bruder gern Sport macht.` Gleiche Bedeutung."},{"text":"Unterscheide die zwei Bedeutungen","why":"Temporal: zwei Dinge gleichzeitig, oft bei derselben Person. Adversativ: zwei verschiedene Personen oder Dinge im Gegensatz, oft mit `lieber`, `gern` oder einem Vergleich."}],"explain":["Im adversativen Sinn kannst du `während` durch `aber`, `dagegen` oder `wohingegen` (formell) ersetzen: `Mein Bruder macht gern Sport, ich dagegen lese lieber.`","Typisch sind zwei verschiedene Subjekte, die sich gegenüberstehen: `mein Bruder` ↔ `ich`, `im Norden` ↔ `im Süden`."],"pitfall":"`während` schickt das Verb ans Ende. Der Hauptsatz danach beginnt mit dem Verb.","recall":["Temporal oder adversativ? `Während es im Norden regnet, scheint im Süden die Sonne.`","Adversativ: zwei verschiedene Orte mit gegensätzlichem Wetter."],"linkTitles":["während im DWDS","Konnektoren · grammis"]}},"questions":[{"id":"waehrend-adversativ-1","type":"cloze","difficulty":1,"text":"Während meine Schwester Fleisch {{1}}, ist mein Vater Vegetarier.","blanks":[["isst","mag","liebt"]],"i18n":{"ar":{"prompt":"أكمل بالفعل في مكانه.","explain":"الفعل المصرف في آخر جملة `während`: `Fleisch isst`.","hints":["الفاعل `meine Schwester`."]},"de":{"prompt":"Ergänze das Verb.","explain":"Am Ende des während-Satzes: `Fleisch isst`.","hints":["Das Subjekt ist `meine Schwester`."]}}},{"id":"waehrend-adversativ-2","type":"cloze","difficulty":1,"text":"Während ich früh aufstehe, {{1}} mein Mann gern lange.","blanks":[["schläft"]],"i18n":{"ar":{"prompt":"أكمل بالفعل `schlafen`.","explain":"بعد الجملة التابعة يأتي الفعل `schläft` ثم الفاعل.","hints":["`schlafen` يتغير حرفه مع `er`."]},"de":{"prompt":"Ergänze `schlafen`.","explain":"Nach dem Nebensatz kommt das Verb `schläft`, dann das Subjekt.","hints":["`schlafen` hat bei `er` einen Umlaut."]}}},{"id":"waehrend-adversativ-3","type":"mcq","difficulty":1,"options":["Gegensatz","Gleichzeitigkeit","Grund"],"answer":0,"i18n":{"ar":{"prompt":"ما معنى `während` في `Während Tom sehr ordentlich ist, ist sein Zimmernachbar chaotisch.`؟","explain":"شخصان مختلفان وصفتان متقابلتان: هذه مقابلة.","hints":["هل يحدث شيء في الوقت نفسه؟"]},"de":{"prompt":"Was bedeutet `während` in `Während Tom sehr ordentlich ist, ist sein Zimmernachbar chaotisch.`?","explain":"Zwei Personen mit gegensätzlichen Eigenschaften: ein Gegensatz.","hints":["Passiert hier etwas gleichzeitig?"]}}},{"id":"waehrend-adversativ-4","type":"cloze","difficulty":2,"text":"In der Stadt sind die Mieten hoch, auf dem Land {{1}} sind sie günstig. = {{2}} die Mieten in der Stadt hoch sind, sind sie auf dem Land günstig.","blanks":[["dagegen"],["Während"]],"i18n":{"ar":{"prompt":"أكمل الجملتين بالمعنى نفسه.","explain":"في الجملة الأولى `dagegen` في وسط الجملة الرئيسية، وفي الثانية `Während` مع الفعل في الآخر.","hints":["الفراغ الأول يعني «بالمقابل»."]},"de":{"prompt":"Ergänze beide Sätze mit derselben Bedeutung.","explain":"Im ersten Satz `dagegen` im Hauptsatz, im zweiten `Während` mit Verb am Ende.","hints":["Die erste Lücke heißt „im Gegensatz dazu“."]}}},{"id":"waehrend-adversativ-5","type":"order","difficulty":2,"items":["Während","Anna","Tee","trinkt,","bevorzugt","Paul","Kaffee."],"i18n":{"ar":{"prompt":"رتّب الجملة. ابدأ بـ `Während`.","explain":"الجملة التابعة أولًا مع `trinkt` في آخرها، ثم `bevorzugt Paul Kaffee`.","hints":["بعد الفاصلة: الفعل ثم الفاعل."]},"de":{"prompt":"Ordne den Satz. Beginne mit `Während`.","explain":"Erst der Nebensatz mit `trinkt` am Ende, dann `bevorzugt Paul Kaffee`.","hints":["Nach dem Komma: Verb, dann Subjekt."]}}},{"id":"waehrend-adversativ-6","type":"mcq","difficulty":2,"options":["Während ich telefoniere, mache ich Notizen.","Während Berlin groß ist, ist Weimar klein.","Während mein Vater Fußball liebt, interessiert sich meine Mutter für Kunst."],"answer":0,"i18n":{"ar":{"prompt":"في أي جملة تدل `während` على الوقت؟","explain":"شخص واحد يقوم بأمرين في الوقت نفسه: هذا هو المعنى الزمني. الجملتان الأخريان مقابلة.","hints":["ابحث عن شخص واحد وفعلين معًا."]},"de":{"prompt":"In welchem Satz ist `während` temporal?","explain":"Eine Person tut zwei Dinge gleichzeitig: temporal. Die anderen Sätze sind Gegensätze.","hints":["Such eine Person mit zwei gleichzeitigen Handlungen."]}}},{"id":"waehrend-adversativ-7","type":"text","difficulty":3,"answer":"Während Lisa gern ans Meer fährt, wandert Max lieber in den Bergen.","i18n":{"ar":{"prompt":"اربط بـ `während` للمقابلة: `Lisa fährt gern ans Meer. Max wandert lieber in den Bergen.`","explain":"`Während Lisa gern ans Meer fährt, wandert Max lieber in den Bergen.`","hints":["`fährt` في آخر الجملة التابعة."]},"de":{"prompt":"Verbinde adversativ mit `während`: `Lisa fährt gern ans Meer. Max wandert lieber in den Bergen.`","explain":"`Während Lisa gern ans Meer fährt, wandert Max lieber in den Bergen.`","hints":["`fährt` steht am Ende des Nebensatzes."]}}},{"id":"waehrend-adversativ-8","type":"text","difficulty":3,"context":"Während mein Bruder macht gern Sport, ich lese lieber.","answer":"Während mein Bruder gern Sport macht, lese ich lieber.","i18n":{"ar":{"prompt":"صحّح الخطأين في المثال واشرح سبب التصحيح.","explain":"الفعل `macht` يذهب إلى آخر جملة `während`، والجملة الرئيسية بعدها تبدأ بالفعل `lese`.","hints":["في المثال خطآن في موقع الفعل."]},"de":{"prompt":"Korrigiere die zwei Fehler im Beispiel und erkläre, warum.","explain":"`macht` gehört ans Ende des während-Satzes, und der Hauptsatz beginnt danach mit `lese`.","hints":["Es gibt zwei Fehler bei der Verbstellung."]}}},{"id":"waehrend-adversativ-9","type":"text","difficulty":2,"answer":"Während man in meiner Heimat spät zu Abend isst, essen die Deutschen oft schon um sechs.","i18n":{"ar":{"prompt":"قارن بين عادة في بلدك وعادة في ألمانيا مع `während`.","explain":"مثال: `Während man in meiner Heimat spät zu Abend isst, essen die Deutschen oft schon um sechs.`","hints":["فاعلان متقابلان."]},"de":{"prompt":"Vergleiche eine Gewohnheit in deiner Heimat mit Deutschland. Benutze `während`.","explain":"Zum Beispiel: `Während man in meiner Heimat spät zu Abend isst, essen die Deutschen oft schon um sechs.`","hints":["Zwei Subjekte im Gegensatz."]}}}]},{"id":"je-desto","level":"B1.1","island":"gegensatz-vergleich","order":4,"prereqs":["komparativ"],"emoji":"📈","german":"je … desto / umso","source":{"lektion":1,"kind":"toc"},"pattern":["je + Komparativ … Verb",",","desto / umso + Komparativ + Verb …"],"frames":[{"k":"sub","parts":[["c","Je länger"],["mf","ich hier"],["ve","wohne"]]},{"k":"main","parts":[["vf","desto besser"],["v","kenne"],["mf","ich die Gegend"]]}],"example":"Je länger ich hier wohne, desto besser kenne ich die Gegend.","stepExamples":["lang → länger · gut → besser","Je länger ich hier wohne, …","…, desto besser kenne ich die Gegend.","Je höher die Miete ist, desto weniger Geld bleibt übrig."],"pitfallPair":"Je länger wohne ich hier, desto besser ich kenne die Gegend. → Je länger ich hier wohne, desto besser kenne ich die Gegend.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/kontrastive-grammatik/3790"],"i18n":{"ar":{"title":"كلما… ازداد أو قلّ…","lead":"تستعمل هذا التركيب عندما يتغيّر شيء مع تغيّر شيء آخر. مثال ذلك أن تقلّ الحيرة كلما زادت معرفة المرء بالحي.","translation":"كلما سكنت هنا مدة أطول، عرفت المنطقة بصورة أفضل.","steps":[{"text":"كوّن درجتَي المقارنة","why":"العلاقة تقوم على درجتين. اختر مقدارًا لكل جزء، مثل طول المدة وجودة المعرفة. بعض درجات المقارنة شاذ، ومنها `gut → besser`."},{"text":"ضع المقارنة مباشرة بعد je","why":"الجزء الأول جملة تابعة. تأتي مجموعة المقارنة في البداية والفعل المصرف `wohne` في آخر الجزء قبل الفاصلة."},{"text":"ضع المقارنة الثانية في صدر النتيجة","why":"يمكنك استعمال `umso` مكان `desto`. تحتل مجموعة `desto besser` الموقع الأول بكاملها، لذلك يأتي `kenne` مباشرة بعدها ثم الفاعل."},{"text":"جرّب المقارنة في اتجاهين مختلفين","why":"قد تزيد قيمة بينما تنقص الأخرى. يحدد اختيار `höher` و`weniger` اتجاه التغيّر. المجموعة الثانية كلها هي `desto weniger Geld` قبل الفعل `bleibt`."}],"explain":["إذا كانت المقارنة داخل مجموعة اسمية تبقى المجموعة معًا. في `Je mehr Zeit wir haben, desto …` يبدأ الجزء الأول كله بـ `je mehr Zeit`. يمكنك أيضًا سماع الصيغة المختصرة `Je früher, desto besser` حين يفهم السامع ما الذي سيحدث مبكرًا وما الذي سيصبح أفضل."],"pitfall":"راجع كل جزء وحده. الأول تابع وينتهي بالفعل. الثاني رئيسي وتأتي مجموعة المقارنة قبل الفعل المصرف.","recall":["أين الفعل في `Je öfter sie übt, umso sicherer spricht sie`؟","تنتهي الجملة الأولى بـ `übt`. يبدأ الجزء الثاني بـ `umso sicherer` ثم يأتي `spricht`."],"linkTitles":["فهرس قواعد الوحدة 1 · telc، ص 2","حلول الكتاب الرسمية · telc","أدوات الربط والمقارنة · grammis"]},"de":{"title":"je … desto / umso","lead":"Du benutzt diese Struktur, wenn sich etwas zusammen mit etwas anderem verändert – zum Beispiel: Je besser man das Viertel kennt, desto weniger verliert man sich.","steps":[{"text":"Bilde zwei Komparative","why":"Die Beziehung beruht auf zwei Steigerungen. Wähle für jeden Teil eine Größe, etwa die Dauer und wie gut man etwas kennt. Manche Komparative sind unregelmäßig, z. B. `gut → besser`."},{"text":"Stell den Komparativ direkt nach je","why":"Der erste Teil ist ein Nebensatz. Die Komparativgruppe steht am Anfang, das konjugierte Verb `wohne` am Ende vor dem Komma."},{"text":"Stell den zweiten Komparativ an den Anfang des Ergebnisses","why":"Statt `desto` kannst du auch `umso` sagen. Die ganze Gruppe `desto besser` besetzt Position 1, deshalb folgt direkt `kenne` und dann das Subjekt."},{"text":"Probiere den Vergleich in zwei Richtungen","why":"Ein Wert kann steigen, während der andere sinkt. `höher` und `weniger` bestimmen die Richtung. Die zweite Gruppe ist komplett `desto weniger Geld` vor dem Verb `bleibt`."}],"explain":["Steht der Komparativ in einer Nominalgruppe, bleibt die Gruppe zusammen: In `Je mehr Zeit wir haben, desto …` beginnt der erste Teil mit `je mehr Zeit`. Du hörst auch die Kurzform `Je früher, desto besser`, wenn klar ist, was früher passieren und was besser werden soll."],"pitfall":"Prüf jeden Teil einzeln: Der erste ist ein Nebensatz und endet mit dem Verb. Der zweite ist ein Hauptsatz – die Komparativgruppe steht vor dem konjugierten Verb.","recall":["Wo steht das Verb in `Je öfter sie übt, umso sicherer spricht sie`?","Der erste Teil endet mit `übt`. Der zweite beginnt mit `umso sicherer`, danach kommt `spricht`."],"linkTitles":["Grammatikübersicht Lektion 1 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Konnektoren und Vergleich · grammis"]}},"questions":[{"id":"je-desto-1","type":"cloze","difficulty":1,"text":"Je {{1}} du übst, desto leichter wird es.","blanks":[["mehr"]],"i18n":{"ar":{"prompt":"أكمل الجزء الأول بدرجة المقارنة من viel.","explain":"صيغة المقارنة من viel هي mehr.","hints":["ابحث عن صيغة viel الشاذة."]},"de":{"prompt":"Ergänze den ersten Teil mit dem Komparativ von `viel`.","explain":"Der Komparativ von `viel` ist `mehr`.","hints":["Such die unregelmäßige Form von `viel`."]}}},{"id":"je-desto-2","type":"cloze","difficulty":1,"text":"Je früher wir starten, {{1}} schneller kommen wir an.","blanks":[["desto","umso"]],"i18n":{"ar":{"prompt":"اكتب أحد الرابطين الممكنين في الجزء الثاني.","explain":"desto وumso صالحان بعد الفاصلة في هذا التركيب.","hints":["الجزء الثاني له بديلان متكافئان هنا."]},"de":{"prompt":"Schreib eines der beiden möglichen Wörter für den zweiten Teil.","explain":"`desto` und `umso` passen beide nach dem Komma.","hints":["Für den zweiten Teil gibt es hier zwei gleichwertige Möglichkeiten."]}}},{"id":"je-desto-3","type":"mcq","difficulty":1,"options":["Je höher die Miete ist, desto weniger Geld bleibt übrig.","Je höher die Miete ist, desto mehr Geld bleibt übrig.","Je niedriger die Miete ist, desto weniger Geld bleibt übrig."],"answer":0,"i18n":{"ar":{"prompt":"أيّ عبارة تعني «كلما ارتفع الإيجار، بقي مال أقل»؟","explain":"höher يعبر عن الارتفاع وweniger عن الانخفاض. كل مشتّت يغيّر اتجاه قيمة واحدة.","hints":["تتجه القيمتان في اتجاهين متعاكسين."]},"de":{"prompt":"Welcher Satz bedeutet: „Je höher die Miete, desto weniger Geld bleibt übrig“?","explain":"`höher` drückt den Anstieg aus, `weniger` die Abnahme. Jede falsche Antwort ändert die Richtung eines Wertes.","hints":["Die beiden Werte bewegen sich in entgegengesetzte Richtungen."]}}},{"id":"je-desto-4","type":"order","difficulty":2,"items":["Je öfter","du","fragst,","desto schneller","lernst","du."],"i18n":{"ar":{"prompt":"رتّب الجملة. أبقِ مجموعتَي المقارنة في الصدارة.","explain":"fragst في نهاية الجزء الأول. المجموعة desto schneller تسبق lernst مباشرةً.","hints":["ابحث عن آخر كلمة قبل الفاصلة، ثم عن الفعل بعدها."]},"de":{"prompt":"Ordne den Satz. Lass beide Komparativgruppen vorne stehen.","explain":"`fragst` steht am Ende des ersten Teils. Die Gruppe `desto schneller` steht direkt vor `lernst`.","hints":["Such das letzte Wort vor dem Komma und dann das Verb danach."]}}},{"id":"je-desto-5","type":"cloze","difficulty":2,"text":"Je {{1}} ich plane, desto {{2}} Zeit verliere ich.","blanks":[["besser"],["weniger"]],"i18n":{"ar":{"prompt":"اكتب الصيغة المقارنة من gut ثم من wenig.","explain":"gut تصبح besser وwenig تصبح weniger.","hints":["تتغيّر كلمة gut كلها في المقارنة."]},"de":{"prompt":"Schreib den Komparativ von `gut` und dann von `wenig`.","explain":"`gut` wird zu `besser`, `wenig` zu `weniger`.","hints":["Beim Komparativ ändert sich `gut` komplett."]}}},{"id":"je-desto-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"أين وقع الخطأ في Je mehr Zeit haben wir, desto entspannter lernen wir؟","explain":"في جزء je يأتي الفعل في النهاية. جزء desto مكتوب بالفعل بترتيب الجملة الرئيسية.","hints":["حدّد أي جزء هو الجملة التابعة."],"options":["haben يجب أن تأتي بعد wir في جزء je.","lernen يجب أن تأتي بعد wir في جزء desto.","desto يجب أن تستبدلها بـ je."]},"de":{"prompt":"Wo ist der Fehler in `Je mehr Zeit haben wir, desto entspannter lernen wir`?","explain":"Im je-Teil steht das Verb am Ende. Der desto-Teil hat schon die richtige Hauptsatz-Wortstellung.","hints":["Bestimme, welcher Teil der Nebensatz ist."],"options":["`haben` muss im je-Teil nach `wir` stehen.","`lernen` muss im desto-Teil nach `wir` stehen.","`desto` muss durch `je` ersetzt werden."]}}},{"id":"je-desto-7","type":"text","difficulty":3,"answer":"Je länger der Weg ist, umso schwerer werden die Taschen.","i18n":{"ar":{"prompt":"اربط الجملتين بـ je … umso، مع المقارنة من lang وschwer. Der Weg ist lang. Die Taschen werden schwer.","explain":"أضيفت länger بعد je ثم جاء ist في نهاية التابع. في النتيجة جاء werden مباشرة بعد umso schwerer.","hints":["ابدأ كل جزء بعبارة المقارنة وحدّد موقع الفعلين."]},"de":{"prompt":"Verbinde die Sätze mit je … umso und den Komparativen von `lang` und `schwer`: `Der Weg ist lang. Die Taschen werden schwer.`","explain":"Nach `je` steht `länger`, `ist` steht am Ende des Nebensatzes. Im Ergebnis folgt `werden` direkt nach `umso schwerer`.","hints":["Beginne jeden Teil mit dem Komparativ und bestimme die Position der beiden Verben."]}}},{"id":"je-desto-8","type":"text","difficulty":3,"answer":"Je länger ich hier wohne, desto besser kenne ich die Gegend.","context":"Je länger wohne ich hier, desto besser ich kenne die Gegend.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"راجع كل جزء وحده. الأول تابع وينتهي بالفعل. الثاني رئيسي وتأتي مجموعة المقارنة قبل الفعل المصرف.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Prüf jeden Teil einzeln: Der erste ist ein Nebensatz und endet mit dem Verb. Der zweite ist ein Hauptsatz – die Komparativgruppe steht vor dem konjugierten Verb.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"je-desto-9","type":"text","difficulty":2,"answer":"تنتهي الجملة الأولى بـ `übt`. يبدأ الجزء الثاني بـ `umso sicherer` ثم يأتي `spricht`.","i18n":{"ar":{"prompt":"أين الفعل في `Je öfter sie übt, umso sicherer spricht sie`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Wo steht das Verb in `Je öfter sie übt, umso sicherer spricht sie`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"doppelkonjunktionen","level":"B1.1","island":"gegensatz-vergleich","order":5,"prereqs":[],"emoji":"🧵","german":"Doppelkonjunktionen","source":{"lektion":2,"kind":"toc"},"pattern":["sowohl … als auch","·","nicht nur … sondern auch","·","entweder … oder","·","weder … noch","·","zwar … aber"],"frames":[{"k":"main","parts":[["vf","Sie"],["v","hat"],["c","sowohl"],["mf","Erfahrung"],["c","als auch"],["mf","gute Sprachkenntnisse"]]}],"example":"Sie hat sowohl Erfahrung als auch gute Sprachkenntnisse.","stepExamples":["sowohl A als auch B · nicht nur A, sondern auch B","entweder A oder B","weder A noch B","zwar A, aber B"],"pitfallPair":"Er hat zwar Zeit, sondern auch Geduld. → Er hat nicht nur Zeit, sondern auch Geduld.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/kontrastive-grammatik/3789"],"i18n":{"ar":{"title":"الربط بأدوات من جزأين","lead":"يختصر الربط المزدوج علاقتك بين شيئين. حدّد هل تريد جمعهما أم الاختيار بينهما أم نفيهما أم إثبات أحدهما مع قيد أو إضافة.","translation":"لديها خبرة ومهارات لغوية جيدة أيضًا.","steps":[{"text":"اجمع شيئين أو أكّد الثاني","why":"الأولى تثبت الأمرين. الثانية تضيف تأكيدًا على الثاني، مثل `Er schreibt nicht nur Berichte, sondern auch Angebote`. ضع الجزأين قبل العنصرين اللذين تريد ربطهما."},{"text":"اعرض بديلين","why":"في `Wir arbeiten entweder im Büro oder zu Hause` البديلان مكانان للعمل. حافظ على التوازي حتى يقرأ السامع ما يقع في مقابل ماذا."},{"text":"انفِ الأمرين","why":"في `Er hat weder Zeit noch Geld` ينفي التركيب الوقت والمال معًا. يكفي النفي الذي يحمله الزوج نفسه في هذه الجملة."},{"text":"أثبت الأمر الأول ثم ضع قيدًا","why":"في `Die Stelle ist zwar befristet, aber sie ist gut bezahlt` الأمران صحيحان. تقصر `aber` أثر المعلومة الأولى أو توازنها بمعلومة مقابلة."}],"explain":["عند ربط مجموعات بسيطة تُكتب `sowohl … als auch` و`weder … noch` و`entweder … oder` عادة بلا فاصلة. ضع فاصلة قبل `aber` و`sondern`. وإذا ربطت جملتين رئيسيتين مستقلتين بـ `oder` تستطيع استخدام الفاصلة لتوضيح البنية. ترتيب الفعل يعتمد على موضع المجموعة في الجملة، وتستطيع استعمال الصيغة البسيطة بموازاة عنصرين بعد الفعل: `Wir brauchen sowohl Zeit als auch Geld`."],"pitfall":"الزوج `nicht nur … sondern auch` يثبت الاثنين مع التأكيد على الثاني. يقترن `zwar` بـ `aber` حين تقصد التقييد.","recall":["أي زوج يناسب معنى «لا السبت ولا الأحد»؟","`weder am Samstag noch am Sonntag`. الزوج ينفي الخيارين."],"linkTitles":["فهرس قواعد الوحدة 2 · telc، ص 2","حلول الكتاب الرسمية · telc","أدوات الربط · grammis"],"table":[["العلاقة","الزوج"],["إثبات الاثنين","sowohl … als auch"],["إثبات الاثنين مع إبراز الثاني","nicht nur …, sondern auch"],["عرض بديلين","entweder … oder"],["نفي الاثنين","weder … noch"],["إثبات مع قيد","zwar …, aber"]]},"de":{"title":"Doppelkonjunktionen","lead":"Eine Doppelkonjunktion zeigt kurz die Beziehung zwischen zwei Dingen. Entscheide: Willst du beide verbinden, zwischen ihnen wählen, beide verneinen oder eines bestätigen und einschränken bzw. ergänzen?","steps":[{"text":"Verbinde zwei Dinge oder betone das zweite","why":"Die erste Form bestätigt beides. Die zweite betont zusätzlich das Zweite: `Er schreibt nicht nur Berichte, sondern auch Angebote`. Setz die beiden Teile vor die zwei Elemente, die du verbindest."},{"text":"Nenne zwei Alternativen","why":"In `Wir arbeiten entweder im Büro oder zu Hause` sind die Alternativen zwei Arbeitsorte. Bleib parallel, damit man versteht, was wem gegenübersteht."},{"text":"Verneine beides","why":"In `Er hat weder Zeit noch Geld` werden Zeit und Geld zusammen verneint. Die Verneinung steckt schon im Paar – mehr braucht der Satz nicht."},{"text":"Bestätige das Erste und schränke ein","why":"In `Die Stelle ist zwar befristet, aber sie ist gut bezahlt` stimmt beides. `aber` schränkt die erste Information ein oder stellt ihr etwas gegenüber."}],"explain":["Verbindest du einfache Gruppen, schreibt man `sowohl … als auch`, `weder … noch` und `entweder … oder` meist ohne Komma. Vor `aber` und `sondern` steht ein Komma. Verbindest du zwei selbstständige Hauptsätze mit `oder`, kannst du ein Komma setzen, um die Struktur klarer zu machen. Die Verbposition hängt davon ab, wo die Gruppe im Satz steht; parallel nach dem Verb geht es ganz einfach: `Wir brauchen sowohl Zeit als auch Geld`."],"pitfall":"`nicht nur … sondern auch` bestätigt beides und betont das Zweite. `zwar` gehört zu `aber`, wenn du einschränken willst.","recall":["Welches Paar passt zu „weder Samstag noch Sonntag“?","`weder am Samstag noch am Sonntag`. Das Paar verneint beide Möglichkeiten."],"linkTitles":["Grammatikübersicht Lektion 2 · telc, S. 2","Offizielle Lösungen zum Buch · telc","Konnektoren · grammis"],"table":[["Beziehung","Paar"],["beides bestätigen","sowohl … als auch"],["beides bestätigen, das Zweite betonen","nicht nur …, sondern auch"],["zwei Alternativen","entweder … oder"],["beides verneinen","weder … noch"],["bestätigen mit Einschränkung","zwar …, aber"]]}},"questions":[{"id":"doppelkonjunktionen-1","type":"cloze","difficulty":1,"text":"Wir brauchen sowohl Zeit {{1}} Geduld.","blanks":[["als auch"]],"i18n":{"ar":{"prompt":"أكمل الربط لإثبات الخيارين.","explain":"sowohl … als auch يثبت الحاجة إلى الوقت والصبر معًا.","hints":["اختر المكمل المعتاد لـ sowohl."]},"de":{"prompt":"Ergänze die Verbindung, die beide Möglichkeiten bestätigt.","explain":"`sowohl … als auch` bestätigt, dass man Zeit und Geduld braucht.","hints":["Wähle den üblichen zweiten Teil zu `sowohl`."]}}},{"id":"doppelkonjunktionen-2","type":"cloze","difficulty":1,"text":"Sie hat weder angerufen {{1}} geschrieben.","blanks":[["noch"]],"i18n":{"ar":{"prompt":"أكمل الربط لنفي الخيارين.","explain":"weder … noch ينفي الاتصال والكتابة.","hints":["weder هي بداية زوج للنفي."]},"de":{"prompt":"Ergänze die Verbindung, die beide Möglichkeiten verneint.","explain":"`weder … noch` verneint Anrufen und Schreiben.","hints":["`weder` ist der Anfang eines verneinenden Paares."]}}},{"id":"doppelkonjunktionen-3","type":"mcq","difficulty":1,"options":["entweder … oder","sowohl … als auch","weder … noch"],"answer":0,"i18n":{"ar":{"prompt":"أي زوج يعلن بديلين للاختيار؟","explain":"entweder … oder يقدّم بديلين. الزوج الثاني يجمعهما والثالث ينفيهما.","hints":["ابحث عن معنى «إما… أو…»."]},"de":{"prompt":"Welches Paar nennt zwei Alternativen zur Wahl?","explain":"`entweder … oder` bietet zwei Alternativen an. Das zweite Paar verbindet beide, das dritte verneint beide.","hints":["Such die Bedeutung „das eine oder das andere“."]}}},{"id":"doppelkonjunktionen-4","type":"cloze","difficulty":2,"text":"Er liest nicht nur Berichte, {{1}} Angebote.","blanks":[["sondern auch"]],"i18n":{"ar":{"prompt":"أكمل معنى الإضافة مع التأكيد.","explain":"يقابل nicht nur هنا sondern auch وتسبقها فاصلة.","hints":["الجزء الثاني إضافة مؤكدة."]},"de":{"prompt":"Ergänze die Bedeutung „zusätzlich, mit Betonung“.","explain":"Zu `nicht nur` gehört hier `sondern auch`, davor steht ein Komma.","hints":["Der zweite Teil ist eine betonte Ergänzung."]}}},{"id":"doppelkonjunktionen-5","type":"order","difficulty":2,"items":["Die Stelle","ist","zwar","befristet,","aber","gut bezahlt."],"i18n":{"ar":{"prompt":"رتّب الجملة. ضع zwar بعد ist مباشرة.","explain":"zwar يقدّم الصفة الأولى وتأتي aber بعد الفاصلة لتوازنها بالثانية.","hints":["ابدأ بتقرير المعلومة ثم ضع القيد بعدها."]},"de":{"prompt":"Ordne den Satz. Setz `zwar` direkt nach `ist`.","explain":"`zwar` leitet die erste Eigenschaft ein, `aber` folgt nach dem Komma und stellt die zweite gegenüber.","hints":["Bestätige zuerst die Information und setz dann die Einschränkung."]}}},{"id":"doppelkonjunktionen-6","type":"mcq","difficulty":2,"options":["Sie spricht sowohl Deutsch als auch Arabisch.","Sie spricht sowohl Deutsch, als auch Arabisch.","Sie spricht sowohl Deutsch oder Arabisch."],"answer":0,"i18n":{"ar":{"prompt":"اختر كتابة صحيحة لربط اسمين.","explain":"الزوج هو sowohl … als auch ولا توضع فاصلة بين العنصرين البسيطين.","hints":["هنا نربط اسمين بلا جملتين مستقلتين."]},"de":{"prompt":"Wähle die richtige Schreibweise für die Verbindung zweier Nomen.","explain":"Das Paar ist `sowohl … als auch`, und zwischen zwei einfachen Elementen steht kein Komma.","hints":["Hier verbinden wir zwei Nomen, keine zwei Sätze."]}}},{"id":"doppelkonjunktionen-7","type":"text","difficulty":3,"answer":"Ich mag zwar den Beruf, aber die Arbeitszeiten sind schwierig.","i18n":{"ar":{"prompt":"ادمج Ich mag den Beruf وDie Arbeitszeiten sind schwierig مع zwar … aber.","explain":"تأتي zwar مع الإثبات الأول. تسبق aber فاصلة وتبقى جملة Arbeitszeiten في ترتيب رئيسي.","hints":["أثبت حب العمل في الجزء الأول وأضف القيد في الثاني."]},"de":{"prompt":"Verbinde `Ich mag den Beruf` und `Die Arbeitszeiten sind schwierig` mit zwar … aber.","explain":"`zwar` gehört zur ersten Aussage. Vor `aber` steht ein Komma, und der Satz mit den Arbeitszeiten bleibt in Hauptsatz-Wortstellung.","hints":["Bestätige im ersten Teil, dass du den Beruf magst, und setz die Einschränkung in den zweiten."]}}},{"id":"doppelkonjunktionen-8","type":"text","difficulty":3,"answer":"Er hat nicht nur Zeit, sondern auch Geduld.","context":"Er hat zwar Zeit, sondern auch Geduld.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"الزوج `nicht nur … sondern auch` يثبت الاثنين مع التأكيد على الثاني. يقترن `zwar` بـ `aber` حين تقصد التقييد.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"`nicht nur … sondern auch` bestätigt beides und betont das Zweite. `zwar` gehört zu `aber`, wenn du einschränken willst.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"doppelkonjunktionen-9","type":"text","difficulty":2,"answer":"`weder am Samstag noch am Sonntag`. الزوج ينفي الخيارين.","i18n":{"ar":{"prompt":"أي زوج يناسب معنى «لا السبت ولا الأحد»؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Welches Paar passt zu „weder Samstag noch Sonntag“?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"falls","level":"B1.1","island":"konjunktiv-bedingung","order":1,"prereqs":[],"emoji":"☔","german":"Konditionale Nebensätze mit falls","source":{"lektion":3,"kind":"sample"},"pattern":["Falls … Verb",",","Verb + Subjekt …"],"frames":[{"k":"sub","parts":[["c","Falls"],["mf","es morgen"],["ve","regnet"]]},{"k":"main","parts":[["vf","(Falls-Satz)"],["v","bleiben"],["mf","wir zu Hause"]]}],"example":"Falls es morgen regnet, bleiben wir zu Hause.","stepExamples":["es regnet morgen","Falls es morgen regnet, …","Falls es morgen regnet, bleiben wir zu Hause.","Wir bleiben zu Hause, falls es morgen regnet."],"pitfallPair":"Falls du brauchst Hilfe, ruf mich an. → Falls du Hilfe brauchst, ruf mich an.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13","https://grammis.ids-mannheim.de/systematische-grammatik/997"],"i18n":{"ar":{"title":"الشرط المحتمل مع falls","lead":"حين تضع خطة لما قد يحدث، تساعدك `falls` على التعبير عن معنى «في حال». تعلّم كيف تقسم الجملة إلى شرط ونتيجة وتضع كل فعل في موضعه.","translation":"في حال هطل المطر غدًا، سنبقى في المنزل.","steps":[{"text":"حدّد الحدث غير المحسوم","why":"الشرط هو هطول المطر. قد يحصل وقد لا يحصل. استعمال `falls` يقدّمه بوصفه حالة محتملة، وكثيرًا ما تكون غير مرجحة في السياق."},{"text":"اكتب الشرط كجملة تابعة","why":"ضع `falls` أولًا وانقل الفعل المصرف `regnet` إلى نهاية الجملة التابعة. مع فعل قابل للفصل تقول `falls sie morgen anruft` ببادئته المتصلة في النهاية."},{"text":"ابدأ النتيجة بالفعل إذا قدمت الشرط","why":"يشغل الشرط كله الموقع الأول في الجملة الكلية، فيأتي `bleiben` بعد الفاصلة. ويمكن إبراز النتيجة بـ `dann`: `…, dann bleiben wir zu Hause`."},{"text":"قدّم النتيجة عند الحاجة","why":"تبقى الجملة الرئيسية بترتيبها المعتاد. وتبقى الجملة التابعة منتهية بالفعل. إذا جاء الفعل مع مصدر فستجد المصرف آخرًا، مثل `falls du kommen kannst`."}],"explain":["تستطيع استعمال `wenn` أيضًا لشرط مفتوح، وهي أوسع استعمالًا وتشمل بعض العلاقات الزمنية. تميل `falls` إلى معنى الاحتياط وتأتي مع `doch` عندما تخالف الاحتمال المتوقع، مثل `Falls es doch regnet, nehmen wir Schirme mit`. راجع درس الشرط غير الواقعي إذا كان الشرط مناقضًا للواقع الحالي بدل أن يكون احتمالًا مفتوحًا."],"pitfall":"ضع `brauchst` آخر الشرط. تبقى نتيجة الأمر `ruf mich an` في ترتيبها.","recall":["هل تقع `kannst` قبل `kommen` في `falls du morgen kommen kannst`؟","تأتي `kannst` أخيرًا لأنها الفعل المصرف في الجملة التابعة."],"linkTitles":["فهرس قواعد الوحدة 3 · telc، ص 2","شرح القواعد، ص 35 من الكتاب · telc","الشرط · grammis"]},"de":{"title":"Konditionalsätze mit falls","lead":"Wenn du planst, was passieren könnte, hilft dir `falls` mit der Bedeutung „für den Fall, dass“. Lern, den Satz in Bedingung und Folge zu teilen und jedes Verb an seine Position zu setzen.","steps":[{"text":"Bestimme das unsichere Ereignis","why":"Die Bedingung ist der Regen. Er kann kommen oder nicht. Mit `falls` stellst du ihn als mögliche – oft eher unwahrscheinliche – Situation dar."},{"text":"Schreib die Bedingung als Nebensatz","why":"Setz `falls` an den Anfang und das konjugierte Verb `regnet` ans Ende. Bei trennbaren Verben sagst du `falls sie morgen anruft` – zusammengeschrieben am Ende."},{"text":"Beginne die Folge mit dem Verb, wenn die Bedingung vorne steht","why":"Die ganze Bedingung besetzt Position 1 des Gesamtsatzes, deshalb kommt `bleiben` direkt nach dem Komma. Mit `dann` kannst du die Folge betonen: `…, dann bleiben wir zu Hause`."},{"text":"Stell die Folge bei Bedarf nach vorn","why":"Der Hauptsatz behält seine normale Wortstellung, der Nebensatz endet weiter mit dem Verb. Mit einem Infinitiv steht das konjugierte Verb ganz am Ende: `falls du kommen kannst`."}],"explain":["Für eine offene Bedingung kannst du auch `wenn` benutzen; es ist allgemeiner und deckt auch zeitliche Beziehungen ab. `falls` betont eher die Vorsorge und steht mit `doch`, wenn etwas gegen die Erwartung eintritt: `Falls es doch regnet, nehmen wir Schirme mit`. Schau dir die Lektion zu irrealen Bedingungen an, wenn die Bedingung der Wirklichkeit widerspricht, statt offen zu sein."],"pitfall":"Setz `brauchst` ans Ende der Bedingung. Die Folge im Imperativ `ruf mich an` behält ihre Wortstellung.","recall":["Steht `kannst` in `falls du morgen kommen kannst` vor `kommen`?","Nein, `kannst` steht zuletzt, weil es das konjugierte Verb im Nebensatz ist."],"linkTitles":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc","Konditionalsätze · grammis"]}},"questions":[{"id":"falls-1","type":"cloze","difficulty":1,"text":"Falls sie morgen {{1}}, sag mir Bescheid.","blanks":[["anruft"]],"i18n":{"ar":{"prompt":"ضع الفعل anrufen في الفراغ.","explain":"ينتهي الشرط بالفعل المصرف المتصل anruft.","hints":["هل الفعل قابل للفصل في التابعة؟"]},"de":{"prompt":"Setz das Verb `anrufen` in die Lücke.","explain":"Die Bedingung endet mit dem konjugierten, zusammengeschriebenen Verb `anruft`.","hints":["Ist das Verb im Nebensatz getrennt?"]}}},{"id":"falls-2","type":"mcq","difficulty":1,"options":["falls","weil","obwohl"],"answer":0,"i18n":{"ar":{"prompt":"أي رابط يعبّر عن «في حال»؟","explain":"falls للشرط، وweil للسبب، وobwohl للتنازل.","hints":["ابحث عن شرط ممكن."]},"de":{"prompt":"Welche Konjunktion bedeutet „für den Fall, dass“?","explain":"`falls` für eine Bedingung, `weil` für einen Grund, `obwohl` für einen Gegensatz.","hints":["Such eine mögliche Bedingung."]}}},{"id":"falls-3","type":"cloze","difficulty":1,"text":"Falls es schneit, {{1}} wir zu Hause.","blanks":[["bleiben"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المصرف bleiben.","explain":"يأتي الفعل المصرف مباشرة بعد الفاصلة ما لم تستعمل dann.","hints":["الجملة التابعة الأولى تشغل موقعًا واحدًا."]},"de":{"prompt":"Ergänze die konjugierte Form von `bleiben`.","explain":"Das konjugierte Verb steht direkt nach dem Komma, außer du benutzt `dann`.","hints":["Der Nebensatz vorne besetzt genau eine Position."]}}},{"id":"falls-4","type":"order","difficulty":2,"items":["Falls","du","heute","Zeit hast,","besuchen","wir dich."],"i18n":{"ar":{"prompt":"رتّب الشرط قبل النتيجة. اجعل du قبل heute.","explain":"hast يغلق التابعة. besuchen يفتتح النتيجة بعد الفاصلة.","hints":["ضع الفعل المصرف لكل جزء في موقعه."]},"de":{"prompt":"Ordne: Bedingung vor der Folge. Setz `du` vor `heute`.","explain":"`hast` schließt den Nebensatz. `besuchen` eröffnet die Folge nach dem Komma.","hints":["Setz das konjugierte Verb jedes Teils an seine Position."]}}},{"id":"falls-5","type":"cloze","difficulty":2,"text":"Ruf an, falls du nicht {{1}} {{2}}. (kommen / können)","blanks":[["kommen"],["kannst"]],"i18n":{"ar":{"prompt":"أكمل الشرط بالمصدر ثم الفعل الناقص المصرف.","explain":"المصدر kommen ثم kannst مع du.","hints":["يأتي المصرف أخيرًا في التابعة هنا."]},"de":{"prompt":"Ergänze die Bedingung mit dem Infinitiv und dann dem konjugierten Modalverb.","explain":"Erst der Infinitiv `kommen`, dann `kannst` mit `du`.","hints":["Das konjugierte Verb steht hier im Nebensatz zuletzt."]}}},{"id":"falls-6","type":"mcq","difficulty":2,"options":["Falls ich morgen Zeit habe, komme ich.","Wenn ich Zeit hätte, würde ich kommen.","Da ich morgen Zeit habe, komme ich."],"answer":0,"i18n":{"ar":{"prompt":"اختر الجملة التي تعرض احتمالًا مفتوحًا بشأن الغد.","explain":"falls يعرض احتمالًا. hätte وwürde هنا يقدمان افتراضًا غير واقعي، وda يذكر سببًا.","hints":["هل الوقت احتمال، أو واقع مفترض، أو سبب معلوم؟"]},"de":{"prompt":"Wähle den Satz, der eine offene Möglichkeit für morgen ausdrückt.","explain":"`falls` zeigt eine Möglichkeit. `hätte` und `würde` stellen hier eine irreale Annahme dar, `da` nennt einen Grund.","hints":["Ist die Zeit eine Möglichkeit, eine angenommene Wirklichkeit oder ein bekannter Grund?"]}}},{"id":"falls-7","type":"text","difficulty":3,"answer":"Falls ich Hilfe brauche, rufe ich dich an.","i18n":{"ar":{"prompt":"أعد ترتيب Ich rufe dich an, falls ich Hilfe brauche بحيث تبدأ بـ Falls وتحتفظ بالمعنى.","explain":"ينتهي التابع بـ brauche. يبدأ الجزء الرئيسي بـ rufe، وتبقى an في نهايته.","hints":["ضع الشرط في الموضع الأول واستعد تركيب anrufen."]},"de":{"prompt":"Stell `Ich rufe dich an, falls ich Hilfe brauche` so um, dass der Satz mit `Falls` beginnt und die Bedeutung bleibt.","explain":"Der Nebensatz endet mit `brauche`. Der Hauptsatz beginnt mit `rufe`, und `an` bleibt an seinem Ende.","hints":["Setz die Bedingung auf Position 1 und bau `anrufen` wieder zusammen."]}}},{"id":"falls-8","type":"text","difficulty":3,"answer":"Falls du Hilfe brauchst, ruf mich an.","context":"Falls du brauchst Hilfe, ruf mich an.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"ضع `brauchst` آخر الشرط. تبقى نتيجة الأمر `ruf mich an` في ترتيبها.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Setz `brauchst` ans Ende der Bedingung. Die Folge im Imperativ `ruf mich an` behält ihre Wortstellung.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"falls-9","type":"text","difficulty":2,"answer":"تأتي `kannst` أخيرًا لأنها الفعل المصرف في الجملة التابعة.","i18n":{"ar":{"prompt":"هل تقع `kannst` قبل `kommen` في `falls du morgen kommen kannst`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Steht `kannst` in `falls du morgen kommen kannst` vor `kommen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"sonst","level":"B1.1","island":"konjunktiv-bedingung","order":2,"prereqs":[],"emoji":"🚦","german":"Satzverbindendes Adverb andernfalls / sonst","source":{"lektion":6,"kind":"toc"},"pattern":["Aufforderung / Aussage",",","sonst + Verb + Subjekt …"],"frames":[{"k":"main","parts":[["v","Beeil"],["mf","dich"]]},{"k":"main","parts":[["vf","sonst"],["v","verpasst"],["mf","du den Bus"]]}],"example":"Beeil dich, sonst verpasst du den Bus.","stepExamples":["Wenn du dich nicht beeilst, verpasst du den Bus.","…, sonst verpasst du den Bus.","Bitte zahlen Sie heute. Andernfalls wird die Bestellung storniert.","Du musst leise sein. Du weckst sonst das Kind."],"pitfallPair":"Schick die Rechnung, sonst ich kann nicht zahlen. → Schick die Rechnung, sonst kann ich nicht zahlen.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/konnektoren/406877"],"i18n":{"ar":{"title":"وإلّا: نتيجة عدم فعل شيء","lead":"حين تحذّر من نتيجة قد تحصل إذا لم يُنفَّذ أمر، استعمل `sonst` أو `andernfalls`. معنى الربط هنا قريب من «وإلا» أو «في الحالة الأخرى».","translation":"أسرع، وإلّا فاتتك الحافلة.","steps":[{"text":"استخرج الشرط الضمني","why":"تفهم من التحذير أن الفوات مرتبط بعدم الإسراع. يحل الرابط محل إعادة ذكر الشرط المنفي. وقد تشير الجملة الأولى أيضًا إلى شرط كافٍ للنجاح، مثل `Du musst dich anmelden`."},{"text":"ابدأ الرئيسية الثانية بالرابط ثم الفعل","why":"تحتل `sonst` الموقع الأول، و`verpasst` الثاني. هذا الترتيب مهم عند التحويل من جملة شرطية إلى رابط ظرفي."},{"text":"استعمل andernfalls بنفس الوظيفة","why":"تشيع `andernfalls` في اللغة الرسمية. يمكن أن يبدأ الرابط جملةً مستقلة بعد نقطة، أو أن يفصل بين الجملتين بفاصلة في مثال مناسب."},{"text":"تعرّف إلى موقع الظرف داخل الجملة","why":"قد يأتي الرابط وسط الجملة بعد الفعل المصرف. وانتبه إلى معنى `sonst` في `Was machst du sonst?`، حيث يقصد ما تفعله أيضًا أو عادةً بحسب السياق."}],"explain":["قارن `Nimm den Schirm, sonst wirst du nass` و`Es regnet, deshalb nehme ich den Schirm`. الأولى تحذّر مما يقع عند عدم أخذ المظلة. الثانية تستنتج أخذها من حالة قائمة هي المطر. استعمل `sonst` عندما تستطيع صياغة الشرط الخفي بـ `wenn nicht`."],"pitfall":"إذا بدأت الجملة الثانية بـ `sonst` فضع الفعل المصرف `kann` مباشرة بعدها.","recall":["ما الشرط الضمني في `Ruf vorher an, andernfalls ist niemand da`؟","إذا لم تتصل مسبقًا، فلن يكون هناك أحد بحسب التحذير."],"linkTitles":["فهرس قواعد الوحدة 6 · telc، ص 3","حلول الكتاب الرسمية · telc","معنى sonst · grammis"]},"de":{"title":"sonst / andernfalls","lead":"Willst du vor einer Folge warnen, die eintritt, wenn etwas nicht getan wird, benutze `sonst` oder `andernfalls`. Die Bedeutung ist „wenn nicht“ bzw. „im anderen Fall“.","steps":[{"text":"Finde die versteckte Bedingung","why":"Aus der Warnung verstehst du: Den Bus verpasst man, wenn man sich nicht beeilt. Das Wort ersetzt die verneinte Bedingung. Der erste Satz kann auch eine Bedingung für den Erfolg nennen: `Du musst dich anmelden`."},{"text":"Beginne den zweiten Hauptsatz mit dem Adverb, dann das Verb","why":"`sonst` steht auf Position 1, `verpasst` auf Position 2. Diese Reihenfolge ist wichtig, wenn du einen Bedingungssatz in ein verbindendes Adverb umformst."},{"text":"Benutze andernfalls mit derselben Funktion","why":"`andernfalls` ist in formeller Sprache häufig. Es kann nach einem Punkt einen neuen Satz beginnen oder – im passenden Beispiel – die Sätze mit Komma verbinden."},{"text":"Lerne die Position des Adverbs im Satz kennen","why":"Das Adverb kann auch im Mittelfeld nach dem konjugierten Verb stehen. Achte auf die Bedeutung von `sonst` in `Was machst du sonst?`: Hier heißt es je nach Kontext „außerdem“ oder „normalerweise“."}],"explain":["Vergleiche `Nimm den Schirm, sonst wirst du nass` und `Es regnet, deshalb nehme ich den Schirm`. Der erste Satz warnt vor der Folge, wenn man den Schirm nicht nimmt. Der zweite zieht eine Folgerung aus einer bestehenden Situation, dem Regen. Benutze `sonst`, wenn du die versteckte Bedingung mit `wenn nicht` formulieren kannst."],"pitfall":"Beginnt der zweite Satz mit `sonst`, steht das konjugierte Verb `kann` direkt danach.","recall":["Welche Bedingung steckt in `Ruf vorher an, andernfalls ist niemand da`?","Wenn du nicht vorher anrufst, ist laut der Warnung niemand da."],"linkTitles":["Grammatikübersicht Lektion 6 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Bedeutung von sonst · grammis"]}},"questions":[{"id":"sonst-1","type":"cloze","difficulty":1,"text":"Beeil dich, sonst {{1}} du den Bus.","blanks":[["verpasst"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المصرف verpassen.","explain":"بعد sonst يأتي الفعل المصرف، ثم du.","hints":["sonst تشغل الموقع الأول في الجزء الثاني."]},"de":{"prompt":"Ergänze die konjugierte Form von `verpassen`.","explain":"Nach `sonst` kommt das konjugierte Verb, dann `du`.","hints":["`sonst` besetzt im zweiten Teil Position 1."]}}},{"id":"sonst-2","type":"cloze","difficulty":1,"text":"Bitte zahlen Sie heute. {{1}} wird der Auftrag storniert.","blanks":[["Andernfalls"]],"i18n":{"ar":{"prompt":"أكمل بمرادف رسمي لـ sonst.","explain":"Andernfalls يؤدي المعنى نفسه ويستعمل كثيرًا في اللغة الرسمية.","hints":["ابحث عن ظرف رسمي يعني «وإلا»."]},"de":{"prompt":"Ergänze ein formelles Synonym für `sonst`.","explain":"`Andernfalls` hat dieselbe Bedeutung und ist in formeller Sprache häufig.","hints":["Such ein formelles Adverb mit der Bedeutung „wenn nicht“."]}}},{"id":"sonst-3","type":"mcq","difficulty":1,"answer":0,"i18n":{"ar":{"prompt":"أي شرط يختبئ في Ruf an, sonst weiß ich nichts؟","explain":"النتيجة متوقفة على عدم الاتصال، لذلك الشرط المنفي هو الصحيح.","hints":["أعد كتابة الرابط بمعنى wenn nicht."],"options":["إذا لم تتصل.","إذا اتصلت.","لأنك اتصلت بالفعل."]},"de":{"prompt":"Welche Bedingung steckt in `Ruf an, sonst weiß ich nichts`?","explain":"Die Folge hängt davon ab, dass man nicht anruft – deshalb ist die verneinte Bedingung richtig.","hints":["Formuliere das Adverb als `wenn nicht`."],"options":["Wenn du nicht anrufst.","Wenn du anrufst.","Weil du schon angerufen hast."]}}},{"id":"sonst-4","type":"order","difficulty":2,"items":["sonst","kann","ich","die Bestellung","nicht ändern."],"i18n":{"ar":{"prompt":"رتّب الجزء الثاني بعد الفاصلة. ابدأ بـ sonst ثم الفعل.","explain":"kann يأتي بعد sonst. ويظهر المصدر ändern في نهاية الجملة.","hints":["ضع المصرف بعد الرابط، والمصدر في الآخر."]},"de":{"prompt":"Ordne den zweiten Teil nach dem Komma. Beginne mit `sonst`, dann das Verb.","explain":"`kann` steht nach `sonst`, der Infinitiv `ändern` am Satzende.","hints":["Setz das konjugierte Verb nach das Adverb und den Infinitiv ans Ende."]}}},{"id":"sonst-5","type":"mcq","difficulty":2,"options":["sonst","deshalb","denn"],"answer":0,"i18n":{"ar":{"prompt":"أي رابط يوضح نتيجة عدم ارتداء المعطف؟ Zieh den Mantel an, … frierst du.","explain":"sonst للتحذير الشرطي. deshalb نتيجة لسبب قائم، وdenn يذكر تفسيرًا.","hints":["أعد الصياغة بـ «إن لم ترتده…»."]},"de":{"prompt":"Welches Wort zeigt die Folge, wenn man den Mantel nicht anzieht? `Zieh den Mantel an, … frierst du.`","explain":"`sonst` für eine Warnung mit Bedingung. `deshalb` nennt eine Folge aus einem bestehenden Grund, `denn` eine Erklärung.","hints":["Formuliere um: „Wenn du ihn nicht anziehst …“"]}}},{"id":"sonst-6","type":"cloze","difficulty":2,"text":"Du musst leise sein. Du {{1}} sonst das Kind. (wecken)","blanks":[["weckst"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المصرف وحدد موقعه.","explain":"لما تقدم الفاعل Du، يتبعه الفعل weckst، ويأتي sonst بعده.","hints":["sonst هنا في وسط الجملة."]},"de":{"prompt":"Ergänze das konjugierte Verb und bestimme seine Position.","explain":"Weil das Subjekt `Du` vorne steht, folgt das Verb `weckst`, und `sonst` steht danach.","hints":["`sonst` steht hier in der Satzmitte."]}}},{"id":"sonst-7","type":"text","difficulty":3,"answer":"Notier die Nummer, sonst vergisst du sie.","i18n":{"ar":{"prompt":"اختصر Wenn du die Nummer nicht notierst, vergisst du sie إلى تحذير يبدأ بـ Notier die Nummer ويستعمل sonst.","explain":"تدل sonst على نتيجة عدم اتباع الأمر. يأتي vergisst بعدها مباشرةً.","hints":["حوّل الشرط المنفي إلى أمر، وابدأ النتيجة بـ sonst."]},"de":{"prompt":"Kürze `Wenn du die Nummer nicht notierst, vergisst du sie` zu einer Warnung, die mit `Notier die Nummer` beginnt und `sonst` benutzt.","explain":"`sonst` zeigt die Folge, wenn man der Aufforderung nicht folgt. `vergisst` steht direkt danach.","hints":["Mach aus der verneinten Bedingung einen Imperativ und beginne die Folge mit `sonst`."]}}},{"id":"sonst-8","type":"text","difficulty":3,"answer":"Schick die Rechnung, sonst kann ich nicht zahlen.","context":"Schick die Rechnung, sonst ich kann nicht zahlen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"إذا بدأت الجملة الثانية بـ `sonst` فضع الفعل المصرف `kann` مباشرة بعدها.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Beginnt der zweite Satz mit `sonst`, steht das konjugierte Verb `kann` direkt danach.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"sonst-9","type":"text","difficulty":2,"answer":"إذا لم تتصل مسبقًا، فلن يكون هناك أحد بحسب التحذير.","i18n":{"ar":{"prompt":"ما الشرط الضمني في `Ruf vorher an, andernfalls ist niemand da`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Welche Bedingung steckt in `Ruf vorher an, andernfalls ist niemand da`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"irreale-bedingung","level":"B1.1","island":"konjunktiv-bedingung","order":3,"prereqs":[],"emoji":"💭","german":"Irreale Bedingungssätze","source":{"lektion":3,"kind":"sample"},"pattern":["Wenn … hätte / wäre",",","würde … + Infinitiv"],"frames":[{"k":"sub","parts":[["c","Wenn"],["mf","ich mehr Zeit"],["ve","hätte"]]},{"k":"main","parts":[["vf","(Wenn-Satz)"],["v","würde"],["mf","ich öfter"],["ve","kochen"]]}],"example":"Wenn ich mehr Zeit hätte, würde ich öfter kochen.","stepExamples":["Ich habe wenig Zeit. Ich koche selten.","Wenn ich mehr Zeit hätte, …","…, würde ich öfter kochen.","Ich könnte hier arbeiten, wenn das Zimmer größer wäre."],"pitfallPair":"Wenn ich mehr Zeit hätte, koche ich öfter. → Wenn ich mehr Zeit hätte, würde ich öfter kochen.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13","https://grammis.ids-mannheim.de/systematische-grammatik/997"],"i18n":{"ar":{"title":"الشرط غير الواقعي","lead":"تبدأ من وضع تعرف أنه غير متحقق الآن، مثل عدم امتلاك وقت، ثم تتخيّل نتيجته لو تغيّر. يظهر هذا البعد الافتراضي في صيغتي الشرط والنتيجة.","translation":"لو كان عندي وقت أكثر، لطبخت أكثر.","steps":[{"text":"حدّد الواقع قبل صياغة عكسه","why":"ضع أمامك الشرط والنتيجة المتخيلين. هنا يمتلك المتكلم قليلًا من الوقت ويتخيل حالة يكون فيها الوقت أكثر."},{"text":"اصنع الشرط بـ Konjunktiv II","why":"من `haben` تأتي `hätte`، ومن `sein` تأتي `wäre`. استخدمهما مباشرة. ويأتي الفعل المصرف في آخر الجزء الذي يبدأ بـ `wenn`."},{"text":"اصنع النتيجة الافتراضية","why":"مع أفعال كثيرة تستعمل `würde` المصرف ثم مصدر الفعل في النهاية. وإذا كانت النتيجة قدرةً فقل `könnte ich öfter kochen`. الفعل المصرف يأتي بعد الفاصلة إذا تقدم الشرط."},{"text":"راجع تصريف كل جزء عند تبديل ترتيبه","why":"يمكن تقديم النتيجة. حافظ على `könnte` في الموقع الثاني من الجملة الرئيسية و`wäre` في نهاية التابعة. وفي `wenn er hier arbeiten würde` تأتي `würde` بعد المصدر في هذا النمط."}],"explain":["احفظ الصيغ الشائعة بحسب الشخص: `ich hätte / du hättest / wir hätten`، `ich wäre / du wärst / wir wären`، `ich würde / du würdest / wir würden`، `ich könnte / du könntest / wir könnten`. وقارن `Falls ich morgen Zeit habe, komme ich` (احتمال مفتوح) مع `Wenn ich Zeit hätte, würde ich kommen` (يُفهم من السياق أن وقتي غير متاح)."],"pitfall":"الشرط مبني على افتراض يخالف الواقع الحالي. يحمل `hätte` هذا المعنى في الشرط، ويحتاج فعل النتيجة أيضًا إلى `würde … kochen` في هذا النمط.","recall":["ماذا تفهم من `Wenn der Weg kürzer wäre, könnten wir laufen`؟","المسار طويل في الواقع بحسب المتكلم. إمكان المشي نتيجة افتراضية."],"linkTitles":["فهرس قواعد الوحدة 3 · telc، ص 2","شرح القواعد، ص 35 من الكتاب · telc","الشرط · grammis"],"table":[["الضمير","sein","haben","können","würde + Infinitiv"],["ich","wäre","hätte","könnte","würde"],["du","wärst / wärest","hättest","könntest","würdest"],["er / sie / es","wäre","hätte","könnte","würde"],["wir / sie / Sie","wären","hätten","könnten","würden"],["ihr","wärt / wäret","hättet","könntet","würdet"]]},"de":{"title":"Irreale Bedingungssätze","lead":"Du gehst von einer Situation aus, die jetzt nicht wahr ist – zum Beispiel, dass du keine Zeit hast – und stellst dir die Folge vor, wenn sie sich ändern würde. Dieses „Als-ob“ zeigt sich in Bedingung und Folge.","steps":[{"text":"Bestimme die Wirklichkeit, bevor du sie umdrehst","why":"Leg dir Bedingung und vorgestellte Folge zurecht. Hier hat die Person wenig Zeit und stellt sich vor, sie hätte mehr."},{"text":"Bilde die Bedingung im Konjunktiv II","why":"Aus `haben` wird `hätte`, aus `sein` wird `wäre` – benutze sie direkt. Das konjugierte Verb steht am Ende des `wenn`-Teils."},{"text":"Bilde die vorgestellte Folge","why":"Bei vielen Verben benutzt du konjugiertes `würde` und den Infinitiv am Ende. Geht es um eine Möglichkeit, sag `könnte ich öfter kochen`. Steht die Bedingung vorne, kommt das konjugierte Verb direkt nach dem Komma."},{"text":"Prüfe die Formen, wenn du die Reihenfolge tauschst","why":"Die Folge kann auch vorne stehen. `könnte` bleibt auf Position 2 im Hauptsatz, `wäre` am Ende des Nebensatzes. In `wenn er hier arbeiten würde` steht `würde` nach dem Infinitiv."}],"explain":["Lern die häufigen Formen nach Person: `ich hätte / du hättest / wir hätten`, `ich wäre / du wärst / wir wären`, `ich würde / du würdest / wir würden`, `ich könnte / du könntest / wir könnten`. Vergleiche `Falls ich morgen Zeit habe, komme ich` (offene Möglichkeit) mit `Wenn ich Zeit hätte, würde ich kommen` (aus dem Kontext: Ich habe keine Zeit)."],"pitfall":"Die Bedingung beruht auf einer Annahme gegen die Wirklichkeit. `hätte` trägt diese Bedeutung in der Bedingung – auch die Folge braucht in diesem Muster `würde … kochen`.","recall":["Was verstehst du aus `Wenn der Weg kürzer wäre, könnten wir laufen`?","In Wirklichkeit ist der Weg lang (laut Sprecher). Dass man laufen könnte, ist nur eine vorgestellte Folge."],"linkTitles":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc","Konditionalsätze · grammis"],"table":[["Pronomen","sein","haben","können","würde + Infinitiv"],["ich","wäre","hätte","könnte","würde"],["du","wärst / wärest","hättest","könntest","würdest"],["er / sie / es","wäre","hätte","könnte","würde"],["wir / sie / Sie","wären","hätten","könnten","würden"],["ihr","wärt / wäret","hättet","könntet","würdet"]]}},"questions":[{"id":"irreale-bedingung-1","type":"cloze","difficulty":1,"text":"Wenn ich genug Geld {{1}}, würde ich reisen.","blanks":[["hätte"]],"i18n":{"ar":{"prompt":"ضع haben في صيغة الافتراض.","explain":"hätte هي Konjunktiv II للمفرد الأول من haben.","hints":["استعمل الصيغة القصيرة الشائعة من haben."]},"de":{"prompt":"Setz `haben` in die irreale Form.","explain":"`hätte` ist der Konjunktiv II von `haben` in der 1. Person Singular.","hints":["Benutze die kurze, häufige Form von `haben`."]}}},{"id":"irreale-bedingung-2","type":"cloze","difficulty":1,"text":"Wenn das Büro näher {{1}}, würde ich laufen.","blanks":[["wäre"]],"i18n":{"ar":{"prompt":"ضع sein في صيغة الافتراض.","explain":"wäre هي الصيغة مع das Büro المفرد.","hints":["استعمل الصيغة الشائعة من sein."]},"de":{"prompt":"Setz `sein` in die irreale Form.","explain":"`wäre` ist die Form mit dem Singular `das Büro`.","hints":["Benutze die häufige Form von `sein`."]}}},{"id":"irreale-bedingung-3","type":"mcq","difficulty":1,"options":["Wenn der Stadtteil ruhiger wäre, würde ich dort wohnen.","Falls der Stadtteil ruhig ist, ziehe ich dorthin.","Weil der Stadtteil ruhig ist, wohne ich dort."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة تعني أن الحي غير هادئ في الواقع؟","explain":"wäre وwürde يعرضان وضعًا متخيلًا. falls يترك الاحتمال مفتوحًا، وweil يقرّر سببًا.","hints":["ابحث عن الافتراض المضاد للواقع."]},"de":{"prompt":"Welcher Satz bedeutet, dass das Viertel in Wirklichkeit nicht ruhig ist?","explain":"`wäre` und `würde` stellen eine vorgestellte Situation dar. `falls` lässt die Möglichkeit offen, `weil` nennt einen Grund.","hints":["Such die Annahme gegen die Wirklichkeit."]}}},{"id":"irreale-bedingung-4","type":"cloze","difficulty":2,"text":"Wenn die Räume größer {{1}}, {{2}} wir dort üben.","blanks":[["wären"],["könnten"]],"i18n":{"ar":{"prompt":"اكتب الصيغة من sein ثم können.","explain":"wären توافق die Räume، وkönnten توافق wir. يأتي könnte بصيغة الجمع بعد الفاصلة.","hints":["تحقق من الجمع في الجملتين."]},"de":{"prompt":"Schreib die Form von `sein` und dann von `können`.","explain":"`wären` passt zu `die Räume`, `könnten` zu `wir`. Nach dem Komma steht die Pluralform.","hints":["Prüf den Plural in beiden Sätzen."]}}},{"id":"irreale-bedingung-5","type":"order","difficulty":2,"items":["Wenn ich","mehr Zeit","hätte,","würde ich","jeden Tag","kochen."],"i18n":{"ar":{"prompt":"رتّب الشرط قبل النتيجة.","explain":"hätte قبل الفاصلة، وبعدها würde ثم الفاعل، وينتهي الجزء بـ kochen.","hints":["حدّد أين ينتهي الشرط وأين يأتي المصدر."]},"de":{"prompt":"Ordne: Bedingung vor der Folge.","explain":"`hätte` steht vor dem Komma, danach `würde`, dann das Subjekt, und der Teil endet mit `kochen`.","hints":["Bestimme, wo die Bedingung endet und wo der Infinitiv steht."]}}},{"id":"irreale-bedingung-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"أين الخطأ في Wenn sie länger hier bleiben würde, lernt sie mehr، إذا أردت افتراضًا في الجانبين؟","explain":"في الافتراض المتسق نقول …, würde sie mehr lernen. الجزء الأول فيه Konjunktiv II بالفعل.","hints":["أي فعل بقي في صيغة الواقع؟"],"options":["حوّل lernt إلى würde … lernen.","حوّل würde إلى wird مع إبقاء lernt.","ضع bleiben قبل sie مباشرةً."]},"de":{"prompt":"Wo ist der Fehler in `Wenn sie länger hier bleiben würde, lernt sie mehr`, wenn beide Teile irreal sein sollen?","explain":"Konsequent irreal heißt es: `…, würde sie mehr lernen`. Der erste Teil hat schon Konjunktiv II.","hints":["Welches Verb steht noch im Indikativ?"],"options":["`lernt` muss zu `würde … lernen` werden.","`würde` muss zu `wird` werden, `lernt` bleibt.","`bleiben` muss direkt vor `sie` stehen."]}}},{"id":"irreale-bedingung-7","type":"text","difficulty":3,"answer":"Wenn du hier wärst, könnten wir zusammen lernen.","i18n":{"ar":{"prompt":"عبّر عن العكس الافتراضي. Du bist nicht hier. Wir können nicht zusammen lernen. ابدأ بـ Wenn du.","explain":"wärst تتبع du وتنهي الشرط. könnten تتبع wir وتأتي مباشرة بعد الفاصلة.","hints":["استعمل Konjunktiv II لكل من sein وkönnen."]},"de":{"prompt":"Drück das irreale Gegenteil aus: `Du bist nicht hier. Wir können nicht zusammen lernen.` Beginne mit `Wenn du`.","explain":"`wärst` passt zu `du` und beendet die Bedingung. `könnten` passt zu `wir` und steht direkt nach dem Komma.","hints":["Benutze den Konjunktiv II von `sein` und `können`."]}}},{"id":"irreale-bedingung-8","type":"text","difficulty":3,"answer":"Wenn ich mehr Zeit hätte, würde ich öfter kochen.","context":"Wenn ich mehr Zeit hätte, koche ich öfter.","i18n":{"ar":{"prompt":"اجعل الشرط والنتيجة غير واقعيين. صحّح الجملة واشرح سبب التعديل.","explain":"الشرط مبني على افتراض يخالف الواقع الحالي. يحمل `hätte` هذا المعنى في الشرط، ويحتاج فعل النتيجة أيضًا إلى `würde … kochen` في هذا النمط.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Mach Bedingung und Folge irreal. Korrigiere den Satz und erkläre die Änderung.","explain":"Die Bedingung beruht auf einer Annahme gegen die Wirklichkeit. `hätte` trägt diese Bedeutung in der Bedingung – auch die Folge braucht in diesem Muster `würde … kochen`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"irreale-bedingung-9","type":"text","difficulty":2,"answer":"المسار طويل في الواقع بحسب المتكلم. إمكان المشي نتيجة افتراضية.","i18n":{"ar":{"prompt":"ماذا تفهم من `Wenn der Weg kürzer wäre, könnten wir laufen`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Was verstehst du aus `Wenn der Weg kürzer wäre, könnten wir laufen`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"konjunktiv2-vergangenheit","level":"B1.2","island":"konjunktiv-bedingung","order":4,"prereqs":["irreale-bedingung","plusquamperfekt"],"emoji":"🕳️","german":"Irreale Bedingungssätze mit Konjunktiv II der Vergangenheit","source":{"lektion":11,"kind":"toc"},"pattern":["wenn","…","Partizip II","+","hätte / wäre",",","hätte / wäre","…","Partizip II"],"frames":[{"k":"sub","parts":[["c","Wenn"],["mf","ich das"],["ve","gewusst hätte"]]},{"k":"main","parts":[["vf","Wenn ich das gewusst hätte,"],["v","wäre"],["mf","ich früher"],["ve","gekommen"]]},{"k":"main","parts":[["v","Hätte"],["mf","ich das"],["ve","gewusst"]]}],"example":"Wenn ich das gewusst hätte, wäre ich früher gekommen.","stepExamples":["Ich wusste es nicht. Ich bin nicht früher gekommen.","Wenn ich das gewusst hätte, …","…, wäre ich früher gekommen.","Hätte ich das gewusst, wäre ich früher gekommen.","Wenn ich Zeit hätte, würde ich kommen. ↔ Wenn ich Zeit gehabt hätte, wäre ich gekommen."],"pitfallPair":"Wenn ich Zeit gehabt hätte, würde ich gekommen. → Wenn ich Zeit gehabt hätte, wäre ich gekommen.","links":["https://grammis.ids-mannheim.de/systematische-grammatik/997","https://grammis.ids-mannheim.de/terminologie/401"],"i18n":{"ar":{"title":"لو أنّ… في الماضي","lead":"لم تعرف بالخبر، فلم تأتِ مبكرًا. الماضي لا يتغير، لكنك تستطيع أن تتخيل كيف كان يمكن أن يكون: «لو عرفتُ لجئتُ». لهذا تستعمل `hätte` أو `wäre` مع `Partizip II` في الجملتين.","translation":"لو عرفتُ ذلك لجئتُ مبكرًا.","steps":[{"text":"ابدأ بالواقع","why":"الواقع: لم أعرف ولم آتِ مبكرًا. الجملة الشرطية ستقلب هذا الواقع في الخيال."},{"text":"الشرط: wenn + Partizip II + hätte أو wäre","why":"الصيغة مثل `Plusquamperfekt`، لكن المساعد في صيغة التمني: `hatte` تصير `hätte` و`war` تصير `wäre`. والمساعد في آخر جملة `wenn`."},{"text":"النتيجة: hätte أو wäre + Partizip II","why":"بعد الفاصلة يبدأ الفعل المساعد `wäre` ثم الفاعل، و`gekommen` في الآخر. `kommen` يأخذ `sein`، فنقول `wäre`."},{"text":"بدون wenn يبدأ الشرط بالفعل","why":"`Hätte ich das gewusst, …` لها المعنى نفسه. الفعل المساعد ينتقل إلى أول الجملة، وهي صيغة شائعة في الكلام."},{"text":"قارن مع الحاضر","why":"للحاضر: `hätte` و`würde` + مصدر. وللماضي: `hätte` أو `wäre` + `Partizip II`، ولا تأتي `würde` هنا."}],"explain":["في الماضي توجد صيغة واحدة للتمني: `hätte` أو `wäre` مع `Partizip II`. اختيار المساعد هو نفسه في `Perfekt`: `haben` يصير `hätte`، و`sein` يصير `wäre`.","تستعمل الصيغة نفسها للندم والتمني: `Ich hätte mehr lernen sollen.` و`Wenn ich doch nur angerufen hätte!`"],"pitfall":"في الماضي لا تأتي `würde` مع `Partizip II`. النتيجة تحتاج إلى `hätte` أو `wäre`.","recall":["ما الواقع وراء `Wenn der Bus pünktlich gewesen wäre, hätte ich den Zug erreicht`؟","الحافلة تأخرت، ولم ألحق بالقطار."],"linkTitles":["الجملة الشرطية · grammis","صيغة التمني Konjunktiv II · grammis"],"table":[["الزمن","الشرط","النتيجة"],["الحاضر","Wenn ich Zeit hätte,","würde ich kommen."],["الماضي مع haben","Wenn ich Zeit gehabt hätte,","hätte ich dich besucht."],["الماضي مع sein","Wenn ich früher losgefahren wäre,","wäre ich pünktlich gewesen."]]},"de":{"title":"Irreale Bedingungssätze mit Konjunktiv II der Vergangenheit","lead":"Du wusstest es nicht und bist nicht früher gekommen. Die Vergangenheit lässt sich nicht ändern, aber du kannst dir vorstellen, wie es hätte sein können. Dafür nimmst du in beiden Satzteilen `hätte` oder `wäre` + Partizip II.","steps":[{"text":"Beginne mit der Realität","why":"Real: Ich wusste es nicht und kam nicht früher. Der Bedingungssatz dreht diese Realität in der Vorstellung um."},{"text":"Die Bedingung: wenn + Partizip II + hätte oder wäre","why":"Die Form ist wie das Plusquamperfekt, nur steht das Hilfsverb im Konjunktiv II: `hatte` wird `hätte`, `war` wird `wäre`. Das Hilfsverb steht am Ende des wenn-Satzes."},{"text":"Die Folge: hätte oder wäre + Partizip II","why":"Nach dem Komma steht zuerst `wäre`, dann das Subjekt, `gekommen` am Ende. `kommen` bildet das Perfekt mit `sein`, also `wäre`."},{"text":"Ohne wenn steht das Verb vorn","why":"`Hätte ich das gewusst, …` bedeutet dasselbe. Das Hilfsverb rückt an den Satzanfang. Das ist sehr häufig."},{"text":"Vergleiche mit der Gegenwart","why":"Gegenwart: `hätte` und `würde` + Infinitiv. Vergangenheit: `hätte` oder `wäre` + Partizip II, hier steht kein `würde`."}],"explain":["Für die Vergangenheit gibt es im Konjunktiv II nur eine Form: `hätte` oder `wäre` + Partizip II. Das Hilfsverb wählst du wie im Perfekt.","Dieselbe Form drückt Bedauern und unerfüllte Wünsche aus: `Ich hätte mehr lernen sollen.`, `Wenn ich doch nur angerufen hätte!`"],"pitfall":"In der Vergangenheit steht kein `würde` mit Partizip II. Die Folge braucht `hätte` oder `wäre`.","recall":["Was ist die Realität hinter `Wenn der Bus pünktlich gewesen wäre, hätte ich den Zug erreicht`?","Der Bus war unpünktlich, und ich habe den Zug verpasst."],"linkTitles":["Konditionalgefüge · grammis","Konjunktiv II · grammis"],"table":[["Zeit","Bedingung","Folge"],["Gegenwart","Wenn ich Zeit hätte,","würde ich kommen."],["Vergangenheit mit haben","Wenn ich Zeit gehabt hätte,","hätte ich dich besucht."],["Vergangenheit mit sein","Wenn ich früher losgefahren wäre,","wäre ich pünktlich gewesen."]]}},"questions":[{"id":"konjunktiv2-vergangenheit-1","type":"cloze","difficulty":1,"text":"Wenn du mich gefragt {{1}}, hätte ich dir geholfen.","blanks":[["hättest"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد في صيغة التمني.","explain":"`fragen` يأخذ `haben`، ومع `du`: `hättest`.","hints":["المساعد في آخر جملة `wenn`."]},"de":{"prompt":"Ergänze das Hilfsverb im Konjunktiv II.","explain":"`fragen` bildet das Perfekt mit `haben`. Mit `du`: `hättest`.","hints":["Das Hilfsverb steht am Ende des wenn-Satzes."]}}},{"id":"konjunktiv2-vergangenheit-2","type":"cloze","difficulty":1,"text":"Wenn wir den Bus nicht verpasst hätten, {{1}} wir pünktlich angekommen.","blanks":[["wären"]],"i18n":{"ar":{"prompt":"أكمل بالفعل المساعد للنتيجة.","explain":"`ankommen` يأخذ `sein`، ومع `wir`: `wären`.","hints":["`Wir sind angekommen.`"]},"de":{"prompt":"Ergänze das Hilfsverb in der Folge.","explain":"`ankommen` bildet das Perfekt mit `sein`. Mit `wir`: `wären`.","hints":["`Wir sind angekommen.`"]}}},{"id":"konjunktiv2-vergangenheit-3","type":"mcq","difficulty":1,"options":["Sie hat nicht gelernt und hat die Prüfung nicht bestanden.","Sie hat gelernt und die Prüfung bestanden.","Sie lernt jetzt für die Prüfung."],"answer":0,"i18n":{"ar":{"prompt":"ما الواقع وراء `Wenn sie gelernt hätte, hätte sie die Prüfung bestanden`؟","explain":"الجملة تتخيل عكس الواقع: في الحقيقة لم تدرس ولم تنجح.","hints":["الجملة غير واقعية."]},"de":{"prompt":"Was ist die Realität hinter `Wenn sie gelernt hätte, hätte sie die Prüfung bestanden`?","explain":"Der Satz stellt sich das Gegenteil vor: In Wirklichkeit hat sie nicht gelernt und nicht bestanden.","hints":["Der Satz ist irreal."]}}},{"id":"konjunktiv2-vergangenheit-4","type":"cloze","difficulty":2,"text":"Wenn es nicht {{1}} {{2}}, wären wir an den See gefahren.","blanks":[["geregnet"],["hätte"]],"i18n":{"ar":{"prompt":"أكمل الشرط من الفعل `regnen`.","explain":"`regnen` يأخذ `haben`: `geregnet hätte`، و`Partizip II` قبل المساعد.","hints":["`Es hat geregnet.`"]},"de":{"prompt":"Ergänze die Bedingung mit `regnen`.","explain":"`regnen` bildet das Perfekt mit `haben`: `geregnet hätte`. Das Partizip steht vor dem Hilfsverb.","hints":["`Es hat geregnet.`"]}}},{"id":"konjunktiv2-vergangenheit-5","type":"order","difficulty":2,"items":["Hätte","ich den Wecker","gehört,","wäre","ich","nicht zu spät gekommen."],"i18n":{"ar":{"prompt":"رتّب الجملة بدون `wenn`. ابدأ بالفعل المساعد.","explain":"الشرط يبدأ بـ `Hätte`، ثم النتيجة تبدأ بـ `wäre`.","hints":["ابدأ بـ `Hätte`."]},"de":{"prompt":"Ordne den Satz ohne `wenn`. Beginne mit dem Hilfsverb.","explain":"Die Bedingung beginnt mit `Hätte`, die Folge mit `wäre`.","hints":["Beginne mit `Hätte`."]}}},{"id":"konjunktiv2-vergangenheit-6","type":"mcq","difficulty":2,"options":["Wenn ich mehr Geld gehabt hätte, hätte ich die Wohnung gekauft.","Wenn ich mehr Geld gehabt hätte, würde ich die Wohnung gekauft.","Wenn ich mehr Geld hatte, hätte ich die Wohnung gekauft."],"answer":0,"i18n":{"ar":{"prompt":"أي جملة صحيحة للحديث عن الماضي؟","explain":"الجملتان تحتاجان إلى `hätte` + `Partizip II`. لا تأتي `würde` مع `Partizip II`، ولا يكفي `hatte` في الشرط.","hints":["في الجملتين صيغة التمني."]},"de":{"prompt":"Welcher Satz über die Vergangenheit ist richtig?","explain":"Beide Teile brauchen `hätte` + Partizip II. `würde` steht nicht mit Partizip II, und `hatte` ist kein Konjunktiv.","hints":["Beide Teile stehen im Konjunktiv II."]}}},{"id":"konjunktiv2-vergangenheit-7","type":"text","difficulty":3,"answer":"Wenn ich nicht krank gewesen wäre, wäre ich zur Party gegangen.","i18n":{"ar":{"prompt":"حوّل الواقع إلى جملة غير واقعية مع `wenn`: `Ich war krank. Deshalb bin ich nicht zur Party gegangen.`","explain":"اقلب الواقع: `Wenn ich nicht krank gewesen wäre, wäre ich zur Party gegangen.` الفعلان `sein` و`gehen` يأخذان `wäre`.","hints":["`sein` و`gehen` يأخذان `sein` في `Perfekt`."]},"de":{"prompt":"Mach daraus einen irrealen wenn-Satz: `Ich war krank. Deshalb bin ich nicht zur Party gegangen.`","explain":"Dreh die Realität um: `Wenn ich nicht krank gewesen wäre, wäre ich zur Party gegangen.` `sein` und `gehen` bilden das Perfekt mit `sein`.","hints":["`sein` und `gehen` bilden das Perfekt mit `sein`."]}}},{"id":"konjunktiv2-vergangenheit-8","type":"text","difficulty":3,"context":"Wenn ich Zeit gehabt hätte, würde ich gekommen.","answer":"Wenn ich Zeit gehabt hätte, wäre ich gekommen.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"في الماضي تكون النتيجة `hätte` أو `wäre` مع `Partizip II`. `kommen` يأخذ `sein`، فنقول `wäre ich gekommen`.","hints":["هل تأتي `würde` مع `Partizip II`؟"]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"In der Vergangenheit heißt die Folge `hätte` oder `wäre` + Partizip II. `kommen` hat `sein`: `wäre ich gekommen`.","hints":["Steht `würde` mit Partizip II?"]}}},{"id":"konjunktiv2-vergangenheit-9","type":"text","difficulty":2,"answer":"Wenn ich früher Deutsch gelernt hätte, hätte ich schneller eine Arbeit gefunden.","i18n":{"ar":{"prompt":"اكتب جملة عن شيء تتمنى لو فعلته في الماضي. ابدأ بـ `Wenn ich früher …`","explain":"مثال: `Wenn ich früher Deutsch gelernt hätte, hätte ich schneller eine Arbeit gefunden.`","hints":["`hätte` في آخر الشرط وفي بداية النتيجة."]},"de":{"prompt":"Schreib einen Satz über etwas, das du früher gern anders gemacht hättest. Beginne mit `Wenn ich früher …`","explain":"Zum Beispiel: `Wenn ich früher Deutsch gelernt hätte, hätte ich schneller eine Arbeit gefunden.`","hints":["`hätte` steht am Ende der Bedingung und am Anfang der Folge."]}}}]},{"id":"konjunktiv2-vergangenheit-modal","level":"B1.2","island":"konjunktiv-bedingung","order":5,"prereqs":["konjunktiv2-vergangenheit","passiv-modal"],"emoji":"🧪","german":"Irreale Bedingungen in der Vergangenheit: Modalverb und Passiv","source":{"lektion":12,"kind":"sample"},"pattern":["hätte","+","Infinitiv","+","können / müssen / sollen"],"frames":[{"k":"main","parts":[["vf","Ich"],["v","hätte"],["mf","dir"],["ve","helfen können"]]},{"k":"sub","parts":[["c","wenn"],["mf","ich"],["v","hätte"],["ve","kommen dürfen"]]},{"k":"main","parts":[["vf","Der Fehler"],["v","wäre"],["mf","fast"],["ve","übersehen worden"]]}],"example":"Ohne dein Handy hätten wir den Weg nicht finden können.","stepExamples":["Ich konnte dir nicht helfen.","Ich hätte dir helfen können.","Wenn ich mehr Zeit gehabt hätte, hätte ich dir helfen können.","…, weil ich nicht hätte kommen dürfen.","Der Fehler wäre fast übersehen worden."],"pitfallPair":"Ich hätte kommen gekonnt. → Ich hätte kommen können.","links":["https://grammis.ids-mannheim.de/fragen/101","https://grammis.ids-mannheim.de/fragen/162"],"i18n":{"ar":{"title":"الشرط غير الواقعي في الماضي مع الأفعال الناقصة والمجهول","lead":"«كان بإمكاني أن أساعدك» و«كان يجب أن أتصل». حين تتكلم عن إمكانية أو واجب في الماضي لم يتحقق تستعمل `hätte` مع مصدرين. وللمجهول في الماضي غير الواقعي تستعمل `wäre … worden`.","translation":"لولا هاتفك لما استطعنا أن نجد الطريق.","steps":[{"text":"ابدأ بالواقع في الماضي","why":"`Ich konnte dir nicht helfen`: هذا ما حدث فعلًا."},{"text":"hätte + مصدر الفعل + مصدر الفعل الناقص","why":"في الماضي غير الواقعي يقف الفعل الناقص في صيغة المصدر بدل `Partizip II`: `hätte helfen können`، لا `gekonnt`. وتسمى هذه الظاهرة «المصدر البديل»."},{"text":"الصيغة نفسها في جملة الشرط","why":"يمكن أن تأتي الصيغة في النتيجة بعد شرط: `…, hätte ich dir helfen können.` الفعل المساعد `hätte` بعد الفاصلة ثم الفاعل، والمصدران في الآخر."},{"text":"في الجملة التابعة يتقدم hätte على المصدرين","why":"هذا استثناء مهم: لا يقف `hätte` في الآخر، بل قبل المصدرين: `weil ich nicht hätte kommen dürfen`."},{"text":"المجهول: wäre + Partizip II + worden","why":"`Der Fehler wäre fast übersehen worden` تعني «كاد الخطأ أن يُغفَل» لكنه لم يُغفل. `worden` هي صيغة `werden` في المجهول."}],"explain":["تستعمل هذه الصيغة كثيرًا للندم أو اللوم: `Du hättest mich anrufen sollen` أي «كان يجب أن تتصل بي». و`Wir hätten früher losfahren müssen` أي «كان علينا أن ننطلق أبكر».","مع `wäre … worden` تقول إن شيئًا كاد يحدث للشيء أو كان سيحدث له: `Ohne Hilfe wäre das Haus nicht fertig gebaut worden.`"],"pitfall":"مع مصدر آخر يبقى الفعل الناقص في صيغة المصدر: `hätte kommen können`، لا `gekonnt`.","recall":["ماذا تعني `Du hättest mir das sagen sollen`؟","كان يجب أن تخبرني بذلك، لكنك لم تفعل. فيها عتاب على الماضي."],"linkTitles":["المصدر البديل وترتيب الأفعال · grammis","صيغة التمني و würde · grammis"],"table":[["الحالة","الصيغة","مثال"],["جملة رئيسية","hätte … + مصدر + مصدر الفعل الناقص","Ich hätte früher kommen müssen."],["جملة تابعة","hätte + مصدر + مصدر الفعل الناقص في الآخر","…, dass ich früher hätte kommen müssen."],["المجهول","wäre … + Partizip II + worden","Das Haus wäre fast verkauft worden."]]},"de":{"title":"Irreale Bedingungen in der Vergangenheit mit Modalverb und Passiv","lead":"„Ich hätte dir helfen können“, „Ich hätte anrufen sollen“: Für eine Möglichkeit oder Pflicht in der Vergangenheit, die nicht real wurde, nimmst du `hätte` mit zwei Infinitiven. Für das irreale Passiv der Vergangenheit `wäre … worden`.","steps":[{"text":"Beginne mit der Realität in der Vergangenheit","why":"`Ich konnte dir nicht helfen`: So war es wirklich."},{"text":"hätte + Infinitiv + Modalverb im Infinitiv","why":"Im irrealen Perfekt steht das Modalverb im Infinitiv statt im Partizip II: `hätte helfen können`, nicht `gekonnt`. Das nennt man Ersatzinfinitiv."},{"text":"Dieselbe Form steht in der Folge eines wenn-Satzes","why":"`…, hätte ich dir helfen können.` Nach dem Komma kommt `hätte`, dann das Subjekt, die zwei Infinitive am Ende."},{"text":"Im Nebensatz steht hätte vor den zwei Infinitiven","why":"Wichtige Ausnahme: `hätte` steht nicht am Ende, sondern vor den Infinitiven: `weil ich nicht hätte kommen dürfen`."},{"text":"Das Passiv: wäre + Partizip II + worden","why":"`Der Fehler wäre fast übersehen worden` heißt: Es hätte fast passiert, ist aber nicht passiert. `worden` ist die Passivform von `werden`."}],"explain":["Diese Form drückt oft Bedauern oder Vorwurf aus: `Du hättest mich anrufen sollen.`, `Wir hätten früher losfahren müssen.`","Mit `wäre … worden` sagst du, was mit einer Sache beinahe passiert wäre oder passiert wäre: `Ohne Hilfe wäre das Haus nicht fertig gebaut worden.`"],"pitfall":"Mit einem zweiten Infinitiv bleibt das Modalverb im Infinitiv: `hätte kommen können`, nicht `gekonnt`.","recall":["Was bedeutet `Du hättest mir das sagen sollen`?","Es wäre richtig gewesen, es mir zu sagen, aber du hast es nicht getan – ein Vorwurf."],"linkTitles":["Ersatzinfinitiv und Verbstellung · grammis","Konjunktiv und würde-Form · grammis"],"table":[["Satz","Form","Beispiel"],["Hauptsatz","hätte … + Infinitiv + Modalverb","Ich hätte früh
