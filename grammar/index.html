/* Island map, stars and the four extra island palettes. */
:root {
  --sea: #dff1fb; --sea-deep: #c9e6f7; --sea-shallow: #eef9ff; --sand: #f7e7c2;
  --gold: #a87300; --gold-bg: #fff4d1; --gold-line: #ecd48a;
  --t-sky: #e0f3fd; --t-sand: #fbefd5; --t-coral: #ffe4dc; --t-teal: #dff5f2;
  --island-ink: #1c1a2b;
  --isle-green: #8fd19e; --isle-edge: #5aa36c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #14202b; --sea-deep: #101a24; --sea-shallow: #1b2c3a; --sand: #4a4130;
    --gold: #f2c94c; --gold-bg: #3a3115; --gold-line: #6b5a22;
    --t-sky: #1b3140; --t-sand: #3a3220; --t-coral: #40251f; --t-teal: #17332f;
    --island-ink: #ecebf5;
    --isle-green: #2e6a4a; --isle-edge: #4c8f69;
  }
}
:root[data-theme="dark"] {
  --sea: #14202b; --sea-deep: #101a24; --sea-shallow: #1b2c3a; --sand: #4a4130;
  --gold: #f2c94c; --gold-bg: #3a3115; --gold-line: #6b5a22;
  --t-sky: #1b3140; --t-sand: #3a3220; --t-coral: #40251f; --t-teal: #17332f;
  --island-ink: #ecebf5;
  --isle-green: #2e6a4a; --isle-edge: #4c8f69;
}

/* Element defaults and shared utilities. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 450 17px/1.85 var(--font); text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
:root[lang="de"] body { line-height: 1.65; }
a { color: var(--brand-ink); text-decoration: none; }
a:hover { color: var(--brand); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.4; text-wrap: balance; color: var(--ink); }
:root[lang="de"] h1, :root[lang="de"] h2 { letter-spacing: -.015em; line-height: 1.2; }
h1 { font-size: clamp(30px, 4vw, 52px); font-weight: 800; }
h2 { font-size: clamp(19px, 1.8vw, 23px); font-weight: 760; }
h3 { font-size: 17px; font-weight: 720; }
small { font-size: 13px; }
[lang="de"], .de { font-family: var(--font-de); }
[lang="ar"] { font-family: var(--font); }
bdi[lang="de"] { unicode-bidi: isolate; }
.term { color: var(--brand-ink); background: var(--brand-soft); padding: .05em .38em; border-radius: .4em; overflow-wrap: anywhere; font-size: .93em; font-weight: 650; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.skip { position: fixed; top: -100px; inset-inline-start: 1rem; background: var(--surface); color: var(--ink); z-index: 20; padding: .75rem 1rem; border-radius: 10px; box-shadow: var(--shadow); }
.skip:focus { top: 1rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* Page frame: top bar, sidebar, main column and bottom navigation. */
/* Top bar */
.topbar { height: var(--head); background: var(--topbar); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 8; }
.top-inner { max-width: 1600px; margin: auto; padding: 0 clamp(14px, 3vw, 36px); height: 100%; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); line-height: 1.3; flex-shrink: 0; margin-inline-end: auto; }
.brand:hover { color: var(--ink); }
.brand strong { display: block; font-size: 15px; font-weight: 760; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.brand-icon { background: linear-gradient(140deg, var(--brand), #9b5de5); color: #fff; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; font: 800 15px/1 var(--font-de); letter-spacing: .02em; box-shadow: 0 6px 16px #5b3fd040; }
.top-nav { display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: var(--surface-3); }
.top-nav a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.top-nav a:hover { color: var(--ink); }
.top-nav a[aria-current] { background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow-sm); }
.nav-icon { font-size: 15px; line-height: 1; }
.top-tools { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--line); direction: ltr; }
.seg button { border: 0; background: none; min-width: 38px; height: 32px; padding: 0 9px; border-radius: 8px; font-size: 13px; font-weight: 750; color: var(--muted); }
.seg button[lang="ar"] { font-family: var(--font); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow-sm); }
.icon-btn { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); width: 40px; height: 40px; display: inline-grid; place-items: center; color: var(--ink-2); flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }
.theme-btn .moon { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .moon { display: block; }

/* Layout and sidebar */
.layout { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: minmax(255px, 300px) minmax(0, 1fr); }
.sidebar { position: sticky; top: var(--head); height: calc(100vh - var(--head)); height: calc(100dvh - var(--head)); border-inline-end: 1px solid var(--line); background: var(--surface-2); padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.side-heading, .side-footer div, .section-heading, .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.side-heading h2 { font-size: 16px; }
.side-heading span, .side-footer span { color: var(--muted); font-size: 12px; }
.search-label { display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.search-label svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.search-label:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search-label input { min-width: 0; width: 100%; border: 0; outline: 0; background: none; padding: 9px 0; font-size: 13px; }
.search-label input::placeholder { color: var(--muted); }
.index { flex: 1; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; padding: 3px 3px 6px; margin: -3px; }
.index details { margin-bottom: 4px; }
.index summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; cursor: pointer; padding: 7px 6px; border-radius: 10px; font-size: 14px; font-weight: 720; line-height: 1.5; }
.index summary::-webkit-details-marker { display: none; }
.index summary:hover { background: var(--surface-3); }
.sum-emoji { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; }
.chevron { transition: transform .18s; color: var(--muted); }
details[open] > summary .chevron { transform: rotate(180deg); }
.index-links { border-inline-start: 2px solid var(--line); margin-inline-start: 20px; padding-block: 2px 6px; padding-inline: 8px 0; }
.index-links a { display: flex; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.6; padding: 6px 8px; border-radius: 8px; color: var(--muted); }
.index-links a:hover { background: var(--surface-3); color: var(--ink); }
.index-links a[aria-current] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
.index-links .dot { font-size: 11px; color: var(--good); width: 10px; flex-shrink: 0; text-align: center; }
.side-footer { border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; }
progress { width: 100%; height: 8px; border: none; border-radius: 100px; background: var(--surface-3); accent-color: var(--brand); overflow: hidden; }
progress::-webkit-progress-bar { background: var(--surface-3); border-radius: 100px; }
progress::-webkit-progress-value { background: linear-gradient(90deg, var(--brand), #9b6cf0); border-radius: 100px; }
progress::-moz-progress-bar { background: var(--brand); border-radius: 100px; }
main { min-width: 0; padding: clamp(18px, 3vw, 40px); outline: none; }
#content, .page-foot { max-width: 1120px; margin-inline: auto; }
.page-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); margin-top: 32px; padding-top: 15px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.page-foot a, .sources a { text-decoration: underline; text-underline-offset: 3px; }
.menu-toggle, .shade, .bottom-nav { display: none; }

@media (max-width: 1110px) {
  .lesson-body { grid-template-columns: 1fr; }
  .lesson-side { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lesson-side .reading { grid-column: 1/-1; }
}
@media (max-width: 860px) {
  .layout { display: block; }
  .sidebar { display: none; width: min(340px, 88vw); height: calc(100dvh - var(--head)); position: fixed; inset-inline-start: 0; top: var(--head); z-index: 12; box-shadow: var(--shadow); }
  .sidebar.open { display: flex; }
  .shade { display: block; position: fixed; inset: var(--head) 0 0; z-index: 11; border: 0; background: var(--scrim); }
  .menu-toggle { display: inline-grid; }
  .top-nav { display: none; }
  .bottom-nav { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; inset-inline: 0; bottom: 0; z-index: 9; background: var(--topbar); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav a { display: grid; justify-items: center; gap: 1px; padding: 5px 4px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }
  .bottom-nav a .nav-icon { font-size: 19px; }
  .bottom-nav a[aria-current] { color: var(--brand-ink); background: var(--brand-soft); }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
}
@media (max-width: 560px) {
  :root { --head: 60px; }
  body { font-size: 16px; }
  .top-inner { padding: 0 10px; gap: 8px; }
  .brand { gap: 8px; }
  .brand-icon { width: 34px; height: 34px; font-size: 13px; border-radius: 10px; }
  .brand strong { font-size: 14px; }
  .brand small { font-size: 11px; }
  .seg button { min-width: 34px; padding: 0 7px; }
  main { padding: 14px 14px; }
  .units, .lesson-side, .launcher { grid-template-columns: 1fr; }
  .table-help { display: block; }
  .stats { gap: 6px; }
  .stat { padding: 9px 10px; }
  .stat strong { font-size: 20px; }
  .lesson-banner .unit-head { align-items: center; }
  .lesson-emoji { width: 42px; height: 42px; }
  .lesson-nav .btn { flex: 1 1 0; font-size: 13px; padding: 8px; }
  .slot b { font-size: 14.5px; }
}
@media (max-width: 430px) {
  .brand { flex-shrink: 1; min-width: 0; }
  .brand > span:last-child { min-width: 0; }
  .brand strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { display: none; }
}

/* Buttons, cards, panels and other shared pieces. */
/* Buttons */
.btn { border: 1px solid transparent; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; font-size: 14px; font-weight: 700; min-height: 44px; text-align: center; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 12px #5b3fd033; }
.btn.primary:hover { background: var(--brand-strong); color: var(--on-brand); }
.btn.secondary { background: var(--surface); border-color: var(--line-strong); color: var(--brand-ink); }
.btn.secondary:hover { background: var(--surface-3); }
.btn.quiet { background: var(--brand-soft); color: var(--brand-ink); }
.btn.quiet:hover { filter: brightness(.97); }
.btn[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good-line); color: var(--good); }

/* Home */
.eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--brand-ink); background: var(--surface); border: 1px solid var(--line); padding: 3px 12px; border-radius: 99px; font-weight: 700; font-size: 12.5px; margin-bottom: 14px; }
.hero-actions, .actions, .quiz-controls, .related { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
.section-heading { margin: 30px 0 12px; flex-wrap: wrap; }
.section-heading > p { color: var(--muted); font-size: 14px; }
.units { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.unit-card, .panel, .quiz-box { border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); min-width: 0; }
.unit-card { padding: 16px 18px 10px; }
.unit-head { display: flex; align-items: center; gap: 12px; }
.unit-head > span:nth-child(2) { min-width: 0; flex: 1; }
.unit-head strong, .unit-head small { display: block; }
.unit-head strong { line-height: 1.45; }
.unit-head small { color: var(--muted); }
.unit-meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.unit-meter progress { height: 6px; }
.unit-meter span { white-space: nowrap; }
.unit-emoji, .lesson-emoji { display: grid; place-items: center; border-radius: 14px; width: 48px; height: 48px; flex-shrink: 0; font-size: 23px; }
.lilac { background: var(--t-lilac); }
.peach { background: var(--t-peach); }
.mint { background: var(--t-mint); }
.blue { background: var(--t-blue); }
.pink { background: var(--t-pink); }
.yellow { background: var(--t-yellow); }
.unit-card ul, .stat-list { list-style: none; padding: 0; margin: 10px 0 0; }
.unit-card li a { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--ink); border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; padding: 9px 2px; }
.unit-card li a:hover { color: var(--brand); }
.unit-card li a .de-name { color: var(--muted); font-size: 12px; display: block; }
.sky { background: var(--t-sky); }
.sand { background: var(--t-sand); }
.coral { background: var(--t-coral); }
.teal { background: var(--t-teal); }

/* Dashboard: next stop, today card, topic grid. */
.dash-top { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 15px; }
.dash-continue { display: grid; gap: 14px; align-content: start; background: radial-gradient(ellipse at 0% 120%, var(--hero-c) 0, transparent 55%), linear-gradient(125deg, var(--hero-a), var(--hero-b) 62%, var(--surface)); }
.dash-continue .eyebrow { margin: 0; width: fit-content; }
.rank-row { display: flex; align-items: center; gap: 12px; }
.rank-badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(140deg, var(--brand), #9b5de5); color: #fff; font: 800 22px/1 var(--font); box-shadow: 0 6px 16px #5b3fd040; flex-shrink: 0; }
.rank-text { display: grid; line-height: 1.35; min-width: 0; flex: 1; }
.rank-text .label { margin: 0; }
.rank-text strong { font-size: 20px; font-weight: 800; }
.rank-text small { color: var(--muted); }
.rank-xp { font-weight: 800; color: var(--brand-ink); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank-row.big { margin-top: 16px; }
.xp-bar { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; border: 1px solid var(--line); }
.xp-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #9b6cf0); border-radius: 99px; transition: inline-size .4s ease; }
.next-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); color: var(--ink); }
.next-card:hover { border-color: var(--brand); color: var(--ink); }
.next-text { display: grid; gap: 2px; min-width: 0; flex: 1; line-height: 1.5; }
.next-text small { color: var(--muted); }
.next-text b { font-size: 18px; font-weight: 760; }
.next-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.next-card .go { color: var(--brand); font-weight: 800; font-size: 20px; }
.treasure-note { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--radius); background: var(--gold-bg); border: 1px solid var(--gold-line); }
.treasure-note > span { font-size: 34px; }
.treasure-note p { color: var(--ink-2); font-size: 15px; }
.de-name { color: var(--muted); font-size: 12.5px; font-weight: 600; }

.dash-today { display: grid; gap: 14px; align-content: start; }
.dash-today h2 { margin: 0; }
.goal-row, .streak-row { display: flex; align-items: center; gap: 12px; }
.goal-row strong, .streak-row strong { display: block; line-height: 1.45; }
.goal-row .label { margin: 0; }
.goal-ring-wrap { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.goal-ring { width: 100%; height: 100%; }
.goal-ring circle { fill: none; stroke-width: 9; }
.goal-ring .track { stroke: var(--surface-3); }
.goal-ring .arc { stroke: var(--brand); stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.goal-ring .arc.full { stroke: var(--good); }
.goal-num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.streak-flame { font-size: 30px; width: 52px; text-align: center; filter: grayscale(1); opacity: .45; }
.streak-flame.live { filter: none; opacity: 1; }
.week { list-style: none; display: flex; gap: 5px; padding: 0; margin: 6px 0 0; }
.week li { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); font-size: 11px; font-weight: 700; border: 1px solid var(--line); }
.week li.active { background: var(--brand-soft); color: var(--brand-ink); }
.week li.reached { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.week li.today { outline: 2px solid var(--focus); outline-offset: 1px; }
.today-actions { display: grid; gap: 6px; border-top: 1px dashed var(--line-strong); padding-top: 12px; font-size: 14px; color: var(--ink-2); }
.today-actions p:empty { display: none; }
.today-actions .btn { justify-self: start; }

.map-panel { margin-top: 15px; }
.map-panel .panel-head { align-items: baseline; }
.muted { color: var(--muted); font-size: 14px; }

.section-heading > div > p { color: var(--muted); font-size: 14px; }
.filter-group { display: inline-flex; gap: 4px; padding: 4px; border-radius: 13px; background: var(--surface-3); border: 1px solid var(--line); }
.filter-chip { border: 0; background: none; padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 750; color: var(--muted); min-height: 36px; }
.filter-chip[aria-pressed="true"] { background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow-sm); }
.islands-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.island-card { display: flex; flex-direction: column; }
.island-card.conquered { border-color: var(--gold-line); }
.island-card ul { flex: 1; }
.island-card .li-meta { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.conquered-flag { font-size: 20px; }
.star-sum { color: var(--gold); font-weight: 800; white-space: nowrap; }
.card-foot { display: block; border-top: 1px solid var(--line); padding: 10px 2px 2px; font-size: 13.5px; font-weight: 750; }

@media (max-width: 1110px) {
  .dash-top { grid-template-columns: 1fr; }
}

/* The archipelago map. Colours come from tokens so both themes work. */
.map-host { position: relative; border-radius: 24px; overflow: hidden; }
.map-svg { display: block; width: 100%; height: auto; direction: ltr; user-select: none; -webkit-user-select: none; }
.map-svg.wide { max-height: 660px; margin-inline: auto; }
.map-svg text { font-family: var(--font); }
.map-svg .sea { fill: var(--sea); }
.map-svg .wave { fill: none; stroke: var(--sea-deep); stroke-width: 2.5; stroke-linecap: round; opacity: .9; }
.map-svg .route-seg { fill: none; stroke: var(--line-strong); stroke-width: 3; stroke-dasharray: 2 11; stroke-linecap: round; }
.map-svg .route-done { fill: none; stroke: var(--brand); stroke-width: 4; stroke-linecap: round; opacity: .75; }
.isle { cursor: pointer; outline: none; }
.isle > g { transition: transform .2s ease; }
.isle .isle-water { fill: var(--sea-shallow); }
.isle .isle-beach { fill: var(--sand); }
.isle .isle-land { fill: color-mix(in srgb, var(--isle-tint) 50%, var(--isle-green)); stroke: var(--isle-edge); stroke-width: 2; }
.isle .isle-emoji { font-size: 40px; }
.isle .isle-fog { fill: var(--surface); opacity: .28; pointer-events: none; }
.isle.untouched .isle-emoji { opacity: .75; }
.isle .ring-bg { fill: var(--surface); stroke: var(--line); }
.isle .ring-track, .isle .ring-arc { fill: none; stroke-width: 4.5; }
.isle .ring-track { stroke: var(--line); }
.isle .ring-arc { stroke: var(--brand); stroke-linecap: round; }
.isle.conquered .ring-arc { stroke: var(--gold); }
.isle .ring-num { font-size: 15px; font-weight: 800; fill: var(--ink); }
.isle .flag { font-size: 28px; }
.isle .plate rect { fill: var(--surface); stroke: var(--line); filter: drop-shadow(0 2px 4px #1c1a2b26); }
.isle .plate-name { font-size: 15px; font-weight: 760; fill: var(--ink); }
.isle .plate-sub { font-size: 12px; font-weight: 650; fill: var(--muted); }
.isle.conquered .plate rect { stroke: var(--gold-line); }
.isle:hover .plate rect, .isle:focus-visible .plate rect { stroke: var(--brand); stroke-width: 2; }
.isle:focus-visible .isle-water { stroke: var(--focus); stroke-width: 5; }
.isle .pulse { fill: none; stroke: var(--brand); stroke-width: 3; opacity: .55; transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { from { transform: scale(.95); opacity: .65; } to { transform: scale(1.14); opacity: 0; } }
.map-svg .treasure circle { fill: var(--gold-bg); stroke: var(--gold-line); stroke-width: 2; }
.map-svg .treasure text { font-size: 30px; }
.map-svg .treasure:not(.open) { opacity: .45; filter: grayscale(.8); }
.map-svg .token circle { fill: var(--surface); stroke: var(--brand); stroke-width: 3; filter: drop-shadow(0 3px 6px #1c1a2b40); }
.map-svg .token text { font-size: 24px; }
@media (hover: hover) {
  .isle:hover > g { transform: translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) {
  .isle .pulse { animation: none; opacity: .5; }
}

/* Island page: banner and lesson trail. */
.island-banner .lesson-emoji { font-size: 28px; width: 56px; height: 56px; }
.island-meter { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.island-meter progress { max-width: 260px; flex: 1 1 140px; }
.flag-inline { font-size: .8em; }
.conquered-chip, .learned-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--gold-bg); color: var(--ink); border: 1px solid var(--gold-line); border-radius: 99px; padding: 2px 11px; font-size: 13px; font-weight: 700; }
.learned-chip { background: var(--good-bg); border-color: var(--good-line); color: var(--good); }

.trail-wrap { position: relative; margin-top: 26px; padding: 6px 0 10px; }
.trail-line { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.trail-line path { fill: none; stroke: var(--line-strong); stroke-width: 3; stroke-dasharray: 3 10; stroke-linecap: round; }
.trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 30px; position: relative; }
.trail-node { width: min(100%, 470px); }
.trail-node:nth-child(odd) { justify-self: start; }
.trail-node:nth-child(even) { justify-self: end; }
.node-link { display: flex; align-items: center; gap: 14px; color: var(--ink); padding: 10px 14px 10px 10px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); position: relative; }
a.node-link:hover { border-color: var(--brand); color: var(--ink); }
.node-dot { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-size: 30px; background: var(--surface-3); border: 4px solid var(--line-strong); position: relative; z-index: 1; }
.trail-node.learned .node-dot { border-color: var(--brand); background: var(--brand-soft); }
.trail-node.practised .node-dot { border-color: var(--brand); background: var(--brand-soft); }
.trail-node.mastered .node-dot { border-color: var(--gold); background: var(--gold-bg); }
.node-check { position: absolute; bottom: -4px; inset-inline-end: -4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; background: var(--good); color: #fff; border: 2px solid var(--surface); }
.trail-node.mastered .node-check { background: var(--gold); color: #1c1a2b; }
.node-text { display: grid; gap: 3px; min-width: 0; line-height: 1.45; }
.node-text strong { font-size: 16px; }
.node-num { font-size: 12px; font-weight: 800; color: var(--muted); }
.node-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.prereq-chip { display: inline-block; font-size: 12.5px; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 3px 9px; line-height: 1.5; }
.lesson-banner .prereq-chip { margin-top: 10px; }
.trail-node.exam .node-link { background: linear-gradient(130deg, var(--surface), var(--gold-bg)); }
.trail-node.exam.locked .node-link { background: var(--surface-2); }
.trail-node.exam.locked .node-dot { filter: grayscale(1); opacity: .7; }
.trail-node.exam.ready .node-dot, .trail-node.exam.conquered .node-dot { border-color: var(--gold); background: var(--gold-bg); }
.exam-text { display: grid; gap: 6px; justify-items: start; font-size: 14px; color: var(--ink-2); }
.exam-text strong { font-size: 16px; color: var(--ink); }
.walker { position: absolute; left: 0; top: 0; z-index: 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--brand); box-shadow: 0 4px 10px #1c1a2b40; border: 2px solid var(--surface); transition: transform .6s cubic-bezier(.4, 0, .2, 1); pointer-events: none; }

@media (max-width: 560px) {
  .trail { gap: 18px; }
  .trail-node, .trail-node:nth-child(even) { justify-self: stretch; width: 100%; }
  .node-dot { width: 60px; height: 60px; font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .walker { transition: none; }
}

/* Lesson page. */
/* Lesson */
.crumb { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 13px; }
.lesson-banner, .simple-banner { border: 1px solid var(--line); padding: clamp(18px, 3.4vw, 34px); border-radius: 22px; }
.lesson-banner h1, .simple-banner h1 { font-size: clamp(26px, 3.6vw, 40px); }
.lesson-banner .unit-head { align-items: flex-start; }
.lesson-sub { color: var(--ink-2); font-weight: 600; margin-top: 2px; }
.lesson-count { display: inline-block; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; margin-bottom: 8px; }
.lesson-emoji { background: var(--surface); box-shadow: var(--shadow-sm); }
.lesson-banner .lead, .simple-banner p { margin-top: 12px; max-width: 46rem; color: var(--ink-2); }
.lesson-banner .actions { margin-top: 18px; }
.glance { margin-top: 15px; display: grid; gap: 16px; }
.glance-head { display: flex; align-items: center; gap: 10px; }
.glance-head .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-size: 17px; }
.label { display: block; font-size: 12px; font-weight: 750; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
:root[lang="ar"] .label { text-transform: none; letter-spacing: 0; font-size: 13px; }
.pattern { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; direction: ltr; justify-content: flex-start; }
.chip { font: 700 15px/1.3 var(--font-de); padding: 7px 12px; border-radius: 10px; background: var(--g-hl-bg); color: var(--g-hl); border: 1px solid var(--g-hl-line); }
.op { font: 700 16px/1 var(--font-de); color: var(--muted); padding: 0 1px; }
.frames { display: grid; gap: 12px; }
.frame { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.frame-kind { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; }
.slot { display: grid; gap: 2px; padding: 7px 11px 6px; border-radius: 11px; border: 1px solid var(--g-mf-line); background: var(--g-mf-bg); color: var(--g-mf); min-width: 0; text-align: center; }
.slot b { font: 700 15.5px/1.35 var(--font-de); overflow-wrap: anywhere; }
.slot i { font-style: normal; font-size: 11px; font-weight: 650; opacity: .85; line-height: 1.3; white-space: nowrap; }
.slot.vf { background: var(--g-vf-bg); color: var(--g-vf); border-color: var(--g-vf-line); }
.slot.v, .slot.ve { background: var(--g-v-bg); color: var(--g-v); border-color: var(--g-v-line); }
.slot.ve { border-style: dashed; }
.slot.c { background: var(--g-c-bg); color: var(--g-c); border-color: var(--g-c-line); }
.slot.hl { background: var(--g-hl-bg); color: var(--g-hl); border-color: var(--g-hl-line); }
.slot.n { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 3px; }
.frames-hint { font-size: 13px; color: var(--muted); }
.lesson-body { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, .82fr); gap: 15px; margin-top: 15px; align-items: start; }
.lesson-side { display: grid; gap: 15px; min-width: 0; }
.panel, .quiz-box { padding: clamp(16px, 2.3vw, 26px); }
.panel h2, .quiz-box h2 { margin-bottom: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { margin: 0; }
.step-count { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-3); border-radius: 99px; padding: 2px 10px; }
.example { margin: 4px 0 16px; padding: 14px 16px; border-radius: 14px; background: var(--brand-soft); border: 1px solid var(--g-hl-line); }
.example .de { color: var(--brand-ink); font-size: clamp(17px, 1.9vw, 21px); font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.example p { color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.example .tr-label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 8px; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.step.enter { animation: reveal .28s ease-out both; }
@keyframes reveal { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.step-num { background: var(--brand-soft); color: var(--brand); border-radius: 10px; display: grid; place-items: center; width: 34px; height: 34px; font-weight: 800; font-size: 14px; }
.step h3 { font-size: 16px; line-height: 1.5; }
.step .de { display: block; margin: 7px 0; padding: 6px 11px; border-radius: 9px; background: var(--surface-3); color: var(--ink); font-weight: 650; overflow-wrap: anywhere; line-height: 1.55; width: fit-content; max-width: 100%; }
.step p, .reading p, .pitfall p, .recall p, .feedback p, .quiz-help { font-size: 16px; }
.step p, .reading p, .pitfall p { color: var(--ink-2); }
.reading p { max-inline-size: 40rem; }
.reading p + p { margin-top: .85em; }
.pitfall { background: var(--warn-bg); border-color: var(--warn-line); }
.pitfall h2 { color: var(--warn); }
.wr { display: grid; gap: 6px; margin-bottom: 10px; }
.wr div { display: flex; gap: 9px; align-items: baseline; padding: 7px 11px; border-radius: 10px; font-weight: 650; overflow-wrap: anywhere; line-height: 1.5; }
.wr .no { background: var(--bad-bg); color: var(--bad); }
.wr .no span:last-child { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.wr .yes { background: var(--good-bg); color: var(--good); }
.wr .mark { font: 800 13px/1 var(--font-de); flex-shrink: 0; }
.recall summary { cursor: pointer; font-weight: 700; color: var(--brand-ink); }
.recall > p { margin-top: 10px; }
.recall details { margin-top: 10px; padding: 10px 12px; border-radius: 11px; background: var(--surface-3); }
.recall details p { margin-top: 6px; }
.sources { margin: 15px 0 0; font-size: 13px; }
.sources summary { font-weight: 700; cursor: pointer; }
.sources p { margin-top: 8px; color: var(--muted); }
.sources ul { margin: 6px 0 0; padding-inline-start: 19px; }
.table-wrap { overflow: auto; margin-top: 4px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; border: 1px solid var(--line); border-radius: 12px; }
.table-help { display: none; color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
tbody tr:last-child > * { border-bottom: 0; }
thead th { background: var(--surface-3); white-space: nowrap; font-size: 13px; color: var(--ink-2); }
tbody th { color: var(--ink-2); font-weight: 650; }
tbody tr:hover > * { background: var(--surface-2); }
td bdi[lang="de"], td.de-cell { font-weight: 600; }
.lesson-nav { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }

/* Practice launcher, quiz and results. */
/* Practice */
.practice-head { margin-bottom: 16px; background: linear-gradient(130deg, var(--hero-a), var(--hero-c)); }
.launcher { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .6fr); gap: 14px; }
.launcher .panel p { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.form-row { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; }
.form-row label { display: grid; gap: 4px; flex: 1 0 min(100%, 220px); font-size: 13px; font-weight: 700; }
select, textarea, .blank { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px; padding: 9px 11px; }
select { width: 100%; min-height: 44px; }
.quiz-box { max-width: 840px; }
.quiz-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); margin: 0 0 6px; font-size: 13px; }
.quiz-type { display: inline-block; border-radius: 99px; background: var(--brand-soft); color: var(--brand-ink); padding: 3px 12px; font-size: 12px; font-weight: 700; margin: 13px 0 8px; }
.quiz-prompt { font-size: clamp(19px, 2.1vw, 23px); line-height: 1.6; text-wrap: pretty; margin-bottom: 16px; }
.quiz-controls { margin-top: 16px; }
.choices { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, background-color .15s; }
.option:hover { border-color: var(--line-strong); }
.option:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.option:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=radio] { accent-color: var(--brand); }
textarea { width: 100%; display: block; min-height: 110px; resize: vertical; line-height: 1.6; }
.cloze { line-height: 2.6; font-size: 18px; overflow-wrap: anywhere; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.blank { min-width: 6ch; width: clamp(8ch, 17vw, 17ch); padding: 3px 7px; margin: 0 3px; text-align: center; }
.blank:focus { border-color: var(--brand); }
.blank.good, .option.good { background: var(--good-bg); border-color: var(--good-line); }
.blank.bad, .option.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.answer-order { min-height: 59px; padding: 8px; border: 1.5px dashed var(--line-strong); border-radius: 12px; margin: 6px 0 12px; background: var(--surface-2); }
.order-line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.order-token { border: 1px solid var(--g-hl-line); border-radius: 9px; background: var(--surface); padding: 6px 11px; min-height: 40px; font-weight: 600; }
.order-token:hover { background: var(--brand-soft); }
.answer-order .order-token { background: var(--brand-soft); color: var(--brand-ink); }
.quiz-help, .feedback, .notice { border-radius: 12px; padding: 11px 14px; background: var(--surface-3); margin-top: 12px; }
.quiz-help { background: var(--warn-bg); border: 1px solid var(--warn-line); }
.feedback { border: 1px solid var(--line); }
.feedback.correct { background: var(--good-bg); border-color: var(--good-line); color: var(--good); }
.feedback.incorrect { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.feedback.correct p, .feedback.incorrect p { color: var(--ink); }
.feedback strong { display: block; }
.feedback .de, .review-model { font-size: 16px; margin-top: 4px; overflow-wrap: anywhere; }
.feedback p + p { margin-top: 5px; }
.answer-label { display: block; color: var(--muted); font-size: 13px; }
.timer { font-variant-numeric: tabular-nums; color: var(--brand-ink); font-weight: 700; }
.timer.soon { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 13px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.stat strong { display: block; font-size: 24px; color: var(--ink); unicode-bidi: isolate; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat-list li > span { white-space: nowrap; color: var(--muted); font-size: 13px; }
.stat-list li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.stat-list li a { flex: 1; min-width: 0; color: var(--ink); }
.stat-list progress { max-width: 100px; }
.result-row { margin-top: 9px; border-top: 1px solid var(--line); padding: 10px 0 0; }
.result-row summary { cursor: pointer; font-size: 14px; }
.result-row p { margin-top: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.noscript { padding: 20px; background: var(--surface); }

/* HUD, stars, level chips, toasts, badges, calendar and settings. */
.hud { display: flex; align-items: center; gap: 6px; }
.hud a { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.hud a:hover { background: var(--surface-3); color: var(--ink); }
.hud-streak span { filter: grayscale(1); opacity: .5; }
.hud-streak.live span { filter: none; opacity: 1; }
.hud-badge { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); font-size: 13px; }
.hud-bar { width: 56px; height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.hud-bar i { display: block; height: 100%; background: var(--brand); }
.hud-xp { font-size: 13px; color: var(--brand-ink); }

.stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.stars svg { display: block; }
.stars .on { fill: var(--gold); }
.stars .off { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
.level-chip { display: inline-flex; align-items: center; font: 800 11px/1 var(--font-de); padding: 4px 7px; border-radius: 7px; letter-spacing: .02em; }
.level-chip.b11 { background: var(--t-blue); color: var(--g-vf); }
.level-chip.b12 { background: var(--t-mint); color: var(--good); }

.toasts { position: fixed; z-index: 30; inset-inline-end: 16px; bottom: 16px; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 700; font-size: 14.5px; line-height: 1.45; animation: toast-in .2s ease-out both; }
.toast.leave { animation: toast-out .18s ease-in both; }
.toast-icon { font-size: 22px; flex-shrink: 0; }
.toast-text { flex: 1; min-width: 0; }
.toast-close { border: 0; background: none; color: var(--muted); font-size: 20px; width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
.toast-close:hover { background: var(--surface-3); color: var(--ink); }
.toast.xp { border-color: var(--g-hl-line); }
.toast.badge, .toast.conquered, .toast.level { background: var(--gold-bg); border-color: var(--gold-line); }
.toast.goal, .toast.learned { background: var(--good-bg); border-color: var(--good-line); }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toast-out { to { transform: translateY(6px); opacity: 0; } }

.notice.dismissible { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 auto 14px; max-width: 1120px; }
.run-outcome { display: grid; gap: 6px; margin: 4px 0 12px; padding: 14px 16px; border-radius: 14px; background: var(--brand-soft); border: 1px solid var(--g-hl-line); }
.run-outcome > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run-outcome p { color: var(--ink-2); font-size: 14px; }
.run-outcome.passed { background: var(--gold-bg); border-color: var(--gold-line); }
.run-outcome.failed { background: var(--warn-bg); border-color: var(--warn-line); }
.run-outcome .big { font-size: 30px; }
.xp-line { font-weight: 750; color: var(--brand-ink); margin-bottom: 12px; }
.count-line { color: var(--ink) !important; font-weight: 700; }

.finish-bar { margin-top: 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface-2); }
.finish-bar > div:first-child { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.finish-bar p { color: var(--muted); font-size: 14px; }
.finish-bar.done { background: var(--good-bg); border-color: var(--good-line); }
.finish-bar.done strong { color: var(--good); }
.table-panel { margin-top: 15px; }

.exams-panel { grid-column: 1 / -1; }
.exam-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.exam-row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px; padding: 10px 12px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface-2); }
.exam-row a:not(.btn) { font-weight: 750; color: var(--ink); }
.exam-row .exam-status { grid-column: 2; font-size: 13px; color: var(--muted); line-height: 1.5; }
.exam-row .btn { grid-column: 2; justify-self: start; min-height: 38px; padding: 6px 14px; }
.exam-row.done { border-color: var(--gold-line); background: var(--gold-bg); }
.exam-row .sum-emoji { grid-row: span 3; }

.stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.calendar { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; max-width: 560px; }
.cal-cell { aspect-ratio: 1; border-radius: 4px; background: var(--surface-3); border: 1px solid var(--line); min-width: 10px; }
.cal-cell.future { visibility: hidden; }
.cal-cell.l1 { background: color-mix(in srgb, var(--brand) 25%, var(--surface)); }
.cal-cell.l2 { background: color-mix(in srgb, var(--brand) 50%, var(--surface)); }
.cal-cell.l3 { background: color-mix(in srgb, var(--brand) 75%, var(--surface)); }
.cal-cell.l4 { background: var(--brand); }
.cal-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.cal-legend .cal-cell { width: 14px; height: 14px; }
.badges { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.badge { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.badge span:last-child { display: grid; line-height: 1.45; }
.badge small { color: var(--ink-2); font-size: 13px; }
.badge em { font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }
.badge-icon { font-size: 26px; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--gold-bg); border: 1px solid var(--gold-line); flex-shrink: 0; }
.badge.locked .badge-icon { filter: grayscale(1); opacity: .45; background: var(--surface-3); border-color: var(--line); }
.badge.locked strong { color: var(--ink-2); }
.island-stats-list { display: grid; gap: 10px; }
.island-stats summary { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 750; flex-wrap: wrap; }
.island-stats summary .muted { margin-inline-start: auto; font-weight: 600; }
.stat-list li { gap: 10px; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.settings-grid .panel { display: grid; gap: 10px; align-content: start; }
.settings-grid h3 { margin: 0; }
.field { display: grid; gap: 8px; font-weight: 750; }
.check-field { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check-field input { width: 22px; height: 22px; accent-color: var(--brand); margin-top: 3px; flex-shrink: 0; }
.check-field span { display: grid; line-height: 1.5; }
.check-field small { color: var(--muted); font-size: 13.5px; }
.seg.big button { min-width: 100px; height: 40px; font-size: 15px; }
.text-input { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px; padding: 9px 11px; min-height: 44px; width: 100%; }
.file-btn { cursor: pointer; justify-self: start; }
.file-btn:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger:hover { filter: brightness(1.05); }
.panel.danger { border-color: var(--bad-line); }
.index-island { display: block; font-size: 12.5px; font-weight: 700; padding: 2px 8px 8px; margin-inline-start: 30px; }
.sum-count { font-size: 11.5px; color: var(--muted); font-weight: 650; font-variant-numeric: tabular-nums; }
.index summary { grid-template-columns: auto 1fr auto auto; }
.index-links .dot { width: auto; min-width: 10px; color: var(--gold); letter-spacing: -2px; font-size: 10px; }

@media (max-width: 860px) {
  .toasts { bottom: calc(80px + env(safe-area-inset-bottom)); }
}
@media (max-width: 560px) {
  .hud-bar, .hud-xp { display: none; }
  .hud a { padding: 0 8px; gap: 4px; }
  .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 430px) {
  .hud-level { display: none !important; }
}

/* Printing a lesson. */
@media print {
  :root, body { background: #fff; color: #000; }
  .topbar, .sidebar, .page-foot, .actions, .lesson-nav, .quiz-controls, .shade, .bottom-nav, .toasts, #notice-slot, .finish-bar, .map-panel, .walker, .trail-line { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  body { padding: 0; }
  .lesson-body, .lesson-side { display: block; }
  .panel { margin: 10px 0; box-shadow: none; }
  .step[hidden] { display: grid !important; }
  details.sources, details.recall { display: block; }
  .lesson-banner, .panel { border-color: #ccc; background: #fff; }
  .step, .pitfall, .glance { break-inside: avoid; }
}

im.de/korpusgrammatik/6941"],"i18n":{"ar":{"title":"الإضافة وحالة Genitiv","lead":"تربط حالة الجينيتيف اسمًا باسم آخر لتبين صاحب الشيء أو ما ينتمي إليه. يمكنك تصورها على هيئة سؤال `Wessen?`، أي «لمن؟» أو «الخاص بمَن أو بماذا؟».","translation":"مدخل المبنى.","steps":[{"text":"حدّد الاسم الموصوف وصاحب الإضافة","why":"الاسم الرئيسي هو `Eingang`. تحدد وظيفته في الجملة أداته الخاصة. أما `Gebäude` فيحدّد إلى ماذا ينتمي المدخل."},{"text":"صرّف أداة صاحب الإضافة","why":"تأتي `des` مع المذكر والمحايد المفرد، و`der` مع المؤنث المفرد والجمع. مع الأداة النكرة تقول `eines Mannes` و`einer Frau` و`eines Kindes`."},{"text":"افحص نهاية الاسم","why":"يأخذ كثير من الأسماء المذكرة والمحايدة المفردة `-s` أو `-es`. في كلمات مثل `Haus` تظهر `-es`. يُحفظ الشكل مع الاسم عندما يختلف الاستعمال. لا تضف هذه النهاية إلى المؤنث أو الجمع."},{"text":"راجع الاستثناء الشائع والأسماء العلم","why":"المذكر الضعيف مثل `Student` يأخذ `-en` في الجينيتيف. ومع اسم العلم يمكنك وضع المالك قبل الشيء وإضافة `-s` مثل `Annas`. وتظهر فاصلة عليا مع اسم ينتهي بصوت صفيري مثل `Max’ Schlüssel`."}],"explain":["في `Ich sehe den Eingang des Gebäudes` تغيّر `Eingang` إلى الأكوزاتيف لأنه مفعول `sehe`، وبقي `des Gebäudes` جينيتيف لأنه يصف المدخل. وفي المحادثة تسمع كثيرًا `der Eingang von dem Gebäude` أو `vom Gebäude`. استعمل الجينيتيف في التمرين حين يُطلب منك، وتدرّب على تمييزه في النصوص الرسمية."],"pitfall":"أداة المالك المحايد `des` صحيحة. يحتاج اسم `Haus` أيضًا إلى `-es`.","recall":["في `die Fahrräder der Kinder` هل `Kinder` مفرد مؤنث؟","هو جمع. أداة الجينيتيف `der` مشتركة بين المؤنث المفرد والجمع."],"linkTitles":["فهرس قواعد الوحدة 4 · telc، ص 3","حلول الكتاب الرسمية · telc","علامات الجينيتيف · grammis"],"table":[["الأداة","مذكر","مؤنث","محايد","جمع"],["معرّفة","des Mannes","der Frau","des Kindes","der Kinder"],["نكرة / ملكية","eines Mannes","einer Frau","eines Kindes","meiner Kinder"]]},"de":{"title":"Der Genitiv","lead":"Der Genitiv verbindet ein Nomen mit einem anderen und zeigt, wem etwas gehört oder wozu es gehört. Denk an die Frage `Wessen?`.","steps":[{"text":"Bestimme das Hauptnomen und den „Besitzer“","why":"Das Hauptnomen ist `Eingang`; seine Funktion im Satz bestimmt seinen Artikel. `Gebäude` zeigt, wozu der Eingang gehört."},{"text":"Dekliniere den Artikel des Besitzers","why":"`des` steht bei Maskulinum und Neutrum im Singular, `der` bei Femininum und Plural. Mit unbestimmtem Artikel: `eines Mannes`, `einer Frau`, `eines Kindes`."},{"text":"Prüfe die Endung des Nomens","why":"Viele maskuline und neutrale Nomen bekommen im Singular `-s` oder `-es`. Bei Wörtern wie `Haus` steht `-es`. Lern die Form mit dem Nomen, wenn es Varianten gibt. Feminine Nomen und Plural bekommen diese Endung nicht."},{"text":"Merk dir die häufige Ausnahme und Eigennamen","why":"Schwache Maskulina wie `Student` bekommen im Genitiv `-en`. Bei Namen kannst du den Besitzer vorne nennen und `-s` anhängen: `Annas`. Endet der Name auf einen s-Laut, steht ein Apostroph: `Max’ Schlüssel`."}],"explain":["In `Ich sehe den Eingang des Gebäudes` steht `Eingang` im Akkusativ, weil es Objekt von `sehe` ist; `des Gebäudes` bleibt Genitiv, weil es den Eingang beschreibt. Im Gespräch hörst du oft `der Eingang von dem Gebäude` oder `vom Gebäude`. Benutze den Genitiv in der Übung, wenn er verlangt wird, und üb, ihn in formellen Texten zu erkennen."],"pitfall":"Der Artikel `des` für den neutralen Besitzer ist richtig. Das Nomen `Haus` braucht aber zusätzlich `-es`.","recall":["Ist `Kinder` in `die Fahrräder der Kinder` ein femininer Singular?","Nein, es ist Plural. Der Genitivartikel `der` ist bei Femininum Singular und Plural gleich."],"linkTitles":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Genitivmarkierung · grammis"],"table":[["Artikel","Maskulin","Feminin","Neutrum","Plural"],["bestimmt","des Mannes","der Frau","des Kindes","der Kinder"],["unbestimmt / Possessiv","eines Mannes","einer Frau","eines Kindes","meiner Kinder"]]}},"questions":[{"id":"genitiv-1","type":"cloze","difficulty":1,"text":"der Schlüssel {{1}} {{2}}","blanks":[["des"],["Lehrers"]],"i18n":{"ar":{"prompt":"أكمل الإضافة من der Lehrer.","explain":"der Lehrer يصبح des Lehrers.","hints":["أداة المذكر ونهاية الاسم كلاهما مهم."]},"de":{"prompt":"Ergänze den Genitiv von `der Lehrer`.","explain":"`der Lehrer` wird zu `des Lehrers`.","hints":["Artikel und Nomen-Endung sind beide wichtig."]}}},{"id":"genitiv-2","type":"cloze","difficulty":1,"text":"die Adresse {{1}} Schule","blanks":[["der"]],"i18n":{"ar":{"prompt":"أكمل الأداة لاسم مؤنث.","explain":"أداة المؤنث في الجينيتيف der.","hints":["حدّد حالة مالك العنوان."]},"de":{"prompt":"Ergänze den Artikel für ein feminines Nomen.","explain":"Der feminine Artikel im Genitiv ist `der`.","hints":["Bestimme den Kasus des „Besitzers“ der Adresse."]}}},{"id":"genitiv-3","type":"mcq","difficulty":1,"options":["die Spielsachen der Kinder","die Spielsachen den Kindern","die Spielsachen des Kinder"],"answer":0,"i18n":{"ar":{"prompt":"أي مجموعة تترجم «ألعاب الأطفال»؟","explain":"der Kinder جمع جينيتيف. den Kindern داتيف، وdes تخص المذكر أو المحايد المفرد.","hints":["أداة الجينيتيف للجمع كأداة المؤنث."]},"de":{"prompt":"Welche Gruppe heißt „das Spielzeug der Kinder“?","explain":"`der Kinder` ist Genitiv Plural. `den Kindern` ist Dativ, `des` gilt für Maskulinum oder Neutrum Singular.","hints":["Der Genitivartikel im Plural ist wie der feminine."]}}},{"id":"genitiv-4","type":"cloze","difficulty":2,"text":"das Dach {{1}} (das Haus) · die Tasche {{2}} (der Student)","blanks":[["des Hauses"],["des Studenten"]],"i18n":{"ar":{"prompt":"أكمل بإضافة الاسم المحايد والمذكر الضعيف.","explain":"Haus يأخذ -es. Student اسم مذكر ضعيف يأخذ -en.","hints":["أضف النهاية المناسبة لكل اسم بعد des."]},"de":{"prompt":"Ergänze den Genitiv beim neutralen Nomen und beim schwachen Maskulinum.","explain":"`Haus` bekommt `-es`. `Student` ist ein schwaches Maskulinum und bekommt `-en`.","hints":["Häng nach `des` an jedes Nomen die passende Endung."]}}},{"id":"genitiv-5","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"أي تحليل صحيح لـ Ich sehe den Garten des Nachbarn؟","explain":"الفعل يحدد حالة Garten. علاقة الإضافة تحدد حالة Nachbar.","hints":["اسأل ماذا أرى ثم لمن الحديقة."],"options":["den Garten أكوزاتيف، وdes Nachbarn جينيتيف.","den Garten جينيتيف، وdes Nachbarn أكوزاتيف.","المجموعتان في الأكوزاتيف."]},"de":{"prompt":"Welche Analyse von `Ich sehe den Garten des Nachbarn` ist richtig?","explain":"Das Verb bestimmt den Kasus von `Garten`. Die Genitivbeziehung bestimmt den Kasus von `Nachbar`.","hints":["Frag: Was sehe ich? Und: Wessen Garten?"],"options":["`den Garten` ist Akkusativ, `des Nachbarn` ist Genitiv.","`den Garten` ist Genitiv, `des Nachbarn` ist Akkusativ.","Beide Gruppen stehen im Akkusativ."]}}},{"id":"genitiv-6","type":"cloze","difficulty":2,"text":"{{1}} Tasche (Anna) · {{2}} Schlüssel (Max)","blanks":[["Annas"],["Max’","Max'"]],"i18n":{"ar":{"prompt":"اكتب الإضافة مع اسم العلم أولًا.","explain":"تلحق s باسم Anna. مع Max تبيّن الفاصلة العليا الملكية بدل إضافة s جديدة.","hints":["انتبه إلى آخر صوت في Max."]},"de":{"prompt":"Schreib den Genitiv mit dem Namen vorne.","explain":"An `Anna` wird `s` angehängt. Bei `Max` zeigt der Apostroph den Besitz, statt eines weiteren `s`.","hints":["Achte auf den letzten Laut von `Max`."]}}},{"id":"genitiv-7","type":"text","difficulty":3,"answer":"Das ist der Eingang eines Gebäudes.","i18n":{"ar":{"prompt":"حوّل Das ist der Eingang von einem Gebäude إلى جينيتيف نكرة.","explain":"يصبح einem هنا eines لأن الحالة تغيّرت. والاسم Gebäude يأخذ -s.","hints":["حوّل أداة النكرة المحايدة وأضف نهاية الاسم."]},"de":{"prompt":"Forme `Das ist der Eingang von einem Gebäude` in einen unbestimmten Genitiv um.","explain":"`einem` wird hier zu `eines`, weil sich der Kasus ändert, und `Gebäude` bekommt `-s`.","hints":["Ändere den neutralen unbestimmten Artikel und häng die Endung ans Nomen."]}}},{"id":"genitiv-8","type":"text","difficulty":3,"answer":"die Tür des Hauses","context":"die Tür des Haus","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"أداة المالك المحايد `des` صحيحة. يحتاج اسم `Haus` أيضًا إلى `-es`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Der Artikel `des` für den neutralen Besitzer ist richtig. Das Nomen `Haus` braucht aber zusätzlich `-es`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"genitiv-9","type":"text","difficulty":2,"answer":"هو جمع. أداة الجينيتيف `der` مشتركة بين المؤنث المفرد والجمع.","i18n":{"ar":{"prompt":"في `die Fahrräder der Kinder` هل `Kinder` مفرد مؤنث؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Ist `Kinder` in `die Fahrräder der Kinder` ein femininer Singular?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"genitiv-praep","level":"B1.1","island":"nomen-kasus","order":2,"prereqs":["genitiv"],"emoji":"🧭","german":"Präpositionen mit Genitiv","source":{"lektion":4,"kind":"toc"},"pattern":["wegen · trotz · während · innerhalb · statt","+","Genitiv"],"frames":[{"k":"main","parts":[["vf","Wegen des Umzugs"],["v","bleibt"],["mf","das Büro"],["ve","geschlossen"]]}],"example":"Wegen des Umzugs bleibt das Büro geschlossen.","stepExamples":["wegen · trotz · während","innerhalb einer Woche · außerhalb der Stadt · statt eines Briefes","wegen des Regens · trotz der Kälte","während des Kurses · während der Kurs läuft"],"pitfallPair":"wegen dem Umzug → wegen des Umzugs","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=3","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Loesungen_Hoertexte/Auf_jeden_Fall_B1.1_Loesungen_KB_AB.pdf","https://grammis.ids-mannheim.de/korpusgrammatik/6941"],"i18n":{"ar":{"title":"حروف الجر التي تطلب Genitiv","lead":"قد يحدد حرف الجر حالة الاسم حتى عندما لا توجد علاقة ملكية. تعلّم المعنى مع الحالة لتختار الحرف المناسب وتبني المجموعة التي تأتي بعده.","translation":"بسبب الانتقال يبقى المكتب مغلقًا.","steps":[{"text":"اختر حرف الجر من المعنى","why":"تعني `wegen` «بسبب»، و`trotz` «رغم»، و`während` «أثناء» حين تسبق اسمًا. يُدرَّب هنا على الصيغة المعيارية بالجينيتيف."},{"text":"ميّز المكان والوقت والاستبدال","why":"تدل `innerhalb` على ما يقع داخل نطاق، و`außerhalb` خارجه، و`statt/anstatt` على بديل. وانظر إلى الأداة والاسم بعد الحرف معًا."},{"text":"ابنِ المجموعة حسب الجنس","why":"في المذكر يتغير شكل الأداة ويأخذ الاسم نهايته هنا. في المؤنث تظهر الحالة على الأداة `der` ويبقى الاسم `Kälte` كما هو."},{"text":"حدّد هل بعد الحرف اسم أم جملة","why":"في الأولى `während` حرف جر مع مجموعة اسمية. في الثانية رابط لجملة تابعة، و`der Kurs` فاعل في الرفع، والفعل `läuft` في آخرها."}],"explain":["قد تسمع الداتيف مع بعض هذه الحروف، وخصوصًا `wegen` في المحادثة. في هذه التمارين تدرب على الجينيتيف بعد الحروف المذكورة. إذا قدمت المجموعة في الرئيسية فستشغل موضعًا واحدًا، مثل `Trotz des Regens gehen wir hinaus`، لذلك يأتي الفعل المصرف بعدها مباشرة."],"pitfall":"في الصيغة المعيارية المستهدفة، اختر `des` وأضف `-s` إلى `Umzug`.","recall":["أي تركيب يدل على الزمن داخل مدة شهر؟","`innerhalb eines Monats`. الحرف يطلب الجينيتيف، و`Monat` مذكر."],"linkTitles":["فهرس قواعد الوحدة 4 · telc، ص 3","حلول الكتاب الرسمية · telc","علامات الجينيتيف · grammis"]},"de":{"title":"Präpositionen mit Genitiv","lead":"Eine Präposition kann den Kasus eines Nomens bestimmen, auch wenn es um keinen Besitz geht. Lern die Bedeutung zusammen mit dem Kasus, damit du die richtige Präposition wählst und die Gruppe danach richtig baust.","steps":[{"text":"Wähle die Präposition nach der Bedeutung","why":"`wegen` nennt einen Grund, `trotz` einen Gegensatz, `während` eine Zeitspanne, wenn ein Nomen folgt. Geübt wird hier die Standardform mit Genitiv."},{"text":"Unterscheide Ort, Zeit und Ersatz","why":"`innerhalb` heißt „im Rahmen von“, `außerhalb` „nicht im Rahmen von“, `statt/anstatt` nennt eine Alternative. Schau dir Artikel und Nomen nach der Präposition zusammen an."},{"text":"Bau die Gruppe nach dem Genus","why":"Beim Maskulinum ändert sich der Artikel, und das Nomen bekommt hier eine Endung. Beim Femininum zeigt nur der Artikel `der` den Kasus; `Kälte` bleibt gleich."},{"text":"Prüfe, ob danach ein Nomen oder ein Satz kommt","why":"Im ersten Beispiel ist `während` eine Präposition mit Nominalgruppe. Im zweiten leitet es einen Nebensatz ein: `der Kurs` ist Subjekt im Nominativ, und `läuft` steht am Ende."}],"explain":["Bei manchen dieser Präpositionen hörst du auch den Dativ, besonders bei `wegen` in der gesprochenen Sprache. In diesen Übungen trainierst du den Genitiv. Steht die Gruppe vorne im Hauptsatz, besetzt sie eine Position: `Trotz des Regens gehen wir hinaus` – deshalb folgt das konjugierte Verb direkt danach."],"pitfall":"In der Standardform, die wir hier üben, wählst du `des` und hängst `-s` an `Umzug` an.","recall":["Welche Struktur bedeutet „im Zeitraum eines Monats“?","`innerhalb eines Monats`. Die Präposition verlangt den Genitiv, und `Monat` ist maskulin."],"linkTitles":["Grammatikübersicht Lektion 4 · telc, S. 3","Offizielle Lösungen zum Buch · telc","Genitivmarkierung · grammis"]}},"questions":[{"id":"genitiv-praep-1","type":"cloze","difficulty":1,"text":"Wegen {{1}} bleibt der Laden zu.","blanks":[["des Umzugs"]],"i18n":{"ar":{"prompt":"أكمل بسبب الانتقال، مع der Umzug.","explain":"الأداة des ويأخذ Umzug النهاية -s.","hints":["استعمل جينيتيف المذكر."]},"de":{"prompt":"Ergänze „wegen des Umzugs“ mit `der Umzug`.","explain":"Der Artikel ist `des`, und `Umzug` bekommt die Endung `-s`.","hints":["Benutze den Genitiv maskulin."]}}},{"id":"genitiv-praep-2","type":"cloze","difficulty":1,"text":"Trotz {{1}} gehen wir spazieren.","blanks":[["der Kälte"]],"i18n":{"ar":{"prompt":"أكمل برغم البرد، مع die Kälte.","explain":"تتحول die إلى der في الجينيتيف.","hints":["الاسم مؤنث."]},"de":{"prompt":"Ergänze „trotz der Kälte“ mit `die Kälte`.","explain":"`die` wird im Genitiv zu `der`.","hints":["Das Nomen ist feminin."]}}},{"id":"genitiv-praep-3","type":"mcq","difficulty":1,"options":["innerhalb einer Woche","außerhalb einer Woche","trotz einer Woche"],"answer":0,"i18n":{"ar":{"prompt":"أي حرف يناسب «خلال مدة أسبوع واحد»؟","explain":"innerhalb تدل على داخل النطاق. außerhalb خارجه، وtrotz تعطي معنى التنازل.","hints":["المطلوب مدة يقع الحدث داخلها."]},"de":{"prompt":"Welche Präposition passt zu „im Zeitraum einer Woche“?","explain":"`innerhalb` bedeutet „im Rahmen von“, `außerhalb` „außerhalb davon“, `trotz` drückt einen Gegensatz aus.","hints":["Gesucht ist ein Zeitraum, in dem etwas passiert."]}}},{"id":"genitiv-praep-4","type":"cloze","difficulty":2,"text":"während {{1}} (der Kurs) · außerhalb {{2}} (die Stadt)","blanks":[["des Kurses"],["der Stadt"]],"i18n":{"ar":{"prompt":"أكمل جينيتيف الزمن والمكان.","explain":"نكتب des Kurses بالمذكر وder Stadt بالمؤنث.","hints":["راجع العلامة على الاسم المذكر وحده."]},"de":{"prompt":"Ergänze den Genitiv für Zeit und Ort.","explain":"Wir schreiben `des Kurses` (maskulin) und `der Stadt` (feminin).","hints":["Nur das maskuline Nomen bekommt eine Endung."]}}},{"id":"genitiv-praep-5","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"ما نوع während في während der Kurs läuft؟","explain":"بعد während هنا جملة بفاعل der Kurs وفعل läuft. مع الاسم وحده تقول während des Kurses.","hints":["انظر إلى الفعل المصرف آخر التركيب."],"options":["رابط يبدأ جملة تابعة.","حرف جر يطلب جينيتيف المذكر.","ظرف يشغل الموقع الثاني."]},"de":{"prompt":"Was für ein Wort ist `während` in `während der Kurs läuft`?","explain":"Nach `während` folgt hier ein Satz mit dem Subjekt `der Kurs` und dem Verb `läuft`. Nur mit Nomen sagst du `während des Kurses`.","hints":["Schau auf das konjugierte Verb am Ende."],"options":["Eine Konjunktion, die einen Nebensatz einleitet.","Eine Präposition mit Genitiv maskulin.","Ein Adverb auf Position 2."]}}},{"id":"genitiv-praep-6","type":"order","difficulty":2,"items":["Trotz","des Regens","spielen","wir","draußen."],"i18n":{"ar":{"prompt":"رتّب الجملة واجعل المجموعة المبدوءة بـ Trotz أولًا.","explain":"بعد Trotz des Regens يأتي الفعل spielen ثم الفاعل wir.","hints":["تحتل مجموعة الجر الأولى موقعًا واحدًا."]},"de":{"prompt":"Ordne den Satz und stell die Gruppe mit `Trotz` an den Anfang.","explain":"Nach `Trotz des Regens` kommt das Verb `spielen`, dann das Subjekt `wir`.","hints":["Die Präpositionalgruppe vorne besetzt eine Position."]}}},{"id":"genitiv-praep-7","type":"text","difficulty":3,"answer":"Statt eines Briefes schicke ich eine E-Mail.","i18n":{"ar":{"prompt":"اكتب «بدلًا من رسالة، أرسل بريدًا إلكترونيًا» وابدأ بـ Statt. استعمل der Brief.","explain":"eines Briefes مجموعة جينيتيف للمذكر. يأتي schicke بعد المجموعة مباشرة.","hints":["استعمل جينيتيف النكرة بعد Statt."]},"de":{"prompt":"Schreib „Statt eines Briefes schicke ich eine E-Mail“ – beginne mit `Statt` und benutze `der Brief`.","explain":"`eines Briefes` ist eine Genitivgruppe maskulin. `schicke` folgt direkt nach der Gruppe.","hints":["Benutze nach `Statt` den unbestimmten Genitiv."]}}},{"id":"genitiv-praep-8","type":"text","difficulty":3,"answer":"wegen des Umzugs","context":"wegen dem Umzug","i18n":{"ar":{"prompt":"أعد الكتابة بالجينيتيف وبيّن كيف تغيّرت الأداة والاسم.","explain":"في الصيغة المعيارية المستهدفة، اختر `des` وأضف `-s` إلى `Umzug`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Schreib den Ausdruck im Genitiv und zeig, wie sich Artikel und Nomen ändern.","explain":"In der Standardform, die wir hier üben, wählst du `des` und hängst `-s` an `Umzug` an.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"genitiv-praep-9","type":"text","difficulty":2,"answer":"`innerhalb eines Monats`. الحرف يطلب الجينيتيف، و`Monat` مذكر.","i18n":{"ar":{"prompt":"أي تركيب يدل على الزمن داخل مدة شهر؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"Welche Struktur bedeutet „im Zeitraum eines Monats“?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"lokale-praep","level":"B1.1","island":"nomen-kasus","order":3,"prereqs":[],"emoji":"🗺️","german":"um … herum · an … entlang","source":{"lektion":3,"kind":"sample"},"pattern":["um + Akkusativ + herum","·","an + Dativ + entlang"],"frames":[{"k":"main","parts":[["vf","Wir"],["v","gehen"],["c","um"],["mf","die Kirche"],["c","herum"]]},{"k":"main","parts":[["vf","Wir"],["v","gehen"],["c","am"],["mf","Fluss"],["c","entlang"]]}],"example":"Wir gehen um die Kirche herum. · Wir gehen am Fluss entlang.","stepExamples":["um … herum","um den Park herum · um das Haus herum","an der Mauer entlang · an dem Fluss entlang","Wir radeln am Kanal entlang."],"pitfallPair":"Wir gehen an den Fluss entlang. → Wir gehen am Fluss entlang.","links":["https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=2","https://www.telc.net/fileadmin/user_upload/Downloads_Verlag/Auf_jeden_Fall/Probekapitel/V01-4011-WPK-BAE00_Auf_jeden_Fall_B1.1_Probekapitel_Web.pdf#page=13"],"i18n":{"ar":{"title":"الحركة حول مكان أو بمحاذاته","lead":"تخيّل خط سيرك على خريطة. إذا كان المسار يلتف حول شيء فلك تركيب، وإذا تابع امتداد جدار أو نهر فلك تركيب آخر.","translation":"نمشي حول الكنيسة · نمشي بمحاذاة النهر.","steps":[{"text":"اختر العلاقة المكانية أولًا","why":"تأتي `um` قبل الاسم و`herum` بعده. تخيّل خط سير يمر حول المعلم، مثل `um den Park herum`."},{"text":"ضع الاسم بعد um في الأكوزاتيف","why":"في المذكر يتحول `der Park` إلى `den Park`. في المحايد تبقى `das` ظاهريًا كما هي، لكنها هنا في حالة الأكوزاتيف."},{"text":"استعمل an … entlang للمحاذاة","why":"هنا نضع المجموعة في الداتيف. تظهر `der` مع `Mauer` المؤنث و`dem` مع `Fluss` المذكر. يُختصر `an dem` غالبًا إلى `am`."},{"text":"افحص التركيب كله قبل تخمين الحالة","why":"في الجملة حركة فعلية، ومع ذلك يستعمل هذا التركيب الداتيف. إذا استعملت `entlang` وحدها بعد الاسم ترى تركيبًا آخر مثل `den Kanal entlang` بالأكوزاتيف. في تمارين هذا الدرس استعمل التركيب المزدوج المطلوب."}],"explain":["جرّب أن تصف خطّين مختلفين حول المعلم نفسه. في `um das Gebäude herum` تلتف حول المبنى. في `an dem Gebäude entlang` تسير بمحاذاته. عندما تدخل صفةً تستمر قاعدة الحالة، فتقول `um den alten Park herum` و`an der alten Mauer entlang`."],"pitfall":"مع تركيب `an … entlang` تحتاج داتيف المذكر `an dem Fluss`، أي `am Fluss`.","recall":["ما حالة الاسم في `um die Bäume herum`؟","الأكوزاتيف. أداة الجمع `die` تظهر بالشكل نفسه في الرفع والأكوزاتيف."],"linkTitles":["فهرس قواعد الوحدة 3 · telc، ص 2","شرح القواعد، ص 35 من الكتاب · telc"]},"de":{"title":"um … herum · an … entlang","lead":"Stell dir deinen Weg auf einer Karte vor. Führt der Weg um etwas herum, gibt es eine Struktur dafür – folgt er einer Mauer oder einem Fluss, eine andere.","steps":[{"text":"Wähle zuerst die räumliche Beziehung","why":"`um` steht vor dem Nomen, `herum` danach. Stell dir einen Weg vor, der um den Ort herumführt, z. B. `um den Park herum`."},{"text":"Setz das Nomen nach um in den Akkusativ","why":"Beim Maskulinum wird `der Park` zu `den Park`. Beim Neutrum sieht `das` gleich aus, steht hier aber im Akkusativ."},{"text":"Benutze an … entlang für „parallel daneben“","why":"Hier steht die Gruppe im Dativ: `der` bei `Mauer` (feminin), `dem` bei `Fluss` (maskulin). `an dem` wird oft zu `am` verkürzt."},{"text":"Prüfe die ganze Struktur, bevor du den Kasus rätst","why":"Der Satz beschreibt eine Bewegung – trotzdem verlangt diese Struktur den Dativ. Steht `entlang` allein nach dem Nomen, ist es eine andere Struktur, z. B. `den Kanal entlang` mit Akkusativ. In dieser Lektion übst du die Doppelstruktur."}],"explain":["Beschreib zwei verschiedene Wege am selben Ort: Mit `um das Gebäude herum` gehst du um das Gebäude, mit `an dem Gebäude entlang` gehst du daran vorbei. Kommt ein Adjektiv dazu, bleibt die Kasusregel gleich: `um den alten Park herum` und `an der alten Mauer entlang`."],"pitfall":"Bei `an … entlang` brauchst du den Dativ maskulin `an dem Fluss`, also `am Fluss`.","recall":["In welchem Kasus steht das Nomen in `um die Bäume herum`?","Im Akkusativ. Der Pluralartikel `die` sieht im Nominativ und Akkusativ gleich aus."],"linkTitles":["Grammatikübersicht Lektion 3 · telc, S. 2","Grammatikerklärung, S. 35 im Buch · telc"]}},"questions":[{"id":"lokale-praep-1","type":"cloze","difficulty":1,"text":"Wir gehen um {{1}} Park herum.","blanks":[["den"]],"i18n":{"ar":{"prompt":"أكمل مسارًا يلتف حول الحديقة.","explain":"um … herum يأخذ الأكوزاتيف، والمذكر المحدد فيه den.","hints":["انظر إلى الأداة للمذكر بعد um."]},"de":{"prompt":"Ergänze einen Weg, der um den Park herumführt.","explain":"`um … herum` verlangt den Akkusativ, der bestimmte Artikel maskulin ist dort `den`.","hints":["Schau auf den maskulinen Artikel nach `um`."]}}},{"id":"lokale-praep-2","type":"cloze","difficulty":1,"text":"Wir gehen an {{1}} Mauer entlang.","blanks":[["der"]],"i18n":{"ar":{"prompt":"أكمل بمحاذاة الجدار.","explain":"تأخذ المجموعة الداتيف. أداة المؤنث في الداتيف der.","hints":["Mauer مؤنث. حدّد الحالة مع an … entlang."]},"de":{"prompt":"Ergänze: an der Mauer entlang.","explain":"Die Gruppe steht im Dativ. Der feminine Artikel im Dativ ist `der`.","hints":["`Mauer` ist feminin. Bestimme den Kasus bei `an … entlang`."]}}},{"id":"lokale-praep-3","type":"mcq","difficulty":1,"options":["am Fluss entlang","um den Fluss herum","vom Fluss weg"],"answer":0,"i18n":{"ar":{"prompt":"أي تركيب يعني السير بمحاذاة النهر؟","explain":"an … entlang يدل على المحاذاة. um … herum يدل على الالتفاف، وvon … weg على الابتعاد.","hints":["تخيّل السير على خط موازٍ للنهر."]},"de":{"prompt":"Welche Struktur bedeutet, am Fluss entlangzugehen?","explain":"`an … entlang` bedeutet „parallel daneben“. `um … herum` heißt „rundherum“, `von … weg` „weg von“.","hints":["Stell dir einen Weg parallel zum Fluss vor."]}}},{"id":"lokale-praep-4","type":"cloze","difficulty":2,"text":"um {{1}} alte Brücke herum · an {{2}} alten Gebäude entlang","blanks":[["die"],["dem"]],"i18n":{"ar":{"prompt":"أكمل أداة الجسر ثم أداة المبنى.","explain":"Brücke مؤنث في الأكوزاتيف فتأخذ die. Gebäude محايد في الداتيف فيأخذ dem.","hints":["افصل حكم um عن حكم an … entlang."]},"de":{"prompt":"Ergänze den Artikel für die Brücke und dann für das Gebäude.","explain":"`Brücke` ist feminin im Akkusativ, also `die`. `Gebäude` ist neutral im Dativ, also `dem`.","hints":["Trenne die Regel für `um` von der Regel für `an … entlang`."]}}},{"id":"lokale-praep-5","type":"order","difficulty":2,"items":["Wir","gehen","um","das Haus","herum."],"i18n":{"ar":{"prompt":"رتّب الجملة وابدأ بـ Wir ثم الفعل. المسار حول المنزل.","explain":"تأتي um قبل الاسم وherum بعده. Haus في الأكوزاتيف.","hints":["ضع كل جزء من حرف الجر في جهة من المجموعة."]},"de":{"prompt":"Ordne den Satz und beginne mit `Wir` und dem Verb. Der Weg führt um das Haus.","explain":"`um` steht vor dem Nomen, `herum` danach. `Haus` steht im Akkusativ.","hints":["Setz jeden Teil der Präposition auf eine Seite der Gruppe."]}}},{"id":"lokale-praep-6","type":"mcq","difficulty":2,"answer":0,"i18n":{"ar":{"prompt":"في am Kanal entlang لماذا جاءت am رغم وجود حركة؟","explain":"am تساوي an dem. الداتيف تحدده الصيغة المزدوجة.","hints":["فكّ الاختصار am."],"options":["التركيب an … entlang يطلب الداتيف.","الحركة هنا تتطلب الأكوزاتيف، وam هو أكوزاتيف.","Kanal محايد ولذلك لا تتغير الأداة."]},"de":{"prompt":"Warum steht in `am Kanal entlang` `am`, obwohl es eine Bewegung gibt?","explain":"`am` = `an dem`. Den Dativ bestimmt die Doppelstruktur.","hints":["Löse die Kurzform `am` auf."],"options":["Die Struktur `an … entlang` verlangt den Dativ.","Die Bewegung verlangt hier den Akkusativ, und `am` ist Akkusativ.","`Kanal` ist neutral, deshalb ändert sich der Artikel nicht."]}}},{"id":"lokale-praep-7","type":"text","difficulty":3,"answer":"Wir radeln um den Park herum. Wir radeln am Fluss entlang.","i18n":{"ar":{"prompt":"اكتب جملتين تبدأان بـ Wir radeln. في الأولى حول الحديقة der Park، وفي الثانية بمحاذاة النهر der Fluss.","explain":"den Park مع um … herum. وam Fluss اختصار an dem Fluss مع an … entlang.","hints":["استعمل الأكوزاتيف مع الالتفاف والداتيف مع المحاذاة."]},"de":{"prompt":"Schreib zwei Sätze, die mit `Wir radeln` beginnen: im ersten um den Park (`der Park`), im zweiten am Fluss entlang (`der Fluss`).","explain":"`den Park` mit `um … herum`, und `am Fluss` als Kurzform von `an dem Fluss` mit `an … entlang`.","hints":["Akkusativ für „rundherum“, Dativ für „entlang“."]}}},{"id":"lokale-praep-8","type":"text","difficulty":3,"answer":"Wir gehen am Fluss entlang.","context":"Wir gehen an den Fluss entlang.","i18n":{"ar":{"prompt":"صحّح الخطأ في المثال واشرح سبب التصحيح.","explain":"مع تركيب `an … entlang` تحتاج داتيف المذكر `an dem Fluss`، أي `am Fluss`.","hints":["راجع العلاقة بين عناصر الجملة. حدّد أي جزء من القاعدة ينطبق على هذا المثال."]},"de":{"prompt":"Korrigiere den Fehler im Beispiel und erkläre, warum.","explain":"Bei `an … entlang` brauchst du den Dativ maskulin `an dem Fluss`, also `am Fluss`.","hints":["Prüf die Beziehung zwischen den Satzteilen. Welcher Teil der Regel gilt für dieses Beispiel?"]}}},{"id":"lokale-praep-9","type":"text","difficulty":2,"answer":"الأكوزاتيف. أداة الجمع `die` تظهر بالشكل نفسه في الرفع والأكوزاتيف.","i18n":{"ar":{"prompt":"ما حالة الاسم في `um die Bäume herum`؟","explain":"قارن سبب اختيارك بما ورد في الحل، وانتبه إلى الحالة أو المعنى أو ترتيب الفعل بحسب السؤال.","hints":["سمِّ أولًا القاعدة التي تختبرها الجملة، ثم طبّقها على العنصر المطلوب."]},"de":{"prompt":"In welchem Kasus steht das Nomen in `um die Bäume herum`?","explain":"Vergleiche deine Begründung mit der Lösung und achte – je nach Frage – auf Kasus, Bedeutung oder Verbstellung.","hints":["Nenne zuerst die Regel, die der Satz prüft, und wende sie dann auf das gesuchte Element an."]}}}]},{"id":"n-deklination","level":"B1.2","island":"nomen-kasus","order":4,"prereqs":["genitiv"],"emoji":"🧑‍💼","german":"N-Deklination","source":{"lektion":9,"kind":"toc"},"pattern":["der Kunde","→","den / dem / des Kunden"],"frames":[{"k":"main","parts":[["vf","Der Kunde"],["v","wartet"]]},{"k":"main","parts":[["vf","Ich"],["v","rufe"],["hl","den Kunden"],["ve","an"]]},{"k":"np","parts":[["n","das Auto"],["hl","des Nachbarn"]]}],"example":"Der Kunde wartet. → Ich rufe den Kunden an.","stepExamples":["Der Kunde wartet schon lange.","Ich rufe den Kunden an. · Ich helfe dem Kunden.","der Kollege · der Student · der Polizist · der Praktikant","der Mensch · der Herr · der Nachbar","Wir haben mit vielen Kunden gesprochen."],"pitfallPair":"Ich kenne den Student. → Ich kenne den Studenten.","links":["https://grammis.ids-mannheim.de/progr%40mm/4064","https://grammis.ids-mannheim.de/fragen/28"],"i18n":{"ar":{"title":"أسماء مذكرة تأخذ ‎-n","lead":"معظم الأسماء لا تتغير بعد `den` و`dem`. لكن مجموعة من الأسماء المذكرة، أغلبها للأشخاص، تأخذ `-n` أو `-en` في كل الحالات إلا الفاعل المفرد. ستتعلم كيف تعرفها.","translation":"الزبون ينتظر ← أتصل بالزبون.","steps":[{"text":"في حالة الفاعل لا يتغير الاسم","why":"`der Kunde` فاعل في حالة `Nominativ`، فيبقى كما هو في المعجم."},{"text":"في الحالات الأخرى أضف ‎-n أو ‎-en","why":"في `Akkusativ` و`Dativ` و`Genitiv` يصير `den Kunden` و`dem Kunden` و`des Kunden`. هذه هي علامة هذا التصريف، وم
